<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop · DreamLedger</title>
<meta name="description" content="Horizontal catalogue — swipe silos. NZD. Stripe checkout.">
<meta name="theme-color" content="#080a0e">
<style>
:root{--bg:#080a0e;--panel:#151b22;--line:#27313b;--ink:#f5f3eb;--muted:#8b96a3;--gold:#d8b56b;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(72px + var(--safe))}
a{color:inherit;text-decoration:none}
.hdr{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(8,10,14,.92)}
.brand{font-weight:900;letter-spacing:.06em;font-size:13px}.brand span{color:var(--gold)}
.pill{background:var(--gold);color:#111;font-weight:800;font-size:13px;padding:10px 14px;border-radius:999px}
.hero{padding:24px 16px}.hero h1{font-size:1.8rem;margin-bottom:8px}.hero p{color:var(--muted);font-size:14px}
.rail-block{padding:16px 0}.rail-head{display:flex;justify-content:space-between;padding:0 16px 10px}.rail-head h2{font-size:1.15rem}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tile{flex:0 0 min(78vw,280px);scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;min-height:200px}
.tile h3{font-size:1rem;margin-bottom:6px}.tile p{font-size:12px;color:var(--muted);flex:1}.price{font-size:1.25rem;font-weight:900;color:var(--gold);margin:10px 0}
.tile a{display:flex;align-items:center;justify-content:center;min-height:48px;background:var(--gold);color:#111;font-weight:800;border-radius:10px}
.stick{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe));background:#151b22;border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.stick b{flex:1;font-size:13px}.stick a{background:var(--gold);color:#111;min-height:48px;padding:0 18px;border-radius:999px;font-weight:800;display:inline-flex;align-items:center}
.empty{padding:24px 16px;color:var(--muted)}
</style>
</head>
<body>
<header class="hdr"><a class="brand" href="/">DREAM<span>LEDGER</span></a><a class="pill" href="/buy/COMMANDER-DECK-DIAGNOSTIC-001">Buy · $29</a></header>
<section class="hero"><h1>Swipe the catalogue</h1><p>Thumb-first rails by silo. Live products only.</p></section>
<div id="root"><p class="empty">Loading…</p></div>
<div class="stick"><b>Diagnostic · NZ$29</b><a href="/buy/COMMANDER-DECK-DIAGNOSTIC-001">Buy</a></div>
<script>
(function(){
function esc(v){return String(v==null?'':v).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');}
var order=['mtg','media','dreammeez','commerce','seller_tools','kelplantis','research','other'];
var label={mtg:'Magic',media:'Billboard',dreammeez:'DreamMeez',commerce:'Digital tools',seller_tools:'Seller tools',kelplantis:'Kelplantis',research:'Research',other:'More'};
function siloOf(p){var s=String(p.silo||'').toLowerCase();return label[s]?s:'other';}
fetch('/api/products',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
  var products=(d.products||[]).filter(function(p){return p&&p.status==='published';});
  var groups={};
  products.forEach(function(p){var s=siloOf(p);(groups[s]=groups[s]||[]).push(p);});
  var html='';
  order.forEach(function(s){
    var list=groups[s];if(!list||!list.length)return;
    list.sort(function(a,b){return Number(a.price)-Number(b.price);});
    html+='<section class="rail-block"><div class="rail-head"><h2>'+esc(label[s])+'</h2><span style="color:#65707b;font-size:12px">'+list.length+'</span></div><div class="rail">';
    list.forEach(function(p){
      html+='<article class="tile"><h3>'+esc(p.name)+'</h3><p>'+esc(p.description||'')+'</p><div class="price">NZ$'+esc(p.price)+'</div><a href="/buy/'+encodeURIComponent(p.id)+'">Buy</a></article>';
    });
    html+='</div></section>';
  });
  document.getElementById('root').innerHTML=html||'<p class="empty">No products.</p>';
}).catch(function(){
  document.getElementById('root').innerHTML='<p class="empty"><a href="/buy/COMMANDER-DECK-DIAGNOSTIC-001" style="color:#d8b56b">Buy diagnostic →</a></p>';
});
})();
</script>
</body>
</html>
