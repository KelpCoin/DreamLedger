<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop · DreamLedger</title>
<meta name="description" content="Live DreamLedger catalogue. NZD. Stripe checkout.">
<link rel="canonical" href="https://dreamledger.org/shop.html">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shop.css">
<style>
.hero{padding:36px 0 12px}
.hero h1{font-size:clamp(1.8rem,4vw,2.6rem);margin:8px 0}
.status{font-size:13px;color:var(--muted);margin:12px 0 20px}
.card-media{aspect-ratio:16/10;background:linear-gradient(155deg,#292524,#1c1917)}
.empty{padding:24px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
</style>
</head>
<body>
<header class="hdr"><div class="hdr-inner">
  <a class="brand" href="/">DreamLedger</a>
  <nav class="hdr-nav">
    <a href="/shop.html">Shop</a>
    <a href="/mtg">MTG</a>
    <a href="/billboard">Billboard</a>
    <a href="/login">Log in</a>
    <a class="cta" href="/register">Join</a>
  </nav>
</div></header>

<main class="shell">
  <section class="hero">
    <p class="eyebrow">Live catalogue</p>
    <h1>Shop</h1>
    <p class="muted">Filled from <code>/api/products</code>. Only published offers with checkout. Prefer buy router so payments attribute.</p>
    <p class="status" id="status">Loading…</p>
  </section>
  <section class="grid-3" id="grid" aria-live="polite"></section>
</main>

<footer class="ftr"><div class="shell" style="font-size:13px">
  <a href="/" style="color:#d6d3d1">Home</a> ·
  <a href="/policies.html" style="color:#d6d3d1">Policies</a> ·
  <a href="/api/offers" style="color:#d6d3d1">Offers API</a>
</div></footer>

<script>
(function(){
  const esc=v=>String(v??'').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
  const status=document.getElementById('status');
  const grid=document.getElementById('grid');
  fetch('/api/products',{cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(d=>{
      const products=(d.products||[]).filter(p=>p&&p.status==='published'&&p.checkout_available!==false);
      products.sort((a,b)=>Number(a.price)-Number(b.price));
      status.textContent=products.length+' published products';
      if(!products.length){grid.innerHTML='<div class="empty">No published products.</div>';return;}
      grid.innerHTML=products.map(p=>{
        const href='/buy/'+encodeURIComponent(p.id);
        return '<article class="card"><div class="card-media"></div><div class="card-body">'
          +'<span class="chip live">'+esc(p.silo||'offer')+'</span>'
          +'<h3>'+esc(p.name)+'</h3>'
          +'<p>'+esc(p.description||'')+'</p>'
          +'<div class="card-foot"><span class="price">NZ$'+esc(p.price)+'</span>'
          +'<a class="btn btn-dark" style="min-height:42px;padding:0 14px;font-size:13px" href="'+esc(href)+'">Buy</a>'
          +'</div></div></article>';
      }).join('');
    })
    .catch(()=>{
      status.textContent='Catalogue unavailable';
      grid.innerHTML='<div class="empty">Could not load /api/products.</div>';
    });
})();
</script>
</body>
</html>
