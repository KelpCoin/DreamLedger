<!doctype html>
<html lang="en-NZ"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop · DreamLedger NZ</title>
<style>
:root{--bg:#f7f5ef;--paper:#fffdf8;--ink:#191a17;--muted:#65635c;--line:#ddd8cd;--accent:#5d43d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:auto;padding:0 20px}.top{position:sticky;top:0;background:#f7f5eff2;border-bottom:1px solid var(--line);padding:14px 0}
.top .wrap{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.brand span{color:var(--accent)}
nav{display:flex;gap:14px;font-size:.85rem;font-weight:750;color:var(--muted)}
.hero{padding:48px 0 24px}h1{font-size:clamp(2.2rem,5vw,3.5rem);letter-spacing:-.05em}
.lead{color:var(--muted)}.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:20px 0}
.card{display:flex;flex-direction:column;gap:8px;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--paper);min-height:200px}
.price{font-size:1.35rem;font-weight:900}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 14px;background:var(--ink);color:#fff;border-radius:9px;font-weight:850}
</style></head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="/">Dream<span>Ledger</span></a>
<nav><a href="/">Home</a><a href="/cash.html">From NZ$3.99</a><a href="/mtg/">Magic</a></nav></div></header>
<main class="wrap">
<section class="hero"><h1>Pay for real work.</h1>
<p class="lead">Checkout-ready products only. Lowest price first. Buttons go to Stripe.</p></section>
<div id="products"></div>
</main>
<script>
fetch('/api/products',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  const products=(d.products||[]).filter(p=>p&&p.checkout_available===true).sort((a,b)=>(Number(a.price)||0)-(Number(b.price)||0));
  const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  document.getElementById('products').innerHTML='<div class="rail">'+products.map(p=>'<article class="card"><h3>'+esc(p.name)+'</h3><p style="color:#65635c;flex:1">'+esc((p.description||'').slice(0,140))+'</p><div class="price">NZ$'+esc(Number(p.price||0))+'</div><a class="btn" href="/buy/'+encodeURIComponent(p.id)+'">Pay on Stripe</a></article>').join('')+'</div>';
}).catch(()=>{document.getElementById('products').innerHTML='<p>Products temporarily unavailable.</p>';});
</script>
</body></html>
