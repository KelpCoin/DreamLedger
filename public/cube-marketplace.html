<!doctype html><html><head><meta charset="utf-8"><title>Marketplace</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui,sans-serif;margin:0;background:#0b0e13;color:#fff}main{max-width:1100px;margin:auto;padding:48px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#151a22;border:1px solid #2a3340;border-radius:16px;padding:18px}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#222b38;margin:3px}.price{font-size:1.6rem;font-weight:700}a{color:#9fd3ff;text-decoration:none}</style></head><body><main><h1>Marketplace</h1><p>A single B2B marketplace for independent sellers and specialist markets.</p><div id="silos" class="grid"></div><h2>Live catalog</h2><div id="catalog" class="grid"></div></main><script>Promise.all([fetch('/api/worlds?limit=24&offset=0').then(r=>r.json()),fetch('/api/marketplace').then(r=>r.json())]).then(([s,c])=>{document.getElementById('silos').innerHTML=(s.items||[]).map(x=>`<div class="card"><h3>${x.label||'Market'}</h3><p><span class="pill">${x.inventory_mode||'Specialist market'}</span></p><a href="${x.public_url||'#'}">Open market</a></div>`).join('');document.getElementById('catalog').innerHTML=(c.items||[]).map(x=>`<div class="card"><div class="pill">${x.market_name||x.source_name||'Specialist market'}</div><h3>${x.title}</h3><p>${x.description||''}</p><div class="price">NZ${Number(x.price_nzd).toFixed(2)}</div><p>${x.seller_name||'Marketplace seller'}</p><p><a href="/product/${encodeURIComponent(x.product_id)}">View offer</a></p></div>`).join('')||'<div class="card">No public marketplace listings yet. Supply onboarding is open.</div>'}).catch(e=>{document.body.innerHTML+='<pre>'+e+'</pre>'})</script></body></html>
