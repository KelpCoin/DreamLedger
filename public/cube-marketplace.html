<!doctype html><html><head><meta charset="utf-8"><title>Marketplace</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui,sans-serif;margin:0;background:#0b0e13;color:#fff}main{max-width:1100px;margin:auto;padding:48px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#151a22;border:1px solid #2a3340;border-radius:16px;padding:18px}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#222b38;margin:3px}.price{font-size:1.6rem;font-weight:700}a{color:#9fd3ff;text-decoration:none}</style></head><body><main><h1>Marketplace</h1><p>A single B2B marketplace for independent sellers and specialist markets.</p><div id="silos" class="grid"></div><h2>Live catalog</h2><div id="catalog" class="grid"></div></main><script>
"use strict";
// The canonical Vercel dispatcher exposes the two exact allowlisted CUBE routes.
const el = (tag, value, cls) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (value != null) node.textContent = String(value);
  return node;
};
const localRoute = route => {
  if (typeof route !== "string" || !/^\/[a-z0-9][a-z0-9/_-]{0,120}$/i.test(route)) return null;
  return route;
};
const list = (root, items, render, empty) => {
  root.replaceChildren();
  if (!Array.isArray(items) || items.length === 0) {
    root.appendChild(el("p", empty, "card"));
    return;
  }
  for (const item of items.slice(0, 24)) root.appendChild(render(item));
};
async function loadSilos() {
  const root = document.getElementById("silos");
  try {
    const response = await fetch("/api/cube/silos", {cache:"no-store"});
    if (!response.ok) throw new Error("CUBE_SILO_ENDPOINT_UNAVAILABLE");
    const data = await response.json();
    if (data.schema !== "CUBE/SILO-REGISTRY/v1") throw new Error("UNEXPECTED_SILO_SCHEMA");
    list(root, data.silos, silo => {
      const card = el("article", null, "card");
      card.appendChild(el("h3", silo.label || "Market"));
      card.appendChild(el("p", silo.inventory_mode || "Specialist market", "pill"));
      const route = localRoute(silo.route);
      if (route) {
        const link = el("a", "Open market");
        link.href = route;
        card.appendChild(link);
      } else card.appendChild(el("p", "Market route not confirmed."));
      return card;
    }, "No market directories are verified yet.");
  } catch {
    list(root, [], null, "Market directories unavailable. Please retry later.");
  }
}
async function loadCatalog() {
  const root = document.getElementById("catalog");
  try {
    const response = await fetch("/api/cube/marketplace", {cache:"no-store"});
    if (!response.ok) throw new Error("CUBE_CATALOG_ENDPOINT_UNAVAILABLE");
    const data = await response.json();
    if (data.schema !== "CUBE/B2B-MARKETPLACE/v1") throw new Error("UNEXPECTED_CATALOG_SCHEMA");
    list(root, data.items, item => {
      const card = el("article", null, "card");
      card.appendChild(el("p", item.market_name || item.source_name || "Specialist market", "pill"));
      card.appendChild(el("h3", item.title || "Listing"));
      card.appendChild(el("p", item.description || "Details not confirmed."));
      const price = Number(item.price_nzd);
      card.appendChild(el("div", Number.isFinite(price) && price >= 0 && item.price_nzd != null
        ? "NZ$" + price.toFixed(2) : "Price not confirmed", "price"));
      card.appendChild(el("p", item.seller_name || "Seller not confirmed."));
      if (typeof item.product_id === "string" && /^[a-z0-9_.:-]{1,128}$/i.test(item.product_id)) {
        const link = el("a", "View offer");
        link.href = "/product/" + encodeURIComponent(item.product_id);
        card.appendChild(link);
      }
      return card;
    }, "No verified public marketplace listings. No purchase is implied.");
  } catch {
    list(root, [], null, "Marketplace catalog unavailable. No live listings can be verified.");
  }
}
void Promise.allSettled([loadSilos(), loadCatalog()]);
</script></body></html>
