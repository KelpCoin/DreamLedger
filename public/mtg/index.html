<!doctype html>
<html lang="en-NZ" data-silo="mtg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magic · See the cards | DreamLedger NZ</title>
<meta name="description" content="NZ Magic marketplace. List singles free. See the cards, then deal.">
<link rel="stylesheet" href="/assets/silo-master.css">
<style>
:root{--silo-accent:#d8b56b;--silo-accent-bright:#e8c87a}
.hero{padding:40px 0 16px}.grid{display:grid;gap:14px}@media(min-width:700px){.grid{grid-template-columns:1fr 1fr 1fr}}
.deck{background:var(--silo-surface);border:1px solid var(--silo-line);border-radius:16px;padding:16px}
.deck h3{font-family:var(--silo-serif);font-weight:400;margin:0 0 8px}
.price{font-size:1.4rem;font-weight:800}
.status-bar{padding:12px;border-radius:12px;background:var(--silo-surface);border:1px solid var(--silo-line);color:var(--silo-muted);margin-bottom:14px}
</style>
</head>
<body class="silo-body">
<header class="silo-hdr"><div class="silo-hdr-inner">
<a class="silo-logo" href="/mtg/">Dream<em>Ledger</em> · Magic</a>
<nav class="silo-nav"><a href="/mtg-list">Sell single</a><a href="/cash.html">Buy</a><a class="silo-cta" href="/mtg-list">List free</a></nav>
</div></header>
<main class="silo-wrap">
<section class="hero">
<p class="silo-eyebrow">Magic · New Zealand</p>
<h1 class="silo-display">See the cards.<br>Then deal.</h1>
<p class="silo-lead">List singles free. Open decks for the full list. Confirm before you pay.</p>
<div class="silo-actions">
<a class="silo-btn silo-btn-gold" href="/mtg-list">Sell a single</a>
<a class="silo-btn silo-btn-ghost" href="#decks">Browse decks</a>
<span class="silo-btn silo-btn-line" aria-disabled="true">Diagnostic currently held</span>
</div>
</section>
<section class="silo-section" id="decks">
<h2 class="silo-h2">Decks for sale</h2>
<div id="status" class="status-bar">Loading…</div>
<div id="grid" class="grid"></div>
</section>
</main>
<script>
fetch('/data/mtg-catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Catalogue unavailable');return r.json()}).then(d=>{
  const decks=(d.products||[]).filter(p=>p.category==='commander-deck'||/^EDH/i.test(p.id||''));
  const status=document.getElementById('status'), grid=document.getElementById('grid');
  const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  if(!decks.length){status.textContent='No verified decks listed. Sell a single free.';return;}
  status.textContent=decks.length+' deck(s)';
  grid.innerHTML=decks.map(p=>'<article class="deck"><h3>'+esc(p.name)+'</h3><p style="color:var(--silo-muted);font-size:13px">'+esc(p.description||'')+'</p><div class="price">NZ$'+esc(p.price)+'</div><a class="silo-btn silo-btn-gold" style="margin-top:10px" href="'+esc(p.detail_url||'/mtg/')+'">See cards</a></article>').join('');
}).catch(e=>{document.getElementById('status').textContent=e.message;});
</script>
</body></html>
