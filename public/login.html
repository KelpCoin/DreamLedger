<!doctype html>
<html lang="en-NZ" data-surface="store-v2-auth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in · DreamLedger</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f7;--ink:#14120f;--muted:#6b6560;--line:#e8e4de;--card:#fff;--dark:#14120f;--err:#b91c1c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
a{color:inherit;text-decoration:none}
.hdr{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line)}
.brand{font-family:"Instrument Serif",serif;font-size:1.25rem}
main{max-width:400px;margin:48px auto;padding:0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
h1{font-family:"Instrument Serif",serif;font-size:1.75rem;font-weight:400;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:22px}
label{display:block;font-size:12px;font-weight:700;margin:0 0 6px}
input{width:100%;height:48px;padding:0 14px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}
button{width:100%;height:48px;border:0;border-radius:999px;background:var(--dark);color:#fff;font-weight:700;font:inherit;cursor:pointer}
.err{color:var(--err);font-size:13px;margin-top:12px;min-height:1.2em}
.sw{margin-top:18px;font-size:13px;color:var(--muted)}
.sw a{font-weight:700;text-decoration:underline;color:var(--ink)}
</style>
</head>
<body>
<header class="hdr">
  <a class="brand" href="/">DreamLedger</a>
  <a href="/register" style="font-size:13px;font-weight:700">Join</a>
</header>
<main>
  <div class="card">
    <h1>Log in</h1>
    <p class="sub">Email and password.</p>
    <form id="f">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password">
      <button type="submit">Log in</button>
      <div id="msg" class="err" role="alert"></div>
    </form>
    <p class="sw">No account? <a href="/register">Join free</a></p>
  </div>
</main>
<script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();msg.textContent='';try{const r=await fetch('/api/account/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Login failed');location.href=d.next||'/avatar.html'}catch(x){msg.textContent=x.message}};
</script>
</body>
</html>
