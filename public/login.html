<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in · DreamLedger</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f5;--card:#fff;--text:#09090b;--muted:#71717a;--line:#e4e4e7;--brand:#18181b;--err:#b91c1c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit;text-decoration:none}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800}
main{max-width:400px;margin:48px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
h1{font-size:1.35rem;font-weight:800;margin-bottom:6px}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:20px}
label{display:block;font-size:.8rem;font-weight:700;margin:12px 0 6px}
input{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;font:inherit}
button{width:100%;height:46px;margin-top:18px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font:inherit;cursor:pointer}
.msg{margin-top:12px;font-size:.875rem}
.msg.err{color:var(--err)}
.switch{margin-top:16px;font-size:.875rem;color:var(--muted)}
.switch a{font-weight:700;text-decoration:underline;color:var(--text)}
</style>
</head>
<body>
<header>
  <a class="logo" href="/">DreamLedger</a>
  <a href="/register" style="font-weight:600;font-size:.875rem">Sign up</a>
</header>
<main>
  <div class="card">
    <h1>Log in</h1>
    <p class="sub">Use your account email and password.</p>
    <form id="f">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
      <div id="msg" class="msg"></div>
    </form>
    <p class="switch">No account? <a href="/register">Sign up</a></p>
  </div>
</main>
<script>
document.getElementById('f').onsubmit=async(e)=>{e.preventDefault();const m=document.getElementById('msg');m.textContent='';m.className='msg';try{const r=await fetch('/api/account/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Login failed');location.href=d.next||'/avatar.html'}catch(x){m.className='msg err';m.textContent=x.message}};
</script>
</body>
</html>
