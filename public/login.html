<!doctype html>
<html lang="en-NZ" data-surface="prod-v5-auth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in · DreamLedger</title>
<style>
:root{--bg:#09090b;--elev:#121216;--line:#27272a;--text:#fafafa;--muted:#a1a1aa;--dim:#71717a;--err:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit;text-decoration:none}
.hdr{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:15px}
.hdr a.nav{font-size:13px;font-weight:600;color:var(--muted)}
main{max-width:400px;margin:48px auto;padding:0 20px}
.card{background:var(--elev);border:1px solid var(--line);border-radius:12px;padding:28px}
h1{font-size:20px;font-weight:700;letter-spacing:-.03em;margin-bottom:6px}
.sub{font-size:14px;color:var(--muted);margin-bottom:22px}
label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin:0 0 6px}
input{width:100%;height:44px;padding:0 12px;margin-bottom:14px;border:1px solid var(--line);border-radius:8px;background:#0c0c0e;color:var(--text);font:inherit}
input:focus{outline:2px solid #3b82f6;outline-offset:1px;border-color:transparent}
button{width:100%;height:44px;border:0;border-radius:8px;background:#fafafa;color:#09090b;font-weight:700;font:inherit;cursor:pointer}
button:hover{background:#e4e4e7}
.err{color:var(--err);font-size:13px;margin-top:12px;min-height:1.2em}
.sw{margin-top:18px;font-size:13px;color:var(--muted)}
.sw a{font-weight:600;color:var(--text);text-decoration:underline}
</style>
</head>
<body>
<header class="hdr">
  <a class="brand" href="/">DreamLedger</a>
  <a class="nav" href="/register">Sign up</a>
</header>
<main>
  <div class="card">
    <h1>Log in</h1>
    <p class="sub">Enter your email and password.</p>
    <form id="f">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
      <div id="msg" class="err" role="alert"></div>
    </form>
    <p class="sw">No account? <a href="/register">Sign up</a></p>
  </div>
</main>
<script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();msg.textContent='';try{const r=await fetch('/api/account/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Login failed');location.href=d.next||'/avatar.html'}catch(x){msg.textContent=x.message}};
</script>
</body>
</html>
