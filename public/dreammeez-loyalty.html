<!doctype html><html><head><meta charset="utf-8"><title>DreamMeez Streak</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui,sans-serif;background:#0b0e13;color:#fff;margin:0}main{max-width:720px;margin:auto;padding:48px 20px}.card{background:#171c24;border:1px solid #2b3442;border-radius:18px;padding:24px}.bar{height:14px;background:#252d38;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#9fd3ff}.reward{font-size:1.6rem;font-weight:700}button{padding:12px 18px;border:0;border-radius:10px;cursor:pointer}</style></head><body><main><div class="card"><h1>DreamMeez Daily Streak</h1><p>Check in daily. Keep your best streak. Earn transparent discounts at 7, 14 and 30 days.</p><div class="bar"><div class="fill" id="fill"></div></div><p id="days">Sign in to see your streak.</p><button id="checkin">Check in</button><p id="reward" class="reward"></p></div></main><script>document.getElementById('checkin').onclick=async()=>{const userId=window.DREAMMEEZ_USER_ID;if(!userId){document.getElementById('reward').textContent='Sign in first.';return}const r=await fetch('/api/dreammeez/checkin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user_id:userId})});const d=await r.json();document.getElementById('days').textContent='Current streak: '+(d.current_days||0)+' days. Best: '+(d.best_days||0)+'.';document.getElementById('fill').style.width=Math.min(100,((d.current_days||0)%30)/30*100)+'%';document.getElementById('reward').textContent=d.reward?('Reward earned: '+d.reward.discount_percent+'% off, code '+d.reward.code):''};</script></body></html>
