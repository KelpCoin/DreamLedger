<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Phin Haven | The First Garden</title><style>:root{--b:#08110c;--p:#13241b;--l:#31503d;--t:#edf5ee;--m:#9eb5a5;--g:#78d399;--y:#d9b35a;--r:#d45b52;--v:#b78fe0}*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 0,#1b3929,var(--b) 68%);color:var(--t);font:13px Georgia,serif;overflow:hidden}#app{height:100%;display:flex;flex-direction:column}header{padding:10px 13px 7px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between}h1{margin:0;color:var(--g);font-size:16px;letter-spacing:.12em;text-transform:uppercase}.scene{color:var(--m);font-size:11px;text-transform:uppercase}.main{flex:1;min-height:0;display:flex;flex-direction:column;padding:7px;gap:7px}.stage{flex:1;min-height:220px;display:flex;align-items:center;justify-content:center}.stage canvas{width:min(100%,620px);height:auto;aspect-ratio:4/3;border:1px solid var(--l);border-radius:11px;background:#102017}button{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--l);border-radius:9px;padding:9px 12px;touch-action:manipulation}button.primary{background:var(--g);color:#07110b;border-color:#9ce5b4;font-weight:bold}.hud{border-top:1px solid var(--l);padding-top:7px;display:flex;flex-direction:column;gap:7px}.row{display:flex;gap:7px;align-items:center}.stat{flex:1}.small{font-size:10px;color:var(--m);display:flex;justify-content:space-between}.bar{height:8px;border:1px solid #3b241f;background:#20120f;border-radius:5px;overflow:hidden}.fill{height:100%;background:var(--g)}.xp{height:5px;background:#1d293f}.xp .fill{background:#8baaf5}.controls{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,40px);gap:4px}.controls button{padding:0;font-size:17px}.inv{display:flex;gap:5px;overflow:auto;flex:1}.item{min-width:62px;height:48px;border:1px solid var(--l);border-radius:8px;background:var(--p);font-size:9px;color:var(--m);text-align:center;padding:5px}.item.eq{border-color:var(--y);color:var(--y)}.avatar{min-width:155px;border:1px solid var(--l);border-radius:8px;padding:6px;background:#0d1912}.avatar b{color:var(--g)}.avatar span{display:block;color:var(--m);font-size:10px;margin-top:2px}.modal{position:fixed;inset:0;background:#06100bdd;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.open{display:flex}.card{width:min(360px,100%);background:var(--p);border:1px solid var(--l);border-radius:13px;padding:18px}.card h2{margin:0 0 8px;color:var(--g)}.card p{color:var(--m);line-height:1.45}.toast{position:fixed;top:55px;left:50%;transform:translateX(-50%);background:#0b1610ee;color:var(--y);border:1px solid var(--y);padding:7px 12px;border-radius:8px;opacity:0;transition:.2s;z-index:9;max-width:90%;text-align:center}.toast.show{opacity:1}</style></head><body><div id="app"><header><h1>Phin Haven</h1><span id="scene" class="scene">The First Garden</span></header><div class="main"><div class="stage"><canvas id="world" width="480" height="360"></canvas></div><div class="hud"><div class="row"><div class="stat"><div class="small"><span id="name">Wanderer</span><span id="lvl">Lv.1</span></div><div class="bar"><div id="hp" class="fill" style="width:100%"></div></div><div class="bar xp"><div id="xp" class="fill" style="width:0%"></div></div></div><button id="sync">Sync</button><button id="new">New</button></div><div class="row"><div class="controls"><i></i><button data-d="0,-1">▲</button><i></i><button data-d="-1,0">◀</button><button id="act">●</button><button data-d="1,0">▶</button><i></i><button data-d="0,1">▼</button><i></i></div><div id="inventory" class="inv"></div><div id="avatar" class="avatar"><b>DreamMeez</b><span>checking link...</span></div></div></div></div></div><div id="identity" class="modal open"><div class="card"><h2>Enter the First Garden</h2><p>This creates a playable character immediately. An authenticated DreamMeez session is bridged automatically when available.</p><input id="charname" maxlength="18" placeholder="Character name" style="width:100%;padding:10px;margin-bottom:9px;border-radius:8px;border:1px solid var(--l);background:#09110d;color:var(--t)"><button class="primary" id="enter" style="width:100%">Enter Phin Haven</button></div></div><div id="combat" class="modal"><div class="card"><h2 id="enemy">Encounter</h2><div class="small"><span>Enemy</span><span id="enemyhp">100%</span></div><div class="bar"><div id="ehp" class="fill" style="width:100%;background:var(--r)"></div></div><p id="log">The path is blocked.</p><div class="row"><button id="attack" class="primary">Attack</button><button id="flee">Flee</button></div></div></div><div id="toast" class="toast"></div><script>
const URL="https://wbwgroygjeyukkspnqiy.supabase.co",KEY="sb_publishable_O5JRD67KaU3SA9dFq-JIuQ_Pzs8pedj",TK="phin_haven:v5:token";let p=null,t=null,a=null,g=null,w=null,pres=[];const $=x=>document.getElementById(x);async function rpc(n,x){let r=await fetch(`${URL}/rest/v1/rpc/${n}`,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:`Bearer ${KEY}`},body:JSON.stringify(x)});if(!r.ok)throw Error(n+":"+r.status);return r.json()}async function getT(){try{let r=await window.storage.get(TK);return r?.value||null}catch(e){return null}}async function setT(v){try{await window.storage.set(TK,v,false)}catch(e){}}async function delT(){try{await window.storage.delete(TK,false)}catch(e){}}function toast(s){let e=$("toast");e.textContent=s;e.classList.add("show");clearTimeout(toast.x);toast.x=setTimeout(()=>e.classList.remove("show"),2300)}function iso(x,y){return{x:240+(x-y)*28,y:70+(x+y)*14}}function sprite(c,x,y,label,size=1){let q=iso(x,y),z=c.fillStyle;c.fillStyle="#0006";c.beginPath();c.ellipse(q.x,q.y+7,12*size,5*size,0,0,7);c.fill();c.fillStyle=`hsl(${p.color_hue},55%,55%)`;c.beginPath();c.roundRect(q.x-9*size,q.y-28*size,18*size,25*size,6*size);c.fill();c.beginPath();c.arc(q.x,q.y-30*size,7*size,0,7);c.fill();c.fillStyle="#edf5ee";c.font="10px Georgia";c.textAlign="center";c.fillText(label,q.x,q.y-42*size);c.fillStyle=z}async function bridge(){try{a=await rpc("kelplantis_bootstrap_dreammeez",{p_token:t});renderAvatar()}catch(e){a=null;renderAvatar()}}function renderAvatar(){let e=$("avatar");if(!a?.linked){e.innerHTML="<b>DreamMeez</b><span>not linked to an auth session</span>";return}e.innerHTML=`<b>DreamMeez linked</b><span>${a.display_name||"Avatar"}</span><span>${a.owned_objects?.length||0} owned objects · Soul Tome ${a.soul_tome?.entries?.length||0}</span>`}async function sync(){p=await rpc("kelplantis_get_player",{p_token:t});g=await rpc("kelplantis_get_floor_gate",{p_token:t,p_floor_id:2}).catch(()=>null);w=await rpc("kelplantis_get_world_state",{p_world_key:"floor1"}).catch(()=>null);pres=await rpc("kelplantis_list_town_presence",{}).catch(()=>[]);await bridge();render()}function draw(){let c=$("world"),x=c.getContext("2d");x.clearRect(0,0,480,360);x.fillStyle="#102017";x.fillRect(0,0,480,360);if(!p)return;function tile(gx,gy,col){let q=iso(gx,gy);x.beginPath();x.moveTo(q.x,q.y-14);x.lineTo(q.x+28,q.y);x.lineTo(q.x,q.y+14);x.lineTo(q.x-28,q.y);x.closePath();x.fillStyle=col;x.fill();x.strokeStyle="#31503d";x.stroke()}if(p.scene!=="DUNGEON"){for(let y=0;y<6;y++)for(let q=0;q<6;q++)tile(q,y,(q+y)%2?"#416f4d":"#3a6546");let h=iso(2,3),d=iso(4,4);x.fillStyle="#d9b35a";x.font="11px Georgia";x.textAlign="center";x.fillText("HOME",h.x,h.y+4);x.fillStyle="#b78fe0";x.fillText("DUNGEON",d.x,d.y+4);x.font="9px Georgia";x.fillText(g?.unlocked?"Floor 2 unlocked":"Floor 2 locked",d.x,d.y+17);pres.forEach(q=>{if(q.id!==p.id)sprite(x,q.pos_x,q.pos_y,q.name,.7)});sprite(x,0,0,"Garden Warden",.85);sprite(x,p.pos_x,p.pos_y,p.name,1)}else{let ds=p.dungeon_state;if(!ds)return;for(let y=0;y<3;y++)for(let q=0;q<5;q++)tile(q,y,"#2b4937");let r=ds.rooms?.[ds.room_index];x.fillStyle="#9eb5a5";x.font="11px Georgia";x.textAlign="center";x.fillText(r?.type==="boss"?"THE SPROUT KING'S HOLLOW":`ROOM ${ds.room_index+1} / ${ds.rooms.length}`,240,38);sprite(x,.7,1.5,p.name,1);if(p.current_encounter)sprite(x,3.5,1.5,p.current_encounter.enemy_name,r?.type==="boss"?1.35:1);else if(!r?.cleared)sprite(x,3.5,1.5,r?.enemy_name||"Enemy",r?.type==="boss"?1.35:1)}}function render(){if(!p)return;$("scene").textContent=p.scene==="HOME"?"Home":p.scene==="DUNGEON"?"The First Garden · Dungeon":"The First Garden";$("name").textContent=`${p.name} · HP ${Math.max(0,p.hp)}/${p.max_hp}`;$("lvl").textContent=`Lv.${p.level}`;$("hp").style.width=Math.max(0,p.hp/p.max_hp*100)+"%";$("xp").style.width=Math.min(100,p.xp/(p.level*20)*100)+"%";$("inventory").innerHTML="";(p.inventory||[]).forEach(i=>{let e=document.createElement("button");e.className="item"+(p.equipped?.[i.slot]?.id===i.id?" eq":"");e.textContent=i.name;e.onclick=()=>equip(i.id);$("inventory").appendChild(e)});if(!p.inventory?.length)$("inventory").innerHTML='<div class="item">Inventory empty</div>';draw()}async function enter(){try{p=await rpc("kelplantis_create_player",{p_name:(($("charname").value||"Wanderer").trim().slice(0,18)||"Wanderer"),p_color_hue:140});t=p.player_token;await setT(t);$("identity").classList.remove("open");await sync();toast("The First Garden is yours to explore.")}catch(e){toast("Could not create character.")}}async function move(dx,dy){if(!p||p.scene==="DUNGEON")return;try{p=await rpc("kelplantis_move_player",{p_token:t,p_dx:dx,p_dy:dy});g=await rpc("kelplantis_get_floor_gate",{p_token:t,p_floor_id:2}).catch(()=>g);render()}catch(e){}}async function act(){if(!p)return;if(p.scene==="TOWN"&&p.pos_x===0&&p.pos_y===0){try{let r=await rpc("kelplantis_talk_to_npc",{p_token:t,p_npc_key:"garden_warden"});toast(r.dialogue)}catch(e){}}else if(p.scene==="DUNGEON"&&!p.current_encounter){try{p=await rpc("kelplantis_engage_encounter",{p_token:t});openCombat()}catch(e){toast("No encounter available.")}}else if(p.scene==="HOME")toast("Equip an item below, then return to the Garden.")}function openCombat(){$("combat").classList.add("open");$("enemy").textContent=p.current_encounter.enemy_name;$("log").textContent="The encounter begins.";combatUI()}function combatUI(){let q=p.current_encounter;if(!q)return;$("ehp").style.width=Math.max(0,q.enemy_hp/q.enemy_max_hp*100)+"%";$("enemyhp").textContent=Math.round(q.enemy_hp/q.enemy_max_hp*100)+"%"}async function attack(){try{p=await rpc("kelplantis_attack",{p_token:t});if(p.current_encounter){$("log").textContent="You strike. The enemy answers.";combatUI()}else{$("combat").classList.remove("open");toast("Victory. The path continues.")}render()}catch(e){toast("Attack failed.")}}async function flee(){p=await rpc("kelplantis_flee_encounter",{p_token:t}).catch(()=>p);$("combat").classList.remove("open");render()}async function equip(id){try{p=await rpc("kelplantis_equip_item",{p_token:t,p_item_id:id});render();toast("Equipped.")}catch(e){toast("Equip failed.")}}$("enter").onclick=enter;$("act").onclick=act;$("attack").onclick=attack;$("flee").onclick=flee;$("sync").onclick=()=>sync().then(()=>toast("Server state synced."));$("new").onclick=async()=>{await delT();location.reload()};document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{let q=b.dataset.d.split(",").map(Number);move(q[0],q[1])});(async()=>{t=await getT();if(t){try{p=await rpc("kelplantis_get_player",{p_token:t});$("identity").classList.remove("open");await sync();return}catch(e){await delT();t=null}}})()
</script></body></html>
