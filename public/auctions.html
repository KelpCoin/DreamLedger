<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="DreamLedger verified auction previews. Live bidding is held until seller identity, Neon transaction and payment controls are proven.">
<meta name="theme-color" content="#0c0d0b">
<title>Auctions · DreamLedger</title>
<link rel="canonical" href="https://dreamledger.org/auctions.html">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/dl-enterprise.css">
<style>
.ticker{overflow:hidden;border-bottom:1px solid var(--dl-line);background:#ebe8e0}
.ticker-track{display:flex;gap:40px;padding:10px 0;animation:mq 45s linear infinite;white-space:nowrap}
.ticker-track span{font-size:12px;font-weight:600;color:var(--dl-muted)}
.ticker-track strong{color:var(--dl-gold)}
@keyframes mq{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.chip{font-size:11px;font-weight:700;padding:6px 10px;border-radius:999px;border:1px solid var(--dl-line);color:var(--dl-muted);display:inline-block;margin:0 6px 6px 0}
.lot-grid{display:grid;grid-template-columns:1fr;gap:14px;padding:8px 0 32px}
@media(min-width:720px){.lot-grid{grid-template-columns:1fr 1fr}}
.lot{background:var(--dl-surface);border:1px solid var(--dl-line);border-radius:var(--dl-radius);padding:20px;display:flex;flex-direction:column;min-height:260px;box-shadow:var(--dl-shadow)}
.lot .silo{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dl-gold);margin-bottom:8px}
.lot h2{font-family:var(--dl-serif);font-size:1.35rem;font-weight:400;margin:0 0 8px}
.lot .desc{font-size:14px;color:var(--dl-muted);flex:1;margin-bottom:12px}
.meta{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.price{font-size:1.5rem;font-weight:700}.price small{display:block;font-size:11px;font-weight:600;color:var(--dl-muted)}
.ends{font-size:13px;font-weight:700;color:#a33b32;text-align:right}.ends.ok{color:var(--dl-ok)}
.bid-row{display:flex;gap:8px}.bid-row input{flex:1;padding:12px;border:1px solid var(--dl-line);border-radius:12px;background:#fff;font:inherit}
.status{font-size:12px;margin-top:8px;color:var(--dl-muted)}.status.ok{color:var(--dl-ok)}.status.bad{color:var(--dl-danger)}
.empty{text-align:center;padding:40px 16px;color:var(--dl-muted);border:1px dashed var(--dl-line);border-radius:16px}
</style>
</head>
<body class="dl-body">
<header class="dl-hdr"><div class="dl-hdr-inner">
  <a class="dl-brand" href="/">Dream<em>Ledger</em></a>
  <nav class="dl-nav">
    <a href="/b2b.html">RIVET</a>
    <a href="/sandbox-tools.html">Tools</a>
    <a href="/buy.html">Buy</a>
    <a class="dl-nav-cta" href="/auctions.html">Auctions</a>
  </nav>
</div></header>
<div class="ticker"><div class="ticker-track" id="ticker-track"><span>Loading…</span></div></div>
<main class="dl-wrap">
  <section class="dl-section" style="padding-bottom:12px">
    <p class="dl-eyebrow">Timed lots · NZD</p>
    <h1 class="dl-h1">Auction lanes</h1>
    <p class="dl-lead">Seller-verified lots only. <strong>Bidding is held until independent identity and transaction proofs pass.</strong></p>
    <span class="chip">Min increment</span><span class="chip">Anti-snipe</span><span class="chip">Reserve</span><span class="chip">Bid proof</span>
  </section>
  <section class="lot-grid" id="lots"><div class="empty">Verifying auction lots. <button disabled>Bidding unavailable pending verified checkout</button></div></section>
</main>
<footer class="dl-footer dl-wrap"><a href="/trust.html">Trust</a><a href="/sell.html">Sell</a><a href="/">Home</a></footer>
<script>
'use strict';
(function(){
 const root=document.getElementById('lots'),track=document.getElementById('ticker-track');
 const waiting=document.createElement('div');
 waiting.className='empty';waiting.textContent='Loading verified auction lots...';
 root.replaceChildren(waiting);
 track.textContent='Unverified lots are never presented as live auctions.';
 function timeLeft(ms){
   if(ms<=0)return 'Ended';
   const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
   return d?d+'d '+h+'h remaining':h+'h '+m+'m remaining';
 }
 function add(tag,parent,value,className){
   const el=document.createElement(tag);el.textContent=String(value);
   if(className)el.className=className;
   parent.appendChild(el);return el;
 }
 function render(a){
   const card=document.createElement('article');card.className='lot';
   add('div',card,a.silo+' | '+a.status,'silo');
   add('h2',card,a.title);
   add('p',card,a.description||'Seller description pending verification','desc');
   const meta=add('div',card,'','meta');
   add('div',meta,a.currency+' '+Number(a.current_price||a.start_price).toFixed(2),'price');
   const clock=add('div',meta,timeLeft(Number(a.ends_at)-Date.now()),'ends');
   clock.dataset.end=String(a.ends_at);
   const stop=document.createElement('button');stop.disabled=true;
   stop.className='dl-btn dl-btn-ghost';stop.textContent='Bidding unavailable pending verified checkout';
   card.appendChild(stop);
   add('p',card,'No payment, reservation, or confirmed buyer is inferred from a listing.','status');
   return card;
 }
 async function load(){
   try{
     const response=await fetch('/api/auctions',{cache:'no-store'});
     if(!response.ok)throw new Error('AUCTION_SOURCE_UNAVAILABLE');
     const data=await response.json();
     const rows=(Array.isArray(data)?data:Array.isArray(data.auctions)?data.auctions:[])
       .filter(a=>a && a.approved===true && a.seller_verified===true &&
         a.gauntlet_verdict==='ALLOW' && a.status==='APPROVED' &&
         a.checkout_available===false && Number(a.ends_at)>Date.now());
     root.replaceChildren();
     if(rows.length)rows.forEach(a=>root.appendChild(render(a)));
     else add('div',root,'No verified auction lots are available. Bidding is held.','empty');
   }catch{
     root.replaceChildren();
     add('div',root,'Auction verification unavailable. Bidding is held.','empty');
   }
 }
 setInterval(()=>root.querySelectorAll('.ends[data-end]').forEach(el=>{
   el.textContent=timeLeft(Number(el.dataset.end)-Date.now());
 }),30000);
 load();
})();
</script>
</body>
</html>
