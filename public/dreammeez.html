<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreamMeez</title>
<style>
:root{--bg:#180f2e;--panel:#241a44;--line:#3a2c66;--cap:#2e2159;--pink:#ff6fae;--mint:#5fe0b7;--gold:#ffcf5c;--cream:#f4eeff;--dim:#a79bd1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}.wrap{max-width:480px;margin:auto;padding:22px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:22px;font-weight:800}.brand span{color:var(--pink)}.stats{display:flex;gap:8px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}.streak{color:var(--gold)}.shards{color:var(--mint)}.stage{background:radial-gradient(circle at 50% 30%,var(--cap),var(--bg) 75%);border:1px solid var(--line);border-radius:28px;padding:28px 20px 20px;text-align:center}.ring{width:220px;height:220px;margin:auto;border:3px dashed var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center}.ring svg{width:190px;height:190px}.msg{font-size:13px;color:var(--dim);min-height:18px;margin-top:10px}.msg strong{color:var(--gold)}.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:20px 0 8px}.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}.swatch{flex:0 0 auto;width:52px;height:52px;border-radius:16px;border:2px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px}.swatch.selected{border-color:var(--pink)}.dot{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.15)}.closet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.item{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer}.item.selected{border-color:var(--mint)}.item.locked{opacity:.55}.glyph{font-size:26px}.name,.cost,.owned{font-size:10px;margin-top:3px}.name{color:var(--dim)}.cost{color:var(--gold);font-weight:700}.owned{color:var(--mint);font-weight:700}.actions{display:flex;gap:8px;margin-top:22px}button{font:700 13px inherit;background:var(--panel);color:var(--cream);border:1px solid var(--line);padding:12px 14px;border-radius:12px;cursor:pointer;flex:1}button.primary{background:var(--pink);border-color:var(--pink);color:#200a17}button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--gold);padding:10px 18px;border-radius:999px;font-size:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.foot{text-align:center;font-size:10px;color:var(--dim);margin-top:22px}
</style>
</head>
<body><div class="wrap">
<div class="top"><div class="brand">Dream<span>Meez</span></div><div class="stats"><div class="stat streak">Streak <span id="streak-count">0</span></div><div class="stat shards">Shards <span id="shard-count">0</span></div></div></div>
<div class="stage"><div class="ring"><svg id="avatar-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"></svg></div><div class="msg" id="streak-msg"></div></div>
<div class="label">Skin</div><div class="row" id="row-skin"></div><div class="label">Hair</div><div class="row" id="row-hair"></div><div class="label">Hair color</div><div class="row" id="row-hairColor"></div><div class="label">Outfit</div><div class="row" id="row-outfit"></div><div class="label">Backdrop</div><div class="row" id="row-backdrop"></div>
<div class="closet"><div class="label" style="margin-top:0">Closet · accessories</div><div class="grid" id="closet-grid"></div></div>
<div class="actions"><button id="btn-randomize">Shuffle look</button><button id="btn-download" class="primary">Save avatar (PNG)</button></div><div class="foot">DreamMeez · your look, your streak, your world · saved on this device</div></div><div class="toast" id="toast"></div>
<script>
(function(){"use strict";
const K={avatar:"dreammeez_avatar_v1",streak:"dreammeez_streak_v1",shards:"dreammeez_shards_v1",unlocked:"dreammeez_unlocked_v1",last:"dreammeez_lastvisit_v1"};
try{[["dreamiez_avatar_v1",K.avatar],["dreamiez_streak_v1",K.streak],["dreamiez_shards_v1",K.shards],["dreamiez_unlocked_v1",K.unlocked],["dreamiez_lastvisit_v1",K.last]].forEach(function(p){if(localStorage.getItem(p[1])===null&&localStorage.getItem(p[0])!==null)localStorage.setItem(p[1],localStorage.getItem(p[0]))})}catch(e){}
function get(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}function set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const SKIN=["#ffd8b8","#f0b088","#c98457","#8a5a3a","#5c3a24"],HAIR=["bob","curly","spiky","long","buzzed"],HC=["#2b1b12","#6b3f22","#d4a13d","#c9536b","#5c6bc9","#3fae7a"],OUT=["#ff6fae","#5fe0b7","#ffcf5c","#7c8cff","#ff7a7a","#c9a4ff"],BG=["#2e2159","#1e3a3a","#3a1e2e","#26314a","#3a2e1e"];
const ITEMS=[{id:"none",g:"-",n:"None",c:0,f:true},{id:"glasses",g:"Shades",n:"Shades",c:15},{id:"crown",g:"Crown",n:"Crown",c:40},{id:"cap",g:"Cap",n:"Cap",c:10},{id:"bow",g:"Bow",n:"Bow",c:8},{id:"headphones",g:"Cans",n:"Cans",c:20}];
let avatar=get(K.avatar,{skin:SKIN[1],hair:"bob",hairColor:HC[0],outfit:OUT[0],backdrop:BG[0],accessory:"none"}),streak=get(K.streak,{current:0,longest:0}),shards=get(K.shards,25),unlocked=get(K.unlocked,["none"]),last=get(K.last,null);
function save(){set(K.avatar,avatar);set(K.streak,streak);set(K.shards,shards);set(K.unlocked,unlocked);set(K.last,last)}
function day(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}function check(){var now=new Date(),today=day(now);if(last===today)return{changed:false,reward:0};var reward=5;if(last){var a=last.split("-").map(Number),prev=new Date(a[0],a[1]-1,a[2]),cur=new Date(now.getFullYear(),now.getMonth(),now.getDate()),diff=Math.round((cur-prev)/86400000);streak.current=diff===1?streak.current+1:1;reward=diff===1?5+Math.min(streak.current,20):5}else streak.current=1;streak.longest=Math.max(streak.longest,streak.current);shards+=reward;last=today;save();return{changed:true,reward:reward}}
function hair(s,c){if(s==="bob")return '<path d="M35 85Q30 25 100 20Q170 25 165 85Q165 60 100 55Q35 60 35 85Z" fill="'+c+'"/>';if(s==="curly")return '<g fill="'+c+'"><circle cx="45" cy="55" r="18"/><circle cx="70" cy="35" r="20"/><circle cx="100" cy="28" r="22"/><circle cx="130" cy="35" r="20"/><circle cx="155" cy="55" r="18"/></g>';if(s==="spiky")return '<path d="M30 80L45 25L58 70L75 15L90 68L100 10L110 68L125 15L142 70L155 25L170 80Q100 45 30 80Z" fill="'+c+'"/>';if(s==="long")return '<path d="M32 90Q28 20 100 18Q172 20 168 90L168 150Q158 130 150 90Q150 50 100 48Q50 50 50 90Q42 130 32 150Z" fill="'+c+'"/>';return '<path d="M38 70Q35 30 100 28Q165 30 162 70Q100 50 38 70Z" fill="'+c+'"/>'}
function acc(id){var x={glasses:'<g stroke="#1a1a1a" stroke-width="3" fill="rgba(20,20,20,.55)"><rect x="55" y="88" width="35" height="22" rx="6"/><rect x="110" y="88" width="35" height="22" rx="6"/><line x1="90" y1="98" x2="110" y2="98"/></g>',crown:'<path d="M60 45L75 65L100 40L125 65L140 45L135 72L65 72Z" fill="#ffcf5c" stroke="#c9962e" stroke-width="2"/>',cap:'<path d="M40 55Q100 15 160 55L160 68Q100 45 40 68Z" fill="#5fe0b7"/><ellipse cx="140" cy="60" rx="28" ry="9" fill="#5fe0b7"/>',bow:'<g fill="#ff6fae"><path d="M100 30L120 15L120 45Z"/><path d="M100 30L80 15L80 45Z"/><circle cx="100" cy="30" r="6"/></g>',headphones:'<g stroke="#333" stroke-width="4" fill="none"><path d="M40 70Q100 5 160 70"/><rect x="30" y="65" width="16" height="26" rx="6" fill="#333" stroke="none"/><rect x="154" y="65" width="16" height="26" rx="6" fill="#333" stroke="none"/></g>'};return x[id]||""}
function render(){document.getElementById("avatar-svg").innerHTML='<rect width="200" height="200" rx="100" fill="'+avatar.backdrop+'"/><ellipse cx="100" cy="175" rx="55" ry="30" fill="'+avatar.outfit+'"/><circle cx="100" cy="100" r="55" fill="'+avatar.skin+'"/><circle cx="80" cy="98" r="5"/><circle cx="120" cy="98" r="5"/><path d="M85 118Q100 128 115 118" stroke="#2a2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>'+hair(avatar.hair,avatar.hairColor)+acc(avatar.accessory);document.getElementById("streak-count").textContent=streak.current;document.getElementById("shard-count").textContent=shards;row("row-skin",SKIN,"skin",true);row("row-hair",HAIR,"hair",false);row("row-hairColor",HC,"hairColor",true);row("row-outfit",OUT,"outfit",true);row("row-backdrop",BG,"backdrop",true);closet()}
function row(id,vals,key,color){var r=document.getElementById(id);r.innerHTML="";vals.forEach(function(v){var e=document.createElement("div");e.className="swatch"+(avatar[key]===v?" selected":"");if(color){var d=document.createElement("div");d.className="dot";d.style.background=v;e.appendChild(d)}else e.textContent={bob:"Hair",curly:"Curl",spiky:"Spike",long:"Long",buzzed:"Buzz"}[v]||v;e.onclick=function(){avatar[key]=v;save();render()};r.appendChild(e)})}
function closet(){var g=document.getElementById("closet-grid");g.innerHTML="";ITEMS.forEach(function(i){var owned=i.f||unlocked.indexOf(i.id)>=0,e=document.createElement("div");e.className="item"+(avatar.accessory===i.id?" selected":"")+(!owned?" locked":"");e.innerHTML='<div class="glyph">'+i.g+'</div><div class="name">'+i.n+'</div>'+(owned?'<div class="owned">'+(i.f?"":"OWNED")+'</div>':'<div class="cost">'+i.c+' shards</div>');e.onclick=function(){if(owned){avatar.accessory=i.id;save();render()}else if(shards>=i.c){shards-=i.c;unlocked.push(i.id);avatar.accessory=i.id;save();render();toast("Unlocked "+i.n)}else toast("Need "+(i.c-shards)+" more shards")};g.appendChild(e)})}
function toast(m){var e=document.getElementById("toast");e.textContent=m;e.classList.add("show");clearTimeout(window._t);window._t=setTimeout(function(){e.classList.remove("show")},2200)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}document.getElementById("btn-randomize").onclick=function(){avatar.skin=pick(SKIN);avatar.hair=pick(HAIR);avatar.hairColor=pick(HC);avatar.outfit=pick(OUT);avatar.backdrop=pick(BG);avatar.accessory=pick(ITEMS.filter(function(i){return i.f||unlocked.indexOf(i.id)>=0})).id;save();render();toast("New look shuffled")};
document.getElementById("btn-download").onclick=function(){var svg=document.getElementById("avatar-svg"),data=new XMLSerializer().serializeToString(svg),url=URL.createObjectURL(new Blob([data],{type:"image/svg+xml;charset=utf-8"})),img=new Image();img.onload=function(){var c=document.createElement("canvas");c.width=c.height=400;c.getContext("2d").drawImage(img,0,0,400,400);URL.revokeObjectURL(url);c.toBlob(function(b){var u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="dreammeez-avatar.png";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)},"image/png")};img.onerror=function(){URL.revokeObjectURL(url);toast("Could not export image in this browser")};img.src=url};
var result=check();render();document.getElementById("streak-msg").innerHTML=result.changed?"Day checked in — <strong>+"+result.reward+" shards</strong>. Streak: <strong>"+streak.current+"</strong>":"Already checked in today. Come back tomorrow to keep your <strong>"+streak.current+"-day streak</strong>.";
})();
</script></body></html>
