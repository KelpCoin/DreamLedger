<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CUBE Silo Catalogue | DreamLedger</title>
<meta name="description" content="Public catalogue of DreamLedger CUBE economic silos. Every numbered CUBE silo has its own canonical URL.">
<style>
body{margin:0;background:#07080c;color:#f6f2e8;font:15px system-ui,-apple-system,sans-serif}
main{max-width:1200px;margin:auto;padding:40px 20px 80px}
.tag{color:#e2b95f;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:clamp(42px,7vw,72px);letter-spacing:-.06em;line-height:.92;margin:10px 0 16px}
p{color:#aeb2bd;line-height:1.5}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}
input,button{font:inherit;border:1px solid #343b49;background:#11151d;color:#f6f2e8;border-radius:10px;padding:11px 13px}
input{min-width:260px;flex:1}button{cursor:pointer}
.stats{border:1px solid #282e3a;border-radius:14px;padding:14px;background:#0d1016;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
article{border:1px solid #282e3a;border-radius:14px;padding:18px;background:#10131b;min-height:150px}
h2{font-size:19px;margin:8px 0}a{color:#f6f2e8;text-decoration:none}a:hover{text-decoration:underline}
.route{font:12px ui-monospace,SFMono-Regular,monospace;color:#8f98a6;word-break:break-all}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:#858e9c}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
#status{color:#aeb2bd}
</style></head>
<body><main>
<div class="tag">DreamLedger · CUBE</div>
<h1>Public Silo Catalogue</h1>
<p>Each numbered CUBE silo is addressable as its own public URL. The catalogue is paginated so the million-row inventory remains usable without attempting to render a million links in one browser response.</p>
<div class="bar"><input id="q" placeholder="Search silo label or ID"><button id="search">Search</button></div>
<div class="stats"><strong id="summary">Loading CUBE catalogue…</strong><div id="status"></div></div>
<section id="grid" class="grid"></section>
<div class="pager"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></div>
</main>
<script>
(function(){
const pageSize=100;
let offset=0,query='';
const grid=document.getElementById('grid'),summary=document.getElementById('summary'),status=document.getElementById('status');
async function load(){
 status.textContent='Loading…'; grid.innerHTML='';
 const url='/api/cube/catalog?limit='+pageSize+'&offset='+offset+(query?'&q='+encodeURIComponent(query):'');
 try{
  const r=await fetch(url,{headers:{Accept:'application/json'}});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||'Catalogue request failed');
  summary.textContent=(d.total==null?'Available':d.total.toLocaleString())+' public CUBE silos';
  status.textContent=d.count+' shown · routes are canonical public URLs';
  grid.innerHTML=d.items.map(function(s){
   return '<article><div class="tag">'+(s.inventory_mode||'ECONOMIC')+'</div><h2><a href="'+s.public_route+'">'+escapeHtml(s.label||s.id)+'</a></h2><div class="route">'+escapeHtml(s.public_route)+'</div><div class="meta"><span>'+escapeHtml(s.id)+'</span>'+(s.cross_game?'<span>cross-game</span>':'')+(s.cross_silo_view?'<span>cross-silo</span>':'')+'</div></article>';
  }).join('');
  document.getElementById('page').textContent='Page '+(Math.floor(offset/pageSize)+1)+' of '+(d.total?Math.max(1,Math.ceil(d.total/pageSize)):'?');
  document.getElementById('prev').disabled=offset===0;
  document.getElementById('next').disabled=d.count<pageSize;
 }catch(e){summary.textContent='Catalogue unavailable';status.textContent=e.message;grid.innerHTML='<article>Retry when the data source is available.</article>'}
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
document.getElementById('search').onclick=function(){query=document.getElementById('q').value.trim();offset=0;load()};
document.getElementById('q').onkeydown=function(e){if(e.key==='Enter')document.getElementById('search').click()};
document.getElementById('prev').onclick=function(){offset=Math.max(0,offset-pageSize);load()};
document.getElementById('next').onclick=function(){offset+=pageSize;load()};
load();
})();
</script></body></html>
