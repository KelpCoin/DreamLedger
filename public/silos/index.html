<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silos · DreamLedger</title>
<meta name="bec-compiler" content="SiloFaceCompiler">
<style>
:root{--bg:#0a0b0f;--surface:#141722;--ink:#f4f1ea;--muted:#9aa0b0;--line:#2a3040;--gold:#d8b56b}
*{box-sizing:border-box;margin:0;padding:0}body{font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--gold);text-decoration:none;font-weight:700}
.wrap{max-width:1100px;margin:auto;padding:24px 16px 80px}
.top{display:flex;justify-content:space-between;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid var(--line)}
h1{font-size:clamp(1.8rem,4vw,2.4rem);letter-spacing:-.04em;margin:8px 0}
.muted{color:var(--muted)}.badge{font-size:10px;border:1px solid var(--line);padding:3px 8px;border-radius:99px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.filters button{border:1px solid var(--line);background:#0e0e14;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer}
.filters button.on{border-color:var(--gold);color:var(--gold)}
.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);min-height:120px;display:flex;flex-direction:column;gap:6px}
.card h3{font-size:14px}.card p{font-size:12px;color:var(--muted);flex:1}
.st{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.st.live_candidate{color:#69e0b0}.st.shell_candidate{color:#e1b85b}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a href="/">DreamLedger</a><nav><a href="/mtg/">MTG</a> · <a href="/truth-oracle.html">Truth Oracle</a> · <a href="/money.html">Pay</a></nav></header>
<span class="badge">SiloFaceCompiler · registry-driven</span>
<h1>Silo faces</h1>
<p class="muted">500 registry entries. <strong>shell_candidate</strong> is not a live market. Only gauntlet-passed surfaces may claim commerce.</p>
<div class="filters" id="filters"></div>
<div class="rail" id="rail">Loading registry…</div>
</div>
<script>
(function(){
  let all=[];
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function render(filter){
    let rows=all;
    if(filter==='live_candidate'||filter==='shell_candidate') rows=all.filter(s=>s.status===filter);
    else if(filter==='mtg') rows=all.filter(s=>s.slug==='mtg'||(s.slug&&s.slug.indexOf('mtg')===0));
    const show=rows.slice(0,120);
    document.getElementById('rail').innerHTML=show.map(s=>{
      const href=s.slug==='mtg'?'/mtg/':('/silo.html?slug='+encodeURIComponent(s.slug));
      return '<a class="card" href="'+href+'"><span class="st '+(s.status||'')+'">'+esc(s.status)+'</span><h3>'+esc(s.name)+'</h3><p>'+esc(s.tagline||'')+'</p></a>';
    }).join('')+(rows.length>120?'<p class="muted">Showing 120 of '+rows.length+'.</p>':'');
  }
  fetch('/data/silo-face-registry.json').then(r=>r.json()).then(d=>{
    all=d.silos||[];
    const f=document.getElementById('filters');
    ['all','live_candidate','shell_candidate','mtg'].forEach(k=>{
      const b=document.createElement('button');b.textContent=k;
      b.onclick=()=>{[...f.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');render(k);};
      if(k==='all')b.classList.add('on');f.appendChild(b);
    });
    render('all');
  }).catch(()=>{document.getElementById('rail').textContent='Registry unavailable';});
})();
</script>
</body>
</html>
