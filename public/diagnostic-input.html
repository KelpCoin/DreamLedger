<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commander Deck Diagnostic | DreamLedger</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#080a0d;color:#eef1f5;max-width:760px;margin:0 auto;padding:28px 18px}main{background:#141920;border:1px solid #343c4a;border-radius:16px;padding:24px}label{display:block;margin:18px 0 7px;color:#c8ced7}input,textarea{width:100%;box-sizing:border-box;background:#0c1015;color:#eef1f5;border:1px solid #3b4554;border-radius:10px;padding:12px;font:inherit}textarea{min-height:260px}.buy{display:inline-block;margin-top:18px;padding:12px 16px;background:#f0b90b;color:#080a0d;border-radius:9px;text-decoration:none;font-weight:800}button{margin-top:18px;padding:12px 16px;border:0;border-radius:9px;background:#f0b90b;color:#080a0d;font-weight:800;cursor:pointer}#status{margin-top:18px;white-space:pre-wrap;color:#b9c2ce}</style></head>
<body><p><a href="/">DreamLedger</a> / MTG</p><main><h1>Commander Deck Diagnostic</h1><p>NZ$29. Your payment is verified by Stripe before the fulfillment job is accepted.</p>
<form id="f"><label>Email used at checkout</label><input id="email" type="email" required><label>Checkout Session ID</label><input id="session_id" required><label>Commander decklist</label><textarea id="decklist" placeholder="1 Sol Ring&#10;1 Command Tower&#10;..."></textarea><button>Submit decklist</button></form><div id="status"></div></main>
<script>
const q=new URLSearchParams(location.search); if(q.get('session_id'))document.getElementById('session_id').value=q.get('session_id');
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('status');status.textContent='Submitting…';const r=await fetch('/api/commercial/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,session_id:document.getElementById('session_id').value,decklist:document.getElementById('decklist').value})});const d=await r.json().catch(()=>({}));status.textContent=r.ok?'Accepted. Fulfillment is now queued for automatic processing.':(d.error||'Submission failed');});
</script></body></html>
