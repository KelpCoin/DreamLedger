<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><title>Kelplantis | DreamLedger</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#071018;color:#eef6f5;font:14px system-ui,sans-serif;overflow:hidden}body{touch-action:none}.app{height:100%;max-width:720px;margin:auto;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 20%,#123329,#071018 55%)}header{height:72px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #243a3b}.brand{font-weight:900;letter-spacing:.12em}.brand span{color:#78e0c4}.stats{text-align:right;font-size:11px;color:#9bb4b1}.stats b{color:#f2d77b}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;padding:10px 14px;gap:8px}.box{border:1px solid #263d3d;border-radius:12px;padding:8px;background:#0b171b}.box small{display:block;color:#76918e;font-size:9px;text-transform:uppercase;letter-spacing:.1em}.box strong{font-size:13px}.arena{position:relative;flex:1;min-height:0;padding:10px}.arena canvas{width:100%;height:100%;display:block;border:1px solid #2b4644;border-radius:20px;background:#091514}.controls{position:absolute;inset:auto 22px 24px 22px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.joy{width:116px;height:116px;border-radius:50%;border:1px solid #55706c;background:#102320aa;position:relative;pointer-events:auto}.knob{position:absolute;width:48px;height:48px;left:34px;top:34px;border-radius:50%;background:#76d9c0;box-shadow:0 0 25px #76d9c055}.attack{width:92px;height:92px;border-radius:50%;border:1px solid #b59b55;background:#2b2412dd;color:#ffe8a0;font-weight:900;pointer-events:auto}.help{position:absolute;top:22px;left:28px;color:#a8c2bd;font-size:10px;pointer-events:none}.modal{position:absolute;inset:0;display:none;place-items:center;background:#0009;padding:28px}.card{border:1px solid #50645f;border-radius:18px;background:#0c1718;padding:24px;text-align:center;max-width:330px}.card h2{margin:0 0 8px}.card p{color:#9eb4b0}.btn{border:1px solid #78e0c4;background:#78e0c4;color:#071018;border-radius:10px;padding:11px 16px;font-weight:900}
</style></head>
<body><div class="app"><header><div class="brand">DREAM<span>LEDGER</span> / KELPLANTIS</div><div class="stats"><b id="title">DreamShell</b><br><span id="avatar">DRMZ-AVT-001</span></div></header><div class="hud"><div class="box"><small>World</small><strong>Floor <span id="floor">1</span></strong></div><div class="box"><small>Boss</small><strong id="boss">LOCKED</strong></div><div class="box"><small>Identity</small><strong id="rep">Known</strong></div></div><main class="arena"><canvas id="game"></canvas><div class="help">MOVE + ATTACK / defeat the canonical boss to stamp the floor</div><div class="controls"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><button class="attack" id="attack">ATTACK</button></div><div class="modal" id="modal"><div class="card"><h2 id="winTitle">Floor cleared</h2><p id="winText"></p><button class="btn" id="next">ENTER NEXT FLOOR</button></div></div></main></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,seed=1, floor=Number(localStorage.kelpFloor||1), hp=100, bossHp=60, px=.5,py=.55, ax=.5,ay=.35, moving={x:0,y:0},drag=false;const bossId=()=>`kelp_floor${floor}_boss`;
function rnd(n){let t=Math.sin(n*999.91+seed*37.17)*43758.5453;return t-Math.floor(t)}
function resize(){W=c.clientWidth*devicePixelRatio;H=c.clientHeight*devicePixelRatio;c.width=W;c.height=H}addEventListener('resize',resize);resize();
function draw(){x.clearRect(0,0,W,H);let cols=12,rows=18,cw=W/cols,ch=H/rows;x.strokeStyle='#16312d';x.lineWidth=1;for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){if(rnd(i+j*cols)<.18&&!(i==6&&j>6&&j<14))continue;x.strokeRect(i*cw+2,j*ch+2,cw-4,ch-4)}
let bx=ax*W,by=ay*H;x.fillStyle='#c25b75';x.beginPath();x.arc(bx,by,Math.min(W,H)*.055,0,7);x.fill();x.fillStyle='#fff';x.font='11px system-ui';x.fillText('BOSS',bx-16,by-28);x.fillStyle='#203e38';x.fillRect(bx-38,by-22,76,5);x.fillStyle='#e46d82';x.fillRect(bx-38,by-22,76*Math.max(0,bossHp/60),5);
let pxx=px*W,pyy=py*H;x.fillStyle='#78e0c4';x.beginPath();x.arc(pxx,pyy,Math.min(W,H)*.045,0,7);x.fill();x.strokeStyle='#f2d77b';x.stroke();
requestAnimationFrame(draw)}requestAnimationFrame(draw);
function tick(){px=Math.max(.08,Math.min(.92,px+moving.x*.009));py=Math.max(.08,Math.min(.92,py+moving.y*.009));if(Math.hypot(px-ax,py-ay)<.13){hp-=.12;if(hp<=0){hp=100;px=.5;py=.55}}}setInterval(tick,16);
function attack(){if(Math.hypot(px-ax,py-ay)<.22){bossHp-=20;if(bossHp<=0)clearFloor()}}document.getElementById('attack').onpointerdown=e=>{e.preventDefault();attack()};
const joy=document.getElementById('joy'),knob=document.getElementById('knob');function joyMove(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.min(38,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);moving={x:Math.cos(a)*(m/38),y:Math.sin(a)*(m/38)};knob.style.transform=`translate(${Math.cos(a)*m}px,${Math.sin(a)*m}px)`}joy.onpointerdown=e=>{drag=true;joy.setPointerCapture(e.pointerId);joyMove(e)};joy.onpointermove=e=>{if(drag)joyMove(e)};joy.onpointerup=joy.onpointercancel=()=>{drag=false;moving={x:0,y:0};knob.style.transform='translate(0,0)'};
function sync(){document.getElementById('floor').textContent=floor;document.getElementById('boss').textContent=bossId();document.getElementById('rep').textContent=floor>3?'Feared':'Known'}sync();
function clearFloor(){document.getElementById('modal').style.display='grid';document.getElementById('winText').textContent=`BOSS_CLEARED: ${bossId()}. DreamMeez identity DRMZ-AVT-001 receives a canonical progression stamp.`}document.getElementById('next').onclick=()=>{floor=Math.min(100,floor+1);localStorage.kelpFloor=floor;seed=floor;bossHp=60;document.getElementById('modal').style.display='none';sync()};
</script></body></html>
