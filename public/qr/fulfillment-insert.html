<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DreamLedger order insert</title>
<style>
body{font:16px/1.45 system-ui,sans-serif;color:#111;max-width:620px;margin:24px auto;padding:24px;text-align:center}
img{width:220px;height:220px;image-rendering:pixelated}
.small{color:#444;font-size:12px}
@media print{body{margin:0;padding:10mm}.no-print{display:none}}
</style>
</head>
<body>
<h1>Thanks for your order.</h1>
<p>Enjoy your purchase. Know someone who would find DreamLedger useful?</p>
<a href="https://dreamledger.org/go?src=qr-canonical"><img src="/assets/qr-canonical.svg" alt="Scan to explore DreamLedger" width="220" height="220"></a>
<p><strong>Scan to explore and share DreamLedger.</strong></p>
<p><a href="https://dreamledger.org/go?src=qr-canonical">dreamledger.org/go</a></p>
<p class="small">This insert uses the canonical DreamLedger QR. A scan is not evidence of a sale or revenue.</p>
<button class="no-print" onclick="window.print()">Print insert</button>
</body>
</html>
