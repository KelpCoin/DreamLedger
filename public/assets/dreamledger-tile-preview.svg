<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">DreamLedger 3000 digital billboard tile preview</title>
  <desc id="desc">A stylized grid of digital billboard tiles with one highlighted DreamLedger tile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16130d"/>
      <stop offset="0.55" stop-color="#080808"/>
      <stop offset="1" stop-color="#1b1710"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe18a"/>
      <stop offset="1" stop-color="#d6a33d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="36" fill="url(#bg)"/>
  <g opacity="0.35" stroke="#756238" stroke-width="2">
    <path d="M70 70H1130M70 190H1130M70 310H1130M70 430H1130M70 550H1130M70 630H1130"/>
    <path d="M70 70V630M190 70V630M310 70V630M430 70V630M550 70V630M670 70V630M790 70V630M910 70V630M1030 70V630M1130 70V630"/>
  </g>
  <g opacity="0.18" fill="#fff">
    <rect x="91" y="91" width="78" height="78" rx="12"/>
    <rect x="211" y="211" width="78" height="78" rx="12"/>
    <rect x="931" y="91" width="78" height="78" rx="12"/>
    <rect x="811" y="451" width="78" height="78" rx="12"/>
  </g>
  <rect x="310" y="190" width="480" height="320" rx="28" fill="#0b0b0b" stroke="url(#gold)" stroke-width="5" filter="url(#glow)"/>
  <rect x="330" y="210" width="440" height="280" rx="20" fill="#12100c" stroke="#564a2d" stroke-width="2"/>
  <text x="360" y="270" fill="#e6bd5b" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="5">DREAMLEDGER 3000</text>
  <text x="360" y="345" fill="#f7f3ea" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">YOUR PLACE</text>
  <text x="360" y="405" fill="#aaa398" font-family="Arial, Helvetica, sans-serif" font-size="28">10,000 pixels. One URL.</text>
  <text x="360" y="445" fill="#aaa398" font-family="Arial, Helvetica, sans-serif" font-size="28">Held until 3000.</text>
  <rect x="965" y="565" width="165" height="44" rx="22" fill="#e6bd5b"/>
  <text x="1047" y="594" text-anchor="middle" fill="#090909" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800">NZ$50</text>
</svg>
