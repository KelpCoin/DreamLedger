<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Sell on DreamLedger RIVET. Zero success fee. NZ B2B intake.">
<meta name="theme-color" content="#080a0e">
<link rel="canonical" href="https://dreamledger.org/sell.html">
<title>Sell · RIVET · DreamLedger</title>
<style>
:root{--bg:#080a0e;--panel:#0f1419;--line:#27313b;--ink:#f5f3eb;--muted:#8b96a3;--gold:#d8b56b;--ok:#58d6a0;--max:720px;--font:system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font)}a{color:inherit;text-decoration:none}.shell{max-width:var(--max);margin:0 auto;padding:0 20px}.topbar{border-bottom:1px solid var(--line);padding:14px 0}.topbar .inner{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.06em;font-size:14px;text-transform:uppercase}.brand span{color:var(--gold)}.nav a{font-size:12px;font-weight:700;color:var(--muted);margin-left:12px}.hero{padding:40px 0 24px}.kicker{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}h1{font-size:clamp(1.9rem,5vw,2.6rem);letter-spacing:-.03em;margin-bottom:12px}.lead{color:var(--muted);margin-bottom:20px}.fee-box{background:#0f1419;border:1px solid #2a3d28;border-radius:14px;padding:16px;margin-bottom:28px}.fee-box strong{color:var(--ok);display:block}.form{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#0a0e13;color:var(--ink);font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{width:100%;min-height:48px;margin-top:20px;border:0;border-radius:12px;background:var(--gold);color:#111;font-weight:800;cursor:pointer}.status.ok{color:var(--ok);margin-top:12px}.note{margin-top:16px;font-size:12px;color:#65707b}.note a{color:var(--gold)}@media(max-width:560px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><div class="shell topbar inner"><a class="brand" href="/">DREAM<span>LEDGER</span></a><nav class="nav"><a href="/b2b.html">RIVET</a><a href="/marketplace.html">Market</a><a href="/buy.html">Buy</a></nav></div></header>
<main class="shell">
<section class="hero">
<div class="kicker">RIVET · Seller intake</div>
<h1>List something. Keep more of the sale.</h1>
<p class="lead">0% platform success fee on current public offers. PENDING_APPROVAL until reviewed.</p>
<div class="fee-box"><strong>0% DreamLedger success fee</strong><p style="color:#8b96a3;margin:6px 0 0;font-size:.9rem">Stripe processing still applies. Publication requires approval.</p></div>
</section>
<form class="form" id="sell-form">
<label for="kind">What are you listing?</label>
<select id="kind" name="kind" required><option value="">Select…</option><option value="digital">Digital</option><option value="physical">Physical NZ</option><option value="service">Service</option><option value="b2b">B2B / wholesale</option><option value="mtg">MTG</option></select>
<label for="title">Title</label><input id="title" name="title" required maxlength="120">
<label for="description">Description</label><textarea id="description" name="description" required maxlength="2000"></textarea>
<div class="row"><div><label for="price">Price NZD</label><input id="price" name="price" type="number" min="1" required></div><div><label for="inventory">Units</label><input id="inventory" name="inventory" type="number" min="1" value="1" required></div></div>
<label for="business">Business name (optional)</label><input id="business" name="business">
<label for="gst">GST</label><select id="gst" name="gst"><option value="unknown">Prefer not to say</option><option value="yes">Yes</option><option value="no">No</option></select>
<label for="email">Email</label><input id="email" name="email" type="email" required>
<label for="notes">Notes</label><textarea id="notes" name="notes"></textarea>
<button class="btn" type="submit" id="submit">Submit for review</button>
<div class="status" id="status"></div>
<p class="note"><a href="/policies.html">Policies</a> · <a href="/b2b.html">RIVET hub</a></p>
</form>
</main>
<script>
(function(){const form=document.getElementById('sell-form');const status=document.getElementById('status');const btn=document.getElementById('submit');
form.addEventListener('submit',async function(e){e.preventDefault();status.textContent='Submitting…';btn.disabled=true;
const data=Object.fromEntries(new FormData(form).entries());data.price_nzd=Number(data.price);data.inventory=Number(data.inventory);data.source='sell.html';data.intent='seller_intake';data.timestamp=new Date().toISOString();
try{let r=await fetch('/api/marketplace/intake',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});
if(r.status===404){r=await fetch('/api/offers',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...data,status:'PENDING_APPROVAL'})});}
if(!r.ok)throw new Error('fail');
status.className='status ok';status.textContent='Received. PENDING_APPROVAL.';form.reset();
}catch(err){try{const k='dreamledger_seller_signals';const p=JSON.parse(localStorage.getItem(k)||'[]');p.push(data);localStorage.setItem(k,JSON.stringify(p.slice(-20)));}catch(_){}
status.className='status ok';status.textContent='Saved locally. Not public until approved.';}finally{btn.disabled=false;}});})();
</script>
</body>
</html>
