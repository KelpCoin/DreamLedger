<!doctype html><html lang="en-NZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quote Comparison Intake · DreamLedger</title><style>body{margin:0;background:#090909;color:#eee;font:16px/1.5 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:40px 20px 80px}.k{color:#d5b45c;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px}h1{font-size:42px;line-height:1;margin:14px 0}.card{border:1px solid #333;background:#111;padding:22px;margin:20px 0}.muted{color:#aaa}label{display:block;margin:16px 0 7px;font-weight:700}textarea,input[type=file]{width:100%;box-sizing:border-box;background:#181818;color:#eee;border:1px solid #444;padding:12px;border-radius:8px}button{margin-top:18px;background:#d5b45c;color:#090909;border:0;padding:13px 18px;font-weight:900;border-radius:8px}#status{white-space:pre-wrap}.ok{color:#9fe3a4}.err{color:#ff8f8f}a{color:#d5b45c}</style></head><body><main><div class="k">DreamLedger · Automated Fulfilment</div><h1>Quote comparison intake</h1><div class="card"><p class="muted">Payment is verified before intake. The system extracts the supplied quotes, normalizes comparable fields, flags unknowns, builds an evidence-backed decision packet, and delivers it automatically.</p><label for="files">2-5 quote files</label><input id="files" type="file" multiple accept=".pdf,.csv,.json,.md"><label for="requirements">Purchase requirements / scope</label><textarea id="requirements" rows="8" placeholder="What are you buying? Include quantities, specifications, delivery location, deadline, currency or comparison rules."></textarea><button id="start">Submit quotes</button><div id="status" class="muted"></div></div></main><script>const qs=new URLSearchParams(location.search),sessionId=qs.get("session_id"),api="https://wbwgroygjeyukkspnqiy.supabase.co/functions/v1/quote-intake",statusEl=document.getElementById("status"),filesEl=document.getElementById("files"),reqEl=document.getElementById("requirements");function status(t,c){statusEl.textContent=t;statusEl.className=c||"muted"}async function call(action,extra={}){const r=await fetch(api,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action,session_id:sessionId,...extra})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Request failed");return j}async function poll(){try{const j=await call("status");if(j.status==="fulfilled"&&j.download_url){status("Complete. Your decision packet is ready.\n\n"+j.download_url,"ok");return}if(j.status==="failed"){status("Fulfilment failed safely. Payment and evidence remain recorded for retry.","err");return}status("Processing automatically. No operator action is required.");setTimeout(poll,5000)}catch(e){if(String(e.message).includes("SETTLEMENT_RECORD_PENDING")||String(e.message).includes("ENTITLEMENT_PENDING")){status("Payment is settled; finalizing the fulfilment record...");setTimeout(poll,3000);return}status(e.message,"err")}}document.getElementById("start").onclick=async()=>{try{if(!sessionId)throw new Error("Missing checkout session.");const files=[...filesEl.files];if(files.length<2||files.length>5)throw new Error("Upload 2-5 quote files.");if(!reqEl.value.trim())throw new Error("Purchase requirements are required.");status("Preparing secure upload paths...");const init=await call("initialize",{files:files.map(f=>({name:f.name,size:f.size}))});const uploaded=[];for(let i=0;i<files.length;i++){const f=files[i],u=init.uploads[i];const r=await fetch("https://wbwgroygjeyukkspnqiy.supabase.co/storage/v1/object/upload/sign/"+u.path.split("/").map(encodeURIComponent).join("/")+"?token="+encodeURIComponent(u.token),{method:"PUT",headers:{"content-type":f.type||"application/octet-stream","x-upsert":"false"},body:f});if(!r.ok)throw new Error("Upload failed for "+f.name);uploaded.push({path:u.path,name:f.name,size:f.size})}status("Files received. Starting automated comparison...");await call("finalize",{files:uploaded,requirements:reqEl.value});document.getElementById("start").disabled=true;poll()}catch(e){status(e.message,"err")}};if(sessionId)poll();else status("This page must be opened from a completed Stripe checkout.","err");</script></body></html>
