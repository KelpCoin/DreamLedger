<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up · DreamLedger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#fff;color:#111;min-height:100vh}
a{color:inherit;text-decoration:none}
.bar{padding:18px 24px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
.bar strong{font-size:15px}
main{max-width:360px;margin:56px auto;padding:0 24px}
h1{font-size:22px;font-weight:700;margin-bottom:6px}
.sub{color:#666;font-size:14px;margin-bottom:24px}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
input{width:100%;height:44px;border:1px solid #ddd;border-radius:8px;padding:0 12px;font:inherit;margin-bottom:14px}
button{width:100%;height:44px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:600;font:inherit;cursor:pointer}
.err{color:#b91c1c;font-size:13px;margin-top:12px}
.sw{margin-top:20px;font-size:13px;color:#666}
.sw a{font-weight:600;text-decoration:underline;color:#111}
</style>
</head>
<body>
<div class="bar"><a href="/"><strong>DreamLedger</strong></a><a href="/login" style="font-size:14px;font-weight:600">Log in</a></div>
<main>
  <h1>Sign up</h1>
  <p class="sub">Email and password.</p>
  <form id="f">
    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="email">
    <label for="password">Password</label>
    <input id="password" type="password" required minlength="8" autocomplete="new-password">
    <button type="submit">Create account</button>
    <div id="msg" class="err"></div>
  </form>
  <p class="sw">Have an account? <a href="/login">Log in</a></p>
</main>
<script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();msg.textContent='';try{const r=await fetch('/api/account/register',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Sign up failed');location.href=d.next||'/avatar.html'}catch(x){msg.textContent=x.message}};
</script>
</body>
</html>
