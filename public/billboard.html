<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Founding Tile | DreamLedger 3000</title>
<meta name="description" content="Claim a permanent DreamLedger 3000 Founding Tile for NZ$50 one time.">
<style>
body{margin:0;background:#080808;color:#f4f1e9;font:16px/1.5 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:70px 24px}a{color:inherit}.k{color:#e6bd5b;text-transform:uppercase;letter-spacing:.16em;font-weight:800;font-size:12px}h1{font-size:clamp(46px,9vw,82px);line-height:.9;letter-spacing:-.06em;margin:18px 0}.card{padding:30px;border:1px solid #333;border-radius:18px;background:#111}.price{font-size:40px;color:#e6bd5b;font-weight:900}.btn{display:inline-block;margin-top:22px;padding:14px 20px;border-radius:10px;background:#e6bd5b;color:#090909;text-decoration:none;font-weight:900;border:0;cursor:pointer}.muted{color:#98928a}.status{margin-top:20px;min-height:24px}.back{display:block;margin-top:30px;color:#999}
</style>
</head>
<body>
<main>
<div class="k">DreamLedger 3000</div>
<h1>Founding Tile.</h1>
<div class="card">
<div class="price">NZ$50 one time</div>
<p>A permanent 100 x 100 digital billboard placement for your project, website, artwork, or creation.</p>
<p class="muted">No subscription. No recurring fee. Approved placements remain until January 1, 3000.</p>
<button id="buy" class="btn">Continue to payment</button>
<div id="status" class="status" aria-live="polite"></div>
</div>
<a class="back" href="/">Back to DreamLedger 3000</a>
<script>
const button=document.getElementById('buy');
const status=document.getElementById('status');
button.addEventListener('click',async()=>{
  button.disabled=true; status.textContent='Opening secure payment...';
  try{
    const r=await fetch('/api/offer-checkout/create',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({offer_id:'DREAMLEDGER-BILLBOARD-FOUNDING-001'})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Checkout unavailable');
    if(d.url){location.href=d.url;return;}
    throw new Error('Checkout URL was not returned');
  }catch(e){
    status.textContent='Payment is temporarily unavailable. Please try again shortly.';
    button.disabled=false;
  }
});
</script>
</main>
</body>
</html>
