<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<meta http-equiv="refresh" content="0;url=/?src=qr-canonical#quote-tool">
<link rel="canonical" href="https://dreamledger.org/?src=qr-canonical#quote-tool">
<title>DreamLedger | Start with a free tool</title>
</head>
<body>
<p>Start with the <a href="/?src=qr-canonical#quote-tool">free supplier quote worksheet</a>.</p>
<script>
(function () {
  var target = new URL('/', window.location.origin);
  var incoming = new URLSearchParams(window.location.search);
  incoming.forEach(function (value, key) {
    if (key !== 'src') target.searchParams.set(key, value);
  });
  target.searchParams.set('src', incoming.get('src') || 'qr-canonical');
  target.hash = 'quote-tool';
  window.location.replace(target.pathname + target.search + target.hash);
}());
</script>
</body>
</html>
