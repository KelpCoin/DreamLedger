<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamLedger Order</title><style>body{margin:0;background:#0a0b0e;color:#f7f4ee;font:16px/1.6 system-ui}main{max-width:760px;margin:60px auto;padding:24px}.panel{background:#14161b;border:1px solid #2a2e37;border-radius:12px;padding:24px;margin:18px 0}textarea{width:100%;min-height:330px;background:#0a0b0e;color:#f7f4ee;border:1px solid #3a3f49;border-radius:8px;padding:12px;box-sizing:border-box}button{background:#c9a24b;color:#0a0b0e;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}code{color:#c9a24b}.muted{color:#a7abb4}.ok{color:#36d27a}.err{color:#ff7777}</style></head><body><main><h1>Commander Deck Diagnostic</h1><p class="muted">Secure buyer order surface. Decklists are write-once and only the authenticated buyer can submit or retrieve the report.</p><div id="state" class="panel">Checking your account…</div><div id="input" class="panel" hidden><h2>Submit your decklist</h2><p class="muted">Paste the complete Commander list. This submission cannot be overwritten after it is accepted.</p><textarea id="deck" placeholder="1 Commander Name\n1 Card Name\n..." ></textarea><p><button id="submit">Submit decklist</button></p></div><div id="report" class="panel" hidden><h2>Report</h2><button id="download">Open verified report</button></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const SUPA='https://wbwgroygjeyukkspnqiy.supabase.co', KEY='sb_publishable_O5JRD67KaU3SA9dFq-JIuQ_Pzs8pedj';
const supabase=createClient(SUPA,KEY); const orderId=new URLSearchParams(location.search).get('order_id'); const state=document.querySelector('#state');
async function call(action,extra={}){const {data:{session}}=await supabase.auth.getSession();if(!session){throw new Error('Please sign in to your DreamLedger account using the email used for checkout.')}const r=await fetch(SUPA+'/functions/v1/marketplace-commander-access',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action,order_id:orderId,...extra})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function refresh(){if(!orderId){state.innerHTML='<span class="err">Missing order id.</span>';return}const {data:{session}}=await supabase.auth.getSession();if(!session){state.innerHTML='<span class="err">Not signed in.</span><p class="muted">Sign in to the DreamLedger account matching your checkout email, then reload this page.</p>';return}try{await call('claim_order');state.innerHTML='<span class="ok">Order secured to your account.</span><p>Submit your decklist below. Once processed, the verified report will appear here.</p>';document.querySelector('#input').hidden=false}catch(e){state.innerHTML='<span class="err">'+e.message+'</span>';}}
document.querySelector('#submit').onclick=async()=>{const deck=document.querySelector('#deck').value;if(deck.trim().length<20){alert('Please provide the complete decklist.');return}try{await call('submit_decklist',{decklist:deck});document.querySelector('#input').hidden=true;state.innerHTML='<span class="ok">Decklist submitted.</span><p class="muted">The fulfillment worker will process it. Reload this page later to access the report.</p>'}catch(e){alert(e.message)}};
document.querySelector('#download').onclick=async()=>{try{const j=await call('download_report');location.href=j.signed_url}catch(e){alert(e.message)}};
refresh();
</script></body></html>
