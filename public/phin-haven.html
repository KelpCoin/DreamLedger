<!doctype html>
<html lang="en" data-surface="phinhaven-live-v1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Phin Haven — Depth 1 · The Shallows</title>
<style>
:root{--bg:#09110d;--panel:#13241b;--line:#31503d;--ink:#edf5ee;--muted:#9eb5a5;--gold:#d9b35a;--green:#78d399;--red:#d45b52}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 0,#1b3929,var(--bg) 65%);color:var(--ink);font:13px Georgia,serif;overflow:hidden}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;touch-action:manipulation}
button.primary{background:var(--green);color:#07110b;border-color:#9ce5b4;font-weight:bold}button:active{transform:translateY(1px)}
#app{height:100%;display:flex;flex-direction:column}
header{padding:10px 13px 7px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
header h1{margin:0;color:var(--green);font-size:15px;letter-spacing:.12em;text-transform:uppercase}
header a{color:var(--gold);font-size:11px;text-decoration:none}.scene{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.body{min-height:0;flex:1;display:flex;flex-direction:column;gap:7px;padding:7px}
.stage{position:relative;flex:1;min-height:250px;display:flex;align-items:center;justify-content:center}
.stage canvas{width:min(100%,560px);height:auto;aspect-ratio:4/3;border:1px solid var(--line);border-radius:11px;background:#102017}
.toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);padding:7px 12px;border:1px solid var(--gold);border-radius:8px;background:#0b1610ee;color:var(--gold);opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center}.toast.show{opacity:1}
.hud{border-top:1px solid var(--line);padding:7px 0 0;display:flex;flex-direction:column;gap:7px}
.barrow{display:flex;gap:8px;align-items:center}.stat{flex:1;min-width:130px}
.small{font-size:10px;color:var(--muted);display:flex;justify-content:space-between}
.bar{height:8px;border:1px solid #3b241f;background:#20120f;border-radius:5px;overflow:hidden}.fill{height:100%;background:var(--green)}
.xp{height:5px;background:#1d293f}.xp .fill{background:#8baaf5}
.grid{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px;margin:auto}.grid button{padding:0;font-size:17px}
.side{display:flex;gap:7px;align-items:flex-start;flex-wrap:wrap}
.chips{display:flex;gap:5px;overflow:auto;flex:1}
.chip{min-width:58px;height:50px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:9px;text-align:center;color:var(--muted)}.chip.eq{border-color:var(--gold);color:var(--gold)}
.avatar{min-width:140px;border:1px solid var(--line);border-radius:9px;padding:7px;background:#0d1912}.avatar b{color:var(--green)}.avatar span{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.modal{position:fixed;inset:0;background:#06100bdd;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.open{display:flex}
.card{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px}.card h2{margin:0 0 7px;color:var(--green);font-size:17px}.card p{color:var(--muted);line-height:1.45}.row{display:flex;gap:7px}.row>*{flex:1}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>Phin Haven</h1>
  <span class="scene" id="scene">Depth 1 · The Shallows</span>
  <a href="/">Store</a>
</header>
<div class="body">
  <div class="stage"><canvas id="world" width="480" height="360"></canvas><div id="toast" class="toast"></div></div>
  <div class="hud">
    <div class="barrow">
      <div class="stat">
        <div class="small"><span id="name">Wanderer</span><span id="lvl">Lv.1</span></div>
        <div class="bar"><div id="hp" class="fill" style="width:100%"></div></div>
        <div class="xp"><div id="xp" class="fill" style="width:0%"></div></div>
      </div>
      <button id="sync">Sync</button>
      <button id="depth2" class="primary" style="display:none">Enter Depth 2</button>
      <button id="exit" style="display:none">Return</button>
      <button id="new">New</button>
    </div>
    <div class="side">
      <div class="grid">
        <span></span><button data-d="0,-1">▲</button><span></span>
        <button data-d="-1,0">◀</button><button id="act">●</button><button data-d="1,0">▶</button>
        <span></span><button data-d="0,1">▼</button><span></span>
      </div>
      <div class="chips" id="inventory"></div>
      <div class="avatar" id="avatar"><b>DreamMeez</b><span>unlinked session</span></div>
    </div>
  </div>
</div>
</div>
<div id="identity" class="modal open"><div class="card">
  <h2>Enter The Shallows</h2>
  <p>Depth 1 of Phin Haven. Beat the boss before Depth 2 opens. Server saves your character.</p>
  <input id="charname" maxlength="18" placeholder="Character name" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#09110d;color:var(--ink);margin:0 0 10px">
  <button class="primary" id="enter" style="width:100%">Enter Depth 1</button>
</div></div>
<div id="combat" class="modal"><div class="card">
  <h2 id="enemy">Encounter</h2>
  <div class="small"><span>Enemy</span><span id="enemyhp">100%</span></div>
  <div class="bar"><div id="ehp" class="fill" style="width:100%;background:var(--red)"></div></div>
  <p id="combatlog">The path is blocked.</p>
  <div class="row"><button class="primary" id="attack">Attack</button><button id="flee">Flee</button></div>
</div></div>
<script>
const URL="https://wbwgroygjeyukkspnqiy.supabase.co";
const KEY="sb_publishable_O5JRD67KaU3SA9dFq-JIuQ_Pzs8pedj";
const TOKEN="kelplantis:player_token";
let player=null,token=null,avatar=null,world=null,gate=null;
const $=id=>document.getElementById(id);
async function rpc(name,args){
  const r=await fetch(`${URL}/rest/v1/rpc/${name}`,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:`Bearer ${KEY}`},body:JSON.stringify(args)});
  if(!r.ok)throw Error(`${name}:${r.status}`);
  return r.json();
}
async function storageGet(){
  try{if(window.storage&&window.storage.get){const r=await window.storage.get(TOKEN);if(r&&r.value)return r.value}}catch(e){}
  try{return localStorage.getItem(TOKEN)}catch(e){return null}
}
async function storageSet(v){
  try{if(window.storage&&window.storage.set)await window.storage.set(TOKEN,v,false)}catch(e){}
  try{localStorage.setItem(TOKEN,v)}catch(e){}
}
async function storageDelete(){
  try{if(window.storage&&window.storage.delete)await window.storage.delete(TOKEN,false)}catch(e){}
  try{localStorage.removeItem(TOKEN)}catch(e){}
}
function toast(s){const e=$("toast");e.textContent=s;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2500)}
async function bridgeAvatar(){try{avatar=await rpc("kelplantis_bootstrap_dreammeez",{p_token:token});renderAvatar()}catch(e){avatar=null}}
function renderAvatar(){
  const e=$("avatar");
  if(!avatar||!avatar.linked){e.innerHTML="<b>DreamMeez</b><span>unlinked session</span>";return}
  const a=avatar.appearance||{};
  e.innerHTML=`<b>DreamMeez linked</b><span>${avatar.display_name||"Avatar"}</span><span>hue ${a.color_hue??"-"}</span>`;
}
function sceneLabel(){
  if(!player)return "";
  if(player.scene==="HOME")return "Home";
  if(player.scene==="DUNGEON")return player.dungeon_state && player.dungeon_state.floor_id === 2 ? "Depth 2 · Frontier" : "Depth 1 · The Shallows";
  return "Depth 1 · The Shallows";
}
function iso(gx,gy){return{x:240+(gx-gy)*28,y:70+(gx+gy)*14}}
function draw(){
  const c=$("world"),x=c.getContext("2d");x.clearRect(0,0,480,360);x.fillStyle="#102017";x.fillRect(0,0,480,360);
  if(!player)return;
  const tile=(gx,gy,col)=>{const p=iso(gx,gy);x.beginPath();x.moveTo(p.x,p.y-14);x.lineTo(p.x+28,p.y);x.lineTo(p.x,p.y+14);x.lineTo(p.x-28,p.y);x.closePath();x.fillStyle=col;x.fill();x.strokeStyle="#31503d";x.stroke()};
  if(player.scene!=="DUNGEON"){
    for(let y=0;y<6;y++)for(let gx=0;gx<6;gx++)tile(gx,y,(gx+y)%2?"#416f4d":"#3a6546");
    let h=iso(2,3);x.fillStyle="#d9b35a";x.fillText("HOME",h.x-18,h.y+4);
    let d=iso(4,4);x.fillStyle="#b78fe0";x.fillText("DUNGEON",d.x-25,d.y+4);
    if(gate)x.fillText(gate.unlocked?"Depth 2 unlocked":"Depth 2 locked",d.x-25,d.y+18);
    x.fillStyle="#d9b35a";labelSprite(x,0,0,"Warden",.85);
    (world&&world.presence||[]).forEach(p=>labelSprite(x,p.pos_x,p.pos_y,p.name,.7));
    labelSprite(x,player.pos_x,player.pos_y,player.name,1);
  }else{
    const ds=player.dungeon_state;if(!ds)return;
    for(let y=0;y<3;y++)for(let gx=0;gx<5;gx++)tile(gx,y,"#2b4937");
    const room=ds.rooms&&ds.rooms[ds.room_index];
    x.fillStyle="#9eb5a5";x.textAlign="center";
    x.fillText(ds.floor_id===2?"FRONTIER":"Depth 1 · The Shallows",240,38);
    labelSprite(x,.7,1.5,player.name,1);
    if(player.current_encounter)labelSprite(x,3.5,1.5,player.current_encounter.enemy_name,1.2);
    else if(room&&!room.cleared)labelSprite(x,3.5,1.5,room.enemy_name||"Enemy",1);
  }
  x.textAlign="left";
}
function labelSprite(x,gx,gy,label,size){
  const p=iso(gx,gy);
  x.fillStyle="#05080599";x.beginPath();x.ellipse(p.x,p.y+7,12*size,5*size,0,0,Math.PI*2);x.fill();
  x.fillStyle=`hsl(${player.color_hue||140},55%,55%)`;
  x.beginPath();x.roundRect(p.x-9*size,p.y-28*size,18*size,25*size,6*size);x.fill();
  x.beginPath();x.arc(p.x,p.y-30*size,7*size,0,Math.PI*2);x.fill();
  x.fillStyle="#edf5ee";x.font="10px Georgia";x.textAlign="center";x.fillText(label,p.x,p.y-42*size);
}
function render(){
  if(!player)return;
  $("scene").textContent=sceneLabel();
  $("name").textContent=`${player.name} · HP ${Math.max(0,player.hp)}/${player.max_hp}`;
  $("lvl").textContent=`Lv.${player.level}`;
  $("hp").style.width=Math.max(0,player.hp/player.max_hp*100)+"%";
  $("xp").style.width=Math.min(100,player.xp/(player.level*20)*100)+"%";
  $("inventory").innerHTML="";
  (player.inventory||[]).forEach(i=>{
    const e=document.createElement("div");
    e.className="chip"+(player.equipped&&player.equipped[i.slot]&&player.equipped[i.slot].id===i.id?" eq":"");
    e.textContent=i.name;e.onclick=()=>equip(i.id);$("inventory").appendChild(e);
  });
  if(!(player.inventory&&player.inventory.length)){const e=document.createElement("div");e.className="chip";e.textContent="empty";$("inventory").appendChild(e)}
  draw();
}
async function load(){
  token=await storageGet();
  if(token){
    try{
      player=await rpc("kelplantis_get_player",{p_token:token});
      $("identity").classList.remove("open");
      await syncAll();return;
    }catch(e){await storageDelete();token=null}
  }
  $("identity").classList.add("open");
}
async function enter(){
  const name=($("charname").value||"Wanderer").trim().slice(0,18)||"Wanderer";
  try{
    player=await rpc("kelplantis_create_player",{p_name:name,p_color_hue:140});
    token=player.player_token;await storageSet(token);
    $("identity").classList.remove("open");
    await syncAll();toast("Welcome to The Shallows.");
  }catch(e){toast("Could not enter — check server RPCs.")}
}
async function syncAll(){
  world=await rpc("kelplantis_get_world_state",{p_world_key:"floor1"}).catch(()=>null);
  gate=await rpc("kelplantis_get_floor_gate",{p_token:token,p_floor_id:2}).catch(()=>null);
  await bridgeAvatar();render();
  const b=$("depth2"); if(b){b.style.display=(player.scene==="TOWN"&&gate&&gate.unlocked)?"inline-block":"none";}
  const e=$("exit"); if(e)e.style.display=player.scene==="DUNGEON"?"inline-block":"none";
}
async function enterDepth2(){
  try{player=await rpc("kelplantis_enter_floor",{p_token:token,p_floor_id:2});toast("Entered Depth 2.");render();await syncAll()}
  catch(e){toast(e.message||"Depth 2 is still locked.")}
}
async function exitDungeon(){
  try{player=await rpc("kelplantis_exit_floor",{p_token:token});toast("Returned to Sanctuary.");render();await syncAll()}
  catch(e){toast(e.message||"Cannot leave this Depth.")}
}
async function move(dx,dy){
  if(!player||player.scene==="DUNGEON")return;
  try{
    player=await rpc("kelplantis_move_player",{p_token:token,p_dx:dx,p_dy:dy});
    gate=await rpc("kelplantis_get_floor_gate",{p_token:token,p_floor_id:2}).catch(()=>gate);
    render();
  }catch(e){}
}
async function act(){
  if(!player)return;
  if(player.scene==="TOWN"&&player.pos_x===0&&player.pos_y===0){
    try{const r=await rpc("kelplantis_talk_to_npc",{p_token:token,p_npc_key:"garden_warden"});toast("Warden: "+r.dialogue)}catch(e){}
  }else if(player.scene==="DUNGEON"&&!player.current_encounter){
    try{player=await rpc("kelplantis_engage_encounter",{p_token:token});openCombat()}catch(e){toast("Could not open encounter")}
  }else if(player.scene==="HOME")toast("Home — equip from inventory.");
}
function openCombat(){
  $("combat").classList.add("open");
  $("enemy").textContent=player.current_encounter.enemy_name;
  $("combatlog").textContent="The encounter begins.";
  updateCombat();
}
function updateCombat(){
  if(!player.current_encounter)return;
  const q=player.current_encounter;
  $("ehp").style.width=Math.max(0,q.enemy_hp/q.enemy_max_hp*100)+"%";
  $("enemyhp").textContent=Math.round(q.enemy_hp/q.enemy_max_hp*100)+"%";
}
async function attack(){
  try{
    player=await rpc("kelplantis_attack",{p_token:token});
    if(player.current_encounter){$("combatlog").textContent="You strike. The enemy answers.";updateCombat()}
    else{
      $("combat").classList.remove("open");
      const boss=player.floor_progress&&player.floor_progress["1"]&&player.floor_progress["1"].bossDefeated;
      toast(boss?"Depth 1 boss cleared — Depth 2 may unlock.":"Victory.");
      await syncAll();
    }
    render();
  }catch(e){toast("Attack failed")}
}
async function flee(){
  try{player=await rpc("kelplantis_flee_encounter",{p_token:token})}catch(e){}
  $("combat").classList.remove("open");render();
}
async function equip(id){
  try{player=await rpc("kelplantis_equip_item",{p_token:token,p_item_id:id});render();toast("Equipped")}catch(e){toast("Cannot equip")}
}
$("enter").onclick=enter;
$("depth2").onclick=enterDepth2;
$("exit").onclick=exitDungeon;
$("sync").onclick=async()=>{try{player=await rpc("kelplantis_get_player",{p_token:token});await syncAll();toast("Synced")}catch(e){toast("Sync failed")}};
$("new").onclick=async()=>{await storageDelete();location.reload()};
$("act").onclick=act;$("attack").onclick=attack;$("flee").onclick=flee;
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const[x,y]=b.dataset.d.split(",").map(Number);move(x,y)});
load();
</script>
</body>
</html>
