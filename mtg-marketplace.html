<!doctype html>
<html lang="en-NZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTG Marketplace | DreamLedger</title>
<style>
:root{--bg:#080a0d;--p:#10151b;--l:#27313a;--i:#f5f3eb;--m:#9ca7b2;--g:#d8b56b;--ok:#8fd3a2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#2b2418,#080a0d 42%);color:var(--i);font:15px/1.5 system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px 16px 70px}a{color:var(--g);text-decoration:none}.nav{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;border-bottom:1px solid var(--l);padding-bottom:14px}.brand{font-weight:950;letter-spacing:.08em}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0}.tab,button{border:1px solid var(--l);background:#11161d;color:var(--i);border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.tab.active,button.primary{background:var(--g);color:#111;border-color:var(--g)}.panel{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.item{border:1px solid var(--l);border-radius:13px;padding:15px;background:#0d1218}.item h3{margin:0 0 5px}.muted{color:var(--m)}.price{font-size:1.25rem;font-weight:950;margin:8px 0}input,textarea,select{width:100%;background:#0b0e12;color:var(--i);border:1px solid var(--l);border-radius:9px;padding:10px;font:inherit;margin:5px 0 10px}textarea{min-height:110px}.row{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.status{color:var(--m);min-height:24px}.good{color:var(--ok)}h1{font-size:clamp(2.5rem,8vw,5.5rem);line-height:.9;letter-spacing:-.06em;margin:24px 0 10px}.auth{max-width:520px}@media(max-width:650px){button,.tab{width:100%}}
</style></head><body><div class="wrap">
<header class="nav"><div class="brand">MAGIC / DREAMLEDGER</div><nav><a href="/mtg/">Catalogue</a> · <a href="/mtg/deck-upload.html">List deck</a> · <a href="/">DreamLedger</a></nav></header>
<h1>MTG, as a community.</h1><p class="muted">Cards, decks, auctions, trades and discussion in one free community surface. Payments stay on the existing commerce rail. No fake settlement is recorded.</p>
<div id="auth" class="panel auth"><b>Sign in</b><p class="muted">Email magic-link authentication. Browsing stays public.</p><input id="email" type="email" placeholder="you@example.com"><button id="magic" class="primary">Send sign-in link</button><div id="authmsg" class="status"></div></div>
<div class="tabs"><button class="tab active" data-tab="cards">Cards</button><button class="tab" data-tab="decks">Decks</button><button class="tab" data-tab="auctions">Auctions</button><button class="tab" data-tab="trades">Trades</button><button class="tab" data-tab="forum">Forum</button><button class="tab" data-tab="sell">Sell / list</button></div>
<section id="cards" class="panel"></section><section id="decks" class="panel hidden"></section><section id="auctions" class="panel hidden"></section><section id="trades" class="panel hidden"></section><section id="forum" class="panel hidden"></section><section id="sell" class="panel hidden"></section>
<div id="status" class="status"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://wbwgroygjeyukkspnqiy.supabase.co',KEY='sb_publishable_O5JRD67KaU3SA9dFq-JIuQ_Pzs8pedj',S=supabase.createClient(URL,KEY),$=x=>document.getElementById(x);let user=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function session(){const r=await S.auth.getSession();user=r.data.session?.user||null;$('auth').classList.toggle('hidden',!!user);}
async function load(){
 const [cards,decks,auctions,trades,threads]=await Promise.all([
  S.from('mtg_cards').select('*').eq('status','published').gt('inventory',0).order('created_at',{ascending:false}),
  S.from('mtg_decks').select('id,title,commander,description,condition,price_nzd,inventory').eq('status','published').gt('inventory',0).order('published_at',{ascending:false}),
  S.from('mtg_auctions').select('*').eq('status','open').order('ends_at'),
  S.from('mtg_trades').select('*').eq('status','open').order('created_at',{ascending:false}),
  S.from('mtg_forum_threads').select('*').order('updated_at',{ascending:false}).limit(30)
 ]);
 renderCards(cards.data||[],cards.error);renderDecks(decks.data||[],decks.error);renderAuctions(auctions.data||[],auctions.error);renderTrades(trades.data||[],trades.error);renderForum(threads.data||[],threads.error);renderSell();
}
function renderCards(a,e){$('cards').innerHTML='<h2>Cards for sale</h2>'+err(e)+(a.length?'<div class="grid">'+a.map(x=>'<article class="item"><h3>'+esc(x.name)+'</h3><div class="muted">'+esc(x.set_code)+' · '+esc(x.condition)+' · '+esc(x.language)+'</div><div class="price">NZ$'+Number(x.price_nzd).toFixed(2)+'</div><div class="muted">'+esc(x.description)+'</div><button class="primary" onclick="buyCard(\''+x.id+'\','+Number(x.price_nzd)+')">Buy / request checkout</button></article>').join(''):'<p class="muted">No card listings yet.</p>')+'</div>'}
function renderDecks(a,e){$('decks').innerHTML='<h2>Decks</h2>'+err(e)+'<div class="grid">'+a.map(x=>'<article class="item"><h3>'+esc(x.title)+'</h3><div class="muted">Commander: '+esc(x.commander)+'</div><div class="price">NZ$'+Number(x.price_nzd).toFixed(2)+'</div><a href="/mtg/?deck='+encodeURIComponent(x.id)+'">View deck</a></article>').join('')+'</div>'}
function renderAuctions(a,e){$('auctions').innerHTML='<h2>Live auctions</h2>'+err(e)+'<div class="grid">'+a.map(x=>'<article class="item"><h3>'+esc(x.title)+'</h3><div class="muted">'+esc(x.description)+'</div><div class="price">NZ$'+Number(x.current_bid_nzd||x.start_price_nzd).toFixed(2)+'</div><div class="muted">Ends '+new Date(x.ends_at).toLocaleString()+'</div><button onclick="bid(\''+x.id+'\','+Number(x.current_bid_nzd||x.start_price_nzd)+')">Place bid</button></article>').join('')+'</div>'}
function renderTrades(a,e){$('trades').innerHTML='<h2>Trade board</h2>'+err(e)+'<div class="grid">'+a.map(x=>'<article class="item"><h3>'+esc(x.title)+'</h3><div><b>Offering:</b> '+esc(x.offering)+'</div><div><b>Seeking:</b> '+esc(x.seeking)+'</div><button onclick="offer(\''+x.id+'\')">Make trade offer</button></article>').join('')+'</div><button onclick="newTrade()">Post a trade</button>'}
function renderForum(a,e){$('forum').innerHTML='<h2>Forum</h2>'+err(e)+'<div class="grid">'+a.map(x=>'<article class="item"><h3>'+esc(x.title)+'</h3><div class="muted">'+esc(x.category)+' · '+new Date(x.created_at).toLocaleDateString()+'</div><p>'+esc(x.body)+'</p></article>').join('')+'</div><button onclick="newThread()">Start discussion</button>'}
function renderSell(){ $('sell').innerHTML='<h2>List something</h2><p class="muted">Decks already have the dedicated intake. This creates single-card inventory.</p><label>Card name</label><input id="sn" placeholder="Rhystic Study"><label>Set / collector context</label><input id="ss"><label>Condition</label><input id="sc" value="Near Mint"><label>Price NZD</label><input id="sp" type="number" step=".01"><label>Description</label><textarea id="sd"></textarea><button class="primary" onclick="sellCard()">Publish card</button>'}
function err(e){return e?'<p class="muted">Database unavailable: '+esc(e.message)+'</p>':''}
async function requireUser(){if(user)return true;alert('Sign in first.');return false}
window.buyCard=async(id,amount)=>{if(!await requireUser())return;const r=await S.from('mtg_purchase_intents').insert({buyer_id:user.id,card_id:id,amount_nzd:amount,quantity:1}).select().single();alert(r.error?r.error.message:'Purchase intent created. Checkout rail will attach here.');};
window.bid=async(id,current)=>{if(!await requireUser())return;const v=prompt('Bid in NZD. Current bid: '+current);const amount=Number(v);if(!(amount>current))return alert('Bid must exceed current bid.');const r=await S.from('mtg_bids').insert({auction_id:id,bidder_id:user.id,amount_nzd:amount});if(r.error)alert(r.error.message);else{alert('Bid recorded.');load();}};
window.offer=async id=>{if(!await requireUser())return;const text=prompt('What are you offering?');if(!text)return;const r=await S.from('mtg_trade_offers').insert({trade_id:id,offerer_id:user.id,offer_text:text});alert(r.error?r.error.message:'Trade offer sent.');};
window.newTrade=async()=>{if(!await requireUser())return;const title=prompt('Trade title');const offering=prompt('What are you offering?');const seeking=prompt('What are you seeking?');if(!title||!offering||!seeking)return;const r=await S.from('mtg_trades').insert({owner_id:user.id,title,offering,seeking});alert(r.error?r.error.message:'Trade posted.');load();};
window.newThread=async()=>{if(!await requireUser())return;const title=prompt('Thread title');const body=prompt('Opening post');if(!title||!body)return;const r=await S.from('mtg_forum_threads').insert({author_id:user.id,title,body});alert(r.error?r.error.message:'Discussion posted.');load();};
window.sellCard=async()=>{if(!await requireUser())return;const name=$('sn').value,price=Number($('sp').value);if(!name||!(price>0))return alert('Name and price required.');const r=await S.from('mtg_cards').insert({owner_id:user.id,name,set_code:$('ss').value,condition:$('sc').value,price_nzd:price,description:$('sd').value,status:'published',inventory:1});alert(r.error?r.error.message:'Card listed.');load();};
$('magic').onclick=async()=>{const email=$('email').value.trim();if(!email)return;const r=await S.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});$('authmsg').textContent=r.error?.message||'Check your email.'};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['cards','decks','auctions','trades','forum','sell'].forEach(x=>$(x).classList.toggle('hidden',x!==b.dataset.tab))});
session().then(load);
</script></body></html>
