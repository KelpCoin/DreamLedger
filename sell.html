<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell on DreamLedger</title><style>body{margin:0;background:#090a0d;color:#f5f7f8;font:16px/1.5 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px 16px 70px}a{color:inherit}.box{background:#111317;border:1px solid #292d35;border-radius:18px;padding:22px}label{display:block;margin-top:15px;font-weight:800}input,textarea,select{width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border-radius:9px;border:1px solid #343943;background:#0b0d10;color:#fff}textarea{min-height:130px}button{margin-top:18px;padding:13px 16px;border:0;border-radius:10px;background:#f2c14e;color:#111;font-weight:900}.photos{margin-top:12px}.msg{margin-top:16px;color:#f2c14e}</style></head><body><main><p><a href="/">DREAMLEDGER</a> / <a href="/account.html">Account</a></p><h1>Sell something</h1><div class="box"><p>Buyers do not need accounts. Sellers do: your email must be verified before a listing can be submitted.</p><form id="f"><label>Title<input id="title" required maxlength="100"></label><label>Category<select id="category"><option>Cars</option><option>General</option><option>B2B</option><option>Collectibles</option><option>Other</option></select></label><label>Description<textarea id="description" required maxlength="2000"></textarea></label><label>Price NZD<input id="price" type="number" min="0.01" step="0.01" required></label><label>Condition<input id="condition" maxlength="40" placeholder="Used, new, excellent, etc."></label><label>Location<input id="location" maxlength="100" placeholder="Auckland"></label><label>Photos<input id="files" class="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="preview"></div><button>Submit listing for approval</button></form><div id="msg" class="msg"></div></div></main><script>const filesEl=document.getElementById('files'),preview=document.getElementById('preview'),photos=[];filesEl.onchange=async()=>{preview.textContent='Uploading photos...';photos.length=0;for(const f of Array.from(filesEl.files).slice(0,12)){const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});const r=await fetch('/api/marketplace/media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mime:f.type,data})});const d=await r.json();if(r.ok)photos.push(d.url)}preview.textContent=photos.length+' photo(s) ready.'};document.getElementById('f').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Submitting...';const r=await fetch('/api/marketplace/listings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value,category:category.value,description:description.value,price:+price.value,condition:condition.value,location:location.value,photos})});const d=await r.json().catch(()=>({}));if(r.status===401||r.status===403){location.href='/login.html?next=/sell.html';return}if(!r.ok){msg.textContent=d.error||'Listing failed.';return}msg.textContent='Listing submitted. It is pending approval and is not checkoutable yet.';e.target.reset();preview.textContent=''};</script></body></html>
