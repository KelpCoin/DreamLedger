<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in to DreamLedger</title><style>body{margin:0;background:#090a0d;color:#f5f7f8;font:16px/1.5 system-ui,sans-serif}main{max-width:620px;margin:auto;padding:32px 18px 70px}a{color:inherit}label{display:block;margin-top:16px;font-weight:800}input{width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border-radius:10px;border:1px solid #343943;background:#111317;color:#fff}button{margin-top:20px;padding:13px 17px;border:0;border-radius:10px;background:#f2c14e;font-weight:900;cursor:pointer}.box{background:#111317;border:1px solid #292d35;border-radius:18px;padding:22px}.msg{margin-top:16px;color:#f2c14e}.err{color:#ffb4b4}</style></head><body><main><p><a href="/">DREAMLEDGER</a></p><h1>Log in</h1><div class="box"><form id="f"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button id="b">Log in</button></form><div id="msg" class="msg" role="alert"></div><p><a href="/register.html">Create an account</a></p></div></main><script>const next=new URLSearchParams(location.search).get('next')||'/account.html',f=document.getElementById('f'),b=document.getElementById('b'),msg=document.getElementById('msg');(async()=>{try{const r=await fetch('/api/account/me',{credentials:'same-origin',cache:'no-store'}),d=await r.json();if(d.authenticated)location.replace(next)}catch{}})();f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;msg.className='msg';msg.textContent='Logging in...';try{const r=await fetch('/api/account/login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},credentials:'same-origin',body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Login failed.');const check=await fetch('/api/account/me',{credentials:'same-origin',cache:'no-store'}),session=await check.json().catch(()=>({}));if(!session.authenticated)throw new Error('Login succeeded but the session cookie was not retained.');msg.textContent='Logged in. Redirecting...';location.replace(next)}catch(x){msg.className='msg err';msg.textContent=x.message}finally{b.disabled=false}});</script></body></html>
