<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in to DreamLedger</title><style>body{margin:0;background:#090a0d;color:#f5f7f8;font:16px/1.5 system-ui,sans-serif}main{max-width:620px;margin:auto;padding:32px 18px 70px}a{color:inherit}label{display:block;margin-top:16px;font-weight:800}input{width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border-radius:10px;border:1px solid #343943;background:#111317;color:#fff}button{margin-top:20px;padding:13px 17px;border:0;border-radius:10px;background:#f2c14e;font-weight:900;cursor:pointer}.box{background:#111317;border:1px solid #292d35;border-radius:18px;padding:22px}.msg{margin-top:16px;color:#f2c14e}</style></head><body><main><p><a href="/">DREAMLEDGER</a></p><h1>Log in</h1><div class="box"><form id="f"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Log in</button></form><div id="msg" class="msg"></div><p><a href="/register.html">Create an account</a></p></div></main><script>const next=new URLSearchParams(location.search).get('next')||'/account.html';document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Logging in...';const r=await fetch('/api/dreamiez/account/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok){msg.textContent=d.error||'Login failed.';return}location.href=next});</script></body></html>
