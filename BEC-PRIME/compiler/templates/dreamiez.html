<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090c">
<title>Dreamiez | Create your avatar</title>
<style>
:root{--bg:#08090c;--panel:#111319;--line:#292e38;--text:#f7f5f2;--muted:#9ea3ad;--gold:#d8b66b;--pink:#e7a7c5;--green:#8fd0a8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1a1520 0,#08090c 48%);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:54px}.brand{font-weight:950;letter-spacing:.18em}.brand span{color:var(--pink)}a{color:var(--muted);text-decoration:none}.hero{text-align:center}.eyebrow{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.hero h1{font-size:clamp(2.6rem,10vw,5rem);line-height:.95;letter-spacing:-.05em;margin:14px 0}.hero p{color:var(--muted);max-width:600px;margin:0 auto 30px}.panel{margin-top:24px;padding:24px;background:rgba(17,19,25,.92);border:1px solid var(--line);border-radius:18px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);font-weight:800}.tab.active{background:var(--gold);color:#111}.field{margin:12px 0;text-align:left}.field label{display:block;color:var(--muted);font-size:.78rem;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#090b0f;color:var(--text);font:inherit}.avatars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.avatar{padding:14px;border:1px solid var(--line);border-radius:14px;background:#090b0f;color:var(--text)}.avatar.selected{border-color:var(--gold)}.orb{width:72px;height:72px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:linear-gradient(135deg,#e7a7c5,#d8b66b)}.night{background:linear-gradient(135deg,#5d658e,#151826)}.gold{background:linear-gradient(135deg,#f4d98b,#8d6d29)}.avatar small{color:var(--muted)}.button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--gold);color:#111;font:inherit;font-weight:950}.msg{min-height:22px;margin-top:12px;color:var(--muted);font-size:.85rem}.account{display:none;text-align:center}.account .orb{width:120px;height:120px;font-size:3rem}.streak{font-size:2.2rem;font-weight:950;color:var(--gold)}.reward{padding:14px;margin:8px 0;border:1px solid var(--line);border-radius:12px;text-align:left}.reward strong{display:block}.reward span{color:var(--muted);font-size:.82rem}
</style>
</head>
<body><div class="wrap">
<header class="top"><div class="brand">DREAMLEDGER<span>.</span></div><a href="/">Commerce</a></header>
<main class="hero"><div class="eyebrow">DREAMIEZ / YOUR FIRST DIGITAL ASSET</div><h1>Create your Dreamiez.</h1><p>Make an account, choose your avatar, and begin a daily streak. Your first Dreamiez reward is generated by the Elohim engine when the account is created.</p>
<section class="panel" id="authPanel"><div class="tabs"><button class="tab active" id="createTab">Create account</button><button class="tab" id="loginTab">Log in</button></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="new-password"></div><div class="field" id="nameField"><label>Name</label><input id="name" maxlength="32" value="Dreamer"></div><div class="field" id="avatarField"><label>Choose your Dreamiez</label><div class="avatars"><button class="avatar selected" data-style="dream"><div class="orb">✦</div><small>Dream</small></button><button class="avatar" data-style="night"><div class="orb night">☾</div><small>Night</small></button><button class="avatar" data-style="gold"><div class="orb gold">◆</div><small>Gold</small></button></div></div><button class="button" id="submit">Create my Dreamiez</button><div class="msg" id="msg"></div></section>
<section class="panel account" id="accountPanel"><div class="orb" id="accountOrb">✦</div><h2 id="accountName"></h2><div class="streak" id="streak">1 day</div><p class="muted">Daily presence builds the Dreamiez.</p><button class="button" id="checkin">Check in today</button><div id="rewards"></div><button class="button" style="margin-top:10px;background:transparent;color:var(--muted);border:1px solid var(--line)" id="logout">Log out</button></section>
</main></div>
<script src="/assets/dreamiez-account.js"></script>
</body></html>
