<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify email | DreamLedger</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#17191d}
main{max-width:560px;margin:7vh auto;padding:28px;background:#fff;border:1px solid #ddd;border-radius:16px}
h1{margin-top:0}a{color:inherit}
.ok{color:#126b2e}.error{color:#b00020}.muted{color:#666}
</style>
</head>
<body>
<main>
<h1>Email verification</h1>
<p id="state" class="muted">Checking your verification link...</p>
<p><a href="/login.html">Log in</a> or <a href="/register.html">create an account</a>.</p>
</main>
<script>
(async function(){
  const state=document.getElementById('state');
  const token=new URLSearchParams(location.search).get('token');
  if(!token){state.className='error';state.textContent='Verification token missing.';return;}
  try{
    const r=await fetch('/api/account/verify?token='+encodeURIComponent(token),{credentials:'include',cache:'no-store'});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Verification failed.');
    state.className='ok';
    state.textContent='Your email is verified. Your account is ready.';
    setTimeout(function(){location.href=d.next||'/account.html'},700);
  }catch(err){state.className='error';state.textContent=err.message||'Verification failed.';}
})();
</script>
</body>
</html>
