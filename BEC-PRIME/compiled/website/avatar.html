<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avatar | DreamLedger</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#17191d}main{max-width:520px;margin:7vh auto;padding:28px;background:#fff;border:1px solid #ddd;border-radius:16px}h1{margin-top:0}label{display:block;margin:14px 0 6px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:9px;font:inherit}button{margin-top:18px;padding:12px 16px;border:0;border-radius:9px;background:#17191d;color:#fff;font:inherit;cursor:pointer}.muted{color:#666}.error{color:#b00020;margin-top:12px}a{color:inherit}</style></head><body><main><h1>Account avatar</h1><p class="muted">Avatar and identity surface. Independent from commerce inventory.</p><div id="state">Checking account...</div><script>fetch("/api/account/me",{credentials:"include",cache:"no-store"}).then(r=>r.json()).then(d=>document.getElementById("state").textContent=d.authenticated?"Signed in as "+(d.account.email||"Customer"):"Please sign in first.").catch(()=>document.getElementById("state").textContent="Account service unavailable.");</script></main></body></html>
