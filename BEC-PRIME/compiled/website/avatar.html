<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Avatar | DreamLedger</title><style>body{margin:0;background:#090a0d;color:#f5f7f8;font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:20px}.box{width:min(560px,100%);background:#111317;border:1px solid #292d35;border-radius:20px;padding:28px}.muted{color:#929aa6}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}label{display:block;margin:14px 0 6px;font-weight:800}select,button{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;font:inherit}select{border:1px solid #59616d;background:#090a0d;color:#fff}button{margin-top:20px;border:0;background:#f2c14e;color:#111;font-weight:900;cursor:pointer}.err{color:#ffb4b4;background:#351b1b;border:1px solid #713535;padding:10px;border-radius:8px;margin-top:12px}.ok{color:#b8f0c0;background:#17351d;border:1px solid #3b7845;padding:10px;border-radius:8px;margin-top:12px}</style></head>
<body><main class="box"><div class="muted">DREAMLEDGER / AVATAR</div><h1>Create your avatar.</h1><p class="muted">Your avatar is stored on your DreamLedger account. Dreamiez is optional.</p><div id="state" class="muted">Checking account...</div><form id="f" hidden><div class="grid"><div><label for="height">Height</label><select id="height"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></div><div><label for="build">Build</label><select id="build"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></div><div><label for="skin">Skin</label><select id="skin"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></div></div><button id="save">Save avatar</button><div id="e" class="err" hidden></div><div id="ok" class="ok" hidden></div></form><p><a href="/account.html">Account</a> · <a href="/">DreamLedger</a></p></main><script>const state=document.getElementById('state'),f=document.getElementById('f'),e=document.getElementById('e'),o=document.getElementById('ok'),save=document.getElementById('save');(async()=>{try{const r=await fetch('/api/account/me',{credentials:'same-origin',cache:'no-store'});const j=await r.json();if(!j.authenticated){state.textContent='Please create an account or sign in first.';return}const a=j.account?.avatar;if(a){for(const k of ['height','build','skin'])if(a[k])document.getElementById(k).value=String(a[k])}state.textContent='Signed in as '+(j.account?.email||'Customer');f.hidden=false}catch(x){state.textContent='Could not load account.'}})();f.addEventListener('submit',async x=>{x.preventDefault();e.hidden=true;o.hidden=true;save.disabled=true;try{const avatar={height:Number(document.getElementById('height').value),build:Number(document.getElementById('build').value),skin:Number(document.getElementById('skin').value)};const r=await fetch('/api/account/update',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({avatar})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not save avatar.');const verify=await fetch('/api/account/me',{credentials:'same-origin',cache:'no-store'});const me=await verify.json();if(!me.authenticated||!me.account?.avatar)throw new Error('Avatar save returned but persistence could not be verified.');o.textContent='Avatar saved and persisted.';o.hidden=false}catch(x){e.textContent=x.message;e.hidden=false}finally{save.disabled=false}});</script></body></html>
