<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your account | DreamLedger</title>
<style>
body{margin:0;background:#090a0d;color:#f5f7f8;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 16px 70px}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px}.navlinks{display:flex;gap:8px;flex-wrap:wrap}.btn,button{display:inline-block;padding:11px 14px;border-radius:10px;border:1px solid #333;background:#15191f;color:#fff;font-weight:900;text-decoration:none;cursor:pointer}.primary{background:#f2c14e;color:#111;border-color:#f2c14e}.card{background:#111317;border:1px solid #292d35;border-radius:18px;padding:20px;margin-top:18px}.muted{color:#929aa6}label{display:block;margin:12px 0 6px;font-weight:800}input,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #393e48;background:#090a0d;color:#fff;font:inherit}textarea{min-height:90px}.msg{min-height:24px;margin-top:10px;color:#a9e6b1}.err{color:#ff8d8d;min-height:24px}.avatar{width:210px;height:260px;margin:15px auto;position:relative}.head{position:absolute;top:15px;left:61px;width:88px;height:88px;border-radius:50%;border:3px solid #080a0e}.body{position:absolute;top:110px;height:125px;border-radius:48% 48% 20% 20%;background:#56617b}.arm{position:absolute;top:122px;width:42px;height:100px;border-radius:28px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}@media(max-width:650px){.row{grid-template-columns:1fr}.nav{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<nav class="nav"><a href="/"><strong>DREAMLEDGER</strong></a><div class="navlinks"><a class="btn" href="/marketplace/">Marketplace</a><button id="logout" type="button">Log out</button></div></nav>
<h1 id="name">Your account</h1>
<p id="email" class="muted">Loading account...</p>
<div id="err" class="err"></div>
<section class="card">
<h2>Profile</h2>
<form id="profile">
<label for="displayName">Display name</label><input id="displayName" name="name" maxlength="60" required autocomplete="name">
<div class="row"><div><label for="sellerName">Seller display name</label><input id="sellerName" name="seller_display_name" maxlength="80"></div><div><label for="location">Location</label><input id="location" name="location" maxlength="100" autocomplete="address-level2"></div></div>
<label for="bio">Bio</label><textarea id="bio" name="bio" maxlength="500"></textarea>
<div class="actions"><button class="primary" type="submit">Save profile</button></div><div id="pm" class="msg"></div>
</form>
</section>
<section class="card">
<h2>Avatar</h2>
<p class="muted">Avatar settings belong to your DreamLedger account. Dreamiez is optional.</p>
<div class="avatar"><div class="head" id="head"></div><div class="body" id="body"></div><div class="arm" id="arm1"></div><div class="arm" id="arm2"></div></div>
<div class="row"><div><label for="height">Height</label><input id="height" type="range" min="1" max="6" value="3"></div><div><label for="build">Body build</label><input id="build" type="range" min="1" max="6" value="3"></div></div>
<label for="skin">Skin tone</label><input id="skin" type="range" min="1" max="6" value="4">
<div class="actions"><button id="saveAvatar" class="primary" type="button">Save avatar</button></div><div id="avatarMsg" class="msg"></div>
</section>
<section class="card"><h2>Account status</h2><p id="status" class="muted">Loading...</p><div class="actions"><a class="btn primary" href="/board">Open the Billboard</a><a class="btn" href="/">Back to DreamLedger</a></div></section>
</div>
<script>
'use strict';
const skin=['#4a2f23','#603d2d','#76503b','#8f6b55','#a87859','#c18b6c'];
let account=null;
const $=id=>document.getElementById(id);
function renderAvatar(){if(!account)return;const a=account.avatar||{};const h=Math.min(6,Math.max(1,Number(a.height)||3));const b=Math.min(6,Math.max(1,Number(a.build)||3));const s=Math.min(6,Math.max(1,Number(a.skin)||4));const tone=skin[s-1];$('head').style.background=tone;$('arm1').style.background=tone;$('arm2').style.background=tone;const widths=[110,126,142,158,174,190];const w=widths[b-1];$('body').style.width=w+'px';$('body').style.left=(210-w)/2+'px';$('height').value=h;$('build').value=b;$('skin').value=s;$('body').style.transform='scaleY('+(0.82+h*0.04)+')';}
async function load(){try{const r=await fetch('/api/account/me',{cache:'no-store',credentials:'same-origin'});const d=await r.json();if(!d.authenticated){location.replace('/login.html?next='+encodeURIComponent('/account.html'));return}account=d.account||d.user;$('name').textContent=account.name||'Your account';$('email').textContent=(account.email||'')+(account.email_verified?' - email verified':' - email verification pending');$('status').textContent='Account active. Dreamiez is optional.';$('displayName').value=account.name||'';$('sellerName').value=account.seller&&account.seller.display_name||account.name||'';$('location').value=account.seller&&account.seller.location||'';$('bio').value=account.seller&&account.seller.bio||'';renderAvatar();}catch(e){$('err').textContent='Account service unavailable. Please try again.';}}
$('profile').addEventListener('submit',async e=>{e.preventDefault();$('pm').textContent='Saving...';const r=await fetch('/api/account/update',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(Object.fromEntries(new FormData($('profile'))))});const d=await r.json().catch(()=>({}));$('pm').textContent=r.ok?'Profile saved.':(d.error||'Could not save profile.');if(r.ok){account=d.account||account;renderAvatar();}});
$('saveAvatar').addEventListener('click',async()=>{const payload={height:Number($('height').value),build:Number($('build').value),skin:Number($('skin').value)};$('avatarMsg').textContent='Saving...';const r=await fetch('/api/account/update',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({avatar:payload})});const d=await r.json().catch(()=>({}));$('avatarMsg').textContent=r.ok?'Avatar saved.':(d.error||'Could not save avatar.');if(r.ok){account=d.account||account;renderAvatar();}});
$('logout').addEventListener('click',async()=>{await fetch('/api/account/logout',{method:'POST',credentials:'same-origin'});location.replace('/');});
load();
</script>
</body>
</html>
