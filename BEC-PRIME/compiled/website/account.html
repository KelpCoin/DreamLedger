<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your account | DreamLedger</title><style>body{margin:0;background:#090a0d;color:#f5f7f8;font:16px/1.5 system-ui}.wrap{max-width:1050px;margin:auto;padding:24px 16px 70px}.nav{display:flex;justify-content:space-between;align-items:center}.btn,button{display:inline-block;padding:11px 14px;border-radius:10px;border:1px solid #333;background:#15191f;color:#fff;font-weight:900;text-decoration:none;cursor:pointer}.primary{background:#f2c14e;color:#111;border-color:#f2c14e}.grid{display:grid;grid-template-columns:1fr 1.3fr;gap:16px;margin-top:24px}.card{background:#111317;border:1px solid #292d35;border-radius:18px;padding:20px}.muted{color:#929aa6}label{display:block;margin:10px 0 5px;font-weight:800}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #393e48;background:#090a0d;color:#fff}textarea{min-height:90px}.msg{min-height:24px;margin-top:10px;color:#a9e6b1}.err{color:#ff8d8d;min-height:24px}.avatar{width:210px;height:260px;margin:0 auto 15px;position:relative}.head{position:absolute;top:15px;left:61px;width:88px;height:88px;border-radius:50%;border:3px solid #080a0e}.body{position:absolute;top:110px;left:30px;height:125px;border-radius:48% 48% 20% 20%;background:#56617b}.arm{position:absolute;top:122px;width:42px;height:100px;border-radius:28px}.photo{width:100%;max-height:260px;object-fit:cover;border-radius:14px}.car{display:none;border-top:1px solid #292d35;margin-top:14px;padding-top:10px}.listing{border:1px solid #292d35;border-radius:12px;padding:12px;margin-top:9px}.price{font-weight:900;color:#f2c14e}.photos{display:flex;gap:8px;flex-wrap:wrap}.photos img{width:80px;height:80px;object-fit:cover;border-radius:8px}@media(max-width:780px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><nav class="nav"><a href="/">DREAMLEDGER</a><div><a class="btn" href="/marketplace/">Marketplace</a> <button id="logout">Log out</button></div></nav><h1 id="name">Account</h1><p id="email" class="muted"></p><div id="err" class="err"></div><div class="grid"><section class="card"><h2>Profile</h2><form id="profile"><label>Display name</label><input name="name" maxlength="60" required><label>Seller display name</label><input name="seller_display_name" maxlength="80"><label>Location</label><input name="location" maxlength="100" placeholder="Auckland"><label>Seller bio</label><textarea name="bio" maxlength="500"></textarea><button class="primary">Save profile</button><div id="pm" class="msg"></div></form><h2>Avatar</h2><div class="avatar"><div class="head" id="head"></div><div class="body" id="body"></div><div class="arm" id="arm1"></div><div class="arm" id="arm2"></div></div><label>Height</label><input id="height" type="range" min="0" max="4" value="2"><label>Body build</label><input id="build" type="range" min="0" max="4" value="2"><label>Skin tone</label><input id="skin" type="range" min="0" max="9" value="5"><button id="saveAvatar" class="primary">Save avatar</button><p class="muted">Base avatar is free. Body/height/skin options are free. Paid cosmetics come later.</p><label>Optional photo</label><input id="avatarPhoto" type="file" accept="image/jpeg,image/png,image/webp"><div id="avatarMsg" class="msg"></div></section><section class="card"><h2>Sell something real</h2><p class="muted">Verified sellers can publish a real listing with real photos. Buying does not require an account.</p><form id="listing"><label>Title</label><input name="title" required><label>Category</label><select name="category" id="category"><option>Cars</option><option>Marketplace</option><option>B2B</option><option>Collectibles</option><option>MTG</option></select><label>Description</label><textarea name="description" required></textarea><label>Price NZD</label><input name="price" type="number" min="0.01" step="0.01" required><label>Condition</label><input name="condition"><label>Location</label><input name="location"><label>Photos</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple required><div id="photoPreview" class="photos"></div><div id="car" class="car"><h3>Car details</h3><label>Make</label><input id="make"><label>Model</label><input id="model"><label>Year</label><input id="year" type="number" min="1886" max="2100"><label>Kilometres</label><input id="kilometres" type="number" min="0"><label>WOF expiry</label><input id="wof" type="date"><label>Rego expiry</label><input id="rego" type="date"><label>Transmission</label><input id="transmission"><label>Fuel type</label><input id="fuel"><label>Body type</label><input id="bodyType"><label>Service history</label><textarea id="service"></textarea><label>Accident history</label><textarea id="accident"></textarea><label>VIN (private)</label><input id="vin" placeholder="Stored privately, not displayed"></div><button class="primary">Publish listing</button><div id="lm" class="msg"></div></form><h2>Your listings</h2><div id="mine" class="muted">Loading...</div></section></div></div><script>const skin=['#4a2f23','#603d2d','#76503b','#8f6b55','#a87859','#c18b6c','#d5a181','#e2b79b','#edc8b1','#f4d8c2'];let account=null;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function avatar(){if(!account)return;const a=account.avatar||{};const s=skin[a.skin]||skin[5];$('head').style.background=s;$('arm1').style.background=s;$('arm2').style.background=s;const widths=[110,130,150,170,190];$('body').style.width=widths[a.build]+'px';$('body').style.left=(210-widths[a.build])/2+'px';$('height').value=a.height??2;$('build').value=a.build??2;$('skin').value=a.skin??5;if(account.avatar_photo){$('avatarMsg').innerHTML='<img class="photo" src="'+esc(account.avatar_photo)+'" alt="Your avatar photo">'}}async function load(){const r=await fetch('/api/account/me',{cache:'no-store'});const d=await r.json();if(!d.authenticated){location.href='/login.html?next=/account.html';return}account=d.account;$('name').textContent=account.name||'Account';$('email').textContent=(account.email||'')+(account.email_verified?' · verified':' · email verification required');profile.name.value=account.name||'';profile.seller_display_name.value=account.seller?.display_name||account.name||'';profile.location.value=account.seller?.location||'';profile.bio.value=account.seller?.bio||'';avatar();const m=await fetch('/api/marketplace/listings');const x=await m.json();$('mine').innerHTML=(x.items||[]).filter(v=>v.seller_id===account.account_id).map(v=>'<div class="listing"><strong>'+esc(v.title)+'</strong> <span class="price">NZ$'+esc(v.price)+'</span><div class="muted">'+esc(v.status)+'</div></div>').join('')||'No live listings yet.'}profile.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/account/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(profile)))});const d=await r.json();$('pm').textContent=r.ok?'Profile saved.':d.error||'Could not save';if(r.ok)load()});$('saveAvatar').onclick=async()=>{const r=await fetch('/api/dreamiez/avatar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({height:+height.value,build:+build.value,skin:+skin.value,avatar_style:'dream'})});const d=await r.json();$('avatarMsg').textContent=r.ok?'Avatar saved.':d.error||'Could not save avatar';if(r.ok)load()};avatarPhoto.addEventListener('change',async()=>{const f=avatarPhoto.files[0];if(!f)return;const data=await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(f)});const r=await fetch('/api/dreamiez/avatar-photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mime:f.type,data})});const d=await r.json();$('avatarMsg').textContent=r.ok?'Photo uploaded.':d.error||'Upload failed';if(r.ok)load()});category.addEventListener('change',()=>{$('car').style.display=category.value==='Cars'?'block':'none'});photos.addEventListener('change',()=>{photoPreview.innerHTML='';Array.from(photos.files).slice(0,12).forEach(f=>{const img=document.createElement('img');img.src=URL.createObjectURL(f);photoPreview.appendChild(img)})});listing.addEventListener('submit',async e=>{e.preventDefault();lm.textContent='Uploading photos...';const ids=[];for(const f of Array.from(photos.files).slice(0,12)){const data=await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(f)});const r=await fetch('/api/marketplace/media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mime:f.type,data})});const d=await r.json();if(!r.ok){lm.textContent=d.error||'Photo upload failed';return}ids.push(d.id)}const payload=Object.fromEntries(new FormData(listing));payload.price=Number(payload.price);payload.photos=ids;payload.car=category.value==='Cars'?{make:make.value,model:model.value,year:+year.value,kilometres:+kilometres.value,wof_expiry:wof.value,rego_expiry:rego.value,transmission:transmission.value,fuel_type:fuel.value,body_type:bodyType.value,service_history:service.value,accident_history:accident.value,vin_private:vin.value}:null;const r=await fetch('/api/marketplace/listings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();lm.textContent=r.ok?'Listing is live.':d.error||'Could not publish';if(r.ok){listing.reset();photoPreview.innerHTML='';load()}});logout.onclick=async()=>{await fetch('/api/account/logout',{method:'POST'});location.href='/'};load();</script></body></html>
