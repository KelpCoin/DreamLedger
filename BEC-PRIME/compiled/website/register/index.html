<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Join · DreamLedger</title>
<style>
:root{--bg:#faf9f7;--ink:#14120f;--muted:#6b6560;--line:#e8e4de;--card:#fff;--dark:#14120f;--err:#b91c1c}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh}
a{color:inherit;text-decoration:none}.hdr{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line)}.brand{font-weight:700;font-size:1.2rem}
main{max-width:420px;margin:0 auto;padding:20px 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px}h1{font-size:1.6rem;margin-bottom:6px}.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
label{display:block;font-size:13px;font-weight:700;margin:0 0 8px}input{width:100%;min-height:52px;padding:0 14px;margin-bottom:14px;border:1.5px solid var(--line);border-radius:14px;font-size:16px}
button{width:100%;min-height:52px;border:0;border-radius:999px;background:var(--dark);color:#fff;font-weight:700;font-size:16px}button:disabled{opacity:.55}
.msg{margin-top:12px;font-size:14px;color:var(--err)}.sw{margin-top:16px;text-align:center;font-size:14px;color:var(--muted)}.sw a{font-weight:700;text-decoration:underline}
</style>
</head>
<body>
<header class="hdr"><a class="brand" href="/">DreamLedger</a><a href="/login" style="font-weight:700;padding:12px">Log in</a></header>
<main>
<div class="card">
<h1>Join free</h1>
<p class="sub">Email and password. No card required.</p>
<form id="f">
<label for="email">Email</label>
<input id="email" type="email" inputmode="email" autocomplete="email" required>
<label for="password">Password (min 8)</label>
<input id="password" type="password" autocomplete="new-password" required minlength="8">
<button type="submit" id="go">Create account</button>
<div id="msg" class="msg" role="alert"></div>
</form>
<p class="sw">Already joined? <a href="/login">Log in</a></p>
</div>
</main>
<script>
document.getElementById('f').onsubmit=async function(e){
e.preventDefault();var msg=document.getElementById('msg');var go=document.getElementById('go');
msg.textContent='';go.disabled=true;go.textContent='Creating…';
try{
var r=await fetch('/api/account/register',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});
var d=await r.json().catch(function(){return {};});
if(!r.ok)throw new Error(d.error||'Sign up failed');
location.href=d.next||'/';
}catch(x){msg.textContent=x.message;go.disabled=false;go.textContent='Create account';}
};
</script>
</body>
</html>
