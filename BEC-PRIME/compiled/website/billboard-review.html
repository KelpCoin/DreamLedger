<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamLedger Billboard Review</title><style>body{font:14px system-ui;background:#080808;color:#eee;margin:0;padding:24px}input,button,textarea{font:inherit;padding:10px;background:#111;color:#fff;border:1px solid #333;border-radius:8px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:20px}.card{border:1px solid #333;background:#111;border-radius:14px;padding:14px}.card img{width:100%;max-height:220px;object-fit:contain;background:#080808}.ok{color:#43d39a}</style></head><body><h1>DreamLedger Billboard Review</h1><p>Human approval gate. Nothing becomes public until approved.</p><input id="token" type="password" placeholder="Marketplace admin token"><button id="load">Load queue</button><div id="grid" class="grid"></div><script>(function(){const $=s=>document.querySelector(s);async function load(){const token=$('#token').value;const r=await fetch('/api/billboard/review-queue',{headers:{'x-marketplace-admin-token':token}});const d=await r.json();if(!r.ok)return $('#grid').textContent=d.error||'Failed';$('#grid').innerHTML=d.ads.length?d.ads.map(a=>'<article class="card"><img src="/billboard/media/'+a.id+'" alt=""><h2>'+a.title+'</h2><p>'+a.size_label+' · '+a.w+'x'+a.h+' · '+a.email+'</p><p>Gauntlet: <span class="ok">'+a.gauntlet+'</span></p><textarea id="n_'+a.id+'" placeholder="Review note"></textarea><br><br><button data-id="'+a.id+'" data-decision="APPROVE">Approve</button> <button data-id="'+a.id+'" data-decision="HOLD">Hold</button> <button data-id="'+a.id+'" data-decision="REJECT">Reject</button></article>').join(''):'<p>Queue empty.</p>';document.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>review(b.dataset.id,b.dataset.decision))}async function review(id,decision){const token=$('#token').value;const note=document.querySelector('#n_'+id).value;const r=await fetch('/api/billboard/review',{method:'POST',headers:{'Content-Type':'application/json','x-marketplace-admin-token':token},body:JSON.stringify({ad_id:id,decision,note})});const d=await r.json();alert(d.status||d.error);load()}$('#load').onclick=load})();</script></body></html>
