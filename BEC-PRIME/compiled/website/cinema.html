<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamLedger Cinema</title><style>:root{--bg:#0d0f0c;--p:#14170f;--l:#2a2f22;--g:#c9a24b;--c:#ece7d8;--d:#8b8f7d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--c);font:15px/1.5 ui-monospace,Consolas,monospace}.wrap{max-width:780px;margin:auto;padding:30px 18px 60px}h1{font:600 36px Georgia,serif}.g{color:var(--g)}.p{background:var(--p);border:1px solid var(--l);border-radius:8px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:var(--d);font-size:12px}input{width:100%;padding:9px;background:#10120e;color:var(--c);border:1px solid var(--l);border-radius:4px;margin-top:5px}button{padding:10px 14px;background:var(--p);color:var(--c);border:1px solid var(--l);border-radius:4px;cursor:pointer}.primary{color:var(--g);border-color:#66562f}pre{white-space:pre-wrap;color:var(--d);overflow:auto}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="g">DREAMLEDGER / CINEMA</div><h1>Deterministic Cinema <span class="g">v0.1</span></h1><p>Seeded simulation and proof artifact. This surface is independent of catalog inventory.</p><section class="p grid"><label>Seed<input id="seed" type="number" value="12345"></label><label>Turns<input id="turns" type="number" value="10" min="2" max="40"></label><label>Deck A<input id="a" value="Atraxa Superfriends"></label><label>Deck B<input id="b" value="Krenko Goblins"></label></section><section class="p"><button class="primary" id="run">Generate match</button><p id="result">Generate a match to begin.</p><pre id="proof">No proof yet.</pre></section></main><script>function rng(seed){let a=seed>>>0;return()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return('00000000'+(h>>>0).toString(16)).slice(-8)}run.onclick=()=>{const seed=Number(document.getElementById('seed').value)||0,n=Math.max(2,Math.min(40,Number(turns.value)||10)),a=document.getElementById('a').value||'Deck A',b=document.getElementById('b').value||'Deck B',r=rng(seed),events=[];let sa=0,sb=0;for(let i=1;i<=n;i++){const actor=r()<.5?'A':'B',name=actor==='A'?a:b,w=Number(r().toFixed(4));actor==='A'?sa+=w:sb+=w;events.push({turn:i,actor,name,weight:w})}const f={schema_version:'cinema-event-v1',seed,participants:[{id:'A',name:a},{id:'B',name:b}],events,result:{winner:sa>=sb?a:b,score_a:Number(sa.toFixed(4)),score_b:Number(sb.toFixed(4))}};const p={proof_type:'dreamledger-cinema-run',schema_version:f.schema_version,seed,event_count:n,fixture_hash_fnv1a:hash(JSON.stringify(f)),result:f.result};document.getElementById('result').textContent='Winner: '+f.result.winner+' | seed '+seed+' | '+n+' events';document.getElementById('proof').textContent=JSON.stringify(p,null,2)}</script></body></html>
