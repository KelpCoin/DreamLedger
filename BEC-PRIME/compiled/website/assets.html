<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assets | DreamLedger</title><style>body{margin:0;background:#090a0d;color:#f5f7f8;font:16px system-ui;padding:30px}.wrap{max-width:1000px;margin:auto}.muted{color:#929aa6}.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{border:1px solid #292d35;border-radius:16px;padding:20px;background:#111317}.price{font-size:1.5rem;font-weight:900}.tag{color:#f2c14e;font-size:.75rem;font-weight:900;text-transform:uppercase}.empty{border:1px dashed #59616d;border-radius:16px;padding:30px;color:#929aa6}a{color:#fff}</style></head>
<body><main class="wrap"><div class="muted">DREAMLEDGER / ASSETS</div><h1>Verified digital assets</h1><p class="muted">Only published, approved inventory is displayed here. This surface does not invent assets.</p><section id="catalog" class="rail"><div class="empty">Loading verified inventory...</div></section><p><a href="/">DreamLedger</a> · <a href="/account.html">Account</a> · <a href="/avatar.html">Avatar</a></p></main><script>(async()=>{const c=document.getElementById('catalog');try{const r=await fetch('/api/products',{cache:'no-store'});const j=await r.json();const items=Array.isArray(j.products)?j.products:[];if(!r.ok||!items.length){c.innerHTML='<div class="empty">Awaiting verified inventory.</div>';return}c.innerHTML=items.map(p=>'<article class="card"><div class="tag">'+String(p.silo||'Asset').replace(/[<>]/g,'')+'</div><h2>'+String(p.name||p.id).replace(/[<>]/g,'')+'</h2><p class="muted">'+String(p.description||'').replace(/[<>]/g,'')+'</p><div class="price">'+String(p.currency||'NZD')+' '+(Number(p.price||0)/100).toFixed(2)+'</div><p class="muted">Inventory: '+Number(p.inventory||0)+'</p></article>').join('')}catch(e){c.innerHTML='<div class="empty">Awaiting verified inventory.</div>'}})();</script></body></html>
