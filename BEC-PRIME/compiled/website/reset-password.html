<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password recovery | DreamLedger</title><style>body{margin:0;background:#090a0d;color:#f5f7f8;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(460px,90vw);background:#111317;border:1px solid #292d35;border-radius:20px;padding:28px}input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #393e48;background:#090a0d;color:#fff;font:inherit}button{background:#f2c14e;color:#111;border:0;font-weight:900}.muted{color:#929aa6}.msg{min-height:24px;margin-top:10px}</style></head><body><main class="box"><p><a href="/login.html">DreamLedger</a></p><h1>Recover your account</h1><p class="muted">Enter your email to request a reset. Use the reset link you receive to choose a new password.</p><form id="request"><input id="email" type="email" placeholder="Email" required><button>Request reset</button></form><form id="confirm" hidden><input id="token" placeholder="Reset token"><input id="password" type="password" minlength="8" placeholder="New password"><button>Set new password</button></form><div id="msg" class="msg"></div></main><script>const params=new URLSearchParams(location.search);if(params.get('token')){request.hidden=true;confirm.hidden=false;token.value=params.get('token')}request.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/account/password-reset/request',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value})});const d=await r.json();msg.textContent=d.message||'If the account exists, a reset link has been issued.';if(d.reset_url)msg.textContent+=' Smoke mode reset URL: '+d.reset_url});confirm.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/account/password-reset/confirm',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:token.value,password:password.value})});const d=await r.json();if(!r.ok){msg.textContent=d.error||'Reset failed';return}msg.textContent='Password changed. Redirecting...';setTimeout(()=>location.href='/account.html',700)});</script></body></html>
