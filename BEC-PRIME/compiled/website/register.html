<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | DreamLedger</title><style>body{margin:0;background:#090a0d;color:#f5f7f8;font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box}.box{width:min(460px,100%);background:#111317;border:1px solid #292d35;border-radius:20px;padding:28px;box-sizing:border-box}h1{font-size:2.8rem;letter-spacing:-.07em;margin:10px 0}.muted{color:#929aa6}label{display:block;margin:14px 0 6px;font-weight:800}input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #59616d;background:#090a0d;color:#fff;font:inherit}input:focus,button:focus,a:focus{outline:3px solid #f2c14e;outline-offset:3px}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#f2c14e;color:#111;font-weight:900;font-size:1rem;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.err{color:#ffb4b4;background:#351b1b;border:1px solid #713535;padding:10px;border-radius:8px;margin-top:12px}.ok{color:#b8f0c0;background:#17351d;border:1px solid #3b7845;padding:10px;border-radius:8px;margin-top:12px}.links{margin-top:18px}.links a{color:#fff}</style></head><body><main class="box" aria-labelledby="title"><div class="muted">DREAMLEDGER / ACCOUNT</div><h1 id="title">Create your account.</h1><p class="muted">You can create and use an account immediately. Email verification is required before selling.</p><form id="f" novalidate><label for="name">Name</label><input id="name" name="name" required maxlength="60" autocomplete="name"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email" inputmode="email"><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password"><button id="submit" type="submit">Create account</button><div id="e" class="err" role="alert" hidden></div><div id="ok" class="ok" role="status" hidden></div></form><div class="links"><a href="/login.html">Already have an account? Log in.</a></div></main><script>const form=document.getElementById('f'),button=document.getElementById('submit'),err=document.getElementById('e'),ok=document.getElementById('ok'),next=new URLSearchParams(location.search).get('next')||'/account.html';form.addEventListener('submit',async e=>{e.preventDefault();err.hidden=true;ok.hidden=true;button.disabled=true;try{const b=Object.fromEntries(new FormData(form));const r=await fetch('/api/dreamiez/account/create',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(b)});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||'Could not create account. Please try again.');ok.textContent=j.verification_sent?'Account created. Check your email to verify it.':'Account created. You are logged in. Email verification is still required before selling.';ok.hidden=false;setTimeout(()=>location.href='/account.html?created=1&next='+encodeURIComponent(next),350)}catch(ex){err.textContent=ex.message;err.hidden=false}finally{button.disabled=false}});</script></body></html>
