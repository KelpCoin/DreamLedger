<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | DreamLedger</title><style>body{margin:0;background:#090a0d;color:#f5f7f8;font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box}.box{width:min(460px,100%);background:#111317;border:1px solid #292d35;border-radius:20px;padding:28px;box-sizing:border-box}h1{font-size:2.8rem;letter-spacing:-.07em;margin:10px 0}.muted{color:#929aa6}label{display:block;margin:14px 0 6px;font-weight:800}input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #59616d;background:#090a0d;color:#fff;font:inherit}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#f2c14e;color:#111;font-weight:900;font-size:1rem;cursor:pointer}.err{color:#ffb4b4;background:#351b1b;border:1px solid #713535;padding:10px;border-radius:8px;margin-top:12px}.ok{color:#b8f0c0;background:#17351d;border:1px solid #3b7845;padding:10px;border-radius:8px;margin-top:12px}.links{margin-top:18px}.links a{color:#fff}</style></head><body><main class="box"><div class="muted">DREAMLEDGER / ACCOUNT</div><h1>Create your account.</h1><p class="muted">Create an account and start using DreamLedger immediately.</p><form id="f"><label>Name</label><input name="name" required maxlength="60" autocomplete="name"><label>Email</label><input name="email" type="email" required autocomplete="email"><label>Password</label><input name="password" type="password" minlength="8" required autocomplete="new-password"><button id="submit">Create account</button><div id="e" class="err" hidden></div><div id="ok" class="ok" hidden></div></form><div class="links"><a href="/login.html">Already have an account? Log in.</a></div></main><script>const f=document.getElementById('f'),b=document.getElementById('submit'),e=document.getElementById('e'),o=document.getElementById('ok');const next=new URLSearchParams(location.search).get('next')||'/account.html';(async()=>{try{const r=await fetch('/api/account/me',{credentials:'same-origin',cache:'no-store'});const j=await r.json();if(j.authenticated)location.replace(next)}catch{}})();f.addEventListener('submit',async x=>{x.preventDefault();e.hidden=true;o.hidden=true;b.disabled=true;try{const r=await fetch('/api/account/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(Object.fromEntries(new FormData(f)))});const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not create account.');const m=await fetch('/api/account/me',{credentials:'same-origin',cache:'no-store'});const me=await m.json();if(!me.authenticated)throw new Error('Account was created but the session was not retained.');o.textContent='Account created and you are signed in.';o.hidden=false;setTimeout(()=>location.replace(next),250)}catch(err){e.textContent=err.message;e.hidden=false}finally{b.disabled=false}});</script></body></html>
