<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | DreamLedger</title><style>body{margin:0;background:#090a0d;color:#f5f7f8;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(460px,90vw);background:#111317;border:1px solid #292d35;border-radius:20px;padding:28px}h1{font-size:2.8rem;letter-spacing:-.07em}.muted{color:#929aa6}label{display:block;margin:14px 0 6px;font-weight:800}input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #393e48;background:#090a0d;color:#fff}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#f2c14e;font-weight:900}.err{color:#ff8d8d;margin-top:12px}.links{margin-top:18px}</style></head><body><main class="box"><div class="muted">DREAMLEDGER / ACCOUNT</div><h1>Create your account.</h1><p class="muted">One real account for buying, selling and your avatar.</p><form id="f"><label>Name</label><input name="name" required maxlength="40"><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" minlength="8" required><button>Create account</button><div id="e" class="err"></div></form><div class="links"><a href="/login.html">Already have an account? Log in.</a></div></main><script>const next=new URLSearchParams(location.search).get('next')||'/account.html';f.addEventListener('submit',async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(f));const r=await fetch('/api/dreamiez/account/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok){document.querySelector('#e').textContent=j.error||'Could not create account';return}location.href=next;});</script></body></html>
