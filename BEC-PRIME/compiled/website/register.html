<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up · DreamLedger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/shop.css">
</head>
<body>
<header class="site-header">
  <a class="logo" href="/">DreamLedger</a>
  <nav class="header-nav"><a href="/login">Log in</a></nav>
</header>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create account</h1>
    <p class="sub">Email and password.</p>
    <form id="register">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password" required minlength="8">
      <button type="submit">Sign up</button>
      <div id="msg" class="msg" role="alert"></div>
    </form>
    <p class="switch">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>
<script>
document.getElementById('register').addEventListener('submit',async(e)=>{e.preventDefault();const m=document.getElementById('msg');m.textContent='';m.className='msg';try{const r=await fetch('/api/account/register',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Could not create account');location.href=d.next||'/avatar.html'}catch(err){m.className='msg error';m.textContent=err.message}});
</script>
</body>
</html>
