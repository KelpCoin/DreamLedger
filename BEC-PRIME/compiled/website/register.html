<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | DreamLedger</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#17191d}main{max-width:520px;margin:7vh auto;padding:28px;background:#fff;border:1px solid #ddd;border-radius:16px}h1{margin-top:0}label{display:block;margin:14px 0 6px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:9px;font:inherit}button{margin-top:18px;padding:12px 16px;border:0;border-radius:9px;background:#17191d;color:#fff;font:inherit;cursor:pointer}.muted{color:#666}.error{color:#b00020;margin-top:12px}a{color:inherit}</style></head><body><main><h1>Create account</h1><p class="muted">Create a standard DreamLedger account.</p><form id="register"><label>Name</label><input id="name" required><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="8" required><button type="submit">Create account</button><div id="msg"></div></form><p><a href="/login.html">Log in</a></p><script>document.getElementById("register").addEventListener("submit",async(e)=>{e.preventDefault();const m=document.getElementById("msg");try{const r=await fetch("/api/account/register",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error||"Registration failed");location.href=d.next||"/account.html"}catch(x){m.className="error";m.textContent=x.message}});</script></main></body></html>
