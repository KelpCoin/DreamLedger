<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DreamLedger | 500 lanes</title><meta name="description" content="Browse the DreamLedger public catalogue of 500 defined lanes."><style>:root{--bg:#0b0b0d;--card:#15151a;--ink:#f4f1e8;--muted:#9a978f;--gold:#d7aa43;--line:#2b2b32}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:20;background:#0b0b0de8;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;letter-spacing:-.05em}.brand span{color:var(--gold)}.actions{display:flex;gap:8px;align-items:center}.pill{border:1px solid var(--line);padding:8px 11px;border-radius:999px;font-size:12px;font-weight:800;background:#15151a}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#d9c47e);color:#111;border:2px solid #f4f1e8;font-weight:950}.wrap{max-width:1220px;margin:auto;padding:24px 16px 50px}.hero{padding:24px 0}.eyebrow{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.hero h1{font-size:clamp(42px,8vw,92px);line-height:.86;letter-spacing:-.08em;margin:10px 0}.hero p{max-width:680px;color:var(--muted)}.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.rail::-webkit-scrollbar{display:none}.card{flex:0 0 min(330px,82vw);min-height:270px;scroll-snap-align:start;background:linear-gradient(145deg,#18181e,#111116);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 14px 45px #0008}.num{color:var(--gold);font-size:12px;font-weight:950;letter-spacing:.1em}.card h2{font-size:24px;line-height:.98;letter-spacing:-.04em;margin:12px 0}.meta{color:var(--muted);font-size:12px}.go{display:inline-flex;align-items:center;justify-content:center;background:var(--gold);color:#111;border-radius:11px;padding:11px 13px;font-weight:950;font-size:12px;margin-top:16px}.count{color:var(--muted);font-size:12px;margin-top:6px}.streak{position:fixed;left:14px;bottom:14px;z-index:30;background:#15151a;border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-size:11px;font-weight:900;box-shadow:0 10px 35px #0008}.empty{padding:30px;color:var(--muted)}@media(max-width:650px){.actions .label{display:none}}</style></head><body><header class="top"><a class="brand" href="/">Dream<span>Ledger</span></a><div class="actions"><a class="pill" href="/register">Create account</a><a class="pill" href="/login">Log in</a><a class="avatar" href="/avatar" aria-label="Avatar">●</a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Public catalogue</div><h1>500 LANES.<br>ONE SWIPE.</h1><p>Browse every defined DreamLedger lane as a public catalogue. Visibility is not a claim of verified demand, inventory, or revenue. Those states remain evidence-gated.</p><div id="count" class="count">Loading catalogue…</div></section><section><div id="rail" class="rail"><div class="empty">Loading 500 lanes…</div></div></section></main><div class="streak" id="streak">Swipe streak: 0</div><script>(function(){var rail=document.getElementById("rail"),count=document.getElementById("count"),streak=document.getElementById("streak"),n=0,lastX=null;function esc(v){return String(v||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}rail.addEventListener("scroll",function(){var x=rail.scrollLeft;if(lastX!==null&&Math.abs(x-lastX)>80){n++;streak.textContent="Swipe streak: "+n}lastX=x});fetch("/api/silos",{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("catalogue unavailable");return r.json()}).then(function(d){var xs=d.silos||[];count.textContent=xs.length+" public lanes";rail.innerHTML=xs.map(function(x,i){var route="/silos.html?lane="+encodeURIComponent(x.id);return '<article class="card"><div><div class="num">LANE '+String(i+1).padStart(3,"0")+' · '+esc(x.id)+'</div><h2>'+esc(x.label)+'</h2><div class="meta">'+esc(x.inventory_mode||"ECONOMIC")+' · Canonical route '+esc(x.public_route||"not assigned")+'</div></div><a class="go" href="'+esc(route)+'">Open lane</a></article>'}).join("")||'<div class="empty">No lanes available.</div>';var q=new URLSearchParams(location.search).get("lane");if(q){setTimeout(function(){var target=document.getElementById("lane-"+q);if(target)target.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"})},150)}}).catch(function(e){count.textContent="Catalogue unavailable";rail.innerHTML='<div class="empty">'+esc(e.message)+'</div>'})})();</script></body></html>
