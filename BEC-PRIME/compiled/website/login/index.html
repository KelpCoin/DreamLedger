<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Log in · DreamLedger</title>
<style>
:root{--bg:#faf9f7;--ink:#14120f;--muted:#6b6560;--line:#e8e4de;--card:#fff;--dark:#14120f;--err:#b91c1c;--ok:#15803d}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;padding-bottom:24px}
a{color:inherit;text-decoration:none}.hdr{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line)}.brand{font-weight:700;font-size:1.2rem}
main{max-width:420px;margin:0 auto;padding:20px 16px}.trust{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.trust span{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);background:var(--card);padding:6px 10px;border-radius:999px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px}h1{font-size:1.6rem;margin-bottom:6px}.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
label{display:block;font-size:13px;font-weight:700;margin:0 0 8px}input{width:100%;min-height:52px;padding:0 14px;margin-bottom:14px;border:1.5px solid var(--line);border-radius:14px;font-size:16px}
button[type=submit]{width:100%;min-height:52px;border:0;border-radius:999px;background:var(--dark);color:#fff;font-weight:700;font-size:16px}button:disabled{opacity:.55}
.msg{margin-top:12px;font-size:14px;min-height:1.2em}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}.sw{margin-top:16px;text-align:center;font-size:14px;color:var(--muted)}.sw a{font-weight:700;text-decoration:underline}
</style>
</head>
<body>
<header class="hdr"><a class="brand" href="/">DreamLedger</a><a href="/register" style="font-weight:700;padding:12px">Join</a></header>
<main>
<div class="trust"><span>Stripe payments</span><span>NZD</span><span>No spam</span></div>
<div class="card">
<h1>Log in</h1>
<p class="sub">Email and password.</p>
<form id="f">
<label for="email">Email</label>
<input id="email" type="email" inputmode="email" autocomplete="email" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required>
<button type="submit" id="go">Log in</button>
<div id="msg" class="msg" role="alert"></div>
</form>
<p class="sw">No account? <a href="/register">Create one free</a></p>
</div>
</main>
<script>
document.getElementById('f').onsubmit=async function(e){
e.preventDefault();var msg=document.getElementById('msg');var go=document.getElementById('go');
msg.textContent='';msg.className='msg';go.disabled=true;go.textContent='Logging in…';
try{
var r=await fetch('/api/account/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});
var d=await r.json().catch(function(){return {};});
if(!r.ok)throw new Error(d.error||'Login failed');
location.href=d.next||'/';
}catch(x){msg.textContent=x.message;msg.className='msg err';go.disabled=false;go.textContent='Log in';}
};
</script>
</body>
</html>
