<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostic Ready | DreamLedger</title><style>body{margin:0;background:#0a0c10;color:#f5f3eb;font:16px/1.5 system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:50px 18px}.card{background:#11161d;border:1px solid #29323b;border-radius:20px;padding:28px}.gold{color:#d8b56b}.muted{color:#a7b0ba}pre{white-space:pre-wrap;background:#090c10;border:1px solid #35404a;border-radius:12px;padding:18px;overflow:auto}.btn{display:inline-block;background:#d8b56b;color:#111;padding:12px 16px;border-radius:10px;font-weight:900;text-decoration:none}</style></head><body><main class="wrap"><div class="gold">DREAMLEDGER / FULFILLMENT</div><h1>Your diagnostic</h1><div class="card"><p id="s" class="muted">Checking verified payment and report fulfillment...</p><pre id="r" hidden></pre><a id="back" class="btn" href="/mtg">Back to MTG</a></div></main><script>const p=new URLSearchParams(location.search),sid=p.get('session_id'),s=document.getElementById('s'),r=document.getElementById('r');async function run(){if(!sid){s.textContent='Missing checkout session.';return}try{const x=await fetch('/api/mtg/diagnostic/report?session_id='+encodeURIComponent(sid),{cache:'no-store'});const j=await x.json();if(!x.ok)throw new Error(j.error||'Report unavailable');s.textContent='FULFILLED. Your automated report is below. Report hash: '+j.report_hash;r.hidden=false;r.textContent=JSON.stringify(j,null,2)}catch(e){s.textContent='Payment received, but the report is not available yet. Refresh this page in a moment. '+e.message}}run();</script></body></html>
