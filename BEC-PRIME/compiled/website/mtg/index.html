<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DreamLedger | MTG Silo</title>
<style>
:root{--bg:#0b0d10;--panel:#12161b;--line:#2a313a;--text:#f3f5f7;--muted:#a5adb7;--accent:#d7b56d;--good:#86c99a;--danger:#ef8f8f;--max:900px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}.wrap{max-width:var(--max);margin:auto;padding:0 24px}.nav{padding:26px 0;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.12em}.hero{padding:72px 0 38px}.kicker{color:var(--accent);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.76rem}.hero h1{font-size:clamp(2.5rem,6vw,4.5rem);line-height:1;letter-spacing:-.04em;margin:14px 0}.hero p{color:var(--muted);font-size:1.1rem}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:30px;margin:16px 0}.card h2{margin-top:0}.meta{color:var(--muted)}.status{font-weight:800}.status.good{color:var(--good)}.status.bad{color:var(--danger)}.buy{display:inline-block;margin-top:18px;border:0;border-radius:8px;padding:14px 22px;background:var(--accent);color:#111;font-weight:800;font-size:1rem;cursor:pointer}.buy:disabled{opacity:.5;cursor:not-allowed}.message{margin-top:14px;color:var(--muted)}.note{border-top:1px solid var(--line);margin-top:24px;padding-top:20px;color:var(--muted)}.footer{border-top:1px solid var(--line);margin-top:60px;padding:28px 0 50px;color:#737c87;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
<header class="nav"><div class="brand">DREAMLEDGER / MTG</div></header>
<main id="app">
<section class="hero"><div class="kicker">Product silo</div><h1>Loading canonical product...</h1><p>The public surface is reading its state from the commerce engine.</p></section>
<section class="card"><p class="meta">Loading...</p></section>
</main>
<footer class="footer">DreamLedger · MTG silo · Engine-backed surface</footer>
</div>
<script>
(function(){
  var PRODUCT_ID='MTG-URZAS-LEGACY-PALINCHRON-FOIL-001';
  var app=document.getElementById('app');
  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function money(cents,currency){return (Number(cents)/100).toFixed(2)+' '+String(currency||'').toUpperCase();}
  async function load(){
    try{
      var r=await fetch('/api/products/'+encodeURIComponent(PRODUCT_ID),{cache:'no-store'});
      var p=await r.json();
      if(!r.ok) throw new Error(p.error||'Product lookup failed');
      var available=Number(p.inventory)>0 && p.status==='published';
      var status=available?'AVAILABLE':'SOLD / UNAVAILABLE';
      app.innerHTML='<section class="hero"><div class="kicker">Product silo</div><h1>'+esc(p.name)+'</h1><p>Live public representation of the canonical commerce-engine product record.</p></section>'+
        '<section class="card"><h2>'+esc(p.name)+'</h2><p class="meta">SKU: '+esc(p.id)+'</p><p>'+esc(p.description)+'</p><p class="status '+(available?'good':'bad')+'">ENGINE STATUS: '+esc(status)+'</p><p><strong>'+money(p.price,p.currency)+'</strong> · '+esc(p.inventory)+' available</p>'+ (available?'<button class="buy" id="buy" type="button">Buy securely with Stripe</button>':'<p class="meta">Checkout is unavailable because the engine reports this product as sold or unpublished.</p>') +'<div class="message" id="message"></div><div class="note">Price, inventory, status and product identity are read from the server-side canonical product record. The browser does not own commercial truth.</div></section>'+
        '<section class="card"><h2>Evidence boundary</h2><p class="meta">Payment is not claimed here. A transaction becomes evidence only after the verified payment webhook records the settlement.</p></section>';
      var buy=document.getElementById('buy');
      if(buy) buy.addEventListener('click',async function(){
        var message=document.getElementById('message'); buy.disabled=true; message.textContent='Creating secure checkout...';
        try{
          var cr=await fetch('/api/checkout/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_id:p.id,silo:p.silo})});
          var data=await cr.json(); if(!cr.ok) throw new Error(data.error||'Checkout creation failed');
          window.location.assign(data.checkout_url);
        }catch(e){buy.disabled=false;message.textContent=e.message;}
      });
    }catch(e){app.innerHTML='<section class="hero"><div class="kicker">Engine unavailable</div><h1>MTG surface cannot establish truth.</h1><p>'+esc(e.message)+'</p></section>'+'<section class="card"><p class="status bad">NO COMMERCIAL CLAIM MADE</p><p class="meta">The public surface refuses to invent product state when the commerce engine cannot provide it.</p></section>';
    }
  }
  load();
})();
</script>
</body>
</html>
