<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamLedger Chat</title><style>body{margin:0;background:#080808;color:#eee;font:15px system-ui}main{max-width:1000px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:260px 1fr;gap:14px;margin-top:14px}.panel{border:1px solid #292929;border-radius:16px;background:#111;padding:14px}.list button{display:block;width:100%;text-align:left;background:#151515;color:#eee;border:1px solid #292929;border-radius:10px;padding:10px;margin:7px 0;cursor:pointer}.messages{height:62vh;overflow:auto;padding:5px}.msg{max-width:80%;padding:11px 13px;border-radius:13px;margin:9px 0;white-space:pre-wrap}.user{margin-left:auto;background:#d9b34b;color:#111}.assistant{background:#1b1b1b}.composer{display:flex;gap:8px;margin-top:10px}.composer textarea{flex:1;min-height:55px;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:10px;padding:10px}.btn{background:#d9b34b;color:#111;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:1fr}.messages{height:55vh}}</style></head><body><main><div class="top"><h1>DreamLedger Chat</h1><div><a href="/account">Account</a> | <a href="/">Home</a></div></div><div id="status"></div><div class="grid"><aside class="panel"><button class="btn" id="new">New chat</button><div class="list" id="conversations"></div></aside><section class="panel"><div id="messages" class="messages"></div><form id="form" class="composer"><textarea id="input" placeholder="Message DreamLedger..."></textarea><button class="btn">Send</button></form></section></div></main><script>(async()=>{const $=s=>document.querySelector(s),status=$('#status');let current=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt){const r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json'},...opt});const x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||('HTTP '+r.status));return x}function renderMessages(ms){$('#messages').innerHTML=ms.map(m=>`<div class="msg ${m.role==='user'?'user':'assistant'}">${esc(m.content)}</div>`).join('');const box=$('#messages');box.scrollTop=box.scrollHeight}async function loadList(){const x=await api('/api/conversations');$('#conversations').innerHTML=x.conversations.map(c=>`<button data-id="${esc(c.id)}">${esc(c.title)}</button>`).join('')||'<p>No chats yet.</p>';$('#conversations').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(b.dataset.id))}async function open(id){current=id;const x=await api('/api/conversations/'+encodeURIComponent(id)+'/messages');renderMessages(x.messages)}$('#new').onclick=async()=>{const x=await api('/api/conversations',{method:'POST',body:JSON.stringify({title:'New chat'})});await loadList();await open(x.conversation.id)};$('#form').onsubmit=async e=>{e.preventDefault();const text=$('#input').value.trim();if(!text)return;try{if(!current){const x=await api('/api/conversations',{method:'POST',body:JSON.stringify({title:text.slice(0,60)})});current=x.conversation.id;await loadList()}const x=await api('/api/conversations/'+encodeURIComponent(current)+'/messages',{method:'POST',body:JSON.stringify({content:text})});$('#input').value='';renderMessages(x.messages);await loadList()}catch(err){status.textContent=err.message}};try{await loadList();const x=await api('/api/account/me');if(!x.authenticated){status.innerHTML='Please <a href="/login">log in</a> to use persistent chat.';$('#form').style.display='none';}else if($('#conversations button')){const first=$('#conversations button');if(first)await open(first.dataset.id)}}catch(err){status.textContent=err.message}})();</script></body></html>
