<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listing | DreamLedger</title><style>body{margin:0;background:#090a0d;color:#f5f7f8;font:16px/1.5 system-ui}.wrap{max-width:1000px;margin:auto;padding:24px 16px}.nav{display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:28px}.card{background:#111317;border:1px solid #292d35;border-radius:18px;padding:20px}.hero{width:100%;height:420px;object-fit:cover;border-radius:14px;background:#171b22}.thumbs{display:flex;gap:8px;margin-top:8px;overflow:auto}.thumbs img{width:80px;height:80px;object-fit:cover;border-radius:8px}.price{font-size:2rem;font-weight:950;color:#f2c14e}.btn{display:block;text-align:center;padding:14px;border:0;border-radius:10px;background:#f2c14e;color:#111;font-weight:950;text-decoration:none;cursor:pointer}.muted{color:#929aa6}.tag{font-size:.7rem;text-transform:uppercase;color:#929aa6;letter-spacing:.08em}.car{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv{padding:10px;background:#171b22;border-radius:8px}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{height:300px}}</style></head><body><div class="wrap"><nav class="nav"><a href="/marketplace/">Back to marketplace</a><a href="/account.html">Account</a></nav><div id="app">Loading...</div></div><script>const id=new URLSearchParams(location.search).get('id');const app=document.getElementById('app');function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function load(){if(!id){app.textContent='Missing listing id';return}const r=await fetch('/api/marketplace/listings/'+encodeURIComponent(id));const d=await r.json();if(!r.ok){app.textContent=d.error||'Listing not found';return}const x=d.item;const photos=x.photos||[];const first=photos[0]?'/api/marketplace/media/'+encodeURIComponent(photos[0]):'';let car='';if(x.car)car='<div class="car">'+[['Make',x.car.make],['Model',x.car.model],['Year',x.car.year],['Kilometres',x.car.kilometres],['WOF expiry',x.car.wof_expiry],['Rego expiry',x.car.rego_expiry],['Transmission',x.car.transmission],['Fuel',x.car.fuel_type],['Body',x.car.body_type]].map(k=>'<div class="kv"><strong>'+esc(k[0])+'</strong><br>'+esc(k[1])+'</div>').join('')+'</div>';app.innerHTML='<div class="grid"><section class="card">'+(first?'<img class="hero" src="'+esc(first)+'" alt="'+esc(x.title)+'">':'<div class="hero"></div>')+'<div class="thumbs">'+photos.map(p=>'<img src="/api/marketplace/media/'+encodeURIComponent(p)+'" alt="">').join('')+'</div></section><section class="card"><div class="tag">'+esc(x.category)+'</div><h1>'+esc(x.title)+'</h1><div class="price">NZ$'+esc(x.price)+'</div><p>'+esc(x.description)+'</p><p class="muted">'+esc(x.location||'')+' · '+esc(x.condition||'')+'</p><p><strong>Seller:</strong> '+esc(x.seller_profile?.display_name||x.seller_name)+'</p><button id="buy" class="btn">Buy without an account</button><p id="msg" class="muted"></p>'+car+'</section></div>';document.getElementById('buy').onclick=async()=>{buy.disabled=true;msg.textContent='Creating secure checkout...';const r=await fetch('/api/marketplace/listings/'+encodeURIComponent(id)+'/checkout',{method:'POST'});const d=await r.json();if(!r.ok){msg.textContent=d.error||'Checkout unavailable';buy.disabled=false;return}location.href=d.checkout_url}}load();</script></body></html>
