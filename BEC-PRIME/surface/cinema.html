<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="DreamLedger deterministic cinema simulation and proof surface."><title>DreamLedger Cinema</title><style>:root{--bg:#0d0f0c;--panel:#14170f;--line:#2a2f22;--gold:#c9a24b;--cream:#ece7d8;--dim:#8b8f7d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:15px/1.5 ui-monospace,Consolas,monospace}.wrap{max-width:780px;margin:auto;padding:30px 18px 60px}h1{font:600 36px Georgia,serif}.gold{color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;margin:14px 0}label{display:block;color:var(--dim);font-size:12px;margin:10px 0}input{width:100%;padding:9px;background:#10120e;color:var(--cream);border:1px solid var(--line);border-radius:4px}button{padding:10px 14px;background:var(--panel);color:var(--cream);border:1px solid var(--line);border-radius:4px;cursor:pointer}.primary{color:var(--gold);border-color:#66562f}.event{font:20px Georgia,serif;min-height:50px;padding:14px 0}.proof pre{white-space:pre-wrap;overflow:auto;color:var(--dim)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><div class="gold">DREAMLEDGER / CINEMA</div><h1>Deterministic Cinema <span class="gold">v0.1</span></h1><p>Seeded simulation surface. Same seed and inputs reproduce the same event stream and proof hash.</p><section class="panel grid"><label>Seed<input id="seed" type="number" value="12345"></label><label>Turns<input id="turns" type="number" value="10" min="2" max="40"></label><label>Deck A<input id="a" value="Atraxa Superfriends"></label><label>Deck B<input id="b" value="Krenko Goblins"></label></section><section class="panel"><button class="primary" id="run">Generate match</button><div id="event" class="event">Generate a match to begin.</div><div id="result"></div></section><section class="panel proof"><b>Proof artifact</b><pre id="proof">No run yet.</pre></section><p style="color:var(--dim);font-size:11px">schema_version: cinema-event-v1 | no server dependency | separate from catalog inventory</p></main><script>function rng(seed){let a=seed>>>0;return()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return('00000000'+(h>>>0).toString(16)).slice(-8)}document.getElementById('run').onclick=()=>{const seed=Number(document.getElementById('seed').value)||0,turns=Math.max(2,Math.min(40,Number(document.getElementById('turns').value)||10)),a=document.getElementById('a').value||'Deck A',b=document.getElementById('b').value||'Deck B',r=rng(seed),events=[];let sa=0,sb=0;for(let i=1;i<=turns;i++){const actor=r()<.5?'A':'B',name=actor==='A'?a:b,weight=Number(r().toFixed(4));if(actor==='A')sa+=weight;else sb+=weight;events.push({turn:i,actor,name,weight})}const winner=sa>=sb?a:b;const fixture={schema_version:'cinema-event-v1',seed,participants:[{id:'A',name:a},{id:'B',name:b}],events,result:{winner,score_a:Number(sa.toFixed(4)),score_b:Number(sb.toFixed(4))}};const p={proof_type:'dreamledger-cinema-run',generated_at:new Date().toISOString(),schema_version:fixture.schema_version,seed,participant_names:[a,b],event_count:events.length,result:fixture.result,fixture_hash_fnv1a:hash(JSON.stringify(fixture))};document.getElementById('event').textContent=`Winner: ${winner} | seed ${seed} | ${events.length} events`;document.getElementById('result').textContent=events.map(e=>`Turn ${e.turn}: ${e.name} [${e.weight}]`).join(' | ');document.getElementById('proof').textContent=JSON.stringify(p,null,2)}</script></body></html>
