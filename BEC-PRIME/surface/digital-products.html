<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="DreamLedger Digital Products silo."><title>Digital Products | DreamLedger</title><style>:root{--bg:#070707;--panel:#111;--line:#292929;--ink:#f7f7f3;--muted:#969693;--gold:#f2c14e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 18px 60px}a{color:inherit;text-decoration:none}.nav{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:14px 0}.eyebrow{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(3rem,7vw,6rem);line-height:.9;letter-spacing:-.08em}.muted{color:var(--muted)}.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory}.card{flex:0 0 320px;scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.price{color:var(--gold);font-size:1.4rem;font-weight:900}.btn{display:inline-block;margin-top:14px;padding:11px 15px;border:1px solid #333;border-radius:10px}.gold{background:var(--gold);color:#090909;border-color:var(--gold)}</style></head><body><main class="wrap"><nav class="nav"><a href="/">DREAMLEDGER</a><a href="/">Back to catalog</a></nav><header><div class="eyebrow">SILO_DIGITAL_PRODUCTS</div><h1>Digital Products.</h1><p class="muted">Standalone templates, guides, checklists, calculators and workflow packs. This silo does not import MTG, adult, avatar or media inventory.</p></header><section><div id="rail" class="rail"><article class="card"><h2>Loading...</h2></article></div></section></main><script>(async()=>{const rail=document.getElementById('rail');try{const r=await fetch('/api/products',{cache:'no-store'}),d=await r.json();const items=(Array.isArray(d.products)?d.products:[]).filter(p=>String(p.silo).toLowerCase()==='digital-products'&&p.checkout_available);rail.innerHTML=items.length?items.map(p=>`<article class="card"><div class="eyebrow">${String(p.silo)}</div><h2>${String(p.name).replace(/[<>]/g,'')}</h2><p class="muted">${String(p.description||'').replace(/[<>]/g,'')}</p><div class="price">${String(p.currency||'NZD').toUpperCase()} ${Number(p.price||0).toFixed(2)}</div><a class="btn gold" href="/marketplace.html">Buy via catalog</a></article>`).join(''):'<article class="card"><h2>No published digital products</h2><p class="muted">The silo is live and empty inventory is valid.</p></article>'}catch(e){rail.innerHTML='<article class="card"><h2>Catalog unavailable</h2></article>'}})();</script></body></html>
