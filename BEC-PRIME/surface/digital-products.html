<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Products | DreamLedger</title><style>:root{--bg:#070707;--p:#111;--l:#292929;--i:#f7f7f3;--m:#969693;--g:#f2c14e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:16px/1.5 system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 18px 60px}a{color:inherit;text-decoration:none}.nav{display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding:14px 0}.e{color:var(--g);font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(3rem,7vw,6rem);line-height:.9;letter-spacing:-.08em}.m{color:var(--m)}.rail{display:flex;gap:14px;overflow-x:auto}.card{flex:0 0 320px;background:var(--p);border:1px solid var(--l);border-radius:18px;padding:20px}.price{color:var(--g);font-size:1.4rem;font-weight:900}.btn{display:inline-block;margin-top:14px;padding:11px 15px;border:1px solid #333;border-radius:10px}.gold{background:var(--g);color:#090909;border-color:var(--g)}</style></head><body><main class="wrap"><nav class="nav"><a href="/">DREAMLEDGER</a><a href="/">Back to catalog</a></nav><header><div class="e">SILO_DIGITAL_PRODUCTS</div><h1>Digital Products.</h1><p class="m">Standalone templates, guides, checklists, calculators and workflow packs. This silo does not import MTG or other silo inventory.</p></header><section id="rail" class="rail"><article class="card"><h2>Loading...</h2></article></section></main><script>(async()=>{const rail=document.getElementById('rail');try{const r=await fetch('/api/products',{cache:'no-store'}),d=await r.json(),items=(d.products||[]).filter(p=>String(p.silo).toLowerCase()==='digital-products'&&p.checkout_available);rail.innerHTML=items.length?items.map(p=>`<article class="card"><div class="e">DIGITAL PRODUCTS</div><h2>${String(p.name).replace(/[<>]/g,'')}</h2><p class="m">${String(p.description||'').replace(/[<>]/g,'')}</p><div class="price">${String(p.currency||'NZD').toUpperCase()} ${Number(p.price||0).toFixed(2)}</div><a class="btn gold" href="/marketplace.html">Buy via catalog</a></article>`).join(''):'<article class="card"><h2>No published digital products</h2><p class="m">Empty inventory is valid.</p></article>'}catch(e){rail.innerHTML='<article class="card"><h2>Catalog unavailable</h2></article>'}})();</script></body></html>
