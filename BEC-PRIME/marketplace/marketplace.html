<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace | DreamLedger</title><style>body{margin:0;background:#090a0d;color:#f5f7f8;font:16px/1.5 system-ui}.wrap{max-width:1180px;margin:auto;padding:18px 16px 70px}.nav{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292d35;padding-bottom:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border:1px solid #333;border-radius:10px;background:#15191f;color:#fff;text-decoration:none;font-weight:900}.primary{background:#f2c14e;color:#111;border-color:#f2c14e}.hero{padding:38px 0 20px}.eyebrow{font:900 .65rem ui-monospace;letter-spacing:.15em;text-transform:uppercase;color:#f2c14e}h1{font-size:clamp(3rem,8vw,6rem);line-height:.88;letter-spacing:-.08em;margin:10px 0}.muted{color:#929aa6}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:9px;margin:20px 0}input,select{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #393e48;background:#111317;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#111317;border:1px solid #292d35;border-radius:18px;overflow:hidden}.thumb{height:210px;background:#171b22;display:grid;place-items:center}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:16px}.price{font-size:1.2rem;font-weight:950;color:#f2c14e}.tag{font-size:.7rem;color:#929aa6;text-transform:uppercase;letter-spacing:.08em}.empty{padding:30px;border:1px dashed #393e48;border-radius:16px}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.filters,.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><nav class="nav"><a href="/">DREAMLEDGER</a><div class="actions"><a class="btn" href="/account.html">Account</a><a class="btn primary" href="/register.html?next=/account.html">Sell something</a></div></nav><header class="hero"><div class="eyebrow">Open marketplace</div><h1>Find something real.</h1><p class="muted">Real sellers. Real photos. Real prices. Buying does not require an account.</p></header><section class="filters"><input id="q" placeholder="Search"><select id="category"><option value="">All categories</option><option>Cars</option><option>Marketplace</option><option>B2B</option><option>Collectibles</option><option>MTG</option></select><input id="location" placeholder="Location"><input id="min" type="number" placeholder="Min NZD"><input id="max" type="number" placeholder="Max NZD"></section><section><select id="sort" style="max-width:220px;margin-bottom:14px"><option value="newest">Newest</option><option value="price_asc">Price low to high</option><option value="price_desc">Price high to low</option></select><div id="grid" class="grid"></div></section></div><script>const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function load(){const p=new URLSearchParams();if(q.value)p.set('q',q.value);if(category.value)p.set('category',category.value);if(location.value)p.set('location',location.value);if(min.value)p.set('min',min.value);if(max.value)p.set('max',max.value);p.set('sort',sort.value);const r=await fetch('/api/marketplace/listings?'+p.toString(),{cache:'no-store'});const d=await r.json();grid.innerHTML='';if(!d.items?.length){grid.innerHTML='<div class="empty">No live listings match those filters.</div>';return}d.items.forEach(x=>{const c=document.createElement('article');c.className='card';const photo=x.photos?.[0]?'<img src="/api/marketplace/media/'+encodeURIComponent(x.photos[0])+'" alt="">':'<span class="muted">No photo</span>';c.innerHTML='<div class="thumb">'+photo+'</div><div class="body"><div class="tag">'+esc(x.category)+'</div><h2>'+esc(x.title)+'</h2><div class="price">NZ$'+esc(x.price)+'</div><p class="muted">'+esc(x.location||'')+' · '+esc(x.condition||'')+'</p><a class="btn primary" href="/listing.html?id='+encodeURIComponent(x.id)+'">View listing</a></div>';grid.appendChild(c)})}['q','category','location','min','max','sort'].forEach(id=>$(id).addEventListener('input',load));load();</script></body></html>
