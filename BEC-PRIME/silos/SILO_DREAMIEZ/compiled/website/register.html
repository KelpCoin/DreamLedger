<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | DreamLedger</title><style>body{margin:0;background:#090b10;color:#fff;font-family:system-ui,sans-serif}.wrap{max-width:560px;margin:0 auto;padding:70px 20px}.panel{background:#141822;border:1px solid #2b3242;border-radius:24px;padding:28px}.eyebrow{color:#ff63b6;font-size:.7rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{font-size:3.5rem;line-height:.9;letter-spacing:-.07em;margin:12px 0 18px}p{color:#aeb5c8;line-height:1.55}label{display:block;color:#aeb5c8;font-size:.78rem;font-weight:800;margin:15px 0 6px}input{width:100%;box-sizing:border-box;background:#0d1019;color:#fff;border:1px solid #30364c;border-radius:10px;padding:12px}button{margin-top:18px;width:100%;border:0;border-radius:11px;padding:13px;background:#ff63b6;color:#170d15;font-weight:950;cursor:pointer}.note{font-size:.75rem;color:#747b90;margin-top:14px}.error{color:#ff8b8b;min-height:20px}.back{display:inline-block;margin-top:18px;color:#ff9bd1;text-decoration:none;font-weight:800}</style></head><body><div class="wrap"><div class="panel"><div class="eyebrow">DreamLedger identity</div><h1>Create your account.</h1><p>You can browse and buy without an account. A verified account is required to sell.</p><form id="form"><label for="name">Display name</label><input id="name" maxlength="40" value="Dreamer" required><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><div id="error" class="error"></div><button>Create account</button></form><div class="note">We will email you a verification link. Your base avatar is free. Optional cosmetics can be earned or purchased.</div><a class="back" href="/dreamiez/login.html">Already have an account?</a><br><a class="back" href="/">Back to DreamLedger</a></div></div><script>(async function(){const form=document.getElementById('form'),error=document.getElementById('error');form.addEventListener('submit',async function(e){e.preventDefault();error.textContent='';try{const r=await fetch('/api/dreamiez/account/create',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Account creation failed');location.href=d.next||'/dreamiez/verify-email.html'}catch(err){error.textContent=err.message}})})();</script></body></html>
