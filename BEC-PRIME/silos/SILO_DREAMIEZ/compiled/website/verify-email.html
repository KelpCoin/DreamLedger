<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify email | DreamLedger</title><style>body{margin:0;background:#090b10;color:#f7f8fb;font:16px/1.5 system-ui,sans-serif}.wrap{max-width:620px;margin:0 auto;padding:80px 20px}.panel{background:#141822;border:1px solid #2b3242;border-radius:24px;padding:30px}.eyebrow{color:#ff63b6;font:900 .65rem ui-monospace,monospace;letter-spacing:.15em;text-transform:uppercase}h1{font-size:clamp(2.8rem,8vw,5rem);line-height:.9;letter-spacing:-.08em;margin:12px 0}p{color:#9da6b7}.ok{color:#78e3a0;font-weight:850}.err{color:#ff9b9b;font-weight:850}.btn{display:inline-block;margin-top:18px;padding:11px 15px;border-radius:12px;background:#ff63b6;color:#180d15;text-decoration:none;font-weight:900}</style></head><body><main class="wrap"><section class="panel"><div class="eyebrow">DreamLedger identity</div><h1 id="title">Checking your email.</h1><p id="msg">One moment.</p><a id="go" class="btn" href="/dreamiez/account.html" style="display:none">Open account</a><a id="login" class="btn" href="/dreamiez/login.html" style="display:none">Log in</a></section></main><script>(function(){var q=new URLSearchParams(location.search),token=q.get('token'),msg=document.getElementById('msg'),title=document.getElementById('title'),go=document.getElementById('go'),login=document.getElementById('login');if(!token){title.textContent='Check your inbox.';msg.textContent='Use the verification link in the email we sent you.';login.style.display='inline-block';return;}fetch('/api/dreamiez/account/verify?token='+encodeURIComponent(token)).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Verification failed');return d})}).then(function(){title.textContent='Email verified.';msg.textContent='Your account is ready. You can now customize your avatar and sell real items.';msg.className='ok';go.style.display='inline-block'}).catch(function(e){title.textContent='Verification failed.';msg.textContent=e.message;msg.className='err';login.style.display='inline-block'})})();</script></body></html>
