services:
  - type: web
    name: dreamledger
    runtime: node
    rootDir: BEC-PRIME
    buildCommand: test -f compiled/website/index.html && test -f compiled/website/mtg/index.html && test -f catalog/products/MTG-URZAS-LEGACY-PALINCHRON-FOIL-001.json && echo "Verified DreamLedger production assets"
    startCommand: node server.js
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://dreamledger.org
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
