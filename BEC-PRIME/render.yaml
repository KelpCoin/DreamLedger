services:
  - type: web
    name: dreamledger
    runtime: node
    rootDir: BEC-PRIME
    buildCommand: npm install && npm run compile:offers && npm run compile:surface && node --check server.js && node --check start.js && node --check dreamiez-account.js && node --check scripts/smoke-dreamiez.js && node --check scripts/meta-gauntlet.js && node --check gauntlet/GauntletV6.js && node --check elohim/ElohimV6.js && node --check proxy/DigitalProxy.js && node --check proxy/DigitalProxyAssistant.js && node --check runtime/ControlPlane.js && node --check runtime/DemandRadar.js && node --check runtime/Sentinel.js && test -s compiled/website/index.html && test -s compiled/website/assets/marketplace-live.js && test -s compiled/website/assets/digital-proxy-assist.js && test -s catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json && test -s catalog/offers/offers.json && node scripts/meta-gauntlet.js
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: dreamledger-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://dreamledger.org
      - key: LEDGER_DATA_DIR
        value: /var/data/ledger
      - key: PROOF_DATA_DIR
        value: /var/data/proofs
      - key: DREAMIEZ_DATA_DIR
        value: /var/data/dreamiez
      - key: DEMAND_RADAR_DATA_DIR
        value: /var/data/demand
      - key: DIGITAL_PROXY_APPROVAL_TOKEN
        generateValue: true
      - key: DIGITAL_PROXY_LM_ENABLED
        value: "false"
      - key: DIGITAL_PROXY_LM_BASE_URL
        value: http://127.0.0.1:1234/v1
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
