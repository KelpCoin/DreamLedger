services:
  - type: web
    name: dreamledger
    runtime: node
    rootDir: BEC-PRIME
    buildCommand: npm install && npm run compile:offers && npm run compile:surface && node --check server.js
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://dreamledger.org
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: LEDGER_DATA_DIR
        value: /var/data/ledger
      - key: PROOF_DATA_DIR
        value: /var/data/proofs
