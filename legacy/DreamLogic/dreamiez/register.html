<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamiez | Register</title><style>body{font-family:system-ui;background:#05070b;color:#eef;padding:40px}main{max-width:640px;margin:auto}a{color:#7ee7ff}input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 14px;background:#0b1118;color:#fff;border:1px solid #344957;border-radius:8px}button{padding:12px 18px}</style></head><body><main><a href="/">DreamLedger</a><h1>Make your Dreamy</h1><p>Create a real Dreamiez account. Shared assets can remain interoperable while economic permissions stay siloed.</p><form id="f"><label>Email<br><input id="email" required type="email"></label><label>Password<br><input id="password" required type="password" minlength="10"></label><label>Display name<br><input id="name" maxlength="80"></label><button>Create account</button></form><p id="msg"></p><p>Already registered? <a href="/dreamiez/login.html">Log in</a></p><script>f.onsubmit=async e=>{e.preventDefault();msg.textContent='Creating...';const r=await fetch('/api/account/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value,display_name:name.value}),credentials:'include'});const j=await r.json();if(!r.ok){msg.textContent=j.error||'Registration failed';return}location.href='/dreamiez/index.html'};</script></main></body></html>
