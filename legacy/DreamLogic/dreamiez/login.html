<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamiez | Login</title><style>body{font-family:system-ui;background:#05070b;color:#eef;padding:40px}main{max-width:640px;margin:auto}a{color:#7ee7ff}input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 14px;background:#0b1118;color:#fff;border:1px solid #344957;border-radius:8px}button{padding:12px 18px}</style></head><body><main><a href="/">DreamLedger</a><h1>Dreamiez Login</h1><form id="f"><label>Email<br><input id="email" required type="email"></label><label>Password<br><input id="password" required type="password" minlength="10"></label><button>Log in</button></form><p id="msg"></p><p><a href="/dreamiez/register.html">Create a Dreamiez account</a> | <a href="/marketplace">B2B marketplace</a></p><script>f.onsubmit=async e=>{e.preventDefault();msg.textContent='Logging in...';const r=await fetch('/api/account/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value}),credentials:'include'});const j=await r.json();if(!r.ok){msg.textContent=j.error||'Login failed';return}location.href='/dreamiez/index.html'};</script></main></body></html>
