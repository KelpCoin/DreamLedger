<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in | DreamLedger</title>
<style>body{font-family:system-ui,sans-serif;max-width:28rem;margin:4rem auto;padding:1rem}label,input,button{display:block;width:100%;box-sizing:border-box}input,button{padding:.8rem;margin:.4rem 0 1rem}button{cursor:pointer}#status{min-height:1.5rem}</style>
</head>
<body>
<main>
<h1>Sign in</h1>
<form id="login" novalidate>
<label for="email">Email</label>
<input id="email" name="email" type="email" autocomplete="email" required>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button>
<p id="status" role="status" aria-live="polite"></p>
</form>
<p><a href="register.html">Create an account</a></p>
</main>
<script>
const form=document.getElementById('login');const status=document.getElementById('status');
form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Signing in...';
try{const r=await fetch('/api/account/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email:form.email.value.trim(),password:form.password.value})});
const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Sign-in failed');window.location.href=data.redirect||'/';}
catch(err){status.textContent=err.message;}});
</script>
</body>
</html>
