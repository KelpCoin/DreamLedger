<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamLedger | Create account</title><style>body{font-family:system-ui;background:#05070b;color:#eef;padding:40px}main{max-width:640px;margin:auto}a{color:#7ee7ff}input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 14px;background:#0b1118;color:#fff;border:1px solid #344957;border-radius:8px}button{padding:12px 18px}</style></head><body><main><a href="/">DreamLedger</a><h1>Create your B2B marketplace account</h1><p>This creates a real account on the production application. Passwords are hashed server-side and sessions use an HttpOnly cookie.</p><form id="f"><label>Email<br><input id="email" required type="email"></label><label>Password<br><input id="password" required type="password" minlength="10"></label><label>Display name<br><input id="name" maxlength="80"></label><button>Create account</button></form><p id="msg"></p><p>Already registered? <a href="/login.html">Log in</a> or go to the <a href="/marketplace">B2B marketplace</a>.</p><script>f.onsubmit=async e=>{e.preventDefault();msg.textContent='Creating...';try{const r=await fetch('/api/account/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value,display_name:name.value}),credentials:'include'});const j=await r.json().catch(()=>({}));if(!r.ok){msg.textContent=j.error||'Registration failed';return}location.href='/marketplace'}catch(err){msg.textContent='Service unavailable. Try again.'}};</script></main></body></html>
