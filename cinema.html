<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="DreamLedger Cinema deterministic simulation and proof surface.">
<title>DreamLedger Cinema</title>
<style>
:root{--bg:#0d0f0c;--bg-panel:#14170f;--line:#2a2f22;--reel:#1a1d14;--gold:#c9a24b;--gold-dim:#7a6534;--cream:#ece7d8;--dim:#8b8f7d;--a-color:#7fae8c;--b-color:#c97757}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--cream);font-family:ui-monospace,'SF Mono','Cascadia Code','Courier New',monospace;min-height:100vh}.wrap{max-width:760px;margin:0 auto;padding:32px 20px 60px}.masthead{text-align:center;margin-bottom:28px}.masthead .eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:6px}.masthead h1{font-family:Georgia,'Times New Roman',serif;font-weight:600;font-size:34px;letter-spacing:.01em;margin:0}.masthead h1 span{color:var(--gold);font-style:italic;font-weight:400}.config-row{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 14px}.config-row label{color:var(--dim);display:flex;flex-direction:column;gap:4px;flex:1;min-width:130px;font-size:12px}.config-row input{font-family:inherit;background:var(--reel);color:var(--cream);border:1px solid var(--line);border-radius:3px;padding:7px 9px;font-size:12px}.controls{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0;flex-wrap:wrap}button{font-family:inherit;font-size:12px;letter-spacing:.05em;background:var(--bg-panel);color:var(--cream);border:1px solid var(--line);padding:9px 16px;border-radius:3px;cursor:pointer;transition:border-color .15s,color .15s}button:hover:not(:disabled){border-color:var(--gold-dim);color:var(--gold)}button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}button.primary{color:var(--gold);border-color:var(--gold-dim)}button:disabled{opacity:.35;cursor:not-allowed}.speed-group{display:flex;gap:4px}.speed-group button.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}.matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:26px 0 18px;padding:18px;background:var(--bg-panel);border:1px solid var(--line);border-radius:4px}.deck{text-align:center}.deck .label{font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}.deck .name{font-family:Georgia,serif;font-size:19px;margin-top:4px}.deck.a .name{color:var(--a-color)}.deck.b .name{color:var(--b-color)}.vs{font-family:Georgia,serif;font-style:italic;color:var(--gold-dim);font-size:15px}.meta-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);margin-bottom:18px;flex-wrap:wrap;gap:8px}.seed-badge{background:var(--reel);border:1px solid var(--line);padding:3px 10px;border-radius:3px;color:var(--gold)}.screen{background:var(--reel);border:1px solid var(--line);border-radius:4px;min-height:210px;padding:20px;position:relative;overflow:hidden;margin-bottom:14px}.screen:before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(to bottom,rgba(255,255,255,.02) 0,rgba(255,255,255,.02) 1px,transparent 1px,transparent 3px);pointer-events:none}.turn-marker{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:8px}.event-line{font-family:Georgia,serif;font-size:22px;line-height:1.4;min-height:62px;display:flex;align-items:center;opacity:0;transform:translateY(6px);transition:opacity .25s ease,transform .25s ease}.event-line.visible{opacity:1;transform:translateY(0)}.actor-tag{font-family:inherit;font-size:11px;font-weight:600;padding:2px 7px;border-radius:3px;margin-right:10px;letter-spacing:.05em}.actor-tag.a{background:rgba(127,174,140,.15);color:var(--a-color)}.actor-tag.b{background:rgba(201,119,87,.15);color:var(--b-color)}.idle-msg{color:var(--dim);font-style:italic}.progress-track{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:16px}.progress-fill{height:100%;background:var(--gold);width:0;transition:width .2s linear}.outcome{text-align:center;padding:16px;border:1px solid var(--line);border-radius:4px;background:var(--bg-panel);margin-bottom:18px;min-height:20px}.win-label{font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}.win-name{font-family:Georgia,serif;font-size:22px;color:var(--gold);margin-top:4px}.win-reason{font-size:11px;color:var(--dim);margin-top:6px}.proof-panel{margin-top:22px;border-top:1px dashed var(--line);padding-top:16px}.proof-panel h2{font-family:Georgia,serif;font-weight:400;font-style:italic;font-size:15px;color:var(--gold-dim);margin:0 0 10px}.proof-panel pre{background:var(--reel);border:1px solid var(--line);border-radius:4px;padding:12px;font-size:10.5px;line-height:1.5;overflow:auto;color:var(--dim);max-height:220px}.proof-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.footer-note{text-align:center;font-size:10px;color:var(--dim);margin-top:24px;letter-spacing:.05em}
</style>
</head>
<body>
<div class="wrap">
<div class="masthead"><div class="eyebrow">DreamLedger</div><h1>Cinema <span>v0.1</span></h1></div>
<div class="config-row"><label>Seed<input type="number" id="cfg-seed" value="12345"></label><label>Deck A<input type="text" id="cfg-a" value="Atraxa Superfriends"></label><label>Deck B<input type="text" id="cfg-b" value="Krenko Goblins"></label><label>Turns<input type="number" id="cfg-turns" value="10" min="2" max="40"></label></div>
<div class="controls"><button class="primary" id="btn-generate">Generate match</button></div>
<div class="matchup"><div class="deck a"><div class="label">Deck A</div><div class="name" id="deck-a-name">-</div></div><div class="vs">vs</div><div class="deck b"><div class="label">Deck B</div><div class="name" id="deck-b-name">-</div></div></div>
<div class="meta-row"><span>Match ID: <strong id="match-id">-</strong></span><span class="seed-badge">Seed: <span id="seed-display">-</span></span></div>
<div class="screen"><div class="turn-marker" id="turn-marker">Turn -</div><div class="event-line" id="event-line"><span class="idle-msg">Generate a match to begin.</span></div></div>
<div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
<div class="controls"><button id="btn-back" disabled>&larr; Step back</button><button id="btn-playpause" class="primary" disabled>Play</button><button id="btn-forward" disabled>Step forward &rarr;</button><div class="speed-group"><button data-speed="0.5">0.5x</button><button data-speed="1" class="active">1x</button><button data-speed="2">2x</button><button data-speed="4">4x</button></div></div>
<div class="outcome" id="outcome"></div>
<div class="proof-panel"><h2>Proof artifact</h2><pre id="proof-json">Generate a match to produce a proof artifact.</pre><div class="proof-actions"><button id="btn-download-proof" disabled>Download proof JSON</button><button id="btn-copy-proof" disabled>Copy to clipboard</button></div></div>
<div class="footer-note">schema_version: cinema-event-v1 &middot; deterministic fixture engine &middot; no server dependency</div>
</div>
<script>
function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
const EVENT_TYPES=[{type:'draw',desc:d=>`${d} draws a card`},{type:'land',desc:d=>`${d} plays a land`},{type:'cast',desc:d=>`${d} casts a spell`},{type:'attack',desc:d=>`${d} attacks`},{type:'block',desc:d=>`${d} blocks`},{type:'removal',desc:d=>`${d} removes a threat`},{type:'combo',desc:d=>`${d} assembles a combo piece`}];
function generateFixture(seed,deckA,deckB,turnCount){seed=Number(seed)>>>0;deckA=deckA||'Deck A';deckB=deckB||'Deck B';turnCount=turnCount||8;const rng=mulberry32(seed),events=[];let scoreA=0,scoreB=0;for(let turn=1;turn<=turnCount;turn++){const actorIsA=rng()<.5,actor=actorIsA?deckA:deckB,actorId=actorIsA?'A':'B',typeIdx=Math.floor(rng()*EVENT_TYPES.length),ev=EVENT_TYPES[typeIdx],weight=rng();if(actorIsA)scoreA+=weight;else scoreB+=weight;events.push({turn,actor:actorId,type:ev.type,description:ev.desc(actor),weight:Number(weight.toFixed(4))})}const winner=scoreA>=scoreB?'A':'B';return{schema_version:'cinema-event-v1',seed,match_id:`cinema-${seed}`,participants:[{id:'A',name:deckA},{id:'B',name:deckB}],events,result:{winner,winner_name:winner==='A'?deckA:deckB,reason:`Cumulative event weight ${winner==='A'?scoreA.toFixed(2):scoreB.toFixed(2)} vs ${winner==='A'?scoreB.toFixed(2):scoreA.toFixed(2)}`}}}
function fnv1aHash(str){let hash=0x811c9dc5;for(let i=0;i<str.length;i++){hash^=str.charCodeAt(i);hash=Math.imul(hash,0x01000193)}return(hash>>>0).toString(16).padStart(8,'0')}
function escapeHtml(v){return String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
let fixture=null,cursor=-1,playing=false,speed=1,timer=null;const $=id=>document.getElementById(id);const els={seed:$('cfg-seed'),a:$('cfg-a'),b:$('cfg-b'),turns:$('cfg-turns'),generate:$('btn-generate'),deckAName:$('deck-a-name'),deckBName:$('deck-b-name'),matchId:$('match-id'),seedDisplay:$('seed-display'),turnMarker:$('turn-marker'),eventLine:$('event-line'),progressFill:$('progress-fill'),back:$('btn-back'),playpause:$('btn-playpause'),forward:$('btn-forward'),outcome:$('outcome'),proofJson:$('proof-json'),downloadProof:$('btn-download-proof'),copyProof:$('btn-copy-proof'),speedBtns:document.querySelectorAll('.speed-group button')};
function buildProof(){return{proof_type:'dreamledger-cinema-run',generated_at:new Date().toISOString(),cinema_version:'0.1.0',schema_version:fixture.schema_version,seed:fixture.seed,participants:fixture.participants,event_count:fixture.events.length,result:fixture.result,event_source_hash_fnv1a:fnv1aHash(JSON.stringify(fixture.events)),full_fixture_hash_fnv1a:fnv1aHash(JSON.stringify(fixture)),reproduction_note:'Same seed + same participant names + same turn count deterministically reproduce the same event array and result via mulberry32 PRNG. No Math.random() used in generation.'}}
function stopPlaying(){playing=false;els.playpause.textContent='Play';if(timer){clearInterval(timer);timer=null}}
function render(){els.deckAName.textContent=fixture.participants[0].name;els.deckBName.textContent=fixture.participants[1].name;els.matchId.textContent=fixture.match_id;els.seedDisplay.textContent=fixture.seed;if(cursor<0){els.turnMarker.textContent='Turn -';els.eventLine.innerHTML='<span class="idle-msg">Press Play to begin the match.</span>';els.eventLine.classList.remove('visible');els.progressFill.style.width='0%';els.outcome.innerHTML=''}else{const ev=fixture.events[cursor];els.turnMarker.textContent=`Turn ${ev.turn} of ${fixture.events.length}`;els.eventLine.innerHTML=`<span class="actor-tag ${ev.actor.toLowerCase()}">${escapeHtml(ev.actor)}</span>${escapeHtml(ev.description)}`;requestAnimationFrame(()=>els.eventLine.classList.add('visible'));els.progressFill.style.width=(((cursor+1)/fixture.events.length)*100)+'%';if(cursor===fixture.events.length-1){els.outcome.innerHTML=`<div class="win-label">Winner</div><div class="win-name">${escapeHtml(fixture.result.winner_name)}</div><div class="win-reason">${escapeHtml(fixture.result.reason)}</div>`;stopPlaying()}else els.outcome.innerHTML=''}els.back.disabled=cursor<=0;els.forward.disabled=cursor>=fixture.events.length-1}
function stepForward(){if(cursor<fixture.events.length-1){cursor++;els.eventLine.classList.remove('visible');render()}else stopPlaying()}
function stepBack(){if(cursor>0){cursor--;els.eventLine.classList.remove('visible');render()}}
function startPlaying(){if(!fixture)return;if(cursor>=fixture.events.length-1)cursor=-1;playing=true;els.playpause.textContent='Pause';timer=setInterval(stepForward,1400/speed);stepForward()}
els.generate.addEventListener('click',()=>{stopPlaying();fixture=generateFixture(parseInt(els.seed.value,10)||0,els.a.value.trim()||'Deck A',els.b.value.trim()||'Deck B',Math.max(2,Math.min(40,parseInt(els.turns.value,10)||10)));cursor=-1;render();els.proofJson.textContent=JSON.stringify(buildProof(),null,2);els.downloadProof.disabled=false;els.copyProof.disabled=false;els.back.disabled=true;els.forward.disabled=false;els.playpause.disabled=false});
els.playpause.addEventListener('click',()=>playing?stopPlaying():startPlaying());els.forward.addEventListener('click',()=>{stopPlaying();stepForward()});els.back.addEventListener('click',()=>{stopPlaying();stepBack()});els.speedBtns.forEach(btn=>btn.addEventListener('click',()=>{els.speedBtns.forEach(b=>b.classList.remove('active'));btn.classList.add('active');speed=parseFloat(btn.dataset.speed);if(playing){stopPlaying();startPlaying()}}));
els.downloadProof.addEventListener('click',()=>{const blob=new Blob([JSON.stringify(buildProof(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`cinema-proof-${fixture.seed}-${Date.now()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)});
els.copyProof.addEventListener('click',()=>{if(!navigator.clipboard)return;navigator.clipboard.writeText(JSON.stringify(buildProof(),null,2)).then(()=>{const old=els.copyProof.textContent;els.copyProof.textContent='Copied';setTimeout(()=>els.copyProof.textContent=old,1200)})});
(function initFromQuery(){const params=new URLSearchParams(window.location.search);if(params.has('seed'))els.seed.value=params.get('seed');if(params.has('a'))els.a.value=params.get('a');if(params.has('b'))els.b.value=params.get('b');if(params.has('turns'))els.turns.value=params.get('turns')})();
</script>
</body>
</html>
