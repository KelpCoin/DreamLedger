<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify DreamLedger email</title><style>body{margin:0;background:#090a0d;color:#f5f7f8;font:16px/1.5 system-ui,sans-serif}main{max-width:620px;margin:auto;padding:32px 18px}.box{background:#111317;border:1px solid #292d35;border-radius:18px;padding:24px}button{padding:12px 16px;border:0;border-radius:10px;background:#f2c14e;font-weight:900}a{color:inherit}.msg{margin-top:15px;color:#f2c14e}</style></head><body><main><p><a href="/">DREAMLEDGER</a></p><h1>Email verification</h1><div class="box"><p id="msg">Checking your verification link...</p><button id="resend" hidden>Resend verification email</button></div></main><script>const params=new URLSearchParams(location.search),token=params.get('token'),next=params.get('next')||'/account.html';async function run(){const msg=document.getElementById('msg');if(token){const r=await fetch('/api/dreamiez/account/verify?token='+encodeURIComponent(token));const d=await r.json().catch(()=>({}));if(r.ok){msg.textContent='Email verified. Your account is ready.';setTimeout(()=>location.href=next,900);return}msg.textContent=d.error||'Verification failed.';}else{msg.textContent='Open the verification link sent to your email. If you need another email, log in first.';document.getElementById('resend').hidden=false;}}document.getElementById('resend').onclick=async()=>{const r=await fetch('/api/dreamiez/account/resend-verification',{method:'POST'});const d=await r.json().catch(()=>({}));document.getElementById('msg').textContent=d.message||d.error||'Done.'};run();</script></body></html>
