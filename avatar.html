<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamLedger Avatar</title><style>body{margin:0;background:#090a0d;color:#f5f7f8;font:16px/1.5 system-ui,sans-serif}main{max-width:820px;margin:auto;padding:32px 18px 70px}a{color:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.box{background:#111317;border:1px solid #292d35;border-radius:18px;padding:22px}label{display:block;margin-top:14px;font-weight:800}select{width:100%;margin-top:7px;padding:12px;border-radius:10px;border:1px solid #343943;background:#090a0d;color:#fff}button{margin-top:18px;padding:12px 16px;border:0;border-radius:10px;background:#f2c14e;font-weight:900}.muted{color:#aab1bc}@media(max-width:700px){.grid{grid-template-columns:1fr}}ul{padding-left:20px}</style></head><body><main><p><a href="/">DREAMLEDGER</a></p><h1>Your avatar</h1><p id="state" class="muted">Checking account...</p><div class="grid"><section class="box"><h2>Identity</h2><label>Height<select id="height"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select></label><label>Build<select id="build"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select></label><label>Skin<select id="skin"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option><option value="6">6</option></select></label><button id="save">Save avatar</button><div id="msg" class="muted"></div></section><section class="box"><h2>Owned cosmetics</h2><p class="muted">Your purchased and approved avatar assets will appear here.</p><ul id="cosmetics"></ul><a href="/marketplace/">Browse marketplace</a></section></div><script>const state=document.getElementById('state'),msg=document.getElementById('msg'),cos=document.getElementById('cosmetics');async function load(){const r=await fetch('/api/account/me',{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!d.authenticated){location.replace('/login.html?next=/avatar.html');return}const a=d.account;state.textContent='Signed in as '+(a.name||'Dreamer');const av=a.avatar||{};document.getElementById('height').value=String(av.height||2);document.getElementById('build').value=String(av.build||2);document.getElementById('skin').value=String(av.skin||5);cos.innerHTML=(a.cosmetics||[]).map(x=>'<li>'+String(x)+'</li>').join('')||'<li class="muted">No cosmetics yet.</li>'}document.getElementById('save').onclick=async()=>{msg.textContent='Saving...';const avatar={height:Number(height.value),build:Number(build.value),skin:Number(skin.value)};const r=await fetch('/api/account/update',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({avatar})});msg.textContent=r.ok?'Avatar saved.':'Save failed.'};load().catch(()=>{state.textContent='Unable to load account.'});</script></main></body></html>
