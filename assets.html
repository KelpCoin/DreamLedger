<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamLedger assets</title><meta name="description" content="Browse verified DreamLedger digital assets."/><style>body{margin:0;background:#090a0d;color:#f5f7f8;font:16px/1.5 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:28px 18px 70px}a{color:inherit}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-weight:950;letter-spacing:-.04em}.box{background:#111317;border:1px solid #292d35;border-radius:18px;padding:24px}.muted{color:#929aa6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#0c0e11;border:1px solid #292d35;border-radius:14px;padding:18px}.card h2{font-size:1.05rem;margin:0 0 8px}.pill{display:inline-block;border:1px solid #343943;border-radius:999px;padding:4px 8px;font-size:.72rem;color:#929aa6}@media(max-width:700px){.grid{grid-template-columns:1fr}.nav{align-items:flex-start;gap:14px;flex-direction:column}}</style></head><body><main><div class="nav"><a class="brand" href="/">DREAMLEDGER</a><div><a href="/account.html">Account</a> | <a href="/avatar.html">Avatar</a></div></div><h1>Verified digital assets</h1><p class="muted">Only machine-readable inventory returned by the asset service is displayed. No assets are invented or inferred.</p><section id="state" class="box">Loading verified inventory...</section><div id="grid" class="grid" hidden></div></main><script>async function load(){const state=document.getElementById('state'),grid=document.getElementById('grid');try{const r=await fetch('/api/assets',{credentials:'same-origin',cache:'no-store'});if(r.status===404){state.innerHTML='<h2>Awaiting verified inventory.</h2><p class="muted">The asset API is not deployed yet, so this page will not fabricate a catalog.</p>';return}const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Asset service returned HTTP '+r.status));const items=Array.isArray(d.assets)?d.assets:Array.isArray(d)?d:[];if(!items.length){state.innerHTML='<h2>Awaiting verified inventory.</h2><p class="muted">No verified assets are currently published.</p>';return}state.hidden=true;grid.hidden=false;grid.innerHTML=items.map(x=>'<article class="card"><span class="pill">'+String(x.status||'verified')+'</span><h2>'+String(x.name||x.id||'Unnamed asset').replace(/[<>]/g,'')+'</h2><p class="muted">'+String(x.description||'').replace(/[<>]/g,'')+'</p></article>').join('')}catch(e){state.innerHTML='<h2>Asset service unavailable.</h2><p class="muted">'+String(e.message||e).replace(/[<>]/g,'')+'</p>'}}load();</script></body></html>
