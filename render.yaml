services:
  - type: web
    name: dreamledger-bec-prime
    runtime: node
    branch: main
    rootDir: BEC-PRIME
    autoDeployTrigger: commit
    renderSubdomainPolicy: enabled
    domains:
      - dreamledger.org
      - www.dreamledger.org
      - qr.dreamledger.org
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: dreamledger-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24.14.1"
      - key: PUBLIC_BASE_URL
        value: https://dreamledger.org
      - key: PUBLIC_ORIGIN
        value: https://dreamledger.org
      - key: QR_BASE_URL
        value: https://qr.dreamledger.org
      - key: QR_ALLOWED_HOSTS
        value: dreamledger.org,qr.dreamledger.org
      - key: QR_API_KEY
        generateValue: true
      - key: QR_IP_SALT
        generateValue: true
      - key: QR_DATA_DIR
        value: /var/data/qr
      - key: LEDGER_DATA_DIR
        value: /var/data/ledger
      - key: PROOF_DATA_DIR
        value: /var/data/proofs
      - key: DIGITAL_PROXY_LM_ENABLED
        value: "false"
      - key: SUPABASE_URL
        value: https://wbwgroygjeyukkspnqiy.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: DEPLOYMENT_CHANNEL
        value: dreamledger-production
