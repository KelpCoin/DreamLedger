services:
  - type: web
    name: dreamledger-bec-prime
    runtime: node
    branch: main
    rootDir: BEC-PRIME
    autoDeployTrigger: commit
    buildCommand: npm install && npm run compile:offers && npm run compile:surface && node --check server.js
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: dreamledger-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://dreamledger.org
      - key: LEDGER_DATA_DIR
        value: /var/data/ledger
      - key: PROOF_DATA_DIR
        value: /var/data/proofs
      - key: DREAMIEZ_DATA_DIR
        value: /var/data/dreamiez
      - key: DEMAND_RADAR_DATA_DIR
        value: /var/data/demand
      - key: DIGITAL_PROXY_APPROVAL_TOKEN
        generateValue: true
      - key: DIGITAL_PROXY_LM_ENABLED
        value: "false"
      - key: DIGITAL_PROXY_LM_BASE_URL
        value: http://127.0.0.1:1234/v1
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
