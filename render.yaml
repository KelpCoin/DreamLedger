services:
  - type: web
    name: dreamledger
    runtime: node
    rootDir: BEC-PRIME
    buildCommand: node --check server.js && test -f compiled/website/index.html && test -f compiled/website/mtg/index.html && test -f compiled/website/commander/index.html && test -f compiled/website/pokemon/index.html && test -f compiled/website/vinyl/index.html && test -f compiled/website/videogames/index.html && test -f compiled/website/retro/index.html && test -f catalog/products/MTG-URZAS-LEGACY-PALINCHRON-FOIL-001.json && test -f catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json && echo "Verified DreamLedger production assets"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://dreamledger.org
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
