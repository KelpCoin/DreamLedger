# E1 production release refresh: Render is the sole active primary deployment path.
# Vercel remains dormant as a fallback and must not participate in production deployment.
services:
  - type: web
    name: dreamledger-bec-prime
    runtime: node
    branch: main
    rootDir: BEC-PRIME
    autoDeployTrigger: commit
    renderSubdomainPolicy: enabled
    domains:
      - dreamledger.org
      - www.dreamledger.org
      - qr.dreamledger.org
    # Production artifacts are committed and verified in git. The previous
    # build command ran the entire experimental compiler chain on every Render
    # deploy; repeated Render failures left the site serving the last rollback.
    # Deploy the committed artifact directly. Compilation remains available
    # locally/CI via `npm run compile` and is not on the critical Render path.
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: dreamledger-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24.14.1"
      - key: PUBLIC_BASE_URL
        value: https://dreamledger.org
      - key: PUBLIC_ORIGIN
        value: https://dreamledger.org
      - key: QR_BASE_URL
        value: https://qr.dreamledger.org
      - key: QR_ALLOWED_HOSTS
        value: dreamledger.org,qr.dreamledger.org
      - key: QR_DATA_DIR
        value: /var/data/qr
      - key: QR_API_KEY
        generateValue: true
      - key: QR_IP_SALT
        generateValue: true
      - key: LEDGER_DATA_DIR
        value: /var/data/ledger
      - key: PROOF_DATA_DIR
        value: /var/data/proofs
      - key: DREAMIEZ_DATA_DIR
        value: /var/data/dreamiez
      - key: DEMAND_RADAR_DATA_DIR
        value: /var/data/demand
      - key: DIGITAL_PROXY_APPROVAL_TOKEN
        generateValue: true
      - key: MARKETPLACE_ADMIN_TOKEN
        generateValue: true
      - key: M2M_API_KEY
        generateValue: true
      - key: DIGITAL_PROXY_LM_ENABLED
        value: "false"
      - key: DIGITAL_PROXY_LM_BASE_URL
        value: http://127.0.0.1:1234/v1
      - key: SUPABASE_URL
        value: https://wbwgroygjeyukkspnqiy.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: DEPLOYMENT_CHANNEL
        value: dreamledger-production
