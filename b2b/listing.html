<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B2B Listing | DreamLedger</title><style>:root{--bg:#090a0c;--panel:#111317;--line:#292d35;--ink:#f5f7f8;--muted:#929aa6;--accent:#f2c14e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:20px 16px 70px}a{color:inherit;text-decoration:none}.nav{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{font-weight:950}.brand b,.eyebrow,.price{color:var(--accent)}.btn{display:inline-flex;padding:12px 16px;border:1px solid var(--line);border-radius:11px;background:#15191f;font-weight:900}.primary{background:var(--accent);color:#111;border-color:var(--accent)}.panel{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px}.eyebrow{font:900 .64rem ui-monospace,monospace;text-transform:uppercase;letter-spacing:.13em}.price{font-size:2rem;font-weight:950;margin:18px 0}.muted{color:var(--muted)}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}.fact{padding:13px;border:1px solid var(--line);border-radius:12px}.fact b{display:block}.seller{border-top:1px solid var(--line);margin-top:24px;padding-top:20px}.error{color:#ff8f8f;margin-top:12px}@media(max-width:600px){.facts{grid-template-columns:1fr}}</style></head><body><div class="wrap"><nav class="nav"><a class="brand" href="/b2b/">DREAM<b>LEDGER</b> B2B</a><a class="btn" href="/b2b/">Back to marketplace</a></nav><main id="app"><section class="panel"><div class="muted">Loading listing...</div></section></main></div><script>const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');async function load(){if(!id){fail('Missing listing id');return}try{const r=await fetch('/api/marketplace/listings/'+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Listing unavailable');const x=d.item;app.innerHTML='<section class="panel"><div class="eyebrow">'+esc(x.category||'B2B')+'</div><h1>'+esc(x.title)+'</h1><p class="muted">'+esc(x.description||'')+'</p><div class="price">'+esc(x.currency||'NZD')+' '+esc(x.price)+'</div><div class="facts"><div class="fact"><span class="muted">Condition</span><b>'+esc(x.condition||'Business service')+'</b></div><div class="fact"><span class="muted">Availability</span><b>Approved / checkout enabled</b></div><div class="fact"><span class="muted">Seller</span><b>'+esc(x.seller_name||'Verified seller')+'</b></div><div class="fact"><span class="muted">Location</span><b>'+esc(x.location||'Remote / online')+'</b></div></div><button id="buy" class="btn primary">Proceed to secure checkout</button><div id="msg" class="muted"></div><div class="seller"><div class="eyebrow">Seller</div><p>'+esc(x.seller_profile?.bio||'Seller profile available through the marketplace.')+'</p></div></section>';document.getElementById('buy').onclick=checkout}catch(e){fail(e.message)}}async function checkout(){const b=document.getElementById('buy'),m=document.getElementById('msg');b.disabled=true;b.textContent='Creating checkout...';try{const r=await fetch('/api/marketplace/listings/'+encodeURIComponent(id)+'/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Checkout unavailable');location.href=d.checkout_url}catch(e){m.className='error';m.textContent=e.message;b.disabled=false;b.textContent='Proceed to secure checkout'}}function fail(m){app.innerHTML='<section class="panel"><h1>Listing unavailable</h1><p class="error">'+esc(m)+'</p><a class="btn" href="/b2b/">Return to marketplace</a></section>'}load();</script></body></html>
