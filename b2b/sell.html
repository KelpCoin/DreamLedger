<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell on DreamLedger B2B</title><style>:root{--bg:#090a0c;--panel:#111317;--line:#292d35;--ink:#f5f7f8;--muted:#929aa6;--accent:#f2c14e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}.wrap{max-width:850px;margin:auto;padding:20px 16px 70px}a{color:inherit;text-decoration:none}.nav{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{font-weight:950}.brand b,.eyebrow{color:var(--accent)}.btn{display:inline-flex;padding:12px 16px;border:1px solid var(--line);border-radius:11px;background:#15191f;color:var(--ink);font-weight:900}.primary{background:var(--accent);color:#111;border-color:var(--accent)}.panel{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px}.eyebrow{font:900 .64rem ui-monospace,monospace;text-transform:uppercase;letter-spacing:.13em}h1{font-size:clamp(2.4rem,7vw,4.5rem);line-height:.92;letter-spacing:-.07em}.muted{color:var(--muted)}label{display:block;margin:15px 0 6px;font-weight:800;font-size:.82rem}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0f1115;color:var(--ink);font:inherit}textarea{min-height:130px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{padding:13px;border:1px solid var(--line);border-radius:12px;margin:18px 0}.success{color:#bde7b8}.error{color:#ff9b9b}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><nav class="nav"><a class="brand" href="/b2b/">DREAM<b>LEDGER</b> B2B</a><a class="btn" href="/b2b/">Marketplace</a></nav><section class="panel"><div class="eyebrow">Seller intake</div><h1>Put real supply on the shelf.</h1><p class="muted">Submit one fixed, understandable business listing. It enters review first. Approval makes it public and checkoutable.</p><div id="account" class="notice">Checking account...</div><form id="form"><label>Title</label><input name="title" maxlength="100" required placeholder="e.g. CRM cleanup and automation setup"><label>Description</label><textarea name="description" maxlength="3000" required placeholder="State exactly what the buyer receives."></textarea><div class="grid"><div><label>Category</label><select name="category"><option>Automation</option><option>Business Services</option><option>Digital Products</option><option>Media</option><option>Collectibles</option><option>Other</option></select></div><div><label>Price (NZD)</label><input name="price" type="number" min="1" step="0.01" required></div></div><div class="grid"><div><label>Condition / delivery</label><input name="condition" placeholder="New / Remote / Fixed scope"></div><div><label>Location</label><input name="location" placeholder="NZ / Remote / Auckland"></div></div><div id="msg" class="notice muted">Seller accounts must be verified before submission.</div><button id="submit" class="btn primary" type="submit">Submit for approval</button></form></section></div><script>const account=document.getElementById('account'),form=document.getElementById('form'),msg=document.getElementById('msg'),submit=document.getElementById('submit');const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function me(){try{const r=await fetch('/api/account/me',{cache:'no-store'});const d=await r.json();if(!d.authenticated){account.innerHTML='<strong>Login required.</strong> <a href="/login.html?next=/b2b/sell.html">Log in</a>';form.style.display='none';return}if(!d.account.email_verified){account.innerHTML='<strong>Verify your email before selling.</strong>';form.style.display='none';return}account.innerHTML='<strong>Seller account ready:</strong> '+esc(d.account.email);form.style.display='block'}catch(e){account.textContent='Account service unavailable';form.style.display='none'}}form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;submit.textContent='Submitting...';msg.className='notice muted';msg.textContent='Sending listing to approval queue...';const data=Object.fromEntries(new FormData(form).entries());data.price=Number(data.price);try{const r=await fetch('/api/marketplace/listings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Submission failed');msg.className='notice success';msg.innerHTML='<strong>Submitted.</strong> The listing is pending approval and is not publicly checkoutable yet. <a href="/account.html">View your account</a>';form.reset()}catch(e){msg.className='notice error';msg.textContent=e.message}finally{submit.disabled=false;submit.textContent='Submit for approval'}});me();</script></body></html>
