name: MTG Exchange Review Proof
on:
  pull_request:
    paths:
      - 'public/mtg/**'
      - 'public/index.html'
      - 'mtg/index.html'
      - 'BEC-PRIME/compiled/website/mtg/index.html'
      - 'BEC-PRIME/website/mtg-catalog.html'
      - 'scripts/verify-mtg-exchange-worldwide.cjs'
      - 'scripts/test-mtg-commercial-terms-lock.cjs'
      - 'scripts/test-mtg-visual-identity.cjs'
      - 'scripts/test-mtg-auction-rail.cjs'
      - 'public/data/mtg-auctions.json'
      - 'public/assets/mtg-auction-rail.js'
      - 'public/assets/dreamledger-mtg-theme.css'
      - 'public/silos/mtg/silo.json'
      - 'docs/MTG-COMMERCIAL-TERMS-LOCK.json'
      - '.github/workflows/mtg-exchange-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce owner-approved NZD29 and Patreon quota
        run: node scripts/test-mtg-commercial-terms-lock.cjs
      - name: Verify DreamLedger MTG brand continuity and creator footer
        run: node scripts/test-mtg-visual-identity.cjs
      - name: Verify three auction spotlights, countdowns and paid-visibility hard gate
        run: node --test scripts/test-mtg-auction-rail.cjs
      - name: Stage verifier
        run: node scripts/verify-mtg-exchange-worldwide.cjs
      - name: Existing clone safety check (HOLD is allowed)
        run: node scripts/verify-beck-mtg-clone-gate.cjs
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtg-exchange-stage-proof
          path: artifacts/mtg-exchange-proof.json
          if-no-files-found: warn
