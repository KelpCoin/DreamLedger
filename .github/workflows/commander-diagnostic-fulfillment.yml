name: Commander Diagnostic Fulfillment Worker

on:
  pull_request:
    paths:
      - 'workers/marketplace/commander_marketplace_worker.py'
      - 'workers/marketplace/test_commander_marketplace_worker.py'
      - '.github/workflows/commander-diagnostic-fulfillment.yml'
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: commander-diagnostic-fulfillment
  cancel-in-progress: false

jobs:
  validate-worker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify cloud model credential boundary and fail-closed delivery
        run: python3 -m unittest discover -s workers/marketplace -p 'test_commander_marketplace_worker.py' -v
      - name: Attest exact source and test SHA256
        run: sha256sum workers/marketplace/commander_marketplace_worker.py workers/marketplace/test_commander_marketplace_worker.py

  fulfill:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://wbwgroygjeyukkspnqiy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CLOUD_MODEL_API_URL: ${{ secrets.CLOUD_MODEL_API_URL }}
      CLOUD_MODEL_API_KEY: ${{ secrets.CLOUD_MODEL_API_KEY }}
      CLOUD_MODEL_NAME: ${{ secrets.CLOUD_MODEL_NAME }}
      BEC_ONCE: '1'
      BEC_FULFILLMENT_LEASE_SECONDS: '900'
      BEC_WORKER_ID: github-actions-commander-diagnostic
    steps:
      - uses: actions/checkout@v4
      - name: Run one fulfillment job
        run: python3 workers/marketplace/commander_marketplace_worker.py
