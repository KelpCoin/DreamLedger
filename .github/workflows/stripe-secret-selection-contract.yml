name: Stripe Secret Selection Contract
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/stripe-key-selection.mjs'
      - 'supabase/functions/_shared/stripe-key-selection.test.mjs'
      - 'supabase/functions/marketplace-diagnostic-delivery/index.ts'
      - 'supabase/functions/marketplace-diagnostic-delivery/deno.json'
      - '.github/workflows/stripe-secret-selection-contract.yml'
permissions:
  contents: read
jobs:
  key-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test trimmed non-empty fallback selection
        run: node --test supabase/functions/_shared/stripe-key-selection.test.mjs
      - name: Ensure delivery function uses the tested selector
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('supabase/functions/marketplace-diagnostic-delivery/index.ts', 'utf8');
          if (!source.includes('pickStripeApiKey(Deno.env.get("STRIPE_API_KEY"),Deno.env.get("STRIPE_SECRET_KEY"))')) {
            throw new Error('Delivery function does not use the tested whitespace-safe Stripe key selector');
          }
          console.log('PASS: delivery function uses whitespace-safe Stripe key selection');
          NODE
