name: Vercel Static Storefront

on:
  workflow_dispatch:
    inputs:
      release:
        description: Deploy the exact selected commit to Vercel production
        required: true
        default: confirm
        type: choice
        options:
          - confirm
      release_sha:
        description: Immutable commit SHA to build and deploy
        required: true
        type: string

concurrency:
  group: dreamledger-vercel-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1

      - name: Verify release SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          echo "RELEASE_SHA=$RELEASE_SHA"

      - name: Verify Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          echo 'PASS: VERCEL_TOKEN is present.'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install

      - name: Compile source and economic contracts
        run: npm run compile

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Create or reuse Vercel project
        working-directory: BEC-PRIME/compiled/website
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: team_HNsRrUI7JZV4iwejNlqJjXvR
          VERCEL_PROJECT: dreamledger
        run: |
          set -euo pipefail
          if vercel project ls "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>/dev/null | grep -q "$VERCEL_PROJECT"; then
            echo 'PASS: Vercel project already exists.'
          else
            vercel project add "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
            echo 'PASS: Vercel project created.'
          fi

      - name: Link Vercel project
        working-directory: BEC-PRIME/compiled/website
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: team_HNsRrUI7JZV4iwejNlqJjXvR
        run: |
          set -euo pipefail
          vercel link --project dreamledger --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --yes

      - name: Pull production Vercel configuration
        working-directory: BEC-PRIME/compiled/website
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: team_HNsRrUI7JZV4iwejNlqJjXvR
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Verify required production environment variables
        working-directory: BEC-PRIME/compiled/website
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: team_HNsRrUI7JZV4iwejNlqJjXvR
        run: |
          set -euo pipefail
          ENV_LIST="$RUNNER_TEMP/vercel-env-list.txt"
          vercel env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$ENV_LIST"
          grep -Eq '(^|[[:space:]])SUPABASE_URL([[:space:]]|$)' "$ENV_LIST"
          grep -Eq '(^|[[:space:]])SUPABASE_SERVICE_ROLE_KEY([[:space:]]|$)' "$ENV_LIST"
          echo 'PASS: required Supabase production environment variables are configured.'

      - name: Build Vercel output in GitHub Actions
        working-directory: BEC-PRIME/compiled/website
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: team_HNsRrUI7JZV4iwejNlqJjXvR
        run: |
          set -euo pipefail
          vercel build --prod --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          test -f .vercel/output/config.json
          echo 'PASS: Vercel Build Output API artifact exists.'

      - name: Deploy prebuilt production artifact
        working-directory: BEC-PRIME/compiled/website
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: team_HNsRrUI7JZV4iwejNlqJjXvR
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --yes > "$RUNNER_TEMP/vercel-deploy-url.txt"
          DEPLOY_URL="$(tail -1 "$RUNNER_TEMP/vercel-deploy-url.txt")"
          printf '%s\n' "$DEPLOY_URL" | grep -Eq '^https://[A-Za-z0-9.-]+\.vercel\.app$'
          echo "PASS: prebuilt production deployment created: $DEPLOY_URL"

      - name: Verify production deployment over HTTP
        env:
          EXPECTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          DEPLOY_URL="$(tail -1 "$RUNNER_TEMP/vercel-deploy-url.txt")"
          ROOT_STATUS="$(curl -sS -o "$RUNNER_TEMP/root.html" -w '%{http_code}' --retry 3 --retry-delay 2 "$DEPLOY_URL/")"
          test "$ROOT_STATUS" = '200'
          grep -qi '<html' "$RUNNER_TEMP/root.html"
          ACCOUNT_STATUS="$(curl -sS -o "$RUNNER_TEMP/account-me.json" -w '%{http_code}' --retry 3 --retry-delay 2 "$DEPLOY_URL/api/account/me")"
          test "$ACCOUNT_STATUS" = '200'
          grep -q '"authenticated":false' "$RUNNER_TEMP/account-me.json"
          printf '{"status":"HTTP_PASS","deployment_url":"%s","root_status":%s,"account_me_status":%s,"account_me":"anonymous","sha":"%s"}\n' "$DEPLOY_URL" "$ROOT_STATUS" "$ACCOUNT_STATUS" "$EXPECTED_SHA" > "$RUNNER_TEMP/http-proof.json"
          cat "$RUNNER_TEMP/http-proof.json"

      - name: Probe custom domain
        run: |
          set -euo pipefail
          DOMAIN_STATUS="$(curl -sS -o "$RUNNER_TEMP/domain.html" -w '%{http_code}' --retry 2 --retry-delay 2 https://dreamledger.org/ || true)"
          if [ "$DOMAIN_STATUS" = '200' ] && grep -qi 'DreamLedger' "$RUNNER_TEMP/domain.html"; then
            DOMAIN_STATE='LIVE_DREAMLEDGER'
          else
            DOMAIN_STATE='NOT_YET_DREAMLEDGER'
          fi
          printf '{"status":"DOMAIN_PROBE","domain":"https://dreamledger.org/","http_status":%s,"state":"%s"}\n' "$DOMAIN_STATUS" "$DOMAIN_STATE" > "$RUNNER_TEMP/domain-proof.json"
          cat "$RUNNER_TEMP/domain-proof.json"

      - name: Emit deployment proof
        env:
          SHA: ${{ inputs.release_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p proof
          DEPLOY_URL="$(tail -1 "$RUNNER_TEMP/vercel-deploy-url.txt")"
          HTTP_PROOF="$(cat "$RUNNER_TEMP/http-proof.json")"
          DOMAIN_PROOF="$(cat "$RUNNER_TEMP/domain-proof.json")"
          printf '{"workflow":"vercel-static-deploy","sha":"%s","run_id":"%s","status":"HTTP_VERIFIED","project":"dreamledger","scope":"team_HNsRrUI7JZV4iwejNlqJjXvR","deployment_url":"%s","http_proof":%s,"domain_proof":%s}\n' "$SHA" "$RUN_ID" "$DEPLOY_URL" "$HTTP_PROOF" "$DOMAIN_PROOF" > proof/vercel-static-deploy-proof.json
          cat proof/vercel-static-deploy-proof.json

      - name: Upload deployment proof
        uses: actions/upload-artifact@v4
        with:
          name: vercel-static-deploy-proof
          path: proof/vercel-static-deploy-proof.json
