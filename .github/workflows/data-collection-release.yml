name: data-collection-pipeline-release
on:
  push:
    tags:
      - "data-collection-v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s pipelines/data_collection -p "test_*.py" -v
      - name: Build source artifact
        run: |
          mkdir -p dist
          tar -czf dist/dreamledger-data-collection-${GITHUB_REF_NAME}.tar.gz pipelines/data_collection runtime/THIRD-PARTY-SCRAPING-GATE-V1-2026-09-29.md
          sha256sum dist/* > dist/SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
