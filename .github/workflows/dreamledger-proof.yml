name: DreamLedger Proof Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-proof:
    name: Build and production-surface proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install compiler dependencies
        working-directory: BEC-PRIME
        run: npm install

      - name: Compile canonical offers
        working-directory: BEC-PRIME
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: node compiler/OfferCompiler.js

      - name: Compile monetization silo portfolio
        working-directory: BEC-PRIME
        run: node compiler/SiloPortfolioCompiler.js

      - name: Verify compiled silo portfolio gates
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          node --check compiler/SiloPortfolioCompiler.js
          node - <<'NODE'
          const fs = require('fs');
          const p = 'catalog/compiled/silo-portfolio.json';
          const proof = 'PROOF-SILO-PORTFOLIO-COMPILATION.json';
          const x = JSON.parse(fs.readFileSync(p, 'utf8'));
          const y = JSON.parse(fs.readFileSync(proof, 'utf8'));
          if (y.status !== 'PASS') throw new Error('Silo portfolio proof is not PASS');
          if (!Number.isInteger(x.wedge_count) || x.wedge_count < 1) throw new Error('No monetization wedges compiled');
          if (x.activation_policy.approval_required !== true) throw new Error('Approval gate opened');
          if (x.activation_policy.checkout_available !== false) throw new Error('Checkout unexpectedly enabled');
          if (x.activation_policy.payment_claims_allowed !== false) throw new Error('Payment claim unexpectedly enabled');
          if (x.activation_policy.private_ip_doctrine_exposed !== false) throw new Error('Private IP doctrine exposure enabled');
          for (const w of x.wedges) {
            if (w.activation_state !== 'APPROVAL_GATED') throw new Error(`Unsafe activation state: ${w.id}`);
            if (!w.sku_family.includes('BILLBOARD')) throw new Error(`Billboard SKU missing: ${w.id}`);
            if (w.cta.action !== 'proposal_only') throw new Error(`CTA is not proposal-only: ${w.id}`);
          }
          console.log(`SILO_PORTFOLIO_PASS ${x.wedge_count}`);
          NODE

      - name: Verify compiled readiness tiers
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = 'catalog/offers/offers.json';
          const x = JSON.parse(fs.readFileSync(p, 'utf8'));
          const expected = new Map([
            ['OFFER-BEC-PRIME-READINESS-AUDIT-SNAPSHOT', 49],
            ['OFFER-BEC-PRIME-READINESS-AUDIT-FULL-AUDIT', 149],
            ['OFFER-BEC-PRIME-READINESS-AUDIT-BLUEPRINT', 499]
          ]);
          for (const [id, price] of expected) {
            const o = x.offers.find(v => v.offer_id === id);
            if (!o) throw new Error(`Missing ${id}`);
            if (o.price !== price) throw new Error(`Wrong price for ${id}`);
            if (o.currency !== 'NZD') throw new Error(`Wrong currency for ${id}`);
            if (o.approval_required !== true) throw new Error(`Approval gate open for ${id}`);
            if (o.checkout_available !== false) throw new Error(`Checkout enabled for ${id}`);
            if (o.status !== 'candidate') throw new Error(`Wrong status for ${id}`);
          }
          console.log('TIERED_READINESS_OFFERS_PASS');
          NODE

      - name: Verify agentic commerce contract
        working-directory: BEC-PRIME
        run: node scripts/verify-agentic-commerce.js

      - name: Upload generated offer, silo, and agentic artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dreamledger-compiled-commerce-${{ github.sha }}
          path: |
            BEC-PRIME/catalog/offers/offers.json
            BEC-PRIME/catalog/offers/candidates.json
            BEC-PRIME/PROOF-OFFER-COMPILATION.json
            BEC-PRIME/catalog/compiled/silo-portfolio.json
            BEC-PRIME/compiled/website/portfolio
            BEC-PRIME/PROOF-SILO-PORTFOLIO-COMPILATION.json
            BEC-PRIME/PROOF-AGENTIC-COMMERCE.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate Node syntax
        working-directory: BEC-PRIME
        run: node --check server.js && node --check compiler/SiloPortfolioCompiler.js && node --check scripts/verify-agentic-commerce.js

      - name: Validate required production assets
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          test -f compiled/website/index.html
          test -f compiled/website/mtg/index.html
          test -f compiled/website/commander/index.html
          test -f compiled/website/pokemon/index.html
          test -f compiled/website/vinyl/index.html
          test -f compiled/website/videogames/index.html
          test -f compiled/website/retro/index.html
          test -f compiled/website/assets/marketplace-live.js
          test -f compiled/website/portfolio/index.html
          test -f catalog/compiled/silo-portfolio.json
          test -f catalog/products/MTG-URZAS-LEGACY-PALINCHRON-FOIL-001.json
          test -f catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json
          test -f catalog/offers/offers.json
          test -f catalog/ip-capabilities.json

      - name: Validate neutral homepage contract
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          grep -q "ONE HOST." compiled/website/index.html
          grep -q "MANY WORLDS." compiled/website/index.html
          grep -q "Agentic Commerce" compiled/website/index.html
          grep -q "Neutral front door" compiled/website/index.html
          ! grep -Eiq "Dreamiez Marketplace|Coming Later|Kelplantis" compiled/website/index.html
          ! grep -Eiq "magic the gathering|mtg shop|commander deck" compiled/website/index.html

  runtime-proof:
    name: Public runtime proof
    runs-on: ubuntu-latest
    steps:
      - name: Probe DreamLedger production endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          : > proof/runtime.txt
          urls=(
            "https://dreamledger.org/"
            "https://dreamledger.org/healthz"
            "https://dreamledger.org/api/products"
            "https://dreamledger.org/api/offers"
            "https://dreamledger.org/.well-known/agent-commerce.json"
          )
          failed=0
          for url in "${urls[@]}"; do
            name=$(printf '%s' "$url" | sed 's#https://dreamledger.org/##; s#[^A-Za-z0-9]#_#g')
            [ -n "$name" ] || name=homepage
            echo "=== $url ===" | tee -a "proof/runtime.txt"
            if curl --fail --silent --show-error --location --max-time 30 "$url" -o "proof/${name}.body" -w "HTTP %{http_code}\n" | tee -a "proof/runtime.txt"; then :; else failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then echo "RUNTIME_NOT_PROVEN" | tee -a proof/runtime.txt; exit 1; fi
          grep -qi "DreamLedger" proof/homepage.body || { echo "Homepage marker missing" | tee -a proof/runtime.txt; exit 1; }
          echo "RUNTIME_PASS" | tee -a proof/runtime.txt
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dreamledger-runtime-proof-${{ github.sha }}
          path: proof/
          if-no-files-found: error
          retention-days: 30
