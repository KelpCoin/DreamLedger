name: MTG Bilateral Trade Ledger Review
on:
  push:
    branches:
      - beck/mtg-bilateral-trade-ledger-20261031
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consent-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bilateral consent
        run: node --test handlers/cube/mtg-trades.test.js
      - name: Validate JavaScript syntax
        run: node --check handlers/cube/mtg-trades.js
      - name: Record code hashes
        run: |
          mkdir -p artifacts
          sha256sum handlers/cube/mtg-trades.js handlers/cube/mtg-trades.test.js migrations/20261031_mtg_bilateral_trade_ledger.sql > artifacts/mtg-trade-ledger-code.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mtg-bilateral-trade-code-proof
          path: artifacts/mtg-trade-ledger-code.sha256
