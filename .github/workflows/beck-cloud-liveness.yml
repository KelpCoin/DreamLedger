name: BECK Cloud Liveness
on:
  push:
    branches: [main, feat/beck-commercial-gauntlet-bootstrap-clean]
    paths:
      - '.github/workflows/beck-cloud-liveness.yml'
      - 'scripts/beck-one-shot-bootstrap.ps1'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beck-cloud-liveness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  liveness:
    name: Independent cloud and public-host liveness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public health endpoint
        id: health
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors --output /tmp/health.txt --write-out '%{http_code}' --max-time 20 https://dreamledger-silo-gateway.onrender.com/healthz)"
          test "$code" = "200"
          echo "health_http=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/health.txt || true

      - name: Observe public version endpoint (non-blocking metadata)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --retry 1 --retry-delay 2 --output /tmp/version.txt --write-out '%{http_code}' --max-time 20 https://dreamledger-silo-gateway.onrender.com/version || true)"
          if [[ "$code" == "200" && -s /tmp/version.txt ]]; then
            node - <<'NODE'
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/version.txt', 'utf8').replace(/^\\uFEFF/, '').trim();
            console.log(JSON.stringify({status: body ? 'PASS' : 'UNVERIFIED', body_nonempty: Boolean(body)}));
            NODE
            echo "version_status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "version_status=UNVERIFIED" >> "$GITHUB_OUTPUT"
            echo "VERSION_ENDPOINT_UNVERIFIED=http_$code; core liveness still requires /healthz and the Truth Oracle page"
          fi
          echo "version_http=$code" >> "$GITHUB_OUTPUT"

      - name: Check canonical public Truth Oracle page
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 https://dreamledger.org/truth-oracle.html)"
          test "$code" = "200"
          echo "truth_oracle_http=$code"
          echo '{"schema":"DREAMLEDGER-CLOUD-LIVENESS/v1","status":"PASS","external_action":"NONE","production_mutation":"NONE","revenue_claimed_nzd":0,"payment_claimed":0,"buyer_claimed":0}' > "$RUNNER_TEMP/cloud-liveness-proof.json"
          cat "$RUNNER_TEMP/cloud-liveness-proof.json"
