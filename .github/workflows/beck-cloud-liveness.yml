name: BECK Cloud Liveness
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beck-cloud-liveness.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beck-cloud-liveness
  cancel-in-progress: true

jobs:
  liveness:
    name: Independent cloud and public-host liveness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public health endpoint
        id: health
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors --output /tmp/health.txt --write-out '%{http_code}' --max-time 20 https://dreamledger-silo-gateway.onrender.com/healthz)"
          test "$code" = "200"
          echo "health_http=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/health.txt || true

      - name: Check gateway version endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://dreamledger-silo-gateway.onrender.com/version > "$RUNNER_TEMP/gateway-version.json"
          node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/gateway-version.json'));if(!data||typeof data!=='object')process.exit(1)"

      - name: Check canonical public Truth Oracle page
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --location --silent --show-error --retry 3 --retry-delay 3 --retry-all-errors --output /dev/null --write-out '%{http_code}' --max-time 30 https://dreamledger.org/truth-oracle.html)"
          test "$code" = "200"
          echo "truth_oracle_http=$code"
          echo '{"schema":"DREAMLEDGER-CLOUD-LIVENESS/v1","status":"PASS","external_action":"NONE","production_mutation":"NONE","revenue_claimed_nzd":0,"payment_claimed":0,"buyer_claimed":0}' > "$RUNNER_TEMP/cloud-liveness-proof.json"
          cat "$RUNNER_TEMP/cloud-liveness-proof.json"
