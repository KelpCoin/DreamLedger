name: BECK Cloud Liveness
on:
  push:
    branches: [main, feat/billboard-commercial-gauntlet-bootstrap]
    paths:
      - '.github/workflows/beck-cloud-liveness.yml'
      - 'scripts/beck-one-shot-bootstrap.ps1'
      - 'scripts/beck-economic-bootstrap.ps1'
      - 'ops/commerce/beck-monetization-scout.mjs'
      - 'ops/commerce/gauntlet-economic-verdict.mjs'
      - 'ops/commerce/reconcile-billboard-first-dollar.mjs'
      - 'public/agent-products.json'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beck-cloud-liveness
  cancel-in-progress: true

jobs:
  liveness:
    name: Independent cloud and public-host liveness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public health endpoint
        id: health
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors --output /tmp/health.txt --write-out '%{http_code}' --max-time 20 https://dreamledger-silo-gateway.onrender.com/healthz)"
          test "$code" = "200"
          echo "health_http=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/health.txt || true

      - name: Check public version endpoint
        id: version
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors --output /tmp/version.json --write-out '%{http_code}' --max-time 20 https://dreamledger.org/version)"
          test "$code" = "200"
          node - <<'NODE'
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/version.json', 'utf8').replace(/^\uFEFF/, '').trim();
          if (!body) process.exit(1);
          const x = JSON.parse(body);
          if (x.service !== 'dreamledger-storefront' || x.status !== 'ok') process.exit(1);
          console.log(JSON.stringify({status: 'PASS', service: x.service, service_status: x.status}));
          NODE
          echo "version_http=$code" >> "$GITHUB_OUTPUT"

      - name: Check canonical public Truth Oracle page
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 https://dreamledger.org/truth-oracle.html)"
          test "$code" = "200"
          echo "truth_oracle_http=$code"
          echo '{"schema":"DREAMLEDGER-CLOUD-LIVENESS/v1","status":"PASS","external_action":"NONE","production_mutation":"NONE","revenue_claimed_nzd":0,"payment_claimed":0,"buyer_claimed":0}' > "$RUNNER_TEMP/cloud-liveness-proof.json"
          cat "$RUNNER_TEMP/cloud-liveness-proof.json"
