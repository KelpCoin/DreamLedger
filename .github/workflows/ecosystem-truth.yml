name: DreamLedger Ecosystem Truth

on:
  push:
    branches: [main]
    paths:
      - 'BEC-PRIME/**'
      - 'api/**'
      - 'commerce/**'
      - 'ops/**'
      - 'package.json'
      - '.github/workflows/ecosystem-truth.yml'
  workflow_dispatch:
    inputs:
      attest:
        description: Create a signed provenance attestation for the release bundle
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: '17 3,15 * * *'

concurrency:
  group: dreamledger-ecosystem-truth
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Compile deterministic commerce surface
        run: npm run compile

      - name: Reject generated drift
        run: |
          set -euo pipefail
          git diff --exit-code
          echo 'DETERMINISTIC_COMPILE=PASS'

      - name: Verify revenue readiness
        shell: pwsh
        run: pwsh -NoProfile -File BEC-PRIME/scripts/Verify-RevenueReadiness.ps1

      - name: Verify silo boundaries
        run: npm run verify:silos

      - name: Verify agentic commerce surface
        run: npm run verify:agentic-commerce

      - name: Verify public surface
        run: node BEC-PRIME/scripts/verify-public-surface.js

      - name: Probe production root
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/root.html -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 20 https://dreamledger.org/ || true)
          test "$code" = '200'
          grep -Eqi 'DreamLedger|Dream Ledger' /tmp/root.html
          echo 'PRODUCTION_ROOT=PASS'

      - name: Probe production offers and canonical MTG offer
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/offers.json -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 20 https://dreamledger.org/api/offers || true)
          test "$code" = '200'
          python - <<'PY'
          import json
          data=json.load(open('/tmp/offers.json',encoding='utf-8'))
          offers=data.get('offers',[]) if isinstance(data,dict) else []
          target=next((x for x in offers if str(x.get('offer_id') or x.get('product_sku') or x.get('product_id') or '')=='COMMANDER-DECK-DIAGNOSTIC-001'),None)
          if target is None: raise SystemExit('COMMANDER_OFFER=NOT_EXPOSED')
          price=float(target.get('price'))
          if price not in (25.0,2500.0): raise SystemExit(f'COMMANDER_PRICE={price}')
          if str(target.get('currency','')).lower() not in ('','nzd'): raise SystemExit('COMMANDER_CURRENCY=MISMATCH')
          if 'checkout_available' in target and target.get('checkout_available') is not True: raise SystemExit('COMMANDER_CHECKOUT=UNAVAILABLE')
          print('PRODUCTION_OFFERS=PASS')
          print('COMMANDER_DECK_DIAGNOSTIC=PASS')
          PY

      - name: Probe production anonymous account
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/account.json -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 20 https://dreamledger.org/api/account/me || true)
          test "$code" = '200'
          grep -q '"authenticated":false' /tmp/account.json
          echo 'PRODUCTION_ACCOUNT_ME=PASS'

      - name: Emit ecosystem truth proof
        run: |
          set -euo pipefail
          mkdir -p proof
          printf '{"schema":"dreamledger-ecosystem-truth-v1","sha":"%s","run_id":"%s","source_compile":"PASS","silo_verification":"PASS","agentic_commerce_verification":"PASS","production_root":"PASS","production_offers":"PASS","commander_offer":"PASS","production_account_me":"PASS","payment_truth":"AWAITING_REAL_PAYMENT","revenue_claim":"NOT_CLAIMED"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > proof/ecosystem-truth.json
          cat proof/ecosystem-truth.json

      - name: Package compiled storefront
        run: |
          set -euo pipefail
          tar -czf dreamledger-release-${GITHUB_SHA}.tar.gz BEC-PRIME/compiled/website

      - name: Upload ecosystem proof
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-ecosystem-truth-${{ github.run_id }}
          path: |
            proof/ecosystem-truth.json
            dreamledger-release-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Attest release bundle
        if: github.event_name == 'workflow_dispatch' && inputs.attest == 'true'
        uses: actions/attest@v4
        with:
          subject-path: dreamledger-release-${{ github.sha }}.tar.gz
