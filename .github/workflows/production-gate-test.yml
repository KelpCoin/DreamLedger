name: Production Promotion Gate Test

on:
  pull_request:
    paths:
      - 'BEC-PRIME/production/**'
      - 'BEC-PRIME/gauntlet/**'
      - 'BEC-PRIME/compiler/LeverageGauntlet.js'
      - 'BEC-PRIME/elohim/**'
      - 'BEC-PRIME/scripts/test-production-promotion-gate.js'
      - 'promote.js'
      - 'package.json'
      - '.github/workflows/promote.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run test:production-gate
