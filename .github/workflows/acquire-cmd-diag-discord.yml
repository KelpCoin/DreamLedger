name: Acquire CMD-DIAG via Discord

on:
  push:
    paths:
      - ".github/acquisition/approved-dispatch.json"
  workflow_dispatch:
    inputs:
      target:
        description: "Discord target label configured by repository secret"
        required: true
        type: string
      approval:
        description: "Type APPROVED to authorize this external post"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cmd-diag-discord-acquisition
  cancel-in-progress: false

jobs:
  post:
    # Authorization is enforced in the first step for both push and manual runs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate acquisition inputs
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          test -n "$DISCORD_WEBHOOK"
          case "$DISCORD_WEBHOOK" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*) ;;
            *) echo "Invalid Discord webhook host"; exit 1 ;;
          esac
          if [ "$EVENT_NAME" = "push" ]; then
            test -f .github/acquisition/approved-dispatch.json
            python3 - <<'PY'
            import json
            with open(".github/acquisition/approved-dispatch.json", encoding="utf-8") as f:
                x = json.load(f)
            if x.get("approval") != "APPROVED":
                raise SystemExit("EXTERNAL_AUTHORIZATION_MISSING")
            if x.get("offer") != "CMD-DIAG-29":
                raise SystemExit("FIRST_DOLLAR_OFFER_MISMATCH")
            if not x.get("target"):
                raise SystemExit("DISCORD_TARGET_MISSING")
            print("PUSH_APPROVAL=VERIFIED")
            print("TARGET=" + str(x["target"]))
            PY
          else
            test -n "$TARGET"
          fi

      - name: Post CMD-DIAG offer and capture message
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          stripe_link = "https://buy.stripe.com/eVqeZdc1T01n1DV3gwdwc30"
          payload = {
              "content": (
                  "Commander Deck Diagnostic - NZ$29\n\n"
                  "I do written Commander deck diagnostics: power band assessment, "
                  "structural holes (mana base, card draw, interaction, win conditions), "
                  "and upgrade priorities. You send me your decklist, I send back a "
                  "practical first-pass PDF within 24 hours.\n\n"
                  "One-time purchase, no subscription. NZ$29.\n"
                  + stripe_link + "\n\n"
                  "If you want a second set of eyes on your deck, this is it."
              )
          }

          base = os.environ["DISCORD_WEBHOOK"]
          parts = urllib.parse.urlsplit(base)
          query = urllib.parse.parse_qsl(parts.query, keep_blank_values=True)
          query.append(("wait", "true"))
          post_url = urllib.parse.urlunsplit(
              (parts.scheme, parts.netloc, parts.path, urllib.parse.urlencode(query), parts.fragment)
          )

          req = urllib.request.Request(
              post_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status != 200:
                  raise SystemExit(f"Discord post did not return a message: HTTP {response.status}")
              body = json.loads(response.read().decode("utf-8"))

          message_id = body.get("id")
          channel_id = body.get("channel_id")
          content = body.get("content", "")
          if not message_id or not channel_id:
              raise SystemExit("Discord accepted the request but returned no message identity")
          if stripe_link not in content:
              raise SystemExit("Discord message identity returned, but the live Stripe link was not present")

          verify_url = base.rstrip("/") + "/messages/" + urllib.parse.quote(str(message_id), safe="")
          verify_req = urllib.request.Request(verify_url, headers={"Accept": "application/json"}, method="GET")
          with urllib.request.urlopen(verify_req, timeout=20) as response:
              if response.status != 200:
                  raise SystemExit(f"Discord message verification failed: HTTP {response.status}")
              verified = json.loads(response.read().decode("utf-8"))

          if verified.get("id") != message_id or verified.get("channel_id") != channel_id:
              raise SystemExit("Discord returned a mismatched message during verification")
          if stripe_link not in verified.get("content", ""):
              raise SystemExit("Verified Discord message does not contain the live Stripe link")

          print("DISCORD_POST=VERIFIED_RUNTIME")
          print("EXTERNAL_PUBLICATION=VERIFIED_DISCORD_MESSAGE")
          print("DISCORD_MESSAGE_ID=" + message_id)
          print("DISCORD_CHANNEL_ID=" + channel_id)
          print("EXTERNAL_REVENUE=UNVERIFIED")
          PY

      - name: Record acquisition state
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            TARGET="$(python3 - <<'PY'
import json
with open(".github/acquisition/approved-dispatch.json", encoding="utf-8") as f:
    print(json.load(f)["target"])
PY
)"
          else
            TARGET="$INPUT_TARGET"
          fi
          echo "TARGET=$TARGET"
          echo "OFFER=CMD-DIAG-29"
          echo "POST=VERIFIED_DISCORD_MESSAGE"
          echo "BUYER=UNVERIFIED"
          echo "REVENUE=UNVERIFIED"
