name: DreamLedger public surface gate
on:
  push:
    branches: [main]
    paths: ['public/**','.github/workflows/public-surface.yml','render.yaml']
  pull_request:
    paths: ['public/**','.github/workflows/public-surface.yml','render.yaml']
jobs:
  public-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Public surface gate
        run: node public/verify-public-surface.js