name: Marketplace Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/auctions.html'
      - 'BEC-PRIME/auction-engine.js'
      - 'BEC-PRIME/scripts/test-auction-safe-runtime.js'
      - 'ops/marketplace/**'
      - '.github/workflows/marketplace-integrity.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'BEC-PRIME/marketplace/**'
      - 'CORTEX/**'
      - 'policy/**'
      - '.github/workflows/marketplace-integrity.yml'
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Gauntlet + Elohim marketplace safety contracts
        run: |
          node --test ops/marketplace/marketplace-candidate-policy.test.cjs ops/marketplace/marketplace-self-build.test.cjs BEC-PRIME/scripts/test-auction-safe-runtime.js
          node ops/marketplace/marketplace-self-build.cjs
      - name: Preserve Gauntlet self-build proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beck-marketplace-self-build-${{ github.run_id }}
          path: proof/marketplace/self-build.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate marketplace contract
        run: python -m json.tool BEC-PRIME/marketplace/marketplace-contract.json >/dev/null
      - name: Validate marketplace runtime
        run: python BEC-PRIME/marketplace/marketplace-runtime.py
      - name: Compile Python modules
        run: python -m compileall -q CORTEX BEC-PRIME/marketplace
      - name: Run red-team regression
        run: python -m unittest CORTEX.test_redteam_extension
      - name: Ecosystem spine
        run: python CORTEX/ecosystem_spine.py
      - name: Build marketplace manifest
        run: |
          mkdir -p evidence
          find BEC-PRIME/marketplace -type f ! -path '*/__pycache__/*' -print0 | sort -z | xargs -0 sha256sum > evidence/marketplace-manifest.sha256
          sha256sum CORTEX/ecosystem_spine.py >> evidence/marketplace-manifest.sha256
      - name: Attest marketplace manifest
        uses: actions/attest@v4
        with:
          subject-path: evidence/marketplace-manifest.sha256

  safe-repair-proposal:
    needs: validate
    if: always() && github.event_name == 'schedule' && needs.validate.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Gauntlet isolate and Elohim generate safety patch
        run: |
          set -euo pipefail
          node ops/marketplace/marketplace-self-build.cjs --repair
          node --test ops/marketplace/marketplace-candidate-policy.test.cjs ops/marketplace/marketplace-self-build.test.cjs BEC-PRIME/scripts/test-auction-safe-runtime.js
      - name: Open bounded repair PR (no automatic merge)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files="$(git status --porcelain -- BEC-PRIME/auction-engine.js public/auctions.html)"
          if [ -z "$files" ]; then echo "NO_REPAIRABLE_REGRESSION"; exit 0; fi
          branch="beck/elohim-marketplace-repair"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add BEC-PRIME/auction-engine.js public/auctions.html
          git commit -m "fix(gauntlet): restore fail-closed auction invariants"
          git push --force-with-lease origin "$branch"
          gh pr view "$branch" --json url >/dev/null 2>&1 ||             gh pr create --base main --head "$branch"               --title "Elohim repair candidate: marketplace fail-closed auction safety"               --body "Generated by scheduled BECK Gauntlet from deterministic allowlisted source transformations. Safety tests passed. DRAFT REVIEW ONLY. No Stripe, DNS, deployment, public offers, prices or database mutations. Never merge without independent CI."               --draft
