name: BECK Bootstrap Commissioning Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/beck-one-shot-bootstrap.ps1'
      - 'scripts/beck-heartbeat.ps1'
      - 'scripts/install-beck-heartbeat.ps1'
      - 'scripts/beck-startup.ps1'
      - 'scripts/beck-economic-bootstrap.ps1'
      - 'scripts/beck-cockpit-bootstrap.ps1'
      - 'ops/cockpit/render-cockpit-html.mjs'
      - 'ops/cockpit/figure-eight-cockpit.mjs'
      - 'ops/commerce/gauntlet-economic-verdict.mjs'
      - '.github/workflows/beck-cloud-liveness.yml'
      - '.github/workflows/beck-bootstrap-commissioning.yml'
      - '.github/workflows/gauntlet-release-gate.yml'
      - 'public/agent-products.json'
      - 'public/ai-catalog.json'
      - 'public/agent-commerce.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beck-bootstrap-commissioning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'scripts/beck-one-shot-bootstrap.ps1',
            'scripts/beck-heartbeat.ps1',
            'scripts/install-beck-heartbeat.ps1',
            'scripts/beck-startup.ps1',
            'scripts/beck-economic-bootstrap.ps1',
            'scripts/beck-cockpit-bootstrap.ps1'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing required commissioning file: $file" }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $messages = @($errors | ForEach-Object { "line $($_.Extent.StartLineNumber): $($_.Message)" }) -join '; '
              throw "$file has PowerShell parse errors: $messages"
            }
            Write-Host "POWERSHELL_PARSE_PASS=$file"
          }
      - name: Validate independent cloud heartbeat safety contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrap = Get-Content 'scripts/beck-one-shot-bootstrap.ps1' -Raw
          $cloud = Get-Content '.github/workflows/beck-cloud-liveness.yml' -Raw
          if (-not $bootstrap.Contains('beck-cloud-liveness.yml')) { throw 'Bootstrap does not corroborate with the independent cloud heartbeat.' }
          if ($bootstrap.Contains('actions/workflows/beck-production-heartbeat.yml/runs')) { throw 'Bootstrap still depends on production heartbeat with self-heal side effects.' }
          if (-not $cloud.Contains('contents: read')) { throw 'Cloud heartbeat must be read-only.' }
          foreach ($forbidden in @('RENDER_API_KEY','api.stripe.com','/deploys','contents: write','stripe listen')) {
            if ($cloud.Contains($forbidden)) { throw "Cloud heartbeat contains forbidden capability: $forbidden" }
          }
          foreach ($endpoint in @('/healthz','/version','/truth-oracle.html')) {
            if (-not $cloud.Contains($endpoint)) { throw "Missing public liveness probe: $endpoint" }
          }
          if (-not $bootstrap.Contains("LOCAL_HEARTBEAT_TASK=REGISTERED")) { throw 'Bootstrap must emit local task registration proof.' }
          if (-not $bootstrap.Contains('DUAL_HEARTBEAT_STATUS=$dualHeartbeatStatus')) { throw 'Bootstrap must emit dual-heartbeat status.' }
          if (-not $bootstrap.Contains('$Branch = ''main''')) { throw 'Bootstrap must use main as the default runtime branch after merge.' }
          Write-Host 'BOOTSTRAP_CLOUD_SAFETY_CONTRACT=PASS'
      - name: Verify canonical Truth Oracle and commercial truth labels
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('public/agent-products.json','public/ai-catalog.json','public/agent-commerce.json')) {
            $content = Get-Content -LiteralPath $path -Raw
            if ($content -match 'AGENT-PROOF-AUDIT-49|Agent Delivery Proof Audit|agent-delivery-proof-audit') { throw "Retired audit offer remains in active public discovery surface: $path" }
            if ($content -notmatch 'TRUTH-ORACLE-FREE|Truth Oracle') { throw "Truth Oracle canonical destination missing from: $path" }
          }
          $releaseGate = Get-Content -LiteralPath '.github/workflows/gauntlet-release-gate.yml' -Raw
          if (-not $releaseGate.Contains("'status': 'PASS_TECHNICAL_ONLY'")) { throw 'Technical pass must not be mislabeled as a commercial pass.' }
          if (-not $releaseGate.Contains("'commercial_status': 'BLOCKED_PENDING_SETTLED_PAYMENT_AND_FULFILLMENT'")) { throw 'Commercial blocker must remain explicit until real payment and fulfillment evidence exist.' }
          Write-Host 'TRUTH_ORACLE_CATALOG_RETIREMENT=PASS'
          Write-Host 'COMMERCIAL_TRUTH_LABELS=PASS'
      - name: Validate cloud workflow YAML structure
        shell: bash
        run: |
          python -m pip install --quiet PyYAML
          python - <<'PY'
          import pathlib, yaml
          p = pathlib.Path('.github/workflows/beck-cloud-liveness.yml')
          d = yaml.safe_load(p.read_text())
          assert isinstance(d, dict) and isinstance(d.get('jobs'), dict) and 'liveness' in d['jobs']
          assert d['jobs']['liveness']['timeout-minutes'] <= 5
          print('CLOUD_WORKFLOW_STRUCTURE=PASS')
          PY
      - name: Run local execution-gate contract tests
        run: node --test BEC-PRIME/runtime/ExecutionGate.test.js
      - name: Test commercial Gauntlet fails closed without real evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $temp = Join-Path $env:RUNNER_TEMP 'commercial-gauntlet-empty-evidence'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          Push-Location $temp
          try {
            & node "$env:GITHUB_WORKSPACE/ops/commerce/gauntlet-economic-verdict.mjs"
            $exit = $LASTEXITCODE
            $proofPath = Join-Path $temp 'proof/commerce/latest-gauntlet-economic-verdict.json'
            if ($exit -ne 2) { throw "Expected fail-closed commercial verdict exit 2; got $exit" }
            if (-not (Test-Path $proofPath)) { throw 'Commercial Gauntlet did not emit a proof artifact.' }
            $proof = Get-Content $proofPath -Raw | ConvertFrom-Json
            if ($proof.verdict -ne 'BLOCKED_PENDING_FIRST_PAID_ORDER_AND_FULFILLMENT_PROOF') { throw "Unexpected commercial verdict: $($proof.verdict)" }
            if ($proof.economic_baseline.verified_business_revenue_nzd -ne 0) { throw 'Empty evidence must not produce verified revenue.' }
            Write-Host 'COMMERCIAL_GAUNTLET_FAIL_CLOSED=PASS'
          } finally { Pop-Location }
