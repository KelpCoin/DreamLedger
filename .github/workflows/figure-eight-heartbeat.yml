name: Figure Eight Heartbeat

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "buy/commander-deck-diagnostic-001/index.html"
      - "BEC-PRIME/catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json"
      - ".github/workflows/figure-eight-heartbeat.yml"

permissions:
  contents: read

concurrency:
  group: figure-eight-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    name: BECK public and commercial heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact triggering revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify checkout contract and public route
        id: probe
        shell: bash
        run: |
          set +e
          mkdir -p heartbeat-report
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = {
            generated_at: new Date().toISOString(),
            revision: process.env.GITHUB_SHA || 'unknown',
            checks: [],
            economic_status: 'UNVERIFIED',
            overall: 'FAIL'
          };
          const add = (name, status, detail) => report.checks.push({name, status, detail});
          const routeFile = 'buy/commander-deck-diagnostic-001/index.html';
          const catalogFile = 'BEC-PRIME/catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json';
          try {
            if (!fs.existsSync(routeFile)) throw new Error('Route source file missing');
            const html = fs.readFileSync(routeFile, 'utf8');
            if (!html.includes('https://buy.stripe.com/')) throw new Error('No Stripe checkout destination found in route source');
            add('route_source', 'PASS', routeFile + ' exists and contains a Stripe destination');
          } catch (e) { add('route_source', 'FAIL', e.message); }
          try {
            const catalog = JSON.parse(fs.readFileSync(catalogFile, 'utf8'));
            const serialized = JSON.stringify(catalog);
            const url = serialized.match(/https:\/\/buy\.stripe\.com\/[A-Za-z0-9]+/);
            const html = fs.existsSync(routeFile) ? fs.readFileSync(routeFile, 'utf8') : '';
            const routeUrl = html.match(/https:\/\/buy\.stripe\.com\/[A-Za-z0-9]+/);
            if (!url || !routeUrl) throw new Error('Could not extract checkout URL from both catalogue and route');
            if (url[0] !== routeUrl[0]) throw new Error('Catalogue checkout URL does not match route checkout URL');
            add('checkout_contract', 'PASS', 'Catalogue and route declare the same checkout URL');
          } catch (e) { add('checkout_contract', 'FAIL', e.message); }
          try {
            const response = await fetch('https://dreamledger.org/buy/commander-deck-diagnostic-001/', {redirect:'manual', signal:AbortSignal.timeout(12000)});
            const detail = 'HTTP ' + response.status + (response.headers.get('location') ? '; redirect present' : '');
            if (response.status >= 200 && response.status < 400) add('production_route', 'PASS', detail);
            else add('production_route', 'FAIL', detail);
          } catch (e) { add('production_route', 'FAIL', String(e.message || e)); }
          report.overall = report.checks.every(c => c.status === 'PASS') ? 'PASS' : 'FAIL';
          fs.writeFileSync('heartbeat-report/figure-eight-heartbeat.json', JSON.stringify(report, null, 2) + '\n');
          fs.writeFileSync('heartbeat-report/figure-eight-heartbeat.md',
            '# Figure Eight Heartbeat\n\n' +
            '- Time: ' + report.generated_at + '\n' +
            '- Revision: ' + report.revision + '\n' +
            '- Operational result: **' + report.overall + '**\n' +
            '- Economic result: **UNVERIFIED** (settlement and fulfillment are not verified by this workflow)\n\n' +
            report.checks.map(c => '- [' + c.status + '] ' + c.name + ': ' + c.detail).join('\n') + '\n');
          console.log(JSON.stringify(report, null, 2));
          if (report.overall !== 'PASS') process.exitCode = 1;
          NODE
          probe_status=$?
          echo "result=$probe_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish heartbeat evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figure-eight-heartbeat-${{ github.run_id }}
          path: heartbeat-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail the run if any required heartbeat check failed
        if: steps.probe.outputs.result != '0'
        run: exit 1
