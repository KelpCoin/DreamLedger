name: Figure Eight First-Dollar Heartbeat

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "billboard.html"
      - ".github/workflows/figure-eight-heartbeat.yml"

permissions:
  contents: read

concurrency:
  group: figure-eight-first-dollar
  cancel-in-progress: false

jobs:
  heartbeat:
    name: Billboard offer and checkout probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Probe Billboard offer, live route, and Stripe checkout
        id: probe
        shell: bash
        run: |
          set +e
          mkdir -p heartbeat-report
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const offerFile = 'billboard.html';
          const homeFile = 'index.html';
          const stripeUrl = 'https://buy.stripe.com/9B66oH2rj3dz82jcR6dwc2x';
          const routeUrl = 'https://dreamledger.org/billboard.html';
          const report = {
            generated_at: new Date().toISOString(),
            revision: process.env.GITHUB_SHA || 'unknown',
            offer: 'DreamLedger 3000 Founding Billboard',
            price: 'NZD 50',
            checks: [],
            economic_status: 'UNVERIFIED',
            overall: 'FAIL',
            note: 'A reachable checkout is not a settled payment. Revenue remains unverified until independently evidenced settlement and fulfillment exist.'
          };
          const add = (name, status, detail) => report.checks.push({name, status, detail});
          try {
            if (!fs.existsSync(offerFile)) throw new Error('Billboard source missing');
            const offerHtml = fs.readFileSync(offerFile, 'utf8');
            if (!offerHtml.includes('DreamLedger 3000') ||
                !offerHtml.includes('NZ$50') ||
                !offerHtml.includes(stripeUrl) ||
                !offerHtml.includes('Human review applies.')) {
              throw new Error('Billboard title, NZ$50 price, canonical Stripe URL, or human-review disclosure missing');
            }
            add('offer_source', 'PASS', 'Billboard source contains the NZ$50 offer, canonical Stripe URL, and human-review disclosure');
          } catch (e) { add('offer_source', 'FAIL', e.message); }
          try {
            if (!fs.existsSync(homeFile)) throw new Error('Homepage source missing');
            const home = fs.readFileSync(homeFile, 'utf8');
            if (!home.includes('href="/billboard.html"') || !home.includes('Billboard')) {
              throw new Error('Repository homepage does not link to the Billboard page');
            }
            add('homepage_source_cta', 'PASS', 'Repository homepage links to the Billboard offer');
          } catch (e) { add('homepage_source_cta', 'FAIL', e.message); }
          try {
            const response = await fetch('https://dreamledger.org/', {redirect:'follow', signal:AbortSignal.timeout(12000)});
            const body = await response.text();
            if (response.status < 200 || response.status >= 400) throw new Error('HTTP ' + response.status);
            if (!body.includes('/billboard.html') || !body.includes('Billboard')) {
              throw new Error('Live homepage is missing the Billboard link or label');
            }
            add('production_homepage', 'PASS', 'HTTP ' + response.status + '; live homepage links to Billboard');
          } catch (e) { add('production_homepage', 'FAIL', String(e.message || e)); }
          try {
            const response = await fetch(routeUrl, {redirect:'follow', signal:AbortSignal.timeout(12000)});
            const body = await response.text();
            if (response.status < 200 || response.status >= 400) throw new Error('HTTP ' + response.status);
            if (!body.includes('DreamLedger 3000') || !body.includes('NZ$50') ||
                !body.includes(stripeUrl) || !body.includes('Human review applies.')) {
              throw new Error('Live Billboard page is missing the expected offer, Stripe URL, or review disclosure');
            }
            add('production_offer', 'PASS', 'HTTP ' + response.status + '; live NZ$50 Billboard offer and Stripe destination found');
          } catch (e) { add('production_offer', 'FAIL', String(e.message || e)); }
          try {
            const response = await fetch(stripeUrl, {redirect:'manual', signal:AbortSignal.timeout(12000)});
            if (response.status < 200 || response.status >= 400) throw new Error('Stripe returned HTTP ' + response.status);
            add('stripe_link_reachability', 'PASS', 'Stripe Payment Link responded with HTTP ' + response.status + '; no payment or settlement inferred');
          } catch (e) { add('stripe_link_reachability', 'FAIL', String(e.message || e)); }
          report.overall = report.checks.every(c => c.status === 'PASS') ? 'PASS' : 'FAIL';
          fs.writeFileSync('heartbeat-report/figure-eight-heartbeat.json', JSON.stringify(report, null, 2) + '\n');
          fs.writeFileSync('heartbeat-report/figure-eight-heartbeat.md',
            '# Figure Eight First-Dollar Heartbeat\n\n' +
            '- Time: ' + report.generated_at + '\n' +
            '- Revision: ' + report.revision + '\n' +
            '- Offer: ' + report.offer + ' (' + report.price + ')\n' +
            '- Operational result: **' + report.overall + '**\n' +
            '- Economic result: **UNVERIFIED**\n\n' +
            report.note + '\n\n' +
            report.checks.map(c => '- [' + c.status + '] ' + c.name + ': ' + c.detail).join('\n') + '\n');
          console.log(JSON.stringify(report, null, 2));
          if (report.overall !== 'PASS') process.exitCode = 1;
          NODE
          probe_status=$?
          echo "result=$probe_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figure-eight-first-dollar-${{ github.run_id }}
          path: heartbeat-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if any required check failed
        if: steps.probe.outputs.result != '0'
        run: exit 1
