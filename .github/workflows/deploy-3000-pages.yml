name: Deploy DreamLedger static site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "CNAME"
      - ".github/workflows/deploy-3000-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dreamledger-static-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build and validate static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          test -s public/index.html
          cp -a public/. _site/
          cp CNAME _site/CNAME
          test "$(cat _site/CNAME)" = "dreamledger.org"
          test -s _site/index.html
          test -s _site/mtg/index.html
          test -s _site/data/mtg-catalog.json
          test -s _site/assets/silo-master.css
          printf '%s\n' "Static artifact validated: root, MTG page, MTG catalogue, shared CSS, CNAME."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write deployment proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p PROOFS/DEPLOYMENT
          cat > PROOFS/DEPLOYMENT/dreamledger-static-pages-proof.json <<EOF
          {
            "schema_version": 1,
            "surface": "dreamledger.org",
            "deployment": "github-pages",
            "commit": "${GITHUB_SHA}",
            "page_url": "${{ steps.deployment.outputs.page_url }}",
            "checks": {
              "root_index_present": true,
              "mtg_index_present": true,
              "mtg_catalogue_present": true,
              "shared_css_present": true,
              "cname_present": true,
              "cname": "dreamledger.org"
            },
            "note": "Artifact validation passed. DNS cutover and external route checks are separate required gates."
          }
          EOF
          sha256sum PROOFS/DEPLOYMENT/dreamledger-static-pages-proof.json > PROOFS/DEPLOYMENT/dreamledger-static-pages-proof.sha256
          cat PROOFS/DEPLOYMENT/dreamledger-static-pages-proof.json
          cat PROOFS/DEPLOYMENT/dreamledger-static-pages-proof.sha256
