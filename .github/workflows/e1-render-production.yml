name: DreamLedger Production - Canonical Catalog Gate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dreamledger-production
  cancel-in-progress: false

jobs:
  deploy-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      BASE_URL: https://dreamledger.org
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Compile canonical catalog
        working-directory: BEC-PRIME
        run: |
          set -euo pipefail
          npm install
          npm run compile
          test -s compiled/website/index.html
          test -s compiled/website/digital-products.html
          test -s compiled/website/avatar.html
          grep -q 'The catalogue is the product surface.' compiled/website/index.html
          grep -q 'Magic: The Gathering' compiled/website/index.html
          grep -q 'DreamLedger Cinema' compiled/website/index.html
          grep -q 'Digital Products' compiled/website/index.html
          grep -q 'DreamMee Avatar' compiled/website/index.html
          ! grep -qi 'Dream Ledger Deck' compiled/website/index.html
          ! grep -qi 'Amplissa' compiled/website/index.html
          ! grep -qi 'CollectorsCoast' compiled/website/index.html
          echo "PASS: canonical catalog compiled for $RELEASE_SHA"

      - name: Trigger exact Render deployment
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            separator='?'
            case "$RENDER_DEPLOY_HOOK_URL" in *\?*) separator='&';; esac
            curl --fail-with-body --silent --show-error --retry 4 --retry-delay 5 --max-time 45 -X POST "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${RELEASE_SHA}" >/tmp/render-trigger.json
            cat /tmp/render-trigger.json
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            version='v2.22.0'
            asset="cli_${version#v}_linux_amd64.zip"
            curl --fail --silent --show-error -L "https://github.com/render-oss/cli/releases/download/$version/$asset" -o /tmp/render-cli.zip
            unzip -q /tmp/render-cli.zip -d /tmp/render-cli
            RENDER_BIN=$(find /tmp/render-cli -type f -name render -perm -111 | head -n 1)
            test -n "$RENDER_BIN"
            export PATH="$(dirname "$RENDER_BIN"):$PATH"
            RENDER_API_KEY="$RENDER_API_KEY" render deploys create "$RENDER_SERVICE_ID" --commit "$RELEASE_SHA" --wait --confirm --output json >/tmp/render-deploy.json
            cat /tmp/render-deploy.json
          else
            echo 'FAIL: no Render deployment trigger configured.'
            exit 2
          fi

      - name: Verify live production
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          curl --fail --silent --show-error --retry 10 --retry-delay 10 --max-time 30 "$BASE_URL/healthz" >/tmp/healthz.json
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/healthz.json
          curl --fail --silent --show-error --retry 10 --retry-delay 10 --max-time 30 "$BASE_URL/version" >/tmp/version.json
          python3 - "$RELEASE_SHA" <<'PY'
          import json,sys
          expected=sys.argv[1]
          actual=json.load(open('/tmp/version.json'))
          deployed=actual.get('commit')
          if deployed != expected:
              raise SystemExit(f'FAIL: deployed SHA {deployed} != expected {expected}')
          print(f'PASS: live SHA {deployed}')
          PY

          curl --fail --silent --show-error --retry 10 --retry-delay 10 --max-time 30 "$BASE_URL/" >/tmp/home.html
          grep -q 'The catalogue is the product surface.' /tmp/home.html
          grep -q 'Magic: The Gathering' /tmp/home.html
          grep -q 'DreamLedger Cinema' /tmp/home.html
          grep -q 'Digital Products' /tmp/home.html
          grep -q 'DreamMee Avatar' /tmp/home.html
          ! grep -qi 'Dream Ledger Deck' /tmp/home.html
          ! grep -qi 'Amplissa' /tmp/home.html
          ! grep -qi 'CollectorsCoast' /tmp/home.html

          for route in /mtg /cinema.html /digital-products.html /avatar.html /marketplace.html; do
            code=$(curl -sS -o /tmp/route.html -w '%{http_code}' --retry 5 --retry-delay 5 --max-time 30 "$BASE_URL$route")
            test "$code" = 200
            test -s /tmp/route.html
          done

          curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 30 "$BASE_URL/mtg/diagnostic.html" >/tmp/diagnostic.html
          grep -qi 'Commander Deck Diagnostic' /tmp/diagnostic.html
          echo 'PASS: catalog + MTG + Cinema + Digital Products + Avatar + Marketplace live.'

      - name: Write deployment fossil
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 - "$RELEASE_SHA" <<'PY'
          import json,sys,time
          data={
            'production_truth':True,
            'source_commit':sys.argv[1],
            'target':'https://dreamledger.org',
            'homepage':'catalog',
            'surfaces':['/','/mtg','/cinema.html','/digital-products.html','/avatar.html','/marketplace.html','/mtg/diagnostic.html'],
            'historical_single_offer_removed_from_home':True,
            'collectors_coast_public_surface':False,
            'first_economic_proof':False,
            'revenue_nzd':0,
            'checked_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          }
          with open('proof/ProductionTruth-LATEST.json','w') as f: json.dump(data,f,indent=2)
          print(json.dumps(data,indent=2))
          PY

      - name: Upload deployment fossil
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-catalogue-production-truth-${{ env.RELEASE_SHA }}
          path: proof/ProductionTruth-LATEST.json
          retention-days: 30
