name: DreamLedger Production Boundary

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact commit SHA to verify in production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dreamledger-boundary
  cancel-in-progress: true

jobs:
  verify-storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify public storefront artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/billboard.html
          test -s public/avatar.html
          test -s public/server.js
          test -s public/sitemap.xml
          test -s public/robots.txt
          grep -qi 'THE INTERNET' public/index.html
          grep -qi 'IS A GARDEN' public/index.html
          grep -qi 'Plant a plot' public/index.html
          grep -qi 'See what' public/index.html
          grep -q 'href="/billboard"' public/index.html
          grep -q 'href="/dreammeez"' public/index.html
          grep -q 'href="/truth-oracle"' public/index.html
          ! grep -Eiq 'BECK|Gauntlet|Economic Court|ELOHIM|BrownEye Cortex|BEC-PRIME|AMPLISSA|COLLECTORSCOAST|SUPABASE_SERVICE_ROLE|STRIPE_SECRET' public/index.html public/billboard.html public/avatar.html public/server.js
          grep -q 'autoDeployTrigger: commit' render.yaml
          grep -q 'rootDir: public' render.yaml
          grep -q 'rootDir: BEC-PRIME' render.yaml
          grep -q "'/api/products'" public/server.js
          grep -q "'/sitemap.xml'" public/server.js
          grep -q "'/avatars'" public/server.js
          grep -q "'/api/offers'" public/server.js
          echo "SOURCE_STOREFRONT=PASS"
          echo "RELEASE_SHA=$RELEASE_SHA"

      - name: Write source proof artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 - "$RELEASE_SHA" <<'PY'
          import hashlib,json,sys,time
          files=['public/index.html','public/avatar.html','public/billboard.html','public/server.js','public/sitemap.xml','public/robots.txt','render.yaml']
          hashes={p:hashlib.sha256(open(p,'rb').read()).hexdigest() for p in files}
          data={'schema':'dreamledger/source-storefront-proof/v2','verdict':'PASS','source_commit':sys.argv[1],'target':'https://dreamledger.org','surface':'internet-garden','public_root':'public','private_root':'BEC-PRIME','customer_products':['internet-garden-plots','digital-billboards'],'forbidden_public_terms':True,'source_checks_only':True,'revenue_proven_nzd':0,'checked_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'sha256':hashes}
          json.dump(data,open('proof/SOURCE_STOREFRONT_PROOF.json','w'),indent=2)
          print(json.dumps(data,indent=2))
          PY

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: storefront-source-proof-${{ env.RELEASE_SHA }}
          path: proof/SOURCE_STOREFRONT_PROOF.json
          retention-days: 30
