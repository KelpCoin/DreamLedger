name: DreamLedger Production Boundary

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dreamledger-production
  cancel-in-progress: false

jobs:
  deploy-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      BASE_URL: https://dreamledger.org
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify public storefront artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/billboard.html
          test -s public/server.js
          test -s public/assets/dreamledger-tile-preview.svg
          grep -q 'DreamLedger 3000' public/index.html
          grep -q 'NZ$50' public/index.html
          grep -q 'Continue to secure payment' public/billboard.html
          ! grep -Eiq 'BECK|DECK|Gauntlet|Economic Court|Trust Engine|ELOHIM|BrownEye Cortex|BEC-PRIME|Dream Ledger Deck|conversations is not defined' public/index.html public/billboard.html public/server.js
          ! grep -Eiq 'MTG|CollectorsCoast|Amplissa|DreamMeez|cinema|Monte Carlo|avatar ecosystem' public/index.html public/billboard.html
          grep -q 'type: web' render.yaml
          grep -q 'rootDir: public' render.yaml
          grep -q 'type: pserv' render.yaml
          grep -q 'rootDir: BEC-PRIME' render.yaml
          echo "PASS: public/private topology and storefront artifact verified for $RELEASE_SHA"

      - name: Local storefront smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=18181 RENDER_GIT_COMMIT="$RELEASE_SHA" node public/server.js >/tmp/dreamledger-smoke.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:18181/healthz >/tmp/healthz; then break; fi
            sleep 1
          done
          test "$(cat /tmp/healthz)" = "ok"
          curl -fsS http://127.0.0.1:18181/ >/tmp/home.html
          curl -fsS http://127.0.0.1:18181/billboard >/tmp/billboard.html
          curl -fsS http://127.0.0.1:18181/assets/dreamledger-tile-preview.svg >/tmp/tile.svg
          curl -fsS http://127.0.0.1:18181/version >/tmp/version.json
          grep -q 'DreamLedger 3000' /tmp/home.html
          grep -q 'Continue to secure payment' /tmp/billboard.html
          test -s /tmp/tile.svg
          python3 - "$RELEASE_SHA" <<'PY'
          import json,sys
          expected=sys.argv[1]
          actual=json.load(open('/tmp/version.json'))
          assert actual.get('commit') == expected, actual
          assert actual.get('surface') == 'public-v3', actual
          print('PASS: local storefront smoke test')
          PY
          for path in /gauntlet /elohim /BEC-PRIME /admin /internal /api/offers /api/products /api/offer-checkout/create /.env /package.json /server.js /app.map /bundle.js.map /events.jsonl; do
            code=$(curl -sS -o /tmp/probe -w '%{http_code}' --max-time 5 "http://127.0.0.1:18181$path")
            case "$code" in
              403|404) ;;
              *) echo "FAIL: local $path returned $code"; exit 1;;
            esac
          done
          ! grep -Eiq 'BECK|DECK|Gauntlet|Economic Court|Trust Engine|ELOHIM|BrownEye Cortex|BEC-PRIME|Dream Ledger Deck|conversations is not defined|MTG|CollectorsCoast|Amplissa|DreamMeez|cinema|Monte Carlo|avatar ecosystem' /tmp/home.html /tmp/billboard.html
          echo 'PASS: local private-route and public-language smoke checks'

      - name: Trigger exact Render deployment
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            separator='?'
            case "$RENDER_DEPLOY_HOOK_URL" in *?*) separator='&';; esac
            curl --fail-with-body --silent --show-error --retry 4 --retry-delay 5 --max-time 45 -X POST "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${RELEASE_SHA}" >/tmp/render-trigger.json
            cat /tmp/render-trigger.json
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            version='v2.22.0'
            asset="cli_${version#v}_linux_amd64.zip"
            curl --fail --silent --show-error -L "https://github.com/render-oss/cli/releases/download/$version/$asset" -o /tmp/render-cli.zip
            unzip -q /tmp/render-cli.zip -d /tmp/render-cli
            RENDER_BIN=$(find /tmp/render-cli -type f -name render -perm -111 | head -n 1)
            test -n "$RENDER_BIN"
            export PATH="$(dirname "$RENDER_BIN"):$PATH"
            RENDER_API_KEY="$RENDER_API_KEY" render deploys create "$RENDER_SERVICE_ID" --commit "$RELEASE_SHA" --wait --confirm --output json >/tmp/render-deploy.json
            cat /tmp/render-deploy.json
          else
            echo 'FAIL: no Render deployment trigger configured.'
            exit 2
          fi

      - name: Verify live boundary
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          curl --fail --silent --show-error --retry 10 --retry-delay 10 --max-time 30 "$BASE_URL/healthz" >/tmp/healthz
          test "$(cat /tmp/healthz)" = "ok"
          curl --fail --silent --show-error --retry 10 --retry-delay 10 --max-time 30 "$BASE_URL/version" >/tmp/version.json
          python3 - "$RELEASE_SHA" <<'PY'
          import json,sys
          expected=sys.argv[1]
          actual=json.load(open('/tmp/version.json'))
          if actual.get('commit') != expected:
              raise SystemExit(f"FAIL: deployed SHA {actual.get('commit')} != expected {expected}")
          if actual.get('surface') != 'public-v3':
              raise SystemExit(f"FAIL: wrong public surface {actual.get('surface')}")
          print(f"PASS: live SHA {expected}, surface public-v3")
          PY
          curl --fail --silent --show-error --retry 10 --retry-delay 10 --max-time 30 "$BASE_URL/" >/tmp/home.html
          curl --fail --silent --show-error --retry 10 --retry-delay 10 --max-time 30 "$BASE_URL/billboard" >/tmp/billboard.html
          curl --fail --silent --show-error --retry 10 --retry-delay 10 --max-time 30 "$BASE_URL/assets/dreamledger-tile-preview.svg" >/tmp/tile.svg
          test -s /tmp/tile.svg
          ! grep -Eiq 'BECK|DECK|Gauntlet|Economic Court|Trust Engine|ELOHIM|BrownEye Cortex|BEC-PRIME|Dream Ledger Deck|conversations is not defined|MTG|CollectorsCoast|Amplissa|DreamMeez|cinema|Monte Carlo|avatar ecosystem' /tmp/home.html /tmp/billboard.html
          for path in /gauntlet /elohim /BEC-PRIME /admin /internal /api/offers /api/products /api/offer-checkout/create /.env /package.json /server.js /app.map /bundle.js.map /events.jsonl; do
            code=$(curl -sS -o /tmp/probe -w '%{http_code}' --max-time 20 "$BASE_URL$path")
            case "$code" in
              403|404) ;;
              *) echo "FAIL: $path returned $code"; exit 1;;
            esac
          done
          echo 'BOUNDARY_PROOF: PASS'

      - name: Write proof artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 - "$RELEASE_SHA" <<'PY'
          import hashlib,json,sys,time
          files=['public/index.html','public/billboard.html','public/server.js','public/assets/dreamledger-tile-preview.svg','render.yaml']
          hashes={p:hashlib.sha256(open(p,'rb').read()).hexdigest() for p in files}
          data={'schema':'dreamledger/boundary-proof/v3','verdict':'PASS','source_commit':sys.argv[1],'target':'https://dreamledger.org','surface':'public-v3','public_root':'public','private_root':'BEC-PRIME','forbidden_public_terms':True,'sensitive_files_blocked':True,'private_routes_blocked':True,'asset_serving_verified':True,'revenue_proven_nzd':0,'checked_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'sha256':hashes}
          json.dump(data,open('proof/BOUNDARY_PROOF.json','w'),indent=2)
          print(json.dumps(data,indent=2))
          PY

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: boundary-proof-${{ env.RELEASE_SHA }}
          path: proof/BOUNDARY_PROOF.json
          retention-days: 30
