name: DreamLedger Production - 3000 Gate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dreamledger-production
  cancel-in-progress: false

jobs:
  deploy-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      BASE_URL: https://dreamledger.org
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify public 3000 artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s BEC-PRIME/compiled/website/index.html
          grep -q '10,000 places' BEC-PRIME/compiled/website/index.html
          grep -q '1,000,000 pixels' BEC-PRIME/compiled/website/index.html
          grep -q 'NZ$50' BEC-PRIME/compiled/website/index.html
          grep -q '01.01.3000' BEC-PRIME/compiled/website/index.html
          grep -q 'buy.stripe.com' BEC-PRIME/compiled/website/index.html
          ! grep -qi 'Amplissa' BEC-PRIME/compiled/website/index.html
          ! grep -qi 'Magic: The Gathering' BEC-PRIME/compiled/website/index.html
          ! grep -qi 'DreamMeez' BEC-PRIME/compiled/website/index.html
          ! grep -qi 'CollectorsCoast' BEC-PRIME/compiled/website/index.html
          ! grep -qi 'cryptocurrency' BEC-PRIME/compiled/website/index.html
          echo "PASS: public surface is 3000-only for $RELEASE_SHA"

      - name: Trigger exact Render deployment
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            separator='?'
            case "$RENDER_DEPLOY_HOOK_URL" in *\?*) separator='&';; esac
            curl --fail-with-body --silent --show-error --retry 4 --retry-delay 5 --max-time 45 -X POST "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${RELEASE_SHA}" >/tmp/render-trigger.json
            cat /tmp/render-trigger.json
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            version='v2.22.0'
            asset="cli_${version#v}_linux_amd64.zip"
            curl --fail --silent --show-error -L "https://github.com/render-oss/cli/releases/download/$version/$asset" -o /tmp/render-cli.zip
            unzip -q /tmp/render-cli.zip -d /tmp/render-cli
            RENDER_BIN=$(find /tmp/render-cli -type f -name render -perm -111 | head -n 1)
            test -n "$RENDER_BIN"
            export PATH="$(dirname "$RENDER_BIN"):$PATH"
            RENDER_API_KEY="$RENDER_API_KEY" render deploys create "$RENDER_SERVICE_ID" --commit "$RELEASE_SHA" --wait --confirm --output json >/tmp/render-deploy.json
            cat /tmp/render-deploy.json
          else
            echo 'FAIL: no Render deployment trigger configured.'
            exit 2
          fi

      - name: Verify live 3000 production
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          curl --fail --silent --show-error --retry 10 --retry-delay 10 --max-time 30 "$BASE_URL/healthz" >/tmp/healthz.json
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/healthz.json
          curl --fail --silent --show-error --retry 10 --retry-delay 10 --max-time 30 "$BASE_URL/version" >/tmp/version.json
          python3 - "$RELEASE_SHA" <<'PY'
          import json,sys
          expected=sys.argv[1]
          actual=json.load(open('/tmp/version.json'))
          if actual.get('commit') != expected:
              raise SystemExit(f"FAIL: deployed SHA {actual.get('commit')} != expected {expected}")
          print(f"PASS: live SHA {expected}")
          PY
          curl --fail --silent --show-error --retry 10 --retry-delay 10 --max-time 30 "$BASE_URL/" >/tmp/home.html
          grep -q '3000.' /tmp/home.html
          grep -q '10,000 places' /tmp/home.html
          grep -q 'NZ$50' /tmp/home.html
          grep -q '01.01.3000' /tmp/home.html
          ! grep -qi 'Amplissa' /tmp/home.html
          ! grep -qi 'Magic: The Gathering' /tmp/home.html
          ! grep -qi 'DreamMeez' /tmp/home.html
          ! grep -qi 'CollectorsCoast' /tmp/home.html
          ! grep -qi 'cryptocurrency' /tmp/home.html
          echo 'PASS: live public doorway is 3000-only.'

      - name: Write deployment proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 - "$RELEASE_SHA" <<'PY'
          import hashlib,json,sys,time
          path='BEC-PRIME/compiled/website/index.html'
          digest=hashlib.sha256(open(path,'rb').read()).hexdigest()
          data={'product':'3000','source_commit':sys.argv[1],'target':'https://dreamledger.org','public_surface':'3000-only','price_nzd':50,'places':10000,'pixels':1000000,'horizon':'3000-01-01','public_silo_spillage':False,'revenue_proven_nzd':0,'customers_proven':0,'checked_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'public_index_sha256':digest}
          json.dump(data,open('proof/3000-ProductionTruth.json','w'),indent=2)
          print(json.dumps(data,indent=2))
          PY

      - name: Upload deployment proof
        uses: actions/upload-artifact@v4
        with:
          name: 3000-production-truth-${{ env.RELEASE_SHA }}
          path: proof/3000-ProductionTruth.json
          retention-days: 30
