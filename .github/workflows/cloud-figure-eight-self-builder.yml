name: Cloud Figure Eight Self-Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - "ops/cloud/cloud-figure-eight-builder.py"
      - ".github/workflows/cloud-figure-eight-self-builder.yml"

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: dreamledger-cloud-figure-eight-builder
  cancel-in-progress: false

jobs:
  hunt-build-gauntlet:
    name: Hunt, build candidate, and request independent Gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Inventory failures and build one bounded candidate
        id: builder
        env:
          GITHUB_TOKEN: \${{ github.token }}
          GITHUB_REPOSITORY: \${{ github.repository }}
          CLOUD_BUILDER_ENABLED: \${{ vars.CLOUD_BUILDER_ENABLED }}
          OPENAI_API_KEY: \${{ secrets.OPENAI_API_KEY }}
          CLOUD_BUILDER_MODEL: \${{ vars.CLOUD_BUILDER_MODEL }}
        run: python ops/cloud/cloud-figure-eight-builder.py

      - name: Open or update candidate pull request
        if: steps.builder.outputs.candidate-ready == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: \${{ github.token }}
          branch: cloud-builder/daily-candidate
          delete-branch: false
          add-paths: |
            docs/**
            tests/**
            ops/demand/**
            ops/cube/**
            BEC-PRIME/compiler/**
            BEC-PRIME/scripts/**
            runtime/777/**
          commit-message: "Cloud Figure Eight: submit Gauntlet-reviewed candidate"
          title: "Cloud Figure Eight: bounded autonomous engineering candidate"
          body: |
            ## Purpose
            This candidate was generated by the bounded cloud builder from repository context and recent failed-workflow metadata.

            ## Safety contract
            - Maximum five changed files and 24,000 patch characters.
            - Protected commerce, payment, fulfillment, evidence, deployment, workflow, and configuration paths are excluded.
            - Local syntax and diff checks must pass before this PR is opened.
            - Independent CI and Gauntlet review remain mandatory.
            - This workflow never merges, deploys, contacts buyers, or initiates payments.
            - No revenue is claimed by this PR.

            Review the actual diff and all checks before merging.

      - name: Upload cloud builder evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-figure-eight-builder-\${{ github.run_id }}
          path: proof/cloud-builder/
          if-no-files-found: warn
          retention-days: 30
