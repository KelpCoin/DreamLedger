name: Stripe Checkout Contract

on:
  push:
    paths:
      - 'BEC-PRIME/**'
      - 'api/**'
      - 'scripts/**'
      - 'public/hypothesisCommercePreload.js'
      - 'BEC-PRIME/runtime/BridgeRail.js'
      - '.github/workflows/stripe-checkout-contract.yml'
  pull_request:
    paths:
      - 'BEC-PRIME/**'
      - 'api/**'
      - 'scripts/**'
      - '.github/workflows/stripe-checkout-contract.yml'

permissions:
  contents: read

jobs:
  stripe-checkout-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Stripe Checkout producers
        run: node BEC-PRIME/scripts/verify-stripe-checkout-contract.js
      - name: Use Node 24 for signed webhook contract
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Signed Commander webhook contract (synthetic, no DB writes)
        run: node --test scripts/test-commander-signed-webhook.cjs
      - name: Isolated test-mode Commander status and ledger contract
        run: node --test scripts/test-beck-supabase-checkout.cjs
      - name: Attest exact status verifier and regression SHA256
        run: sha256sum supabase/functions/mtg-commander-status/index.ts scripts/test-beck-supabase-checkout.cjs
      - name: SHA256 source and regression
        run: sha256sum supabase/functions/stripe-revenue-41104f355d6878cdd6d1f9dc/index.ts scripts/test-commander-signed-webhook.cjs
      - name: Syntax check verifier
        run: node --check BEC-PRIME/scripts/verify-stripe-checkout-contract.js
      - name: Syntax check public hypothesis surface
        run: node --check public/hypothesisCommercePreload.js
      - name: Syntax check bridge rail
        run: node --check BEC-PRIME/runtime/BridgeRail.js
