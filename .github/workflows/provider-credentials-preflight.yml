name: BECK Provider Credential Preflight
# Read-only operator recheck 2026-10-22: validates provider credentials and both SQL paths; no deployment.

on:
  push:
    branches:
      - 'beck/provider-migration-neon-cloudflare-20261019'
    paths:
      - '.github/workflows/provider-credentials-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-credentials-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-only-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      NEON_ENDPOINT_ID: ${{ secrets.NEON_ENDPOINT_ID }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install PostgreSQL client for read-only connectivity probes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Perform secret-safe provider and SQL preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/migration
          node <<'NODE'
          const fs = require('fs');
          const { spawnSync } = require('child_process');
          const out = 'proof/migration/provider-credentials-preflight.json';
          const env = process.env;
          const present = name => Boolean(env[name] && env[name].trim());
          const proof = {
            schema: 'dreamledger/provider-credential-preflight/v2',
            checked_at_utc: new Date().toISOString(),
            commit_sha: env.GITHUB_SHA || null,
            purpose: 'Read-only preflight. Provider GET requests and SQL SELECT 1 only. No secrets or raw provider responses are persisted.',
            configuration: {
              neon_api_and_ids_present: present('NEON_API_KEY') && present('NEON_PROJECT_ID') && present('NEON_ENDPOINT_ID'),
              neon_database_url_present: present('NEON_DATABASE_URL'),
              supabase_database_url_present: present('SUPABASE_DATABASE_URL'),
              cloudflare_api_and_ids_present: present('CLOUDFLARE_API_TOKEN') && present('CLOUDFLARE_ACCOUNT_ID') && present('CLOUDFLARE_PAGES_PROJECT')
            },
            provider_reads: {
              neon_endpoint: { attempted: false, http_status: null, api_success: false },
              cloudflare_pages_project: { attempted: false, http_status: null, api_success: false },
              cloudflare_pages_domains: { attempted: false, http_status: null, api_success: false }
            },
            sql_probes: {
              supabase_source: { attempted: false, select_1_passed: false, error_class: null },
              neon_target: { attempted: false, select_1_passed: false, error_class: null }
            },
            provider_mutations: false,
            database_mutations: false,
            dns_changed: false,
            stripe_mutated: false,
            production_deployment_triggered: false,
            public_post_created: false,
            verified_revenue_nzd: 0
          };
          async function readJson(url, token) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 10000);
            try {
              const r = await fetch(url, { method: 'GET', redirect: 'manual', signal: controller.signal,
                headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' } });
              let body = null;
              try { body = await r.json(); } catch {}
              return { http_status: r.status, api_success: r.ok && (!body || body.success !== false) };
            } catch (e) {
              return { http_status: 0, api_success: false, error_class: e && e.name ? e.name : 'FetchError' };
            } finally { clearTimeout(timer); }
          }
          function sqlSelectOne(name, raw) {
            if (!raw || !raw.trim()) return { attempted:false, select_1_passed:false, error_class:'CONNECTION_SECRET_MISSING' };
            let u;
            try {
              u = new URL(raw);
              if (!['postgres:','postgresql:'].includes(u.protocol) || !u.hostname || !u.username || !u.pathname || u.pathname === '/') {
                return { attempted:false, select_1_passed:false, error_class:'CONNECTION_URL_INVALID' };
              }
            } catch {
              return { attempted:false, select_1_passed:false, error_class:'CONNECTION_URL_INVALID' };
            }
            const childEnv = {
              ...process.env,
              PGHOST: u.hostname,
              PGPORT: u.port || '5432',
              PGDATABASE: decodeURIComponent(u.pathname.slice(1)),
              PGUSER: decodeURIComponent(u.username),
              PGPASSWORD: decodeURIComponent(u.password),
              PGSSLMODE: 'require',
              PGCONNECT_TIMEOUT: '8'
            };
            const r = spawnSync('psql', ['-X','-w','-A','-t','-v','ON_ERROR_STOP=1','-c','SELECT 1'], {
              env: childEnv, encoding: 'utf8', timeout: 12000, maxBuffer: 4096, stdio: ['ignore','pipe','pipe']
            });
            const ok = r.status === 0 && String(r.stdout || '').trim() === '1';
            const err = r.error ? (r.error.code === 'ETIMEDOUT' ? 'PROBE_TIMEOUT' : 'PROBE_PROCESS_ERROR') : (ok ? null : 'SQL_CONNECT_OR_QUERY_FAILED');
            return { attempted:true, select_1_passed:ok, error_class:err };
          }
          (async () => {
            if (proof.configuration.neon_api_and_ids_present) {
              proof.provider_reads.neon_endpoint.attempted = true;
              const url = 'https://console.neon.tech/api/v2/projects/' + encodeURIComponent(env.NEON_PROJECT_ID) + '/endpoints/' + encodeURIComponent(env.NEON_ENDPOINT_ID);
              Object.assign(proof.provider_reads.neon_endpoint, await readJson(url, env.NEON_API_KEY));
            }
            if (proof.configuration.cloudflare_api_and_ids_present) {
              const root = 'https://api.cloudflare.com/client/v4/accounts/' + encodeURIComponent(env.CLOUDFLARE_ACCOUNT_ID) + '/pages/projects/' + encodeURIComponent(env.CLOUDFLARE_PAGES_PROJECT);
              proof.provider_reads.cloudflare_pages_project.attempted = true;
              Object.assign(proof.provider_reads.cloudflare_pages_project, await readJson(root, env.CLOUDFLARE_API_TOKEN));
              proof.provider_reads.cloudflare_pages_domains.attempted = true;
              Object.assign(proof.provider_reads.cloudflare_pages_domains, await readJson(root + '/domains', env.CLOUDFLARE_API_TOKEN));
            }
            proof.sql_probes.supabase_source = sqlSelectOne('supabase_source', env.SUPABASE_DATABASE_URL);
            proof.sql_probes.neon_target = sqlSelectOne('neon_target', env.NEON_DATABASE_URL);
            const providerApisOk = proof.provider_reads.neon_endpoint.api_success &&
              proof.provider_reads.cloudflare_pages_project.api_success &&
              proof.provider_reads.cloudflare_pages_domains.api_success;
            const sqlOk = proof.sql_probes.supabase_source.select_1_passed && proof.sql_probes.neon_target.select_1_passed;
            proof.status = providerApisOk && sqlOk
              ? 'PROVIDER_APIS_AND_BOTH_DATABASES_READABLE'
              : providerApisOk
                ? 'PROVIDER_APIS_READABLE_SQL_CONNECTIVITY_BLOCKED'
                : 'BLOCKED_MISSING_OR_INVALID_PROVIDER_CONFIGURATION';
            proof.interpretation = 'SELECT 1 proves basic connectivity only; no schema parity, data copy, writes, read-back, restore, route parity, production readiness or revenue are asserted.';
            fs.writeFileSync(out, JSON.stringify(proof, null, 2) + '\n');
            console.log(JSON.stringify(proof, null, 2));
            // The JSON contract is authoritative: a BLOCKED result must fail CI,
            // even when the read-only script produced an artifact successfully.
            if (proof.status !== 'PROVIDER_APIS_AND_BOTH_DATABASES_READABLE') process.exitCode = 2;
          })().catch(e => {
            const failure = { schema:'dreamledger/provider-credential-preflight/v2', status:'PREFLIGHT_INTERNAL_ERROR',
              checked_at_utc:new Date().toISOString(), error_class:e && e.name ? e.name : 'Error',
              provider_mutations:false, database_mutations:false, production_deployment_triggered:false, verified_revenue_nzd:0 };
            fs.writeFileSync(out, JSON.stringify(failure, null, 2) + '\n');
            console.log(JSON.stringify(failure, null, 2));
            process.exitCode = 1;
          });
          NODE
      - name: Retain secret-safe preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-credentials-preflight-${{ github.run_id }}
          path: proof/migration/provider-credentials-preflight.json
          if-no-files-found: error
          retention-days: 30
