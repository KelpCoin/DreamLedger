name: BECK Provider Credential Preflight

on:
  push:
    branches:
      - 'beck/provider-migration-neon-cloudflare-20261019'
    paths:
      - '.github/workflows/provider-credentials-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-credentials-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-only-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      NEON_ENDPOINT_ID: ${{ secrets.NEON_ENDPOINT_ID }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Perform secret-safe provider preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/migration
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const out = 'proof/migration/provider-credentials-preflight.json';
          const env = process.env;
          const present = name => Boolean(env[name] && env[name].trim());
          const proof = {
            schema: 'dreamledger/provider-credential-preflight/v1',
            checked_at_utc: new Date().toISOString(),
            commit_sha: env.GITHUB_SHA || null,
            purpose: 'Read-only credential/configuration preflight. No resources created, changed or deployed.',
            configuration: {
              neon_api_key_present: present('NEON_API_KEY'),
              neon_project_id_present: present('NEON_PROJECT_ID'),
              neon_endpoint_id_present: present('NEON_ENDPOINT_ID'),
              neon_database_url_present: present('NEON_DATABASE_URL'),
              cloudflare_api_token_present: present('CLOUDFLARE_API_TOKEN'),
              cloudflare_account_id_present: present('CLOUDFLARE_ACCOUNT_ID'),
              cloudflare_pages_project_present: present('CLOUDFLARE_PAGES_PROJECT')
            },
            provider_reads: {
              neon_endpoint: { attempted: false, http_status: null, api_success: false },
              cloudflare_pages_project: { attempted: false, http_status: null, api_success: false },
              cloudflare_pages_domains: { attempted: false, http_status: null, api_success: false }
            },
            database_sql_probe: {
              attempted: false,
              status: 'NOT_RUN_BY_THIS_PREFLIGHT',
              explanation: 'A configured connection-string secret is not DB connectivity proof; SQL connection/read-back is a separate acceptance gate.'
            },
            provider_mutations: false,
            database_mutations: false,
            dns_changed: false,
            stripe_mutated: false,
            production_deployment_triggered: false,
            public_post_created: false,
            verified_revenue_nzd: 0
          };
          async function readJson(url, token) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 10000);
            try {
              const r = await fetch(url, {
                method: 'GET',
                redirect: 'manual',
                signal: controller.signal,
                headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' }
              });
              let body = null;
              try { body = await r.json(); } catch {}
              return { http_status: r.status, api_success: r.ok && (!body || body.success !== false) };
            } catch (e) {
              return { http_status: 0, api_success: false, error_class: e && e.name ? e.name : 'FetchError' };
            } finally { clearTimeout(timer); }
          }
          (async () => {
            if (present('NEON_API_KEY') && present('NEON_PROJECT_ID') && present('NEON_ENDPOINT_ID')) {
              proof.provider_reads.neon_endpoint.attempted = true;
              const url = 'https://console.neon.tech/api/v2/projects/' + encodeURIComponent(env.NEON_PROJECT_ID) + '/endpoints/' + encodeURIComponent(env.NEON_ENDPOINT_ID);
              Object.assign(proof.provider_reads.neon_endpoint, await readJson(url, env.NEON_API_KEY));
            }
            if (present('CLOUDFLARE_API_TOKEN') && present('CLOUDFLARE_ACCOUNT_ID') && present('CLOUDFLARE_PAGES_PROJECT')) {
              const root = 'https://api.cloudflare.com/client/v4/accounts/' + encodeURIComponent(env.CLOUDFLARE_ACCOUNT_ID) + '/pages/projects/' + encodeURIComponent(env.CLOUDFLARE_PAGES_PROJECT);
              proof.provider_reads.cloudflare_pages_project.attempted = true;
              Object.assign(proof.provider_reads.cloudflare_pages_project, await readJson(root, env.CLOUDFLARE_API_TOKEN));
              proof.provider_reads.cloudflare_pages_domains.attempted = true;
              Object.assign(proof.provider_reads.cloudflare_pages_domains, await readJson(root + '/domains', env.CLOUDFLARE_API_TOKEN));
            }
            const configured = Object.values(proof.configuration).every(Boolean);
            const neonOk = proof.provider_reads.neon_endpoint.api_success;
            const cfOk = proof.provider_reads.cloudflare_pages_project.api_success && proof.provider_reads.cloudflare_pages_domains.api_success;
            proof.status = configured && neonOk && cfOk
              ? 'PROVIDER_CONTROL_APIS_READABLE_DB_UNVERIFIED'
              : 'BLOCKED_MISSING_OR_INVALID_PROVIDER_CONFIGURATION';
            proof.interpretation = 'Read-only provider API status only. This is not a migration or SQL readiness result. Dynamic route parity remains separately gated.';
            fs.writeFileSync(out, JSON.stringify(proof, null, 2) + '\n');
            console.log(JSON.stringify(proof, null, 2));
          })().catch(e => {
            const failure = {
              schema:'dreamledger/provider-credential-preflight/v1',
              status:'PREFLIGHT_INTERNAL_ERROR',
              checked_at_utc:new Date().toISOString(),
              error_class:e && e.name ? e.name : 'Error',
              provider_mutations:false,
              database_mutations:false,
              production_deployment_triggered:false,
              verified_revenue_nzd:0
            };
            fs.writeFileSync(out, JSON.stringify(failure, null, 2) + '\n');
            console.log(JSON.stringify(failure, null, 2));
            process.exitCode = 1;
          });
          NODE
      - name: Retain secret-safe preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-credentials-preflight-${{ github.run_id }}
          path: proof/migration/provider-credentials-preflight.json
          if-no-files-found: error
          retention-days: 30
