name: Kelphaven.n Live Read-only Smoke
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public base URL to smoke-test
        required: true
        default: https://dreamledger.org
permissions:
  contents: read
jobs:
  read-only-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke-test public pages and discovery endpoints (read-only)
        env:
          KELPHAVEN_BASE_URL: ${{ inputs.base_url }}
        run: node BEC-PRIME/scripts/kelphaven-live-smoke.mjs
