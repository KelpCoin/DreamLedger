name: Revenue Sentinel

on:
  push:
    branches: [main]
    paths:
      - "public/home.html"
      - "public/quote-compare-49.html"
      - "public/quote-intake.html"
      - "public/terms.html"
      - "public/contact.html"
      - "supabase/functions/quote-intake/index.ts"
      - "supabase/functions/quote-fulfillment/index.ts"
      - "supabase/functions/truth-oracle-execute/index.ts"
      - "BEC-PRIME/catalog/offers/approved.json"
      - "BEC-PRIME/fulfillment/PRODUCT-FULFILLMENT-REGISTRY.json"
      - "scripts/verify_quote_path_contract.py"
      - "scripts/verify_revenue_identity_boundary.py"
      - ".github/workflows/revenue-sentinel.yml"
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify active payment links are reachable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          p = Path('commerce/marketing/ACTIVE-PAYMENT-LINKS.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          failures = []
          checked = 0
          for item in data.get('links', []):
              sku = item.get('sku') or item.get('id') or 'UNKNOWN-SKU'
              url = item.get('url')
              status = item.get('status', '')
              if not url:
                  if status == 'OPTIONAL_ITEM_ON_STANDARD_LINK':
                      print(f"SKIP {sku} no standalone payment URL")
                      continue
                  failures.append(f"{sku} missing URL")
                  continue
              if not str(url).startswith('https://'):
                  failures.append(f"{sku} invalid URL")
                  continue
              result = subprocess.run(
                  ['curl', '-L', '-sS', '-o', '/dev/null', '-w', '%{http_code}', '--max-time', '20', url],
                  capture_output=True, text=True
              )
              code = result.stdout.strip()
              checked += 1
              print(f"{sku} {url} HTTP {code}")
              if code not in {'200', '301', '302', '303', '307', '308'}:
                  failures.append(f"{sku} HTTP {code}")
          if failures:
              raise SystemExit('PAYMENT_LINK_FAILURE: ' + '; '.join(failures))
          print(f'PASS: all {checked} standalone payment links are reachable.')
          PY

      - name: Probe DreamLedger public domain
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -L -sS -o "$RUNNER_TEMP/dreamledger.html" -w '%{http_code}' --max-time 20 https://dreamledger.org/ || true)"
          echo "dreamledger.org HTTP $status"
          if [ "$status" = "200" ] && grep -qi 'DreamLedger' "$RUNNER_TEMP/dreamledger.html"; then
            echo 'PASS: dreamledger.org serves DreamLedger.'
          else
            echo 'FAIL: dreamledger.org is not yet serving the DreamLedger surface.'
            exit 1
          fi

      - name: Probe anonymous account endpoint
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o "$RUNNER_TEMP/account.json" -w '%{http_code}' --max-time 20 https://dreamledger.org/api/account/me || true)"
          echo "dreamledger.org/api/account/me HTTP $status"
          if [ "$status" = "200" ] && grep -q '"authenticated":false' "$RUNNER_TEMP/account.json"; then
            echo 'PASS: anonymous account endpoint is healthy.'
          else
            echo 'FAIL: account endpoint is not returning the expected anonymous response.'
            cat "$RUNNER_TEMP/account.json" 2>/dev/null || true
            exit 1
          fi

      - name: Verify Quote Compare live commercial contract
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STRIPE_SECRET_KEY"
          LINK_ID="plink_1USpJeEGgEAnUFF9vNDiM8SS"
          EXPECTED_URL="https://buy.stripe.com/00wdR93vnbK5eqH3gwdwc3r"
          EXPECTED_RETURN='https://dreamledger.org/quote-intake.html?session_id={CHECKOUT_SESSION_ID}'
          curl -fsS "https://api.stripe.com/v1/payment_links/$LINK_ID" -u "$STRIPE_SECRET_KEY:" > "$RUNNER_TEMP/quote-link.json"
          jq -e --arg u "$EXPECTED_URL" --arg r "$EXPECTED_RETURN" '
            .active == true and .livemode == true and .url == $u and
            .metadata.sku == "QUOTE-COMPARE-49" and
            .metadata.silo == "truth_oracle" and
            .after_completion.type == "redirect" and
            .after_completion.redirect.url == $r
          ' "$RUNNER_TEMP/quote-link.json" >/dev/null
          curl -fsS https://api.stripe.com/v1/webhook_endpoints -u "$STRIPE_SECRET_KEY:" -G --data-urlencode limit=100 > "$RUNNER_TEMP/webhooks.json"
          jq -e '[.data[] | select(.url=="https://wbwgroygjeyukkspnqiy.supabase.co/functions/v1/stripe-revenue-41104f355d6878cdd6d1f9dc" and .status=="enabled")] | length == 1' "$RUNNER_TEMP/webhooks.json" >/dev/null
          jq -e '[.data[] | select(.url=="https://wbwgroygjeyukkspnqiy.supabase.co/functions/v1/dreamledger-stripe-webhook-v2" and .status=="disabled")] | length == 1' "$RUNNER_TEMP/webhooks.json" >/dev/null
          curl -fsS https://wbwgroygjeyukkspnqiy.supabase.co/functions/v1/stripe-revenue-41104f355d6878cdd6d1f9dc > "$RUNNER_TEMP/settlement-health.json"
          jq -e '.status=="healthy" and .configured==true' "$RUNNER_TEMP/settlement-health.json" >/dev/null
          code="$(curl -sS -o "$RUNNER_TEMP/intake.json" -w '%{http_code}' --max-time 20 -X POST https://wbwgroygjeyukkspnqiy.supabase.co/functions/v1/quote-intake -H 'content-type: application/json' --data '{"action":"status","session_id":"bad"}' || true)"
          test "$code" = "400"
          jq -e '.error=="INVALID_SESSION_ID"' "$RUNNER_TEMP/intake.json" >/dev/null
          # The live Stripe Payment Link sends actual paid buyers here.
          # A healthy checkout with a missing intake page is a broken sale.
          intake_code="$(curl -sS -L -o "$RUNNER_TEMP/quote-intake-page.html" -w '%{http_code}' --max-time 20 https://dreamledger.org/quote-intake.html || true)"
          test "$intake_code" = "200"
          grep -Fq 'Upload your supplier quotes' "$RUNNER_TEMP/quote-intake-page.html"
          grep -Fq 'noindex,nofollow' "$RUNNER_TEMP/quote-intake-page.html"
          grep -Fq 'https://wbwgroygjeyukkspnqiy.supabase.co/functions/v1/quote-intake' "$RUNNER_TEMP/quote-intake-page.html"
          grep -Fq 'PAYMENT_NOT_SETTLED' "$RUNNER_TEMP/quote-intake-page.html"
          curl -fsS https://dreamledger.org/quote-compare-49.html > "$RUNNER_TEMP/quote-page.html"
          grep -Fq "$EXPECTED_URL" "$RUNNER_TEMP/quote-page.html"
          grep -Fq 'DreamLedger is in trade in New Zealand' "$RUNNER_TEMP/quote-page.html"
          echo 'QUOTE_REVENUE_WEDGE_LIVE_CONTRACT=PASS'
          echo 'QUOTE_BUYER_RETURN_DESTINATION=PASS'
      - name: Emit revenue sentinel proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('commerce/marketing/ACTIVE-PAYMENT-LINKS.json').read_text(encoding='utf-8'))
          proof = {
              'status': 'PASS',
              'workflow': 'revenue-sentinel',
              'sha': '${{ github.sha }}',
              'run_id': '${{ github.run_id }}',
              'verified_revenue_nzd': source.get('verified_revenue_nzd', 0),
              'payment_links_checked': sum(1 for x in source.get('links', []) if x.get('url')),
              'truth_rule': source.get('truth_rule'),
              'quote_revenue_wedge_live_contract': 'PASS',
              'verified_external_buyer': False,
              'verified_paid_fulfilled_quote_order': False
          }
          Path('proof/revenue-sentinel-proof.json').write_text(json.dumps(proof, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(proof, indent=2))
          PY

      - name: Upload revenue proof
        uses: actions/upload-artifact@v4
        with:
          name: revenue-sentinel-proof
          path: proof/revenue-sentinel-proof.json
