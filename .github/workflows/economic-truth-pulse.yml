name: Economic Truth Pulse

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

concurrency:
  group: economic-truth-pulse
  cancel-in-progress: true

env:
  PRODUCT_ID: "3000"
  SUPABASE_URL: "https://wbwgroygjeyukkspnqiy.supabase.co"
  SUPABASE_KEY: "sb_publishable_O5JRD67KaU3SA9dFq-JIuQ_Pzs8pedj"

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4

      - name: Read live state and independently verify Stripe payments
        shell: bash
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail
          mkdir -p PROOFS/TRUTH
          STEM="$(date -u +%Y-%m-%dT%H%M%SZ)-economic-truth"
          FILE="PROOFS/TRUTH/${STEM}.json"
          URL="$SUPABASE_URL/rest/v1/billboard_placements?select=id,status,x,y,width,height,pixels,title,price_nzd,stripe_checkout_session,stripe_payment_intent&order=id.asc"
          HTTP="$(curl -sS -o /tmp/placements.json -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" "$URL")"
          test "$HTTP" = "200"

          FILE="$FILE" python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone

          with open("/tmp/placements.json", "r", encoding="utf-8") as f:
              rows = json.load(f)

          published = [r for r in rows if r.get("status") == "PUBLISHED"]
          paid = [r for r in rows if str(r.get("status", "")).startswith("PAID")]
          payment_linked = [
              r for r in rows
              if r.get("stripe_payment_intent")
              and r.get("stripe_checkout_session")
              and r.get("status") != "REFUNDED"
          ]
          pixels = sum(int(r.get("pixels") or 0) for r in published)

          bad = []
          for i, a in enumerate(published):
              ax, ay, aw, ah = [int(a.get(k) or 0) for k in ("x", "y", "width", "height")]
              for b in published[i + 1:]:
                  bx, by, bw, bh = [int(b.get(k) or 0) for k in ("x", "y", "width", "height")]
                  if ax < bx + bw and ax + aw > bx and ay < by + bh and ay + ah > by:
                      bad.append([a.get("id"), b.get("id")])

          stripe_key = os.environ.get("STRIPE_SECRET_KEY", "").strip()
          stripe_check = "NOT_CONFIGURED"
          stripe_error = None
          verified_payments = []
          seen = set()

          if stripe_key:
              stripe_check = "PASS"
              for row in payment_linked:
                  pi = str(row.get("stripe_payment_intent") or "").strip()
                  if not pi or pi in seen:
                      continue
                  seen.add(pi)
                  try:
                      raw = subprocess.check_output([
                          "curl", "-sS", "--max-time", "30",
                          "-u", stripe_key + ":",
                          "https://api.stripe.com/v1/payment_intents/" + pi
                      ], text=True)
                      obj = json.loads(raw)
                      status = obj.get("status")
                      currency = str(obj.get("currency") or "").lower()
                      amount = int(obj.get("amount") or 0)
                      if status == "succeeded" and currency == "nzd" and amount == 5000:
                          verified_payments.append({
                              "payment_intent_id": pi,
                              "status": status,
                              "currency": currency,
                              "amount_nzd": amount / 100.0,
                              "allocation_id": row.get("id")
                          })
                      else:
                          stripe_check = "FAIL"
                          stripe_error = "Linked PaymentIntent did not satisfy succeeded/nzd/5000 requirements: " + pi
                  except Exception as exc:
                      stripe_check = "FAIL"
                      stripe_error = "Stripe lookup failed for " + pi + ": " + str(exc)

          revenue = sum(p["amount_nzd"] for p in verified_payments)
          customers = len(verified_payments)
          gate_passed = customers >= 1 and not bad and stripe_check == "PASS"

          out = {
            "schema_version": 2,
            "generated_at": datetime.now(timezone.utc).isoformat(),
            "product_id": "3000",
            "facts": {
              "supabase_http": 200,
              "total_rows": len(rows),
              "published_count": len(published),
              "paid_or_pending_review_count": len(paid),
              "allocation_linked_payment_count": len(payment_linked),
              "published_pixels": pixels,
              "published_pixel_capacity": 1000000,
              "published_pixels_remaining": 1000000 - pixels,
              "overlap_pairs": bad
            },
            "stripe_independent_observation": {
              "check": stripe_check,
              "verified_payment_count": customers,
              "verified_payments": verified_payments,
              "error": stripe_error
            },
            "economic_truth": {
              "external_customers_proven": customers,
              "revenue_nzd_proven": revenue,
              "allocation_linked_payment_evidence_count": len(payment_linked),
              "stripe_settlement_independent_check": stripe_check,
              "first_sale_gate": "ONE_REAL_EXTERNAL_PAYMENT"
            },
            "decision": {
              "status": "ECONOMIC_GATE_PASSED" if gate_passed else "BLOCKED_ON_FIRST_SALE",
              "reason": "At least one externally observed Stripe PaymentIntent succeeded for 3000." if gate_passed else "No real external NZ$50 payment has been independently proven by this pulse."
            }
          }
          with open(os.environ["FILE"], "w", encoding="utf-8") as f:
              json.dump(out, f, indent=2, sort_keys=True)
              f.write("\n")
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

          FILE="$FILE" python3 - <<'PY'
          import hashlib, os
          p = os.environ["FILE"]
          h = hashlib.sha256(open(p, "rb").read()).hexdigest()
          with open(p.replace(".json", ".sha256"), "w", encoding="utf-8") as f:
              f.write(h + "  " + os.path.basename(p) + "\n")
          print("SHA256", h)
          PY

      - name: Validate truth artifact
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(ls -1t PROOFS/TRUTH/*-economic-truth.json | head -n1)"
          HASHFILE="${FILE%.json}.sha256"
          test -f "$HASHFILE"
          sha256sum -c "$HASHFILE"
          python3 - <<'PY'
          import json, glob
          files = sorted(glob.glob("PROOFS/TRUTH/*-economic-truth.json"))
          assert files, "No truth artifact"
          d = json.load(open(files[-1], encoding="utf-8"))
          assert d["schema_version"] == 2
          assert d["product_id"] == "3000"
          assert d["facts"]["supabase_http"] == 200
          assert d["facts"]["overlap_pairs"] == []
          assert d["economic_truth"]["external_customers_proven"] >= 0
          assert d["economic_truth"]["revenue_nzd_proven"] >= 0
          assert d["economic_truth"]["stripe_settlement_independent_check"] in ["PASS", "FAIL", "NOT_CONFIGURED"]
          if d["economic_truth"]["stripe_settlement_independent_check"] == "PASS":
              assert d["economic_truth"]["revenue_nzd_proven"] == sum(p["amount_nzd"] for p in d["stripe_independent_observation"]["verified_payments"])
          print("PASS economic truth verifier")
          print("Revenue proven: NZ$" + str(d["economic_truth"]["revenue_nzd_proven"]))
          print("Customers proven: " + str(d["economic_truth"]["external_customers_proven"]))
          print("Stripe independent check: " + d["economic_truth"]["stripe_settlement_independent_check"])
          PY

      - name: Commit proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DreamLedger Economic Court"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROOFS/TRUTH/
          if git diff --cached --quiet; then
            echo "NO_CHANGE"
            exit 0
          fi
          git commit -m "chore: record economic truth pulse"
          git push
