name: DreamLedger Provider Exit Live Observation

on:
  workflow_dispatch:
  push:
    branches:
      - 'beck/provider-migration-neon-cloudflare-20261019'
    paths:
      - '.github/workflows/provider-exit-observer.yml'
      - 'ops/migration/provider-exit-live-preflight.mjs'

permissions:
  contents: read

jobs:
  inspect-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: wbwgroygjeyukkspnqiy
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
      PROVIDER_EXIT_PROOF_PATH: proof/migration/provider-exit-live-preflight.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JS syntax and offline test
        run: |
          node --check ops/migration/provider-exit-live-preflight.mjs
          node ops/migration/provider-exit-live-preflight.mjs --self-test
      - name: Read-only provider inspection
        run: node ops/migration/provider-exit-live-preflight.mjs
      - name: Retain proof even if blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-exit-observation-${{ github.run_id }}
          path: proof/migration/provider-exit-live-preflight.json
          if-no-files-found: warn
          retention-days: 30
