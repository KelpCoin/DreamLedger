name: Silo Growth Contract

on:
  pull_request:
    paths:
      - 'config/silo-growth-defaults.json'
      - 'BEC-PRIME/scripts/verify-silo-growth-contract.js'
      - 'BEC-PRIME/scripts/agentic-engineering-stack.test.js'
      - 'BEC-PRIME/scripts/verify-agentic-engineering-stack.js'
      - 'BEC-PRIME/scripts/evaluate-customization-eligibility.test.js'
      - 'BEC-PRIME/scripts/evaluate-customization-eligibility.js'
      - 'config/agentic-engineering-stack.json'
      - 'config/offer-customization-defaults.json'
      - 'BEC-PRIME/scripts/render-silo-growth-promo.js'
      - 'BEC-PRIME/scripts/render-silo-growth-promo.test.js'
      - 'docs/SILO_MARKETING_AND_DISTRIBUTION_TEMPLATE.md'
      - '.github/workflows/silo-growth-contract.yml'
  push:
    branches: [main]
    paths:
      - 'config/silo-growth-defaults.json'
      - 'BEC-PRIME/scripts/verify-silo-growth-contract.js'
      - 'BEC-PRIME/scripts/render-silo-growth-promo.js'
      - 'BEC-PRIME/scripts/render-silo-growth-promo.test.js'
      - 'docs/SILO_MARKETING_AND_DISTRIBUTION_TEMPLATE.md'
      - '.github/workflows/silo-growth-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify reusable silo growth contract
        run: node BEC-PRIME/scripts/verify-silo-growth-contract.js
      - name: Test fail-closed creator support renderer
        run: node --test BEC-PRIME/scripts/render-silo-growth-promo.test.js
      - name: Verify customization eligibility gates
        run: node --test BEC-PRIME/scripts/evaluate-customization-eligibility.test.js
      - name: Verify five-layer engineering stack
        run: node BEC-PRIME/scripts/verify-agentic-engineering-stack.js && node --test BEC-PRIME/scripts/agentic-engineering-stack.test.js
