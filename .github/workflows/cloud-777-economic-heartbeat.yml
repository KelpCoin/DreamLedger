name: Cloud 777 Economic Heartbeat

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "ops/cube/multisilo_777_portfolio.py"
      - "ops/cube/test_multisilo_777_portfolio.py"
      - "BEC-PRIME/runtime/RevenueBanditEvidence.js"
      - "BEC-PRIME/runtime/RevenueBanditEvidence.test.js"
      - ".github/workflows/cloud-777-economic-heartbeat.yml"

permissions:
  contents: read

concurrency:
  group: cloud-777-economic-heartbeat
  cancel-in-progress: true

jobs:
  economic-heartbeat:
    if: github.event_name != 'pull_request'
    name: Build and fossilize the next 777 artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BEC-PRIME
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BEC-PRIME/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Run 777 economic search
        run: npm run 777:run

      - name: Audit all source product contracts and compile 777 bounded hypotheses
        run: |
          python3 -m unittest discover -s ../ops/cube -p 'test_multisilo_777_portfolio.py' -v
          python3 ../ops/cube/multisilo_777_portfolio.py --root .. --output data/777/777-MULTISILO-PORTFOLIO.json

      - name: Verify artifact truth boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'data/777/777-LATEST.json';
          const x = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (x.truth?.verified_external_revenue_nzd !== 0) throw new Error('Heartbeat cannot manufacture revenue');
          if (x.truth?.settled_external_payments !== 0) throw new Error('Heartbeat cannot manufacture payments');
          if (x.truth?.independent_external_buyers !== 0) throw new Error('Heartbeat cannot manufacture buyers');
          if (x.truth?.verified_economic_outcomes !== 0) throw new Error('Heartbeat cannot manufacture outcomes');
          if (x.buyer_signal_gate?.external_action_performed !== false) throw new Error('Heartbeat attempted external action');
          console.log(JSON.stringify({
            status: 'PASS',
            generated_at_utc: x.generated_at_utc,
            candidate_count: x.candidate_count,
            activation_candidate_count: x.activation_candidate_count,
            buyer_signal_count: x.buyer_signal_count,
            truth: x.truth
          }, null, 2));
          NODE

      - name: Emit heartbeat proof
        if: always()
        working-directory: .
        run: |
          mkdir -p proof
          printf '%s\n' '{"schema":"DREAMLEDGER/CLOUD-777-HEARTBEAT/v1","external_action":"NONE","revenue_claimed_nzd":0,"payment_claimed":0,"buyer_claimed":0}' > proof/cloud-777-heartbeat.json
          cat proof/cloud-777-heartbeat.json

      - name: Upload cloud heartbeat artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-777-heartbeat-${{ github.run_id }}
          path: |
            BEC-PRIME/data/777/777-LATEST.json
            BEC-PRIME/data/777/777-MULTISILO-PORTFOLIO.json
            proof/cloud-777-heartbeat.json
          if-no-files-found: warn
          retention-days: 14

  portfolio-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests for portfolio separation and proof gates
        run: python3 -m unittest discover -s ops/cube -p 'test_multisilo_777_portfolio.py' -v
      - name: Bandit reward, tenant isolation and proof red-team tests
        run: node --test BEC-PRIME/runtime/RevenueBanditEvidence.test.js
      - name: Generate read-only 777 audit proof
        run: |
          python3 ops/cube/multisilo_777_portfolio.py --output /tmp/777-MULTISILO-PORTFOLIO.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/777-MULTISILO-PORTFOLIO.json').read_text())
          assert r['expedition_count']==777
          assert r['global_commercial_actions']['external_action']=='BLOCKED'
          assert not r['gold_mode']['enabled']
          assert not r['price_policy']['mutable_stripe_prices']
          print('MULTISILO_777_GAUNTLET=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: multisilo-777-private-proof
          path: /tmp/777-MULTISILO-PORTFOLIO.json
          retention-days: 7
