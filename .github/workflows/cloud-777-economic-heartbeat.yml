name: Cloud 777 Economic Heartbeat

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-777-economic-heartbeat
  cancel-in-progress: true

jobs:
  economic-heartbeat:
    name: Build and fossilize the next 777 artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BEC-PRIME
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BEC-PRIME/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Run 777 economic search
        run: npm run 777:run

      - name: Verify artifact truth boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'data/777/777-LATEST.json';
          const x = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (x.truth?.verified_external_revenue_nzd !== 0) throw new Error('Heartbeat cannot manufacture revenue');
          if (x.truth?.settled_external_payments !== 0) throw new Error('Heartbeat cannot manufacture payments');
          if (x.truth?.independent_external_buyers !== 0) throw new Error('Heartbeat cannot manufacture buyers');
          if (x.truth?.verified_economic_outcomes !== 0) throw new Error('Heartbeat cannot manufacture outcomes');
          if (x.buyer_signal_gate?.external_action_performed !== false) throw new Error('Heartbeat attempted external action');
          console.log(JSON.stringify({
            status: 'PASS',
            generated_at_utc: x.generated_at_utc,
            candidate_count: x.candidate_count,
            activation_candidate_count: x.activation_candidate_count,
            buyer_signal_count: x.buyer_signal_count,
            truth: x.truth
          }, null, 2));
          NODE

      - name: Persist compounding artifact
        working-directory: .
        run: |
          git config user.name "DreamLedger Cloud"
          git config user.email "dreamledger-cloud@users.noreply.github.com"
          git add BEC-PRIME/data/777/777-LATEST.json
          if git diff --cached --quiet; then
            echo "NO_ARTIFACT_CHANGE=true"
            exit 0
          fi
          git commit -m "chore: fossilize cloud 777 economic artifact"
          git push origin HEAD:main

      - name: Emit heartbeat proof
        if: always()
        working-directory: .
        run: |
          mkdir -p proof
          printf '%s\n' '{"schema":"DREAMLEDGER/CLOUD-777-HEARTBEAT/v1","external_action":"NONE","revenue_claimed_nzd":0,"payment_claimed":0,"buyer_claimed":0}' > proof/cloud-777-heartbeat.json
          cat proof/cloud-777-heartbeat.json
