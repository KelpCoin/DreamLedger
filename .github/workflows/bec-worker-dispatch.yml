name: BEC Worker Dispatch

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task for the worker
        required: true
        type: string
      kind:
        description: Worker job kind
        required: true
        type: choice
        options:
          - analysis
          - code_change
          - gauntlet
          - compile
          - test
          - lm_refinement
      silo:
        description: Silo boundary
        required: true
        default: mtg
        type: string
      worker_preference:
        description: Model worker adapter
        required: true
        default: auto
        type: choice
        options:
          - auto
          - local-lmstudio
          - gpu
          - cloud
      runner:
        description: Execution node
        required: true
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - ubuntu-latest

permissions:
  contents: read

jobs:
  execute:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: BEC-PRIME
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build job envelope
        shell: bash
        env:
          TASK: ${{ inputs.task }}
          KIND: ${{ inputs.kind }}
          SILO: ${{ inputs.silo }}
          WORKER: ${{ inputs.worker_preference }}
        run: |
          mkdir -p data/jobs/dispatch
          node -e 'const fs=require("fs"); fs.writeFileSync("data/jobs/dispatch/job.json", JSON.stringify({kind:process.env.KIND,silo:process.env.SILO,task:process.env.TASK,worker_preference:process.env.WORKER,effects:[]},null,2)+"\n")'

      - name: Execute worker
        env:
          BEC_GPU_LM_URL: ${{ secrets.BEC_GPU_LM_URL }}
          BEC_GPU_LM_MODEL: ${{ secrets.BEC_GPU_LM_MODEL }}
          BEC_GPU_LM_API_KEY: ${{ secrets.BEC_GPU_LM_API_KEY }}
          BEC_CLOUD_LM_URL: ${{ secrets.BEC_CLOUD_LM_URL }}
          BEC_CLOUD_LM_MODEL: ${{ secrets.BEC_CLOUD_LM_MODEL }}
          BEC_CLOUD_LM_API_KEY: ${{ secrets.BEC_CLOUD_LM_API_KEY }}
        run: node runtime/worker-pool.js enqueue data/jobs/dispatch/job.json && node runtime/worker-pool.js route data/jobs/dispatch/job.json && node runtime/worker-pool.js run-once

      - name: Verify worker proof
        run: npm run worker:verify

      - name: Verify runtime ledger and Fossil chain
        run: npm run runtime:verify

      - name: Verify compile surface
        if: inputs.kind == 'compile' || inputs.kind == 'code_change'
        run: npm run compile

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const jobs=fs.readdirSync('data/jobs/jobs').filter(x=>x.endsWith('.json')).map(x=>JSON.parse(fs.readFileSync('data/jobs/jobs/'+x,'utf8')));
          const job=jobs.sort((a,b)=>a.created_at.localeCompare(b.created_at)).at(-1);
          const lines=[
            `## BEC Worker Dispatch`,
            `- Job: ${job?.job_id || 'unknown'}`,
            `- Status: ${job?.status || 'unknown'}`,
            `- Worker: ${job?.route?.adapter || 'unknown'}`,
            `- Execution node: ${job?.route?.execution_node || 'unknown'}`,
            `- Fossil: ${job?.fossil_hash || 'none'}`,
            `- Payment claim: false`,
            `- Public action: false`
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n')+'\n');
          NODE

      - name: Upload job result, proof, ledger and Fossil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bec-worker-${{ github.run_id }}
          path: |
            BEC-PRIME/data/jobs/results/*.json
            BEC-PRIME/data/proofs/*.json
            BEC-PRIME/data/proofs/fossils/*.jsonl
            BEC-PRIME/data/ledger/EVENTS.jsonl
          if-no-files-found: warn
