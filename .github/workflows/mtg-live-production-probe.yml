name: MTG Live Production Probe

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Render and probe live DreamLedger MTG surface
        shell: bash
        env:
          BASE: https://dreamledger.org
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p proof
          echo "Expected commit: $EXPECTED_COMMIT"

          converged=0
          for attempt in $(seq 1 18); do
            if curl -L -sS --fail --max-time 20 "$BASE/version" -o proof/LIVE-VERSION.json; then
              LIVE_COMMIT=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('proof/LIVE-VERSION.json','utf8')); process.stdout.write(String(x.commit||''))")
              echo "Attempt $attempt/18 - live commit: $LIVE_COMMIT"
              if [ "$LIVE_COMMIT" = "$EXPECTED_COMMIT" ]; then
                converged=1
                break
              fi
            else
              echo "Attempt $attempt/18 - /version unavailable"
            fi
            sleep 20
          done

          test "$converged" = "1"
          cat proof/LIVE-VERSION.json

          for path in /mtg /mtg/ /MTG /MTG/ /version /api/products /api/products/COMMANDER-DECK-DIAGNOSTIC-001 /sitemap.xml /robots.txt; do
            code=$(curl -L -sS -o /tmp/response -w "%{http_code}" --max-time 20 "$BASE$path")
            echo "$code $path"
            test "$code" = "200"
          done

          curl -L -sS --fail --max-time 20 "$BASE/api/products" -o proof/PRODUCTS.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('proof/PRODUCTS.json','utf8'));
          const products = Array.isArray(x.products) ? x.products : [];
          const p = products.find(v => v.id === 'COMMANDER-DECK-DIAGNOSTIC-001');
          if (!p) throw new Error('COMMANDER-DECK-DIAGNOSTIC-001 missing from /api/products');
          if (Number(p.price) !== 29) throw new Error('MTG diagnostic price is not 29');
          if (String(p.currency).toUpperCase() !== 'NZD') throw new Error('MTG diagnostic currency is not NZD');
          if (!p.checkout_url) throw new Error('MTG diagnostic checkout URL missing');
          console.log('PRODUCT CONTRACT: PASS');
          NODE

          curl -L -sS --fail --max-time 20 "$BASE/mtg" -o proof/MTG.html
          grep -q "data-dreamledger-mtg-commerce-v2" proof/MTG.html
          grep -q "BUY NOW" proof/MTG.html

          cat > proof/MTG-LIVE-GATE.json <<EOF
          {
            "status": "PASS",
            "expected_commit": "$EXPECTED_COMMIT",
            "live_commit": "$LIVE_COMMIT",
            "mtg_routes": "PASS",
            "diagnostic_product": "PASS",
            "commerce_markers": "PASS",
            "sitemap": "PASS",
            "robots": "PASS"
          }
          EOF
      - name: Upload production proof
        uses: actions/upload-artifact@v4
        with:
          name: mtg-live-production-probe-${{ github.sha }}
          path: proof/
          if-no-files-found: error
