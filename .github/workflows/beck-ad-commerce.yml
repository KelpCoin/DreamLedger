name: BECK Ad Commerce Candidate Tests

on:
  pull_request:
    paths:
      - "BEC-PRIME/runtime/AdInventoryGate*"
      - "BEC-PRIME/runtime/BeckAdReservationClient*"
      - "BEC-PRIME/runtime/BeckAdInventoryRead*"
      - "BEC-PRIME/runtime/BeckAdCheckout*"
      - "BEC-PRIME/runtime/BeckAdPaymentWebhook*"
      - "supabase/migrations/202611010002_beck_ad_checkout_binding.sql"
      - "supabase/migrations/202611010003_beck_ad_checkout_lifecycle.sql"
      - "scripts/beck-ad-postgres-contract.sh"
      - "public/server.js"
      - "api/molt-beach-inventory.ts"
      - "api/molt-beach-checkout.ts"
      - "api/webhooks/beck-ad-stripe.ts"
      - "scripts/beck-vercel-native-contract.test.cjs"
      - "vercel.json"
      - "AGENTS.md"
      - "docs/BECK-AD-COMMERCE-CANDIDATE.md"
      - "proof/beck-ads/2026-11-01-provider-policy.json"
      - "public/billboard.html"
      - "public/assets/beck-billboard-inventory*"
      - "supabase/migrations/202611010001_beck_ad_reservations.sql"
      - ".github/workflows/beck-ad-commerce.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source syntax
        run: |
          node --check BEC-PRIME/runtime/AdInventoryGate.js
          node --check BEC-PRIME/runtime/BeckAdReservationClient.js
          node --check BEC-PRIME/runtime/BeckAdInventoryRead.js
          node --check BEC-PRIME/runtime/BeckAdCheckout.js
          node --check BEC-PRIME/runtime/BeckAdCheckoutBinding.js
          node --check BEC-PRIME/runtime/BeckAdPaymentWebhook.js
          node --check BEC-PRIME/runtime/BeckAdCheckoutRelease.js
          node --check public/server.js
          node --check scripts/beck-vercel-native-contract.test.cjs
          node --check public/assets/beck-billboard-inventory.js
      - name: Run reservation and payment evidence tests (no secrets)
        run: node --test BEC-PRIME/runtime/AdInventoryGate.test.js BEC-PRIME/runtime/BeckAdReservationClient.test.js BEC-PRIME/runtime/BeckAdSqlContract.test.js BEC-PRIME/runtime/BeckAdInventoryRead.test.js public/assets/beck-billboard-inventory.test.js BEC-PRIME/runtime/BeckAdCheckout.test.js BEC-PRIME/runtime/BeckAdCheckoutBinding.test.js BEC-PRIME/runtime/BeckAdPaymentWebhook.test.js BEC-PRIME/runtime/BeckProviderPolicy.test.js BEC-PRIME/runtime/BeckAdCheckoutRelease.test.js scripts/beck-vercel-native-contract.test.cjs
      - name: Emit source evidence checksums
        run: sha256sum BEC-PRIME/runtime/AdInventoryGate.js BEC-PRIME/runtime/BeckAdReservationClient.js BEC-PRIME/runtime/BeckAdInventoryRead.js BEC-PRIME/runtime/BeckAdCheckout.js BEC-PRIME/runtime/BeckAdCheckout.test.js proof/beck-ads/2026-11-01-checkout-response-attestation.json BEC-PRIME/runtime/BeckAdCheckoutBinding.js BEC-PRIME/runtime/BeckAdPaymentWebhook.js BEC-PRIME/runtime/BeckAdCheckoutRelease.js supabase/migrations/202611010001_beck_ad_reservations.sql supabase/migrations/202611010002_beck_ad_checkout_binding.sql supabase/migrations/202611010003_beck_ad_checkout_lifecycle.sql

  ephemeral-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beck_ad_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beck_ad_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: beck_ad_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Verify throwaway database target and psql availability
        run: |
          command -v psql
          test "$PGDATABASE" = "beck_ad_ci"
          test "$PGHOST" = "127.0.0.1"
      - name: Apply staged migrations and prove concurrent exclusion
        run: bash scripts/beck-ad-postgres-contract.sh
      - name: Source evidence checksums
        if: always()
        run: sha256sum scripts/beck-ad-postgres-contract.sh supabase/migrations/202611010001_beck_ad_reservations.sql supabase/migrations/202611010002_beck_ad_checkout_binding.sql supabase/migrations/202611010003_beck_ad_checkout_lifecycle.sql proof/beck-ads/2026-11-01-payment-intent-uniqueness.json
