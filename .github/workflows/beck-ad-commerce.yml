name: BECK Ad Commerce Candidate Tests

on:
  pull_request:
    paths:
      - "BEC-PRIME/runtime/AdInventoryGate*"
      - "BEC-PRIME/runtime/BeckAdReservationClient*"
      - "BEC-PRIME/runtime/BeckAdInventoryRead*"
      - "BEC-PRIME/runtime/BeckAdCheckout*"
      - "BEC-PRIME/runtime/BeckAdPaymentWebhook*"
      - "supabase/migrations/202611010002_beck_ad_checkout_binding.sql"
      - "public/server.js"
      - "public/billboard.html"
      - "public/assets/beck-billboard-inventory*"
      - "supabase/migrations/202611010001_beck_ad_reservations.sql"
      - ".github/workflows/beck-ad-commerce.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source syntax
        run: |
          node --check BEC-PRIME/runtime/AdInventoryGate.js
          node --check BEC-PRIME/runtime/BeckAdReservationClient.js
          node --check BEC-PRIME/runtime/BeckAdInventoryRead.js
          node --check BEC-PRIME/runtime/BeckAdCheckout.js
          node --check BEC-PRIME/runtime/BeckAdCheckoutBinding.js
          node --check BEC-PRIME/runtime/BeckAdPaymentWebhook.js
          node --check public/server.js
          node --check public/assets/beck-billboard-inventory.js
      - name: Run reservation and payment evidence tests (no secrets)
        run: node --test BEC-PRIME/runtime/AdInventoryGate.test.js BEC-PRIME/runtime/BeckAdReservationClient.test.js BEC-PRIME/runtime/BeckAdSqlContract.test.js BEC-PRIME/runtime/BeckAdInventoryRead.test.js public/assets/beck-billboard-inventory.test.js BEC-PRIME/runtime/BeckAdCheckout.test.js BEC-PRIME/runtime/BeckAdCheckoutBinding.test.js BEC-PRIME/runtime/BeckAdPaymentWebhook.test.js
      - name: Emit source evidence checksums
        run: sha256sum BEC-PRIME/runtime/AdInventoryGate.js BEC-PRIME/runtime/BeckAdReservationClient.js BEC-PRIME/runtime/BeckAdInventoryRead.js BEC-PRIME/runtime/BeckAdCheckout.js BEC-PRIME/runtime/BeckAdCheckoutBinding.js BEC-PRIME/runtime/BeckAdPaymentWebhook.js supabase/migrations/202611010001_beck_ad_reservations.sql supabase/migrations/202611010002_beck_ad_checkout_binding.sql
