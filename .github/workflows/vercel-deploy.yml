name: Verify DreamLedger for Vercel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

concurrency:
  group: dreamledger-vercel-verification
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout DreamLedger
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Compile and verify
        run: npm run compile

      - name: Deployment handoff
        run: |
          echo "SOURCE_VERIFIED=PASS"
          echo "Vercel deployment is intentionally handled by the Vercel project integration."
          echo "No GitHub Actions Vercel token is required by this workflow."
