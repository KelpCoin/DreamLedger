name: Render Exit Container Check

on:
  pull_request:
    paths:
      - "Dockerfile.render-exit"
      - ".dockerignore"
      - "fly.render-exit.toml"
      - "BEC-PRIME/start.js"
      - "BEC-PRIME/elohim/**"
      - "BEC-PRIME/scripts/Patch-MTG-CommerceSurface.js"
      - "BEC-PRIME/schemas/elohim-*.schema.json"
      - "ops/migration/render-exit/**"
      - ".github/workflows/render-exit-container-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-exit-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container-contract:
    name: Render Exit Container Contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify contract
        run: |
          sh -n ops/migration/render-exit/start.sh
          node --test ops/migration/render-exit/contract.test.mjs

      - name: Build production image without secrets
        run: |
          docker build \
            --file Dockerfile.render-exit \
            --build-arg GIT_COMMIT="${GITHUB_SHA}" \
            --tag dreamledger-render-exit:ci \
            .

      - name: Emit proof
        if: always()
        run: |
          mkdir -p proof
          node - <<'NODE'
          const fs = require('fs');
          const proof = {
            schema: 'dreamledger/render-exit-ci-proof/v1',
            commit_sha: process.env.GITHUB_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            timestamp_utc: new Date().toISOString(),
            status: '${{ job.status }}',
            production_deployed: false,
            dns_changed: false,
            stripe_changed: false,
            verified_revenue_nzd: 0
          };
          fs.writeFileSync('proof/render-exit-container-check.json', JSON.stringify(proof, null, 2) + '\n');
          console.log(JSON.stringify(proof, null, 2));
          NODE

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-exit-container-check-${{ github.run_id }}
          path: proof/render-exit-container-check.json
          if-no-files-found: error
          retention-days: 30
