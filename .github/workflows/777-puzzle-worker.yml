name: 777 Public Puzzle Worker\n\non:\n  schedule:\n    - cron: "17 * * * *"\n  workflow_dispatch:\n\npermissions:\n  contents: write\n\nconcurrency:\n  group: dreamledger-777-puzzle-worker\n  cancel-in-progress: false\n\njobs:\n  puzzle-worker:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - name: Checkout DreamLedger\n        uses: actions/checkout@v4\n\n      - name: Fetch public puzzle index\n        run: curl --fail --silent --show-error --location https://raw.githubusercontent.com/floflo777/open-crypto-puzzles/main/puzzles.json -o BEC-PRIME/data/777/puzzles.json\n\n      - name: Build bounded funded-open queue\n        run: node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('BEC-PRIME/data/777/puzzles.json','utf8')); const q=(x.puzzles||[]).filter(p=>p.status==='open' && (p.addresses||[]).some(a=>a.verified_state==='funded-unspent')).sort((a,b)=>(b.prize?.usd_estimate||0)-(a.prize?.usd_estimate||0)).map(p=>({slug:p.slug,title:p.title,prize:p.prize,difficulty_left:p.difficulty_left,leads:(p.leads||[]).slice(0,4),tested_total:p.tested_total,last_updated:p.last_updated,folder:p.folder})); fs.mkdirSync('BEC-PRIME/data/777',{recursive:true}); fs.writeFileSync('BEC-PRIME/data/777/OPEN-FUNDED-PUZZLE-QUEUE.json',JSON.stringify({status:'RESEARCH_ONLY',generated_at_utc:new Date().toISOString(),count:q.length,queue:q},null,2)+'\\n'); console.log('open_funded_count='+q.length);"\n\n      - name: Publish worker evidence\n        uses: actions/upload-artifact@v4\n        with:\n          name: dreamledger-777-puzzle-worker-${{ github.run_id }}\n          path: |\n            BEC-PRIME/data/777/puzzles.json\n            BEC-PRIME/data/777/OPEN-FUNDED-PUZZLE-QUEUE.json\n          retention-days: 7