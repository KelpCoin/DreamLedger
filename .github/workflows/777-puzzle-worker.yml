name: 777 Public Puzzle Worker

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dreamledger-777-puzzle-worker
  cancel-in-progress: false

jobs:
  puzzle-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout DreamLedger
        uses: actions/checkout@v4

      - name: Fetch public puzzle index
        run: |
          mkdir -p BEC-PRIME/data/777
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/floflo777/open-crypto-puzzles/main/puzzles.json -o BEC-PRIME/data/777/puzzles.json

      - name: Build bounded funded-open queue
        run: |
          node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('BEC-PRIME/data/777/puzzles.json', 'utf8'));
          const q = (x.puzzles || [])
            .filter(p => p.status === 'open' && (p.addresses || []).some(a => a.verified_state === 'funded-unspent'))
            .sort((a,b) => (b.prize?.usd_estimate || 0) - (a.prize?.usd_estimate || 0))
            .map(p => ({
              slug: p.slug,
              title: p.title,
              prize: p.prize,
              difficulty_left: p.difficulty_left,
              leads: (p.leads || []).slice(0, 4),
              tested_total: p.tested_total,
              last_updated: p.last_updated,
              folder: p.folder
            }));
          fs.mkdirSync('BEC-PRIME/data/777', {recursive: true});
          fs.writeFileSync(
            'BEC-PRIME/data/777/OPEN-FUNDED-PUZZLE-QUEUE.json',
            JSON.stringify({
              status: 'RESEARCH_ONLY',
              generated_at_utc: new Date().toISOString(),
              count: q.length,
              queue: q
            }, null, 2) + '\n'
          );
          console.log('open_funded_count=' + q.length);
          NODE

      - name: Publish worker evidence
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-777-puzzle-worker-${{ github.run_id }}
          path: |
            BEC-PRIME/data/777/puzzles.json
            BEC-PRIME/data/777/OPEN-FUNDED-PUZZLE-QUEUE.json
          retention-days: 7
