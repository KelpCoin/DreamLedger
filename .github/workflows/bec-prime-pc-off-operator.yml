name: BEC Prime PC-Off Operator

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: bec-prime-economic-heartbeat
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BEC-PRIME
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assert canonical runtime
        run: |
          set -euo pipefail
          test -f runtime/777/RUNTIME-CANON.json
          python3 - <<'PY'
          import json
          p="runtime/777/RUNTIME-CANON.json"
          d=json.load(open(p,encoding="utf-8"))
          assert d["status"]=="CANONICAL"
          assert d["chat_is_not_runtime"] is True
          assert d["economic_priority"]=="RA_000001"
          assert d["local_heartbeat"]["worker"]=="runtime/lm_studio/LM-Studio-Swarm.ps1"
          assert d["cloud_heartbeat"]["workflow"]==".github/workflows/bec-prime-pc-off-operator.yml"
          print("RUNTIME_CANON=PASS")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BEC-PRIME/package-lock.json

      - name: Install
        run: npm install

      - name: Compile IP
        run: npm run compile

      - name: Verify Truth Oracle commerce
        run: npm run verify:truth-oracle-commerce

      - name: Verify Truth Oracle runtime tests
        run: npm run test:truth-oracle

      - name: Run Gauntlet
        run: npm run gauntlet

      - name: Run 777 economic search heartbeat
        run: npm run 777:run

      - name: Materialize 777 telemetry proof
        if: always()
        run: |
          set -euo pipefail
          test -f data/777/777-LATEST.json
          python3 - <<'PY'
          import json, os, subprocess
          p="data/777/777-LATEST.json"
          with open(p,encoding="utf-8") as f: latest=json.load(f)
          truth=latest.get("truth",{}) if isinstance(latest,dict) else {}
          telemetry={
            "schema":"DREAMLEDGER/777-HEARTBEAT-TELEMETRY/v1",
            "git_sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "workflow_run_id":os.environ.get("GITHUB_RUN_ID"),
            "generated_at_utc":latest.get("generated_at_utc"),
            "candidate_count":len(latest.get("candidates",[]) or []),
            "buyer_signal_count":len(latest.get("buyer_signal_queue",[]) or []),
            "truth":truth,
            "economic_truth":{
              "verified_external_revenue_nzd":0,
              "settled_external_payments":0,
              "independent_external_buyers":0,
              "verified_outcomes":0
            },
            "rule":"heartbeat telemetry is operational evidence, never revenue evidence"
          }
          os.makedirs("operator-proof",exist_ok=True)
          with open("operator-proof/777-HEARTBEAT-TELEMETRY.json","w",encoding="utf-8") as f:
            json.dump(telemetry,f,indent=2)
          PY
          cp data/777/777-LATEST.json operator-proof/777-LATEST.json

      - name: Run revenue autonomy cycle
        run: npm run autonomy:cycle

      - name: Run revenue ledger smoke test
        run: npm run smoke:revenue-ledger

      - name: Save operator proof
        if: always()
        run: |
          mkdir -p operator-proof
          printf '{\n  "workflow": "BEC Prime PC-Off Operator",\n  "pc_required": false,\n  "utc": "%s",\n  "compile": "executed",\n  "truth_oracle_commerce": "executed",\n  "truth_oracle_tests": "executed",\n  "gauntlet": "executed",\n  "revenue_autonomy": "executed",\n  "revenue_ledger_smoke": "executed"\n}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > operator-proof/AUTONOMOUS_OPERATOR_PROOF.json

      - name: Upload complete operator proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bec-prime-operator-proof
          path: BEC-PRIME/operator-proof/
          if-no-files-found: error
