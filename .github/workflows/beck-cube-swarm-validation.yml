name: BECK CUBE Swarm Bootstrap Validation

on:
  push:
    branches: [feat/cube-swarm-economic-traversal]
    paths:
      - 'ops/cube-swarm/opportunity-batch-controller.mjs'
      - 'scripts/beck-cube-swarm-bootstrap.ps1'
      - 'scripts/beck-local-artifact-inventory.ps1'
      - 'scripts/beck-local-artifact-commercial-review.ps1'
      - 'ops/cube-swarm/commercial-mechanism-registry.json'
      - 'ops/cube-swarm/commercial-option-matrix.mjs'
      - 'package.json'
      - '.github/workflows/beck-cube-swarm-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ops/cube-swarm/opportunity-batch-controller.mjs'
      - 'scripts/beck-cube-swarm-bootstrap.ps1'
      - 'scripts/beck-local-artifact-inventory.ps1'
      - 'scripts/beck-local-artifact-commercial-review.ps1'
      - 'ops/cube-swarm/commercial-mechanism-registry.json'
      - 'ops/cube-swarm/commercial-option-matrix.mjs'
      - 'package.json'
      - '.github/workflows/beck-cube-swarm-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-safe-batch:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse PowerShell bootstrap without executing it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          foreach ($path in @('scripts/beck-cube-swarm-bootstrap.ps1','scripts/beck-local-artifact-inventory.ps1','scripts/beck-local-artifact-commercial-review.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($path + ': ' + $_.Message) }
              throw ('PowerShell parse failed: ' + $path)
            }
            Write-Host ('POWERSHELL_PARSE_PASS=' + $path)
          }
      - name: Validate Node syntax and package scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --check ops/cube-swarm/opportunity-batch-controller.mjs
          node --check ops/cube-swarm/commercial-option-matrix.mjs
          $registry = Get-Content 'ops/cube-swarm/commercial-mechanism-registry.json' -Raw | ConvertFrom-Json
          if ($registry.count -ne 100 -or $registry.mechanisms.Count -ne 100) { throw 'Expected exactly 100 commercial hypotheses.' }
          node -e "const p=require('./package.json'); if (!p.scripts['cube:swarm:batch'] || !p.scripts['verify:cube-swarm:batch']) process.exit(1)"
      - name: Generate and validate 500 commercial hypotheses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          node ops/cube-swarm/commercial-option-matrix.mjs --out artifacts/commercial-option-matrix-latest.json
          if ($LASTEXITCODE -ne 0) { throw "Commercial option matrix exited $LASTEXITCODE" }
          $matrix = Get-Content 'artifacts/commercial-option-matrix-latest.json' -Raw | ConvertFrom-Json
          if ($matrix.schema -ne 'DREAMLEDGER-COMMERCIAL-OPTION-MATRIX/v1') { throw 'Unexpected commercial option matrix schema.' }
          if ($matrix.count -ne 500 -or $matrix.options.Count -ne 500) { throw 'Expected exactly 500 commercial hypotheses.' }
          if ($matrix.domain_count -ne 50 -or $matrix.offer_model_count -ne 10) { throw 'Expected a 50 x 10 option matrix.' }
          if (@($matrix.options | Where-Object { $_.status -ne 'HYPOTHESIS_UNVALIDATED' -or $_.sale_candidate -ne $false -or $_.external_actions_allowed -ne $false }).Count -gt 0) { throw 'Hypotheses must remain unvalidated with all external actions disabled.' }
          if ($matrix.verified_revenue_nzd -ne 0 -or $matrix.independent_buyers -ne 0 -or $matrix.settled_external_payments -ne 0 -or $matrix.fulfilled_paid_orders -ne 0) { throw 'Hypothesis matrix cannot claim commercial outcomes.' }
          Write-Host 'COMMERCIAL_OPTION_MATRIX_TRUTH_BOUNDARY_PASS'
      - name: Run offline candidate batch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          node ops/cube-swarm/opportunity-batch-controller.mjs --max-candidates 100000 --out artifacts/opportunity-batch-latest.json
          if ($LASTEXITCODE -ne 0) { throw "CUBE batch exited $LASTEXITCODE" }
          $proof = Get-Content 'artifacts/opportunity-batch-latest.json' -Raw | ConvertFrom-Json
          if ($proof.schema -ne 'DREAMLEDGER-CUBE-SWARM-BATCH/v1') { throw 'Unexpected batch proof schema.' }
          if ($proof.operating_contract.verified_revenue_nzd -ne 0) { throw 'Candidate batch must not claim revenue.' }
          if ($proof.operating_contract.no_external_actions -ne $true) { throw 'External actions must remain disabled.' }
          if ($proof.counts.hypotheses -ne 100) { throw ('Expected 100 routed hypotheses, found ' + $proof.counts.hypotheses) }
          if (@($proof.candidates | Where-Object { $_.hypothesis_only -eq $true -and $_.sale_candidate -ne $false }).Count -gt 0) { throw 'Hypotheses must never be marked sale candidates.' }
          Write-Host ("BATCH_RECORDS=" + $proof.counts.unique_candidates)
          Write-Host 'OFFLINE_BATCH_TRUTH_BOUNDARY_PASS'
      - name: Upload safe batch proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cube-swarm-validation-${{ github.run_id }}
          path: |
            artifacts/opportunity-batch-latest.json
            artifacts/commercial-option-matrix-latest.json
          if-no-files-found: warn
          retention-days: 14
