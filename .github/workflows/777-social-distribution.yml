name: 777 Social Distribution

on:
  push:
    paths:
      - ".github/777/social-trigger.json"
  schedule:
    - cron: "17 9,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only, no external publication"
        required: true
        default: true
        type: boolean
      approval:
        description: "Type APPROVED to authorize this ONE external publication"
        required: true
        default: "HOLD"
        type: string
      offer_id:
        description: "Canonical offer identity (no freeform URL or price)"
        required: true
        default: "TRUTH_ORACLE"
        type: choice
        options:
          - TRUTH_ORACLE
          - QUOTE_COMPARE_49
          - EDH_0001
          - CMD-DIAG-29
      cell_id:
        description: "777 cell identity"
        required: true
        default: "CMD-DIAG-29-QR-001"
        type: string

permissions:
  contents: read

concurrency:
  group: 777-social-distribution
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build attributable distribution packet
        env:
          CELL_ID: ${{ inputs.cell_id || 'CMD-DIAG-29-QR-001' }}
          OFFER_ID: ${{ inputs.offer_id || 'TRUTH_ORACLE' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, hashlib, datetime
          cell=os.environ["CELL_ID"]
          offer=os.environ["OFFER_ID"]
          offers={
            "TRUTH_ORACLE": {
              "title": "Truth Oracle | Evidence-backed decisions",
              "message": "Compare New Zealand costs and supplier options with source-bound evidence. Free entry; paid analysis only when clearly offered.",
              "campaign": "truth_oracle"
            },
            "QUOTE_COMPARE_49": {
              "title": "Truth Oracle | Supplier quote comparison",
              "message": "Compare supplier quotes side by side: totals, exclusions, lead times and missing information. Inspect the service and terms before paying.",
              "campaign": "quote_compare"
            },
            "EDH_0001": {
              "title": "Walk the Plank | Edward Kenway",
              "message": "Walk the Plank. Edward Kenway Commander Deck. Grixis Pirates and Vehicles. Sleeved, playtested. NZ shipping. NZD 400.",
              "campaign": "edh_0001"
            },
            "CMD-DIAG-29": {
              "title": "Commander deck diagnostic",
              "message": "Commander decklist review: mana, draw, interaction and upgrade priorities. Read the offer details first.",
              "campaign": "cmd_diag"
            }
          }
          if offer not in offers: raise SystemExit("UNKNOWN_OFFER")
          data=offers[offer]
          from urllib.parse import urlencode
          target="https://dreamledger.org/go?"+urlencode({
            "utm_source":"777","utm_medium":"social","utm_campaign":data["campaign"],
            "utm_content":cell,"offer_id":offer})
          packet={"schema":"DREAMLEDGER/777-DISTRIBUTION-PACKET/v1",
                  "cell_id":cell,"offer_id":offer,"surface_family":"SOCIAL",
                  "target_url":target,"title":data["title"],
                  "message":data["message"]+" "+target,
                  "authorization":"OWNER_DISPATCH_REQUIRED",
                  "external_revenue_status":"UNVERIFIED"}
          packet["packet_sha256"]=hashlib.sha256(json.dumps(packet,sort_keys=True).encode()).hexdigest()
          os.makedirs("operator-proof",exist_ok=True)
          json.dump(packet,open("operator-proof/777-distribution-packet.json","w"),indent=2)
          PY

      - name: Publish to Tumblr when credentials are configured
        env:
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN: ${{ secrets.TUMBLR_TOKEN }}
          TUMBLR_TOKEN_SECRET: ${{ secrets.TUMBLR_TOKEN_SECRET }}
          TUMBLR_BLOG: ${{ secrets.TUMBLR_BLOG }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          APPROVAL: ${{ inputs.approval }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$DRY_RUN" != "false" ] || [ "$APPROVAL" != "APPROVED" ]; then echo "TUMBLR=DRY_RUN"; exit 0; fi
          if [ -z "$TUMBLR_CONSUMER_KEY" ] || [ -z "$TUMBLR_CONSUMER_SECRET" ] || [ -z "$TUMBLR_TOKEN" ] || [ -z "$TUMBLR_TOKEN_SECRET" ] || [ -z "$TUMBLR_BLOG" ]; then echo "TUMBLR=SKIPPED_CREDENTIALS_NOT_CONFIGURED"; exit 0; fi
          python3 - <<'PY'
          import json, os, time, hmac, hashlib, urllib.parse, urllib.request, secrets, base64
          p=json.load(open("operator-proof/777-distribution-packet.json"))
          base=f"https://api.tumblr.com/v2/blog/{os.environ['TUMBLR_BLOG']}/posts"
          params={"type":"text","state":"published","title":p["title"],"body":p["message"]}
          oauth={"oauth_consumer_key":os.environ["TUMBLR_CONSUMER_KEY"],"oauth_token":os.environ["TUMBLR_TOKEN"],"oauth_nonce":secrets.token_hex(16),"oauth_timestamp":str(int(time.time())),"oauth_signature_method":"HMAC-SHA1","oauth_version":"1.0"}
          enc=lambda x: urllib.parse.quote(str(x),safe="~-._")
          normalized="&".join(f"{enc(k)}={enc(v)}" for k,v in sorted({**params,**oauth}.items()))
          base_string="&".join([enc("POST"),enc(base),enc(normalized)])
          key=enc(os.environ["TUMBLR_CONSUMER_SECRET"])+"&"+enc(os.environ["TUMBLR_TOKEN_SECRET"])
          oauth["oauth_signature"]=base64.b64encode(hmac.new(key.encode(),base_string.encode(),hashlib.sha1).digest()).decode()
          auth="OAuth "+", ".join(f'{enc(k)}="{enc(v)}"' for k,v in sorted(oauth.items()))
          req=urllib.request.Request(base,data=urllib.parse.urlencode(params).encode(),headers={"Authorization":auth,"User-Agent":"DreamLedger-777/1.0","Content-Type":"application/x-www-form-urlencoded"},method="POST")
          with urllib.request.urlopen(req,timeout=30) as r: result=json.loads(r.read().decode())
          assert result.get("meta",{}).get("status")==201, result
          json.dump(result,open("operator-proof/tumblr-result.json","w"),indent=2)
          PY

      - name: Publish to X when credentials are configured
        env:
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          APPROVAL: ${{ inputs.approval }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$DRY_RUN" != "false" ] || [ "$APPROVAL" != "APPROVED" ]; then echo "X=DRY_RUN"; exit 0; fi
          if [ -z "$X_ACCESS_TOKEN" ]; then echo "X=SKIPPED_CREDENTIALS_NOT_CONFIGURED"; exit 0; fi
          python3 - <<'PY'
          import json, os, urllib.request
          p=json.load(open("operator-proof/777-distribution-packet.json"))
          req=urllib.request.Request("https://api.x.com/2/tweets",data=json.dumps({"text":p["message"]}).encode(),headers={"Authorization":"Bearer "+os.environ["X_ACCESS_TOKEN"],"Content-Type":"application/json","Accept":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=30) as r: result=json.loads(r.read().decode())
          assert result.get("data",{}).get("id"), result
          json.dump(result,open("operator-proof/x-result.json","w"),indent=2)
          PY

      - name: Emit telemetry
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          packet=json.load(open("operator-proof/777-distribution-packet.json"))
          out={"schema":"DREAMLEDGER/777-SOCIAL-TELEMETRY/v1","cell_id":packet["cell_id"],"offer_id":packet["offer_id"],"target_url":packet["target_url"],"tumblr_published":os.path.exists("operator-proof/tumblr-result.json"),"x_published":os.path.exists("operator-proof/x-result.json"),"revenue_nzd":0,"buyer_count":0,"settled_payment_count":0,"truth":"UNVERIFIED","git_sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()}
          json.dump(out,open("operator-proof/777-social-telemetry.json","w"),indent=2)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 777-social-distribution-proof
          path: operator-proof/