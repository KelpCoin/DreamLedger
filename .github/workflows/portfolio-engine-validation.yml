name: portfolio-engine-validation
on:
  push:
    paths:
      - docs/PORTFOLIO-ENGINE-UNIVERSAL-PAIN-ATLAS.md
      - scripts/validate_portfolio_engine.py
      - .github/workflows/portfolio-engine-validation.yml
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_portfolio_engine.py
