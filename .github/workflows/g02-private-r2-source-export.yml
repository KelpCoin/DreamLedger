name: G02 Cloud-only private Supabase source backup
on:
  workflow_dispatch:
    inputs:
      approval_marker:
        description: 'Type approve-readonly-source-export to export read-only source to PRIVATE R2'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dreamledger-g02-readonly-export
  cancel-in-progress: false
jobs:
  export:
    if: github.repository == 'KelpCoin/DreamLedger' && github.ref == 'refs/heads/beck/provider-migration-neon-cloudflare-20261019' && inputs.approval_marker == 'approve-readonly-source-export'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PGHOST: ${{ secrets.SUPABASE_POOLER_HOST }}
      PGPORT: '5432'
      PGDATABASE: ${{ secrets.SUPABASE_DB_NAME }}
      PGUSER: ${{ secrets.SUPABASE_DB_USER }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: '15'
      R2_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_PRIVATE_BACKUP_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      G02_SOURCE_PROJECT_REF: wbwgroygjeyukkspnqiy
    steps:
      - name: Checkout reviewed migration branch (no retained auth)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fail closed if credentials unavailable
        shell: bash
        run: |
          set -euo pipefail
          for n in PGHOST PGDATABASE PGUSER PGPASSWORD R2_ENDPOINT R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            test -n "${!n:-}" || { echo "BLOCKED_MISSING_${n}"; exit 2; }
          done
          [[ "$PGHOST" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo "INVALID_DATABASE_HOST"; exit 2; }
          [[ "$R2_ENDPOINT" =~ ^https://[a-zA-Z0-9.-]+/?$ ]] || { echo "INVALID_R2_TLS_ENDPOINT"; exit 2; }
          getent ahostsv4 "$PGHOST" >/dev/null || { echo "SOURCE_POOLER_HAS_NO_IPV4"; exit 2; }
          test -s ops/migration/supabase-to-neon/preflight.sql
      - name: Read-only pg_dump and source SQL inventory using official PostgreSQL 17 image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g02"
          chmod 700 "$RUNNER_TEMP/g02"
          docker run --rm \
            -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD -e PGSSLMODE -e PGCONNECT_TIMEOUT \
            -v "$RUNNER_TEMP/g02:/proof" \
            -v "$GITHUB_WORKSPACE/ops/migration/supabase-to-neon/preflight.sql:/preflight.sql:ro" \
            postgres:17 bash -euc '
              psql -X -w -v ON_ERROR_STOP=1 -q -A -t -f /preflight.sql > /proof/source-inventory.json
              pg_dump -w --format=custom --no-owner --no-acl --file=/proof/source.dump
              pg_restore --list /proof/source.dump > /proof/restore-list.txt
              test -s /proof/source-inventory.json && test -s /proof/source.dump && test -s /proof/restore-list.txt
            '
          echo "SOURCE_READONLY_EXPORT=PASS"
      - name: Private encrypted-at-rest R2 upload and full read-back verification
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet boto3==1.40.60
          python ops/migration/cloud-only/g02_r2_upload.py "$RUNNER_TEMP/g02" "$GITHUB_RUN_ID"
      - name: Publish NON-SENSITIVE gate status
        shell: bash
        if: always()
        run: |
          {
            echo '## G02 private source export candidate'
            echo 'This workflow never imports data to Neon and never changes DNS or provider state.'
            echo 'Never publish source SQL inventory, database dumps, or credentials in a public artifact.'
            echo 'Review cloud-only tool result and private R2 read-back evidence before accepting G02.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Erase temporary runner backup data
        shell: bash
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/g02" ]; then
            rm -rf -- "$RUNNER_TEMP/g02"
          fi
