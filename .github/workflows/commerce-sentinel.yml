name: Commerce Sentinel

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Readiness check or create one checkout doorway'
        required: true
        default: readiness
        type: choice
        options:
          - readiness
          - create-checkout
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: commerce-sentinel
  cancel-in-progress: false

env:
  LIVE_URL: https://dreamledger.org
  OFFER_ID: OFFER-COMMANDER-DECK-DIAGNOSTIC-001
  CHECKOUT_ENDPOINT: https://dreamledger.org/api/offer-checkout/create

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: Check live health and approved offer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          health_code="$(curl --silent --output proof/health.json --write-out '%{http_code}' --max-time 90 "$LIVE_URL/healthz" || true)"
          offers_code="$(curl --silent --output proof/offers.json --write-out '%{http_code}' --max-time 90 "$LIVE_URL/api/offers" || true)"
          echo "health_http=$health_code" | tee proof/commerce-sentinel.txt
          echo "offers_http=$offers_code" | tee -a proof/commerce-sentinel.txt
          if [ "$health_code" != "200" ] || [ "$offers_code" != "200" ]; then exit 1; fi
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('proof/offers.json', 'utf8'));
          const list = Array.isArray(data.offers) ? data.offers : [];
          const offer = list.find(o => o.offer_id === process.env.OFFER_ID);
          if (!offer) throw new Error(`approved offer missing: ${process.env.OFFER_ID}`);
          if (offer.checkout_available !== true) throw new Error('approved offer is not checkoutable');
          if (offer.approval_required !== false) throw new Error('approved offer remains approval-gated');
          if (Number(offer.price) !== 29) throw new Error('approved offer price is not NZD 29');
          if (String(offer.currency).toUpperCase() !== 'NZD') throw new Error('approved offer currency is not NZD');
          if (String(offer.product_sku) !== 'COMMANDER-DECK-DIAGNOSTIC-001') throw new Error('approved offer SKU is not COMMANDER-DECK-DIAGNOSTIC-001');
          if (String(offer.name) !== 'Commander Deck Diagnostic') throw new Error('approved offer name is not Commander Deck Diagnostic');
          console.log(JSON.stringify({status:'PASS', offer_id:offer.offer_id, product_sku:offer.product_sku, name:offer.name, price:offer.price, currency:offer.currency, checkout_available:offer.checkout_available}, null, 2));
          NODE
          echo "CHECKOUT_READY=true" | tee -a proof/commerce-sentinel.txt

      - name: Create one checkout doorway when explicitly dispatched
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'create-checkout'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          response="$(curl --fail --silent --show-error --max-time 60 -X POST "$CHECKOUT_ENDPOINT" -H 'Content-Type: application/json' --data "{\"offer_id\":\"$OFFER_ID\"}")"
          printf '%s\n' "$response" > proof/checkout.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('proof/checkout.json', 'utf8'));
          if (!data.url || !/^https:\/\/checkout\.stripe\.com\//.test(data.url)) throw new Error('Stripe Checkout URL not returned');
          fs.writeFileSync('proof/checkout-url.txt', data.url + '\n');
          console.log('CHECKOUT_CREATED=true');
          console.log(data.url);
          NODE

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commerce-sentinel-proof-${{ github.run_id }}
          path: proof/
          if-no-files-found: error
