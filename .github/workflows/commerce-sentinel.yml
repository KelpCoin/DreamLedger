name: Commerce Sentinel

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Readiness check or create one checkout doorway'
        required: true
        default: readiness
        type: choice
        options:
          - readiness
          - create-checkout
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: commerce-sentinel
  cancel-in-progress: false

env:
  LIVE_URL: https://dreamledger.org
  OFFER_ID: OFFER-DREAMLEDGER-BILLBOARD-FOUNDING-001
  CHECKOUT_ENDPOINT: https://dreamledger.org/api/offer-checkout/create
  BILLBOARD_CHECKOUT: https://buy.stripe.com/dRmbJ2cZi9eW4mk9La9oc02

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: Check live health, billboard, DreamMeez and account doors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          health_code="$(curl --silent --output proof/health.json --write-out '%{http_code}' --max-time 90 "$LIVE_URL/healthz" || true)"
          offers_code="$(curl --silent --output proof/offers.json --write-out '%{http_code}' --max-time 90 "$LIVE_URL/api/offers" || true)"
          billboard_code="$(curl --silent --output proof/billboard.html --write-out '%{http_code}' --max-time 90 "$LIVE_URL/billboard" || true)"
          dreammeez_code="$(curl --silent --output proof/dreammeez.html --write-out '%{http_code}' --max-time 90 "$LIVE_URL/dreammeez" || true)"
          cosmetics_code="$(curl --silent --output proof/cosmetics.json --write-out '%{http_code}' --max-time 90 "$LIVE_URL/api/dreamiez/cosmetics" || true)"
          login_code="$(curl --silent --output proof/login.html --write-out '%{http_code}' --max-time 90 "$LIVE_URL/login" || true)"
          echo "health_http=$health_code" | tee proof/commerce-sentinel.txt
          echo "offers_http=$offers_code" | tee -a proof/commerce-sentinel.txt
          echo "billboard_http=$billboard_code" | tee -a proof/commerce-sentinel.txt
          echo "dreammeez_http=$dreammeez_code" | tee -a proof/commerce-sentinel.txt
          echo "cosmetics_http=$cosmetics_code" | tee -a proof/commerce-sentinel.txt
          echo "login_http=$login_code" | tee -a proof/commerce-sentinel.txt
          for code in "$health_code" "$offers_code" "$billboard_code" "$dreammeez_code" "$cosmetics_code" "$login_code"; do test "$code" = "200"; done
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('proof/offers.json','utf8'));
          const offer=(Array.isArray(data.offers)?data.offers:[]).find(o=>o.offer_id===process.env.OFFER_ID);
          if(!offer) throw new Error(`approved offer missing: ${process.env.OFFER_ID}`);
          if(offer.checkout_available!==true) throw new Error('billboard offer is not checkoutable');
          if(offer.approval_required!==false) throw new Error('billboard offer remains approval-gated');
          if(Number(offer.price)!==50) throw new Error('billboard offer price is not NZD 50');
          if(String(offer.currency).toUpperCase()!=='NZD') throw new Error('billboard currency is not NZD');
          if(String(offer.product_id)!=='BILLBOARD-LARGE') throw new Error('billboard product mismatch');
          console.log(JSON.stringify({status:'PASS',offer_id:offer.offer_id,product_id:offer.product_id,price:offer.price,currency:offer.currency,checkout_available:offer.checkout_available},null,2));
          NODE
          grep -q 'Digital Billboard' proof/billboard.html || grep -q 'Internet Billboard' proof/billboard.html
          grep -q 'DreamMeez\|DREAMMEEZ' proof/dreammeez.html
          node -e "const x=JSON.parse(require('fs').readFileSync('proof/cosmetics.json','utf8')); if(!Array.isArray(x)||x.length<3) process.exit(1); console.log('DREAMMEEZ_COSMETICS='+x.length)"
          grep -q '/api/account/login' proof/login.html
          echo "CHECKOUT_READY=true" | tee -a proof/commerce-sentinel.txt

      - name: Create one checkout doorway when explicitly dispatched
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'create-checkout'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          echo "$BILLBOARD_CHECKOUT" > proof/checkout-url.txt
          echo 'CHECKOUT_CREATED=true' | tee -a proof/commerce-sentinel.txt
          echo "$BILLBOARD_CHECKOUT"

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commerce-sentinel-proof-${{ github.run_id }}
          path: proof/
          if-no-files-found: error
