name: 777 Tumblr Syndication

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish eligible LIVE_ADAPTER items to the authorized Tumblr blog"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: 777-tumblr-syndication
  cancel-in-progress: true

jobs:
  syndicate:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.TUMBLR_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dry-run or publish
        working-directory: BEC-PRIME
        env:
          TUMBLR_BLOG_IDENTIFIER: ${{ secrets.TUMBLR_BLOG_IDENTIFIER }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          TUMBLR_OAUTH_TOKEN_SECRET: ${{ secrets.TUMBLR_OAUTH_TOKEN_SECRET }}
          TUMBLR_BATCH_SIZE: "5"
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.publish }}" = "true" ] || [ "${{ vars.TUMBLR_PUBLISH_ENABLED }}" = "true" ]; then
            node scripts/sync-evergreen-to-tumblr.js --publish
          else
            node scripts/sync-evergreen-to-tumblr.js
          fi
