name: DreamLedger Website Compile

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'BEC-PRIME/compiler/**'
      - '.github/workflows/dreamledger-website-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dreamledger-website-compile
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile universal targets and DreamLedger
        run: |
          node BEC-PRIME/compiler/Compile-DreamLedger.js

      - name: Verify DreamLedger compiler proof
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'BEC-PRIME/RUN-PROOFS/DREAMLEDGER-WEBSITE-COMPILER-PROOF.json';
          const proof = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (proof.status !== 'PASS') throw new Error('DreamLedger compiler proof is not PASS');
          if (proof.exact_source_copy !== true) throw new Error('DreamLedger output is not an exact source copy');
          if (proof.universal_compiler_smoke !== 'PASS') throw new Error('Universal compiler smoke did not PASS');
          console.log(JSON.stringify(proof, null, 2));
          NODE

      - name: Commit compiled DreamLedger artifact and proof
        run: |
          git config user.name "BEC-PRIME Compiler"
          git config user.email "bec-prime@users.noreply.github.com"
          git add BEC-PRIME/compiled/universal/website/dreamledger/index.html BEC-PRIME/RUN-PROOFS/DREAMLEDGER-WEBSITE-COMPILER-PROOF.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'chore: compile DreamLedger website artifact'
          git push origin HEAD:main

      - name: Upload compiler proof
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-website-compiler-proof
          path: BEC-PRIME/RUN-PROOFS/DREAMLEDGER-WEBSITE-COMPILER-PROOF.json
