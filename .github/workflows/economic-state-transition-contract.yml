name: Economic State Transition Contract

# FROZEN: transition coverage is exercised by the authoritative Economic
# Production Observation Contract. Manual dispatch remains available.
concurrency:
  group: dreamledger-economic-state-transition-contract-manual
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  transitions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run transition tests
        working-directory: runtime/economic
        run: python3 test_state_transition_engine.py
