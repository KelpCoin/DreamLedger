name: BEC-PRIME Gates

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: bec-prime-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BEC-PRIME
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Compile canonical surfaces and Cortex leverage gate
        run: npm run compile

      - name: Syntax gate
        run: node --check server.js && node --check start.js && node --check routes/omniCommerce.js && node --check routes/platformCart.js

      - name: DreamMeez E2E smoke
        run: npm run smoke:dreamiez

      - name: Revenue ledger smoke
        run: npm run smoke:revenue-ledger

      - name: Compiler leverage proof
        run: |
          test -s data/proofs/compiler-leverage-latest.json
          grep -q '"status": "PASS"' data/proofs/compiler-leverage-latest.json
          test -s compiled/website/compiler-proof/pong.html

      - name: Public boundary check
        run: |
          test -f manifests/CUBE-PUBLIC-SURFACE-MANIFEST.json
          test -f PROOF-CUBE-SURFACE-COMPILATION.json
          test -f compiled/omni-commerce-manifest.json
          test -f PROOF-OMNI-COMMERCE-COMPILATION.json
          ! grep -R 'api/ip' compiled/website || true
          ! grep -R 'catalog/ip-capabilities.json' compiled/website || true

      - name: Live checkout reality gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://dreamledger.org
        run: bash scripts/verify_checkout_live.sh OFFER-BEC-PRIME-ARCHITECTURE-AUDIT

      - name: Upload compilation proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bec-prime-compilation-proof
          path: |
            BEC-PRIME/PROOF-CUBE-SURFACE-COMPILATION.json
            BEC-PRIME/PROOF-OMNI-COMMERCE-COMPILATION.json
            BEC-PRIME/data/proofs/
          if-no-files-found: error
