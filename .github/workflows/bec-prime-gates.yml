name: BEC-PRIME Gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BEC-PRIME
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BEC-PRIME/package-lock.json

      - name: Install
        run: npm install

      - name: Compile canonical surfaces
        run: npm run compile:offers && npm run compile:surface && npm run compile:silo-surfaces

      - name: Syntax gate
        run: node --check server.js && node --check start.js && node --check compiler/SiloSurfaceCompiler.js && node --check scouts/Run-DemandScouts.js && node --check scripts/verify-public-surface.js

      - name: Revenue ledger smoke
        run: npm run smoke:revenue-ledger

      - name: Gauntlet
        run: npm run gauntlet

      - name: Dreamiez smoke
        run: npm run smoke:dreamiez

      - name: Demand scouts
        run: npm run scout:demand

      - name: Public boundary and silo check
        run: |
          test -f manifests/CUBE-PUBLIC-SURFACE-MANIFEST.json
          test -f PROOF-CUBE-SURFACE-COMPILATION.json
          test -f PROOF-MULTI-SILO-SURFACE-COMPILATION.json
          test -f data/scout-evidence/DEMAND-SCOUT-RESULT.json
          npm run verify:public-surface
          ! grep -R 'api/ip' compiled/website compiled/mtg compiled/dreamiez || true
          ! grep -R 'catalog/ip-capabilities.json' compiled/website compiled/mtg compiled/dreamiez || true

      - name: Upload compilation and scout proof
        uses: actions/upload-artifact@v4
        with:
          name: bec-prime-multi-silo-proof
          path: |
            BEC-PRIME/PROOF-CUBE-SURFACE-COMPILATION.json
            BEC-PRIME/PROOF-MULTI-SILO-SURFACE-COMPILATION.json
            BEC-PRIME/data/proofs/
            BEC-PRIME/data/scout-evidence/
