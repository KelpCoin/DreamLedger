name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-edge-functions.yml'
  workflow_dispatch:

concurrency:
  group: supabase-edge-production
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      stripe: ${{ steps.detect.outputs.stripe }}
      mtg: ${{ steps.detect.outputs.mtg }}
      dreammeez: ${{ steps.detect.outputs.dreammeez }}
      heartbeat: ${{ steps.detect.outputs.heartbeat }}
    steps:
      - name: Checkout change range
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify changed function only
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf 'stripe=true\nmtg=true\ndreammeez=true\nheartbeat=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "$HEAD_SHA^")"
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          has_path() { grep -Eq "$1" <<< "$changed"; }
          has_path '^supabase/functions/stripe-revenue-41104f355d6878cdd6d1f9dc/' && stripe=true || stripe=false
          has_path '^supabase/functions/mtg-deck-catalog/' && mtg=true || mtg=false
          has_path '^supabase/functions/dreammeez-cosmetic-checkout/' && dreammeez=true || dreammeez=false
          has_path '^supabase/functions/economic-radar-heartbeat/' && heartbeat=true || heartbeat=false
          printf 'stripe=%s\nmtg=%s\ndreammeez=%s\nheartbeat=%s\n' "$stripe" "$mtg" "$dreammeez" "$heartbeat" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.stripe == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: wbwgroygjeyukkspnqiy
      FUNCTION_NAME: stripe-revenue-41104f355d6878cdd6d1f9dc
      FUNCTION_URL: https://wbwgroygjeyukkspnqiy.supabase.co/functions/v1/stripe-revenue-41104f355d6878cdd6d1f9dc

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment source
        shell: bash
        run: |
          set -euo pipefail
          test -s "supabase/functions/${FUNCTION_NAME}/index.ts"
          test -s "supabase/functions/${FUNCTION_NAME}/deno.json"
          grep -F 'constructEventAsync' "supabase/functions/${FUNCTION_NAME}/index.ts"
          grep -F 'STRIPE_WEBHOOK_SIGNING_SECRET' "supabase/functions/${FUNCTION_NAME}/index.ts"
          grep -F 'stripe_webhook_events' "supabase/functions/${FUNCTION_NAME}/index.ts"
          grep -F 'control_reconciliations' "supabase/functions/${FUNCTION_NAME}/index.ts"

      - name: Deploy canonical Edge Function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy "${FUNCTION_NAME}"             --project-ref "${PROJECT_ID}"             --no-verify-jwt             --import-map "supabase/functions/${FUNCTION_NAME}/deno.json"

      - name: Verify deployed function health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "${FUNCTION_URL}")"
          echo "${body}" | grep -F '"status":"healthy"'
          echo "${body}" | grep -F "${FUNCTION_NAME}"
          echo "${body}" | grep -F '"configured":true'

      - name: Record deployment identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Deployed Supabase function ${FUNCTION_NAME} from commit ${GITHUB_SHA}"

  deploy-mtg-deck-catalog:
    needs: detect-changes
    if: needs.detect-changes.outputs.mtg == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: wbwgroygjeyukkspnqiy
      FUNCTION_NAME: mtg-deck-catalog
      FUNCTION_URL: https://wbwgroygjeyukkspnqiy.supabase.co/functions/v1/mtg-deck-catalog
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate MTG deck catalog source
        shell: bash
        run: |
          set -euo pipefail
          test -s "supabase/functions/${FUNCTION_NAME}/index.ts"
          grep -F 'mtg_decks' "supabase/functions/${FUNCTION_NAME}/index.ts"
          grep -F 'COPY_ONLY_UNTIL_EXTERNAL_CHANNEL_AUTHORIZATION_EXISTS' "supabase/functions/${FUNCTION_NAME}/index.ts"
      - name: Deploy MTG deck catalog
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy "${FUNCTION_NAME}" --project-ref "${PROJECT_ID}"
      - name: Verify MTG deck catalog endpoint
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "${FUNCTION_URL}")"
          echo "${body}" | grep -F 'DREAMLEDGER/MTG-DECK-CATALOG/v1'
  deploy-dreammeez-cosmetic-checkout:
    needs: detect-changes
    if: needs.detect-changes.outputs.dreammeez == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: wbwgroygjeyukkspnqiy
      FUNCTION_NAME: dreammeez-cosmetic-checkout
      FUNCTION_URL: https://wbwgroygjeyukkspnqiy.supabase.co/functions/v1/dreammeez-cosmetic-checkout
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate DreamMeez checkout source
        shell: bash
        run: |
          set -euo pipefail
          test -s "supabase/functions/${FUNCTION_NAME}/index.ts"
          grep -F 'dreammeez_cosmetic_id' "supabase/functions/${FUNCTION_NAME}/index.ts"
          grep -F 'checkout.sessions.create' "supabase/functions/${FUNCTION_NAME}/index.ts"
          grep -F 'auth.getUser' "supabase/functions/${FUNCTION_NAME}/index.ts"
      - name: Deploy DreamMeez checkout
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy "${FUNCTION_NAME}" --project-ref "${PROJECT_ID}" --import-map "supabase/functions/${FUNCTION_NAME}/deno.json"
      - name: Verify public function health boundary
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/body -w '%{http_code}' -X POST "${FUNCTION_URL}" -H 'content-type: application/json' --data '{"cosmetic_id":"dreammeez-founder-cloak"}')"
          test "${code}" = "401"
          grep -F 'authorization required' /tmp/body


  deploy-economic-radar-heartbeat:
    needs: detect-changes
    if: needs.detect-changes.outputs.heartbeat == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: wbwgroygjeyukkspnqiy
      FUNCTION_NAME: economic-radar-heartbeat
      FUNCTION_URL: https://wbwgroygjeyukkspnqiy.supabase.co/functions/v1/economic-radar-heartbeat
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate heartbeat source and safety contract
        shell: bash
        run: |
          set -euo pipefail
          test -s "supabase/functions/${FUNCTION_NAME}/index.ts"
          grep -F 'HEARTBEAT_RECORDED' "supabase/functions/${FUNCTION_NAME}/index.ts"
          grep -F 'IDEMPOTENCY_KEY_REQUIRED' "supabase/functions/${FUNCTION_NAME}/index.ts"
          grep -F 'x-cube-heartbeat-secret' "supabase/functions/${FUNCTION_NAME}/index.ts"
          grep -F 'revenue_claimed:false' "supabase/functions/${FUNCTION_NAME}/index.ts"
      - name: Deploy heartbeat Edge Function with in-handler authentication
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy "${FUNCTION_NAME}" --project-ref "${PROJECT_ID}" --no-verify-jwt
      - name: Verify deployed liveness endpoint
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "${FUNCTION_URL}/healthz")"
          echo "$body"
          echo "$body" | grep -F '"status":"healthy"'
          echo "$body" | grep -F '"function":"economic-radar-heartbeat"'
      - name: Record deployment identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Deployed ${FUNCTION_NAME} from commit ${GITHUB_SHA}; verify_jwt=false; healthz readback passed."
