name: BEC PRIME Mission Loop
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plan missions
        shell: pwsh
        run: ./BEC-PRIME/autonomy/PRIORITY-ENGINE.ps1
      - name: Commit mission state
        shell: pwsh
        run: |
          git config user.name 'BEC PRIME'
          git config user.email 'bec-prime@users.noreply.github.com'
          git add BEC-PRIME/autonomy/QUEUE/PLANNED BEC-PRIME/autonomy/PROOFS BEC-PRIME/autonomy/MISSION-STATE.json
          if (git diff --cached --quiet) { Write-Host 'No mission-state changes.'; exit 0 }
          git commit -m 'BEC PRIME: refresh mission plan'
          git push
      - name: Publish mission summary
        shell: pwsh
        run: |
          $p = Get-Content -Raw BEC-PRIME/autonomy/MISSION-STATE.json
          Write-Host $p