name: BEC PRIME Mission Loop
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plan missions
        shell: pwsh
        run: ./BEC-PRIME/autonomy/PRIORITY-ENGINE.ps1
      - name: Verify mission loop
        shell: pwsh
        run: ./BEC-PRIME/autonomy/Verify-Mission-Loop.ps1
      - name: Save mission state and proof
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force BEC-PRIME/autonomy/ARTIFACTS | Out-Null
          Copy-Item BEC-PRIME/autonomy/MISSION-STATE.json BEC-PRIME/autonomy/ARTIFACTS/MISSION-STATE.json -Force
          if (Test-Path BEC-PRIME/autonomy/PROOFS) {
            Copy-Item BEC-PRIME/autonomy/PROOFS BEC-PRIME/autonomy/ARTIFACTS/PROOFS -Recurse -Force
          }

      - name: Upload mission state and proof
        uses: actions/upload-artifact@v4
        with:
          name: bec-prime-mission-state-${{ github.run_id }}
          path: BEC-PRIME/autonomy/ARTIFACTS/

      - name: Publish mission summary
        shell: pwsh
        run: |
          Get-Content -Raw BEC-PRIME/autonomy/MISSION-STATE.json