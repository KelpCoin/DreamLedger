name: CI Recovery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BEC-PRIME
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BEC-PRIME/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run basic test suite
        run: npm test

  ci-pass-evidence:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: CI PASS evidence
        run: echo "CI PASS: PROVEN"

  bec-economic-bridge-worker:
    name: BEC Economic Bridge Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BEC-PRIME
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BEC-PRIME/package.json

      - name: Install dependencies
        run: npm install

      - name: Lease and execute production economic job
        env:
          BEC_AGENT_BRIDGE_URL: https://dreamledger.org
          DREAMLEDGER_AGENT_BRIDGE_TOKEN: ${{ secrets.DREAMLEDGER_AGENT_BRIDGE_TOKEN }}
          BEC_WORKER_ID: github-worker
        run: node runtime/EconomicJobWorkerAdapter.js | tee bridge-worker-result.json

      - name: Validate bridge result
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('bridge-worker-result.json', 'utf8'));
          if (!['IDLE', 'LEASED_AND_EXECUTED'].includes(result.status)) {
            throw new Error(`Unexpected worker status: ${result.status}`);
          }
          if (result.status === 'LEASED_AND_EXECUTED') {
            const lease = result.lease;
            if (lease.envelope.job_id !== lease.job.id) throw new Error('Lease job identity mismatch');
            if (lease.envelope.worker_id !== 'github-worker') throw new Error('Worker identity mismatch');
            if (lease.envelope.schema_version !== 'BECK-BRIDGE-RAIL-1.0') throw new Error('Rail schema mismatch');
            console.log(JSON.stringify({
              JOB_ID: lease.envelope.job_id,
              WORKER_ID: lease.envelope.worker_id,
              LEASE_ID: lease.envelope.lease_id,
              STATUS: lease.job.status,
              ISSUED_AT: lease.envelope.issued_at,
              EXPIRES_AT: lease.envelope.expires_at,
              RAIL_SCHEMA: lease.envelope.schema_version
            }, null, 2));
          } else {
            console.log('No pending production job was available.');
          }
          NODE

      - name: Upload bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bec-economic-bridge-${{ github.run_id }}
          path: BEC-PRIME/bridge-worker-result.json
          if-no-files-found: warn
          retention-days: 30
