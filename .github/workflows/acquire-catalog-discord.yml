name: Acquire Approved Catalog Offer via Discord

on:
  repository_dispatch:
    types: [approved-acquisition]
  workflow_dispatch:
    inputs:
      offer:
        description: "Approved offer to publish"
        required: true
        type: choice
        options:
          - CMD-DIAG-29
          - DREAMLEDGER-BILLBOARD-50
      target:
        description: "Discord target label configured by repository secret"
        required: true
        type: string
      approval:
        description: "Type APPROVED to authorize this external post"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-discord-acquisition
  cancel-in-progress: false

jobs:
  post:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.approval == 'APPROVED') || (github.event_name == 'repository_dispatch' && github.event.client_payload.approval == 'APPROVED') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish selected approved offer and verify
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OFFER: ${{ github.event_name == 'workflow_dispatch' && inputs.offer || github.event.client_payload.offer }}
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || github.event.client_payload.target }}
        run: |
          set -euo pipefail
          test -n "$DISCORD_WEBHOOK"
          case "$DISCORD_WEBHOOK" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*) ;;
            *) echo "Invalid Discord webhook host"; exit 1 ;;
          esac
          test -n "$TARGET"

          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          with open("BEC-PRIME/catalog/offers/approved.json", "r", encoding="utf-8") as f:
              approved_doc = json.load(f)

          aliases = {
              "CMD-DIAG-29": "CMD-DIAG-29",
              "DREAMLEDGER-BILLBOARD-50": "DL-BILLBOARD-100X100-3000-001"
          }

          offer = os.environ["OFFER"]
          sku = aliases.get(offer)
          rows = [
              x for x in approved_doc.get("approved", [])
              if x.get("product_sku") == sku
              and x.get("payment_link_url")
              and x.get("payment_link_status") == "ACTIVE_LIVEMODE"
          ]
          if len(rows) != 1:
              raise SystemExit("Offer is not uniquely approved and live: " + offer)

          record = rows[0]
          title = record["name"]
          price = record["currency"] + "$" + str(record["price"])
          link = record["payment_link_url"]
          description = record["problem"]
          content = title + " - " + price + "\n\n" + description + "\n\n" + link

          base = os.environ["DISCORD_WEBHOOK"]
          parts = urllib.parse.urlsplit(base)
          query = urllib.parse.parse_qsl(parts.query, keep_blank_values=True)
          query.append(("wait", "true"))
          post_url = urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path, urllib.parse.urlencode(query), parts.fragment))

          req = urllib.request.Request(post_url, data=json.dumps({"content": content}).encode(), headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=20) as response:
              body = json.loads(response.read().decode())

          message_id = body.get("id")
          channel_id = body.get("channel_id")
          if not message_id or not channel_id or link not in body.get("content", ""):
              raise SystemExit("Publication response failed identity/content verification")

          verify_url = base.rstrip("/") + "/messages/" + urllib.parse.quote(str(message_id), safe="")
          with urllib.request.urlopen(urllib.request.Request(verify_url, headers={"Accept": "application/json"}), timeout=20) as response:
              verified = json.loads(response.read().decode())

          if verified.get("id") != message_id or verified.get("channel_id") != channel_id or link not in verified.get("content", ""):
              raise SystemExit("Published message failed read-back verification")

          print("EXTERNAL_PUBLICATION=VERIFIED_DISCORD_MESSAGE")
          print("OFFER=" + offer)
          print("SKU=" + record["product_sku"])
          print("OFFER_ID=" + record["offer_id"])
          print("DISCORD_MESSAGE_ID=" + message_id)
          print("DISCORD_CHANNEL_ID=" + channel_id)
          print("EXTERNAL_REVENUE=UNVERIFIED")

          # Persistent one-shot lock: only create it after Discord publication
          # and read-back verification have both succeeded.
          lock_title = "FACTORY-ACQUISITION-LOCK: " + record["product_sku"]
          lock_body = (
              "Created only after VERIFIED_DISCORD_MESSAGE.\\n\\n"
              "offer_id=" + record["offer_id"] + "\\n"
              "sku=" + record["product_sku"] + "\\n"
              "discord_message_id=" + message_id + "\\n"
              "state=PUBLICATION_VERIFIED_REVENUE_UNVERIFIED"
          )
          token = os.environ.get("GITHUB_TOKEN")
          if not token:
              raise SystemExit("GITHUB_TOKEN unavailable for acquisition lock")
          api = "https://api.github.com/repos/KelpCoin/DreamLedger/issues"
          payload = json.dumps({"title": lock_title, "body": lock_body}).encode()
          req = urllib.request.Request(
              api,
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + token,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json"
              },
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              issue = json.loads(response.read().decode())
          if not issue.get("number"):
              raise SystemExit("Acquisition lock creation failed")
          print("ACQUISITION_LOCK_ISSUE=" + str(issue["number"]))
          PY

      - name: State boundary
        env:
          OFFER: ${{ github.event_name == 'workflow_dispatch' && inputs.offer || github.event.client_payload.offer }}
        run: |
          echo "OFFER=$OFFER"
          echo "PUBLICATION=VERIFIED_RUNTIME"
          echo "BUYER=UNVERIFIED"
          echo "REVENUE=UNVERIFIED"
