name: Acquire Catalog Offer via Discord

on:
  workflow_dispatch:
    inputs:
      offer:
        description: "Offer to publish"
        required: true
        type: choice
        options:
          - CMD-DIAG-29
          - DREAMLEDGER-BILLBOARD-50
          - DREAMMEEZ-COSMIC-HOODIE-5
          - DREAMMEEZ-CAPE-10
          - DREAMMEEZ-CHROME-BOOTS-9
          - DREAMMEEZ-SPROUT-3.99-MONTHLY
          - DREAMMEEZ-GLOW-5.99-MONTHLY
          - DREAMMEEZ-DEPTH-9.99-MONTHLY
          - KELP-FLOOR1-19
          - DISCORD-WEBHOOK-STARTER-KIT-79
      target:
        description: "Discord target label configured by repository secret"
        required: true
        type: string
      approval:
        description: "Type APPROVED to authorize this external post"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: catalog-discord-acquisition
  cancel-in-progress: false

jobs:
  post:
    if: ${{ inputs.approval == 'APPROVED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          test -n "$DISCORD_WEBHOOK"
          case "$DISCORD_WEBHOOK" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*) ;;
            *) echo "Invalid Discord webhook host"; exit 1 ;;
          esac
          test -n "$TARGET"

      - name: Publish selected offer and verify
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          OFFER: ${{ inputs.offer }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          offers = {
            "CMD-DIAG-29": ("Commander Deck Diagnostic", "NZ$29", "https://buy.stripe.com/00wfZhaXP01neqHaIYdwc2R", "Send your Commander decklist and receive a practical first-pass diagnostic."),
            "DREAMLEDGER-BILLBOARD-50": ("DreamLedger Founding Billboard", "NZ$50", "https://buy.stripe.com/00w4gz6HzeWhcizeZedwc2w", "One permanent 100x100 billboard tile. Buyer supplies destination and creative; publication follows review."),
            "DREAMMEEZ-COSMIC-HOODIE-5": ("DreamMeez Cosmic Hoodie", "NZ$5", "https://buy.stripe.com/aFa14nd5XdSdeqH5oEdwc2J", "One-time DreamMeez identity cosmetic."),
            "DREAMMEEZ-CAPE-10": ("DreamMeez Cape", "NZ$10", "https://buy.stripe.com/cNi5kDaXP7tP0zR2csdwc2K", "One-time DreamMeez identity cosmetic."),
            "DREAMMEEZ-CHROME-BOOTS-9": ("DreamMeez Chrome Boots", "NZ$9", "https://buy.stripe.com/3cI5kDgi97tP3M37wMdwc2L", "One-time DreamMeez identity cosmetic."),
            "DREAMMEEZ-SPROUT-3.99-MONTHLY": ("DreamMeez Supporter - Sprout", "NZ$3.99/month", "https://buy.stripe.com/3cI5kDfe5cO9gyP5oEdwc2M", "Monthly supporter tier with supporter status and cosmetic access."),
            "DREAMMEEZ-GLOW-5.99-MONTHLY": ("DreamMeez Supporter - Glow", "NZ$5.99/month", "https://buy.stripe.com/5kQfZh5Dv9BXciz5oEdwc2N", "Monthly supporter tier with expanded cosmetic access."),
            "DREAMMEEZ-DEPTH-9.99-MONTHLY": ("DreamMeez Supporter - Depth", "NZ$9.99/month", "https://buy.stripe.com/8x2dR93vnaG1gyPg3idwc2O", "Premium monthly supporter tier with premium cosmetic access."),
            "KELP-FLOOR1-19": ("Kelplantis Floor 1 Access Pass", "NZ$19", "https://buy.stripe.com/aFa3cvea16pLbevbN2dwc2P", "Digital access to the Floor 1 vertical slice and persistent First Garden social hub."),
            "DISCORD-WEBHOOK-STARTER-KIT-79": ("Discord Webhook Starter Kit", "NZ$79", "https://buy.stripe.com/4gMcN56HzaG1dmDeZedwc1n", "Downloadable Stripe-to-Discord webhook starter kit.")
          }

          offer = os.environ["OFFER"]
          title, price, link, description = offers[offer]
          content = f"{title} - {price}\n\n{description}\n\n{link}"

          base = os.environ["DISCORD_WEBHOOK"]
          parts = urllib.parse.urlsplit(base)
          query = urllib.parse.parse_qsl(parts.query, keep_blank_values=True)
          query.append(("wait", "true"))
          post_url = urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path, urllib.parse.urlencode(query), parts.fragment))

          req = urllib.request.Request(post_url, data=json.dumps({"content": content}).encode(), headers={"Content-Type":"application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=20) as response:
              body = json.loads(response.read().decode())
          message_id, channel_id = body.get("id"), body.get("channel_id")
          if not message_id or not channel_id or link not in body.get("content",""):
              raise SystemExit("Publication response failed identity/content verification")

          verify_url = base.rstrip("/") + "/messages/" + urllib.parse.quote(str(message_id), safe="")
          with urllib.request.urlopen(urllib.request.Request(verify_url, headers={"Accept":"application/json"}), timeout=20) as response:
              verified = json.loads(response.read().decode())
          if verified.get("id") != message_id or verified.get("channel_id") != channel_id or link not in verified.get("content",""):
              raise SystemExit("Published message failed read-back verification")

          print("EXTERNAL_PUBLICATION=VERIFIED_DISCORD_MESSAGE")
          print("OFFER=" + offer)
          print("DISCORD_MESSAGE_ID=" + message_id)
          print("DISCORD_CHANNEL_ID=" + channel_id)
          print("EXTERNAL_REVENUE=UNVERIFIED")
          PY

      - name: State boundary
        env:
          OFFER: ${{ inputs.offer }}
        run: |
          echo "OFFER=$OFFER"
          echo "PUBLICATION=VERIFIED_RUNTIME"
          echo "BUYER=UNVERIFIED"
          echo "REVENUE=UNVERIFIED"
