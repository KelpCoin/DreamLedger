name: Carbon forward schema validation

on:
  workflow_dispatch:
  push:
    paths:
      - "webapp/observatory/carbon/carbon-forward-intent.v1.schema.json"
      - ".github/workflows/carbon-forward-schema.yml"

permissions:
  contents: read

concurrency:
  group: carbon-forward-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JSON syntax
        run: python -m json.tool webapp/observatory/carbon/carbon-forward-intent.v1.schema.json > /dev/null
      - name: Validate JSON Schema meta-schema
        run: |
          python -m pip install --disable-pip-version-check check-jsonschema
          check-jsonschema --check-metaschema webapp/observatory/carbon/carbon-forward-intent.v1.schema.json
