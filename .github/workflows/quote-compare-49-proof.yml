name: Quote Compare NZD49 reusable draft fulfilment test
on:
  pull_request:
    paths:
      - 'scripts/quote-compare-49-from-worksheet.mjs'
      - 'tests/quote-compare-49-from-worksheet.test.mjs'
      - 'tests/fixtures/quote-compare-49-worksheet.json'
      - '.github/workflows/quote-compare-49-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quote49:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify local worksheet-to-proof delivery drafts
        run: node --test tests/quote-compare-49-from-worksheet.test.mjs
