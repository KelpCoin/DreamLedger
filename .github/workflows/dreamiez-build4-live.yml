name: Dreamiez Build 4 Live Truth

on:
  push:
    branches: [main]
    paths:
      - 'BEC-PRIME/silos/SILO_DREAMIEZ/compiled/website/dreamiez-dashboard.html'
      - 'BEC-PRIME/compiled/website/dreamiez-dashboard.html'
      - 'BEC-PRIME/scripts/verify-dreamiez-fusion.js'
      - '.github/workflows/dreamiez-build4-live.yml'
  workflow_dispatch:

jobs:
  live-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Allow Render deployment to propagate
        run: sleep 90
      - name: Probe production fusion
        env:
          DREAMIEZ_FUSION_URL: https://dreamledger.org/dreamiez-dashboard.html
        run: node BEC-PRIME/scripts/verify-dreamiez-fusion.js
      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamiez-build4-fusion-proof
          path: BEC-PRIME/data/proofs/DREAMIEZ_BUILD4_FUSION_PROOF.json
