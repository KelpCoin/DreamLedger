name: Compounding Artifact Surface

on:
  workflow_run:
    workflows: ["777 Economic Search Loop"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: compounding-artifact-surface
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download completed 777 artifact
        uses: actions/download-artifact@v5
        with:
          name: dreamledger-777-${{ github.event.workflow_run.id }}
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Compounding Artifact
        run: node BEC-PRIME/scripts/update-compounding-artifact.js

      - name: Add public observatory link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          marker = '<a href="/economic-pulse.html">'
          if marker not in s:
              needle = '<strong>Defined output</strong><span>Receive a focused result instead of another software dashboard.</span></div>'
              replacement = needle + '<div class="proof-box"><strong>Compounding Artifact</strong><span><a href="/economic-pulse.html">See what the economic machine knows →</a></span></div>'
              if needle not in s:
                  raise SystemExit("Homepage proof section changed; refusing blind edit.")
              p.write_text(s.replace(needle, replacement, 1))
          PY

      - name: Update sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("sitemap.xml")
          s = p.read_text()
          url = "https://dreamledger.org/economic-pulse.html"
          if url not in s:
              s = s.replace("</urlset>", f"  <url><loc>{url}</loc></url>\n</urlset>")
              p.write_text(s)
          PY

      - name: Commit only if the public artifact changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dreamledger-compounding-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add economic-pulse.html index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "COMPOUNDING_ARTIFACT=UNCHANGED"
            exit 0
          fi
          git commit -m "chore: update compounding artifact surface"
          git push origin main
