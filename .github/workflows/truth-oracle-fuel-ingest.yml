name: Truth Oracle Fuel Ingest

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        location: [Auckland, Tauranga, Hamilton, Wellington, Christchurch, Dunedin]
    steps:
      - name: Ingest fuel observations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 3 -X POST \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            "$SUPABASE_URL/functions/v1/truth-oracle-fuel-ingest-v2" \
            --data "{\"name\":\"${{ matrix.location }}\"}"
