name: External Actuator Worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamledger-external-actuator
  cancel-in-progress: false

jobs:
  external-actuator:
    if: \${{ secrets.EXTERNAL_ACTUATOR_STORAGE_STATE_B64 != '' && secrets.EXTERNAL_ACTUATOR_TOKEN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run governed external actuator
        env:
          SUPABASE_URL: https://wbwgroygjeyukkspnqiy.supabase.co
          EXTERNAL_ACTUATOR_TOKEN: \${{ secrets.EXTERNAL_ACTUATOR_TOKEN }}
          EXTERNAL_ACTUATOR_STORAGE_STATE_B64: \${{ secrets.EXTERNAL_ACTUATOR_STORAGE_STATE_B64 }}
          ACTUATOR_ID: generic_external_action
          WORKER_ID: github-actions-external-actuator-\${{ github.run_id }}
          BROWSER_HEADLESS: 'true'
          MAX_JOBS: '1'
        run: node ops/external/external-actuator.mjs
