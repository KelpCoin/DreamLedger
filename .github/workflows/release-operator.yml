name: DreamLedger Release Operator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-operator.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Explicitly authorize one Vercel production deployment attempt
        required: true
        default: no
        type: choice
        options:
          - no
          - confirm
      wait_for_result:
        description: Wait for the deployment workflow and fail on its result
        required: true
        default: yes
        type: choice
        options:
          - yes
          - no

permissions:
  actions: write
  contents: read

concurrency:
  group: dreamledger-release-operator
  cancel-in-progress: false

env:
  RELEASE_AUTHORIZED: ${{ github.event_name == 'push' || inputs.deploy == 'confirm' }}
  WAIT_FOR_RESULT: ${{ github.event_name == 'push' || inputs.wait_for_result == 'yes' }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Refuse without explicit deployment authorization
        if: env.RELEASE_AUTHORIZED != 'true'
        run: |
          echo 'No deployment requested. Release operator stopped safely.'

      - name: Pin immutable release SHA
        if: env.RELEASE_AUTHORIZED == 'true'
        run: |
          set -euo pipefail
          test -n '${{ github.sha }}'
          echo 'RELEASE_SHA=${{ github.sha }}'

      - name: Dispatch canonical Vercel production workflow at exact release SHA
        if: env.RELEASE_AUTHORIZED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh workflow run vercel-static-deploy.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f release=confirm \
            -f release_sha="$RELEASE_SHA"
          echo 'DISPATCHED=vercel-static-deploy.yml'
          echo "RELEASE_SHA=$RELEASE_SHA"

      - name: Locate dispatched deployment run for exact SHA
        if: env.RELEASE_AUTHORIZED == 'true' && env.WAIT_FOR_RESULT == 'true'
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            run_id=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow vercel-static-deploy.yml --limit 20 --json databaseId,headSha,status --jq '.[] | select(.headSha == "'"$EXPECTED_SHA"'") | .databaseId' | head -1 || true)
            if [ -n "$run_id" ]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "FOUND_RUN=$run_id"
              exit 0
            fi
            sleep 3
          done
          echo "Could not locate dispatched Vercel workflow run for ${EXPECTED_SHA}."
          exit 1

      - name: Wait for deployment result
        if: env.RELEASE_AUTHORIZED == 'true' && env.WAIT_FOR_RESULT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch "${{ steps.locate.outputs.run_id }}" --repo "${GITHUB_REPOSITORY}" --exit-status
          echo 'VERCEL_DEPLOYMENT=PASS'

      - name: Dispatch MTG first-sale readiness gate after deployment
        if: env.RELEASE_AUTHORIZED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh workflow run mtg-first-sale-gate.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f release_sha="$RELEASE_SHA"
          echo 'DISPATCHED=mtg-first-sale-gate.yml'
          echo "RELEASE_SHA=$RELEASE_SHA"

      - name: Locate readiness gate run for exact SHA
        if: env.RELEASE_AUTHORIZED == 'true' && env.WAIT_FOR_RESULT == 'true'
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            run_id=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow mtg-first-sale-gate.yml --limit 20 --json databaseId,headSha,status --jq '.[] | select(.headSha == "'"$EXPECTED_SHA"'") | .databaseId' | head -1 || true)
            if [ -n "$run_id" ]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "FOUND_READINESS_RUN=$run_id"
              exit 0
            fi
            sleep 3
          done
          echo "Could not locate readiness gate run for ${EXPECTED_SHA}."
          exit 1

      - name: Wait for readiness gate
        if: env.RELEASE_AUTHORIZED == 'true' && env.WAIT_FOR_RESULT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch "${{ steps.readiness.outputs.run_id }}" --repo "${GITHUB_REPOSITORY}" --exit-status
          echo 'READINESS_GATE=PASS'

      - name: Emit operator proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          printf '{"schema":"dreamledger-release-operator-v6","sha":"%s","event":"%s","deployment_authorized":%s,"wait_for_result":%s,"deployment_before_readiness":true,"immutable_sha_dispatch":true,"status":"operator_complete"}\n' "${GITHUB_SHA}" "${GITHUB_EVENT_NAME}" "$([ "${RELEASE_AUTHORIZED}" = "true" ] && echo true || echo false)" "$([ "${WAIT_FOR_RESULT}" = "true" ] && echo true || echo false)" > proof/release-operator-proof.json
          cat proof/release-operator-proof.json

      - name: Upload operator proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-operator-proof-${{ github.run_id }}
          path: proof/release-operator-proof.json
          if-no-files-found: error
          retention-days: 30
