name: DreamLedger Release Operator

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Immutable release SHA to deploy
        required: true
        type: string
      deploy:
        description: Explicitly authorize production deployment
        required: true
        default: no
        type: choice
        options: [no, confirm]
      wait_for_result:
        description: Wait for Render deployment verification
        required: true
        default: yes
        type: choice
        options: [yes, no]

permissions:
  actions: write
  contents: read

concurrency:
  group: dreamledger-release-operator
  cancel-in-progress: false

jobs:
  release:
    if: inputs.deploy == 'confirm'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Validate immutable release SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_SHA" = "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git "$RELEASE_SHA" | cut -f1)"
          echo "RELEASE_SHA=$RELEASE_SHA"

      - name: Dispatch Render deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          gh workflow run render-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f release_sha="$RELEASE_SHA"
          echo "DISPATCHED=render-deploy.yml"

      - name: Locate Render workflow run
        if: inputs.wait_for_result == 'yes'
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow render-deploy.yml --event workflow_dispatch --limit 30 --json databaseId,headSha,createdAt --jq 'sort_by(.createdAt) | reverse | .[] | select(.headSha == "'"$RELEASE_SHA"'") | .databaseId' | head -1 || true)
            if [ -n "$run_id" ]; then echo "run_id=$run_id" >> "$GITHUB_OUTPUT"; echo "RENDER_RUN=$run_id"; exit 0; fi
            sleep 3
          done
          echo 'FAIL: Render workflow run not found'
          exit 1

      - name: Wait for Render workflow
        if: inputs.wait_for_result == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch "${{ steps.locate.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Operator fossil
        if: always()
        run: |
          mkdir -p proof
          printf '{"schema":"dreamledger-release-operator-v9","release_sha":"%s","deploy_authorized":true,"wait_for_result":"%s","render_workflow":"render-deploy.yml"}\n' '${{ inputs.release_sha }}' '${{ inputs.wait_for_result }}' > proof/release-operator-proof.json

      - name: Upload operator fossil
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-operator-proof-${{ github.run_id }}
          path: proof/release-operator-proof.json
          if-no-files-found: error
          retention-days: 30
