name: MTG Master Silo Safety Gate
on:
  pull_request:
    paths:
      - 'public/mtg/**'
      - 'mtg/index.html'
      - 'BEC-PRIME/website/mtg-catalog.html'
      - 'public/data/mtg-catalog.json'
      - 'public/catalog.json'
      - 'scripts/verify-mtg-master.cjs'\n      - 'scripts/verify-beck-release-gates.cjs'
      - '.github/workflows/mtg-master-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fail-closed storefront and produce proof
        run: node scripts/verify-mtg-master.cjs > mtg-master-proof.json
      - name: Verify Phase 1 and Phase 2 evidence (fail closed)\n        run: node scripts/verify-beck-release-gates.cjs\n      - name: Publish release-gate evidence\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: beck-release-gate-proof\n          path: beck-gate-proof.json\n      - name: Publish evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtg-master-proof
          path: mtg-master-proof.json
