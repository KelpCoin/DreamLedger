name: BECK PRIME Autonomous Policy Gate

on:
  push:
    branches:
      - beckprime-autonomy-v1
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node BEC-PRIME/scripts/Verify-AutonomousPolicyV1.js
      - run: node BEC-PRIME/scripts/verify-public-surface.js
