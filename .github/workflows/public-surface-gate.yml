name: DreamLedger Public Surface Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify New Zealand consumer terms
        run: node BEC-PRIME/scripts/test-consumer-terms-policy.js
      - name: Compile and synchronize canonical public surface
        working-directory: BEC-PRIME
        env:
          DREAMLEDGER_SAFE_HOLD_BUILD: 'true'
        run: npm ci --no-audit --no-fund && npm run compile && node ../public/Sync-BECPrimeStorefront.js
      - name: Verify public surface
        run: node BEC-PRIME/scripts/verify-public-surface.js
      - name: Upload public surface proof
        uses: actions/upload-artifact@v4
        with:
          name: public-surface-proof
          path: BEC-PRIME/data/proofs/PUBLIC-SURFACE-PROOF.json
          if-no-files-found: error
