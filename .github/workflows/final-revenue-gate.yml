name: Final Revenue Gate

on:
  pull_request:
    branches: [main]

jobs:
  final-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Final Revenue Gate
        shell: pwsh
        run: .\BEC-PRIME\scripts\Invoke-FinalRevenueGate.ps1 -RepoPath .
