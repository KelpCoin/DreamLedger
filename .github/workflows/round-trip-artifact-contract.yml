name: Round-trip compounding artifact contract

on:
  push:
    branches: [main]
    paths:
      - "scripts/verify_round_trip_artifact.py"
      - "tests/test_round_trip_artifact_contract.py"
      - ".github/workflows/round-trip-artifact-contract.yml"
  pull_request:
    paths:
      - "scripts/verify_round_trip_artifact.py"
      - "tests/test_round_trip_artifact_contract.py"
      - ".github/workflows/round-trip-artifact-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-receipt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile verifier and tests
        run: python -m py_compile scripts/verify_round_trip_artifact.py tests/test_round_trip_artifact_contract.py
      - name: Run contract tests
        run: python -m unittest tests.test_round_trip_artifact_contract -v
