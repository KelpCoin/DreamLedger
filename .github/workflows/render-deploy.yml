name: Verify DreamLedger production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  acceptance-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: BEC-PRIME
        run: npm install
      - name: Compile canonical commerce surface
        working-directory: BEC-PRIME
        run: npm run compile
      - name: Account contract gate
        working-directory: BEC-PRIME
        run: node scripts/verify-account-avatar-flow.js
      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          node --check BEC-PRIME/server.js
          node --check BEC-PRIME/start.js
          node --check BEC-PRIME/lib/authRuntimePreload.js
          node --check BEC-PRIME/routes/auth.js
          node --check BEC-PRIME/routes/dreamiez.js
          node --check BEC-PRIME/scripts/smoke-dreamiez.js
          node --check BEC-PRIME/scripts/smoke-front-door.js
          node --check BEC-PRIME/scripts/smoke-production.js
      - name: Dreamiez E2E smoke
        working-directory: BEC-PRIME
        run: npm run smoke:dreamiez
      - name: Account and marketplace front door smoke
        working-directory: BEC-PRIME
        run: npm run smoke:front-door

  production-login-smoke:
    needs: acceptance-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: BEC-PRIME
        run: npm install
      - name: Verify live production login and session round-trip
        working-directory: BEC-PRIME
        env:
          SMOKE_BASE_URL: https://dreamledger.org
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            echo "LIVE LOGIN PROOF attempt $i/60"
            if npm run smoke:production; then exit 0; fi
            sleep 10
          done
          echo "FAIL: live production login/session proof did not pass within 10 minutes."
          exit 1
      - name: Verify canonical login HTML
        env:
          BASE_URL: https://dreamledger.org
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BASE_URL/login.html" | grep -q '/api/dreamiez/account/login'
          curl --fail --silent --show-error "$BASE_URL/login.html" | grep -q '/api/dreamiez/me'
          curl --fail --silent --show-error "$BASE_URL/register.html" >/dev/null
          curl --fail --silent --show-error "$BASE_URL/account.html" >/dev/null
          echo "PASS: live DreamLedger login/register/account surfaces are reachable."
