name: Deploy and Verify DreamLedger Production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Immutable commit SHA to deploy and verify
        required: true
        type: string
  push:
    branches: [main]

concurrency:
  group: dreamledger-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
      BASE_URL: https://dreamledger.org
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Checkout immutable release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Prove checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          echo "RELEASE_SHA=$RELEASE_SHA"

      - name: Verify public storefront artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/server.js
          grep -q 'DreamLedger' public/index.html
          grep -q 'FIND SOMETHING' public/index.html
          grep -q 'Commander Deck Diagnostic' public/index.html
          grep -q 'DreamMee' public/index.html
          ! grep -Eiq 'Gauntlet|Economic Court|Truth Oracle|ELOHIM|BrownEye Cortex|BEC-PRIME|AMPLISSA|COLLECTORSCOAST|HappyHomarid|STRIPE_SECRET|SUPABASE_SERVICE_ROLE' public/index.html
          echo 'PUBLIC_STOREFRONT_ARTIFACT=PASS'

      - name: Verify canonical commercial offer
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'OFFER-CMD-DIAG-29-NZD' BEC-PRIME/catalog/offers/approved.json
          grep -q 'COMMANDER-DECK-DIAGNOSTIC-001' BEC-PRIME/catalog/offers/approved.json
          grep -q '"price":29' BEC-PRIME/catalog/offers/approved.json
          grep -q 'ACTIVE_LIVEMODE' BEC-PRIME/catalog/offers/approved.json
          echo 'CANONICAL_OFFER=PASS'

      - name: Trigger exact Render deployment
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            case "$RENDER_DEPLOY_HOOK_URL" in
              *?*) SEP='&' ;;
              *) SEP='?' ;;
            esac
            curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 --max-time 60               -X POST "${RENDER_DEPLOY_HOOK_URL}${SEP}ref=${RELEASE_SHA}" >/tmp/render.json
            cat /tmp/render.json
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            curl --fail --silent --show-error -L               https://github.com/render-oss/cli/releases/download/v2.22.0/cli_2.22.0_linux_amd64.zip               -o /tmp/render.zip
            unzip -q /tmp/render.zip -d /tmp/render
            RENDER_BIN=$(find /tmp/render -type f -name render -perm -111 | head -1)
            test -n "$RENDER_BIN"
            RENDER_API_KEY="$RENDER_API_KEY" "$RENDER_BIN" deploys create "$RENDER_SERVICE_ID" --commit "$RELEASE_SHA" --wait --confirm --output json | tee /tmp/render.json
          else
            echo 'FAIL: missing Render deployment credentials'
            exit 1
          fi

      - name: Verify production convergence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 20 "$BASE_URL/version" >/tmp/version.json && grep -q "$RELEASE_SHA" /tmp/version.json; then
              echo 'PRODUCTION_SHA=PASS'
              break
            fi
            if [ "$attempt" = 24 ]; then
              echo 'FAIL: production SHA did not converge'
              cat /tmp/version.json 2>/dev/null || true
              exit 1
            fi
            sleep 10
          done

      - name: Verify public routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /billboard /mtg /avatar /healthz /version /api/products; do
            code=$(curl --silent --show-error --output /tmp/body --write-out '%{http_code}' --max-time 20 "$BASE_URL$path")
            echo "$code $path"
            test "$code" = 200
          done
          curl --fail --silent --show-error "$BASE_URL/" >/tmp/home.html
          grep -q 'FIND SOMETHING' /tmp/home.html
          grep -q 'DreamMee' /tmp/home.html
          grep -q 'Commander Deck Diagnostic' /tmp/home.html
          ! grep -Eiq 'Gauntlet|Economic Court|Truth Oracle|ELOHIM|BrownEye Cortex|BEC-PRIME|AMPLISSA|COLLECTORSCOAST|HappyHomarid' /tmp/home.html
          echo 'PUBLIC_SURFACE=PASS'

      - name: Verify checkout contract without purchase
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS --fail-with-body --retry 3 --retry-delay 2 --max-time 20             -X POST "$BASE_URL/api/offer-checkout/create"             -H 'Content-Type: application/json'             --data '{"offer_id":"OFFER-CMD-DIAG-29-NZD"}')
          python3 - <<'PY' "$response"
          import json, sys
          data = json.loads(sys.argv[1])
          url = str(data.get('url', data.get('checkout_url', '')))
          sku = str(data.get('product_id', ''))
          amount = data.get('amount_nzd')
          if not url.startswith('https://') or 'stripe.com' not in url:
              raise SystemExit('CHECKOUT_URL=FAIL')
          if sku != 'COMMANDER-DECK-DIAGNOSTIC-001':
              raise SystemExit('CHECKOUT_SKU=FAIL')
          if amount != 29:
              raise SystemExit(f'CHECKOUT_AMOUNT=FAIL:{amount}')
          print('CHECKOUT_URL=PASS')
          print('CHECKOUT_SKU=PASS')
          print('CHECKOUT_AMOUNT_NZD_29=PASS')
          print('PURCHASE_EXECUTED=FALSE')
          PY

      - name: Write deployment proof
        if: always()
        shell: bash
        env:
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 - <<'PY'
          import hashlib, json, os, time
          p = {'schema':'dreamledger-production-deployment-v3','source_sha':os.environ['RELEASE_SHA'],'base_url':os.environ['BASE_URL'],'timestamp_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'storefront':'public-v5','payment_execution':False,'ra_000001':False}
          raw = json.dumps(p, sort_keys=True, indent=2).encode()
          p['sha256'] = hashlib.sha256(raw).hexdigest()
          with open('proof/dreamledger-production-proof.json','w',encoding='utf-8') as f: json.dump(p,f,indent=2)
          print(json.dumps(p,indent=2))
          PY

      - name: Upload deployment proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-production-proof-${{ env.RELEASE_SHA }}
          path: proof/dreamledger-production-proof.json
          if-no-files-found: error
          retention-days: 30
