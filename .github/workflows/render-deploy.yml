name: Deploy DreamLedger to Render

on:
  workflow_run:
    workflows: ["BEC-PRIME Auto Compile DreamLedger"]
    types: [completed]
  workflow_dispatch:

jobs:
  acceptance-gate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: BEC-PRIME
        run: npm install
      - name: Compile canonical commerce surface
        working-directory: BEC-PRIME
        run: npm run compile
      - name: Compiler truth gate
        shell: pwsh
        run: ./BEC-PRIME/scripts/Verify-CompilerTruth.ps1 -ProofPath "$env:GITHUB_WORKSPACE/compiler-truth-proof.json"
      - name: Public boundary gate
        working-directory: BEC-PRIME
        run: node scripts/verify-public-surface.js
      - name: Syntax gate
        working-directory: BEC-PRIME
        run: |
          node --check server.js
          node --check start.js
          node --check dreamiez-account.js
          node --check compiler/OfferCompiler.js
          node --check compiler/SurfaceCompiler.js
          node --check compiler/PriceDisplayPatch.js
          node --check compiler/PublicSurfaceContractPatch.js
          node --check scripts/smoke-dreamiez.js
          node --check scripts/smoke-revenue-ledger.js
          node --check scripts/smoke-production.js
          node --check scripts/meta-gauntlet.js
          node --check gauntlet/GauntletV6.js
          node --check elohim/ElohimV6.js
          node --check proxy/DigitalProxy.js
          node --check proxy/DigitalProxyAssistant.js
          node --check runtime/ControlPlane.js
          node --check runtime/DemandRadar.js
          node --check runtime/Sentinel.js
      - name: Enterprise meta-gauntlet
        working-directory: BEC-PRIME
        run: node scripts/meta-gauntlet.js
      - name: Revenue ledger smoke
        working-directory: BEC-PRIME
        run: npm run smoke:revenue-ledger
      - name: Dreamiez E2E smoke
        working-directory: BEC-PRIME
        run: npm run smoke:dreamiez
      - name: Upload acceptance fossil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-acceptance-${{ github.run_id }}
          path: |
            BEC-PRIME/PROOF-META-GAUNTLET.json
            BEC-PRIME/PROOF-PUBLIC-SURFACE-CONTRACT-PATCH.json
            BEC-PRIME/data/proofs/SENTINEL-LATEST.json
            BEC-PRIME/data/proofs/PUBLIC-SURFACE-PROOF.json
            compiler-truth-proof.json
          if-no-files-found: error

  deploy:
    needs: acceptance-gate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured; relying on Render Blueprint auto-deploy."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy hook triggered after acceptance gate PASS."

  production-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies for live gate
        working-directory: BEC-PRIME
        run: npm install
      - name: Wait for Render deployment and test real public surface
        working-directory: BEC-PRIME
        env:
          SMOKE_BASE_URL: https://dreamledger.org
        run: |
          for i in $(seq 1 12); do
            echo "Production smoke attempt $i/12"
            if npm run smoke:production; then
              break
            fi
            if [ "$i" = "12" ]; then
              echo "PRODUCTION SMOKE FAILED: dreamledger.org is not serving the current DreamLedger commerce runtime."
              exit 1
            fi
            sleep 10
          done
      - name: LIVE OFFER REGISTRY REALITY GATE
        env:
          BASE_URL: https://dreamledger.org
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error "$BASE_URL/api/offers")
          echo "$body"
          node - <<'NODE'
          const body=process.env.BODY;
          NODE
          echo "$body" > live-offers.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('live-offers.json','utf8'));
          const offers=Array.isArray(x)?x:(x.offers||x.data||[]);
          const hit=offers.find(o=>o.offer_id==='OFFER-BEC-PRIME-ARCHITECTURE-AUDIT' || o.product_id==='BEC-PRIME-ARCHITECTURE-AUDIT-001' || o.sku==='BEC-PRIME-ARCHITECTURE-AUDIT-001' || o.id==='BEC-PRIME-ARCHITECTURE-AUDIT-001');
          if(!hit) throw new Error('FAIL: canonical BEC-PRIME architecture audit is not publicly exposed.');
          if(Number(hit.price)!==49 || String(hit.currency||'').toUpperCase()!=='NZD') throw new Error('FAIL: canonical BEC-PRIME architecture audit is not NZD 49.');
          if(hit.checkout_available!==true) throw new Error('FAIL: canonical BEC-PRIME architecture audit is not checkout-enabled.');
          if(offers.some(o=>o.offer_id==='AGENTIC-COMMERCE-READINESS-001' || o.product_id==='AGENTIC-COMMERCE-READINESS-001' || o.sku==='AGENTIC-COMMERCE-READINESS-001' || o.id==='AGENTIC-COMMERCE-READINESS-001')) throw new Error('FAIL: stale AGENTIC-COMMERCE-READINESS-001 is still publicly exposed.');
          if(offers.some(o=>o.offer_id==='SMALL-BUSINESS-AI-COMMERCE-KIT-001' || o.product_id==='SMALL-BUSINESS-AI-COMMERCE-KIT-001' || o.sku==='SMALL-BUSINESS-AI-COMMERCE-KIT-001' || o.id==='SMALL-BUSINESS-AI-COMMERCE-KIT-001')) throw new Error('FAIL: removed placeholder AI product is still publicly exposed.');
          console.log('PASS: canonical BEC-PRIME first-sale offer is publicly exposed and stale placeholder offers are absent.');
          NODE
      - name: LIVE STRIPE CHECKOUT REALITY GATE
        env:
          BASE_URL: https://dreamledger.org
        run: |
          response=$(curl --fail --silent --show-error --request POST "$BASE_URL/api/offer-checkout/create" -H 'Content-Type: application/json' --data '{"offer_id":"OFFER-BEC-PRIME-ARCHITECTURE-AUDIT"}')
          echo "$response"
          node -e "const r=JSON.parse(process.argv[1]); if(typeof r.url !== 'string' || !r.url.startsWith('https://checkout.stripe.com/')) { console.error('FAIL: checkout endpoint did not return a Stripe Checkout URL'); process.exit(1); } console.log('PASS: live Stripe Checkout URL returned')" "$response"
