name: Deploy DreamLedger to Render

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["BEC-PRIME Auto Compile DreamLedger"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: dreamledger-production-deploy
  cancel-in-progress: false

jobs:
  acceptance-gate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: BEC-PRIME
        run: npm install
      - name: Compile canonical commerce surface
        working-directory: BEC-PRIME
        run: npm run compile
      - name: Compiler truth gate
        shell: pwsh
        run: ./BEC-PRIME/scripts/Verify-CompilerTruth.ps1 -ProofPath "$env:GITHUB_WORKSPACE/compiler-truth-proof.json"
      - name: Public boundary gate
        working-directory: BEC-PRIME
        run: node scripts/verify-public-surface.js
      - name: Account contract gate
        working-directory: BEC-PRIME
        run: node scripts/verify-account-avatar-flow.js
      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          node --check BEC-PRIME/server.js
          node --check BEC-PRIME/start.js
          node --check BEC-PRIME/routes/conversations.js
          node --check BEC-PRIME/routes/dreamiez.js
          node --check BEC-PRIME/routes/frontDoor.js
          node --check BEC-PRIME/routes/accountRecovery.js
          node --check BEC-PRIME/routes/marketplaceWebhook.js
          node --check BEC-PRIME/compiler/OfferCompiler.js
          node --check BEC-PRIME/compiler/SurfaceCompiler.js
          node --check BEC-PRIME/compiler/PriceDisplayPatch.js
          node --check BEC-PRIME/compiler/PublicSurfaceContractPatch.js
          node --check BEC-PRIME/scripts/smoke-dreamiez.js
          node --check BEC-PRIME/scripts/smoke-front-door.js
          node --check BEC-PRIME/scripts/smoke-revenue-ledger.js
          node --check BEC-PRIME/scripts/smoke-production.js
          node --check BEC-PRIME/scripts/smoke-persistent-chat.js
          node --check BEC-PRIME/scripts/meta-gauntlet.js
          node --check BEC-PRIME/gauntlet/GauntletV6.js
          node --check BEC-PRIME/elohim/ElohimV6.js
          node --check BEC-PRIME/proxy/DigitalProxy.js
          node --check BEC-PRIME/proxy/DigitalProxyAssistant.js
          node --check BEC-PRIME/runtime/ControlPlane.js
          node --check BEC-PRIME/runtime/DemandRadar.js
          node --check BEC-PRIME/runtime/Sentinel.js
      - name: Enterprise meta-gauntlet
        working-directory: BEC-PRIME
        run: node scripts/meta-gauntlet.js
      - name: Revenue ledger smoke
        working-directory: BEC-PRIME
        run: npm run smoke:revenue-ledger
      - name: Dreamiez E2E smoke
        working-directory: BEC-PRIME
        run: npm run smoke:dreamiez
      - name: Account and marketplace front door smoke
        working-directory: BEC-PRIME
        run: npm run smoke:front-door
      - name: Upload acceptance fossil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-acceptance-${{ github.run_id }}
          path: |
            BEC-PRIME/PROOF-META-GAUNTLET.json
            BEC-PRIME/PROOF-PUBLIC-SURFACE-CONTRACT-PATCH.json
            BEC-PRIME/data/proofs/SENTINEL-LATEST.json
            BEC-PRIME/data/proofs/PUBLIC-SURFACE-PROOF.json
            BEC-PRIME/data/proofs/ACCOUNT-AVATAR-CONTRACT-PROOF.json
            compiler-truth-proof.json
          if-no-files-found: error

  deploy:
    needs: acceptance-gate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured; relying on Render Blueprint auto-deploy."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy hook triggered after acceptance gate PASS."

  production-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies for live gate
        working-directory: BEC-PRIME
        run: npm install
      - name: Wait for Render deployment and test real public surface
        working-directory: BEC-PRIME
        env:
          SMOKE_BASE_URL: https://dreamledger.org
        run: |
          for i in $(seq 1 30); do
            echo "Production smoke attempt $i/30"
            if npm run smoke:production; then exit 0; fi
            sleep 10
          done
          echo "PRODUCTION SMOKE FAILED: dreamledger.org did not converge within 5 minutes."
          exit 1
      - name: LIVE ACCOUNT MARKETPLACE AND CHAT REALITY GATE
        working-directory: BEC-PRIME
        env:
          BASE_URL: https://dreamledger.org
          SMOKE_BASE_URL: https://dreamledger.org
          PROOF_PATH: PROOF-PERSISTENT-CHAT.json
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BASE_URL/login.html" >/dev/null
          curl --fail --silent --show-error "$BASE_URL/register.html" >/dev/null
          curl --fail --silent --show-error "$BASE_URL/account.html" >/dev/null
          curl --fail --silent --show-error "$BASE_URL/chat" >/dev/null
          npm run smoke:persistent-chat
          curl --fail --silent --show-error "$BASE_URL/api/marketplace/listings" > live-marketplace.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('live-marketplace.json','utf8'));
          if(!Array.isArray(x.items)) throw new Error('FAIL: marketplace listing endpoint did not return items.');
          for(const item of x.items){
            if(item.status!=='APPROVED') throw new Error('FAIL: non-approved listing reached public marketplace.');
            if(item.checkout_available!==true) throw new Error('FAIL: public approved listing is not checkout-enabled.');
            if(item.car && Object.prototype.hasOwnProperty.call(item.car,'vin_private')) throw new Error('FAIL: private VIN leaked into public listing.');
          }
          console.log('PASS: account pages, marketplace and persistent chat are live.');
          NODE
      - name: Upload production proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-production-proof-${{ github.run_id }}
          path: |
            BEC-PRIME/PROOF-PERSISTENT-CHAT.json
            BEC-PRIME/live-marketplace.json
          if-no-files-found: warn
