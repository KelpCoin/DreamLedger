name: Deploy and Verify DreamLedger Commercial Surfaces

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Immutable commit SHA to deploy and verify
        required: true
        type: string
  push:
    branches: [main]

concurrency:
  group: dreamledger-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
      BASE_URL: https://dreamledger.org
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Checkout immutable release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Prove checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Verify canonical commercial package
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/billboard.html
          test -s public/mtg.html
          test -s public/server.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          def load(p): return json.loads(Path(p).read_text())
          approved=load('BEC-PRIME/catalog/offers/approved.json')['approved']
          b=next(x for x in approved if x['offer_id']=='OFFER-DREAMLEDGER-BILLBOARD-FOUNDING-001')
          bp=load('BEC-PRIME/catalog/products/DREAMLEDGER-BILLBOARD-FOUNDING-001.json')
          c=load('BEC-PRIME/distribution/campaigns/D-001.json')
          assert b['product_id']=='DREAMLEDGER-BILLBOARD-FOUNDING-001'
          assert b['price']==50 and b['currency']=='NZD'
          assert b['payment_link_status']=='ACTIVE_LIVEMODE'
          assert b['payment_link_url']=='https://buy.stripe.com/dRmbJ2cZi9eW4mk9La9oc02'
          assert bp['price']==5000 and bp['currency']=='nzd'
          assert bp['commercial_truth']['payment_link']==b['payment_link_url']
          assert c['offer']['offer_id']=='DREAMLEDGER-BILLBOARD-FOUNDING-001'
          assert c['objective']['metric']=='PAYMENT_RECEIVED' and c['objective']['target']==1
          mtg=[
            ('EDH_0001',400),
            ('BESPOKE-ARTISAN-EDH-DECK-001',385),
            ('MTG-URZAS-LEGACY-PALINCHRON-FOIL-001',700)
          ]
          for pid,expected in mtg:
              p=load('BEC-PRIME/catalog/products/'+pid+'.json')
              assert p['silo']=='mtg' and p['inventory_type']=='physical'
              assert p['status']=='published' and int(p.get('inventory',0))>0
              assert p.get('commercial_truth',{}).get('approval_required') is False
              unit=p.get('price_unit')
              major=(int(p['price'])/100) if unit=='minor' else (int(p['price'])/100)
              assert round(major,2)==expected
              print('MTG_CATALOG_OK='+pid+' NZ$'+str(expected))
          print('COMMERCIAL_PACKAGE=PASS')
          PY
          grep -q 'NZ$50' public/billboard.html
          grep -q 'EDH_0001' public/mtg.html

      - name: Trigger exact Render deployment
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            case "$RENDER_DEPLOY_HOOK_URL" in
              *?*) SEP='&' ;;
              *) SEP='?' ;;
            esac
            curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 --max-time 60               -X POST "${RENDER_DEPLOY_HOOK_URL}${SEP}ref=${RELEASE_SHA}" >/tmp/render.json
            cat /tmp/render.json
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            curl --fail --silent --show-error -L               https://github.com/render-oss/cli/releases/download/v2.22.0/cli_2.22.0_linux_amd64.zip -o /tmp/render.zip
            unzip -q /tmp/render.zip -d /tmp/render
            RENDER_BIN=$(find /tmp/render -type f -name render -perm -111 | head -1)
            test -n "$RENDER_BIN"
            RENDER_API_KEY="$RENDER_API_KEY" "$RENDER_BIN" deploys create "$RENDER_SERVICE_ID" --commit "$RELEASE_SHA" --wait --confirm --output json | tee /tmp/render.json
          else
            echo 'FAIL: missing Render deployment credentials'
            exit 1
          fi

      - name: Verify production convergence and selling doorways
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 20 "$BASE_URL/version" >/tmp/version.json && grep -q "$RELEASE_SHA" /tmp/version.json; then break; fi
            if [ "$attempt" = 18 ]; then exit 1; fi
            sleep 10
          done
          for path in / /billboard /mtg /avatar /healthz /version; do
            code=$(curl --silent --show-error --output /tmp/body --write-out '%{http_code}' --max-time 20 "$BASE_URL$path")
            echo "$code $path"
            test "$code" = 200
          done
          curl --fail --silent --show-error "$BASE_URL/billboard" >/tmp/billboard.html
          grep -q 'NZ$50' /tmp/billboard.html
          grep -q '100 x 100' /tmp/billboard.html
          curl --fail --silent --show-error "$BASE_URL/mtg" >/tmp/mtg.html
          grep -q 'EDH_0001' /tmp/mtg.html
          grep -q 'NZ$400' /tmp/mtg.html
          curl --fail --silent --show-error "$BASE_URL/api/products" >/tmp/products.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/products.json'))
          rows=d if isinstance(d,list) else d.get('products',d.get('records',d.get('items',[])))
          by={str(x.get('id')):x for x in rows if isinstance(x,dict)}
          for pid in ['EDH_0001','BESPOKE-ARTISAN-EDH-DECK-001','MTG-URZAS-LEGACY-PALINCHRON-FOIL-001']:
              assert pid in by, 'missing '+pid
              assert str(by[pid].get('silo','')).lower()=='mtg'
              assert str(by[pid].get('status','')).lower()=='published'
              assert int(by[pid].get('inventory',0))>0
              print('LIVE_MTG_PRODUCT='+pid)
          PY
          curl --fail --silent --show-error "$BASE_URL/healthz" >/tmp/healthz.txt
          grep -q '^ok$' /tmp/healthz.txt
          python3 - <<'PY'
          import json, urllib.request
          p=json.load(open('BEC-PRIME/catalog/offers/approved.json'))
          o=next(x for x in p['approved'] if x['offer_id']=='OFFER-DREAMLEDGER-BILLBOARD-FOUNDING-001')
          r=urllib.request.urlopen(o['payment_link_url'],timeout=20)
          assert r.status==200
          print('BILLBOARD_CHECKOUT_HTTP='+str(r.status))
          PY
          echo 'PRODUCTION_COMMERCIAL_SURFACES=PASS'

      - name: Emit deployment proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 - <<'PY'
          import json,os,time
          p={'schema':'dreamledger-commercial-deployment-v3','source_sha':os.environ['RELEASE_SHA'],'base_url':os.environ['BASE_URL'],'timestamp_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'surfaces':['billboard','mtg','avatar'],'physical_mtg':['EDH_0001','BESPOKE-ARTISAN-EDH-DECK-001','MTG-URZAS-LEGACY-PALINCHRON-FOIL-001'],'payment_claim_made':False}
          with open('proof/commercial-deployment-fossil.json','w') as f: json.dump(p,f,indent=2)
          PY
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dreamledger-commercial-proof-${{ env.RELEASE_SHA }}
          path: proof/commercial-deployment-fossil.json
          if-no-files-found: error
          retention-days: 30
