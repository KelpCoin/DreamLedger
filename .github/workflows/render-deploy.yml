name: Deploy DreamLedger to Render

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["BEC-PRIME Auto Compile DreamLedger"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: dreamledger-production-deploy
  cancel-in-progress: false

jobs:
  acceptance-gate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: BEC-PRIME
        run: npm install
      - name: Compile canonical commerce surface
        working-directory: BEC-PRIME
        run: npm run compile
      - name: Account contract gate
        working-directory: BEC-PRIME
        run: node scripts/verify-account-avatar-flow.js
      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          node --check BEC-PRIME/server.js
          node --check BEC-PRIME/start.js
          node --check BEC-PRIME/lib/authRuntimePreload.js
          node --check BEC-PRIME/routes/auth.js
          node --check BEC-PRIME/scripts/smoke-dreamiez.js
          node --check BEC-PRIME/scripts/smoke-front-door.js
      - name: Dreamiez E2E smoke
        working-directory: BEC-PRIME
        run: npm run smoke:dreamiez
      - name: Account and marketplace front door smoke
        working-directory: BEC-PRIME
        run: npm run smoke:front-door

  deploy:
    needs: acceptance-gate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy when a hook is configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK_URL is not configured. Refusing to claim deployment."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo "PASS: Render deploy hook triggered after acceptance gate."

  production-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: BEC-PRIME
        run: npm install
      - name: Wait for production and test auth
        working-directory: BEC-PRIME
        env:
          SMOKE_BASE_URL: https://dreamledger.org
        run: |
          for i in $(seq 1 60); do
            echo "Production auth smoke attempt $i/60"
            if npm run smoke:production; then exit 0; fi
            sleep 10
          done
          echo "FAIL: production did not converge within 10 minutes."
          exit 1
      - name: Verify account pages are live
        env:
          BASE_URL: https://dreamledger.org
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BASE_URL/login.html" >/dev/null
          curl --fail --silent --show-error "$BASE_URL/register.html" >/dev/null
          curl --fail --silent --show-error "$BASE_URL/account.html" >/dev/null
          echo "PASS: production account pages are live."
