name: Deploy and Verify DreamLedger Billboard

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Immutable commit SHA to deploy and verify
        required: true
        type: string
  push:
    branches: [main]

concurrency:
  group: dreamledger-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
      BASE_URL: https://dreamledger.org
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Checkout immutable release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Prove checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          echo "RELEASE_SHA=$RELEASE_SHA"

      - name: Verify canonical DreamLedger commercial package
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/billboard.html
          test -s public/server.js
          test -s public/package.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          approved=json.loads(Path('BEC-PRIME/catalog/offers/approved.json').read_text())['approved']
          offer=next(x for x in approved if x['offer_id']=='OFFER-DREAMLEDGER-BILLBOARD-FOUNDING-001')
          product=json.loads(Path('BEC-PRIME/catalog/products/DREAMLEDGER-BILLBOARD-FOUNDING-001.json').read_text())
          campaign=json.loads(Path('BEC-PRIME/distribution/campaigns/D-001.json').read_text())
          assert offer['product_id']=='DREAMLEDGER-BILLBOARD-FOUNDING-001'
          assert offer['price']==50 and offer['currency']=='NZD'
          assert offer['payment_link_status']=='ACTIVE_LIVEMODE'
          assert offer['payment_link_url']=='https://buy.stripe.com/00w9ATaXP3dzaar9EUdwc2r'
          assert product['price']==50 and product['currency']=='nzd'
          assert product['commercial_truth']['payment_link']==offer['payment_link_url']
          assert campaign['offer']['offer_id']=='DREAMLEDGER-BILLBOARD-FOUNDING-001'
          assert campaign['offer']['price_nzd']==50
          assert campaign['objective']['metric']=='PAYMENT_RECEIVED'
          assert campaign['objective']['target']==1
          print('CANONICAL_OFFER=DREAMLEDGER-BILLBOARD-FOUNDING-001')
          print('CANONICAL_PRICE_NZD=50')
          print('CANONICAL_CHECKOUT='+offer['payment_link_url'])
          PY
          grep -q 'NZ$50' public/billboard.html
          grep -q 'POST' public/server.js
          grep -q 'billboard' public/server.js
          echo 'COMMERCIAL_PACKAGE=PASS'

      - name: Trigger exact Render deployment
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            case "$RENDER_DEPLOY_HOOK_URL" in
              *\?*) SEP='&' ;;
              *) SEP='?' ;;
            esac
            curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 --max-time 60 \
              -X POST "${RENDER_DEPLOY_HOOK_URL}${SEP}ref=${RELEASE_SHA}" >/tmp/render.json
            cat /tmp/render.json
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            curl --fail --silent --show-error -L \
              https://github.com/render-oss/cli/releases/download/v2.22.0/cli_2.22.0_linux_amd64.zip \
              -o /tmp/render.zip
            unzip -q /tmp/render.zip -d /tmp/render
            RENDER_BIN=$(find /tmp/render -type f -name render -perm -111 | head -1)
            test -n "$RENDER_BIN"
            RENDER_API_KEY="$RENDER_API_KEY" "$RENDER_BIN" deploys create "$RENDER_SERVICE_ID" --commit "$RELEASE_SHA" --wait --confirm --output json | tee /tmp/render.json
          else
            echo 'FAIL: missing Render deployment credentials'
            exit 1
          fi

      - name: Verify production convergence and selling doorway
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 20 "$BASE_URL/version" >/tmp/version.json && grep -q "$RELEASE_SHA" /tmp/version.json; then break; fi
            if [ "$attempt" = 18 ]; then echo 'FAIL: production SHA did not converge'; cat /tmp/version.json 2>/dev/null || true; exit 1; fi
            sleep 10
          done
          for path in / /billboard /avatar /healthz /version; do
            code=$(curl --silent --show-error --output /tmp/body --write-out '%{http_code}' --max-time 20 "$BASE_URL$path")
            echo "$code $path"
            test "$code" = 200
          done
          curl --fail --silent --show-error "$BASE_URL/billboard" >/tmp/billboard.html
          grep -q 'NZ$50' /tmp/billboard.html
          grep -q '100 x 100' /tmp/billboard.html
          curl --fail --silent --show-error "$BASE_URL/healthz" >/tmp/healthz.txt
          grep -q '^ok$' /tmp/healthz.txt
          python3 - <<'PY'
          import json, urllib.request
          p=json.load(open('BEC-PRIME/catalog/offers/approved.json'))
          offer=next(x for x in p['approved'] if x['offer_id']=='OFFER-DREAMLEDGER-BILLBOARD-FOUNDING-001')
          r=urllib.request.urlopen(offer['payment_link_url'], timeout=20)
          print('STRIPE_CHECKOUT_HTTP='+str(r.status))
          assert r.status==200
          PY
          echo 'PRODUCTION_BILLBOARD=PASS'

      - name: Emit deployment proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 - <<'PY'
          import json, os, time
          p={'schema':'dreamledger-billboard-deployment-v1','source_sha':os.environ['RELEASE_SHA'],'base_url':os.environ['BASE_URL'],'timestamp_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'render_service':'DreamLedger1','front_door':'/billboard','offer_id':'OFFER-DREAMLEDGER-BILLBOARD-FOUNDING-001','price_nzd':50,'payment_proof_required':True}
          with open('proof/billboard-deployment-fossil.json','w',encoding='utf-8') as f: json.dump(p,f,indent=2)
          print(json.dumps(p,indent=2))
          PY
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dreamledger-billboard-proof-${{ env.RELEASE_SHA }}
          path: proof/billboard-deployment-fossil.json
          if-no-files-found: error
          retention-days: 30
