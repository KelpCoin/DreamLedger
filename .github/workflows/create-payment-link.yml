name: Create Stripe Payment Link

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/create-payment-link.yml'

jobs:
  create-payment-link:
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse Discord Webhook Starter Kit NZD 79 Payment Link
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STRIPE_API_KEY"

          OFFER_ID="DISCORD-WEBHOOK-STARTER-KIT-001"
          PRODUCT_NAME="Discord Webhook Starter Kit"
          PRICE_NZD="79"
          DESCRIPTION="Complete Discord webhook system with Stripe integration. Deploy in 5 minutes. Includes code templates and setup guide."

          PRODUCTS=$(curl -fsS -G https://api.stripe.com/v1/products \
            -u "$STRIPE_API_KEY:" \
            --data-urlencode 'limit=100')
          PRODUCT_ID=$(echo "$PRODUCTS" | jq -r --arg offer "$OFFER_ID" '.data[] | select(.metadata.offer_id == $offer) | .id' | head -n 1)

          if [ -z "$PRODUCT_ID" ]; then
            PRODUCT_RESPONSE=$(curl -fsS https://api.stripe.com/v1/products \
              -u "$STRIPE_API_KEY:" \
              -d "name=$PRODUCT_NAME" \
              -d "description=$DESCRIPTION" \
              -d "metadata[offer_id]=$OFFER_ID" \
              -d "metadata[currency]=NZD" \
              -d "metadata[price_nzd]=$PRICE_NZD" \
              -d "metadata[delivery]=digital")
            PRODUCT_ID=$(echo "$PRODUCT_RESPONSE" | jq -r '.id')
          fi
          test -n "$PRODUCT_ID"
          test "$PRODUCT_ID" != "null"

          PRICES=$(curl -fsS -G https://api.stripe.com/v1/prices \
            -u "$STRIPE_API_KEY:" \
            --data-urlencode 'limit=100')
          PRICE_ID=$(echo "$PRICES" | jq -r --arg offer "$OFFER_ID" '.data[] | select(.metadata.offer_id == $offer) | select(.unit_amount == 7900) | select(.currency == "nzd") | .id' | head -n 1)

          if [ -z "$PRICE_ID" ]; then
            PRICE_RESPONSE=$(curl -fsS https://api.stripe.com/v1/prices \
              -u "$STRIPE_API_KEY:" \
              -d currency=nzd \
              -d unit_amount=7900 \
              -d "product=$PRODUCT_ID" \
              -d "metadata[offer_id]=$OFFER_ID" \
              -d "metadata[currency]=NZD" \
              -d "metadata[price_nzd]=$PRICE_NZD")
            PRICE_ID=$(echo "$PRICE_RESPONSE" | jq -r '.id')
          fi
          test -n "$PRICE_ID"
          test "$PRICE_ID" != "null"

          EXISTING_LINKS=$(curl -fsS -G https://api.stripe.com/v1/payment_links \
            -u "$STRIPE_API_KEY:" \
            --data-urlencode 'limit=100')
          LINK_ID=$(echo "$EXISTING_LINKS" | jq -r --arg offer "$OFFER_ID" --arg price "$PRICE_ID" '.data[] | select(.metadata.offer_id == $offer) | select(.line_items.data[0].price.id == $price) | .id' | head -n 1)
          PAYMENT_URL=$(echo "$EXISTING_LINKS" | jq -r --arg offer "$OFFER_ID" --arg price "$PRICE_ID" '.data[] | select(.metadata.offer_id == $offer) | select(.line_items.data[0].price.id == $price) | .url' | head -n 1)

          if [ -z "$PAYMENT_URL" ]; then
            LINK_RESPONSE=$(curl -fsS https://api.stripe.com/v1/payment_links \
              -u "$STRIPE_API_KEY:" \
              -d "line_items[0][price]=$PRICE_ID" \
              -d "line_items[0][quantity]=1" \
              -d "after_completion[type]=hosted_confirmation" \
              -d "metadata[offer_id]=$OFFER_ID" \
              -d "metadata[product]=discord-webhook-starter-kit")
            LINK_ID=$(echo "$LINK_RESPONSE" | jq -r '.id')
            PAYMENT_URL=$(echo "$LINK_RESPONSE" | jq -r '.url')
          fi

          test -n "$LINK_ID"
          test "$LINK_ID" != "null"
          test -n "$PAYMENT_URL"
          test "$PAYMENT_URL" != "null"
          test "${PAYMENT_URL#https://buy.stripe.com/}" != "$PAYMENT_URL"

          printf '%s\n' "$PAYMENT_URL" > payment-url.txt
          printf 'offer_id=%s\nproduct=%s\nprice_nzd=%s\ncurrency=NZD\npayment_link_id=%s\nurl=%s\n' "$OFFER_ID" "$PRODUCT_NAME" "$PRICE_NZD" "$LINK_ID" "$PAYMENT_URL" > payment-proof.txt
          echo "PAYMENT LINK URL: $PAYMENT_URL"

      - name: Upload Payment URL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: discord-webhook-starter-kit-payment-link
          path: |
            payment-url.txt
            payment-proof.txt
