name: Round-Trip Artifact Contract

on:
  pull_request:
    paths:
      - "AGENT_BUS/BRIDGE/ECONOMIC_SCALE_CANON.md"
      - "scripts/verify_round_trip_artifact.py"
      - "scripts/create_round_trip_smoke_package.py"
      - "tests/test_round_trip_artifact_verifier.py"
      - ".github/workflows/round-trip-contract.yml"
  push:
    branches: [main]
    paths:
      - "AGENT_BUS/BRIDGE/ECONOMIC_SCALE_CANON.md"
      - "scripts/verify_round_trip_artifact.py"
      - "scripts/create_round_trip_smoke_package.py"
      - "tests/test_round_trip_artifact_verifier.py"
      - ".github/workflows/round-trip-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: round-trip-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run receipt verifier tests
        run: python -m unittest discover -s tests -p "test_round_trip_artifact_verifier.py" -v
      - name: Generate synthetic package
        run: python scripts/create_round_trip_smoke_package.py "$RUNNER_TEMP/round-trip-package"
      - name: Verify receipt and output hashes
        run: python scripts/verify_round_trip_artifact.py "$RUNNER_TEMP/round-trip-package"
      - name: Upload test evidence
        uses: actions/upload-artifact@v4
        with:
          name: round-trip-contract-test-${{ github.run_id }}
          path: ${{ runner.temp }}/round-trip-package/
          if-no-files-found: error
          retention-days: 14
      - name: Attest smoke receipt provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/round-trip-package/round_trip_receipt.json
      - name: Print truth boundary
        run: |
          echo "CONTRACT_CI=PASS"
          echo "TRUTH_STATUS=TEST"
          echo "VERIFIED_EXTERNAL_REVENUE_NZD=0.00"
          echo "NOTE=CI verifies synthetic package integrity only; it does not prove a local round trip or economic outcome."
