name: Cloud Builder Safety Validation

on:
  pull_request:
    paths:
      - "ops/cloud/cloud-figure-eight-builder.py"
      - ".github/workflows/cloud-figure-eight-self-builder.yml"
      - ".github/workflows/cloud-builder-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate builder syntax and diff
        run: |
          python -m py_compile ops/cloud/cloud-figure-eight-builder.py
          git diff --check origin/main...HEAD
      - name: Parse workflow YAML
        run: |
          ruby -e "require 'yaml'; ARGV.each { |path| YAML.parse_file(path); puts path + ': YAML_PARSE=PASS' }" \
            .github/workflows/cloud-figure-eight-self-builder.yml \
            .github/workflows/cloud-builder-validation.yml
