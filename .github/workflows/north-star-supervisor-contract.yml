name: North Star supervisor contract

on:
  pull_request:
    paths:
      - 'runtime/lm_studio/north_star_supervisor.py'
      - 'runtime/lm_studio/Install-NorthStarSupervisorTask.ps1'
      - 'runtime/lm_studio/NORTH-STAR-SUPERVISOR.md'
      - '.github/workflows/north-star-supervisor-contract.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/lm_studio/north_star_supervisor.py'
      - 'runtime/lm_studio/Install-NorthStarSupervisorTask.ps1'
      - 'runtime/lm_studio/NORTH-STAR-SUPERVISOR.md'
      - '.github/workflows/north-star-supervisor-contract.yml'

permissions:
  contents: read

jobs:
  supervisor:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline supervisor self-test
        run: python runtime/lm_studio/north_star_supervisor.py --self-test
      - name: Check controller and installer contracts
        shell: pwsh
        run: |
          $s = Get-Content runtime/lm_studio/north_star_supervisor.py -Raw
          if ($s -notmatch 'economic_swarm_controller.py') { throw 'Controller not referenced' }
          if ($s -notmatch 'external_action_performed') { throw 'External action state not logged' }
          if ($s -notmatch 'SUPERVISOR_ALREADY_RUNNING') { throw 'Single-instance lock missing' }
          if ($s -notmatch 'CONTROLLER_CYCLE_TIMEOUT') { throw 'Cycle timeout missing' }
          if ($s -notmatch 'backoff_seconds') { throw 'Backoff policy missing' }
          $i = Get-Content runtime/lm_studio/Install-NorthStarSupervisorTask.ps1 -Raw
          if ($i -notmatch 'if \(-not \$Install\)') { throw 'Installer must default to no mutation' }
          if ($i -notmatch 'Start-ScheduledTask') { throw 'Explicit installer must start task' }
          Write-Output 'NORTH_STAR_SUPERVISOR_CONTRACT=PASS'
