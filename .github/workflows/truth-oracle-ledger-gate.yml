name: Truth Oracle Ledger Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  truth-oracle-ledger:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BEC-PRIME
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify signed webhook -> immutable ledger -> proof idempotency
        run: node scripts/Verify-TruthOracleWebhookLedger.js
