name: Failure Point Recovery

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: failure-point-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect and recover recent safe failures
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const excluded = new Set([
              'Failure Point Recovery',
              'All Workflows Fallback Dispatcher'
            ]);
            const safe = new Set([
              'Economic Loop Controller',
              'Economic Loop Controller V2',
              'Economic Loop Registration Probe',
              'DreamLedger System Truth Gate',
              'Production HTTP Truth Gate',
              'E0 Production Truth Probe',
              'Revenue Readiness Gate',
              'Economic Commerce Gate',
              'B2B Marketplace Live Gate',
              'Commerce Sentinel',
              'Revenue Sentinel',
              'BECK Production Heartbeat',
              'Commerce Settlement Sync',
              'MTG Diagnostic Fulfillment Gate',
              'Production Recovery Execute',
              'Render Recovery Fallback',
              'Production Auth Recovery',
              'Repair AgentBridge Runtime Mount',
              'DreamLedger Cloud Primary'
            ]);

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100,
              status: 'completed'
            });

            const cutoff = Date.now() - 20 * 60 * 1000;
            const recent = runs.filter(run =>
              new Date(run.updated_at).getTime() >= cutoff &&
              ['failure', 'timed_out', 'cancelled'].includes(run.conclusion) &&
              !excluded.has(run.name)
            );

            const retried = [];
            const skipped = [];
            const rejected = [];

            for (const run of recent) {
              if (!safe.has(run.name)) {
                skipped.push({
                  name: run.name,
                  id: run.id,
                  conclusion: run.conclusion,
                  reason: 'not-safe-for-automatic-rerun'
                });
                continue;
              }

              if ((run.run_attempt || 1) > 1) {
                skipped.push({
                  name: run.name,
                  id: run.id,
                  conclusion: run.conclusion,
                  reason: 'already-retried'
                });
                continue;
              }

              try {
                await github.rest.actions.reRunWorkflowFailedJobs({
                  owner,
                  repo,
                  run_id: run.id
                });
                retried.push({
                  name: run.name,
                  id: run.id,
                  conclusion: run.conclusion
                });
              } catch (error) {
                rejected.push({
                  name: run.name,
                  id: run.id,
                  conclusion: run.conclusion,
                  reason: 'rerun-rejected',
                  status: error.status || null
                });
              }
            }

            const summary = {
              generated_at: new Date().toISOString(),
              window_minutes: 20,
              recent_failures: recent.length,
              retried,
              skipped,
              rejected,
              safety_policy: 'Only allowlisted idempotent verification/recovery/economic reconciliation workflows are rerun. Payment creation, releases, migrations, destructive changes, and external outreach remain fail-closed.'
            };

            core.summary.addHeading('Failure Point Recovery');
            core.summary.addRaw('```json\n' + JSON.stringify(summary, null, 2) + '\n```');
            await core.summary.write();

            core.setOutput('failure_count', String(recent.length));
            core.setOutput('retried_count', String(retried.length));
            core.setOutput('rejected_count', String(rejected.length));

            if (rejected.length > 0) {
              core.warning(`${rejected.length} recovery attempt(s) were rejected. No unsafe fallback was attempted.`);
            }

      - name: Confirm fail-closed policy
        run: |
          echo "Failure recovery completed. Unsafe or rejected actions remain fail-closed."
