name: BECK Existing First Dollar Contract
on:
  pull_request:
    branches: [billboard-verified-release-20261027]
    paths:
      - 'public/tools/**'
      - 'public/quote-compare-49.html'
      - 'supabase/functions/quote-intake/**'
      - 'supabase/functions/quote-fulfillment/**'
      - 'scripts/test_existing_first_dollar_contract.cjs'
      - '.github/workflows/beck-existing-first-dollar.yml'
  push:
    branches: [billboard-verified-release-20261027]
    paths:
      - 'public/tools/**'
      - 'public/quote-compare-49.html'
      - 'supabase/functions/quote-intake/**'
      - 'supabase/functions/quote-fulfillment/**'
      - 'scripts/test_existing_first_dollar_contract.cjs'
      - '.github/workflows/beck-existing-first-dollar.yml'
permissions:
  contents: read
jobs:
  existing-offer-path:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify existing live-link and truthful fulfillment path in source
        run: |
          node --check scripts/test_existing_first_dollar_contract.cjs
          node scripts/test_existing_first_dollar_contract.cjs
      - name: Test released source website routing
        run: node scripts/test_beck_vercel_contract.cjs
