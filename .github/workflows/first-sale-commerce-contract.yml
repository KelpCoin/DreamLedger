name: First Sale Commerce Contract

on:
  pull_request:
    paths:
      - 'public/catalog.json'
      - 'BEC-PRIME/autonomy/OFFERS.json'
      - '.github/workflows/create-payment-link.yml'
      - '.github/workflows/first-sale-commerce-contract.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'public/catalog.json'
      - 'BEC-PRIME/autonomy/OFFERS.json'
      - '.github/workflows/create-payment-link.yml'
      - '.github/workflows/first-sale-commerce-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          jq empty public/catalog.json
          jq empty BEC-PRIME/autonomy/OFFERS.json

      - name: Verify configured checkout and honest delivery status
        shell: bash
        run: |
          set -euo pipefail
          CATALOG='public/catalog.json'
          WORKFLOW='.github/workflows/create-payment-link.yml'
          PRODUCT_ID='DISCORD-WEBHOOK-STARTER-KIT-001'

          test "$(jq -r --arg id "$PRODUCT_ID" '.products[] | select(.id == $id) | .price_nzd' "$CATALOG")" = '79'
          test "$(jq -r --arg id "$PRODUCT_ID" '.products[] | select(.id == $id) | .currency' "$CATALOG")" = 'NZD'
          test "$(jq -r --arg id "$PRODUCT_ID" '.products[] | select(.id == $id) | .checkout_available' "$CATALOG")" = 'true'
          test "$(jq -r --arg id "$PRODUCT_ID" '.products[] | select(.id == $id) | .delivery_test_status' "$CATALOG")" = 'UNVERIFIED'
          jq -e --arg id "$PRODUCT_ID" '.products[] | select(.id == $id) | (.checkout_url | startswith("https://buy.stripe.com/"))' "$CATALOG"

          grep -F -- 'PRODUCT_NAME="Discord Webhook Starter Kit"' "$WORKFLOW"
          grep -F -- 'PRICE_NZD="79"' "$WORKFLOW"
          grep -F -- 'secrets.STRIPE_SECRET_KEY' "$WORKFLOW"
          grep -F -- 'payment_links' "$WORKFLOW"
          grep -F -- 'https://buy.stripe.com/' "$WORKFLOW"

      - name: Secret hygiene guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'sk_(live|test)_[A-Za-z0-9]+' . --exclude-dir=.git

      - name: Emit proof artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          cat > proof/first-sale-commerce-contract.txt <<'EOF'
          PASS
          Product: Discord Webhook Starter Kit
          Price: NZD 79
          Checkout: configured, not a revenue claim
          Delivery: UNVERIFIED pending end-to-end receipt
          Secret hygiene: PASS
          EOF

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: first-sale-commerce-contract-proof
          path: proof/first-sale-commerce-contract.txt
