name: First Sale Commerce Contract

on:
  pull_request:
    paths:
      - 'public/catalog.json'
      - 'BEC-PRIME/autonomy/OFFERS.json'
      - '.github/workflows/create-payment-link.yml'
      - '.github/workflows/first-sale-commerce-contract.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'public/catalog.json'
      - 'BEC-PRIME/autonomy/OFFERS.json'
      - '.github/workflows/create-payment-link.yml'
      - '.github/workflows/first-sale-commerce-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          jq empty public/catalog.json
          jq empty BEC-PRIME/autonomy/OFFERS.json

      - name: Verify canonical hold and honest delivery status
        shell: bash
        run: |
          set -euo pipefail
          CATALOG='public/catalog.json'
          PRODUCT_ID='DISCORD-WEBHOOK-STARTER-KIT-001'

          test "$(jq -r --arg id "$PRODUCT_ID" '.products[] | select(.id == $id) | .price' "$CATALOG")" = '79'
          test "$(jq -r --arg id "$PRODUCT_ID" '.products[] | select(.id == $id) | .currency' "$CATALOG")" = 'nzd'
          test "$(jq -r --arg id "$PRODUCT_ID" '.products[] | select(.id == $id) | .status' "$CATALOG")" = 'held'
          test "$(jq -r --arg id "$PRODUCT_ID" '.products[] | select(.id == $id) | .checkout_available' "$CATALOG")" = 'false'
          test "$(jq -r --arg id "$PRODUCT_ID" '.products[] | select(.id == $id) | .delivery_test_status' "$CATALOG")" = 'UNVERIFIED'
          test "$(jq -r --arg id "$PRODUCT_ID" '.products[] | select(.id == $id) | .checkout_url' "$CATALOG")" = 'null'
          jq -e --arg id "$PRODUCT_ID" '.products[] | select(.id == $id) | .commercial_truth.approval_required == true and .commercial_truth.sellable == false and .commercial_truth.payment_surface == null' "$CATALOG"

          echo 'PASS: Discord Webhook Starter Kit is visible in the catalog but checkout remains held until delivery evidence is verified.'

      - name: Secret hygiene guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'sk_(live|test)_[A-Za-z0-9]+' . --exclude-dir=.git

      - name: Emit proof artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          cat > proof/first-sale-commerce-contract.txt <<'EOF'
          PASS
          Product: Discord Webhook Starter Kit
          Price: NZD 79
          Checkout: configured, not a revenue claim
          Delivery: UNVERIFIED pending end-to-end receipt
          Secret hygiene: PASS
          EOF

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: first-sale-commerce-contract-proof
          path: proof/first-sale-commerce-contract.txt
