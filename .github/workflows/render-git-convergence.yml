name: Render Git Convergence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamledger-render-git-convergence
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET: https://dreamledger.org
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: State exact source commit
        run: |
          set -euo pipefail
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "TARGET=$TARGET"

      - name: Checkout verifier
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for Render Git auto-deploy to converge
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            health_code=$(curl -sS -o /tmp/healthz.json -w '%{http_code}' --max-time 15 "$TARGET/healthz" || true)
            version_code=$(curl -sS -o /tmp/version.json -w '%{http_code}' --max-time 15 "$TARGET/version" || true)
            echo "attempt=$i health_http=$health_code version_http=$version_code"
            if [ "$health_code" = "200" ] && [ "$version_code" = "200" ]; then
              deployed=$(python3 -c "import json; print(json.load(open('/tmp/version.json')).get('commit',''))")
              echo "deployed_commit=$deployed"
              if [ "$deployed" = "$EXPECTED_SHA" ]; then
                BASE_URL="$TARGET" EXPECTED_SHA="$EXPECTED_SHA" node BEC-PRIME/scripts/verify-public-silo-routes.js
                echo 'PASS: Render production converged to exact Git commit and all canonical public routes are live.'
                exit 0
              fi
              echo 'WAIT: Render is healthy but still serving an older commit.'
            fi
            sleep 10
          done
          echo 'FAIL: Render did not converge to the pushed Git commit and canonical public route contract.'
          exit 1

      - name: Write deployment proof
        if: always()
        run: |
          mkdir -p proof
          python3 - "$EXPECTED_SHA" <<'PY'
          import json, sys, time
          proof = {
              'source_commit': sys.argv[1],
              'target': 'https://dreamledger.org',
              'timestamp_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'contract': 'github-main-push-must-converge-render-production-and-all-canonical-silo-routes',
              'verifier': 'BEC-PRIME/scripts/verify-public-silo-routes.js'
          }
          with open('proof/render-git-convergence.json','w',encoding='utf-8') as f:
              json.dump(proof,f,indent=2)
          PY

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-git-convergence-${{ github.sha }}
          path: proof/render-git-convergence.json
          if-no-files-found: error
          retention-days: 30
