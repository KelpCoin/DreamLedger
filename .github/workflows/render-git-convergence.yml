name: Render Git Convergence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamledger-render-git-convergence
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET: https://dreamledger.org
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: State exact source commit
        run: |
          set -euo pipefail
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "TARGET=$TARGET"

      - name: Wait for Render Git auto-deploy to converge
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            health_code=$(curl -sS -o /tmp/healthz.json -w '%{http_code}' --max-time 15 "$TARGET/healthz" || true)
            version_code=$(curl -sS -o /tmp/version.json -w '%{http_code}' --max-time 15 "$TARGET/version" || true)
            mtg_code=$(curl -sS -o /tmp/mtg.html -w '%{http_code}' --max-time 15 "$TARGET/mtg" || true)
            board_code=$(curl -sS -o /tmp/board.html -w '%{http_code}' --max-time 15 "$TARGET/board" || true)
            inventory_code=$(curl -sS -o /tmp/inventory.json -w '%{http_code}' --max-time 15 "$TARGET/api/molt-beach-inventory" || true)
            echo "attempt=$i health_http=$health_code version_http=$version_code mtg_http=$mtg_code board_http=$board_code inventory_http=$inventory_code"
            if [ "$health_code" = "200" ] && [ "$version_code" = "200" ]; then
              deployed=$(python3 -c "import json; print(json.load(open('/tmp/version.json')).get('commit',''))")
              echo "deployed_commit=$deployed"
              if [ "$deployed" = "$EXPECTED_SHA" ] && [ "$mtg_code" = "200" ] && [ "$board_code" = "200" ] && [ "$inventory_code" = "200" ]; then
                echo 'PASS: Render production converged to exact Git commit and canonical public routes are live.'
                exit 0
              fi
              echo 'WAIT: Render is healthy but route/provenance checks are not yet converged.'
            fi
            sleep 10
          done
          echo 'FAIL: Render did not converge to the pushed Git commit and canonical public routes.'
          echo 'Required: /version, /mtg, /board, and /api/molt-beach-inventory must all be live on the exact Git SHA.'
          exit 1

      - name: Write deployment proof
        if: always()
        run: |
          mkdir -p proof
          python3 - "$EXPECTED_SHA" <<'PY'
          import json, sys, time
          proof = {
              'source_commit': sys.argv[1],
              'target': 'https://dreamledger.org',
              'timestamp_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'contract': 'github-main-push-must-converge-render-production-and-public-route-contract',
              'routes': ['/version','/healthz','/mtg','/board','/api/molt-beach-inventory']
          }
          with open('proof/render-git-convergence.json','w',encoding='utf-8') as f:
              json.dump(proof,f,indent=2)
          PY

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-git-convergence-${{ github.sha }}
          path: proof/render-git-convergence.json
          if-no-files-found: error
          retention-days: 30
