name: Agentic Commerce Gate

on:
  push:
    branches: [main]
    paths:
      - 'BEC-PRIME/AGENTIC-COMMERCE-ENGINE.json'
      - 'BEC-PRIME/catalog/**'
      - 'BEC-PRIME/scripts/Verify-AgenticCommerceKernel.ps1'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify engine and catalog JSON
        shell: pwsh
        run: ./BEC-PRIME/scripts/Verify-AgenticCommerceKernel.ps1
