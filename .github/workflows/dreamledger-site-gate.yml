name: DreamLedger Public Surface Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate public storefront files
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/billboard.html
          test -s public/server.js
          test -s public/package.json
          test -s public/robots.txt
          test -s public/sitemap.xml
          grep -q 'DISCOVER' public/index.html
          grep -q 'WORTH BUYING' public/index.html
          grep -q 'Digital products' public/index.html
          grep -q 'Magic & collectibles' public/index.html
          grep -q 'Games & experiments' public/index.html
          grep -q 'Digital media' public/index.html
          grep -q '/billboard' public/index.html
          grep -q "'GET /api/products':true" public/server.js
          grep -q "'POST /api/billboard/submit':true" public/server.js
          grep -q "'/sitemap.xml':'sitemap.xml'" public/server.js
          grep -q "public-v6" public/server.js
          grep -q 'https://dreamledger.org/sitemap.xml' public/robots.txt
          grep -q 'https://dreamledger.org/' public/sitemap.xml
          echo 'PASS: storefront v6 contract is present.'
      - name: Scan public assets for internal or cross-silo leakage
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -Eiq --include='*.html' --include='*.js' --include='*.css' --include='*.json' --include='*.txt' 'Gauntlet|Economic Court|ELOHIM|BrownEye Cortex|BEC-PRIME|AMPLISSA|COLLECTORSCOAST|HappyHomarid|private factory|internal factory' public; then
            echo 'FAIL: prohibited internal or cross-silo language found in public assets.'
            exit 1
          fi
          echo 'PASS: public language boundary clean.'
      - name: Verify public route allowlist
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PUBLIC_FILES' public/server.js
          grep -Eq "'/'.*index.html" public/server.js
          grep -Eq "'/billboard'.*billboard.html" public/server.js
          grep -Eq "'/sitemap.xml'.*sitemap.xml" public/server.js
          grep -q "if(!ALLOWED_API\[key\])" public/server.js
          echo 'PASS: public routes explicitly allowlisted.'
      - name: Verify secrets absent from public assets
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -Eiq --include='*.html' --include='*.js' --include='*.css' --include='*.json' --include='*.txt' 'sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+|BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|SUPABASE_SERVICE_ROLE_KEY' public; then
            echo 'FAIL: credential-like literal found in public assets.'
            exit 1
          fi
          echo 'PASS: no obvious secret material found in public assets.'
      - name: Syntax check public server
        shell: bash
        run: |
          set -euo pipefail
          node --check public/server.js
          echo 'PASS: public server syntax is valid.'
      - name: Emit machine proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p PROOF
          cat > PROOF/DREAMLEDGER_PUBLIC_SURFACE_GATE.json <<'JSON'
          {
            "schema_version": "3.0",
            "gate": "DREAMLEDGER_PUBLIC_SURFACE_V6",
            "status": "PASS",
            "public_root": "public",
            "checks": ["catalogue_first","multi_silo_navigation","billboard_contained","sitemap_present","robots_present","api_allowlist_present","language_boundary_passed","credential_scan_passed","server_syntax_passed"],
            "note": "Live deployment status is established by the production truth probe."
          }
          JSON
      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-public-surface-proof
          path: PROOF/DREAMLEDGER_PUBLIC_SURFACE_GATE.json
