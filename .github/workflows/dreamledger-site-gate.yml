name: DreamMeez Public Surface Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreammeez-public-surface-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate public storefront files
        shell: bash
        run: |
          set -euo pipefail
          test -s public/home.html
          test -s public/billboard.html
          test -s public/server.js
          test -s public/package.json
          test -s public/robots.txt
          test -s public/sitemap.xml
          grep -q 'Supplier Quote Comparison Worksheet' public/home.html
          grep -q 'Agent Delivery Proof Audit' public/home.html
          grep -q 'Commander Deck Diagnostic' public/home.html
          grep -q 'Agent Bridge · Preview (held)' public/home.html
          grep -q "p==='/api/offers' || p==='/api/products'" public/server.js
          grep -q "'/sitemap.xml':'sitemap.xml'" public/server.js
          grep -q "p.startsWith('/buy/')" public/server.js
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('public/catalog.json','utf8'));
          const b=c.products.find(x=>x.id==='DREAMLEDGER-BILLBOARD-FOUNDING-001');
          if(!b || b.checkout_available!==false || b.checkout_url!==null || b.availability!=='review_required') process.exit(1);
          const page=fs.readFileSync('public/billboard.html','utf8');
          if(page.includes('buy.stripe.com') || page.includes('/api/molt-beach-checkout')) process.exit(1);
          console.log('PASS: unverified billboard checkout is held.');
          NODE
          grep -q 'https://dreamledger.org/sitemap.xml' public/robots.txt
          grep -q 'https://dreamledger.org/' public/sitemap.xml
          echo 'PASS: canonical storefront and honest checkout availability are verified.'
      - name: Scan public assets for internal or cross-silo leakage
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          find public -type f \( -name '*.html' -o -name '*.css' -o -name '*.json' -o -name '*.txt' \) -print0 | while IFS= read -r -d '' f; do
            case "$f" in
              *.html) sed -E 's#<script[^>]*>.*</script>##g; s#<style[^>]*>.*</style>##g' "$f" >> "$tmp" ;;
              *) cat "$f" >> "$tmp" ;;
            esac
          done
          if grep -Eiq 'Gauntlet|Economic Court|ELOHIM|BrownEye Cortex|BEC-PRIME|AMPLISSA|COLLECTORSCOAST|HappyHomarid|private factory|internal factory' "$tmp"; then
            echo 'FAIL: prohibited internal or cross-silo language found in public assets.'
            rm -f "$tmp"
            exit 1
          fi
          rm -f "$tmp"
          echo 'PASS: public language boundary clean.'
      - name: Verify public route allowlist
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PUBLIC_FILES' public/server.js
          grep -q "'/':'home.html','/index.html':'home.html'" public/server.js
          grep -Eq "'/billboard'.*billboard.html" public/server.js
          grep -q "'/avatar.html':'avatar.html'" public/server.js
          grep -Eq "'/sitemap.xml'.*sitemap.xml" public/server.js
          grep -q "p==='/api/offers' || p==='/api/products'" public/server.js
          echo 'PASS: canonical public routes and product API are implemented.'
      - name: Verify secrets absent from public assets
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -Eiq --include='*.html' --include='*.js' --include='*.css' --include='*.json' --include='*.txt' 'sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+|BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|SUPABASE_SERVICE_ROLE_KEY' public; then
            echo 'FAIL: credential-like literal found in public assets.'
            exit 1
          fi
          echo 'PASS: no obvious secret material found in public assets.'
      - name: Syntax check public server
        shell: bash
        run: |
          set -euo pipefail
          node --check public/server.js
          echo 'PASS: public server syntax is valid.'
      - name: Emit machine proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p PROOF
          cat > PROOF/DREAMLEDGER_PUBLIC_SURFACE_GATE.json <<'JSON'
          {
            "schema_version": "4.0",
            "gate": "DREAMMEEZ_PUBLIC_SURFACE",
            "status": "PASS",
            "public_root": "public",
            "checks": ["catalogue_first","dreammeez_navigation","billboard_contained","sitemap_present","robots_present","api_allowlist_present","language_boundary_passed","credential_scan_passed","server_syntax_passed"],
            "note": "Live deployment status is established by the production truth probe."
          }
          JSON
      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: dreammeez-public-surface-proof
          path: PROOF/DREAMLEDGER_PUBLIC_SURFACE_GATE.json
