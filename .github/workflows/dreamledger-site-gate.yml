name: DreamLedger Public Surface Gate

on:
  push:
    branches: [main, 'ui/**']
  pull_request:
    branches: [main]

jobs:
  public-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate homepage contract
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q 'dreamledger.org' index.html || true
          grep -q 'Commander Deck Diagnostic' index.html
          grep -q 'NZ$29' index.html
          grep -q 'buy.stripe.com/00w7sLaXP01n96nbN2dwc2l' index.html
          grep -q 'href="/mtg.html"' index.html
          grep -q 'approval-gated' index.html
          ! grep -Eqi 'password|secret|api[_-]?key|private[_-]?key' index.html

      - name: Validate referenced local pages
        shell: bash
        run: |
          set -euo pipefail
          test -s mtg.html

      - name: Emit machine proof
        shell: bash
        run: |
          mkdir -p PROOF
          cat > PROOF/DREAMLEDGER_PUBLIC_SURFACE_GATE.json <<'JSON'
          {
            "schema_version": "1.0",
            "gate": "DREAMLEDGER_PUBLIC_SURFACE",
            "status": "PASS",
            "checks": [
              "homepage_exists",
              "commercial_offer_present",
              "nz29_price_present",
              "stripe_link_present",
              "mtg_route_present",
              "approval_gate_language_present",
              "no_obvious_secret_tokens_in_homepage"
            ]
          }
          JSON

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-public-surface-proof
          path: PROOF/DREAMLEDGER_PUBLIC_SURFACE_GATE.json
