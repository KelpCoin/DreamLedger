name: DreamMeez Public Surface Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreammeez-public-surface-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate public storefront files
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/billboard.html
          test -s public/server.js
          test -s public/package.json
          test -s public/robots.txt
          test -s public/sitemap.xml
          grep -q 'Supplier Quote Comparison Worksheet' public/index.html
          grep -q 'Truth Oracle evidence review' public/index.html
          grep -q 'Commander Deck Diagnostic' public/index.html
          grep -q 'Agent Bridge · Preview (held)' public/index.html
          grep -q "p==='/api/offers' || p==='/api/products'" public/server.js
          grep -q "'/sitemap.xml':'sitemap.xml'" public/server.js
          grep -q "p.startsWith('/buy/')" public/server.js
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('public/catalog.json','utf8'));
          const b=c.products.find(x=>x.id==='DREAMLEDGER-BILLBOARD-FOUNDING-001');
          if(!b || b.availability!=='review_required') process.exit(1);
          const page=fs.readFileSync('public/billboard.html','utf8');
          if(!page.includes('DEMO ONLY') || !page.includes('billboard-canvas')) process.exit(1);
          if(!page.includes('/api/billboard/public')) process.exit(1);
          console.log('PASS: canvas is source-backed; review-required availability not confused with fulfilment.');
          NODE
          grep -q 'https://dreamledger.org/sitemap.xml' public/robots.txt
          grep -q 'https://dreamledger.org/' public/sitemap.xml
          echo 'PASS: canonical storefront and honest checkout availability are verified.'
      - name: Scan public assets for internal or cross-silo leakage
        shell: bash
        run: |
          set -euo pipefail
          pattern='Gauntlet|Economic Court|ELOHIM|BrownEye Cortex|BEC-PRIME|AMPLISSA|COLLECTORSCOAST|private factory|internal factory'
          failed=0
          while IFS= read -r -d '' f; do
            case "$f" in
              *.html) content=$(sed -E 's#<script[^>]*>.*</script>##g; s#<style[^>]*>.*</style>##g' "$f") ;;
              *) content=$(cat "$f") ;;
            esac
            if printf '%s' "$content" | grep -Eiq "$pattern"; then
              echo "PUBLIC_LANGUAGE_MATCH=$f"
              printf '%s' "$content" | grep -Ein "$pattern" | head -5 || true
              failed=1
            fi
          done < <(find public -type f \( -name '*.html' -o -name '*.css' -o -name '*.json' -o -name '*.txt' \) ! -path 'public/package.json' -print0)
          if [ "$failed" -ne 0 ]; then
            echo 'FAIL: prohibited internal or cross-silo language found in public assets.'
            exit 1
          fi
          echo 'PASS: public language boundary clean.'
      - name: Verify public route allowlist
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PUBLIC_FILES' public/server.js
          grep -q "'/':'index.html','/index.html':'index.html'" public/server.js
          grep -Eq "'/billboard'.*billboard.html" public/server.js
          grep -q "'/avatar.html':'avatar.html'" public/server.js
          grep -Eq "'/sitemap.xml'.*sitemap.xml" public/server.js
          grep -q "p==='/api/offers' || p==='/api/products'" public/server.js
          echo 'PASS: canonical public routes and product API are implemented.'
      - name: Verify secrets absent from public assets
        shell: bash
        run: |
          set -euo pipefail
          found=0
          scan_pattern() {
            label="$1"
            pattern="$2"
            while IFS= read -r -d '' f; do
              if grep -Eiq "$pattern" "$f"; then
                echo "SECRET_PATTERN=$label FILE=$f"
                found=1
              fi
            done < <(find public -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.txt' \) ! -path 'public/package.json' -print0)
          }
          scan_pattern STRIPE_LIVE_KEY 'sk_live_[A-Za-z0-9]+'
          scan_pattern STRIPE_TEST_KEY 'sk_test_[A-Za-z0-9]+'
          scan_pattern STRIPE_WEBHOOK_SECRET 'whsec_[A-Za-z0-9]+'
          scan_pattern PRIVATE_KEY_HEADER 'BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY'
          if [ "$found" -ne 0 ]; then
            echo 'FAIL: credential-like literal found in public assets. File paths are shown; matched values are never printed.'
            exit 1
          fi
          echo 'PASS: no obvious secret material found in public assets.'
      - name: Verify BECK discovery and visual contract
        run: node scripts/test_neon_discovery_contract.cjs
      - name: Syntax check public server
        shell: bash
        run: |
          set -euo pipefail
          node --check public/server.js
          echo 'PASS: public server syntax is valid.'
      - name: Emit machine proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p PROOF
          cat > PROOF/DREAMLEDGER_PUBLIC_SURFACE_GATE.json <<'JSON'
          {
            "schema_version": "4.0",
            "gate": "DREAMMEEZ_PUBLIC_SURFACE",
            "status": "PASS",
            "public_root": "public",
            "checks": ["catalogue_first","dreammeez_navigation","billboard_contained","sitemap_present","robots_present","api_allowlist_present","language_boundary_passed","credential_scan_passed","server_syntax_passed"],
            "note": "Live deployment status is established by the production truth probe."
          }
          JSON
      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: dreammeez-public-surface-proof
          path: PROOF/DREAMLEDGER_PUBLIC_SURFACE_GATE.json
