name: Economic Loop Controller

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: dreamledger-economic-loop
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  STRIPE_EXPECTED_ACCOUNT_ID: acct_1NKPLaJt4ieIQDFz

jobs:
  close-economic-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use supported Node 24 runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.0.4
        with:
          node-version: '24.14.1'

      - name: Preflight Stripe live authentication
        id: stripe-auth
        if: ${{ vars.STRIPE_LIVE_ENABLED == 'true' }}
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_LIVE_ENABLED: ${{ vars.STRIPE_LIVE_ENABLED }}
        run: node scripts/Verify-StripeLiveAuth.mjs

      - name: Create idempotent Stripe auth incident
        if: ${{ always() && steps.stripe-auth.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          proof='proof/commerce/latest-stripe-live-auth.json'
          test -s "$proof"
          reason="$(node -e "const x=require('./$proof'); process.stdout.write(x.reason||'Stripe authentication preflight failed.')")"
          acct="$(node -e "const x=require('./$proof'); process.stdout.write(x.account_id||'unknown')")"
          title="ECONOMIC BLOCKER: Stripe auth ${acct} $(date -u +%Y-%m-%d)"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --limit 1 --json number,title)"
          if [ "$(node -e "const x=JSON.parse(process.argv[1]); console.log(x.length)" "$existing")" -gt 0 ]; then
            echo "INCIDENT_ALREADY_OPEN"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "# Stripe authentication gate blocked the economic loop

Reason: $reason
Observed account: $acct
Canonical DreamLedger account: $STRIPE_EXPECTED_ACCOUNT_ID

The loop is fail-closed. No reconciliation, fulfillment, or revenue recognition occurs while this gate is blocked.

Do not paste secret material into issues, commits, chat, or logs. Replace the GitHub Actions STRIPE_SECRET_KEY with a live secret belonging to the canonical Stripe account, then rerun the Economic Loop Controller.

Evidence file: proof/commerce/latest-stripe-live-auth.json
Revenue claimed: NZ$0"

      - name: Reconcile live payment evidence
        if: ${{ steps.stripe-auth.outcome == 'success' }}
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PAYMENT_LINK_URL: ${{ secrets.STRIPE_PAYMENT_LINK_URL }}
          STRIPE_LIVE_ENABLED: ${{ vars.STRIPE_LIVE_ENABLED }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: appknw1VhHjEzCwFC
          AIRTABLE_EVENTS_TABLE_ID: tblp9aC01vvyi9iKj
          AIRTABLE_OFFERS_TABLE_ID: tblXXG4CNW7xPmmOP
          AIRTABLE_OFFER_RECORD_ID: recv61Js6lxpCMUvZ
        run: node ops/commerce/reconcile-stripe-airtable.mjs

      - name: Create idempotent fulfillment work items
        if: ${{ steps.stripe-auth.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s proof/commerce/latest-stripe-airtable-reconciliation.json
          node <<'NODE'
          const fs = require('fs');
          const proof = JSON.parse(fs.readFileSync('proof/commerce/latest-stripe-airtable-reconciliation.json', 'utf8'));
          const inserted = proof.newly_recognized_events || [];
          fs.writeFileSync('/tmp/new-payments.json', JSON.stringify(inserted));
          console.log(`NEWLY_RECOGNIZED=${inserted.length}`);
          NODE
          count=$(node -e "const x=require('/tmp/new-payments.json'); console.log(x.length)")
          if [ "$count" -eq 0 ]; then
            echo 'No new verified payment. Nothing to fulfill.'
            exit 0
          fi
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const rows = JSON.parse(fs.readFileSync('/tmp/new-payments.json', 'utf8'));
          for (const row of rows) {
            const title = `FULFILL ${row.eventId} ${row.sku || row.offerId || row.productId}`;
            const existing = cp.spawnSync('gh', ['issue', 'list', '--state', 'all', '--search', `in:title "${title}"`, '--limit', '1', '--json', 'number,title'], {encoding:'utf8'});
            if (existing.status !== 0) throw new Error(existing.stderr || 'gh issue list failed');
            const found = JSON.parse(existing.stdout || '[]');
            if (found.length) { console.log(`IDEMPOTENT_SKIP issue=${found[0].number} event=${row.eventId}`); continue; }
            const body = [
              '# Verified paid order', '',
              `Event ID: ${row.eventId}`,
              `Offer ID: ${row.offerId || 'unknown'}`,
              `Product ID: ${row.productId || 'unknown'}`,
              `SKU: ${row.sku || 'unknown'}`,
              `Stripe session: ${row.stripeSession}`,
              `Amount: NZ$${row.amountNZD}`,
              `Paid at: ${row.paidAt}`, '',
              '## Required operator actions',
              `1. Fulfill the approved offer identified by ${row.offerId || row.sku || row.productId}.`,
              '2. Follow the offer registry fulfillment route and required human approval gate.',
              '3. Record delivery evidence in the normal fulfillment system.',
              '4. Close this issue only after delivery is evidenced.',
              '5. Do not publicly post or contact the buyer from automation.', '',
              '## Economic loop',
              'Payment -> verified event -> offer-specific fulfillment -> evidence -> next monetization candidate.', '',
              'This issue is generated only from a live Stripe payment event. No synthetic revenue is created.'
            ].join('\\n');
            const result = cp.spawnSync('gh', ['issue', 'create', '--title', title, '--body', body], {encoding:'utf8'});
            if (result.status !== 0) throw new Error(result.stderr || result.stdout || 'gh issue create failed');
            console.log(`FULFILLMENT_CREATED ${result.stdout.trim()}`);
          }
          NODE

      - name: Emit economic-loop proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/Emit-EconomicLoopProof.js
          sha256sum proof/commerce/latest-economic-loop.json > proof/commerce/latest-economic-loop.sha256

      - name: Upload economic-loop proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: economic-loop-proof-${{ github.run_id }}
          path: |
            proof/commerce/latest-economic-loop.json
            proof/commerce/latest-economic-loop.sha256
            proof/commerce/latest-stripe-airtable-reconciliation.json
            proof/commerce/latest-stripe-live-auth.json
          if-no-files-found: warn
          retention-days: 90
