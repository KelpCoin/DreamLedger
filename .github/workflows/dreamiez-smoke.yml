name: Dreamiez Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BEC-PRIME
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BEC-PRIME/package.json
      - name: Install
        run: npm install
      - name: Compile offers
        run: npm run compile:offers
      - name: Compile surface
        run: npm run compile:surface
      - name: Syntax check
        run: node --check server.js && node --check start.js && node --check dreamiez-account.js && node --check scripts/smoke-dreamiez.js
      - name: Dreamiez end-to-end smoke test
        run: npm run smoke:dreamiez
