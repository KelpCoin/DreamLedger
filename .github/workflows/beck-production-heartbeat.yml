name: BECK Production Route Health (read-only)

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_URL: https://dreamledger.org

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Probe public routes without mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/beck
          printf 'checked_at_utc=%s\n' "$(date -u +%FT%TZ)" > proof/beck/routes.txt
          printf 'base_url=%s\n' "$BASE_URL" >> proof/beck/routes.txt
          overall=true
          for route in / /mtg/ /catalog.json /data/mtg-catalog.json; do
            code="$(curl -sS -L --max-time 20 -o /tmp/route.body -w '%{http_code}' "$BASE_URL$route" || true)"
            printf '%s %s\n' "$code" "$route" | tee -a proof/beck/routes.txt
            if [ "$code" != "200" ]; then overall=false; fi
            case "$route" in
              *.json)
                if [ "$code" = "200" ]; then
                  cp /tmp/route.body "proof/beck/$(echo "$route" | tr '/' '_' | sed 's/^_//').json"
                  if ! node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!Array.isArray(d.products))process.exit(1)' "proof/beck/$(echo "$route" | tr '/' '_' | sed 's/^_//').json"; then
                    printf 'JSON_INVALID %s\n' "$route" | tee -a proof/beck/routes.txt
                    overall=false
                  fi
                fi
                ;;
            esac
          done
          if [ "$overall" = "true" ]; then
            node -e '
              const fs=require("fs");
              const files=["proof/beck/catalog.json","proof/beck/data_mtg-catalog.json"];
              for (const f of files) {
                if (!fs.existsSync(f)) process.exit(1);
                const d=JSON.parse(fs.readFileSync(f,"utf8"));
                const p=(d.products||[]).find(x=>x.id==="EDH_0001");
                if (!p || p.status==="published" || Object.prototype.hasOwnProperty.call(p,"price")) process.exit(2);
              }
            ' || overall=false
          fi
          printf 'overall=%s\n' "$overall" | tee -a proof/beck/routes.txt
          if [ "$overall" != "true" ]; then
            echo "Route or catalogue acceptance is not satisfied. No healing, deployment, issue creation, or payment action was attempted."
          fi

      - name: Upload read-only probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beck-read-only-route-health-${{ github.run_id }}
          path: proof/beck
          if-no-files-found: warn
          retention-days: 14

      - name: Fail closed when route acceptance is not satisfied
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^overall=true$' proof/beck/routes.txt || {
            echo 'Public route acceptance is not satisfied.'
            exit 1
          }
