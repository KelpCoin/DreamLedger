name: BECK Production Heartbeat

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  BASE_URL: https://dreamledger.org
  FOUNDING_OFFER_ID: OFFER-DREAMLEDGER-BILLBOARD-FOUNDING-001
  FOUNDING_PRICE_NZD: '50'
  FOUNDING_PAYMENT_LINK: https://buy.stripe.com/dRmbJ2cZi9eW4mk9La9oc02
  RENDER_SERVICE_ID: srv-d8ud55lckfvc73f1t4eg

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Probe production and write evidence
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/beck
          expected_sha="$(git rev-parse HEAD)"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

          health_http="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$BASE_URL/healthz" || true)"
          health_ok=false
          [ "$health_http" = '200' ] && health_ok=true

          version_http=000
          version_sha=''
          version_ok=false
          for attempt in $(seq 1 12); do
            version_payload="$(curl -sS --max-time 30 -w '\n%{http_code}' "$BASE_URL/version" || true)"
            version_http="$(printf '%s\n' "$version_payload" | tail -n1)"
            version_json="$(printf '%s\n' "$version_payload" | sed '$d')"
            if [ "$version_http" = '200' ]; then
              version_sha="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.commit||x.sha||x.version_sha||x.git_sha||""))' "$version_json" 2>/dev/null || true)"
              if [ "$version_sha" = "$expected_sha" ]; then
                version_ok=true
                break
              fi
            fi
            sleep 15
          done

          offers_http="$(curl -sS -o offers.json -w '%{http_code}' --max-time 30 "$BASE_URL/api/offers" || true)"
          offer_ok=false
          if [ "$offers_http" = '200' ]; then
            offer_ok="$(FOUNDING_OFFER_ID="$FOUNDING_OFFER_ID" FOUNDING_PRICE_NZD="$FOUNDING_PRICE_NZD" node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("offers.json","utf8")); const a=Array.isArray(x)?x:(x.offers||x.data||[]); const o=a.find(v=>(v.offer_id===process.env.FOUNDING_OFFER_ID||v.id===process.env.FOUNDING_OFFER_ID)); process.stdout.write(String(!!o && Number(o.price)===Number(process.env.FOUNDING_PRICE_NZD) && String(o.currency||"").toUpperCase()==="NZD" && o.checkout_available===true))')"
          fi

          checkout_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$FOUNDING_PAYMENT_LINK" || true)"
          checkout_ok=false
          [ "$checkout_code" = '200' ] && checkout_ok=true

          overall=false
          if $health_ok && $version_ok && $offer_ok && $checkout_ok; then overall=true; fi

          export EXPECTED_SHA="$expected_sha"
          export HEALTH_HTTP="$health_http"
          export VERSION_HTTP="$version_http"
          export LIVE_SHA="$version_sha"
          export OFFERS_HTTP="$offers_http"
          export CHECKOUT_CODE="$checkout_code"
          export HEALTH_OK="$health_ok"
          export VERSION_OK="$version_ok"
          export OFFER_OK="$offer_ok"
          export CHECKOUT_OK="$checkout_ok"
          export OVERALL="$overall"

          node -e '
            const fs=require("fs");
            const p={
              proof_type:"BECK_PRODUCTION_HEARTBEAT",
              checked_at:new Date().toISOString(),
              expected_main_sha:process.env.EXPECTED_SHA,
              production:{
                base_url:process.env.BASE_URL,
                health_http:Number(process.env.HEALTH_HTTP),
                version_http:Number(process.env.VERSION_HTTP),
                live_sha:process.env.LIVE_SHA||null,
                version_ok:process.env.VERSION_OK==="true",
                health_ok:process.env.HEALTH_OK==="true"
              },
              commerce_surface:{
                offers_http:Number(process.env.OFFERS_HTTP),
                founding_offer_id:process.env.FOUNDING_OFFER_ID,
                offer_ok:process.env.OFFER_OK==="true",
                checkout_http:Number(process.env.CHECKOUT_CODE),
                checkout_ok:process.env.CHECKOUT_OK==="true"
              },
              overall:process.env.OVERALL==="true",
              revenue_claimed_nzd:0
            };
            fs.writeFileSync("proof/beck/latest-production-heartbeat.json",JSON.stringify(p,null,2)+"\n");
            console.log(JSON.stringify(p,null,2));
          '

      - name: Self-heal production deployment drift
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RELEASE_SHA: ${{ steps.probe.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          proof='proof/beck/latest-production-heartbeat.json'
          test -s "$proof"
          version_ok="$(node -e "const x=require('./$proof'); console.log(String(x.production.version_ok))")"
          if [ "$version_ok" = 'true' ]; then
            echo 'Production already converged to expected main SHA.'
            exit 0
          fi
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo 'RENDER_API_KEY is not configured; cannot self-heal deployment drift.'
            exit 0
          fi
          echo "Production drift detected. Triggering exact Render deployment for $RELEASE_SHA."
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"commitId\":\"$RELEASE_SHA\",\"clearCache\":\"clear\"}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            > proof/beck/render-self-heal-response.json
          echo 'RENDER_SELF_HEAL_TRIGGERED=true' > proof/beck/render-self-heal-status.txt

      - name: Verify convergence after self-heal
        if: always()
        env:
          RELEASE_SHA: ${{ steps.probe.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s proof/beck/render-self-heal-status.txt ]; then
            echo 'No Render self-heal was triggered.'
            exit 0
          fi
          live_sha=''
          version_http='000'
          for attempt in $(seq 1 12); do
            payload="$(curl -sS --max-time 30 -w '\n%{http_code}' "$BASE_URL/version" || true)"
            version_http="$(printf '%s\n' "$payload" | tail -n1)"
            json="$(printf '%s\n' "$payload" | sed '$d')"
            if [ "$version_http" = '200' ]; then
              live_sha="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.commit||x.sha||x.version_sha||x.git_sha||""))' "$json" 2>/dev/null || true)"
              if [ "$live_sha" = "$RELEASE_SHA" ]; then
                break
              fi
            fi
            sleep 15
          done
          export LIVE_SHA="$live_sha"
          export VERSION_HTTP="$version_http"
          node -e '
            const fs=require("fs");
            const pPath="proof/beck/latest-production-heartbeat.json";
            const p=JSON.parse(fs.readFileSync(pPath,"utf8"));
            const expected=process.env.RELEASE_SHA;
            const live=process.env.LIVE_SHA;
            p.checked_at=new Date().toISOString();
            p.production.version_http=Number(process.env.VERSION_HTTP);
            p.production.live_sha=live||null;
            p.production.version_ok=Number(process.env.VERSION_HTTP)===200 && live===expected;
            p.overall=Boolean(p.production.health_ok && p.production.version_ok && p.commerce_surface.offer_ok && p.commerce_surface.checkout_ok);
            fs.writeFileSync(pPath,JSON.stringify(p,null,2)+"\n");
            console.log(JSON.stringify(p,null,2));
          '

      - name: Create one drift incident when unhealthy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          proof='proof/beck/latest-production-heartbeat.json'
          if [ -s "$proof" ]; then
            overall="$(node -e "const x=require('./$proof'); console.log(String(x.overall))")"
          else
            overall=false
          fi
          if [ "$overall" = 'true' ]; then
            echo 'Production heartbeat PASS; no incident required.'
            exit 0
          fi
          title="BECK production heartbeat failure: $(date -u +%Y-%m-%d)"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --limit 1 --json number,title)"
          if [ "$(node -e "const x=JSON.parse(process.argv[1]); console.log(x.length)" "$existing")" -gt 0 ]; then
            echo "INCIDENT_ALREADY_OPEN"
            exit 0
          fi
          body="Autonomous production heartbeat detected a failure. Expected main SHA: ${{ github.sha }}. Review workflow proof artifact and current production endpoints. No revenue is inferred from traffic or health alone."
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"

      - name: Upload heartbeat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beck-production-heartbeat-${{ github.run_id }}
          path: proof/beck
          if-no-files-found: warn
          retention-days: 30

      - name: Fail closed when production contract is not satisfied
        if: ${{ steps.probe.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          overall="$(node -e "const x=require('./proof/beck/latest-production-heartbeat.json'); console.log(String(x.overall))")"
          if [ "$overall" != 'true' ]; then
            echo 'BECK production contract not satisfied.'
            exit 1
          fi
