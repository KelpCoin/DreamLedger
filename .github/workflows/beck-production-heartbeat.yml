name: BECK Production Heartbeat

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: beck-production-heartbeat
  cancel-in-progress: true

env:
  BASE_URL: https://dreamledger.org
  FOUNDING_OFFER_ID: OFFER-DREAMLEDGER-BILLBOARD-FOUNDING-001
  FOUNDING_PRICE_NZD: '50'
  FOUNDING_PAYMENT_LINK: https://buy.stripe.com/dRmbJ2cZi9eW4mk9La9oc02

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Probe production and write evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/beck
          expected_sha="$(git rev-parse HEAD)"
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          health_http="000"
          version_http="000"
          offers_http="000"
          version_sha=""
          health_body=""
          offers_body=""
          version_ok=false
          health_ok=false
          offer_ok=false
          checkout_ok=false

          health_body="$(curl -sS --max-time 30 -w '\n%{http_code}' "$BASE_URL/healthz" || true)"
          health_http="$(printf '%s\n' "$health_body" | tail -n1)"
          health_body="$(printf '%s\n' "$health_body" | sed '$d')"
          if [ "$health_http" = '200' ]; then health_ok=true; fi

          for attempt in $(seq 1 12); do
            version_body="$(curl -sS --max-time 30 -w '\n%{http_code}' "$BASE_URL/version" || true)"
            version_http="$(printf '%s\n' "$version_body" | tail -n1)"
            version_json="$(printf '%s\n' "$version_body" | sed '$d')"
            if [ "$version_http" = '200' ]; then
              version_sha="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.commit||x.sha||x.version_sha||x.git_sha||""))' "$version_json" 2>/dev/null || true)"
              if [ "$version_sha" = "$expected_sha" ]; then
                version_ok=true
                break
              fi
            fi
            sleep 30
          done

          offers_body="$(curl -sS --max-time 30 -w '\n%{http_code}' "$BASE_URL/api/offers" || true)"
          offers_http="$(printf '%s\n' "$offers_body" | tail -n1)"
          offers_json="$(printf '%s\n' "$offers_body" | sed '$d')"
          if [ "$offers_http" = '200' ]; then
            offer_ok="$(node -e 'const x=JSON.parse(process.argv[1]); const a=Array.isArray(x)?x:(x.offers||x.data||[]); const o=a.find(v=>(v.offer_id===process.env.FOUNDING_OFFER_ID||v.id===process.env.FOUNDING_OFFER_ID)); process.stdout.write(String(!!o && Number(o.price)===Number(process.env.FOUNDING_PRICE_NZD) && String(o.currency||"").toUpperCase()==="NZD" && o.checkout_available===true))' "$offers_json")"
          fi

          checkout_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$FOUNDING_PAYMENT_LINK" || true)"
          if [ "$checkout_code" = '200' ]; then checkout_ok=true; fi

          overall=false
          if $health_ok && $version_ok && $offer_ok && $checkout_ok; then overall=true; fi

          node - <<'NODE'
          const fs = require('fs');
          const p = {
            proof_type: 'BECK_PRODUCTION_HEARTBEAT',
            checked_at: new Date().toISOString(),
            expected_main_sha: process.env.EXPECTED_SHA,
            production: {
              base_url: process.env.BASE_URL,
              health_http: Number(process.env.HEALTH_HTTP),
              version_http: Number(process.env.VERSION_HTTP),
              live_sha: process.env.LIVE_SHA || null,
              version_ok: process.env.VERSION_OK === 'true',
              health_ok: process.env.HEALTH_OK === 'true'
            },
            commerce_surface: {
              offers_http: Number(process.env.OFFERS_HTTP),
              founding_offer_id: process.env.FOUNDING_OFFER_ID,
              offer_ok: process.env.OFFER_OK === 'true',
              checkout_http: Number(process.env.CHECKOUT_CODE),
              checkout_ok: process.env.CHECKOUT_OK === 'true'
            },
            overall: process.env.OVERALL === 'true',
            revenue_claimed_nzd: 0
          };
          fs.writeFileSync('proof/beck/latest-production-heartbeat.json', JSON.stringify(p, null, 2)+'\n');
          console.log(JSON.stringify(p, null, 2));
          NODE
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEALTH_HTTP: ${{ env.HEALTH_HTTP }}
          VERSION_HTTP: ${{ env.VERSION_HTTP }}
          LIVE_SHA: ${{ env.VERSION_SHA }}
          OFFERS_HTTP: ${{ env.OFFERS_HTTP }}
          CHECKOUT_CODE: ${{ env.CHECKOUT_CODE }}
          HEALTH_OK: ${{ env.HEALTH_OK }}
          VERSION_OK: ${{ env.VERSION_OK }}
          OFFER_OK: ${{ env.OFFER_OK }}
          CHECKOUT_OK: ${{ env.CHECKOUT_OK }}
          OVERALL: ${{ env.OVERALL }}

      - name: Fail and create one drift incident when unhealthy
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="BECK production heartbeat failure: $(date -u +%Y-%m-%d)"
          body="Autonomous production heartbeat detected a failure. Expected main SHA: ${{ github.sha }}. Review workflow proof artifact and current production endpoints. No revenue is inferred from traffic or health alone."
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" || true

      - name: Upload heartbeat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beck-production-heartbeat-${{ github.run_id }}
          path: proof/beck/latest-production-heartbeat.json
          if-no-files-found: warn
          retention-days: 30
