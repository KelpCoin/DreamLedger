name: BECK Production Heartbeat

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: beck-production-heartbeat
  cancel-in-progress: true

env:
  BASE_URL: https://dreamledger.org
  FOUNDING_OFFER_ID: OFFER-DREAMLEDGER-BILLBOARD-FOUNDING-001
  FOUNDING_PRICE_NZD: '50'
  FOUNDING_PAYMENT_LINK: https://buy.stripe.com/dRmbJ2cZi9eW4mk9La9oc02

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Probe production, commerce surface, and write evidence
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p proof/beck
          node <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const base = process.env.BASE_URL;
          const expectedSha = process.env.EXPECTED_SHA || execSync('git rev-parse HEAD').toString().trim();
          const offerId = process.env.FOUNDING_OFFER_ID;
          const expectedPrice = Number(process.env.FOUNDING_PRICE_NZD);
          const paymentLink = process.env.FOUNDING_PAYMENT_LINK;

          async function get(url, options = {}) {
            try {
              const r = await fetch(url, { redirect: 'follow', ...options });
              const text = await r.text();
              return { ok: r.ok, status: r.status, url: r.url, text };
            } catch (error) {
              return { ok: false, status: 0, url, text: '', error: String(error?.message || error) };
            }
          }

          function parseJson(text) {
            try { return JSON.parse(text); } catch { return null; }
          }

          const health = await get(`${base}/healthz`);
          let version = { ok: false, status: 0, text: '', url: `${base}/version` };
          let liveSha = '';
          let versionOk = false;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            version = await get(`${base}/version`);
            const x = parseJson(version.text);
            liveSha = String(x?.commit ?? x?.sha ?? x?.version_sha ?? x?.git_sha ?? '');
            if (version.status === 200 && liveSha === expectedSha) {
              versionOk = true;
              break;
            }
            await new Promise(resolve => setTimeout(resolve, 30000));
          }

          const offers = await get(`${base}/api/offers`);
          let offerOk = false;
          const offerPayload = parseJson(offers.text);
          const offerRows = Array.isArray(offerPayload)
            ? offerPayload
            : (offerPayload?.offers || offerPayload?.data || []);
          const founding = offerRows.find(row =>
            (row?.offer_id === offerId || row?.id === offerId) &&
            Number(row?.price) === expectedPrice &&
            String(row?.currency || '').toUpperCase() === 'NZD' &&
            row?.checkout_available === true
          );
          if (offers.status === 200 && founding) offerOk = true;

          const checkout = await get(paymentLink);
          const checkoutOk = checkout.status >= 200 && checkout.status < 400;
          const overall = health.status === 200 && versionOk && offerOk && checkoutOk;

          const proof = {
            proof_type: 'BECK_PRODUCTION_HEARTBEAT',
            checked_at: new Date().toISOString(),
            expected_main_sha: expectedSha,
            production: {
              base_url: base,
              health_http: health.status,
              version_http: version.status,
              live_sha: liveSha || null,
              version_ok: versionOk,
              health_ok: health.status === 200
            },
            commerce_surface: {
              offers_http: offers.status,
              founding_offer_id: offerId,
              offer_ok: offerOk,
              checkout_http: checkout.status,
              checkout_ok: checkoutOk
            },
            overall,
            revenue_claimed_nzd: 0,
            revenue_rule: 'No revenue is inferred from health, traffic, checkout availability, or intent.'
          };

          fs.writeFileSync('proof/beck/latest-production-heartbeat.json', JSON.stringify(proof, null, 2) + '\n');
          console.log(JSON.stringify(proof, null, 2));
          if (!overall) process.exit(1);
          NODE

      - name: Create one open drift incident when heartbeat fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="BECK production heartbeat failure"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "BECK production heartbeat failure"' --limit 1 --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            echo "Existing heartbeat incident #$existing"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "BECK detected a production heartbeat failure. Expected main SHA: ${{ github.sha }}. Inspect the workflow artifact for exact endpoint evidence. No revenue is inferred from this failure or from traffic alone."
          fi

      - name: Upload heartbeat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beck-production-heartbeat-${{ github.run_id }}
          path: proof/beck/latest-production-heartbeat.json
          if-no-files-found: warn
          retention-days: 30
