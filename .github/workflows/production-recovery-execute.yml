name: Production Recovery Execute

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamledger-production-recovery-execute
  cancel-in-progress: false

jobs:
  compile-and-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: BEC-PRIME
        run: npm install
      - name: Compile production surface
        working-directory: BEC-PRIME
        run: npm run compile
      - name: Verify account pages
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          test -f compiled/website/login.html
          test -f compiled/website/register.html
          test -f compiled/website/account.html
          grep -q '/api/account/login' compiled/website/login.html
          grep -q '/api/account/register' compiled/website/register.html
          ! grep -q '/api/dreamiez/account/login' compiled/website/login.html
          node --check start.js
          node --check routes/auth.js
          node --check lib/authRuntimePreload.js
      - name: Run real local account contract
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          export PORT=4317
          export NODE_ENV=test
          export DREAMIEZ_DATA_DIR="$RUNNER_TEMP/dreamledger-data"
          mkdir -p "$DREAMIEZ_DATA_DIR"
          node -r ./lib/authRuntimePreload.js -r ./lib/publicShellPreload.js -r ./lib/m2mPreload.js -r ./lib/qrPreload.js -r ./lib/liveRouteCompatibility.js -r ./lib/marketplacePreload.js start.js > "$RUNNER_TEMP/dreamledger-runtime.log" 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4317/healthz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          EMAIL="ci-${GITHUB_RUN_ID}@example.invalid"
          REGISTER=$(curl -fsS -c "$RUNNER_TEMP/cookies.txt" -H 'Content-Type: application/json' -X POST http://127.0.0.1:4317/api/account/register -d "{\"name\":\"CI Auth Gate\",\"email\":\"$EMAIL\",\"password\":\"CI-Password-123!\"}")
          echo "$REGISTER"
          echo "$REGISTER" | grep -q '"ok":true'
          LOGIN=$(curl -fsS -b "$RUNNER_TEMP/cookies.txt" -c "$RUNNER_TEMP/cookies.txt" -H 'Content-Type: application/json' -X POST http://127.0.0.1:4317/api/account/login -d "{\"email\":\"$EMAIL\",\"password\":\"CI-Password-123!\"}")
          echo "$LOGIN"
          echo "$LOGIN" | grep -q '"ok":true'
          ME=$(curl -fsS -b "$RUNNER_TEMP/cookies.txt" http://127.0.0.1:4317/api/account/me)
          echo "$ME"
          echo "$ME" | grep -q '"authenticated":true'
          echo 'PASS: local registration, login, session and account contract verified.'
      - name: Upload local proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dreamledger-local-auth-proof-${{ github.sha }}
          path: ${{ runner.temp }}/dreamledger-runtime.log
          if-no-files-found: ignore
          retention-days: 30

  deploy-and-live-acceptance:
    if: github.event_name != 'pull_request'
    needs: compile-and-auth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for Render auto-deploy convergence
        id: live_deploy
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            echo "convergence_attempt=$attempt/60"
            status=$(curl -sS -o /tmp/version.json -w '%{http_code}' --max-time 20 https://dreamledger.org/version || true)
            cat /tmp/version.json 2>/dev/null || true
            if [ "$status" = "200" ]; then
              commit=$(python3 - <<'PY'
          import json
          try:
              with open('/tmp/version.json', 'r', encoding='utf-8') as f:
                  print(json.load(f).get('commit', ''))
          except Exception:
              print('')
          PY
              )
              if [ "$commit" = "$EXPECTED_COMMIT" ]; then
                echo "PASS: Render converged to $EXPECTED_COMMIT"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "FAIL: Render did not converge to $EXPECTED_COMMIT"
          exit 1
      - name: Require production health
        id: live_health
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/healthz.json -w '%{http_code}' --max-time 20 https://dreamledger.org/healthz)
          echo "health_http=$status"
          cat /tmp/healthz.json
          test "$status" = "200"
      - name: Verify deployed commit provenance
        id: deployed_provenance
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/version.json -w '%{http_code}' --max-time 20 https://dreamledger.org/version)
          echo "version_http=$status"
          cat /tmp/version.json
          test "$status" = "200"
          python3 - "$GITHUB_SHA" <<'PY'
          import json, sys
          expected = sys.argv[1]
          with open('/tmp/version.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          deployed = data.get('commit') or data.get('sha')
          if deployed != expected:
              raise SystemExit(f'FAIL: deployed SHA {deployed} != source SHA {expected}')
          if data.get('surface') != 'public-v6':
              raise SystemExit(f"FAIL: unexpected surface {data.get('surface')}")
          print(f'PASS: deployed SHA and surface verified for {expected}')
          PY
      - name: Verify production commerce surface
        id: live_commerce
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://dreamledger.org"
          products_code=$(curl -sS -o /tmp/products.json -w '%{http_code}' --max-time 20 "$BASE/api/products")
          echo "products_http=$products_code"
          cat /tmp/products.json
          test "$products_code" = "200"
          python3 - <<'PY'
          import json
          with open('/tmp/products.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          products = data.get('products')
          if not isinstance(products, list):
              raise SystemExit('FAIL: products array missing')
          billboard = next((p for p in products if p.get('id') == 'BILLBOARD-LARGE'), None)
          if billboard is None:
              raise SystemExit('FAIL: BILLBOARD-LARGE missing')
          if float(billboard.get('price', 0)) != 50:
              raise SystemExit('FAIL: BILLBOARD-LARGE price is not 50')
          if str(billboard.get('currency', '')).upper() != 'NZD':
              raise SystemExit('FAIL: BILLBOARD-LARGE currency is not NZD')
          if billboard.get('checkout_available') is not True:
              raise SystemExit('FAIL: BILLBOARD-LARGE checkout not available')
          diagnostic = next((p for p in products if p.get('id') == 'COMMANDER-DECK-DIAGNOSTIC-001'), None)
          if diagnostic is not None and diagnostic.get('checkout_available') is not True:
              raise SystemExit('FAIL: diagnostic checkout not available')
          print('PASS: public commerce catalogue verified')
          PY
          for path in / /billboard /mtg /sitemap.xml /robots.txt; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$path")
            echo "$code $path"
            test "$code" = "200"
          done
      - name: Verify production account pages
        id: live_accounts
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://dreamledger.org/login.html >/tmp/login.html
          curl -fsS --max-time 15 https://dreamledger.org/register.html >/tmp/register.html
          grep -q '/api/account/login' /tmp/login.html
          grep -q '/api/account/register' /tmp/register.html
          ! grep -q '/api/dreamiez/account/login' /tmp/login.html
          echo 'PASS: production login/register surfaces are present and correctly wired.'
      - name: Write immutable machine proof
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.live_deploy.outcome }}
          HEALTH_OUTCOME: ${{ steps.live_health.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.deployed_provenance.outcome }}
          COMMERCE_OUTCOME: ${{ steps.live_commerce.outcome }}
          ACCOUNTS_OUTCOME: ${{ steps.live_accounts.outcome }}
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 - <<'PY'
          import json, os, time
          keys = ['DEPLOY_OUTCOME','HEALTH_OUTCOME','PROVENANCE_OUTCOME','COMMERCE_OUTCOME','ACCOUNTS_OUTCOME']
          gates = {k: os.environ.get(k, 'unknown') for k in keys}
          status = 'PASS' if all(v == 'success' for v in gates.values()) else 'FAIL'
          proof = {
              'commit_sha': os.environ['GITHUB_SHA'],
              'workflow': os.environ['GITHUB_WORKFLOW'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'target': 'https://dreamledger.org',
              'timestamp_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'gates': gates,
              'status': status
          }
          with open('proof/deployment-proof.json', 'w', encoding='utf-8') as f:
              json.dump(proof, f, indent=2)
          print(json.dumps(proof, indent=2))
          if status != 'PASS':
              raise SystemExit('FAIL: one or more production gates did not pass')
          PY
      - name: Upload production proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dreamledger-production-recovery-${{ github.sha }}
          path: proof/deployment-proof.json
          if-no-files-found: error
          retention-days: 30
