name: DreamLedger E-Commerce Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commerce-and-storefront-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: BEC-PRIME
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BEC-PRIME/package-lock.json

      - name: Install runtime dependencies
        run: npm ci --omit=dev

      - name: Assert committed customer storefront
        shell: bash
        run: |
          set -euo pipefail
          test -f compiled/website/index.html
          grep -q 'DreamMee' compiled/website/index.html
          grep -q 'Find something good' compiled/website/index.html
          grep -q 'id="new"' compiled/website/index.html
          grep -q 'id="magic"' compiled/website/index.html
          grep -q 'id="digital"' compiled/website/index.html
          grep -q 'class="rail"' compiled/website/index.html
          grep -q 'Pioneer product' compiled/website/index.html
          grep -q 'href="/billboard"' compiled/website/index.html
          ! grep -Eiq 'Gauntlet|Economic Court|Truth Oracle|ELOHIM|BrownEye Cortex|BEC-PRIME|AMPLISSA|COLLECTORSCOAST|SUPABASE_SERVICE_ROLE|STRIPE_SECRET|STRIPE_WEBHOOK|RA_000001' compiled/website/index.html

      - name: Start runtime
        env:
          PORT: 4173
        run: |
          set -euo pipefail
          npm start > /tmp/dreamledger.log 2>&1 &
          echo $! > /tmp/dreamledger.pid
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/tmp/home.html
          curl -fsS http://127.0.0.1:4173/api/products >/tmp/products.json

      - name: Run customer and commerce gate
        run: node scripts/verify-storefront-ux.js

      - name: Dump runtime log on failure
        if: failure()
        run: cat /tmp/dreamledger.log || true
