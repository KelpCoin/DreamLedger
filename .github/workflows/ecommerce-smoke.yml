name: DreamLedger E-Commerce Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commerce-and-storefront-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Compile customer storefront from canonical registry
        run: node ../BEC-PRIME/compiler/WebsiteFaceCompiler.js

      - name: Assert compiled customer storefront
        shell: bash
        run: |
          set -euo pipefail
          test -s home.html
          test -s quote-comparison/index.html
          test -s server.js
          grep -qi 'Evidence-first commerce' home.html
          grep -qi 'Make the next decision' home.html
          grep -qi 'Truth Oracle' home.html
          if grep -Eqi 'Delivery Proof Audit|agent-delivery-proof-audit' home.html quote-comparison/index.html; then
            echo 'RETIRED_AUDIT_RESIDUE=FAIL'
            exit 1
          fi
          grep -Eq 'href="(https://dreamledger.org)?/quote-comparison/' home.html
          grep -q 'href="/trust/"' home.html
          if grep -Ein 'Gauntlet|Economic Court|ELOHIM|BrownEye Cortex|AMPLISSA|COLLECTORSCOAST|SUPABASE_SERVICE_ROLE|STRIPE_SECRET|STRIPE_WEBHOOK|RA_000001' home.html quote-comparison/index.html; then
            echo 'PUBLIC_COPY_SCAN=FAIL'
            exit 1
          else
            echo 'PUBLIC_COPY_SCAN=PASS'
          fi
          echo 'SOURCE_STOREFRONT=PASS'

      - name: Start runtime
        env:
          PORT: 4173
        run: |
          set -euo pipefail
          npm start > /tmp/dreamledger.log 2>&1 &
          echo $! > /tmp/dreamledger.pid
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/healthz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/dreamledger.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:4173/ >/tmp/home.html
          curl -fsS http://127.0.0.1:4173/api/products >/tmp/products.json
          grep -qi 'Make the next decision' /tmp/home.html
          grep -Eq 'href="(https://dreamledger.org)?/quote-comparison/' /tmp/home.html
          grep -q '"products"' /tmp/products.json
          echo 'LOCAL_STOREFRONT_RUNTIME=PASS'

      - name: Run customer and commerce gate
        run: node ../BEC-PRIME/scripts/verify-storefront-ux.js

      - name: Dump runtime log on failure
        if: failure()
        run: cat /tmp/dreamledger.log || true
