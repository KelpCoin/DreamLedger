name: DreamLedger E-Commerce Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commerce-and-storefront-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Assert committed customer storefront
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s billboard.html
          test -s avatar.html
          test -s server.js
          grep -qi 'AVATAR ACCESSORIES' index.html
          grep -qi 'DIGITAL BILLBOARDS' index.html
          grep -qi 'Make your avatar yours' index.html
          grep -qi 'Put your message on a billboard' index.html
          grep -q 'href="/avatar"' index.html
          grep -q 'href="/billboard"' index.html
          ! grep -Eiq 'BECK|Gauntlet|Economic Court|Truth Oracle|ELOHIM|BrownEye Cortex|BEC-PRIME|AMPLISSA|COLLECTORSCOAST|SUPABASE_SERVICE_ROLE|STRIPE_SECRET|STRIPE_WEBHOOK|RA_000001' index.html billboard.html avatar.html server.js
          echo 'SOURCE_STOREFRONT=PASS'

      - name: Start runtime
        env:
          PORT: 4173
        run: |
          set -euo pipefail
          npm start > /tmp/dreamledger.log 2>&1 &
          echo $! > /tmp/dreamledger.pid
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/tmp/home.html
          curl -fsS http://127.0.0.1:4173/api/products >/tmp/products.json
          grep -qi 'AVATAR ACCESSORIES' /tmp/home.html
          grep -qi 'DIGITAL BILLBOARDS' /tmp/home.html
          grep -qi 'Make your avatar yours' /tmp/home.html
          grep -qi 'Put your message on a billboard' /tmp/home.html
          grep -q '"products"' /tmp/products.json
          echo 'LOCAL_STOREFRONT_RUNTIME=PASS'

      - name: Run customer and commerce gate
        run: node ../BEC-PRIME/scripts/verify-storefront-ux.js

      - name: Dump runtime log on failure
        if: failure()
        run: cat /tmp/dreamledger.log || true
