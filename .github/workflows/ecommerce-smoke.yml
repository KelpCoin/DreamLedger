name: DreamLedger E-Commerce Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compile-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BEC-PRIME/package.json

      - name: Install
        working-directory: BEC-PRIME
        run: npm install

      - name: Compile canonical commerce surface
        working-directory: BEC-PRIME
        run: npm run compile

      - name: Assert neutral DreamLedger surface
        working-directory: BEC-PRIME
        shell: bash
        run: |
          test -f compiled/website/index.html
          grep -q "ONE HOST." compiled/website/index.html
          grep -q "MANY WORLDS." compiled/website/index.html
          ! grep -Eiq "magic the gathering|mtg shop|commander deck" compiled/website/index.html
          test -f PROOF-CUBE-SURFACE-COMPILATION.json

      - name: Start runtime
        working-directory: BEC-PRIME
        env:
          PORT: 4173
        run: |
          npm start > /tmp/dreamledger.log 2>&1 &
          echo $! > /tmp/dreamledger.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/api/offers > /tmp/offers.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ > /tmp/home.html
          cat /tmp/offers.json

      - name: Assert phantom AI offers absent
        shell: bash
        run: |
          ! grep -Eiq 'AGENTIC-COMMERCE-READINESS-001|BEC-PRIME-ARCHITECTURE-AUDIT|BEC-SURFACE-AUDIT|CREATOR-AUDIO-LAUNCH-PACK|CRYPTO-WALLET-SECURITY-PACK' /tmp/offers.json
          ! grep -Eiq 'checkout_available[^,}]*true|"checkout_enabled"[^,}]*true' /tmp/offers.json

      - name: Dump runtime log on failure
        if: failure()
        run: cat /tmp/dreamledger.log || true
