name: Intent-to-Pay Sentinel

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */2 * * *'
  push:
    paths:
      - 'ops/demand/intent_sentinel.py'
      - '.github/workflows/intent-to-pay-sentinel.yml'

permissions:
  contents: write

concurrency:
  group: intent-to-pay-sentinel
  cancel-in-progress: true

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run intent sentinel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INTENT_MAX_RESULTS: '100'
        run: python3 ops/demand/intent_sentinel.py

      - name: Validate proof artifact
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('ops/demand/intent_latest.json')
          x = json.loads(p.read_text(encoding='utf-8'))
          required = ['schema_version','generated_at','source_policy','does_not_claim_revenue','observations','hypothesis_summary','errors']
          missing = [k for k in required if k not in x]
          if missing:
              raise SystemExit('missing fields: ' + ','.join(missing))
          if x['does_not_claim_revenue'] is not True:
              raise SystemExit('revenue truth guard failed')
          print(json.dumps({'status':'PASS','observations':len(x['observations']),'errors':len(x['errors'])}, indent=2))
          PY

      - name: Publish sentinel state
        run: |
          git config user.name 'dreamledger-intent-sentinel[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/demand/intent_latest.json
          if git diff --cached --quiet; then
            echo 'No sentinel changes.'
            exit 0
          fi
          git commit -m 'chore: refresh intent-to-pay sentinel'
          git push
