name: BEC Economic Bridge Health

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bec-economic-bridge-health
  cancel-in-progress: true

jobs:
  production-health:
    name: Verify Render economic bridge surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://dreamledger.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify production version
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 2 --connect-timeout 10 "$BASE_URL/version" > version.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('version.json').read_text())
          assert data.get('service') == 'dreamledger-storefront'
          assert data.get('commit')
          print('PRODUCTION_VERSION=PASS')
          print('commit='+str(data['commit']))
          PY
      - name: Verify storefront health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 2 --connect-timeout 10 "$BASE_URL/healthz" > health.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('health.json').read_text())
          assert data.get('ok') is True, data
          print('STOREFRONT_HEALTH=PASS')
          PY
      - name: Verify live commerce discovery
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 2 --connect-timeout 10 "$BASE_URL/api/offers" > offers.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('offers.json').read_text())
          offers=data.get('offers',[])
          assert offers, 'no public offers'
          assert any(x.get('product_id') == 'COMMANDER-DECK-DIAGNOSTIC-001' for x in offers)
          print('COMMERCE_DISCOVERY=PASS')
          print('offers='+str(len(offers)))
          PY
      - name: Verify Agent Bridge manifest is published
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 2 --connect-timeout 10 "$BASE_URL/agent.json" > agent.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('agent.json').read_text())
          assert data.get('schema') == 'dreamledger/agent/v2'
          assert data.get('bridge',{}).get('status') == 'governed'
          assert data.get('bridge',{}).get('runtime_rail')
          print('AGENT_BRIDGE_MANIFEST=PASS')
          PY
      - name: Emit bridge health proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          proof={'schema':'dreamledger/bec-economic-bridge-health/v1','status':'PASS','timestamp_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'commit':os.environ.get('GITHUB_SHA'),'production_executor':'Render','github_role':'deployment_and_health_verification','economic_truth':'GitHub health is not revenue; only independently verified settled external payment plus fulfillment counts.','secret_boundary':'Production executor credentials remain outside GitHub health verification.'}
          Path('proof/BEC-ECONOMIC-BRIDGE-HEALTH.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          PY
      - name: Upload bridge health proof
        uses: actions/upload-artifact@v4
        with:
          name: bec-economic-bridge-health-${{ github.run_id }}
          path: proof/BEC-ECONOMIC-BRIDGE-HEALTH.json
          if-no-files-found: error
