name: BEC-PRIME Autonomous Operator

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  actions: read

jobs:
  operator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BEC-PRIME/package-lock.json

      - name: Install
        working-directory: BEC-PRIME
        run: npm ci --ignore-scripts

      - name: Compile
        working-directory: BEC-PRIME
        run: npm run compile

      - name: Verify canonical approved offer
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const approved = JSON.parse(fs.readFileSync('catalog/offers/approved.json','utf8'));
          if (!Array.isArray(approved.approved) || approved.approved.length < 1) throw new Error('No approved offer exists');
          const billboard = approved.approved.find(x => x.offer_id === 'OFFER-DREAMLEDGER-BILLBOARD-FOUNDING-001');
          if (!billboard) throw new Error('Canonical approved billboard offer missing');
          if (Number(billboard.price) !== 50 || String(billboard.currency).toUpperCase() !== 'NZD') throw new Error('Canonical billboard price/currency mismatch');
          if (billboard.payment_link_status !== 'ACTIVE_LIVEMODE') throw new Error('Canonical billboard checkout is not marked ACTIVE_LIVEMODE');
          if (billboard.payment_link_url !== 'https://buy.stripe.com/dRmbJ2cZi9eW4mk9La9oc02') throw new Error('Canonical billboard payment link mismatch');
          if (billboard.fulfillment_route !== 'supabase_billboard_webhook -> finite_allocation -> manual_review -> publication') throw new Error('Billboard fulfillment route mismatch');
          if (billboard.constraints.includes('DreamLedger silo only') !== true) throw new Error('Billboard silo isolation constraint missing');
          console.log(JSON.stringify({offer_id: billboard.offer_id, price: billboard.price, currency: billboard.currency, checkout: billboard.payment_link_status, silo: billboard.silo}, null, 2));
          NODE

      - name: Verify silo boundaries
        working-directory: BEC-PRIME
        run: npm run verify:silos

      - name: Verify commercial integration
        working-directory: BEC-PRIME
        run: npm run verify:integration

      - name: Verify production contract
        working-directory: BEC-PRIME
        run: npm run verify:production-contract

      - name: Write operator proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/autonomous
          cat > proof/autonomous/AUTONOMOUS_OPERATOR_PROOF.json <<JSON
          {
            "schema": "BEC-PRIME/AUTONOMOUS-OPERATOR/v2",
            "status": "PASS",
            "execution": "GitHub-hosted-runner",
            "pc_required": false,
            "commercial_gate": "OFFER-DREAMLEDGER-BILLBOARD-FOUNDING-001",
            "payment_claimed": false,
            "payment_verified": false,
            "external_action_performed": false,
            "silo_isolation_checked": true,
            "production_contract_checked": true,
            "next_external_gate": "real_external_payment"
          }
          JSON
          cat proof/autonomous/AUTONOMOUS_OPERATOR_PROOF.json

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: bec-prime-autonomous-operator-proof
          path: proof/autonomous/AUTONOMOUS_OPERATOR_PROOF.json
