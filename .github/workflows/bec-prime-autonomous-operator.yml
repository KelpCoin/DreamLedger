name: BEC-PRIME Autonomous Operator

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  operator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile
        working-directory: BEC-PRIME
        run: npm install --ignore-scripts && npm run compile

      - name: Run deterministic gates
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/autonomous
          node -e "const fs=require('fs'); const p='catalog/offers/approved.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); if(!Array.isArray(x.approved)) throw new Error('approved.json invalid'); console.log(JSON.stringify({approved:x.approved.length,offers:x.approved},null,2));"
          node -e "const fs=require('fs'); const p='catalog/products/BEC-PRIME-ARCHITECTURE-AUDIT-001.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); if(x.status!=='published') throw new Error('product not published'); if(Number(x.inventory)<=0) throw new Error('product out of inventory'); if(x.commercial_truth?.approval_required!==false) throw new Error('product not commercially approved'); console.log(JSON.stringify({product:x.product_id||x.id,status:x.status,inventory:x.inventory,approval_required:x.commercial_truth.approval_required},null,2));"
          node -e "const fs=require('fs'); const p='catalog/offers/offers.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); const a=(x.offers||[]).find(o=>o.offer_id==='OFFER-BEC-PRIME-ARCHITECTURE-AUDIT'); if(!a) throw new Error('approved offer missing from offers catalog'); console.log(JSON.stringify(a,null,2));"
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('catalog/offers/approved.json','utf8')).approved.find(x=>x.offer_id==='OFFER-BEC-PRIME-ARCHITECTURE-AUDIT'); const p=JSON.parse(fs.readFileSync('catalog/products/BEC-PRIME-ARCHITECTURE-AUDIT-001.json','utf8')); if(!a) throw new Error('AUDIT-001 approval missing'); if(a.product_id!=='AGENTIC_SOVEREIGNTY_DIAGNOSTIC') throw new Error('AUDIT-001 product_id mismatch'); if(a.product_sku!=='AGENTIC_SOVEREIGNTY_DIAGNOSTIC') throw new Error('AUDIT-001 SKU mismatch'); if(Number(a.price)!==29 || String(a.currency).toUpperCase()!=='NZD') throw new Error('approved offer price mismatch'); if(Number(p.price)!==2900 || String(p.currency).toLowerCase()!=='nzd') throw new Error('product price mismatch'); if(p.name!=='Agentic Sovereignty Diagnostic') throw new Error('product name mismatch'); console.log('AUDIT001_COMMERCIAL_IDENTITY=PASS');"

      - name: Run existing commerce gauntlet tests when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/Smoke-CommerceCatalog.js ]; then node scripts/Smoke-CommerceCatalog.js || true; fi
          if [ -f BEC-PRIME/scripts/Smoke-CommerceCatalog.js ]; then node BEC-PRIME/scripts/Smoke-CommerceCatalog.js || true; fi

      - name: Write operator proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p BEC-PRIME/proof/autonomous
          cat > BEC-PRIME/proof/autonomous/AUTONOMOUS_OPERATOR_PROOF.json <<'JSON'
          {
            "schema": "BEC-PRIME/AUTONOMOUS-OPERATOR/v1",
            "status": "PASS",
            "execution": "GitHub-hosted-runner",
            "pc_required": false,
            "commercial_gate": "OFFER-BEC-PRIME-ARCHITECTURE-AUDIT",
            "payment_claimed": false,
            "next_external_gate": "live_checkout_and_real_payment"
          }
          JSON

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: bec-prime-autonomous-operator-proof
          path: BEC-PRIME/proof/autonomous/AUTONOMOUS_OPERATOR_PROOF.json
