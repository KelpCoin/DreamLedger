name: 777 Economic Search Loop

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      authorize_commerce_handoff:
        description: "Owner authorization for Supabase commerce handoff (no schedule permission)"
        type: boolean
        default: false
        required: false
      authorize_economic_activation:
        description: "Separate owner authorization for runtime activation (no schedule permission)"
        type: boolean
        default: false
        required: false
  pull_request:
    paths:
      - ".github/workflows/777-economic-search.yml"
      - "ops/cube/test-777-offline.py"
  push:
    branches: ["main"]
    paths:
      - "BEC-PRIME/scripts/Run-777.js"
      - "BEC-PRIME/scripts/777-public-market-radar.py"
      - "BEC-PRIME/economic/EconomicEvidenceLadder.js"
      - "BEC-PRIME/economic/EconomicEvidenceLadder.test.js"
      - "BEC-PRIME/scripts/economic-local-worker.js"
      - "BEC-PRIME/scripts/economic-local-worker.test.js"
      - "runtime/humanizer/**"
      - ".github/workflows/777-economic-search.yml"

permissions:
  contents: read

concurrency:
  group: dreamledger-777
  cancel-in-progress: true

jobs:
  offline-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove fail-closed schedule and independent private compiler
        run: |
          python3 ops/cube/test-777-offline.py -v
          node BEC-PRIME/scripts/Run-777.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('BEC-PRIME/data/777/777-LATEST.json').read_text())
          assert report.get('truth') is not None
          assert not report.get('buyer_signal_gate',{}).get('external_action_performed', True)
          assert report.get('commerce_handoff',{}).get('lifecycle_state') != 'EXTERNAL_ACTION_PERFORMED'
          print('PRIVATELY_COMPILED_777_WITHOUT_SUPABASE=PASS')
          print('EXTERNAL_ACTION=NOT_PERFORMED')
          PY

  preflight:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      supabase_online: ${{ steps.check.outputs.online }}
    steps:
      - name: Check source availability without writing data
        id: check
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          # Failure to reach Supabase blocks only Supabase-backed actions.
          # Read-only public research and factory compilation run independently.
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "online=false" >> "$GITHUB_OUTPUT"
            echo "::warning::777_SOURCE_DEGRADED: Supabase credentials unavailable. Private research continues."
            exit 0
          fi
          code="$(curl --max-time 15 --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/" || true)"
          if [ "$code" = "200" ]; then
            echo "online=true" >> "$GITHUB_OUTPUT"
            echo "777_SOURCE=AVAILABLE"
          else
            echo "online=false" >> "$GITHUB_OUTPUT"
            echo "::warning::777_SOURCE_DEGRADED: status=${code:-NO_RESPONSE}; private compilation continues, remote writes blocked."
          fi

  search:
    needs: preflight
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_ONLINE: ${{ needs.preflight.outputs.supabase_online }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify permanent Humanizer boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from runtime.humanizer.output_boundary import prepare_output
          result = prepare_output("Plain text for a bounded review.")
          assert result["humanizer_authority"] == "NON_AUTHORITATIVE"
          assert result["economic_truth_effect"] == "NONE"
          assert result["external_action_effect"] == "NONE"
          assert result["ready_for_gauntlet_review"] is True
          print("HUMANIZER_BOUNDARY=PASS")
          PY

      - name: Test local LM Studio economic worker contract
        run: node --test BEC-PRIME/scripts/economic-local-worker.test.js

      - name: Refresh public demand radar
        run: |
          if [ "$SUPABASE_ONLINE" = "true" ]; then
            if ! npm run cube:radar; then
              echo "::warning::CUBE_RADAR=DEGRADED_SUPABASE_QUERY; private 777 compiles continue."
            fi
          else
            echo "::warning::CUBE_RADAR=BLOCKED_SUPABASE_UNAVAILABLE. Continuing 777 public discovery and local compiler."
          fi

      - name: Refresh quote-normalization buyer-signal radar
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            minute="$(date -u +%M)"
            minute_num=$((10#$minute))
            if [ $((minute_num % 30)) -ge 5 ]; then
              echo "QUOTE_RADAR=SKIPPED_BY_30_MINUTE_DISCOVERY_CADENCE"
              exit 0
            fi
          fi
          python3 BEC-PRIME/scripts/777-public-market-radar.py

      - name: Compile opportunity corpus
        run: npm run compile:opportunities

      - name: Compile bidirectional Factory queue
        run: npm run compile:factory-factory

      - name: Test economic evidence ladder
        run: node --test BEC-PRIME/economic/EconomicEvidenceLadder.test.js

      - name: Record existing Supabase economic heartbeat
        if: needs.preflight.outputs.supabase_online == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if curl --fail --silent --show-error --max-time 30 -X POST "$SUPABASE_URL/functions/v1/economic-radar-heartbeat" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" \
            | tee economic-radar-heartbeat.json && grep -q '"ok":true' economic-radar-heartbeat.json; then
            echo "ECONOMIC_RADAR_HEARTBEAT=PASS"
          else
            echo "::warning::ECONOMIC_RADAR_HEARTBEAT=BLOCKED_UPSTREAM; no evidence of Supabase persistence."
          fi

      - name: Run 777 search
        run: node BEC-PRIME/scripts/Run-777.js

      - name: Bridge 777 acceptance into commerce substrate
        if: github.event_name == 'workflow_dispatch' && inputs.authorize_commerce_handoff == true && needs.preflight.outputs.supabase_online == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://wbwgroygjeyukkspnqiy.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "777_HANDOFF=BLOCKED_MISSING_SUPABASE_RUNTIME_SECRETS"
            echo "No handoff was sent. Internal search may continue, but runtime state was not written."
            exit 0
          fi
          node - <<'NODE'
          const fs=require('fs');
          const https=require('https');
          const handoff=require('./BEC-PRIME/data/777/777-LATEST.json').commerce_handoff;
          if(!handoff || handoff.lifecycle_state!=='COMMERCE_READY') {
            console.log('777_HANDOFF=NOT_READY');
            process.exit(0);
          }
          const body=JSON.stringify({p_handoff:handoff});
          const url=new URL(process.env.SUPABASE_URL+'/rest/v1/rpc/ingest_777_commerce_handoff');
          const req=https.request(url,{method:'POST',headers:{
            apikey:process.env.SUPABASE_SERVICE_ROLE_KEY,
            Authorization:'Bearer '+process.env.SUPABASE_SERVICE_ROLE_KEY,
            'Content-Type':'application/json',
            Prefer:'return=representation'
          }},res=>{
            let data=''; res.on('data',x=>data+=x); res.on('end',()=>{
              process.stdout.write(data+'\\n');
              if(res.statusCode>=300) process.exit(1);
              fs.writeFileSync('777-commerce-handoff-result.json',data+'\\n');
            });
          });
          req.on('error',e=>{console.error(e);process.exit(1)});
          req.write(body); req.end();
          NODE

      - name: Run economic activation from 777 handoff
        if: github.event_name == 'workflow_dispatch' && inputs.authorize_economic_activation == true && needs.preflight.outputs.supabase_online == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://wbwgroygjeyukkspnqiy.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ECONOMIC_ACTIVATION=BLOCKED_MISSING_SUPABASE_RUNTIME_SECRETS"
            echo "No runtime activation was attempted; do not infer a worker heartbeat or external effect."
            exit 0
          fi
          curl -fsS --max-time 120 -X POST "$SUPABASE_URL/functions/v1/economic-activation" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{}' | tee 777-economic-activation.json
          node -e 'const x=require("./777-economic-activation.json"); if(x.ok!==true) process.exit(1); console.log(JSON.stringify({seeded:x.seeded,claimed:x.claimed,results:x.results,external_action_performed:x.external_action_performed,revenue_claimed:x.revenue_claimed},null,2));'

      - name: Compile universal economic cells
        run: npm run factory:universal

      - name: Verify factory cycle
        run: npm run verify:factory-factory-cycle

      - name: Record source degradation and action boundary
        shell: bash
        run: |
          {
            echo "## 777 cloud autonomy boundary"
            echo "SUPABASE_SOURCE_ONLINE=$SUPABASE_ONLINE"
            echo "PRIVATE_DISCOVERY=ALLOWED_WITHOUT_SUPABASE"
            echo "COMMERCE_WRITES=DISABLED_ON_SCHEDULE"
            echo "ECONOMIC_ACTIVATION=DISABLED_ON_SCHEDULE"
            echo "MERCHANT_PAYMENT_AND_FULFILLMENT=NOT_ESTABLISHED_BY_THIS_RUN"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Emit truth guard
        run: |
          node -e "const x=require('./BEC-PRIME/data/777/777-LATEST.json'); if(x.truth.verified_external_revenue_nzd!==0 || x.truth.settled_external_payments!==0 || x.truth.independent_external_buyers!==0 || x.truth.verified_economic_outcomes!==0) process.exit(9); console.log(JSON.stringify(x.truth,null,2))"

      - name: Upload 777 proof
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-777-${{ github.run_id }}
          path: |
            BEC-PRIME/data/777/777-LATEST.json
            BEC-PRIME/data/777/public-market-radar.json
            BEC-PRIME/data/factory-factory/FACTORY-FACTORY-QUEUE.json
            BEC-PRIME/data/factory-factory/UNIVERSAL-MONEY-CELLS.json
            BEC-PRIME/data/factory-factory/FACTORY-FACTORY-RUN.json
          if-no-files-found: error
          retention-days: 7
