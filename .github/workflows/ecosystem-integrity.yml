name: Ecosystem Integrity Gate

on:
  push:
    branches: [main]
    paths:
      - 'CORTEX/**'
      - 'policy/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax gate
        run: python3 -m compileall -q CORTEX
      - name: Ecosystem integrity
        run: python3 -m CORTEX.ecosystem_spine
      - name: Red-team regression
        run: python3 -m unittest CORTEX.test_redteam_extension -v
