name: Demand Radar

on:
  workflow_dispatch:
  push:
    paths:
      - 'BEC-PRIME/demand-radar/**'
      - '.github/workflows/demand-radar.yml'
  schedule:
    - cron: '17 */6 * * *'
      timezone: 'Pacific/Auckland'

permissions:
  contents: read

concurrency:
  group: demand-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Run read-only demand collector
        run: node BEC-PRIME/demand-radar/n8n-community-collector.js
