name: Readiness Offer Proof

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compile-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Compile offers
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: node BEC-PRIME/compiler/OfferCompiler.js

      - name: Verify readiness candidates remain locked
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'BEC-PRIME/catalog/offers/offers.json';
          if (!fs.existsSync(file)) throw new Error('Compiled offers file missing');
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const offers = Array.isArray(data.offers) ? data.offers : [];
          const got = new Map(offers.map(o => [o.offer_id, o]));
          const expected = {
            'OFFER-BEC-PRIME-READINESS-AUDIT-SNAPSHOT': 49,
            'OFFER-BEC-PRIME-READINESS-AUDIT-FULL-AUDIT': 149,
            'OFFER-BEC-PRIME-READINESS-AUDIT-BLUEPRINT': 499
          };
          for (const [id, price] of Object.entries(expected)) {
            const offer = got.get(id);
            if (!offer) throw new Error('Missing offer: ' + id);
            if (offer.price !== price || offer.currency !== 'NZD') throw new Error(`${id}: price/currency mismatch`);
            if (offer.approval_required !== true) throw new Error(`${id}: approval gate is not locked`);
            if (offer.checkout_available !== false) throw new Error(`${id}: checkout is not locked`);
            if (offer.status !== 'candidate') throw new Error(`${id}: status is not candidate`);
            if (offer.silo !== 'dreamledger') throw new Error(`${id}: silo mismatch`);
          }
          const candidates = offers.filter(o => o.capability_id === 'BEC-PRIME-READINESS-AUDIT' && o.status === 'candidate');
          if (candidates.length !== 3) throw new Error(`Expected exactly 3 readiness candidates, got ${candidates.length}`);
          console.log(JSON.stringify({status:'PASS',commit:process.env.GITHUB_SHA,readiness_candidates:candidates.map(o=>o.offer_id)},null,2));
          NODE

      - name: Verify zero-touch commerce contracts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const discord = JSON.parse(fs.readFileSync('BEC-PRIME/commerce/DISCORD_WEBHOOK_STARTER_KIT.json','utf8'));
          if (discord.delivery?.mode !== 'automated') throw new Error('Discord delivery is not automated');
          if (discord.delivery?.operator_required !== false) throw new Error('Discord operator_required is not false');
          if (discord.approval?.required_for_sale !== false) throw new Error('Discord sale approval is enabled');
          if (discord.fulfillment?.trigger !== 'verified_paid_stripe_session') throw new Error('Discord fulfillment trigger is invalid');
          if (discord.fulfillment?.human_action !== false) throw new Error('Discord fulfillment still requires human action');
          if (discord.fulfillment?.payment_gate !== true) throw new Error('Discord payment gate missing');
          const commander = JSON.parse(fs.readFileSync('BEC-PRIME/catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json','utf8'));
          if (commander.status !== 'published') throw new Error('Commander Diagnostic is not published');
          if (commander.fulfillment?.mode !== 'automated') throw new Error('Commander fulfillment is not automated');
          if (commander.fulfillment?.operator_required !== false) throw new Error('Commander operator_required is not false');
          console.log(JSON.stringify({status:'PASS',commit:process.env.GITHUB_SHA,commander_zero_touch:true,discord_zero_touch:true},null,2));
          NODE

      - name: Upload compilation proof
        uses: actions/upload-artifact@v4
        with:
          name: readiness-offer-proof-${{ github.sha }}
          path: |
            BEC-PRIME/catalog/offers/offers.json
            BEC-PRIME/catalog/offers/candidates.json
            BEC-PRIME/PROOF-OFFER-COMPILATION.json
