name: Canonical Commercial Offer Proof

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BEC-PRIME
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Compile offers
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: node compiler/OfferCompiler.js

      - name: Verify canonical commercial offer
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('catalog/offers/offers.json', 'utf8'));
          const offers = Array.isArray(data.offers) ? data.offers : [];
          const byId = new Map(offers.map(o => [o.offer_id, o]));
          const approved = JSON.parse(fs.readFileSync('catalog/offers/approved.json', 'utf8'));
          const approvedIds = new Set((approved.approved || []).map(o => o.offer_id));
          const id = 'OFFER-CMD-DIAG-29-NZD';
          const offer = byId.get(id);
          if (!offer) throw new Error('Missing canonical offer: ' + id);
          if (!approvedIds.has(id)) throw new Error('Canonical offer is not operator-approved');
          if (offer.price !== 29 || offer.currency !== 'NZD') throw new Error('Canonical price/currency mismatch');
          if (offer.product_id !== 'COMMANDER-DECK-DIAGNOSTIC-001') throw new Error('Canonical product mismatch');
          if (offer.approval_required !== false) throw new Error('Canonical offer approval gate is still locked');
          if (offer.checkout_available !== true) throw new Error('Canonical checkout is not enabled');
          if (offer.status !== 'VERIFIED_AVAILABLE') throw new Error('Canonical offer is not VERIFIED_AVAILABLE');
          if (offer.payment_link_status !== 'ACTIVE_LIVEMODE') throw new Error('Canonical payment rail is not ACTIVE_LIVEMODE');
          if (!String(offer.payment_link_url || '').startsWith('https://buy.stripe.com/')) throw new Error('Canonical payment link missing');
          console.log(JSON.stringify({status:'PASS',offer_id:id,product_id:offer.product_id,price_nzd:offer.price,payment_link_status:offer.payment_link_status,checkout_available:offer.checkout_available,approved:true}, null, 2));
          NODE

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: canonical-commercial-offer-proof-${{ github.sha }}
          path: |
            BEC-PRIME/catalog/offers/offers.json
            BEC-PRIME/catalog/offers/approved.json
            BEC-PRIME/PROOF-OFFER-COMPILATION.json
          if-no-files-found: error
