name: Readiness Offer Proof

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compile-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Compile offers
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: node BEC-PRIME/compiler/OfferCompiler.js

      - name: Verify readiness tiers and explicit first-sale approval
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const file = path.join('BEC-PRIME', 'catalog', 'offers', 'offers.json');
          if (!fs.existsSync(file)) throw new Error('Compiled offers file missing: ' + file);
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const offers = Array.isArray(data.offers) ? data.offers : [];
          const got = new Map(offers.map(o => [o.offer_id, o]));
          const expected = {
            'OFFER-BEC-PRIME-READINESS-AUDIT-SNAPSHOT': 49,
            'OFFER-BEC-PRIME-READINESS-AUDIT-FULL-AUDIT': 149,
            'OFFER-BEC-PRIME-READINESS-AUDIT-BLUEPRINT': 499
          };
          for (const [id, price] of Object.entries(expected)) {
            const offer = got.get(id);
            if (!offer) throw new Error('Missing offer: ' + id);
            if (offer.price !== price) throw new Error(`${id}: expected price ${price}, got ${offer.price}`);
            if (offer.currency !== 'NZD') throw new Error(`${id}: currency is not NZD`);
            if (offer.approval_required !== true) throw new Error(`${id}: approval gate is not locked`);
            if (offer.checkout_available !== false) throw new Error(`${id}: checkout is not locked`);
            if (offer.status !== 'candidate') throw new Error(`${id}: status is not candidate`);
            if (offer.silo !== 'dreamledger') throw new Error(`${id}: silo mismatch`);
          }
          const readinessCandidates = offers.filter(o => o.capability_id === 'BEC-PRIME-READINESS-AUDIT' && o.status === 'candidate');
          if (readinessCandidates.length !== 3) throw new Error(`Expected exactly 3 readiness candidate offers, got ${readinessCandidates.length}`);
          const firstSale = got.get('AGENTIC-COMMERCE-READINESS-001');
          if (!firstSale) throw new Error('Missing explicitly approved first-sale offer AGENTIC-COMMERCE-READINESS-001');
          if (firstSale.price !== 49 || firstSale.currency !== 'NZD') throw new Error('First-sale price/currency mismatch');
          if (firstSale.capability_id !== 'BEC-PRIME-READINESS-AUDIT') throw new Error('First-sale capability mismatch');
          if (firstSale.silo !== 'dreamledger') throw new Error('First-sale silo mismatch');
          if (firstSale.approval_required !== false) throw new Error('First-sale approval gate is still locked');
          if (firstSale.checkout_available !== true) throw new Error('First-sale checkout is not enabled');
          if (firstSale.status !== 'VERIFIED_AVAILABLE') throw new Error('First-sale status is not VERIFIED_AVAILABLE');
          console.log(JSON.stringify({
            status: 'PASS',
            commit: process.env.GITHUB_SHA,
            readiness_candidate_offer_ids: readinessCandidates.map(o => o.offer_id),
            first_sale_offer_id: firstSale.offer_id,
            first_sale_price_nzd: firstSale.price,
            approval_locked_for_candidates: readinessCandidates.every(o => o.approval_required === true),
            checkout_enabled_only_for_explicit_approval: firstSale.checkout_available === true,
            silo: 'dreamledger'
          }, null, 2));
          NODE

      - name: Upload compilation proof
        uses: actions/upload-artifact@v4
        with:
          name: readiness-offer-proof-${{ github.sha }}
          path: |
            BEC-PRIME/catalog/offers/offers.json
            BEC-PRIME/catalog/offers/candidates.json
            BEC-PRIME/PROOF-OFFER-COMPILATION.json
