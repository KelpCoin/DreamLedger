name: Maximona Bridge Worker Once

on:
  push:
    branches: [maximona-experiment-001-execution]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DREAMLEDGER_AGENT_BRIDGE_URL: https://dreamledger.org
      DREAMLEDGER_AGENT_BRIDGE_TOKEN: ${{ secrets.DREAMLEDGER_AGENT_BRIDGE_TOKEN }}
      DREAMLEDGER_CORTEX_WORKER_ID: github-actions-maximona-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require bridge token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DREAMLEDGER_AGENT_BRIDGE_TOKEN:-}" || { echo 'DREAMLEDGER_AGENT_BRIDGE_TOKEN is not configured'; exit 1; }
      - name: Run one fenced worker cycle
        shell: pwsh
        run: |
          $result = & ./BEC-PRIME/scripts/CortexEconomicWorker.ps1 -Once
          $result
          $obj = $result | ConvertFrom-Json
          if ($obj.status -ne 'COMPLETED') { throw "Bridge worker did not complete: $($obj | ConvertTo-Json -Compress)" }
          if ([string]::IsNullOrWhiteSpace([string]$obj.job_id)) { throw 'Completed worker result missing job_id' }
          Write-Host 'MAXIMONA_BRIDGE_WORKER=PASS'
          Write-Host "JOB_ID=$($obj.job_id)"
