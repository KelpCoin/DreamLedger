name: CUBE Silo Factory
on:
  push:
    branches-ignore: [main]
    paths:
      - 'silos/**/silo.json'
      - 'public/mtg/index.html'
      - 'mtg/index.html'
      - 'data/_catalog-empty.template.json'
      - 'BEC-PRIME/compiler/SiloCloneCompiler.js'
      - 'BEC-PRIME/compiler/SiloRegistryCompiler.js'
      - 'BEC-PRIME/compiler/SiloFactory.js'
      - 'BEC-PRIME/scripts/verify-silo-factory.js'
      - 'BEC-PRIME/scripts/verify-mtg-silo-gauntlet.js'
      - 'BEC-PRIME/scripts/verify-music-media-silo.js'
      - 'BEC-PRIME/scripts/verify-silo-fee-policy.js'
      - 'BEC-PRIME/scripts/verify-tcg-swarm-gauntlet.js'
      - 'package.json'
      - 'docs/BECK-EMPIRE-SILO-REGISTRY.json'
      - 'docs/BECK-SILO-FEE-POLICY.json'
      - '.github/workflows/cube-silo-factory.yml'
  pull_request:
    paths:
      - 'silos/**/silo.json'
      - 'public/mtg/index.html'
      - 'mtg/index.html'
      - 'data/_catalog-empty.template.json'
      - 'BEC-PRIME/compiler/SiloCloneCompiler.js'
      - 'BEC-PRIME/compiler/SiloRegistryCompiler.js'
      - 'BEC-PRIME/compiler/SiloFactory.js'
      - 'BEC-PRIME/scripts/verify-silo-factory.js'
      - 'BEC-PRIME/scripts/verify-mtg-silo-gauntlet.js'
      - 'BEC-PRIME/scripts/verify-music-media-silo.js'
      - 'BEC-PRIME/scripts/verify-silo-fee-policy.js'
      - 'BEC-PRIME/scripts/verify-tcg-swarm-gauntlet.js'
      - 'package.json'
      - '.github/workflows/cube-silo-factory.yml'
  workflow_dispatch:
    inputs:
      manifest_path:
        description: 'Canonical manifest path: silos/<slug>/silo.json'
        required: false
        default: 'silos/music-media/silo.json'
permissions:
  contents: write
jobs:
  compile-and-gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select manifest
        shell: bash
        run: |
          manifest="${{ github.event.inputs.manifest_path }}"
          if [ -z "$manifest" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            manifest=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -E '^silos/[^/]+/silo\.json$' | head -n 1 || true)
          fi
          if [ -z "$manifest" ] && [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            manifest=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | grep -E '^silos/[^/]+/silo\.json$' | head -n 1 || true)
          fi
          if [ -z "$manifest" ]; then manifest='silos/music-media/silo.json'; fi
          [[ "$manifest" =~ ^silos/[a-z0-9]+(-[a-z0-9]+)*/silo\.json$ ]]
          test -f "$manifest"
          echo "MANIFEST_PATH=$manifest" >> "$GITHUB_ENV"
      - name: Compile from the MTG master
        run: node BEC-PRIME/compiler/SiloFactory.js --manifest "$MANIFEST_PATH"
      - name: Run CUBE and Gauntlet checks
        run: |
          node BEC-PRIME/compiler/SiloFactory.js --check --manifest "$MANIFEST_PATH"
          node BEC-PRIME/scripts/verify-silo-factory.js
          node BEC-PRIME/scripts/verify-music-media-silo.js
          node BEC-PRIME/scripts/verify-mtg-silo-gauntlet.js
          node BEC-PRIME/scripts/verify-tcg-swarm-gauntlet.js
          node BEC-PRIME/scripts/verify-silo-fee-policy.js
      - name: Commit generated artifacts to the working branch only
        if: github.event_name == 'push' && github.ref_name != 'main'
        shell: bash
        run: |
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "DreamLedger CUBE Silo Factory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "CUBE: compile silo from MTG master manifest"
          git push origin "HEAD:$GITHUB_REF_NAME"
