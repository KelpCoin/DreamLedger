name: CUBE Cloud Pinball Swarm x2

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: dreamledger-cube-pinball
  cancel-in-progress: false

jobs:
  pinball:
    name: ${{ matrix.swarm }}-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - { swarm: figure8-a, shard: 0, global_shard: 0 }
          - { swarm: figure8-a, shard: 1, global_shard: 1 }
          - { swarm: figure8-a, shard: 2, global_shard: 2 }
          - { swarm: figure8-a, shard: 3, global_shard: 3 }
          - { swarm: figure8-a, shard: 4, global_shard: 4 }
          - { swarm: figure8-a, shard: 5, global_shard: 5 }
          - { swarm: figure8-a, shard: 6, global_shard: 6 }
          - { swarm: figure8-a, shard: 7, global_shard: 7 }
          - { swarm: figure8-b, shard: 0, global_shard: 8 }
          - { swarm: figure8-b, shard: 1, global_shard: 9 }
          - { swarm: figure8-b, shard: 2, global_shard: 10 }
          - { swarm: figure8-b, shard: 3, global_shard: 11 }
          - { swarm: figure8-b, shard: 4, global_shard: 12 }
          - { swarm: figure8-b, shard: 5, global_shard: 13 }
          - { swarm: figure8-b, shard: 6, global_shard: 14 }
          - { swarm: figure8-b, shard: 7, global_shard: 15 }

    env:
      SUPABASE_URL: https://wbwgroygjeyukkspnqiy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CUBE_PINBALL_ENABLED: 'true'
      CUBE_PINBALL_LM_URL: ${{ secrets.CUBE_PINBALL_LM_URL }}
      CUBE_PINBALL_LM_API_KEY: ${{ secrets.CUBE_PINBALL_LM_API_KEY }}
      CUBE_PINBALL_MODELS: ${{ secrets.CUBE_PINBALL_MODELS }}
      CUBE_PINBALL_BATCH: '2'
      CUBE_PINBALL_TURNS: '4'
      CUBE_PINBALL_SHARD_INDEX: ${{ matrix.global_shard }}
      CUBE_PINBALL_SHARD_COUNT: '16'
      CUBE_PINBALL_SWARM: ${{ matrix.swarm }}
      CUBE_PINBALL_LOCAL_SHARD: ${{ matrix.shard }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.0.4
        with:
          node-version: '24.14.1'

      - name: Swarm preflight
        run: |
          node - <<'NODE'
          const required = [
            'SUPABASE_SERVICE_ROLE_KEY',
            'CUBE_PINBALL_LM_URL',
            'CUBE_PINBALL_MODELS'
          ];
          const missing = required.filter(k => !String(process.env[k] || '').trim());
          if (missing.length) {
            console.error('CONFIG_MISSING=' + missing.join(','));
            process.exit(2);
          }
          console.log('SWARM_READY=' + process.env.CUBE_PINBALL_SWARM);
          console.log('SHARD=' + process.env.CUBE_PINBALL_SHARD_INDEX + '/' + process.env.CUBE_PINBALL_SHARD_COUNT);
          NODE

      - name: Run bounded pinball cell
        run: node -e "require('./BEC-PRIME/runtime/CubePinball').tick().then(x=>console.log(JSON.stringify(x,null,2))).catch(e=>{console.error(e.stack||e);process.exit(1)})"
