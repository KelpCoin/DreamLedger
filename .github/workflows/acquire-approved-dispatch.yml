name: Acquire Approved Catalog Offer via Machine Dispatch

on:
  repository_dispatch:
    types:
      - approved-acquisition
  push:
    paths:
      - ".economic-dispatch/QUOTE-COMPARE-49"

permissions:
  contents: read

concurrency:
  group: catalog-discord-acquisition
  cancel-in-progress: false

jobs:
  post:
    if: ${{ github.event_name == 'push' || github.event.client_payload.approval == 'APPROVED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate payload
        env:
          OFFER: ${{ github.event_name == 'push' && 'QUOTE-COMPARE-49' || github.event.client_payload.offer }}
          TARGET: ${{ github.event_name == 'push' && 'configured-discord-acquisition' || github.event.client_payload.target }}
        run: |
          set -euo pipefail
          case "$OFFER" in
            CMD-DIAG-29|DREAMLEDGER-BILLBOARD-50|QUOTE-COMPARE-49) ;;
            *) echo "Offer not allowed"; exit 1 ;;
          esac
          test -n "$TARGET"

      - name: Publish through existing verified acquisition rail
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_ACQUISITION_CHANNEL_ID: ${{ vars.DISCORD_ACQUISITION_CHANNEL_ID }}
          OFFER: ${{ github.event_name == 'push' && 'QUOTE-COMPARE-49' || github.event.client_payload.offer }}
          TARGET: ${{ github.event_name == 'push' && 'configured-discord-acquisition' || github.event.client_payload.target }}
        run: |
          set -euo pipefail
          if [ -z "$DISCORD_WEBHOOK" ] && { [ -z "$DISCORD_BOT_TOKEN" ] || [ -z "$DISCORD_ACQUISITION_CHANNEL_ID" ]; }; then
            echo "No Discord publication adapter is configured."
            echo "Configure either DISCORD_WEBHOOK or the reusable bot transport: DISCORD_BOT_TOKEN + DISCORD_ACQUISITION_CHANNEL_ID"
            exit 1
          fi
          if [ -n "$DISCORD_WEBHOOK" ]; then
            case "$DISCORD_WEBHOOK" in
              https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*) ;;
              *) echo "Invalid Discord webhook host"; exit 1 ;;
            esac
          fi

          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          with open("BEC-PRIME/catalog/offers/approved.json", "r", encoding="utf-8") as f:
              approved_doc = json.load(f)

          aliases = {
              "CMD-DIAG-29": "CMD-DIAG-29",
              "QUOTE-COMPARE-49": "QUOTE-COMPARE-49",
              "DREAMLEDGER-BILLBOARD-50": "DL-BILLBOARD-100X100-3000-001"
          }

          offer = os.environ["OFFER"]
          sku = aliases[offer]
          rows = [
              x for x in approved_doc.get("approved", [])
              if x.get("product_sku") == sku
              and x.get("payment_link_url")
              and x.get("payment_link_status") == "ACTIVE_LIVEMODE"
          ]
          if len(rows) != 1:
              raise SystemExit("Offer is not uniquely approved and live: " + offer)

          record = rows[0]
          content = (
              record["name"] + " - " +
              record["currency"] + "$" + str(record["price"]) +
              "\n\n" + record["problem"] +
              "\n\n" + record["payment_link_url"]
          )

          webhook = os.environ.get("DISCORD_WEBHOOK", "").strip()
          bot_token = os.environ.get("DISCORD_BOT_TOKEN", "").strip()
          configured_channel = os.environ.get("DISCORD_ACQUISITION_CHANNEL_ID", "").strip()

          if webhook:
              parts = urllib.parse.urlsplit(webhook)
              query = urllib.parse.parse_qsl(parts.query, keep_blank_values=True)
              query.append(("wait", "true"))
              post_url = urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path, urllib.parse.urlencode(query), parts.fragment))
              req = urllib.request.Request(post_url, data=json.dumps({"content": content}).encode(), headers={"Content-Type": "application/json"}, method="POST")
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = json.loads(response.read().decode())
              message_id = body.get("id")
              channel_id = body.get("channel_id")
              if not message_id or not channel_id:
                  raise SystemExit("Webhook publication response failed identity verification")
              verify_req = urllib.request.Request(webhook.rstrip("/") + "/messages/" + urllib.parse.quote(str(message_id), safe=""), headers={"Accept": "application/json"})
          else:
              if not bot_token or not configured_channel:
                  raise SystemExit("Bot transport requires DISCORD_BOT_TOKEN and DISCORD_ACQUISITION_CHANNEL_ID")
              channel_id = configured_channel
              post_url = "https://discord.com/api/v10/channels/" + urllib.parse.quote(channel_id, safe="") + "/messages"
              req = urllib.request.Request(post_url, data=json.dumps({"content": content}).encode(), headers={"Authorization": "Bot " + bot_token, "Content-Type": "application/json", "Accept": "application/json"}, method="POST")
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = json.loads(response.read().decode())
              message_id = body.get("id")
              if not message_id or body.get("channel_id") != channel_id:
                  raise SystemExit("Bot publication response failed identity verification")
              verify_req = urllib.request.Request("https://discord.com/api/v10/channels/" + urllib.parse.quote(channel_id, safe="") + "/messages/" + urllib.parse.quote(str(message_id), safe=""), headers={"Authorization": "Bot " + bot_token, "Accept": "application/json"})

          if record["payment_link_url"] not in body.get("content", ""):
              raise SystemExit("Publication response failed content verification")
          if (
              verified.get("id") != message_id or
              verified.get("channel_id") != channel_id or
              record["payment_link_url"] not in verified.get("content", "")
          ):
              raise SystemExit("Published message failed read-back verification")

          print("EXTERNAL_PUBLICATION=VERIFIED_DISCORD_MESSAGE")
          print("OFFER=" + offer)
          print("OFFER_ID=" + record["offer_id"])
          print("DISCORD_MESSAGE_ID=" + message_id)
          print("DISCORD_CHANNEL_ID=" + channel_id)
          print("EXTERNAL_REVENUE=UNVERIFIED")
          PY
