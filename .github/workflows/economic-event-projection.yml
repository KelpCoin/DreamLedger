name: Economic Event Projection

# FROZEN: deterministic projection coverage is exercised by the authoritative
# Economic Production Observation Contract. Manual dispatch remains available.
concurrency:
  group: dreamledger-economic-event-projection-manual
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic projection tests
        working-directory: runtime/economic
        run: python3 test_event_projection.py
