name: Provider migration static safety contract

on:
  pull_request:
    branches: [main]
    paths:
      - "data/mtg-catalog.json"
      - "public/catalog.json"
      - "public/data/mtg-catalog.json"
      - "public/data/economic-pulse.json"
      - "public/portfolio/commander-deck-diagnostic.html"
      - "public/mtg/**"
      - "ops/migration/cloudflare-preview/**"
      - "ops/migration/supabase-to-neon/**"
      - "ops/migration/README.md"
      - "BEC-PRIME/catalog/featured-offer.json"
      - ".github/workflows/provider-migration-static-safety.yml"
  push:
    branches:
      - beck/provider-migration-neon-cloudflare-20261019
    paths:
      - "data/mtg-catalog.json"
      - "public/catalog.json"
      - "public/data/mtg-catalog.json"
      - "public/data/economic-pulse.json"
      - "public/mtg/**"
      - "ops/migration/cloudflare-preview/**"
      - "BEC-PRIME/catalog/featured-offer.json"
      - ".github/workflows/provider-migration-static-safety.yml"

permissions:
  contents: read

jobs:
  safety-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax-check the preview runtime and builder
        run: |
          set -euo pipefail
          node --check ops/migration/cloudflare-preview/build-preview.mjs
          node --check ops/migration/cloudflare-preview/smoke-preview.mjs
          node --check ops/migration/cloudflare-preview/_worker.js
      - name: Verify source backup tooling is read-only
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"),assert=require("assert");const sql=fs.readFileSync("ops/migration/supabase-to-neon/preflight.sql","utf8").replace(/^--.*$/gm,"").trim();assert.match(sql,/^SELECT\\b/i,"inventory must be a read-only SELECT");assert.doesNotMatch(sql,/\\b(INSERT|UPDATE|DELETE|MERGE|DROP|ALTER|TRUNCATE|CREATE|GRANT|REVOKE)\\b/i,"inventory must not contain mutating SQL");const ps=fs.readFileSync("ops/migration/supabase-to-neon/Export-Supabase-ForensicBackup.ps1","utf8");assert.match(ps,/pgRestore\\.Source --list/,"backup must validate archive by listing only");assert.doesNotMatch(ps,/pg_restore.{0,80}(--clean|--create|--dbname)/i,"backup runner must not restore or mutate a target");assert.match(ps,/Get-FileHash[^\\n]*SHA256/,"backup must hash private output");assert.match(ps,/finally\\s*\\{[\\s\\S]*Remove-Item Env:PGPASSWORD/,"password must be cleared in finally");console.log("SOURCE_BACKUP_TOOLING_READ_ONLY=PASS")'
      - name: Build the non-production candidate and enforce catalogue safety
        run: node ops/migration/cloudflare-preview/build-preview.mjs
      - name: Confirm expected routes and honest degraded behavior
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const root="ops/migration/cloudflare-preview/dist";for(const f of ["index.html","404.html","mtg/index.html","truth-oracle.html","silos/mtg/silo.json","data/mtg-catalog.json","catalog.json","data/economic-pulse.json","_worker.js"])if(!fs.existsSync(root+"/"+f))throw Error("missing "+f);for(const f of ["catalog.json","data/mtg-catalog.json"]){const c=JSON.parse(fs.readFileSync(root+"/"+f,"utf8"));if(!Array.isArray(c.products))throw Error("invalid "+f);for(const id of ["EDH_0001","COMMANDER-DECK-DIAGNOSTIC-001"]){const p=c.products.find(x=>x.id===id);if(!p||p.status==="published"||Object.prototype.hasOwnProperty.call(p,"price")||Object.prototype.hasOwnProperty.call(p,"checkout_url")||p.price_status!=="UNOBSERVABLE"||p.price_evidence_status!=="UNVERIFIED")throw Error("unsafe held listing "+id+" in "+f)}}const b=JSON.parse(fs.readFileSync("ops/migration/cloudflare-preview/build-proof.json","utf8"));if(b.status!=="PREVIEW_BUNDLE_BUILT_NOT_PRODUCTION_READY"||b.production_mutation!==false||b.dns_changed!==false||b.revenue_claimed_nzd!==0)throw Error("build proof contract mismatch");console.log("PROVIDER_MIGRATION_STATIC_SAFETY=PASS")'
      - name: Upload non-production build proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-migration-static-safety-${{ github.sha }}
          path: |
            ops/migration/cloudflare-preview/build-proof.json
            ops/migration/cloudflare-preview/dist
          if-no-files-found: warn
          retention-days: 14
