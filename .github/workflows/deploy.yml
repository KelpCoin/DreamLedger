name: Legacy Render Deploy Compatibility Gate

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: dreamledger-legacy-compatibility
  cancel-in-progress: true

env:
  LIVE_URL: https://dreamledger.org

jobs:
  verify-current-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BEC-PRIME
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Compile current canonical commerce surface
        run: npm run compile
      - name: Syntax gate
        run: |
          node --check server.js
          node --check start.js
          node --check compiler/OfferCompiler.js
          node --check dreamiez-account.js
          node --check routes/dreamiez.js
          node --check scripts/smoke-dreamiez.js
          node --check scripts/smoke-front-door.js
      - name: Local account and front door smoke
        run: |
          npm run smoke:dreamiez
          npm run smoke:front-door
      - name: Explicitly prove deployment ownership is canonical
        run: |
          test -s catalog/offers/approved.json
          test -s catalog/offers/offers.json
          grep -q 'OFFER-BEC-PRIME-ARCHITECTURE-AUDIT' catalog/offers/approved.json
          grep -q 'OFFER-BEC-PRIME-ARCHITECTURE-AUDIT' catalog/offers/offers.json
          grep -q '"approval_required": false' catalog/offers/offers.json
          grep -q '"checkout_available": true' catalog/offers/offers.json
          echo 'PASS: legacy deploy workflow no longer triggers Render; render-deploy.yml owns production deployment.'
          echo 'PASS: canonical approved offer is compiled into the commerce catalog.'
