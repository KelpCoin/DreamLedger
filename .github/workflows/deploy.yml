name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["BEC-PRIME Auto Compile DreamLedger"]
    types: [completed]

concurrency:
  group: dreamledger-production-deploy
  cancel-in-progress: false

env:
  LIVE_URL: https://dreamledger.org

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BEC-PRIME
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BEC-PRIME/package.json
      - name: Install
        run: npm install
      - name: Compile full commerce spine
        run: npm run compile
      - name: Syntax gate
        run: |
          node --check server.js
          node --check start.js
          node --check compiler/ProductCompiler.js
          node --check brain/SniperLoop.js
          node --check factory/BuilderBoss.js
          node --check macro/MacroEngine.js
          node --check autonomy/RevenueAutonomy.js
          node --check routes/m2m.js
          node --check lib/m2mPreload.js
          node --check dreamiez-account.js
          node --check scripts/smoke-dreamiez.js
          node --check scripts/smoke-production.js
          node --check gauntlet/GauntletV6.js
          node --check elohim/ElohimV6.js
          node --check proxy/DigitalProxy.js
          node --check runtime/ControlPlane.js
      - name: Dreamiez smoke gate
        run: npm run smoke:dreamiez
      - name: Autonomy macro gate
        run: npm run autonomy:macro
      - name: Production asset gate
        run: |
          test -s compiled/website/index.html
          test -s compiled/website/revenue.html
          test -s compiled/website/assets/marketplace-live.js
          test -s compiled/website/portfolio/index.html
          test -s compiled/website/economics/index.html
          test -s compiled/website/economics/ip-manifest.json
          test -s catalog/offers/offers.json
          test -s catalog/offers/products.json
          test -s catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json
          test -s catalog/products/EDH_0001.json
          grep -Eq 'BEC-PRIME|Neutral front door|DREAMLEDGER' compiled/website/index.html
          grep -Eq 'REVENUE PORTFOLIO|REVENUE RAILS' compiled/website/revenue.html

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured; relying on Render automatic deployment from main."
          else
            curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
          fi
      - name: Prove live runtime and MTG checkout readiness
        shell: bash
        run: |
          set -euo pipefail
          health="${LIVE_URL}/healthz"
          offers="${LIVE_URL}/api/offers"
          for attempt in $(seq 1 30); do
            health_code="$(curl --silent --output /tmp/health.json --write-out '%{http_code}' --max-time 15 "$health" || true)"
            offers_code="$(curl --silent --output /tmp/offers.json --write-out '%{http_code}' --max-time 15 "$offers" || true)"
            if [ "$health_code" = "200" ] && [ "$offers_code" = "200" ] && grep -q '"offer_id":"EDH_0001"' /tmp/offers.json && grep -q '"price":400' /tmp/offers.json && grep -q '"currency":"NZD"' /tmp/offers.json && grep -q '"checkout_available":true' /tmp/offers.json; then
              printf '%s\n' '{"status":"PASS","checks":["healthz","offers","EDH_0001","price_400_NZD","checkout_available"],"truth":"Live EDH_0001 checkout readiness proven; payment still requires a real buyer."}' | tee live-deployment-proof.json
              cat /tmp/health.json
              cat /tmp/offers.json
              exit 0
            fi
            echo "Live MTG commerce surface not ready (attempt $attempt/30): health=$health_code offers=$offers_code"
            sleep 10
          done
          printf '%s\n' '{"status":"FAIL","reason":"Live health/offers surface did not expose EDH_0001 at NZD 400 with checkout available after deploy trigger."}' | tee live-deployment-proof.json
          cat /tmp/health.json || true
          cat /tmp/offers.json || true
          exit 1
      - name: Upload live deployment proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-live-deployment-proof
          path: live-deployment-proof.json
          if-no-files-found: error
