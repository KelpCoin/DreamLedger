name: DreamLedger Economic Supervisor

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ops/decision/beck-autonomy-gate.mjs'
      - 'ops/decision/beck-autonomy-gate.test.mjs'
      - '.github/workflows/economic-supervisor.yml'
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'BEC-PRIME/scripts/DreamLedger-Economic-Bootstrap.ps1'
      - 'BEC-PRIME/config/economic-supervisor.json'
      - '.github/workflows/economic-supervisor.yml'

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: dreamledger-economic-supervisor
  cancel-in-progress: true

jobs:
  verify-and-route:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: BEC-PRIME
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PowerShell runtime
        run: |
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw 'Economic supervisor requires Windows PowerShell 5.x for its compatibility contract.'
          }

      - name: Parse supervisor and configuration
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\scripts\DreamLedger-Economic-Bootstrap.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw 'Economic supervisor PowerShell parse failed.'
          }
          Get-Content '.\config\economic-supervisor.json' -Raw | ConvertFrom-Json | Out-Null
          Write-Host 'Supervisor syntax and configuration parse: PASS'

      - name: Run economic supervisor
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SUPABASE_URL: https://wbwgroygjeyukkspnqiy.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AGENTBRIDGE_BASE_URL: https://dreamledger.org
          AGENTBRIDGE_TOKEN: ${{ secrets.DREAMLEDGER_AGENT_BRIDGE_TOKEN }}
          ECONOMIC_BOOTSTRAP_ROOT: ${{ github.workspace }}\economic-bootstrap
        run: .\scripts\DreamLedger-Economic-Bootstrap.ps1

      - name: BECK independent economic and CI gate
        if: always()
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          node "$env:GITHUB_WORKSPACE\ops\decision\beck-autonomy-gate.mjs" --prs 930,926,921,924 --output "$env:GITHUB_WORKSPACE\economic-bootstrap\autonomy-gate.json"

      - name: Locate latest evidence run
        id: evidence
        run: |
          $run = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'economic-bootstrap') -Directory | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $run) { throw 'No economic bootstrap evidence directory was produced.' }
          "path=$($run.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          Write-Host "Evidence run: $($run.FullName)"

      - name: Publish economic evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-economic-state-${{ github.run_id }}
          path: economic-bootstrap
          if-no-files-found: error
          retention-days: 30

      - name: Emit next action
        if: always()
        run: |
          $next = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'economic-bootstrap') -Recurse -Filter '12_NEXT_ACTION.json' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($next) {
            Write-Host '--- ECONOMIC NEXT ACTION ---'
            Get-Content $next.FullName -Raw
          } else {
            Write-Host 'No next-action evidence was produced.'
          }

  autonomy-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify economic gate is fail-closed
        run: node --test ops/decision/beck-autonomy-gate.test.mjs
      - name: Verify cloud proof without live provider access
        run: |
          node ops/decision/beck-autonomy-gate.mjs --output proof/autonomy-ci.json
          node -e "const x=require('./proof/autonomy-ci.json');if(x.status!=='NOT_ECONOMICALLY_VALIDATED'||x.attributable_revenue_nzd!==null||x.public_release!=='OWNER_APPROVAL_REQUIRED')process.exit(2)"
          sha256sum proof/autonomy-ci.json
      - name: Upload immutable-run evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beck-autonomy-contract-${{ github.run_id }}
          path: proof/autonomy-ci.json
          if-no-files-found: warn
          retention-days: 30
