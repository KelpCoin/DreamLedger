name: MTG catalogue validation

on:
  pull_request:
    paths:
      - "public/catalog.json"
      - "mtg/**"
      - "public/mtg/**"
      - ".github/workflows/mtg-catalogue-validation.yml"
  push:
    branches: [main]
    paths:
      - "public/catalog.json"
      - "mtg/**"
      - "public/mtg/**"
      - ".github/workflows/mtg-catalogue-validation.yml"

jobs:
  validate-mtg-listings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate catalogue records and buyer routes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('public/catalog.json', 'utf8'));
          const required = [
            ['EDH_0001', null],
            ['EDH_QUINTORIUS_0002', 'mtg/quintorius-field-historian.html'],
            ['EDH_DWYNEN_0003', 'mtg/dwynen-gilt-leaf-daen.html']
          ];
          const products = catalog.products || [];
          for (const [id, page] of required) {
            const p = products.find(x => x.id === id);
            if (!p || p.status !== 'published') throw new Error('Missing/unpublished MTG listing: ' + id);
            if (page && !fs.existsSync(page)) throw new Error('Missing buyer route: ' + page);
            if (id !== 'EDH_0001' && (p.checkout_available !== false || p.sale_mode !== 'claim_by_message' || !p.claim_url)) {
              throw new Error('Claim-only deck must not claim direct checkout: ' + id);
            }
          }
          const html = fs.readFileSync('mtg/index.html', 'utf8');
          const liveHtml = fs.readFileSync('public/mtg/index.html', 'utf8');
          if (!html.includes("CATALOG='../data/mtg-catalog.json'")) throw new Error('Master template must load the manifest-backed canonical catalogue');
          if (!liveHtml.includes("CATALOG='../data/mtg-catalog.json'")) throw new Error('Public MTG page must load the canonical catalogue');
          if (html !== liveHtml) throw new Error('Public MTG page drifted from the canonical master template');
          const masterData = fs.readFileSync('data/mtg-catalog.json', 'utf8');
          const publicMasterData = fs.readFileSync('public/data/mtg-catalog.json', 'utf8');
          if (masterData !== publicMasterData) throw new Error('Public MTG catalogue drifted from canonical data');
          const master = JSON.parse(masterData);
          for (const id of ['EDH_QUINTORIUS_0002', 'EDH_DWYNEN_0003', 'COMMANDER-DECK-DIAGNOSTIC-001']) {
            if (!(master.products || []).some(p => p.id === id)) throw new Error('Canonical MTG catalogue missing product: ' + id);
          }
          const diagnostic = master.products.find(p => p.id === 'COMMANDER-DECK-DIAGNOSTIC-001');
          if (diagnostic.status !== 'held' || diagnostic.checkout_available !== false) {
            throw new Error('Diagnostic must remain held until paid delivery is proven');
          }
          for (const p of master.products.filter(p => ['commander-deck','digital-service'].includes(p.category))) {
            if (Object.hasOwn(p, 'condition')) throw new Error(p.id + ' must not inherit physical-card condition');
          }
          for (const page of ['public/mtg/quintorius-field-historian.html', 'public/mtg/dwynen-gilt-leaf-daen.html']) {
            if (!fs.existsSync(page)) throw new Error('Missing deployed public route: ' + page);
          }
          if (!html.includes('EDH_QUINTORIUS_0002') || !html.includes('EDH_DWYNEN_0003')) throw new Error('Catalogue must prioritize the new decks');
          for (const page of ['mtg/quintorius-field-historian.html', 'mtg/dwynen-gilt-leaf-daen.html']) {
            const body = fs.readFileSync(page, 'utf8');
            if (!body.includes('decklist') && !body.includes('decklist')) throw new Error('Missing decklist reference in ' + page);
          }
          console.log('MTG catalogue validation passed.');
          NODE
