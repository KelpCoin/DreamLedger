name: Manual legacy MTG validation (deprecated)

# DEPRECATED: canonical MTG source/manifest/catalog and condition contracts run in .github/workflows/ci.yml.
# Keep this manual-only entry for an explicit legacy compatibility check. It no longer competes
# with CI on pushes or pull requests and does not assert that production commerce is enabled.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-mtg-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-contract:
    name: Run canonical MTG contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
        working-directory: BEC-PRIME
      - name: Apply deterministic condition guard
        run: node scripts/Patch-MTG-CommerceSurface.js
        working-directory: BEC-PRIME
      - name: Verify canonical MTG source, catalogue and root publication
        run: node --test scripts/mtg-condition-contract.test.js
        working-directory: BEC-PRIME
