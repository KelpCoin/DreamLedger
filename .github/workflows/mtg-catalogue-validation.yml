name: MTG marketplace truth gate

on:
  pull_request:
    paths:
      - "mtg/**"
      - "public/mtg/**"
      - "mtg-*.html"
      - "data/mtg-catalog.json"
      - "public/data/mtg-catalog.json"
      - "BEC-PRIME/routes/mtgMarketplace.js"
      - ".github/workflows/mtg-catalogue-validation.yml"
  push:
    branches: [main]
    paths:
      - "mtg/**"
      - "public/mtg/**"
      - "mtg-*.html"
      - "data/mtg-catalog.json"
      - "public/data/mtg-catalog.json"
      - "BEC-PRIME/routes/mtgMarketplace.js"
      - ".github/workflows/mtg-catalogue-validation.yml"

jobs:
  verify-mtg-marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject demonstration stock and broken listing routes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const vm = require('node:vm');
          const get = file => fs.readFileSync(file, 'utf8');
          const live = JSON.parse(get('public/data/mtg-catalog.json'));
          assert.equal(live.silo, 'mtg');
          const decks = live.products.filter(p => p.status === 'published' && p.category === 'commander-deck');
          for (const p of decks) {
            assert.equal(p.silo, 'mtg', 'No cross-silo stock');
            assert.equal(p.currency, 'NZD');
            assert.ok(Number.isFinite(p.price) && p.price > 0, p.id + ': invalid price');
            assert.ok(Number.isInteger(p.inventory) && p.inventory > 0, p.id + ': no stock quantity');
            assert.equal(p.checkout_available, false, p.id + ': no unverified checkout');
            assert.equal(p.sale_mode, 'claim_by_message', p.id + ': no unverified payment path');
            assert.ok(p.claim_url && p.claim_url.startsWith('mailto:'), p.id + ': no claim route');
            assert.ok(p.detail_url && fs.existsSync('public' + p.detail_url), p.id + ': missing public details');
          }
          const files = ['mtg-search.html','mtg-list.html','mtg-marketplace.html','mtg/index.html','public/mtg/index.html'];
          for (const file of files) {
            const html = get(file);
            const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
            for (const [,src] of scripts) if (src.trim()) new vm.Script(src, { filename: file });
          }
          const search = get('mtg-search.html');
          assert.ok(search.includes("fetch('/api/mtg/marketplace/listings'"));
          assert.ok(!search.includes('var SEED=') && !search.includes('dreamledger_mtg_draft_listing'));
          const list = get('mtg-list.html');
          assert.ok(list.includes('/mtg-marketplace.html#list-card'));
          assert.ok(!list.includes('dreamledger_mtg_draft_listing'));
          const marketplace = get('mtg-marketplace.html');
          assert.ok(marketplace.includes('id="list-card"'));
          assert.ok(marketplace.includes("/api/mtg/marketplace/listings"));
          const route = get('BEC-PRIME/routes/mtgMarketplace.js');
          assert.ok(route.includes("route === '/api/mtg/marketplace/listings'"));
          for (const file of ['mtg/index.html','public/mtg/index.html']) {
            const html = get(file);
            assert.ok(html.includes('/data/mtg-catalog.json'));
            assert.ok(!html.includes('FALLBACK'), file + ': stale hardcoded inventory');
            assert.ok(html.includes('/mtg-search.html'));
          }
          console.log('PASS: verified public catalogue shape, no demonstration stock, and MTG marketplace routes.');
          console.log('NOTE: this is a source-contract test, not a live purchase, settlement or fulfilment proof.');
          NODE