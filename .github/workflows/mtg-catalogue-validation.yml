name: MTG Catalogue Truth Validation

on:
  pull_request:
    paths:
      - 'public/server.js'
      - 'public/catalog.json'
      - 'public/data/mtg-catalog.json'
      - 'public/mtg/**'
      - 'BEC-PRIME/catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json'
      - 'scripts/test-mtg-public-contract.js'
      - 'scripts/verify-mtg-public-contract.js'
      - '.github/workflows/mtg-catalogue-validation.yml'
  push:
    branches: [main]
    paths:
      - 'public/server.js'
      - 'public/catalog.json'
      - 'public/data/mtg-catalog.json'
      - 'public/mtg/**'
      - 'BEC-PRIME/catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json'
      - 'scripts/test-mtg-public-contract.js'
      - 'scripts/verify-mtg-public-contract.js'
      - '.github/workflows/mtg-catalogue-validation.yml'

permissions:
  contents: read

jobs:
  validate-mtg-listings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test canonical MTG route, catalogue, and sales-hold contract
        run: node --test scripts/test-mtg-public-contract.js
      - name: Emit catalogue truth proof
        run: node scripts/verify-mtg-public-contract.js --out proof/mtg-catalogue-truth.json
      - name: Retain MTG catalogue truth proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mtg-catalogue-truth-${{ github.run_id }}
          path: proof/mtg-catalogue-truth.json
          if-no-files-found: error
          retention-days: 30
