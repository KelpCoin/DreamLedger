name: MTG catalogue validation

on:
  pull_request:
    paths:
      - "public/catalog.json"
      - "mtg/**"
      - "public/mtg/**"
      - ".github/workflows/mtg-catalogue-validation.yml"
  push:
    branches: [main]
    paths:
      - "public/catalog.json"
      - "mtg/**"
      - "public/mtg/**"
      - ".github/workflows/mtg-catalogue-validation.yml"

jobs:
  validate-mtg-listings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate catalogue records and buyer routes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('public/catalog.json', 'utf8'));
          const required = [
            ['EDH_0001', null],
            ['EDH_QUINTORIUS_0002', 'mtg/quintorius-field-historian.html'],
            ['EDH_DWYNEN_0003', 'mtg/dwynen-gilt-leaf-daen.html']
          ];
          const products = catalog.products || [];
          for (const [id, page] of required) {
            const p = products.find(x => x.id === id);
            if (!p || p.status !== 'published') throw new Error('Missing/unpublished MTG listing: ' + id);
            if (page && !fs.existsSync(page)) throw new Error('Missing buyer route: ' + page);
            if (id !== 'EDH_0001' && (p.checkout_available !== false || p.sale_mode !== 'claim_by_message' || !p.claim_url)) {
              throw new Error('Claim-only deck must not claim direct checkout: ' + id);
            }
          }
          const html = fs.readFileSync('mtg/index.html', 'utf8');
          if (!html.includes('/public/catalog.json')) throw new Error('Root preview catalogue must use tracked public catalogue data');
          const manifest = JSON.parse(fs.readFileSync('public/silos/mtg/silo.json', 'utf8'));
          if (manifest.catalog !== '/data/mtg-catalog.json') throw new Error('MTG manifest must point at the canonical silo catalogue path');
          const siloCatalogPath = 'public' + manifest.catalog;
          if (!fs.existsSync(siloCatalogPath)) throw new Error('Manifest catalogue file is missing: ' + siloCatalogPath);
          const siloCatalog = JSON.parse(fs.readFileSync(siloCatalogPath, 'utf8'));
          if (!Array.isArray(siloCatalog.products)) throw new Error('MTG silo catalogue has no products[]');
          const diagnostic = siloCatalog.products.find(x => x && x.id === 'COMMANDER-DECK-DIAGNOSTIC-001' && x.sku === 'CMD-DIAG-29');
          const canonicalPaymentLink = 'https://buy.stripe.com/eVqeVdc1T01n1DV3gwdwc30';
          const oldPaymentLink = 'https://buy.stripe.com/8x228r1nfg0l3M32csdwc2I';
          if (!diagnostic || Number(diagnostic.price) !== 29 || diagnostic.checkout_available !== true || diagnostic.checkout_url !== canonicalPaymentLink) {
            throw new Error('MTG silo diagnostic price / checkout contract does not match the canonical $29 offer');
          }
          if (siloCatalog.products.some(x => x && x.checkout_url === oldPaymentLink)) throw new Error('Legacy diagnostic Payment Link remains in the silo catalogue');
          const liveHtml = fs.readFileSync('public/mtg/index.html', 'utf8');
          if (!liveHtml.includes("const MANIFEST='/silos/mtg/silo.json'") || !liveHtml.includes("fetch(catalogUrl,{cache:'no-store'})")) {
            throw new Error('Live MTG surface must load its catalogue through the silo manifest');
          }
          const publicCatalog = JSON.parse(fs.readFileSync('public/catalog.json', 'utf8'));
          const publicDiagnostic = (publicCatalog.products || []).find(x => x && x.id === 'COMMANDER-DECK-DIAGNOSTIC-001' && x.sku === 'CMD-DIAG-29');
          if (!publicDiagnostic || publicDiagnostic.checkout_url !== canonicalPaymentLink || Number(publicDiagnostic.price) !== 29) {
            throw new Error('Public catalogue does not match the canonical $29 diagnostic offer');
          }
          for (const page of ['public/mtg/quintorius-field-historian.html', 'public/mtg/dwynen-gilt-leaf-daen.html']) {
            if (!fs.existsSync(page)) throw new Error('Missing deployed public route: ' + page);
          }
          if (!html.includes('EDH_QUINTORIUS_0002') || !html.includes('EDH_DWYNEN_0003')) throw new Error('Catalogue must prioritize the new decks');
          for (const page of ['mtg/quintorius-field-historian.html', 'mtg/dwynen-gilt-leaf-daen.html']) {
            const body = fs.readFileSync(page, 'utf8');
            if (!body.includes('decklist') && !body.includes('decklist')) throw new Error('Missing decklist reference in ' + page);
          }
          console.log('MTG catalogue validation passed.');
          NODE
