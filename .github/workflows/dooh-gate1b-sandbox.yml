name: DOOH Gate 1B Sandbox

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    name: Register agent and provision sandbox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup PowerShell
        shell: bash
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Run Gate 1B sandbox harness
        shell: pwsh
        env:
          NPM_CONFIG_FUND: 'false'
          NPM_CONFIG_AUDIT: 'false'
        run: ./DOOH/Gate1B-Sandbox.ps1 -OutputDir DOOH/GATE1B

      - name: Upload Gate 1B evidence
        uses: actions/upload-artifact@v4
        with:
          name: dooh-gate1b-sandbox-evidence
          path: DOOH/GATE1B/**
          if-no-files-found: error
