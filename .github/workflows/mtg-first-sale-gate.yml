name: MTG First-Sale Guard Gate

on:
  push:
    branches: [main]
    paths:
      - 'public/server.js'
      - 'public/mtg/**'
      - 'public/data/mtg-catalog.json'
      - 'public/catalog.json'
      - 'BEC-PRIME/catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json'
      - 'scripts/test-mtg-public-contract.js'
      - 'scripts/verify-mtg-public-contract.js'
      - 'scripts/Verify-MTG-PublicContract.ps1'
      - '.github/workflows/mtg-first-sale-gate.yml'
  pull_request:
    paths:
      - 'public/server.js'
      - 'public/mtg/**'
      - 'public/data/mtg-catalog.json'
      - 'public/catalog.json'
      - 'BEC-PRIME/catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json'
      - 'scripts/test-mtg-public-contract.js'
      - 'scripts/verify-mtg-public-contract.js'
      - 'scripts/Verify-MTG-PublicContract.ps1'
      - '.github/workflows/mtg-first-sale-gate.yml'
  workflow_dispatch:
    inputs:
      release_sha:
        description: Optional immutable commit SHA to verify instead of the dispatch branch tip
        required: false
        default: ''
        type: string
  schedule:
    - cron: '31 */6 * * *'

concurrency:
  group: dreamledger-mtg-first-sale-guard
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact verification commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test MTG public route and economic truth contracts
        run: node --test scripts/test-mtg-public-contract.js

      - name: Emit source contract proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          node scripts/verify-mtg-public-contract.js --out proof/mtg-public-contract.json
          cat proof/mtg-public-contract.json

      - name: Retain MTG contract proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mtg-public-contract-${{ github.run_id }}
          path: proof/mtg-public-contract.json
          if-no-files-found: error
          retention-days: 30
