name: MTG First Sale Gate

on:
  push:
    branches: [main]
    paths:
      - 'BEC-PRIME/catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json'
      - 'BEC-PRIME/scripts/Verify-RevenueReadiness.ps1'
      - 'BEC-PRIME/compiled/website/**'
      - '.github/workflows/mtg-first-sale-gate.yml'
  workflow_dispatch:
    inputs:
      release_sha:
        description: Optional immutable commit SHA to verify instead of the dispatch branch tip
        required: false
        default: ''
        type: string
  schedule:
    - cron: '31 */6 * * *'

concurrency:
  group: dreamledger-mtg-first-sale-gate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact verification commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 1

      - name: Record immutable verification SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          echo "VERIFY_SHA=$RELEASE_SHA"

      - name: Verify canonical revenue readiness
        shell: pwsh
        run: pwsh -NoProfile -File BEC-PRIME/scripts/Verify-RevenueReadiness.ps1

      - name: Verify Commander is held with a correctly represented reference price
        shell: pwsh
        run: |
          $product = Get-Content BEC-PRIME/catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json -Raw | ConvertFrom-Json
          if ($product.id -ne 'COMMANDER-DECK-DIAGNOSTIC-001') { throw 'wrong canonical product' }
          if ([double]$product.price -ne 29 -or $product.price_unit -ne 'major') { throw 'reference price must be NZD 29 major units' }
          if ($product.currency -ne 'nzd') { throw 'canonical currency is not nzd' }
          if ($product.status -ne 'held' -or $product.checkout.mode -ne 'disabled') { throw 'Commander sale must remain held until durable delivery is verified' }
          if ($product.commercial_truth.sellable -ne $false -or $product.fulfillment.operator_required -ne $true) { throw 'Held product truth is inconsistent' }
          Write-Host 'CANONICAL_MTG_PRODUCT=PASS'
          Write-Host 'REFERENCE_PRICE_NZD=29.00'
          Write-Host 'CHECKOUT_STATE=HELD'

      - name: Verify public offers do not expose held Commander checkout
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o offers.json -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 20 https://dreamledger.org/api/offers || true)
          test "$code" = "200"
          python - <<'PY'
          import json
          data=json.load(open('offers.json',encoding='utf-8'))
          offers=data.get('offers', []) if isinstance(data,dict) else []
          target=None
          identities={'COMMANDER-DECK-DIAGNOSTIC-001','CMD-DIAG-29','OFFER-CMD-DIAG-29-NZD'}
          for item in offers:
              found={str(item.get(k) or '') for k in ('offer_id','product_sku','product_id','sku','id')}
              if found & identities:
                  target=item
                  break
          if target is not None:
              if target.get('checkout_available') is True:
                  raise SystemExit('PUBLIC_MTG_CHECKOUT=UNSAFE_ACTIVE')
              if target.get('checkout_url') or target.get('payment_link_url'):
                  raise SystemExit('PUBLIC_MTG_PAYMENT_URL=EXPOSED')
              if str(target.get('status','')).lower() not in ('held','blocked','unavailable','not_available'):
                  raise SystemExit('PUBLIC_MTG_RELEASE_STATE=AMBIGUOUS')
          print('PUBLIC_MTG_HELD_OFFER_NOT_PURCHASABLE=PASS')
          print('PUBLIC_MTG_DIRECT_PAYMENT_URL=ABSENT')
          PY

      - name: Emit honest release readiness proof
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p proof
          printf '{"status":"HOLD_DURABLE_FULFILLMENT_UNVERIFIED","sha":"%s","sku":"COMMANDER-DECK-DIAGNOSTIC-001","reference_price_nzd":29,"checkout_enabled":false,"verified_revenue_nzd":0,"payment_truth":"NO_VERIFIED_REVENUE","public_payment_not_claimed":true}\n' "$RELEASE_SHA" > proof/mtg-first-sale-readiness.json
          cat proof/mtg-first-sale-readiness.json

      - name: Upload first-sale proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mtg-first-sale-readiness-${{ github.run_id }}
          path: proof/mtg-first-sale-readiness.json
          if-no-files-found: error
          retention-days: 30
