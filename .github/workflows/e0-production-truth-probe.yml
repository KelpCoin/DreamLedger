name: E0 Production Truth Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dreamledger-e0-production-truth
  cancel-in-progress: false

env:
  BASE_URL: https://dreamledger.org

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Define expected production SHA
        shell: bash
        run: echo "EXPECTED_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Verify source SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "source_sha=$actual"
          test "$actual" = "$GITHUB_SHA"

      - name: Probe canonical production routes
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local path="$1"
            local file="$2"
            local status
            status=$(curl -sS -o "$file" -w '%{http_code}' --max-time 20 --retry 3 --retry-delay 2 "$BASE_URL$path" || true)
            echo "$path http=$status"
            printf '%s\n' "$status" > "$file.status"
          }

          probe / /tmp/home.html
          probe /healthz /tmp/healthz.json
          probe /version /tmp/version.json
          probe /api/offers /tmp/offers.json
          probe /api/products /tmp/products.json

      - name: Verify E0 contract
        shell: bash
        run: |
          set -euo pipefail
          home="$(cat /tmp/home.html.status)"
          health="$(cat /tmp/healthz.json.status)"
          version="$(cat /tmp/version.json.status)"
          offers="$(cat /tmp/offers.json.status)"
          products="$(cat /tmp/products.json.status)"

          echo "home_http=$home"
          echo "healthz_http=$health"
          echo "version_http=$version"
          echo "offers_http=$offers"
          echo "products_http=$products"

          test "$home" = "200"
          test "$health" = "200"
          test "$version" = "200"
          test "$offers" = "200"
          test "$products" = "200"

          python3 - <<'PY'
          import json, os
          expected = os.environ['EXPECTED_SHA']

          with open('/tmp/version.json', 'r', encoding='utf-8') as f:
              version = json.load(f)
          deployed = version.get('commit') or version.get('sha')
          print('deployed_sha=' + str(deployed))
          if deployed != expected:
              raise SystemExit(f'FAIL: production SHA {deployed!r} != workflow SHA {expected!r}')

          with open('/tmp/healthz.json', 'r', encoding='utf-8') as f:
              health = json.load(f)
          if health.get('status') != 'ok':
              raise SystemExit('FAIL: /healthz did not return {status: ok}')

          with open('/tmp/offers.json', 'r', encoding='utf-8') as f:
              offers = json.load(f)
          if not isinstance(offers, dict) or not isinstance(offers.get('offers'), list):
              raise SystemExit('FAIL: /api/offers did not return an offers array')

          with open('/tmp/products.json', 'r', encoding='utf-8') as f:
              products = json.load(f)
          if not isinstance(products, dict) or not isinstance(products.get('products'), list):
              raise SystemExit('FAIL: /api/products did not return a products array')

          print('PASS: canonical E0 contract is satisfied')
          PY

      - name: Emit E0 proof artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 - <<'PY'
          import json, os, time
          def status(path):
              try:
                  return open(path, encoding='utf-8').read().strip()
              except Exception:
                  return '0'
          statuses = {
              'home_http': status('/tmp/home.html.status'),
              'healthz_http': status('/tmp/healthz.json.status'),
              'version_http': status('/tmp/version.json.status'),
              'offers_http': status('/tmp/offers.json.status'),
              'products_http': status('/tmp/products.json.status'),
          }
          proof = {
              'schema_version': 'BEC-E0-TRUTH-PROBE-3.0',
              'workflow': os.environ.get('GITHUB_WORKFLOW'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'source_sha': os.environ.get('GITHUB_SHA'),
              'expected_sha': os.environ.get('EXPECTED_SHA'),
              'base_url': os.environ.get('BASE_URL'),
              **statuses,
              'status': 'PRODUCTION_VERIFIED' if all(v == '200' for v in statuses.values()) else 'NOT_VERIFIED',
              'timestamp_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
          }
          with open('proof/e0-production-truth.json', 'w', encoding='utf-8') as f:
              json.dump(proof, f, indent=2)
          print(json.dumps(proof, indent=2))
          PY

      - name: Upload E0 proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e0-production-truth-${{ github.sha }}
          path: proof/e0-production-truth.json
          if-no-files-found: error
          retention-days: 30
