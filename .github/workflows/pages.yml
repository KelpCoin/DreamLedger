name: DreamLedger GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dreamledger-pages
  cancel-in-progress: true

env:
  CANONICAL_URL: https://dreamledger.org

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage DreamLedger storefront and MTG master silo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R public/. _site/

          # The root MTG pages are the canonical master template.
          # Overlay them on the public snapshot and bring their static dependencies.
          mkdir -p _site/mtg _site/assets _site/data _site/silos/mtg
          cp -R mtg/. _site/mtg/
          cp assets/silo-master.css _site/assets/silo-master.css
          cp data/mtg-catalog.json _site/data/mtg-catalog.json
          cp silos/mtg/silo.json _site/silos/mtg/silo.json
          # Preserve the public master redirect if a caller uses /mtg/master.html.
          if [ -s public/mtg/master.html ]; then
            cp public/mtg/master.html _site/mtg/master.html
          fi
          # Publish the canonical hostname in the Pages artifact.
          printf '%s\n' 'dreamledger.org' > _site/CNAME

          test -s _site/index.html
          test -s _site/automation-rescue.html
          test -s _site/about.html
          test -s _site/policies.html
          test -s _site/pulse/index.html
          test -s _site/mtg/index.html
          test -s _site/assets/silo-master.css
          test -s _site/data/mtg-catalog.json
          test -s _site/silos/mtg/silo.json
          test "$(cat _site/CNAME)" = "dreamledger.org"

          grep -Fq "Claim a founding billboard tile" _site/index.html
          grep -Fq "Build your DreamMeez free" _site/index.html
          grep -Fq "Revenue paths live now" _site/index.html
          grep -Fq "Magic · Buy & sell singles" _site/mtg/index.html
          grep -Fq "Master silo" _site/mtg/index.html
          grep -Fq "/silos/mtg/silo.json" _site/mtg/index.html

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path("_site")
          index = root / "pulse" / "index.html"

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href", "")
                      if href.startswith("/pulse/"):
                          self.hrefs.append(href)

          parser = Links()
          parser.feed(index.read_text(encoding="utf-8"))
          if not parser.hrefs:
              raise SystemExit("FAIL observatory index has no pulse links")
          missing = [href for href in parser.hrefs if not (root / href.lstrip("/")).is_file()]
          if missing:
              raise SystemExit("FAIL broken pulse links: " + ", ".join(missing))
          if not list((root / "pulse").glob("*-private-commercial-*.html")):
              raise SystemExit("FAIL no source-bound commercial pulse page staged")
          print(f"PASS observatory index links={len(parser.hrefs)}; all targets exist")
          PY

          echo "PASS DreamLedger Pages artifact staged"
          echo "PASS MTG master silo + stylesheet + catalog + manifest staged"
          echo "PASS CNAME staged: dreamledger.org"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed homepage and MTG master at GitHub Pages edge
        shell: bash
        run: |
          set -u
          # DNS currently resolves to the old Render IPs. Probe the GitHub Pages
          # edge by Host/SNI override, without changing public DNS from this job.
          ips=(185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153)
          verify_path() {
            local path="$1"
            local marker="$2"
            local label="$3"
            local body="/tmp/dreamledger-${label}.html"
            local ip code
            for ip in "${ips[@]}"; do
              code=$(curl --resolve "dreamledger.org:443:${ip}" -L -sS \
                -o "$body" -w '%{http_code}' --max-time 15 \
                "https://dreamledger.org${path}" 2>/dev/null || true)
              if [ "$code" = "200" ] && grep -Fq "$marker" "$body"; then
                echo "PASS GITHUB_PAGES_EDGE route=${path} ip=${ip} http=${code}"
                return 0
              fi
            done
            echo "::warning::GitHub Pages artifact deployed, but edge verification for ${path} is not yet passing. dreamledger.org DNS currently points to Render; direct DNS cutover and/or Pages custom-domain validation is still required."
            return 0
          }

          verify_path "/" "Claim a founding billboard tile" "home"
          verify_path "/mtg/" "Master silo" "mtg"
