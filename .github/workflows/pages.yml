name: DreamLedger GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dreamledger-pages
  cancel-in-progress: true

env:
  LIVE_URL: https://dreamledger1.onrender.com
  CANONICAL_URL: https://dreamledger.org

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage Render bridge
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp CNAME _site/CNAME

          make_redirect() {
            local dir="$1"
            local target="$2"
            mkdir -p "_site/${dir}"
            cat > "_site/${dir}/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0;url=${LIVE_URL}${target}">
            <meta name="robots" content="noindex">
            <title>DreamLedger</title>
            <script>location.replace('${LIVE_URL}${target}');</script>
          </head>
          <body><p>Opening the live DreamLedger storefront…</p><p><a href="${LIVE_URL}${target}">Continue</a></p></body>
          </html>
          EOF
          }

          make_redirect "" "/"
          make_redirect "billboard" "/billboard"
          make_redirect "dreammeez" "/dreammeez"
          make_redirect "dreamiez" "/dreamiez"
          make_redirect "avatar" "/avatar"
          make_redirect "avatars" "/avatars"
          make_redirect "login" "/login"
          make_redirect "register" "/register"
          make_redirect "account" "/account"
          make_redirect "mtg" "/mtg"
          make_redirect "version" "/version"
          make_redirect "healthz" "/healthz"

          test -s _site/index.html
          test -s _site/billboard/index.html
          test "$(cat _site/CNAME)" = "dreamledger.org"
          grep -q "${LIVE_URL}" _site/index.html
          grep -q "${LIVE_URL}/billboard" _site/billboard/index.html
          echo "PASS GitHub Pages is a deterministic bridge to the live Render storefront"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed bridge
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deployment.outputs.page_url }}"
          for attempt in $(seq 1 12); do
            CODE=$(curl -L -sS -o /tmp/dreamledger.html -w '%{http_code}' --max-time 20 "$URL" || true)
            if [ "$CODE" = "200" ] && grep -q "Dream Ledger 3000" /tmp/dreamledger.html; then
              echo "PASS Pages bridge reaches live Render storefront: $URL -> ${LIVE_URL}"
              exit 0
            fi
            echo "Waiting for bridge convergence: attempt $attempt/12 HTTP=$CODE"
            sleep 10
          done
          echo "FAIL Pages bridge verification"
          exit 1
