name: DreamLedger GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dreamledger-pages
  cancel-in-progress: true

env:
  CANONICAL_URL: https://dreamledger.org

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage current public storefront
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R public/. _site/
          cp CNAME _site/CNAME

          test -s _site/index.html
          test -s _site/automation-rescue.html
          test -s _site/about.html
          test -s _site/policies.html
          test "$(cat _site/CNAME)" = "dreamledger.org"
          grep -q "ONE BROKEN WORKFLOW" _site/index.html
          grep -q "buy.stripe.com/6oU28r7LD6pL4Q74kAdwc2z" _site/index.html
          grep -q "NZ$99" _site/index.html
          echo "PASS canonical Pages surface stages current Automation Rescue storefront"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed canonical storefront
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deployment.outputs.page_url }}"
          for attempt in $(seq 1 12); do
            CODE=$(curl -L -sS -o /tmp/dreamledger.html -w '%{http_code}' --max-time 20 "$URL" || true)
            if [ "$CODE" = "200" ] && grep -q "ONE BROKEN WORKFLOW" /tmp/dreamledger.html && grep -q "buy.stripe.com/6oU28r7LD6pL4Q74kAdwc2z" /tmp/dreamledger.html; then
              echo "PASS Pages canonical storefront verified: $URL"
              exit 0
            fi
            echo "Waiting for Pages convergence: attempt $attempt/12 HTTP=$CODE"
            sleep 10
          done
          echo "FAIL Pages canonical storefront verification"
          exit 1
