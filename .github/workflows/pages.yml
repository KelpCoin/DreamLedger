name: DreamLedger GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dreamledger-pages
  cancel-in-progress: true

env:
  CANONICAL_URL: https://dreamledger.org

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage DreamLedger storefront and MTG master silo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R public/. _site/

          # The root MTG pages are the canonical master template.
          # Overlay them on the public snapshot and bring their static dependencies.
          mkdir -p _site/mtg _site/assets _site/data _site/silos/mtg
          cp -R mtg/. _site/mtg/
          cp assets/silo-master.css _site/assets/silo-master.css
          cp data/mtg-catalog.json _site/data/mtg-catalog.json
          cp silos/mtg/silo.json _site/silos/mtg/silo.json
          # Preserve the public master redirect if a caller uses /mtg/master.html.
          if [ -s public/mtg/master.html ]; then
            cp public/mtg/master.html _site/mtg/master.html
          fi
          # Publish the canonical hostname in the Pages artifact.
          printf '%s\n' 'dreamledger.org' > _site/CNAME

          test -s _site/index.html
          test -s _site/automation-rescue.html
          test -s _site/about.html
          test -s _site/policies.html
          test -s _site/pulse/index.html
          test -s _site/mtg/index.html
          test -s _site/assets/silo-master.css
          test -s _site/assets/mtg-dreamledger-theme.css
          test -s _site/data/mtg-catalog.json
          test -s _site/silos/mtg/silo.json
          test "$(cat _site/CNAME)" = "dreamledger.org"

          grep -Fq "Claim a founding billboard tile" _site/index.html
          grep -Fq "Build your DreamMeez free" _site/index.html
          grep -Fq "Revenue paths live now" _site/index.html
          grep -Fq "Magic NZ · Cards, decks &amp; community" _site/mtg/index.html
          grep -Fq "Your free deck workbench" _site/mtg/index.html
          grep -Fq "/silos/mtg/silo.json" _site/mtg/index.html
          grep -Fq "mtg-dreamledger-theme.css" _site/mtg/index.html
          grep -Fq -- "--dl-home-mint:#a9f2d0" _site/assets/mtg-dreamledger-theme.css

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path("_site")
          index = root / "pulse" / "index.html"

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href", "")
                      if href.startswith("/pulse/"):
                          self.hrefs.append(href)

          parser = Links()
          parser.feed(index.read_text(encoding="utf-8"))
          if not parser.hrefs:
              raise SystemExit("FAIL observatory index has no pulse links")
          missing = [href for href in parser.hrefs if not (root / href.lstrip("/")).is_file()]
          if missing:
              raise SystemExit("FAIL broken pulse links: " + ", ".join(missing))
          if not list((root / "pulse").glob("*-private-commercial-*.html")):
              raise SystemExit("FAIL no source-bound commercial pulse page staged")
          print(f"PASS observatory index links={len(parser.hrefs)}; all targets exist")
          PY

          echo "PASS DreamLedger Pages artifact staged"
          echo "PASS MTG master silo + stylesheet + catalog + manifest staged"
          echo "PASS CNAME staged: dreamledger.org"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public GitHub Pages deployment
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}/"
          fetch_check() {
            local path="$1"
            local marker="$2"
            local body
            body="$(mktemp)"
            local code
            code="$(curl -sS -L -o "$body" -w '%{http_code}' --max-time 20 "${base}${path}")"
            if [ "$code" != "200" ]; then
              echo "FAIL public route=${path} http=${code} url=${base}${path}"
              cat "$body" | head -c 1000 || true
              rm -f "$body"
              exit 1
            fi
            if [ -n "$marker" ] && ! grep -Fq -- "$marker" "$body"; then
              echo "FAIL marker missing route=${path} marker=${marker}"
              rm -f "$body"
              exit 1
            fi
            echo "PASS public route=${path} http=200"
            rm -f "$body"
          }

          # Fail the workflow if the actual public host cannot serve the artifact.
          # A successful artifact upload alone is not proof of a working site.
          fetch_check "" "Claim a founding billboard tile"
          fetch_check "mtg/" "Your free deck workbench"
          fetch_check "assets/silo-master.css" ":root"
          fetch_check "assets/mtg-dreamledger-theme.css" "--dl-home-mint:#a9f2d0"
          fetch_check "data/mtg-catalog.json" '"products"'
          fetch_check "silos/mtg/silo.json" '"slug"'

          echo "PASS public homepage, MTG master, stylesheet, catalog, and manifest are reachable"
