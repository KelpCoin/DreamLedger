name: DreamLedger GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dreamledger-pages
  cancel-in-progress: true

env:
  CANONICAL_URL: https://dreamledger.org

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage DreamLedger storefront
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R public/. _site/
          rm -f _site/CNAME

          test -s _site/index.html
          test -s _site/automation-rescue.html
          test -s _site/about.html
          test -s _site/policies.html
          test ! -e _site/CNAME
          test -s _site/pulse/index.html
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path("_site")
          index = root / "pulse" / "index.html"
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href", "")
                      if href.startswith("/pulse/"):
                          self.hrefs.append(href)

          parser = Links()
          parser.feed(index.read_text(encoding="utf-8"))
          if not parser.hrefs:
              raise SystemExit("FAIL observatory index has no pulse links")
          missing = [href for href in parser.hrefs if not (root / href.lstrip("/")).is_file()]
          if missing:
              raise SystemExit("FAIL broken pulse links: " + ", ".join(missing))
          if not list((root / "pulse").glob("*-private-commercial-*.html")):
              raise SystemExit("FAIL no source-bound commercial pulse page staged")
          print(f"PASS observatory index links={len(parser.hrefs)}; all targets exist") 
          PY
          grep -Fq "Clearer decisions. Verifiable outcomes." _site/index.html
          grep -Fq "Start with a free worksheet" _site/index.html
          grep -Fq "comparing supplier quotes" _site/index.html
          grep -Fq "777 Economic Observatory" _site/pulse/index.html
          grep -Fq "VERIFIED_EXTERNAL_REVENUE" _site/pulse/index.html
          echo "PASS DreamLedger Pages artifact staged"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed DreamLedger front door
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deployment.outputs.page_url }}"
          for attempt in $(seq 1 12); do
            CODE=$(curl -L -sS -o /tmp/dreamledger.html -w '%{http_code}' --max-time 20 "$URL" || true)
            if [ "$CODE" = "200" ] && grep -Fq "Clearer decisions. Verifiable outcomes." /tmp/dreamledger.html && grep -Fq "Start with a free worksheet" /tmp/dreamledger.html && grep -Fq "comparing supplier quotes" /tmp/dreamledger.html; then
              echo "PASS GitHub Pages DreamLedger front door verified: $URL"
              exit 0
            fi
            echo "Waiting for Pages deployment: attempt $attempt/12 HTTP=$CODE"
            sleep 10
          done
          echo "FAIL GitHub Pages DreamLedger front-door verification"
          exit 1
