name: DreamLedger GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dreamledger-pages
  cancel-in-progress: true

env:
  CANONICAL_URL: https://dreamledger.org
  FOUNDING_TILE_CHECKOUT: https://buy.stripe.com/9B66oH2rj3dz82jcR6dwc2x

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage Billboard storefront
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R public/. _site/
          cp CNAME _site/CNAME

          test -s _site/index.html
          test -s _site/automation-rescue.html
          test -s _site/about.html
          test -s _site/policies.html
          test "$(cat _site/CNAME)" = "dreamledger.org"
          grep -Fq "DREAMLEDGER 3000" _site/index.html
          grep -Fq "FOUNDING TILES" _site/index.html
          grep -Fq 'NZ$50' _site/index.html
          grep -Fq "$FOUNDING_TILE_CHECKOUT" _site/index.html
          grep -Fq 'Buy Founding Tile' _site/index.html
          grep -Fq 'until January 1, 3000' _site/index.html
          echo "PASS Billboard Pages artifact staged"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed Billboard
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deployment.outputs.page_url }}"
          for attempt in $(seq 1 12); do
            CODE=$(curl -L -sS -o /tmp/dreamledger.html -w '%{http_code}' --max-time 20 "$URL" || true)
            if [ "$CODE" = "200" ] && grep -Fq "DREAMLEDGER 3000" /tmp/dreamledger.html && grep -Fq "FOUNDING TILES" /tmp/dreamledger.html && grep -Fq 'NZ$50' /tmp/dreamledger.html && grep -Fq "$FOUNDING_TILE_CHECKOUT" /tmp/dreamledger.html && grep -Fq 'Buy Founding Tile' /tmp/dreamledger.html; then
              echo "PASS GitHub Pages Billboard verified: $URL"
              exit 0
            fi
            echo "Waiting for Pages deployment: attempt $attempt/12 HTTP=$CODE"
            sleep 10
          done
          echo "FAIL GitHub Pages Billboard verification"
          exit 1
