name: BECK Vercel-Neon Marketplace Contract
on:
  pull_request:
    paths:
      - 'handlers/cube/marketplace.js'
      - 'handlers/cube/marketplace.test.js'
      - 'api/[...route].ts'
      - 'package.json'
      - '.github/workflows/vercel-neon-commerce-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed pull request merge tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate exact public SQL projection and adversarial cases
        run: node --test handlers/cube/marketplace.test.js
      - name: Validate handler and public release tree
        run: |
          node --check handlers/cube/marketplace.js
          node scripts/verify-vercel-public-release.cjs
      - name: Confirm new public marketplace does not depend on Supabase or file cookies
        run: |
          if grep -iE 'SUPABASE|dreamiez_session|readFileSync|writeFileSync' handlers/cube/marketplace.js; then
            echo 'LEGACY_OR_UNSAFE_AUTH_IN_NEW_MARKETPLACE'; exit 1
          fi
      - name: Install pinned Neon driver without lifecycle scripts
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          node -e "const {neon}=require('@neondatabase/serverless'); if (typeof neon!=='function') process.exit(1)"
          node --test handlers/cube/marketplace.test.js
