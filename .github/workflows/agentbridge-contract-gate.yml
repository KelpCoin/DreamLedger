name: AgentBridge Contract Gate

on:
  push:
    branches: [main]
    paths:
      - 'BEC-PRIME/runtime/AgentBridge.js'
      - 'BEC-PRIME/runtime/AgentBridgeFencedAdapter.js'
      - 'BEC-PRIME/runtime/AgentBridgeProxyAdapter.js'
      - 'BEC-PRIME/scripts/Verify-AgentBridge-*.js'
      - 'BEC-PRIME/scripts/CortexEconomicWorker.ps1'
      - 'scripts/bridge_ping.py'
      - 'scripts/bridge_process_inbox.py'
      - 'tests/test_agent_bridge_productization_context.py'
      - 'AGENT_BUS/BRIDGE/PROTOCOL.md'
      - 'AGENT_BUS/BRIDGE/BECK_PRODUCTIZATION_GTM.md'
      - '.github/workflows/agentbridge-contract-gate.yml'
  pull_request:
    paths:
      - 'handlers/agentbridge/cosmetic-*'
      - 'ops/dreammeez/neon_creator_*'
      - 'api/[...route].ts'
      - 'public/creator-studio.html'
      - 'package.json'
      - 'BEC-PRIME/runtime/AgentBridge.js'
      - 'BEC-PRIME/runtime/AgentBridgeFencedAdapter.js'
      - 'BEC-PRIME/runtime/AgentBridgeProxyAdapter.js'
      - 'BEC-PRIME/scripts/Verify-AgentBridge-*.js'
      - 'BEC-PRIME/scripts/CortexEconomicWorker.ps1'
      - '.github/workflows/agentbridge-contract-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentbridge-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Syntax gate
        run: |
          set -euo pipefail
          node --check BEC-PRIME/runtime/AgentBridge.js
          node --check BEC-PRIME/runtime/AgentBridgeFencedAdapter.js
          node --check BEC-PRIME/runtime/AgentBridgeProxyAdapter.js
          node --check BEC-PRIME/scripts/Verify-AgentBridge-Contract.js
          node --check BEC-PRIME/scripts/Verify-AgentBridge-Live.js

      - name: Run no-secret contract verification
        run: node BEC-PRIME/scripts/Verify-AgentBridge-Contract.js

      - name: Test Agent Bridge productization context gate
        run: python -m unittest tests.test_agent_bridge_productization_context -v

      - name: Creator Bridge unit and authorization gate
        run: |
          node --check handlers/agentbridge/cosmetic-policy.js
          node --check handlers/agentbridge/cosmetic-intake.js
          node --test handlers/agentbridge/cosmetic-policy.test.js handlers/agentbridge/cosmetic-intake.test.js
      - name: Private Peggy Neon SQL integration (disposable Docker only)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name beck-creator-pg             -e POSTGRES_USER=becko_ci -e POSTGRES_PASSWORD=ci-only             -e POSTGRES_DB=becko_ci postgres:16
          trap 'docker rm -f beck-creator-pg >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if docker exec beck-creator-pg pg_isready -U becko_ci -d becko_ci >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker cp ops/dreammeez/neon_creator_intake.sql beck-creator-pg:/tmp/creator-schema.sql
          docker cp ops/dreammeez/neon_creator_ci_verify.sql beck-creator-pg:/tmp/creator-verify.sql
          docker exec beck-creator-pg psql -X -U becko_ci -d becko_ci -v ON_ERROR_STOP=1 -f /tmp/creator-schema.sql
          docker exec beck-creator-pg psql -X -U becko_ci -d becko_ci -v ON_ERROR_STOP=1 -f /tmp/creator-verify.sql
      - name: Report boundary
        run: |
          echo 'PASS: AgentBridge syntax gate executed.'
          echo 'PASS: fenced HTTP adapter is included in the contract gate.'
          echo 'PASS: consequential external actions remain human-approval gated.'
          echo 'PASS: contract test performs no Supabase writes and cannot manufacture RA_000001.'
