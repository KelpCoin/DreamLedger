name: DreamLedger Cloud Primary

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: dreamledger-cloud-primary
  cancel-in-progress: true

env:
  BILLBOARD_PAYMENT_LINK_ID: plink_1U5GX8EGgEAnUFF9y2YGkIhv
  BILLBOARD_PAYMENT_URL: https://buy.stripe.com/28EcN54zraG13M3g3idwc1t
  LIVE_URL: https://dreamledger.org
  VERCEL_TEAM_ID: team_HNsRrUI7JZV4iwejNlqJjXvR
  VERCEL_PROJECT_NAME: dreamledger-production
  NODE_VERSION: 24

jobs:
  cloud-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile canonical commerce surface
        run: npm run compile

      - name: Syntax and artifact gate
        shell: bash
        run: |
          set -euo pipefail
          node --check BEC-PRIME/start.js
          node --check BEC-PRIME/compiler/BillboardCompiler.js
          node --check BEC-PRIME/scripts/verify-public-surface.js
          test -s BEC-PRIME/compiled/website/billboard.html
          test -s BEC-PRIME/compiled/website/board.html
          echo "PASS: canonical build and Billboard artifacts exist."

      - name: Run first-party smoke test when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -f BEC-PRIME/scripts/first-party-smoke.js ]; then
            node BEC-PRIME/scripts/first-party-smoke.js
          else
            echo "WARN: first-party smoke test not present"
          fi

      - name: Create or link Vercel project when credentials exist
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest link --yes --scope "$VERCEL_TEAM_ID" --project "$VERCEL_PROJECT_NAME" --token="$VERCEL_TOKEN"
          test -s .vercel/project.json
          echo "PASS: Vercel project context established."
          cat .vercel/project.json

      - name: Vercel production deployment when credentials exist
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Record Vercel configuration state
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          mkdir -p cloud-proof
          if [ -n "$VERCEL_TOKEN" ] && [ -s .vercel/project.json ]; then
            project_id=$(python3 -c 'import json; print(json.load(open(".vercel/project.json"))["projectId"])')
            printf '{"state":"CONFIGURED","team_id":"%s","project_id":"%s","project_name":"%s"}\n' "$VERCEL_TEAM_ID" "$project_id" "$VERCEL_PROJECT_NAME" > cloud-proof/vercel-state.json
          else
            printf '{"state":"NOT_CONFIGURED","team_id":"%s","project_name":"%s","next_step":"Set GitHub Actions secret VERCEL_TOKEN"}\n' "$VERCEL_TEAM_ID" "$VERCEL_PROJECT_NAME" > cloud-proof/vercel-state.json
          fi
          cat cloud-proof/vercel-state.json

      - name: Verify live health doorway
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/healthz.json -w "%{http_code}" --max-time 20 "$LIVE_URL/healthz" || true)
          cat /tmp/healthz.json 2>/dev/null || true
          echo
          echo "HEALTHZ_HTTP_STATUS=$code"
          test "$code" = "200"

      - name: Probe live Billboard doorway
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/billboard.html -w "%{http_code}" --max-time 20 "$LIVE_URL/billboard" || true)
          bytes=0
          if [ -f /tmp/billboard.html ]; then bytes=$(wc -c < /tmp/billboard.html); fi
          mkdir -p cloud-proof
          printf '{\n  "http_status": %s,\n  "bytes": %s,\n  "reachable": %s\n}\n' "$code" "$bytes" "$([ "$code" = "200" ] && echo true || echo false)" > cloud-proof/billboard-doorway.json
          cat cloud-proof/billboard-doorway.json
          if [ "$code" != "200" ] || [ "$bytes" -le 0 ]; then
            echo "WARN: /billboard is not yet public."
          fi

      - name: Verify Stripe payment doorway
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/stripe.html -w "%{http_code}" --max-time 20 "$BILLBOARD_PAYMENT_URL")
          test "$code" = "200"
          test -s /tmp/stripe.html
          echo "PASS: Stripe Billboard checkout returned HTTP 200."

      - name: Verify economic scoreboard from Stripe
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloud-proof
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.error, urllib.parse, urllib.request
          out = pathlib.Path("cloud-proof/economic-scoreboard.json")
          link_id = os.environ["BILLBOARD_PAYMENT_LINK_ID"]
          key = os.environ.get("STRIPE_SECRET_KEY", "")
          result = {
              "payment_link_id": link_id,
              "payment_url": os.environ["BILLBOARD_PAYMENT_URL"],
              "currency": "nzd",
              "verified_billboard_revenue_nzd": 0,
              "completed_paid_sessions": 0,
              "status": "MISSING_STRIPE_SECRET_KEY" if not key else "UNKNOWN",
              "source": "Stripe Checkout Sessions filtered by payment_link and payment_status=paid",
              "truth_rule": "Only paid completed Checkout Sessions for the canonical Billboard payment link count."
          }
          if key:
              try:
                  q = urllib.parse.urlencode({"payment_link": link_id, "limit": "100"})
                  req = urllib.request.Request("https://api.stripe.com/v1/checkout/sessions?" + q)
                  req.add_header("Authorization", "Basic " + base64.b64encode((key + ":").encode()).decode())
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = json.load(r)
                  paid = [s for s in data.get("data", []) if s.get("payment_status") == "paid" and s.get("status") == "complete"]
                  total = sum((s.get("amount_total") or 0) for s in paid)
                  result["verified_billboard_revenue_nzd"] = total / 100
                  result["completed_paid_sessions"] = len(paid)
                  result["status"] = "VERIFIED"
              except urllib.error.HTTPError as exc:
                  result["status"] = "STRIPE_API_ERROR"
                  result["http_status"] = exc.code
                  result["note"] = "Stripe checkout remains reachable; economic verification requires a usable Checkout Sessions API credential."
          out.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(out.read_text())
          PY

      - name: Write cloud proof manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloud-proof
          cat > cloud-proof/cloud-proof.json <<EOF
          {
            "workflow": "dreamledger-cloud-primary",
            "commit": "${GITHUB_SHA}",
            "live_url": "${LIVE_URL}",
            "canonical_build": true,
            "vercel_project_creation_or_linking": "attempted when VERCEL_TOKEN exists",
            "healthz_checked": true,
            "billboard_doorway_probe": "cloud-proof/billboard-doorway.json",
            "stripe_checkout_http_200_checked": true,
            "economic_scoreboard": "cloud-proof/economic-scoreboard.json",
            "revenue_claim": "none unless Stripe reports a paid completed session for the canonical Billboard link"
          }
          EOF
          cat cloud-proof/cloud-proof.json

      - name: Upload cloud proof
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-cloud-proof-${{ github.sha }}
          path: cloud-proof/
          if-no-files-found: error
          retention-days: 30
