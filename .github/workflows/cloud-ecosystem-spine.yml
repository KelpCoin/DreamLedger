name: Cloud Ecosystem Spine

on:
  push:
    branches:
      - main
      - agent/cloud-ecosystem-spine
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: cloud-ecosystem-spine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cloud-health:
    name: Cloud health and integration proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify repository control plane
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/cloud-ecosystem-spine.yml
          test -f .github/workflows/render-deploy.yml
          test -f .github/workflows/economic-revenue-gate.yml
          test -f .github/workflows/commerce-sentinel.yml
          test -f .github/workflows/first-sale-gate.yml
          test -f render.yaml
          grep -q 'rootDir: public' render.yaml
          grep -q 'rootDir: BEC-PRIME' render.yaml
          echo "CONTROL_PLANE=PASS"

      - name: Verify canonical commerce inputs
        shell: bash
        run: |
          set -euo pipefail
          for p in BEC-PRIME/catalog/offers/approved.json BEC-PRIME/catalog/offers/offers.json BEC-PRIME/catalog/featured-offer.json public/index.html public/server.js public/package.json; do
            test -s "$p"
            echo "FOUND=$p"
          done
          grep -q 'OFFER-CMD-DIAG-29-NZD' BEC-PRIME/catalog/offers/approved.json
          grep -q 'COMMANDER-DECK-DIAGNOSTIC-001' BEC-PRIME/catalog/offers/approved.json
          grep -q '"price":29' BEC-PRIME/catalog/offers/approved.json
          grep -q 'ACTIVE_LIVEMODE' BEC-PRIME/catalog/offers/approved.json
          echo "CANONICAL_COMMERCE=PASS"

      - name: Install dependencies when package manifest exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          elif [ -f package.json ]; then
            npm install --ignore-scripts
          elif [ -f BEC-PRIME/package-lock.json ]; then
            cd BEC-PRIME
            npm ci --ignore-scripts
          else
            echo "No Node package manifest; continuing."
          fi

      - name: Run safe repository tests when discoverable
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            has_test=$(node -e "const p=require('./package.json'); process.stdout.write(p.scripts && p.scripts.test ? 'yes' : 'no')")
            if [ "$has_test" = "yes" ]; then npm test; else echo "No root test script; continuing."; fi
          elif [ -f BEC-PRIME/package.json ]; then
            cd BEC-PRIME
            has_test=$(node -e "const p=require('./package.json'); process.stdout.write(p.scripts && p.scripts.test ? 'yes' : 'no')")
            if [ "$has_test" = "yes" ]; then npm test; else echo "No BEC-PRIME test script; continuing."; fi
          else
            echo "No package.json; continuing."
          fi

      - name: Verify approved checkout doorway
        shell: bash
        run: |
          set -euo pipefail
          url="https://buy.stripe.com/8x28wQ0cwbn48CA3mM9oc00"
          code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 20 "$url")
          echo "STRIPE_CHECKOUT_HTTP=$code"
          test "$code" = "200"

      - name: Verify public DreamLedger surfaces
        shell: bash
        run: |
          set -euo pipefail
          for path in /healthz /version / /billboard /mtg /avatar; do
            code=$(curl -L -sS -o /tmp/body -w "%{http_code}" --max-time 20 "https://dreamledger.org${path}")
            echo "PUBLIC_${path#/}_HTTP=$code"
            test "$code" = "200"
          done

      - name: Generate machine-readable cloud proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          stripe_code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://buy.stripe.com/8x28wQ0cwbn48CA3mM9oc00")
          health_code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://dreamledger.org/healthz")
          version_body=$(curl -L -sS --max-time 20 "https://dreamledger.org/version")
          cat > artifacts/cloud-ecosystem-proof.json <<EOF
          {
            "workflow": "Cloud Ecosystem Spine",
            "commit_sha": "${GITHUB_SHA}",
            "timestamp_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "cloud_execution": true,
            "stripe_checkout_http": "${stripe_code}",
            "healthz_http": "${health_code}",
            "version": ${version_body},
            "verified_payment_count": 0,
            "revenue_nzd": 0,
            "status": "PROOF_GENERATED"
          }
          EOF
          cat artifacts/cloud-ecosystem-proof.json

      - name: Upload cloud proof
        uses: actions/upload-artifact@v4
        with:
          name: cloud-ecosystem-proof-${{ github.run_id }}
          path: artifacts/cloud-ecosystem-proof.json
          if-no-files-found: error
          retention-days: 30
