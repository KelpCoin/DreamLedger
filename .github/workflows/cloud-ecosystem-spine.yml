name: Cloud Ecosystem Spine

on:
  push:
    branches:
      - main
      - agent/cloud-ecosystem-spine
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: cloud-ecosystem-spine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cloud-health:
    name: Cloud health and integration proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify repository control plane
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/cloud-ecosystem-spine.yml
          test -f .github/workflows/vercel-deploy.yml
          test -f .github/workflows/render-deploy.yml
          test -f .github/workflows/economic-revenue-gate.yml
          test -f .github/workflows/commerce-sentinel.yml
          test -f .github/workflows/first-sale-gate.yml
          echo "CONTROL_PLANE=PASS"

      - name: Verify canonical commerce inputs
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for p in \
            BEC-PRIME/catalog/offers/approved.json \
            BEC-PRIME/catalog/offers/offers.json \
            BEC-PRIME/compiled/website/billboard.html \
            api/billboard-stripe-webhook.js \
            vercel.json; do
            if [ -f "$p" ]; then
              echo "FOUND=$p"
              found=$((found+1))
            else
              echo "MISSING=$p"
            fi
          done
          echo "CANONICAL_INPUTS_FOUND=$found"

      - name: Install dependencies when package manifest exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          elif [ -f package.json ]; then
            npm install --ignore-scripts
          else
            echo "No root Node package manifest; continuing."
          fi

      - name: Run safe repository tests when discoverable
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            if npm run | grep -q " test"; then
              npm test
            else
              echo "No root test script; continuing."
            fi
          else
            echo "No root package.json; continuing."
          fi

      - name: Verify checkout doorway
        shell: bash
        run: |
          set -euo pipefail
          url="https://buy.stripe.com/28EcN54zraG13M3g3idwc1t"
          code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 20 "$url")
          echo "STRIPE_CHECKOUT_HTTP=$code"
          test "$code" = "200"

      - name: Verify public DreamLedger surfaces
        shell: bash
        run: |
          set -u
          for path in /healthz /billboard; do
            code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://dreamledger.org${path}" || true)
            echo "PUBLIC_${path#/}_HTTP=$code"
          done

      - name: Generate machine-readable cloud proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          stripe_code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://buy.stripe.com/28EcN54zraG13M3g3idwc1t" || true)
          health_code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://dreamledger.org/healthz" || true)
          billboard_code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://dreamledger.org/billboard" || true)
          cat > artifacts/cloud-ecosystem-proof.json <<EOF
          {
            "workflow": "Cloud Ecosystem Spine",
            "commit_sha": "${GITHUB_SHA}",
            "timestamp_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "cloud_execution": true,
            "stripe_checkout_http": "${stripe_code}",
            "healthz_http": "${health_code}",
            "billboard_http": "${billboard_code}",
            "verified_payment_count": 0,
            "revenue_nzd": 0,
            "self_hosted_fallback": "DEFERRED",
            "status": "PROOF_GENERATED"
          }
          EOF
          cat artifacts/cloud-ecosystem-proof.json

      - name: Upload cloud proof
        uses: actions/upload-artifact@v4
        with:
          name: cloud-ecosystem-proof-${{ github.run_id }}
          path: artifacts/cloud-ecosystem-proof.json
          if-no-files-found: error
          retention-days: 30
