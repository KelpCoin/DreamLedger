name: Cloud Ecosystem Spine
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: cloud-ecosystem-spine-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  LIVE_URL: https://dreamledger.org
  NODE_VERSION: 24
jobs:
  cloud-health:
    name: Cloud health and commerce proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: ${{ env.NODE_VERSION }}}
      - name: Verify control plane and ecosystem spine
        run: |
          set -euo pipefail
          test -f CORTEX/ecosystem_spine.py
          test -f CORTEX/gauntlet_adapter.py
          test -f CORTEX/redteam/belt.py
          test -f CORTEX/redteam/belt_extension.py
          test -f CORTEX/redteam/meta_belt.py
          test -f CORTEX/redteam/persistence.py
          test -f CORTEX/redteam/signer.py
          test -f policy/runtime.cedar
          test -f policy/schema.json
          python3 -m CORTEX.ecosystem_spine
      - name: Run full red-team meta-belt
        run: python3 -m CORTEX.redteam.cli meta
      - name: Run Python compile gate
        run: python3 -m compileall -q CORTEX
      - name: Verify live public surface
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          for path in / /healthz /version /billboard /api/products /api/offers; do
            code=$(curl -L -sS -o /tmp/probe -w '%{http_code}' --max-time 30 "${LIVE_URL}${path}")
            echo "PUBLIC_${path#/}_HTTP=${code}"
            test "$code" = 200
          done
          curl -L -sS --fail --max-time 30 "$LIVE_URL/api/offers" >/tmp/offers.json
          python3 - <<'PY'
          import json
          offers=json.load(open('/tmp/offers.json')).get('offers',[])
          assert isinstance(offers,list), 'offers must be a list'
          print('LIVE_OFFERS='+str(len(offers)))
          for x in offers: print('OFFER',x.get('offer_id'),x.get('price'),x.get('currency'))
          PY
      - name: Verify settlement scoreboard
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import base64,json,os,pathlib,urllib.parse,urllib.request
          out={'schema':'dreamledger/cloud-settlement-scoreboard/v1','status':'UNAVAILABLE','completed_paid_sessions':0,'verified_revenue_nzd':0}
          key=os.environ.get('STRIPE_SECRET_KEY','')
          if key:
            req=urllib.request.Request('https://api.stripe.com/v1/checkout/sessions?limit=100')
            req.add_header('Authorization','Basic '+base64.b64encode((key+':').encode()).decode())
            try:
              with urllib.request.urlopen(req,timeout=30) as r:data=json.load(r)
              paid=[s for s in data.get('data',[]) if s.get('livemode') and s.get('status')=='complete' and s.get('payment_status')=='paid']
              out['completed_paid_sessions']=len(paid);out['verified_revenue_nzd']=sum((s.get('amount_total') or 0) for s in paid)/100;out['status']='OBSERVED'
            except Exception as e:out['status']='STRIPE_API_ERROR';out['error_type']=type(e).__name__
          pathlib.Path('artifacts/economic-scoreboard.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Upload cloud proof
        uses: actions/upload-artifact@v4
        with:
          name: cloud-ecosystem-proof-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
