name: Cloud Ecosystem Spine

on:
  push:
    branches: [main, agent/cloud-ecosystem-spine]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: cloud-ecosystem-spine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cloud-health:
    name: Cloud health and integration proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify canonical control plane
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/render-deploy.yml
          test -f .github/workflows/economic-revenue-gate.yml
          test -f .github/workflows/commerce-sentinel.yml
          test -f .github/workflows/first-sale-gate.yml
          test -f render.yaml
          grep -q 'rootDir: public' render.yaml
          grep -q 'rootDir: BEC-PRIME' render.yaml
          echo "CONTROL_PLANE=PASS"
      - name: Verify canonical commerce inputs
        shell: bash
        run: |
          set -euo pipefail
          for p in BEC-PRIME/catalog/offers/approved.json BEC-PRIME/catalog/offers/offers.json BEC-PRIME/catalog/featured-offer.json public/index.html public/server.js; do
            test -s "$p"
            echo "FOUND=$p"
          done
          grep -q 'OFFER-CMD-DIAG-29-NZD' BEC-PRIME/catalog/offers/approved.json
          grep -q 'COMMANDER-DECK-DIAGNOSTIC-001' BEC-PRIME/catalog/offers/approved.json
          echo "CANONICAL_COMMERCE=PASS"
      - name: Verify checkout doorway without purchase
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://buy.stripe.com/8x28wQ0cwbn48CA3mM9oc00")
          echo "STRIPE_CHECKOUT_HTTP=$code"
          test "$code" = "200"
      - name: Verify public DreamLedger surfaces
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          for path in /healthz /version / /billboard /mtg /avatar /api/products; do
            code=$(curl -L -sS -o /tmp/body -w "%{http_code}" --max-time 20 "https://dreamledger.org${path}")
            echo "$path HTTP=$code"
            test "$code" = "200"
          done
      - name: Generate machine-readable cloud proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          stripe_code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://buy.stripe.com/8x28wQ0cwbn48CA3mM9oc00")
          health_code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://dreamledger.org/healthz")
          cat > artifacts/cloud-ecosystem-proof.json <<EOF
          {
            "workflow": "Cloud Ecosystem Spine",
            "commit_sha": "${GITHUB_SHA}",
            "timestamp_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "stripe_checkout_http": "${stripe_code}",
            "healthz_http": "${health_code}",
            "verified_payment_count": 0,
            "revenue_nzd": 0,
            "status": "PROOF_GENERATED"
          }
          EOF
          cat artifacts/cloud-ecosystem-proof.json
      - name: Upload cloud proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: cloud-ecosystem-proof-${{ github.run_id }}
          path: artifacts/cloud-ecosystem-proof.json
          if-no-files-found: error
          retention-days: 30
