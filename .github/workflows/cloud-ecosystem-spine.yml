name: Cloud Ecosystem Spine

on:
  push:
    branches:
      - main
      - agent/cloud-ecosystem-spine
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: cloud-ecosystem-spine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cloud-health:
    name: Cloud health and commerce proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify repository control plane
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/cloud-ecosystem-spine.yml
          test -f .github/workflows/render-deploy.yml
          test -f .github/workflows/economic-revenue-gate.yml
          test -f .github/workflows/commerce-sentinel.yml
          test -f .github/workflows/first-sale-gate.yml
          echo "CONTROL_PLANE=PASS"

      - name: Verify canonical DreamLedger commercial package
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/billboard.html
          test -s public/server.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          approved=json.loads(Path('BEC-PRIME/catalog/offers/approved.json').read_text())['approved']
          offer=next(x for x in approved if x['offer_id']=='OFFER-DREAMLEDGER-BILLBOARD-FOUNDING-001')
          product=json.loads(Path('BEC-PRIME/catalog/products/DREAMLEDGER-BILLBOARD-FOUNDING-001.json').read_text())
          campaign=json.loads(Path('BEC-PRIME/distribution/campaigns/D-001.json').read_text())
          assert offer['product_id']=='DREAMLEDGER-BILLBOARD-FOUNDING-001'
          assert offer['price']==50 and offer['currency']=='NZD'
          assert offer['payment_link_status']=='ACTIVE_LIVEMODE'
          assert offer['payment_link_url']=='https://buy.stripe.com/00w9ATaXP3dzaar9EUdwc2r'
          assert product['price']==50 and product['currency']=='nzd'
          assert product['commercial_truth']['payment_link']==offer['payment_link_url']
          assert campaign['offer']['offer_id']=='DREAMLEDGER-BILLBOARD-FOUNDING-001'
          assert campaign['offer']['price_nzd']==50
          assert campaign['objective']['metric']=='PAYMENT_RECEIVED'
          assert campaign['objective']['target']==1
          print('CANONICAL_OFFER=DREAMLEDGER-BILLBOARD-FOUNDING-001')
          print('CANONICAL_PRICE_NZD=50')
          print('CANONICAL_CHECKOUT='+offer['payment_link_url'])
          PY
          echo 'COMMERCIAL_PACKAGE=PASS'

      - name: Install dependencies when package manifest exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          elif [ -f package.json ]; then
            npm install --ignore-scripts
          elif [ -f public/package.json ]; then
            cd public
            npm install --ignore-scripts
          elif [ -f BEC-PRIME/package-lock.json ]; then
            cd BEC-PRIME
            npm ci --ignore-scripts
          else
            echo "No Node package manifest; continuing."
          fi

      - name: Run safe repository tests when discoverable
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            has_test=$(node -e "const p=require('./package.json'); process.stdout.write(p.scripts && p.scripts.test ? 'yes' : 'no')")
            if [ "$has_test" = "yes" ]; then npm test; else echo "No root test script; continuing."; fi
          elif [ -f public/package.json ]; then
            cd public
            has_test=$(node -e "const p=require('./package.json'); process.stdout.write(p.scripts && p.scripts.test ? 'yes' : 'no')")
            if [ "$has_test" = "yes" ]; then npm test; else echo "No public test script; continuing."; fi
          else
            echo "No package.json; continuing."
          fi

      - name: Verify live selling doorway
        shell: bash
        run: |
          set -euo pipefail
          for path in /healthz /billboard; do
            code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://dreamledger.org${path}")
            echo "PUBLIC_${path#/}_HTTP=$code"
            test "$code" = "200"
          done
          curl -L -sS --fail --max-time 20 https://dreamledger.org/billboard >/tmp/billboard.html
          grep -q 'NZ$50' /tmp/billboard.html
          grep -q '100 x 100' /tmp/billboard.html
          python3 - <<'PY'
          import json, urllib.request
          p=json.load(open('BEC-PRIME/catalog/offers/approved.json'))
          offer=next(x for x in p['approved'] if x['offer_id']=='OFFER-DREAMLEDGER-BILLBOARD-FOUNDING-001')
          r=urllib.request.urlopen(offer['payment_link_url'], timeout=20)
          print('STRIPE_CHECKOUT_HTTP='+str(r.status))
          assert r.status==200
          PY
          echo 'SELLING_DOORWAY=PASS'

      - name: Generate machine-readable cloud proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          stripe_code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://buy.stripe.com/00w9ATaXP3dzaar9EUdwc2r" || true)
          health_code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://dreamledger.org/healthz" || true)
          billboard_code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://dreamledger.org/billboard" || true)
          cat > artifacts/cloud-ecosystem-proof.json <<EOF
          {
            "workflow": "Cloud Ecosystem Spine",
            "commit_sha": "${GITHUB_SHA}",
            "timestamp_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "cloud_execution": true,
            "offer_id": "OFFER-DREAMLEDGER-BILLBOARD-FOUNDING-001",
            "price_nzd": 50,
            "stripe_checkout_http": "${stripe_code}",
            "healthz_http": "${health_code}",
            "billboard_http": "${billboard_code}",
            "verified_payment_count": 0,
            "revenue_nzd": 0,
            "status": "PROOF_GENERATED"
          }
          EOF
          cat artifacts/cloud-ecosystem-proof.json

      - name: Upload cloud proof
        uses: actions/upload-artifact@v4
        with:
          name: cloud-ecosystem-proof-${{ github.run_id }}
          path: artifacts/cloud-ecosystem-proof.json
          if-no-files-found: error
          retention-days: 30
