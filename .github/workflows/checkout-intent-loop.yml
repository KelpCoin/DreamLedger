name: Checkout Intent Loop

on:
  pull_request:
    paths:
      - 'scripts/verify-billboard-money-gate.mjs'
      - 'scripts/test-billboard-money-gate.mjs'
      - 'public/billboard.html'
      - 'public/buy/dreamledger-billboard-founding-001/index.html'
      - 'scripts/test_billboard_live_contract.mjs'
      - '.github/workflows/checkout-intent-loop.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: No-live-writes money-gate fixtures
        run: node --test scripts/test-billboard-money-gate.mjs
      - name: Source checkout hold regression
        run: node scripts/test_billboard_live_contract.mjs
  detect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Use supported Node 24 runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Audit public billboard and active Stripe links read-only
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          BECK_GATE_OUTPUT: proof/commerce/billboard-money-gate.json
        run: node scripts/verify-billboard-money-gate.mjs
      - name: Preserve cloud money-gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beck-billboard-money-gate-${{ github.run_id }}
          path: proof/commerce/billboard-money-gate.json*
          if-no-files-found: warn
          retention-days: 30
      - name: Detect checkout intent
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_LIVE_ENABLED: ${{ vars.STRIPE_LIVE_ENABLED }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHECKOUT_SIGNAL_PAYMENT_LINK_IDS: plink_1UAN9zJt4ieIQDFzgHeso6Qo,plink_1UAJyVJt4ieIQDFzj4kA5B7x,plink_1UKq77EGgEAnUFF9KOr1SuUY
          CHECKOUT_SIGNAL_RECENT_DAYS: '14'
        run: node scripts/Detect-CheckoutSignals.mjs
