name: governed-transition-tests

on:
  push:
    paths:
      - 'ops/policy/transitions.yaml'
      - 'runtime/attempt_transition.py'
      - 'tests/test_attempt_transition.py'
      - 'ops/policy/actions.yaml'
      - 'runtime/authorization_firewall.py'
      - 'tests/test_authorization_firewall.py'
      - 'tests/test_runtime_boundaries.py'
      - 'runtime/autonomy_budget.py'
      - 'runtime/event_envelope.py'
      - 'runtime/kill_switch.py'
      - 'tests/test_control_plane_hardening.py'
      - 'migrations/20260922_control_plane_hardening.sql'
      - 'requirements*.txt'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'ops/policy/transitions.yaml'
      - 'runtime/attempt_transition.py'
      - 'tests/test_attempt_transition.py'
      - 'requirements*.txt'
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml
      - name: Run governed transition tests
        run: pytest tests/test_attempt_transition.py tests/test_authorization_firewall.py tests/test_runtime_boundaries.py tests/test_control_plane_hardening.py -v
