name: DreamLedger Daily State Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: dreamledger-daily-state-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Generate daily state report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUD_ORCHESTRATOR_MODE: daily
          CLOUD_PROOF_ROOT: ${{ github.workspace }}\cloud-proof
        run: .\BEC-PRIME\scripts\Cloud-Orchestrator.ps1
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: daily-state-report-${{ github.run_id }}
          path: cloud-proof
          if-no-files-found: error
          retention-days: 90
