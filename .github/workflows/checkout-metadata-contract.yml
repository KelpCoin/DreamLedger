name: Checkout Metadata Contract

on:
  push:
  pull_request:

jobs:
  checkout-metadata:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BEC-PRIME
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Checkout producers
        run: node scripts/verify-checkout-metadata-contract.js
      - name: Verify Stripe webhook contract
        run: node scripts/verify-stripe-webhook-contract.js
      - name: Syntax check webhook
        run: node --check routes/mvpRoutes.js
      - name: Syntax check payment patch
        run: node --check lib/commercePaymentContractPreload.js

  economic-gauntlet:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install root project dependencies
        run: npm ci
      - name: Validate package and commerce scripts
        shell: pwsh
        run: |
          Get-Content package.json -Raw | ConvertFrom-Json | Out-Null
          node --check ops/commerce/beck-monetization-scout.mjs
          node --check ops/commerce/reconcile-first-dollar-proof-audit.mjs
          node --check ops/commerce/gauntlet-economic-verdict.mjs
      - name: Parse PowerShell bootstrap
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/beck-economic-bootstrap.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Run read-only bootstrap and assert truthful fail-closed evidence
        shell: powershell
        env:
          STRIPE_LIVE_ENABLED: 'false'
        run: |
          npm run validate:economics -- -SkipInstall
          $validationExit = $LASTEXITCODE
          $gauntletPath = Join-Path $PWD 'proof/commerce/latest-gauntlet-economic-verdict.json'
          if (-not (Test-Path -LiteralPath $gauntletPath)) {
            throw "Bootstrap exited $validationExit without producing a Gauntlet verdict."
          }
          $verdict = Get-Content -LiteralPath $gauntletPath -Raw | ConvertFrom-Json
          if ($verdict.economic_baseline.verified_business_revenue_nzd -ne 0) {
            throw 'Fail-closed rule violated: test run must not invent verified revenue.'
          }
          if ($verdict.economic_baseline.bank_payout_or_net_profit_verified -ne $false) {
            throw 'Fail-closed rule violated: bank payout/net profit must remain unverified.'
          }
          if ($verdict.verdict -like 'ELIGIBLE_FOR_SMALL_CONTROLLED_SCALE*' -and $verdict.score_out_of_100 -lt 80) {
            throw 'Gauntlet verdict cannot be eligible below the 80/100 threshold.'
          }
          if ($verdict.verdict -like 'ELIGIBLE_FOR_SMALL_CONTROLLED_SCALE*' -and @($verdict.hard_laws | Where-Object { $_.verdict -ne 'PASS' }).Count -gt 0) {
            throw 'Gauntlet verdict cannot be eligible while any commercial law is unproven.'
          }
          Write-Host "GAUNTLET_VERDICT=$($verdict.verdict)"
          Write-Host "GAUNTLET_SCORE=$($verdict.score_out_of_100)/100"
          Write-Host "BOOTSTRAP_EXIT=$validationExit (nonzero is expected while live payment/fulfillment evidence is absent)"
          if ($validationExit -notin @(0,1,2)) {
            throw "Unexpected bootstrap process exit code: $validationExit"
          }
      - name: Upload economic evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beck-economic-gauntlet-proof
          path: |
            proof/commerce/latest-monetization-scout.json
            proof/commerce/latest-first-dollar-stripe-reconciliation.json
            proof/commerce/latest-economic-validation.json
            proof/commerce/latest-gauntlet-economic-verdict.json
          if-no-files-found: warn
          retention-days: 14
