name: BECK Public Portfolio Release Contract
on:
  pull_request:
    paths:
      - 'public/**'
      - 'vercel.json'
      - 'package.json'
      - 'handlers/cube/marketplace.js'
      - 'handlers/cube/marketplace.test.js'
      - 'scripts/verify-vercel-public-release.cjs'
      - '.github/workflows/vercel-public-release-contract.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'vercel.json'
      - 'package.json'
      - 'handlers/cube/marketplace.js'
      - 'handlers/cube/marketplace.test.js'
      - 'scripts/verify-vercel-public-release.cjs'
      - '.github/workflows/vercel-public-release-contract.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual public portfolio release tree
        run: node scripts/verify-vercel-public-release.cjs
      - name: Adversarial Neon marketplace read-only contract
        run: |
          node --check handlers/cube/marketplace.js
          node --test handlers/cube/marketplace.test.js
          if grep -iE 'SUPABASE|dreamiez_session|readFileSync|writeFileSync' handlers/cube/marketplace.js; then
            echo 'UNSAFE_MARKETPLACE_BACKEND'; exit 1
          fi
