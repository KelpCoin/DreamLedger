name: PC-Off Refinement and Gauntlet

on:
  workflow_dispatch:
    inputs:
      use_cloud_llm:
        description: 'Use configured cloud LLM fallback when PC/LM Studio is unavailable'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: '17 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'CONTROL-PLANE/**'
      - 'IP/**'
      - 'MARKETS/**'
      - 'SOCIAL/**'
      - 'BEC-PRIME/**'
      - 'public/**'
      - 'render.yaml'
      - '.github/workflows/pc-off-refinement-gauntlet.yml'

permissions:
  contents: read

jobs:
  model-refinement:
    # Every four hours when explicitly approved in a repo variable. Not a blank cheque for paid API calls.
    if: >-
      (github.event_name == 'schedule' && vars.BECK_AUTO_LLM_APPROVED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.use_cloud_llm == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      LLM_API_URL: ${{ secrets.LLM_API_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_MODELS: ${{ secrets.LLM_MODELS }}
      REFINEMENT_OUT: artifacts/iterative-refinement-proof.md
      REFINEMENT_JSON_OUT: artifacts/iterative-refinement-proof.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert authorised endpoint and at least two configured models
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LLM_API_URL"
          test -n "$LLM_API_KEY"
          test -n "$LLM_MODELS"
          node --check BEC-PRIME/scripts/iterative-refinement.js
          echo 'LLM_APPROVAL_AND_PREFLIGHT=PASS'
      - name: Three-role model pass (propose / critique / synthesize)
        run: node BEC-PRIME/scripts/iterative-refinement.js
      - name: Check model proof status
        run: |
          node - <<'NODE'
          const r=require('./artifacts/iterative-refinement-proof.json');
          if(r.status!=='COMPLETED_RESEARCH_ONLY'||r.model_count_distinct<2||
             r.source_patch_written||r.public_listing_created||r.production_deployed||r.payment_received)process.exit(1);
          console.log('BECK_MULTI_LLM_ITERATION=PASS; DISTINCT_MODELS='+r.model_count_distinct);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beck-multillm-refinement-${{ github.run_id }}
          path: artifacts/iterative-refinement-proof.*
          retention-days: 30
          if-no-files-found: warn
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      USE_CLOUD_LLM: ${{ inputs.use_cloud_llm || 'false' }}
      LLM_API_URL: ${{ secrets.LLM_API_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_MODELS: ${{ secrets.LLM_MODELS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BEC-PRIME/package-lock.json

      - name: Install dependencies
        working-directory: BEC-PRIME
        run: npm ci

      - name: Commercial integration proof
        working-directory: BEC-PRIME
        env:
          PROOF_OUT: ../artifacts/commercial-integration-proof.txt
        run: |
          mkdir -p ../artifacts
          npm run verify:integration

      - name: Truth Oracle commerce verification
        working-directory: BEC-PRIME
        run: npm run verify:truth-oracle-commerce

      - name: Truth Oracle deterministic tests
        working-directory: BEC-PRIME
        run: npm run test:truth-oracle

      - name: Revenue pipeline deterministic tests
        working-directory: BEC-PRIME
        run: npm run test:revenue-pipeline

      - name: Public Truth Oracle surface verification
        shell: bash
        run: |
          set -euo pipefail
          test -s public/webhook-proxy-preload.js
          test -s BEC-PRIME/compiled/website/truth-oracle.html
          grep -q "requestPath === '/truth-oracle'" public/webhook-proxy-preload.js
          grep -q "requestPath.startsWith('/api/truth-oracle/')" public/webhook-proxy-preload.js
          grep -q "ENGINE_INTERNAL_URL_MISSING" public/webhook-proxy-preload.js
          node --check public/webhook-proxy-preload.js
          echo 'TRUTH_ORACLE_PUBLIC_SURFACE=PASS'

      - name: Render contract verification
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name: dreamledger-storefront' render.yaml
          grep -q 'name: dreamledger-engine' render.yaml
          grep -q 'autoDeployTrigger: commit' render.yaml
          grep -q 'healthCheckPath: /healthz' render.yaml
          grep -q '24.14.1' render.yaml
          echo 'RENDER_CONTRACT=PASS'

      - name: Deterministic validation mode
        run: |
          echo 'VALIDATOR=DETERMINISTIC'
          echo 'MULTI_LLM=SEPARATE_APPROVAL_GATED_JOB'
      - name: Run Gauntlet
        working-directory: BEC-PRIME
        run: npm run gauntlet

      - name: Emit proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo 'WORKFLOW=PC-Off Refinement and Gauntlet'
            echo "COMMIT=${GITHUB_SHA}"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "EXECUTION_PLANE=$([ \"$USE_CLOUD_LLM\" = \"true\" ] && echo CLOUD_FALLBACK || echo GITHUB_DETERMINISTIC)"
            echo 'LM_STUDIO=LOCAL_WHEN_PC_ON'
            echo "REFINEMENT=$([ \"$USE_CLOUD_LLM\" = \"true\" ] && echo MODEL_PASS_REQUESTED || echo NOT_EXECUTED)"
            echo 'GAUNTLET=REQUESTED'
            echo 'REVENUE_CLAIM=NOT_VERIFIED_BY_AUTOMATION'
          } | tee artifacts/pc-off-refinement-proof.txt

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-off-refinement-gauntlet-proof
          path: artifacts/
