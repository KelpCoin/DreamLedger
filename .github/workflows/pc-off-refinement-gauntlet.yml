name: PC-Off Refinement and Gauntlet

on:
  workflow_dispatch:
    inputs:
      use_cloud_llm:
        description: 'Use configured cloud LLM fallback when PC/LM Studio is unavailable'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: '17 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'CONTROL-PLANE/**'
      - 'IP/**'
      - 'MARKETS/**'
      - 'SOCIAL/**'
      - 'BEC-PRIME/**'
      - '.github/workflows/pc-off-refinement-gauntlet.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      USE_CLOUD_LLM: ${{ inputs.use_cloud_llm || 'false' }}
      LLM_API_URL: ${{ secrets.LLM_API_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BEC-PRIME/package-lock.json

      - name: Install dependencies
        working-directory: BEC-PRIME
        run: npm ci

      - name: Compile
        working-directory: BEC-PRIME
        run: npm run compile

      - name: Run Gauntlet
        working-directory: BEC-PRIME
        run: npm run gauntlet

      - name: Cloud refinement preflight
        if: ${{ env.USE_CLOUD_LLM == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LLM_API_URL"
          test -n "$LLM_API_KEY"
          test -n "$LLM_MODEL"
          echo 'CLOUD_LLM_PREFLIGHT=PASS'
          echo 'EXECUTION_PLANE=CLOUD_FALLBACK'

      - name: Local-first fallback marker
        if: ${{ env.USE_CLOUD_LLM != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'LM_STUDIO=LOCAL_ONLY'
          echo 'CLOUD_REFINEMENT=NOT_REQUESTED'
          echo 'EXECUTION_PLANE=GITHUB_DETERMINISTIC'

      - name: Emit proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo 'WORKFLOW=PC-Off Refinement and Gauntlet'
            echo "COMMIT=${GITHUB_SHA}"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "EXECUTION_PLANE=$([ \"$USE_CLOUD_LLM\" = \"true\" ] && echo CLOUD_FALLBACK || echo GITHUB_DETERMINISTIC)"
            echo 'LM_STUDIO=LOCAL_WHEN_PC_ON'
            echo 'GAUNTLET=EXECUTED'
            echo 'REVENUE_CLAIM=NOT_VERIFIED_BY_AUTOMATION'
          } | tee artifacts/pc-off-refinement-proof.txt

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-off-refinement-proof
          path: artifacts/pc-off-refinement-proof.txt
