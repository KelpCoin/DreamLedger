name: BECK Runtime Safety Contract

on:
  pull_request:
    paths:
      - "BEC-PRIME/scripts/beck-runtime-degraded-contract.test.js"
      - "BEC-PRIME/scripts/economic-local-worker.js"
      - "BEC-PRIME/scripts/economic-local-worker.test.js"
      - "scripts/beck-heartbeat.ps1"
      - ".github/workflows/777-economic-search.yml"
      - ".github/workflows/beck-cloud-truth-heartbeat.yml"
      - ".github/workflows/beck-runtime-contract.yml"
  push:
    branches: ["**"]
    paths:
      - "BEC-PRIME/scripts/beck-runtime-degraded-contract.test.js"
      - "BEC-PRIME/scripts/economic-local-worker.js"
      - "BEC-PRIME/scripts/economic-local-worker.test.js"
      - "scripts/beck-heartbeat.ps1"
      - ".github/workflows/777-economic-search.yml"
      - ".github/workflows/beck-cloud-truth-heartbeat.yml"
      - ".github/workflows/beck-runtime-contract.yml"

permissions:
  contents: read

concurrency:
  group: beck-runtime-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify local worker contract
        run: node --test BEC-PRIME/scripts/economic-local-worker.test.js
      - name: Verify BECK degraded-mode and safety contract
        run: node --test BEC-PRIME/scripts/beck-runtime-degraded-contract.test.js
