name: Render Production Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dreamledger-render-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Compile canonical production artifact
        run: npm run compile

      - name: Verify MTG compiler is wired
        run: test -f BEC-PRIME/compiled/website/mtg/index.html && grep -q 'Monte Carlo' BEC-PRIME/compiled/website/mtg/index.html && grep -q 'DreamMee' BEC-PRIME/compiled/website/mtg/index.html

      - name: Wait for Render deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            HEALTH="$(curl -fsS -o /tmp/healthz -w '%{http_code}' --max-time 10 https://dreamledger.org/healthz || true)"
            MTG="$(curl -fsS -o /tmp/mtg.html -w '%{http_code}' --max-time 10 https://dreamledger.org/mtg || true)"
            CINEMA="$(curl -fsS -o /tmp/cinema.html -w '%{http_code}' --max-time 10 https://dreamledger.org/cinema.html || true)"
            if [ "$HEALTH" = "200" ] && [ "$MTG" = "200" ] && [ "$CINEMA" = "200" ] && grep -q 'Monte Carlo' /tmp/mtg.html && grep -q 'DreamMee' /tmp/mtg.html && grep -q 'cinema-event-v1' /tmp/cinema.html; then
              echo "PASS: Render production surface is live for $EXPECTED_SHA"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "FAIL: Render production surface did not converge to the required contract."
              exit 1
            fi
            sleep 10
          done

      - name: Emit production proof
        env:
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p proof
          printf '{"status":"PASS","provider":"Render","sha":"%s","run_id":"%s","healthz":"200","mtg":"200","cinema":"200","mtg_contract":"Monte Carlo + DreamMee","cinema_contract":"cinema-event-v1"}\n' "$SHA" "$RUN_ID" > proof/render-production-gate.json
          cat proof/render-production-gate.json

      - name: Upload production proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: render-production-gate-proof
          path: proof/render-production-gate.json
