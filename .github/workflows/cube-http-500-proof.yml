name: CUBE 500 HTTP Proof

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cube-http-500-proof.yml"

concurrency:
  group: cube-500-http-proof
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify 500 public routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.error, urllib.request
          BASE="https://dreamledger.org"
          failures=[]
          checked=0
          for n in range(1,501):
              route=f"/cube/auto/{n:04d}"
              url=BASE+route
              ok=False
              last=""
              for attempt in range(8):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"DreamLedger-CUBE-500-Verifier/1.0"})
                      with urllib.request.urlopen(req,timeout=20) as r:
                          body=r.read().decode("utf-8","replace")
                          status=r.status
                          marker="DreamLedger CUBE economic silo." in body
                          route_ok=route in body
                      if status==200 and marker and route_ok:
                          ok=True
                          break
                      last=f"HTTP {status} marker={marker} route={route_ok}"
                      if status==429:
                          time.sleep(min(15,2**min(attempt,4)))
                      else:
                          break
                  except urllib.error.HTTPError as e:
                      last=f"HTTP {e.code}"
                      if e.code==429:
                          time.sleep(min(15,2**min(attempt,4)))
                      else:
                          break
                  except Exception as e:
                      last=repr(e)
                      time.sleep(min(10,2**min(attempt,4)))
              checked+=1
              if not ok:
                  failures.append(f"{n} {route} {last}")
              if checked%50==0:
                  print(f"PROGRESS checked={checked}/500 failures={len(failures)}",flush=True)
          proof={
            "schema":"dreamledger/cube-500-http-proof/v1",
            "verdict":"PASS" if not failures and checked==500 else "FAIL",
            "base":BASE,
            "checked":checked,
            "failure_count":len(failures),
            "failures":failures[:100],
            "coverage":"1-500",
            "marker":"DreamLedger CUBE economic silo."
          }
          with open("CUBE-500-HTTP-PROOF.json","w") as f:
              json.dump(proof,f,indent=2); f.write("\n")
          print(json.dumps(proof,indent=2))
          if proof["verdict"]!="PASS":
              raise SystemExit(1)
          PY
      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: cube-500-http-proof
          path: CUBE-500-HTTP-PROOF.json
          if-no-files-found: error
          retention-days: 30
