name: Cortex CI/CD Live Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit SHA to verify in production
        required: false
        type: string

concurrency:
  group: cortex-cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI - deterministic release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Resolve release SHA
        id: release
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.expected_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-$EVENT_SHA}"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "RELEASE_SHA=$sha"
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - name: Install dependencies
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Compile canonical release
        working-directory: BEC-PRIME
        run: npm run compile
      - name: Verify silo boundaries
        working-directory: BEC-PRIME
        run: npm run verify:silos
      - name: Verify commercial integration
        working-directory: BEC-PRIME
        run: npm run verify:integration
      - name: Verify worker pool
        working-directory: BEC-PRIME
        run: npm run worker:verify
      - name: Verify runtime and Stage 1 ledger proof
        working-directory: BEC-PRIME
        run: npm run runtime:verify
      - name: Verify Stage 1 proof contract
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          test -s RUN-PROOFS/STAGE-1-LOGIC-GATE.json
          python3 - <<'PY'
          import json
          with open('RUN-PROOFS/STAGE-1-LOGIC-GATE.json', encoding='utf-8') as f:
              p = json.load(f)
          if p.get('status') != 'PASS': raise SystemExit('STAGE1_STATUS=FAIL')
          if p.get('mode') != 'SIMULATION': raise SystemExit('STAGE1_MODE=FAIL')
          if not p.get('lifecycle_complete'): raise SystemExit('STAGE1_LIFECYCLE=FAIL')
          h = str(p.get('ledger_head_hash') or '')
          if len(h) != 64: raise SystemExit('STAGE1_LEDGER_HEAD_HASH=FAIL')
          if p.get('revenue_claimed') is not False: raise SystemExit('REVENUE_CLAIM=FAIL')
          if p.get('ra_000001_authorized') is not False: raise SystemExit('RA000001_AUTH=FAIL')
          print('STAGE1_PROOF=PASS')
          print('LEDGER_HEAD_HASH=' + h)
          PY
      - name: Verify critical JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check BEC-PRIME/start.js
          node --check BEC-PRIME/runtime/ControlPlane.js
          node --check BEC-PRIME/routes/auth.js
          node --check BEC-PRIME/scripts/smoke-production.js
          node --check BEC-PRIME/scripts/smoke-front-door.js
      - name: Verify primary account pages
        shell: bash
        run: |
          set -euo pipefail
          for page in login.html register.html account.html; do
            test -f "BEC-PRIME/compiled/website/$page"
            grep -q '/api/account/' "BEC-PRIME/compiled/website/$page"
          done
          ! grep -q '/api/dreamiez/account/login' BEC-PRIME/compiled/website/login.html
      - name: Verify paid surfaces are fulfilment-gated
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'NOT CURRENTLY FOR SALE' public/automation-rescue.html
          grep -q 'NOT CURRENTLY FOR SALE' public/billboard.html
          grep -q 'OTHER SKUS · QUARANTINED' public/offers.html
          echo 'PAID_SURFACES_GATED=PASS'
      - name: Write CI proof
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p BEC-PRIME/RUN-PROOFS
          python3 - <<'PY'
          import json, os, time
          with open('BEC-PRIME/RUN-PROOFS/STAGE-1-LOGIC-GATE.json', encoding='utf-8') as f:
              stage1 = json.load(f)
          data = {
              'status': 'PASS', 'gate': 'CORTEX_CI', 'release_sha': os.environ['RELEASE_SHA'],
              'timestamp_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'checks': ['compile','silo-boundaries','commercial-integration','worker-pool','runtime','stage-1-ledger-proof','syntax','primary-account-pages','paid-surfaces-fulfilment-gated'],
              'stage_1_status': stage1['status'], 'stage_1_mode': stage1['mode'],
              'ledger_head_hash': stage1['ledger_head_hash'], 'event_count': stage1['event_count'],
              'lifecycle_complete': stage1['lifecycle_complete'],
              'public_actions': 'approval-required', 'financial_actions': 'approval-required',
              'ra_000001_authorized': False, 'revenue_claimed': False
          }
          with open('BEC-PRIME/RUN-PROOFS/CORTEX-CI-PROOF.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
          print(json.dumps(data, indent=2))
          PY
      - name: Upload CI proof
        uses: actions/upload-artifact@v4
        with:
          name: cortex-ci-proof-${{ steps.release.outputs.sha }}
          path: |
            BEC-PRIME/RUN-PROOFS/CORTEX-CI-PROOF.json
            BEC-PRIME/RUN-PROOFS/STAGE-1-LOGIC-GATE.json
          if-no-files-found: error
          retention-days: 30

  production:
    name: CD - verify Render production release
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://dreamledger.org
      EXPECTED_SHA: ${{ needs.ci.outputs.release_sha }}
    steps:
      - name: Poll live version until exact SHA is deployed
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            body=$(curl -sS --max-time 10 "$BASE_URL/version" || true)
            live=$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read()).get("commit", ""))' <<< "$body" 2>/dev/null || true)
            echo "poll=$i live_sha=$live expected_sha=$EXPECTED_SHA"
            if [ "$live" = "$EXPECTED_SHA" ]; then echo "LIVE_SHA_MATCH=PASS"; exit 0; fi
            sleep 20
          done
          echo "LIVE_SHA_MATCH=FAIL"
          exit 1
      - name: Verify required live surfaces
        shell: bash
        run: |
          set -euo pipefail
          check() { path="$1"; expected="$2"; code=$(curl -sS -o /tmp/response --retry 3 --retry-delay 2 --max-time 15 -w '%{http_code}' "$BASE_URL$path"); echo "$path HTTP=$code"; test "$code" = "$expected"; }
          check /healthz 200
          check / 200
          check /billboard 200
          check /offers.html 200
          check /automation-rescue 200
          check /version 200
      - name: Verify paid surfaces remain gated
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail-with-body --retry 3 --retry-delay 2 --max-time 20 "$BASE_URL/automation-rescue" | grep -q 'NOT CURRENTLY FOR SALE'
          curl -sS --fail-with-body --retry 3 --retry-delay 2 --max-time 20 "$BASE_URL/billboard" | grep -q 'NOT CURRENTLY FOR SALE'
          echo 'LIVE_PAID_SURFACES_GATED=PASS'
      - name: Write production proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 - <<'PY'
          import json, os, time
          data={'status':'PASS','gate':'CORTEX_CD','release_sha':os.environ['EXPECTED_SHA'],'target':os.environ['BASE_URL'],'timestamp_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),'live_sha_verified':True,'surfaces_verified':['healthz','version','billboard','offers.html','automation-rescue'],'paid_surfaces_gated':True,'purchase_executed':False,'revenue_claimed':False}
          with open('proof/cortex-production-proof.json','w',encoding='utf-8') as f: json.dump(data,f,indent=2)
          print(json.dumps(data,indent=2))
          PY
      - name: Upload production proof
        uses: actions/upload-artifact@v4
        with:
          name: cortex-production-proof-${{ env.EXPECTED_SHA }}
          path: proof/cortex-production-proof.json
          if-no-files-found: error
          retention-days: 30
