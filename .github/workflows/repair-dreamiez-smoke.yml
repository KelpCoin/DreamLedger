name: Repair DreamMeez smoke blocker
on:
  push:
    branches:
      - fix/canonical-billboard-checkout-verifier
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'ci: repair DreamMeez smoke billboard syntax'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Repair exact billboard syntax regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('BEC-PRIME/routes/billboard.js')
          s = p.read_text()
          old = "return send(res,400,{error:'Destination must be http(s)')} }const s=load(m),p=pos(s,z.w,z.h);"
          new = "return send(res,400,{error:'Destination must be http(s)'})}const s=load(m),p=pos(s,z.w,z.h);"
          if old not in s:
              raise SystemExit('expected billboard syntax regression not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          node --check BEC-PRIME/routes/billboard.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BEC-PRIME/routes/billboard.js
          git rm .github/workflows/repair-dreamiez-smoke.yml
          git commit -m 'ci: repair DreamMeez smoke billboard syntax'
          git push
