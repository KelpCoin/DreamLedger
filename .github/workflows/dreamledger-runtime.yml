name: DreamMeez Runtime Proof

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreammeez-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical DreamLedger
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BEC-PRIME/package-lock.json

      - name: Build and syntax gate
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run compile:offers
          npm run compile:surface
          node --check server.js
          node --check start.js
          node --check dreamiez-account.js
          node --check gauntlet/GauntletV6.js
          node --check elohim/ElohimV6.js
          node --check proxy/DigitalProxy.js
          node --check runtime/ControlPlane.js

      - name: DreamMeez end-to-end smoke
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          npm run smoke:dreamiez

      - name: Verify Stage 1 runtime proof
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          node scripts/Verify-Runtime.js
          test -s RUN-PROOFS/STAGE-1-LOGIC-GATE.json
          node - <<'NODE'
          const fs = require('fs');
          const p = 'RUN-PROOFS/STAGE-1-LOGIC-GATE.json';
          const x = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (x.status !== 'PASS') throw new Error('Stage 1 status is not PASS');
          if (x.mode !== 'SIMULATION') throw new Error('Stage 1 mode is not SIMULATION');
          if (!x.lifecycle_complete) throw new Error('Stage 1 lifecycle is incomplete');
          const hash = String(x.ledger_head_hash || '').replace(/^sha256:/, '');
          if (!/^[a-f0-9]{64}$/.test(hash)) throw new Error('ledger_head_hash is not a SHA-256 hex value');
          if (x.revenue_claimed !== false) throw new Error('Simulation proof cannot claim revenue');
          if (x.ra_000001_authorized !== false) throw new Error('Stage 1 cannot authorize RA_000001');
          console.log(JSON.stringify({status:'PASS',ledger_head_hash:x.ledger_head_hash,event_count:x.event_count,mode:x.mode},null,2));
          NODE

      - name: Probe public endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-proof
          urls=(
            "https://dreamledger.org/"
            "https://dreamledger.org/healthz"
            "https://dreamledger.org/api/products"
            "https://dreamledger.org/api/offers"
            "https://dreamledger.org/api/auctions?silo=dreamledger"
            "https://dreamledger.org/api/news?silo=dreamledger"
            "https://dreamledger.org/api/control/health"
          )
          failed=0
          for url in "${urls[@]}"; do
            name=$(echo "$url" | sed 's#https://dreamledger.org/##; s#[/.?=&]#_#g')
            [ -n "$name" ] || name="root"
            code=$(curl -L -sS --max-time 30 -o "runtime-proof/${name}.body.txt" -w "%{http_code}" "$url" || true)
            echo "$url -> HTTP $code"
            printf '%s -> HTTP %s\n' "$url" "$code" >> runtime-proof/SUMMARY.txt
            if [[ ! "$code" =~ ^2[0-9][0-9]$ ]]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "RUNTIME FAIL" | tee -a runtime-proof/SUMMARY.txt
            exit 1
          fi
          echo "RUNTIME PASS" | tee -a runtime-proof/SUMMARY.txt

      - name: Inspect DreamMeez storefront markers
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat runtime-proof/root.body.txt)
          for marker in "DreamMeez" "Featured" "Agentic Commerce" "Marketplace" "Future" "Cart"; do
            if grep -Fqi "$marker" <<< "$body"; then
              echo "MARKER PASS: $marker"
            else
              echo "MARKER FAIL: $marker"
              exit 1
            fi
          done

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreammeez-runtime-proof-${{ github.run_id }}
          path: BEC-PRIME/RUN-PROOFS/
          if-no-files-found: warn
