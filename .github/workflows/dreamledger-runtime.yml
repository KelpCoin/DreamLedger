name: DreamLedger Runtime Proof

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dreamlogic-migration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical DreamLedger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Checkout retired DreamLogic source
        uses: actions/checkout@v4
        with:
          repository: KelpCoin/DreamLogic
          ref: main
          path: .migration/DreamLogic
          fetch-depth: 1

      - name: Absorb DreamLogic into canonical archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf legacy/DreamLogic
          mkdir -p legacy/DreamLogic
          rsync -a --delete --exclude='.git' .migration/DreamLogic/ legacy/DreamLogic/
          rm -rf .migration
          cat > legacy/DreamLogic/CANONICAL-STATUS.md <<'EOF'
# DreamLogic retirement record

DreamLogic is a historical source tree migrated into the canonical DreamLedger repository.

Canonical repository: KelpCoin/DreamLedger
Historical source: KelpCoin/DreamLogic
Status: RETIRED AS A SEPARATE RUNTIME

Do not add new production functionality to this archive. Move maintained logic into the canonical DreamLedger architecture.
EOF
          mkdir -p proof/migrations
          cat > proof/migrations/DREAMLOGIC-MIGRATION.json <<'EOF'
{
  "migration": "DreamLogic -> DreamLedger",
  "source": "KelpCoin/DreamLogic",
  "destination": "KelpCoin/DreamLedger/legacy/DreamLogic",
  "source_ref": "main",
  "status": "MIGRATED",
  "runtime_rule": "DreamLedger is canonical; DreamLogic is retired as a separate runtime."
}
EOF

      - name: Commit migration proof to canonical main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DreamLedger Migration Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy/DreamLogic proof/migrations/DREAMLOGIC-MIGRATION.json
          if git diff --cached --quiet; then
            echo "DreamLogic archive already current."
            exit 0
          fi
          git commit -m "chore: absorb DreamLogic into canonical DreamLedger repo"
          git push origin HEAD:main

  runtime-proof:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BEC-PRIME/package-lock.json

      - name: Build and syntax gate
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run compile:offers
          npm run compile:surface
          node --check server.js
          node --check start.js
          node --check dreamiez-account.js
          node --check gauntlet/GauntletV6.js
          node --check elohim/ElohimV6.js
          node --check proxy/DigitalProxy.js
          node --check runtime/ControlPlane.js

      - name: Dreamiez end-to-end smoke
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          npm run smoke:dreamiez

      - name: Probe public endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-proof
          urls=(
            "https://dreamledger.org/"
            "https://dreamledger.org/healthz"
            "https://dreamledger.org/api/products"
            "https://dreamledger.org/api/offers"
            "https://dreamledger.org/api/auctions?silo=dreamledger"
            "https://dreamledger.org/api/news?silo=dreamledger"
            "https://dreamledger.org/api/control/health"
          )
          failed=0
          for url in "${urls[@]}"; do
            name=$(echo "$url" | sed 's#https://dreamledger.org/##; s#[/.?=&]#_#g')
            [ -n "$name" ] || name="root"
            code=$(curl -L -sS --max-time 30 -o "runtime-proof/${name}.body.txt" -w "%{http_code}" "$url" || true)
            echo "$url -> HTTP $code"
            printf '%s -> HTTP %s\n' "$url" "$code" >> runtime-proof/SUMMARY.txt
            if [[ ! "$code" =~ ^2[0-9][0-9]$ ]]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "RUNTIME FAIL" | tee -a runtime-proof/SUMMARY.txt
            exit 1
          fi
          echo "RUNTIME PASS" | tee -a runtime-proof/SUMMARY.txt

      - name: Inspect marketplace markers
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat runtime-proof/root.body.txt)
          for marker in "Dreamiez" "Featured" "Agentic Commerce" "Marketplace" "Future" "Cart"; do
            if grep -Fqi "$marker" <<< "$body"; then
              echo "MARKER PASS: $marker"
            else
              echo "MARKER FAIL: $marker"
              exit 1
            fi
          done

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-runtime-proof-${{ github.run_id }}
          path: runtime-proof/
          if-no-files-found: error
