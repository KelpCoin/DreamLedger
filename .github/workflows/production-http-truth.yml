name: Production HTTP Truth Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'BEC-PRIME/compiled/website/**'
      - '.github/workflows/production-http-truth.yml'

permissions:
  contents: read

jobs:
  production-http-truth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Probe production root
        shell: bash
        env:
          PRODUCTION_URL: https://dreamledger.org
        run: |
          set -euo pipefail
          ROOT_STATUS="$(curl -sS -L -o "$RUNNER_TEMP/root.html" -w '%{http_code}' --retry 4 --retry-delay 2 --connect-timeout 10 "$PRODUCTION_URL/")"
          test "$ROOT_STATUS" = "200"
          grep -qi 'DreamLedger' "$RUNNER_TEMP/root.html"
          echo "PASS: production root HTTP $ROOT_STATUS and DreamLedger marker present."

      - name: Probe commercial doorway
        shell: bash
        env:
          PRODUCTION_URL: https://dreamledger.org
        run: |
          set -euo pipefail
          for PATHNAME in /version /healthz /overpaying /overpaying/ /overpaying.html; do
            STATUS="$(curl -sS -L -o "$RUNNER_TEMP/route.html" -w '%{http_code}' --retry 4 --retry-delay 2 --connect-timeout 10 "$PRODUCTION_URL$PATHNAME")"
            test "$STATUS" = "200"
            echo "PASS: $PATHNAME HTTP $STATUS"
          done

          for i in $(seq 1 20); do
            curl -sS -L --retry 2 --retry-delay 1 --connect-timeout 10 "$PRODUCTION_URL/version" > "$RUNNER_TEMP/version.json" || true
            if grep -q "${GITHUB_SHA}" "$RUNNER_TEMP/version.json"; then break; fi
            sleep 3
          done
          grep -q "${GITHUB_SHA}" "$RUNNER_TEMP/version.json"

          C2_STATUS="$(curl -sS -L -o "$RUNNER_TEMP/c2.html" -w '%{http_code}' --retry 4 --retry-delay 2 --connect-timeout 10 "$PRODUCTION_URL/c2?utm_source=exp1&utm_medium=preflight&utm_campaign=controlled_v1&client_ref=EXP1-PREFLIGHT")"
          test "$C2_STATUS" = "200"
          grep -q 'client_ref' "$RUNNER_TEMP/c2.html"
          grep -q 'utm_campaign' "$RUNNER_TEMP/c2.html"

          curl -sS -L --retry 4 --retry-delay 2 --connect-timeout 10 "$PRODUCTION_URL/overpaying" > "$RUNNER_TEMP/overpaying.html"
          grep -qi 'Scan to find out if you.*overpaying' "$RUNNER_TEMP/overpaying.html"

          echo "PASS: commercial doorway, health endpoint, version convergence, and overpaying marker verified."

      - name: Probe anonymous account surface
        shell: bash
        env:
          PRODUCTION_URL: https://dreamledger.org
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -L -o "$RUNNER_TEMP/account-me.json" -w '%{http_code}' --retry 3 --retry-delay 2 --connect-timeout 10 "$PRODUCTION_URL/api/account/me")"
          test "$STATUS" = "200"
          grep -q '"authenticated":false' "$RUNNER_TEMP/account-me.json"
          echo "PASS: anonymous account endpoint HTTP $STATUS and authenticated=false."

      - name: Emit machine proof
        shell: bash
        env:
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p proof
          VERSION="$(curl -sS -L --retry 3 --retry-delay 2 https://dreamledger.org/version)"
          C2_STATUS="$(curl -sS -L -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 'https://dreamledger.org/c2?utm_source=exp1&utm_medium=preflight&utm_campaign=controlled_v1&client_ref=EXP1-PREFLIGHT')"
          OVERPAYING_STATUS="$(curl -sS -L -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 https://dreamledger.org/overpaying)"
          ROOT_STATUS="$(curl -sS -L -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 https://dreamledger.org/)"
          ACCOUNT_STATUS="$(curl -sS -L -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 https://dreamledger.org/api/account/me)"
          printf '{"schema":"dreamledger-production-http-truth-v2","status":"PASS","sha":"%s","run_id":"%s","url":"https://dreamledger.org","version_response":%s,"root_http_status":%s,"c2_http_status":%s,"overpaying_http_status":%s,"account_me_http_status":%s,"account_me_authentication":"anonymous"}\n' "$SHA" "$RUN_ID" "$VERSION" "$ROOT_STATUS" "$C2_STATUS" "$OVERPAYING_STATUS" "$ACCOUNT_STATUS" > proof/PRODUCTION-HTTP-TRUTH.json
          cat proof/PRODUCTION-HTTP-TRUTH.json

      - name: Upload production proof
        uses: actions/upload-artifact@v4
        with:
          name: production-http-truth
          path: proof/PRODUCTION-HTTP-TRUTH.json
          if-no-files-found: error
