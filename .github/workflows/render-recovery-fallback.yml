name: Render Recovery Fallback

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: dreamledger-render-recovery
  cancel-in-progress: false

jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Trigger Render when credentials are available
        shell: bash
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          trigger="AUTO_DEPLOY"
          hook="${RENDER_DEPLOY_HOOK_URL:-}"
          if [ -z "$hook" ]; then hook="${RENDER_DEPLOY_HOOK:-}"; fi

          if [ -n "$hook" ]; then
            case "$hook" in
              *\?*) url="${hook}&ref=${sha}" ;;
              *) url="${hook}?ref=${sha}" ;;
            esac
            echo "Trying Render deploy hook for commit $sha"
            if curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 --max-time 30 -X POST "$url" > /tmp/render-hook.json; then
              trigger="DEPLOY_HOOK"
              cat /tmp/render-hook.json | sed -E 's/https?:\/\/[^ ]+/[redacted-url]/g'
            else
              echo "Deploy hook failed; falling back to Render auto-deploy convergence."
            fi
          fi

          if [ "$trigger" = "AUTO_DEPLOY" ] && [ -n "${RENDER_API_KEY:-}" ] && [ -n "${RENDER_SERVICE_ID:-}" ]; then
            echo "Trying Render API deploy for commit $sha"
            code=$(curl --silent --show-error --output /tmp/render-api.json --write-out '%{http_code}' \
              -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Content-Type: application/json' \
              -d "{\"commitId\":\"${sha}\"}")
            echo "Render API HTTP=$code"
            cat /tmp/render-api.json | sed -E 's/https?:\/\/[^ ]+/[redacted-url]/g'
            test "$code" = "201" -o "$code" = "202"
            trigger="RENDER_API"
          fi

          mkdir -p proof
          python3 - "$trigger" "$sha" <<'PY'
          import json, sys, time
          trigger, sha = sys.argv[1:]
          proof = {
              "status": "TRIGGER_ACCEPTED_OR_AUTO_DEPLOY_EXPECTED",
              "trigger": trigger,
              "source_commit": sha,
              "target": "https://dreamledger.org",
              "timestamp_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "fallback_order": ["RENDER_DEPLOY_HOOK_URL", "RENDER_DEPLOY_HOOK", "RENDER_API_KEY+RENDER_SERVICE_ID", "RENDER_AUTO_DEPLOY"]
          }
          with open("proof/render-recovery-trigger-proof.json", "w", encoding="utf-8") as f:
              json.dump(proof, f, indent=2)
          print(json.dumps(proof, indent=2))
          PY

      - name: Wait for exact production convergence
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          for i in $(seq 1 60); do
            health=$(curl -sS -o /tmp/healthz.json -w '%{http_code}' --max-time 15 https://dreamledger.org/healthz || true)
            version=$(curl -sS -o /tmp/version.json -w '%{http_code}' --max-time 15 https://dreamledger.org/version || true)
            echo "attempt=$i health_http=$health version_http=$version"
            if [ "$version" = "200" ]; then
              python3 - "$expected" <<'PY'
          import json, sys
          expected = sys.argv[1]
          with open('/tmp/version.json', encoding='utf-8') as f:
              data = json.load(f)
          deployed = data.get('commit') or data.get('sha')
          if deployed == expected:
              print('PASS: exact commit is live.')
              raise SystemExit(0)
          print(f'WAIT: deployed={deployed} expected={expected}')
          raise SystemExit(1)
          PY
              if [ $? -eq 0 ]; then exit 0; fi
            fi
            sleep 10
          done
          echo 'FAIL: production did not converge to the exact commit within 10 minutes.'
          exit 1

      - name: Verify commercial endpoints
        shell: bash
        run: |
          set -euo pipefail
          for path in /api/products /billboard /sitemap.xml /robots.txt; do
            code=$(curl -sS -o /tmp/body --write-out '%{http_code}' --max-time 20 "https://dreamledger.org${path}" || true)
            echo "$path => $code"
            test "$code" = "200"
          done

      - name: Write immutable recovery proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 - <<'PY'
          import json, os, time
          proof = {
              "source_commit": os.environ["GITHUB_SHA"],
              "target": "https://dreamledger.org",
              "timestamp_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "status": "EXACT_SHA_CONVERGENCE_REQUIRED"
          }
          with open("proof/render-recovery-proof.json", "w", encoding="utf-8") as f:
              json.dump(proof, f, indent=2)
          print(json.dumps(proof, indent=2))
          PY

      - name: Upload recovery proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-render-recovery-proof-${{ github.sha }}
          path: proof/
          if-no-files-found: error
          retention-days: 30
