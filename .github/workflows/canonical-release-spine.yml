name: Canonical Release Spine

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-release
  cancel-in-progress: true

jobs:
  release:
    name: Verify and release main
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Compile and verify application
        run: npm run compile

      - name: Verify public surface
        run: node BEC-PRIME/scripts/verify-public-surface.js

      - name: Verify silo boundaries
        run: npm run verify:silos

      - name: Verify commercial integration
        run: npm run verify:agentic-commerce

      - name: Verify production verifier syntax
        run: node --check BEC-PRIME/scripts/verify-production-version.js

      - name: Verify release SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          echo "Verified release SHA: $GITHUB_SHA"

      - name: Wait for Render auto-deploy convergence
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            echo "Convergence attempt $attempt/60"
            STATUS=$(curl --silent --show-error --max-time 20 -o /tmp/version.json -w '%{http_code}' https://dreamledger.org/version || true)
            cat /tmp/version.json 2>/dev/null || true
            if [ "$STATUS" = "200" ]; then
              COMMIT=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/version.json','utf8'));process.stdout.write(j.commit||'')")
              if [ "$COMMIT" = "$EXPECTED_COMMIT" ]; then
                echo "Render converged to $EXPECTED_COMMIT"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Render did not converge to $EXPECTED_COMMIT"
          exit 1

      - name: Verify production endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://dreamledger.org"

          VERSION=$(curl --fail --silent --show-error --max-time 20 "$BASE/version")
          COMMIT=$(printf '%s' "$VERSION" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(j.commit||'')})")
          SURFACE=$(printf '%s' "$VERSION" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(j.surface||'')})")

          test "$COMMIT" = "$GITHUB_SHA"
          test "$SURFACE" = "public-v6"

          PRODUCTS=$(curl --fail --silent --show-error --max-time 20 -w '\n%{http_code}' "$BASE/api/products")
          PRODUCTS_CODE=$(printf '%s\n' "$PRODUCTS" | tail -n 1)
          test "$PRODUCTS_CODE" = "200"

          PRODUCTS_BODY=$(printf '%s\n' "$PRODUCTS" | sed '$d')
          printf '%s' "$PRODUCTS_BODY" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!Array.isArray(j.products))process.exit(1);const b=j.products.find(x=>x.id==='BILLBOARD-LARGE');if(!b||Number(b.price)!==50||String(b.currency).toUpperCase()!=='NZD')process.exit(1);if(b.checkout_available!==true)process.exit(1)})"

          for PATH_NAME in / /billboard /mtg /sitemap.xml /robots.txt; do
            CODE=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$BASE$PATH_NAME")
            echo "$CODE $PATH_NAME"
            test "$CODE" = "200"
          done

          HOME_BODY=$(curl --fail --silent --show-error --max-time 20 "$BASE/")
          printf '%s' "$HOME_BODY" | grep -Eiq 'DreamLedger|Billboard|Digital|Physical|Interactive|Media'
          ! printf '%s' "$HOME_BODY" | grep -Eiq 'SUPABASE_SERVICE_ROLE|STRIPE_SECRET|STRIPE_WEBHOOK|BEC-PRIME|BrownEye Cortex|Truth Oracle|Gauntlet|ELOHIM|AMPLISSA|COLLECTORSCOAST'

      - name: Emit production proof
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p proof/cloud
          curl --fail --silent --show-error --max-time 20 https://dreamledger.org/version > proof/cloud/LIVE-VERSION.json
          cat > proof/cloud/LIVE-PRODUCTION-GATE.json <<EOF
          {
            "status": "PASS",
            "expected_commit": "$EXPECTED_COMMIT",
            "surface": "public-v6",
            "rules": {
              "render_converged": true,
              "products_200": true,
              "billboard_50_nzd": true,
              "sitemap_200": true,
              "robots_200": true
            }
          }
          EOF
          cat proof/cloud/LIVE-PRODUCTION-GATE.json

      - name: Upload production proof
        uses: actions/upload-artifact@v4
        with:
          name: live-production-gate-${{ github.sha }}
          path: proof/cloud
          if-no-files-found: error
