name: Canonical Release Spine

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_render:
        description: "Attempt Render deploy"
        required: false
        default: "true"

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: canonical-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
      - name: Install canonical dependencies
        working-directory: BEC-PRIME
        run: npm install --no-audit --no-fund
      - name: GAUNTLET - canonical tests
        working-directory: BEC-PRIME
        run: npm test
      - name: GAUNTLET - canonical compile
        working-directory: BEC-PRIME
        run: npm run compile
      - name: GAUNTLET - public surface contract
        working-directory: BEC-PRIME
        run: node scripts/verify-public-surface.js
      - name: GAUNTLET - silo boundaries
        working-directory: BEC-PRIME
        run: npm run verify:silos
      - name: GAUNTLET - commercial integration
        working-directory: BEC-PRIME
        run: npm run verify:integration
      - name: GAUNTLET - production verifier exists
        working-directory: BEC-PRIME
        run: node --check scripts/verify-production-version.js

  render-primary:
    needs: verify
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_render == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render primary deployment
        id: render
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_SERVICE_ID"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -d "{\"commitId\":\"$COMMIT_SHA\",\"clearCache\":\"clear\"}" \
            > render-deploy.json
          cat render-deploy.json
      - name: Save deployment proof
        uses: actions/upload-artifact@v4
        with:
          name: render-primary-${{ needs.verify.outputs.sha }}
          path: render-deploy.json
          if-no-files-found: error

  production-gate:
    needs: [verify, render-primary]
    if: ${{ needs.verify.result == 'success' && needs.render-primary.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
      - name: Wait for Render production convergence
        working-directory: BEC-PRIME
        env:
          EXPECTED_COMMIT: ${{ needs.verify.outputs.sha }}
          PRODUCTION_BASE_URL: https://dreamledger.org
          PRODUCTION_VERSION_TIMEOUT_MS: 15000
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "Production convergence attempt $attempt/30"
            if node scripts/verify-production-version.js; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Production did not converge to expected commit."
              exit 1
            fi
            sleep 20
          done
      - name: Verify MTG routes and commerce surface
        env:
          BASE: https://dreamledger.org
        run: |
          set -euo pipefail
          for path in /mtg /mtg/ /MTG /MTG/ /version /api/products /api/products/EDH_0001; do
            code=$(curl -L -sS -o /tmp/dreamledger-response -w "%{http_code}" --max-time 20 "$BASE$path")
            echo "$code $path"
            test "$code" = "200"
          done
          curl -L -sS --fail --max-time 20 "$BASE/mtg" -o /tmp/mtg.html
          grep -q "data-dreamledger-mtg-commerce-v2" /tmp/mtg.html
          grep -q "BUY NOW" /tmp/mtg.html
      - name: Emit live production proof
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p proof/cloud
          curl -L -sS --fail --max-time 20 https://dreamledger.org/version > proof/cloud/LIVE-VERSION.json
          cat > proof/cloud/LIVE-PRODUCTION-GATE.json <<EOF
          {
            "status": "PASS",
            "expected_commit": "$EXPECTED_COMMIT",
            "rule": "Production is not claimed until /version and required MTG routes independently verify live."
          }
          EOF
      - name: Upload live production proof
        uses: actions/upload-artifact@v4
        with:
          name: live-production-gate-${{ needs.verify.outputs.sha }}
          path: proof/cloud
          if-no-files-found: error

  github-pages-fallback:
    needs: [verify, render-primary, production-gate]
    if: ${{ always() && needs.verify.result == 'success' && needs.render-primary.result != 'success' }}
    runs-on: ubuntu-latest
    environment: pages
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ -d BEC-PRIME/compiled/website ]; then
            cp -a BEC-PRIME/compiled/website/. _site/
          else
            cp BEC-PRIME/surface/index.v2.template.html _site/index.html
          fi
          cat > _site/failover.txt <<EOF
Canonical DreamLedger static fallback
Source commit: $GITHUB_SHA
Primary runtime: Render
Fallback: GitHub Pages
EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4

  ghcr-fallback:
    needs: verify
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build fallback container
        run: docker build -t ghcr.io/${{ github.repository_owner }}/dreamledger:${{ needs.verify.outputs.sha }} -f BEC-PRIME/Dockerfile BEC-PRIME
      - name: Publish immutable fallback image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/dreamledger:${{ needs.verify.outputs.sha }}

  spine-proof:
    needs: [verify, render-primary, production-gate, github-pages-fallback, ghcr-fallback]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Emit release spine proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/cloud
          cat > proof/cloud/CANONICAL-RELEASE-SPINE.json <<EOF
          {
            "commit": "$GITHUB_SHA",
            "verify": "${{ needs.verify.result }}",
            "render_primary": "${{ needs.render-primary.result }}",
            "production_gate": "${{ needs.production-gate.result }}",
            "github_pages_fallback": "${{ needs.github-pages-fallback.result }}",
            "ghcr_fallback": "${{ needs.ghcr-fallback.result }}",
            "rule": "Never claim production unless the live runtime is independently verified."
          }
          EOF
      - name: Upload release spine proof
        uses: actions/upload-artifact@v4
        with:
          name: canonical-release-spine-${{ github.sha }}
          path: proof/cloud/CANONICAL-RELEASE-SPINE.json
          if-no-files-found: error
