name: Canonical Release Spine

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_render:
        description: "Attempt Render deploy"
        required: false
        default: "true"

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: canonical-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: BEC-PRIME/package-lock.json
      - name: Install canonical dependencies
        working-directory: BEC-PRIME
        run: npm ci
      - name: Run canonical tests
        working-directory: BEC-PRIME
        run: npm test
      - name: Run canonical compile
        working-directory: BEC-PRIME
        run: npm run compile
      - name: Verify public surface contract
        working-directory: BEC-PRIME
        run: node scripts/verify-public-surface.js
      - name: Verify silo boundaries
        working-directory: BEC-PRIME
        run: npm run verify:silos
      - name: Verify commercial integration
        working-directory: BEC-PRIME
        run: npm run verify:integration

  render-primary:
    needs: verify
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_render == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render primary deployment
        id: render
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_SERVICE_ID"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -d "{\"commitId\":\"$COMMIT_SHA\",\"clearCache\":\"clear\"}" \
            > render-deploy.json
          cat render-deploy.json
      - name: Save deployment proof
        uses: actions/upload-artifact@v4
        with:
          name: render-primary-${{ needs.verify.outputs.sha }}
          path: render-deploy.json
          if-no-files-found: error

  github-pages-fallback:
    needs: verify
    if: ${{ always() && needs.verify.result == 'success' && needs.render-primary.result != 'success' }}
    runs-on: ubuntu-latest
    environment: pages
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ -d BEC-PRIME/compiled/website ]; then
            cp -a BEC-PRIME/compiled/website/. _site/
          else
            cp BEC-PRIME/surface/index.v2.template.html _site/index.html
          fi
          cat > _site/failover.txt <<EOF
Canonical DreamLedger static fallback
Source commit: $GITHUB_SHA
Primary runtime: Render
Fallback: GitHub Pages
EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4

  ghcr-fallback:
    needs: verify
    if: ${{ always() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build fallback container
        run: docker build -t ghcr.io/${{ github.repository_owner }}/dreamledger:${{ needs.verify.outputs.sha }} -f BEC-PRIME/Dockerfile BEC-PRIME
      - name: Publish immutable fallback image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/dreamledger:${{ needs.verify.outputs.sha }}

  spine-proof:
    needs: [verify, render-primary, github-pages-fallback, ghcr-fallback]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emit release spine proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/cloud
          cat > proof/cloud/CANONICAL-RELEASE-SPINE.json <<EOF
          {
            "commit": "$GITHUB_SHA",
            "verify": "${{ needs.verify.result }}",
            "render_primary": "${{ needs.render-primary.result }}",
            "github_pages_fallback": "${{ needs.github-pages-fallback.result }}",
            "ghcr_fallback": "${{ needs.ghcr-fallback.result }}",
            "rule": "Never claim production unless the live runtime is independently verified."
          }
          EOF
          git config user.name "DreamLedger Release Spine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proof/cloud/CANONICAL-RELEASE-SPINE.json
          git commit -m "proof: record canonical release spine result" || true
          git push origin HEAD:main || true
