name: Canonical Release Spine

# One release contract: GitHub CI builds the exact repository root that Render builds.
# The root build installs production dependencies, uses the stable surface compiler,
# and runs the Leverage Gauntlet + Elohim proposal gate before deployment.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_render:
        description: "Attempt Render deploy"
        required: false
        default: "true"

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

concurrency:
  group: canonical-release
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, 'chore: persist BEC-PRIME generated public surfaces') }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm

      - name: Install exact Render-side root dependencies
        run: npm install --no-audit --no-fund

      - name: Verify root package declares production dependencies
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(!p.dependencies || !p.dependencies.ajv) throw new Error('root package missing ajv'); console.log('ajv='+p.dependencies.ajv)"

      - name: GAUNTLET - canonical root build
        run: npm run build

      - name: GAUNTLET - Leverage Gauntlet + Elohim gate
        run: npm run compile:leverage

      - name: GAUNTLET - public surface contract
        run: node BEC-PRIME/scripts/verify-public-surface.js

      - name: GAUNTLET - silo boundaries
        run: npm run verify:silos

      - name: GAUNTLET - commercial integration
        run: npm run verify:agentic-commerce

      - name: GAUNTLET - production verifier syntax
        run: node --check BEC-PRIME/scripts/verify-production-version.js

      - name: Persist verified generated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BEC-PRIME Compiler"
          git config user.email "bec-prime@users.noreply.github.com"
          git add BEC-PRIME/catalog/compiled BEC-PRIME/compiled/website/economics BEC-PRIME/compiled/website/truth-oracle.html BEC-PRIME/compiled/website/truth-oracle.json BEC-PRIME/compiled/website/transparency-policy.json BEC-PRIME/PROOF-ECONOMIC-TREE-COMPILATION.json BEC-PRIME/PROOF-MTG-CATALOG-COMPILATION.json BEC-PRIME/PROOF-CUBE-SURFACE-COMPILATION.json BEC-PRIME/data/proofs/compiler-leverage-latest.json BEC-PRIME/proof BEC-PRIME/RUN-PROOFS
          if git diff --cached --quiet; then
            echo "No generated changes to persist."
          else
            git commit -m "chore: persist BEC-PRIME generated public surfaces"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        id: meta

  render-primary:
    needs: verify
    if: ${{ needs.verify.result == 'success' && (github.event_name == 'push' || github.event.inputs.deploy_render == 'true') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render primary deployment for verified commit
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_SERVICE_ID"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -d "{\"commitId\":\"$COMMIT_SHA\",\"clearCache\":\"do_not_clear\"}" \
            > render-deploy.json
          cat render-deploy.json
      - name: Save deployment proof
        uses: actions/upload-artifact@v4
        with:
          name: render-primary-${{ needs.verify.outputs.sha }}
          path: render-deploy.json
          if-no-files-found: error

  production-gate:
    needs: [verify, render-primary]
    if: ${{ needs.verify.result == 'success' && needs.render-primary.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
      - name: Install production verification dependencies
        run: npm install --no-audit --no-fund
      - name: Wait for Render production convergence
        env:
          EXPECTED_COMMIT: ${{ needs.verify.outputs.sha }}
          PRODUCTION_BASE_URL: https://dreamledger.org
          PRODUCTION_VERSION_TIMEOUT_MS: 15000
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "Production convergence attempt $attempt/30"
            if node BEC-PRIME/scripts/verify-production-version.js; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Production did not converge to expected commit."
              exit 1
            fi
            sleep 20
          done
      - name: Verify public commerce surface
        env:
          BASE: https://dreamledger.org
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/home -w "%{http_code}" --max-time 20 "$BASE/")
          echo "$code /"
          test "$code" = "200"
          grep -Eiq "Commander|DreamLedger|Billboard|Digital" /tmp/home
      - name: Verify front-door surfaces
        env:
          BASE: https://dreamledger.org
        run: |
          set -euo pipefail
          for path in / /avatar.html /login.html /register.html; do
            code=$(curl -L -sS -o /tmp/front-door-response -w "%{http_code}" --max-time 20 "$BASE$path")
            echo "$code $path"
            test "$code" = "200"
          done
      - name: Emit live production proof
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p proof/cloud
          curl -L -sS --fail --max-time 20 https://dreamledger.org/version > proof/cloud/LIVE-VERSION.json
          cat > proof/cloud/LIVE-PRODUCTION-GATE.json <<EOF
          {
            "status": "PASS",
            "expected_commit": "$EXPECTED_COMMIT",
            "gauntlet": "PASS",
            "elohim": "PROPOSAL_EMITTED",
            "rule": "Production is not claimed until the same root build passes the deterministic leverage gate and the live runtime independently verifies."
          }
          EOF
      - name: Upload live production proof
        uses: actions/upload-artifact@v4
        with:
          name: live-production-gate-${{ needs.verify.outputs.sha }}
          path: proof/cloud
          if-no-files-found: error

  github-pages-fallback:
    needs: [verify, render-primary, production-gate]
    if: ${{ always() && needs.verify.result == 'success' && needs.render-primary.result != 'success' }}
    runs-on: ubuntu-latest
    environment: pages
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ -d BEC-PRIME/compiled/website ]; then
            cp -a BEC-PRIME/compiled/website/. _site/
          else
            cp BEC-PRIME/surface/index.v2.template.html _site/index.html
          fi
          cat > _site/failover.txt <<EOF
Canonical DreamLedger static fallback
Source commit: $GITHUB_SHA
Primary runtime: Render
Fallback: GitHub Pages
EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4

  ghcr-fallback:
    needs: verify
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - name: Build fallback container
        run: echo "Fallback build preserved."
