name: Factory-Factory Economic Cycle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/factory-factory-cycle.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: dreamledger-factory-factory-cycle
  cancel-in-progress: false

jobs:
  compile-and-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FACTORY_FACTORY_BATCH: '16'
      STRIPE_LIVE_ENABLED: 'true'
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - name: Compile and prepare bounded economic cells
        run: npm run factory:run && node BEC-PRIME/factory/FactoryFactoryOrchestrator.js && node BEC-PRIME/factory/FactoryFactoryCycle.js && node BEC-PRIME/scripts/Verify-FactoryFactoryCycle.js && npm run factory:x402 && npm run verify:x402-factory
      - name: Reconcile approved live offers
        if: ${{ env.STRIPE_SECRET_KEY != '' }}
        run: npm run reconcile:approved-offers
      - name: Verify truth boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'BEC-PRIME/data/factory-factory/orchestrator/latest.json';
          const x = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (x.invariants.some(v => /No (buyer|payment|revenue)/i.test(v) && !v)) process.exit(1);
          if (x.next_transition.includes('external publication')) process.exit(2);
          console.log('FACTORY_FACTORY_BOUNDARY=PASS');
          console.log('CELLS=' + x.selected_count);
          console.log('ACQUISITION_PACKETS=' + x.acquisition_packet_count);
          NODE

      - name: Persist factory state
        shell: bash
        run: |
          git config user.name "DreamLedger Factory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BEC-PRIME/compiled/opportunities BEC-PRIME/data/factory-factory proof/commerce/latest-approved-offer-reconciliation.json
          if git diff --cached --quiet; then
            echo "FACTORY_STATE=UNCHANGED"
            exit 0
          fi
          git commit -m "chore: refresh factory-factory economic state"
          git push

      - name: Upload factory evidence
        uses: actions/upload-artifact@v4
        with:
          name: factory-factory-cycle-${{ github.run_id }}
          path: |
            BEC-PRIME/data/factory-factory/
            BEC-PRIME/data/x402-factory/
            proof/commerce/latest-approved-offer-reconciliation.json
          if-no-files-found: warn
          retention-days: 14


  authorized-cmd-diag-acquisition:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish exactly one authorized CMD-DIAG acquisition
        run: |
          set -euo pipefail
          test -n "$DISCORD_WEBHOOK"
          case "$DISCORD_WEBHOOK" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*) ;;
            *) echo "Invalid Discord webhook host"; exit 1 ;;
          esac
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo="KelpCoin/DreamLedger"
          token=os.environ["GITHUB_TOKEN"]
          lock_title="FACTORY-ACQUISITION-LOCK: CMD-DIAG-29"
          req=urllib.request.Request(
            f"https://api.github.com/repos/{repo}/issues?state=all&per_page=100",
            headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req,timeout=20) as r:
            issues=json.loads(r.read().decode())
          if any(i.get("title")==lock_title for i in issues):
            print("ACQUISITION_ALREADY_LOCKED=TRUE")
            raise SystemExit(0)
          with open("BEC-PRIME/catalog/offers/approved.json",encoding="utf-8") as f:
            approved=json.load(f).get("approved",[])
          rows=[x for x in approved if x.get("product_sku")=="CMD-DIAG-29" and x.get("payment_link_status")=="ACTIVE_LIVEMODE" and x.get("payment_link_url")]
          if len(rows)!=1:
            raise SystemExit("CMD-DIAG is not uniquely approved and live")
          offer=rows[0]
          link=offer["payment_link_url"]
          content=offer["name"]+" - "+offer["currency"]+"$"+str(offer["price"])+"\\n\\n"+offer["problem"]+"\\n\\n"+link
          base=os.environ["DISCORD_WEBHOOK"]
          p=urllib.parse.urlsplit(base)
          q=urllib.parse.parse_qsl(p.query,keep_blank_values=True); q.append(("wait","true"))
          post=urllib.parse.urlunsplit((p.scheme,p.netloc,p.path,urllib.parse.urlencode(q),p.fragment))
          req=urllib.request.Request(post,data=json.dumps({"content":content}).encode(),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=20) as r:
            body=json.loads(r.read().decode())
          mid=body.get("id"); cid=body.get("channel_id")
          if not mid or not cid or link not in body.get("content",""):
            raise SystemExit("Discord publication response verification failed")
          verify=base.rstrip("/")+"/messages/"+urllib.parse.quote(str(mid),safe="")
          with urllib.request.urlopen(urllib.request.Request(verify,headers={"Accept":"application/json"}),timeout=20) as r:
            checked=json.loads(r.read().decode())
          if checked.get("id")!=mid or checked.get("channel_id")!=cid or link not in checked.get("content",""):
            raise SystemExit("Discord read-back verification failed")
          lock_body="Created after verified CMD-DIAG publication.\\n"+"offer_id="+offer["offer_id"]+"\\n"+"sku="+offer["product_sku"]+"\\n"+"discord_message_id="+str(mid)+"\\nstate=PUBLICATION_VERIFIED_REVENUE_UNVERIFIED"
          payload=json.dumps({"title":lock_title,"body":lock_body}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/issues",data=payload,headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=20) as r:
            issue=json.loads(r.read().decode())
          print("EXTERNAL_PUBLICATION=VERIFIED_DISCORD_MESSAGE")
          print("OFFER=CMD-DIAG-29")
          print("DISCORD_MESSAGE_ID="+str(mid))
          print("DISCORD_CHANNEL_ID="+str(cid))
          print("ACQUISITION_LOCK_ISSUE="+str(issue.get("number")))
          print("EXTERNAL_REVENUE=UNVERIFIED")
