name: B2B marketplace contract
on:
  pull_request:
    paths:
      - 'BEC-PRIME/routes/b2b-marketplace.js'
      - 'BEC-PRIME/routes/dreamiez.js'
      - 'BEC-PRIME/scripts/test-b2b-marketplace.js'
      - 'BEC-PRIME/scripts/test-a2a-marketplace.js'
      - 'BEC-PRIME/routes/m2m.js'
      - 'public/a2a-marketplace.html'
      - 'BEC-PRIME/scripts/verify-b2b-marketplace-contract.js'
      - 'BEC-PRIME/package.json'
      - 'public/b2b-marketplace.html'
      - 'supabase/migrations/*.sql'
      - 'supabase/functions/stripe-revenue-41104f355d6878cdd6d1f9dc/index.ts'
      - 'BEC-PRIME/scripts/verify-stripe-webhook-contract.js'
      - 'BEC-PRIME/scripts/verify-supabase-migration-versions.js'
  push:
    branches: [main]
    paths:
      - 'BEC-PRIME/routes/m2m.js'
      - 'public/a2a-marketplace.html'
      - 'BEC-PRIME/scripts/test-a2a-marketplace.js'
      - 'BEC-PRIME/scripts/verify-a2a-marketplace-contract.js'
      - 'BEC-PRIME/routes/b2b-marketplace.js'
      - 'BEC-PRIME/routes/dreamiez.js'
      - 'BEC-PRIME/scripts/test-b2b-marketplace.js'
      - 'BEC-PRIME/scripts/verify-b2b-marketplace-contract.js'
      - 'BEC-PRIME/package.json'
      - 'public/b2b-marketplace.html'
      - 'supabase/migrations/*.sql'
      - 'supabase/functions/stripe-revenue-41104f355d6878cdd6d1f9dc/index.ts'
      - 'BEC-PRIME/scripts/verify-stripe-webhook-contract.js'
      - 'BEC-PRIME/scripts/verify-supabase-migration-versions.js'
permissions:
  contents: read
jobs:
  b2b-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail closed on duplicate Supabase migration versions
        run: node BEC-PRIME/scripts/verify-supabase-migration-versions.js
      - name: Verify canonical Stripe webhook contract
        run: node BEC-PRIME/scripts/verify-stripe-webhook-contract.js
      - name: Test B2B API authorization and failure boundaries
        working-directory: BEC-PRIME
        run: npm run test:b2b-marketplace
      - name: Test A2A authorization and quote signatures
        working-directory: BEC-PRIME
        run: npm run test:a2a-marketplace
      - name: Verify A2A marketplace release contract
        working-directory: BEC-PRIME
        run: node scripts/verify-a2a-marketplace-contract.js
      - name: Verify marketplace release contract
        working-directory: BEC-PRIME
        run: node scripts/verify-b2b-marketplace-contract.js
