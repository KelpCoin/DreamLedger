name: DreamLedger Gauntlet Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamledger-gauntlet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gauntlet:
    name: Full commerce gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install BEC-PRIME dependencies
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Compile canonical release
        working-directory: BEC-PRIME
        run: npm run compile

      - name: Run Wealth Engine Gauntlet
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const g = require('./gauntlet/GauntletV6.js');
          const result = g.run({ writeProof: true });
          console.log(JSON.stringify(result, null, 2));
          if (result.status !== 'PASS') process.exit(2);
          NODE

      - name: Verify canonical offer state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          approved = json.loads(Path('BEC-PRIME/catalog/offers/approved.json').read_text())
          product = json.loads(Path('BEC-PRIME/catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json').read_text())
          featured = json.loads(Path('BEC-PRIME/catalog/featured-offer.json').read_text())
          fulfillment = json.loads(Path('BEC-PRIME/fulfillment/PRODUCT-FULFILLMENT-REGISTRY.json').read_text())
          offers = json.loads(Path('BEC-PRIME/catalog/offers/offers.json').read_text())
          target = next((x for x in approved.get('approved', []) if x.get('offer_id') == 'OFFER-CMD-DIAG-29-NZD'), None)
          if not target:
              raise SystemExit('CANONICAL_COMMANDER_OFFER=FAIL')
          if target.get('price') != 29 or target.get('currency') != 'NZD':
              raise SystemExit('CANONICAL_PRICE_CURRENCY=FAIL')
          if target.get('product_id') != 'COMMANDER-DECK-DIAGNOSTIC-001' or target.get('product_sku') != 'CMD-DIAG-29':
              raise SystemExit('CANONICAL_PRODUCT_SKU=FAIL')
          if target.get('payment_link_status') != 'HELD' or target.get('payment_link_url') is not None or target.get('payment_link_id') is not None:
              raise SystemExit('HELD_OFFER_PAYMENT_REFERENCE=FAIL')
          if product.get('status') != 'held' or product.get('checkout', {}).get('mode') != 'disabled':
              raise SystemExit('HELD_PRODUCT_CHECKOUT=FAIL')
          if product.get('commercial_truth', {}).get('sellable') is not False or product.get('commercial_truth', {}).get('approval_required') is not True:
              raise SystemExit('HELD_PRODUCT_AUTHORITY=FAIL')
          if featured.get('public_visibility') != 'hidden' or featured.get('payment_link_status') != 'HELD' or featured.get('payment_link_url') is not None or featured.get('checkout_url') is not None:
              raise SystemExit('HELD_FEATURED_SURFACE=FAIL')
          entry = fulfillment.get('entries', {}).get('COMMANDER-DECK-DIAGNOSTIC-001', {})
          if entry.get('ready') is not False or entry.get('operator_required') is not True:
              raise SystemExit('HELD_FULFILLMENT_REGISTRY=FAIL')
          print('CANONICAL_COMMANDER_OFFER=PASS')
          print('CANONICAL_PRICE_CURRENCY=PASS')
          print('CANONICAL_PRODUCT_SKU=PASS')
          print('HELD_OFFER_PAYMENT_REFERENCE=PASS')
          print('HELD_PRODUCT_CHECKOUT=PASS')
          print('HELD_PRODUCT_AUTHORITY=PASS')
          print('HELD_FEATURED_SURFACE=PASS')
          print('HELD_FULFILLMENT_REGISTRY=PASS')
          print('CANONICAL_CANDIDATE_COUNT=' + str(len(offers.get('offers', []))))
          PY

      - name: Verify critical syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find BEC-PRIME -type f -name '*.js' ! -path 'BEC-PRIME/compiled/*' ! -path 'BEC-PRIME/RUN-PROOFS/*' -print0)
          node --check api/account/'[...route].js'
          echo 'JAVASCRIPT_SYNTAX=PASS'

      - name: Verify silo isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          approved = json.loads(Path('BEC-PRIME/catalog/offers/approved.json').read_text())['approved']
          for offer in approved:
              text = json.dumps(offer).lower()
              if offer.get('silo') == 'mtg' and ('amplissa' in text or 'adult' in text):
                  raise SystemExit('MTG_SILO_ISOLATION=FAIL')
          print('MTG_SILO_ISOLATION=PASS')
          print('PUBLIC_ACTIONS=APPROVAL_GATED')
          PY

      - name: Verify live front door
        shell: bash
        env:
          BASE_URL: https://dreamledger.org
        run: |
          set -euo pipefail
          for path in / /healthz /version; do
            code=$(curl -sS -o /tmp/response --retry 3 --retry-delay 2 --max-time 15 -w '%{http_code}' "$BASE_URL$path")
            echo "$path HTTP=$code"
            test "$code" = "200"
          done
          echo 'LIVE_FRONT_DOOR=PASS'

      - name: Verify held offer checkout is blocked without purchase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BASE_URL: https://dreamledger.org
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/held-checkout.json -w '%{http_code}' --max-time 20 \
            -X POST "$BASE_URL/api/offer-checkout/create" \
            -H 'Content-Type: application/json' \
            --data '{"offer_id":"OFFER-CMD-DIAG-29-NZD"}')
          python3 - <<'PY' "$status"
          import json, sys
          from pathlib import Path
          status = int(sys.argv[1])
          data = json.loads(Path('/tmp/held-checkout.json').read_text())
          if status == 200 or data.get('url') or data.get('checkout_url') or data.get('session_id'):
              raise SystemExit('HELD_CHECKOUT_BLOCK=FAIL')
          if status == 400 and data.get('error') != 'Unknown or missing approved offer':
              raise SystemExit('HELD_CHECKOUT_REASON=FAIL')
          if status == 503 and data.get('error') != 'STRIPE_SECRET_KEY is not configured':
              raise SystemExit('HELD_CHECKOUT_REASON=FAIL')
          if status not in (400, 503):
              raise SystemExit('HELD_CHECKOUT_HTTP_STATUS=FAIL:' + str(status))
          print('HELD_CHECKOUT_BLOCK=PASS')
          print('PURCHASE_EXECUTED=FALSE')
          PY

      - name: Write proof artifact
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p BEC-PRIME/RUN-PROOFS/GAUNTLET
          python3 - <<'PY'
          import hashlib, json, os, time
          from pathlib import Path
          proof = {
              'schema_version': 'DREAMLEDGER-GAUNTLET-RELEASE-1',
              'status': 'PASS_TECHNICAL_ONLY',
              'commercial_status': 'BLOCKED_PENDING_SETTLED_PAYMENT_AND_FULFILLMENT',
              'verified_revenue_nzd': 0,
              'release_sha': os.environ['RELEASE_SHA'],
              'checked_at_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'economic_truth': {
                  'status': 'BLOCKED',
                  'blocker': 'No independently attributable settled live payment plus fulfillment and delivery evidence.',
                  'payment_link': 'HELD_NO_PUBLIC_REFERENCE',
                  'purchase_executed': False,
                  'sale_settled': False,
                  'economic_proof': False
              },
              'gates': [
                  'canonical_compile',
                  'wealth_engine_gauntlet',
                  'approved_offer_contract',
                  'javascript_syntax',
                  'silo_isolation',
                  'live_front_door',
                  'held_offer_checkout_block'
              ],
              'public_actions': 'approval-gated',
              'financial_actions': 'approval-gated'
          }
          raw = json.dumps(proof, sort_keys=True, indent=2).encode()
          proof['sha256'] = hashlib.sha256(raw).hexdigest()
          path = Path('BEC-PRIME/RUN-PROOFS/GAUNTLET/DREAMLEDGER-GAUNTLET-LATEST.json')
          path.write_text(json.dumps(proof, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(proof, indent=2))
          PY

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-gauntlet-proof-${{ github.sha }}
          path: BEC-PRIME/RUN-PROOFS/GAUNTLET/DREAMLEDGER-GAUNTLET-LATEST.json
          if-no-files-found: error
          retention-days: 30
