name: DreamLedger Gauntlet Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamledger-gauntlet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gauntlet:
    name: Full commerce gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install BEC-PRIME dependencies
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Compile canonical release
        working-directory: BEC-PRIME
        run: npm run compile

      - name: Run Wealth Engine Gauntlet
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const g = require('./gauntlet/GauntletV6.js');
          const result = g.run({ writeProof: true });
          console.log(JSON.stringify(result, null, 2));
          if (result.status !== 'PASS') process.exit(2);
          NODE

      - name: Verify approved offer contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { evaluateCanonicalProduct } = require('./BEC-PRIME/runtime/canonicalCheckoutGate.js');
          const root = process.cwd();
          const approved = JSON.parse(fs.readFileSync(path.join(root, 'BEC-PRIME/catalog/offers/approved.json'), 'utf8'));
          const catalog = JSON.parse(fs.readFileSync(path.join(root, 'BEC-PRIME/catalog/offers/offers.json'), 'utf8'));
          const registry = JSON.parse(fs.readFileSync(path.join(root, 'BEC-PRIME/fulfillment/PRODUCT-FULFILLMENT-REGISTRY.json'), 'utf8'));
          const target = approved.approved.find(x => x.offer_id === 'OFFER-CMD-DIAG-29-NZD');
          if (!target) throw new Error('APPROVED_COMMANDER_DIAGNOSTIC=FAIL');
          if (target.price !== 29 || target.currency !== 'NZD') throw new Error('APPROVED_PRICE_CURRENCY=FAIL');
          if (target.product_id !== 'COMMANDER-DECK-DIAGNOSTIC-001') throw new Error('PRODUCT_ID=FAIL');
          const compiled = catalog.offers.find(x => x.offer_id === target.offer_id);
          if (!compiled) throw new Error('COMPILED_COMMANDER_DIAGNOSTIC=FAIL');
          const productPath = path.join(root, 'BEC-PRIME/catalog/products', target.product_id + '.json');
          const product = JSON.parse(fs.readFileSync(productPath, 'utf8'));
          const gate = evaluateCanonicalProduct(product, registry, root);
          const sourceLink = typeof target.payment_link_url === 'string' ? target.payment_link_url : null;
          const linkMatches = gate.allowed === true && !!sourceLink && sourceLink === gate.checkout_url;
          const enabled = linkMatches && target.payment_link_status === 'ACTIVE_LIVEMODE';
          if (enabled) {
            if (compiled.status !== 'VERIFIED_AVAILABLE' || compiled.checkout_available !== true || compiled.approval_required !== false) {
              throw new Error('OPEN_GATE_COMPILED_STATE=FAIL');
            }
            if (compiled.payment_link_url !== gate.checkout_url) throw new Error('OPEN_GATE_LINK_BINDING=FAIL');
            console.log('CANONICAL_GATE=OPEN; CHECKOUT_STATE=VERIFIED_AVAILABLE');
          } else {
            const expectedStatus = gate.allowed === true ? 'HELD_STRIPE_LINK_DRIFT' : 'HELD_CANONICAL_PRODUCT_GATE';
            if (compiled.status !== expectedStatus) throw new Error('HELD_OFFER_STATUS=FAIL expected=' + expectedStatus);
            if (compiled.checkout_available !== false || compiled.approval_required !== true) {
              throw new Error('HELD_OFFER_CHECKOUT_STATE=FAIL');
            }
            if (compiled.payment_link_url !== null && compiled.payment_link_url !== undefined && compiled.payment_link_url !== '') {
              throw new Error('HELD_OFFER_MUST_NOT_EXPOSE_PAYMENT_URL=FAIL');
            }
            if (compiled.fulfillment_route) throw new Error('HELD_OFFER_MUST_NOT_EXPOSE_FULFILLMENT_ROUTE=FAIL');
            console.log('CANONICAL_GATE=' + (gate.allowed ? 'OPEN_LINK_DRIFT' : 'CLOSED') + '; CHECKOUT_STATE=HELD; PAYMENT_URL_EXPOSED=false');
          }
          console.log('APPROVED_COMMANDER_DIAGNOSTIC=PASS');
          console.log('APPROVED_PRICE_CURRENCY=PASS');
          console.log('PRODUCT_ID=PASS');
          console.log('CANONICAL_CANDIDATE_COUNT=' + catalog.offers.length);
          NODE

      - name: Verify critical syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find BEC-PRIME -type f -name '*.js' ! -path 'BEC-PRIME/compiled/*' ! -path 'BEC-PRIME/RUN-PROOFS/*' -print0)
          node --check api/account/'[...route].js'
          echo 'JAVASCRIPT_SYNTAX=PASS'

      - name: Verify silo isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          approved = json.loads(Path('BEC-PRIME/catalog/offers/approved.json').read_text())['approved']
          for offer in approved:
              text = json.dumps(offer).lower()
              if offer.get('silo') == 'mtg' and ('amplissa' in text or 'adult' in text):
                  raise SystemExit('MTG_SILO_ISOLATION=FAIL')
          print('MTG_SILO_ISOLATION=PASS')
          print('PUBLIC_ACTIONS=APPROVAL_GATED')
          PY

      - name: Verify live front door
        shell: bash
        env:
          BASE_URL: https://dreamledger.org
        run: |
          set -euo pipefail
          for path in / /healthz /version; do
            code=$(curl -sS -o /tmp/response --retry 3 --retry-delay 2 --max-time 15 -w '%{http_code}' "$BASE_URL$path")
            echo "$path HTTP=$code"
            test "$code" = "200"
          done
          echo 'LIVE_FRONT_DOOR=PASS'

      - name: Verify checkout contract without purchase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BASE_URL: https://dreamledger.org
        run: |
          set -euo pipefail
          response=$(curl -sS --fail-with-body --retry 3 --retry-delay 2 --max-time 20 \
            -X POST "$BASE_URL/api/offer-checkout/create" \
            -H 'Content-Type: application/json' \
            --data '{"offer_id":"OFFER-CMD-DIAG-29-NZD"}')
          python3 - <<'PY' "$response"
          import json, sys
          data = json.loads(sys.argv[1])
          url = str(data.get('url', data.get('checkout_url', '')))
          sku = str(data.get('product_id', ''))
          amount = data.get('amount_nzd')
          if not url.startswith('https://') or 'stripe.com' not in url:
              raise SystemExit('CHECKOUT_URL=FAIL')
          if sku != 'COMMANDER-DECK-DIAGNOSTIC-001':
              raise SystemExit('CHECKOUT_SKU=FAIL')
          if amount != 29:
              raise SystemExit(f'CHECKOUT_AMOUNT=FAIL:{amount}')
          print('CHECKOUT_URL=PASS')
          print('CHECKOUT_SKU=PASS')
          print('CHECKOUT_AMOUNT_NZD_29=PASS')
          print('PURCHASE_EXECUTED=FALSE')
          PY

      - name: Write proof artifact
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p BEC-PRIME/RUN-PROOFS/GAUNTLET
          python3 - <<'PY'
          import hashlib, json, os, time
          from pathlib import Path
          proof = {
              'schema_version': 'DREAMLEDGER-GAUNTLET-RELEASE-1',
              'status': 'PASS_TECHNICAL_ONLY',
              'commercial_status': 'BLOCKED_PENDING_SETTLED_PAYMENT_AND_FULFILLMENT',
              'verified_revenue_nzd': 0,
              'release_sha': os.environ['RELEASE_SHA'],
              'checked_at_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'economic_truth': {
                  'status': 'BLOCKED',
                  'blocker': 'No independently attributable settled live payment plus fulfillment and delivery evidence.',
                  'payment_link': 'VERIFIED_CONFIGURED',
                  'purchase_executed': False,
                  'sale_settled': False,
                  'economic_proof': False
              },
              'gates': [
                  'canonical_compile',
                  'wealth_engine_gauntlet',
                  'approved_offer_contract',
                  'javascript_syntax',
                  'silo_isolation',
                  'live_front_door',
                  'checkout_contract'
              ],
              'public_actions': 'approval-gated',
              'financial_actions': 'approval-gated'
          }
          raw = json.dumps(proof, sort_keys=True, indent=2).encode()
          proof['sha256'] = hashlib.sha256(raw).hexdigest()
          path = Path('BEC-PRIME/RUN-PROOFS/GAUNTLET/DREAMLEDGER-GAUNTLET-LATEST.json')
          path.write_text(json.dumps(proof, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(proof, indent=2))
          PY

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-gauntlet-proof-${{ github.sha }}
          path: BEC-PRIME/RUN-PROOFS/GAUNTLET/DREAMLEDGER-GAUNTLET-LATEST.json
          if-no-files-found: error
          retention-days: 30
