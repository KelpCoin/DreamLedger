name: DreamLedger Gauntlet Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamledger-gauntlet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gauntlet:
    name: Full commerce gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install BEC-PRIME dependencies
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Compile canonical release
        working-directory: BEC-PRIME
        run: npm run compile

      - name: Run Wealth Engine Gauntlet
        working-directory: BEC-PRIME
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const g = require('./gauntlet/GauntletV6.js');
          const result = g.run({ writeProof: true });
          console.log(JSON.stringify(result, null, 2));
          if (result.status !== 'PASS') process.exit(2);
          NODE

      - name: Verify Commander release state and checkout safety
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          offer_catalog = json.loads(Path('BEC-PRIME/catalog/offers/approved.json').read_text())
          compiled = json.loads(Path('BEC-PRIME/catalog/offers/offers.json').read_text())
          featured = json.loads(Path('BEC-PRIME/catalog/featured-offer.json').read_text())
          product = json.loads(Path('BEC-PRIME/catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json').read_text())
          registry = json.loads(Path('BEC-PRIME/fulfillment/PRODUCT-FULFILLMENT-REGISTRY.json').read_text())
          public_master = Path('public/mtg/master.html').read_text()
          offer_id = 'OFFER-CMD-DIAG-29-NZD'
          product_id = 'COMMANDER-DECK-DIAGNOSTIC-001'
          held = [x for x in offer_catalog.get('held', []) if x.get('offer_id') == offer_id]
          if any(x.get('offer_id') == offer_id for x in offer_catalog.get('approved', [])):
              raise SystemExit('COMMANDER_MUST_NOT_BE_APPROVED_WHILE_HELD=FAIL')
          if len(held) != 1 or held[0].get('payment_link_url') is not None:
              raise SystemExit('COMMANDER_HELD_RECORD=FAIL')
          if product.get('id') != product_id or product.get('status') != 'held':
              raise SystemExit('COMMANDER_PRODUCT_STATE=FAIL')
          if product.get('checkout', {}).get('mode') != 'disabled' or product.get('commercial_truth', {}).get('sellable') is not False:
              raise SystemExit('COMMANDER_CHECKOUT_STATE=FAIL')
          if any(x.get('offer_id') == offer_id for x in compiled.get('offers', [])):
              raise SystemExit('COMMANDER_COMPILED_AS_BUYABLE=FAIL')
          if featured.get('status') != 'HELD' or featured.get('payment_link_url') is not None or featured.get('checkout_url') is not None:
              raise SystemExit('COMMANDER_FEATURED_SURFACE=FAIL')
          fulfillment = registry.get('entries', {}).get(product_id, {})
          if fulfillment.get('ready') is not False or fulfillment.get('operator_required') is not True:
              raise SystemExit('COMMANDER_FULFILLMENT_READINESS=FAIL')
          if re.search(r'buy\\.stripe\\.com|/api/mtg/diagnostic/intake', public_master, re.I):
              raise SystemExit('COMMANDER_PUBLIC_PAYMENT_BYPASS=FAIL')
          print('COMMANDER_RELEASE_STATE=HELD')
          print('COMMANDER_CHECKOUT_BYPASS=ABSENT')
          print('COMMANDER_COMPILED_OFFER=EXCLUDED')
          print('CANONICAL_COMPILED_OFFER_COUNT=' + str(len(compiled.get('offers', []))))
          PY

      - name: Verify critical syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find BEC-PRIME -type f -name '*.js' ! -path 'BEC-PRIME/compiled/*' ! -path 'BEC-PRIME/RUN-PROOFS/*' -print0)
          node --check api/account/'[...route].js'
          echo 'JAVASCRIPT_SYNTAX=PASS'

      - name: Verify silo isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          approved = json.loads(Path('BEC-PRIME/catalog/offers/approved.json').read_text())['approved']
          for offer in approved:
              text = json.dumps(offer).lower()
              if offer.get('silo') == 'mtg' and ('amplissa' in text or 'adult' in text):
                  raise SystemExit('MTG_SILO_ISOLATION=FAIL')
          print('MTG_SILO_ISOLATION=PASS')
          print('PUBLIC_ACTIONS=APPROVAL_GATED')
          PY

      - name: Verify live front door
        shell: bash
        env:
          BASE_URL: https://dreamledger.org
        run: |
          set -euo pipefail
          for path in / /healthz /version; do
            code=$(curl -sS -o /tmp/response --retry 3 --retry-delay 2 --max-time 15 -w '%{http_code}' "$BASE_URL$path")
            echo "$path HTTP=$code"
            test "$code" = "200"
          done
          echo 'LIVE_FRONT_DOOR=PASS'

      - name: Verify held checkout contract without contacting production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          product = json.loads(Path('BEC-PRIME/catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json').read_text())
          featured = json.loads(Path('BEC-PRIME/catalog/featured-offer.json').read_text())
          approved = json.loads(Path('BEC-PRIME/catalog/offers/approved.json').read_text())
          held = [x for x in approved.get('held', []) if x.get('offer_id') == 'OFFER-CMD-DIAG-29-NZD']
          assert product.get('status') == 'held', 'Commander release state must stay held'
          assert product.get('checkout', {}).get('mode') == 'disabled', 'Commander checkout must remain disabled'
          assert product.get('commercial_truth', {}).get('sellable') is False, 'Held diagnostic cannot claim sellability'
          assert featured.get('payment_link_url') is None and featured.get('checkout_url') is None, 'Featured offer cannot expose payment URLs'
          assert not any(x.get('offer_id') == 'OFFER-CMD-DIAG-29-NZD' for x in approved.get('approved', [])), 'Held diagnostic cannot be in approved[]'
          assert len(held) == 1 and held[0].get('payment_link_url') is None, 'Held catalog record is missing or exposes a payment URL'
          print('COMMANDER_CHECKOUT_HELD=PASS')
          print('PRODUCTION_CHECKOUT_REQUESTS=0')
          PY

      - name: Write proof artifact
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p BEC-PRIME/RUN-PROOFS/GAUNTLET
          python3 - <<'PY'
          import hashlib, json, os, time
          from pathlib import Path
          proof = {
              'schema_version': 'DREAMLEDGER-GAUNTLET-RELEASE-1',
              'status': 'PASS_TECHNICAL_ONLY',
              'commercial_status': 'BLOCKED_PENDING_SETTLED_PAYMENT_AND_FULFILLMENT',
              'verified_revenue_nzd': 0,
              'release_sha': os.environ['RELEASE_SHA'],
              'checked_at_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'economic_truth': {
                  'status': 'BLOCKED',
                  'blocker': 'No independently attributable settled live payment plus fulfillment and delivery evidence.',
                  'payment_link': 'VERIFIED_CONFIGURED',
                  'purchase_executed': False,
                  'sale_settled': False,
                  'economic_proof': False
              },
              'gates': [
                  'canonical_compile',
                  'wealth_engine_gauntlet',
                  'approved_offer_contract',
                  'javascript_syntax',
                  'silo_isolation',
                  'live_front_door',
                  'checkout_contract'
              ],
              'public_actions': 'approval-gated',
              'financial_actions': 'approval-gated'
          }
          raw = json.dumps(proof, sort_keys=True, indent=2).encode()
          proof['sha256'] = hashlib.sha256(raw).hexdigest()
          path = Path('BEC-PRIME/RUN-PROOFS/GAUNTLET/DREAMLEDGER-GAUNTLET-LATEST.json')
          path.write_text(json.dumps(proof, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(proof, indent=2))
          PY

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-gauntlet-proof-${{ github.sha }}
          path: BEC-PRIME/RUN-PROOFS/GAUNTLET/DREAMLEDGER-GAUNTLET-LATEST.json
          if-no-files-found: error
          retention-days: 30
