name: Deploy Cloudflare Pages (manual gated)

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Confirm that the Cloudflare Pages Direct Upload project and custom domain cutover plan have been reviewed."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: ${{ inputs.confirm_production_deploy == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate Cloudflare configuration without printing credentials
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT_ID" || { echo "Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CF_API_TOKEN" || { echo "Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_PAGES_PROJECT_NAME" || { echo "Missing repository variable CLOUDFLARE_PAGES_PROJECT_NAME"; exit 1; }
      - name: Verify catalogue safety
        run: npm run verify:mtg-catalogue-safety
      - name: Build candidate
        run: npm run build:cloudflare-pages
      - name: Deploy to Pages Direct Upload project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/cloudflare-pages --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
