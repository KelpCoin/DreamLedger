name: Public Website Contract

on:
  push:
    paths:
      - "public/home.html"
      - "public/about.html"
      - "public/trust.html"
      - "public/server.js"
      - "public/billboard.html"
      - "supabase/functions/dreamledger-billboard-webhook/index.ts"
      - "scripts/test_billboard_live_contract.mjs"
      - "scripts/test_public_site_contract.py"
      - ".github/workflows/website-contract.yml"
  pull_request:
    paths:
      - "public/home.html"
      - "public/about.html"
      - "public/trust.html"
      - "public/server.js"
      - "public/billboard.html"
      - "supabase/functions/dreamledger-billboard-webhook/index.ts"
      - "scripts/test_billboard_live_contract.mjs"
      - "scripts/test_public_site_contract.py"
      - ".github/workflows/website-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-website-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check public route and content contract
        run: python scripts/test_public_site_contract.py
      - name: Check storefront server syntax
        run: node --check public/server.js
      - name: Prove synthetic billboard payment to placement contract
        run: node scripts/test_billboard_live_contract.mjs
      - name: Confirm existing live billboard webhook rejects unsigned synthetic requests
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 20 --output /tmp/billboard-signed-boundary.json --write-out '%{http_code}' \
            -X POST 'https://wbwgroygjeyukkspnqiy.supabase.co/functions/v1/dreamledger-billboard-webhook' \
            -H 'content-type: application/json' \
            -H 'stripe-signature: t=1,v1=synthetic-unsigned-smoke' \
            -H 'user-agent: BECK-billboard-negative-smoke/1' \
            --data '{"type":"checkout.session.completed","livemode":false,"data":{"object":{"payment_status":"paid"}}}')
          test "$code" = 400
          grep -q 'Invalid Stripe signature' /tmp/billboard-signed-boundary.json

