name: DreamLedger Canonical Production Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamledger-vercel-production-gate
  cancel-in-progress: true

env:
  LIVE_URL: https://dreamledger.org

jobs:
  ci-gauntlet-elohim:
    name: CI + Gauntlet + Elohim
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BEC-PRIME
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BEC-PRIME/package.json

      - name: Install
        run: npm install

      - name: Compile commerce spine
        run: npm run compile

      - name: Worker smoke
        run: npm run smoke:worker

      - name: Worker proof verification
        run: npm run worker:verify

      - name: Gauntlet
        run: npm run gauntlet

      - name: Elohim module verification
        run: node -e "const E=require('./elohim/ElohimV6'); console.log('ELOHIM_LOAD=PASS'); console.log(typeof E)"

      - name: Runtime module verification
        run: node -e "require('./runtime/ControlPlane'); require('./runtime/worker-pool'); require('./proxy/DigitalProxy'); console.log('RUNTIME_LOAD=PASS')"

      - name: Brand contract verification
        run: node scripts/Apply-DreamLedgerBrand.js

  vercel-live:
    name: Canonical Production HTTP Check
    needs: ci-gauntlet-elohim
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe canonical domain
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for attempt in $(seq 1 30); do
            code=$(curl -L -sS -o /tmp/dreamledger.html -w '%{http_code}' --max-time 15 "$LIVE_URL/" || true)
            if [ "$code" = "200" ]; then
              echo "PRODUCTION_ROOT_HTTP=200"
              break
            fi
            echo "Production not ready: HTTP $code (attempt $attempt/30)"
            sleep 10
          done
          test "$code" = "200"
          grep -Eqi 'DreamLedger|Dream Ledger' /tmp/dreamledger.html
          grep -Eqi 'Inter|system-ui|Segoe UI' /tmp/dreamledger.html

      - name: Probe health endpoint
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 15 "$LIVE_URL/healthz" || true)
          test "$code" = "200"
          echo "PRODUCTION_HEALTH_HTTP=200"

      - name: Probe offers endpoint
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/offers.json -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 15 "$LIVE_URL/api/offers" || true)
          test "$code" = "200"
          grep -q '{' /tmp/offers.json
          echo "PRODUCTION_OFFERS_HTTP=200"

      - name: Verify deployed commit parity
        shell: bash
        run: |
          set -euo pipefail
          curl -L -sS --retry 5 --retry-delay 5 --max-time 15 "$LIVE_URL/version" -o /tmp/version.json
          node -e "const p=require('/tmp/version.json'); if(p.commit!=='\${GITHUB_SHA}') { console.error('DEPLOY_COMMIT_MISMATCH',p.commit,'expected','\${GITHUB_SHA}'); process.exit(1) } console.log('DEPLOY_COMMIT_PARITY=PASS',p.commit)"

      - name: MTG production surface sweep
        shell: bash
        run: |
          set -euo pipefail
          routes=(/mtg /mtg-search /mtg-list /login /register /commander-guide /agent-commerce)
          for route in "\${routes[@]}"; do
            body="/tmp/route.html"
            code=$(curl -L -sS -o "$body" -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 15 "$LIVE_URL$route" || true)
            test "$code" = "200"
            test -s "$body"
            grep -Eqi 'DreamLedger|Dream Ledger|Magic|Commander|Commerce' "$body"
            echo "MTG_ROUTE_PASS=$route HTTP=$code"
          done

      - name: Probe anonymous account session
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/account-me.json -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 15 "$LIVE_URL/api/account/me" || true)
          test "$code" = "200"
          grep -q '"authenticated":false' /tmp/account-me.json
          echo "PRODUCTION_ACCOUNT_ME_HTTP=200_ANONYMOUS"

      - name: Emit production truth proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          printf '{"status":"PASS","url":"https://dreamledger.org","source_sha":"%s","checks":["http_200","deploy_commit_parity","mtg_surface_sweep","dreamledger_surface","healthz_200","offers_200","account_me_200_anonymous","ci","gauntlet","elohim","runtime","brand_contract"]}\n' "${GITHUB_SHA}" > proof/vercel-production-proof.json
          cat proof/vercel-production-proof.json

      - name: Upload production proof
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-production-http-proof-${{ github.run_id }}
          path: proof/vercel-production-proof.json
          if-no-files-found: error
          retention-days: 30
