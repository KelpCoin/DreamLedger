name: DreamLedger Vercel Production Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamledger-vercel-production-gate
  cancel-in-progress: true

env:
  LIVE_URL: https://dreamledger.org

jobs:
  ci-gauntlet-elohim:
    name: CI + Gauntlet + Elohim
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BEC-PRIME
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BEC-PRIME/package.json

      - name: Install
        run: npm install

      - name: Compile commerce spine
        run: npm run compile

      - name: Worker smoke
        run: npm run smoke:worker

      - name: Worker proof verification
        run: npm run worker:verify

      - name: Gauntlet
        run: npm run gauntlet

      - name: Elohim module verification
        run: node -e "const E=require('./elohim/ElohimV6'); console.log('ELOHIM_LOAD=PASS'); console.log(typeof E)"

      - name: Runtime module verification
        run: node -e "require('./runtime/ControlPlane'); require('./runtime/worker-pool'); require('./proxy/DigitalProxy'); console.log('RUNTIME_LOAD=PASS')"

  vercel-live:
    name: Canonical Production HTTP Check
    needs: ci-gauntlet-elohim
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe canonical domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code=$(curl -L -sS -o /tmp/dreamledger.html -w '%{http_code}' --max-time 15 "$LIVE_URL/" || true)
            if [ "$code" = "200" ]; then
              echo "PRODUCTION_HTTP=200"
              break
            fi
            echo "Production not ready: HTTP $code (attempt $attempt/30)"
            sleep 10
          done
          test "${code:-000}" = "200"

      - name: Verify canonical DreamLedger surface
        shell: bash
        run: |
          set -euo pipefail
          grep -Eqi 'DreamLedger|Dream Ledger' /tmp/dreamledger.html
          printf '%s\n' '{"status":"PASS","url":"https://dreamledger.org","checks":["http_200","dreamledger_surface","ci","gauntlet","elohim"]}' > vercel-production-proof.json
          cat vercel-production-proof.json

      - name: Upload production proof
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-production-http-proof
          path: vercel-production-proof.json
