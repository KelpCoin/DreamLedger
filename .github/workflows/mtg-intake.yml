name: MTG Agent Bridge Intake

on:
  push:
    branches: [main]
    paths:
      - 'AGENT_BUS/BRIDGE/MTG_INTAKE/inbox/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mtg-intake
  cancel-in-progress: false

jobs:
  ingest:
    name: Validate and accept MTG intake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process MTG submissions
        run: node BEC-PRIME/scripts/ingest-mtg-bridge.js

      - name: Commit canonical records and receipts
        run: |
          git config user.name "DreamLedger MTG Bridge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENT_BUS/BRIDGE/MTG_INTAKE
          if git diff --cached --quiet; then
            echo "No MTG intake changes to commit."
            exit 0
          fi
          git commit -m "MTG bridge: accept deck intake"
          git push
