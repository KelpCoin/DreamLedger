name: Commercial Payment Truth Gate
on:
  pull_request:
    paths:
      - "ops/commercial/money_pipeline.py"
      - "tests/test_money_pipeline_truth_gate.py"
      - ".github/workflows/commercial-payment-truth-gate.yml"
  workflow_dispatch:
jobs:
  payment-truth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify payment-only semantics
        run: python -m unittest discover -s tests -p test_money_pipeline_truth_gate.py -v
