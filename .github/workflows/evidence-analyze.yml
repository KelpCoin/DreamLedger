name: Evidence Triage API Prototype
on:
  push:
    branches: ['beck-evidence-api-prototype-20261027']
    paths:
      - 'handlers/analyze.js'
      - 'api/[...route].ts'
      - 'tests/evidence-analyze.test.cjs'
      - '.github/workflows/evidence-analyze.yml'
  pull_request:
    paths:
      - 'handlers/analyze.js'
      - 'api/[...route].ts'
      - 'tests/evidence-analyze.test.cjs'
      - '.github/workflows/evidence-analyze.yml'
permissions:
  contents: read
jobs:
  evidence-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: node --check handlers/analyze.js
      - name: Bounded API tests
        run: node --test tests/evidence-analyze.test.cjs
