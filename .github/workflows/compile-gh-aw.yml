name: Compile GitHub Agentic Workflows

on:
  push:
    paths:
      - ".github/workflows/777-research.md"
      - ".github/workflows/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install or upgrade gh-aw
        shell: bash
        run: |
          gh extension install github/gh-aw 2>/dev/null || gh extension upgrade github/gh-aw
          gh aw version || gh aw --version || true

      - name: Compile agentic workflows
        shell: bash
        run: gh aw compile --strict --verbose

      - name: Commit generated lock files
        shell: bash
        run: |
          git config user.name "DreamLedger gh-aw compiler"
          git config user.email "777@dreamledger.org"
          git add .github/workflows/*.lock.yml
          if git diff --cached --quiet; then
            echo "No lock-file changes."
            exit 0
          fi
          git commit -m "777: compile agentic workflow"
          git push
