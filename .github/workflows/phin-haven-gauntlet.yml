name: Phin Haven Gauntlet

on:
  push:
    paths:
      - 'public/phin-haven*.html'
      - 'public/avatar.html'
      - 'public/billboard.html'
      - 'BEC-PRIME/**'
      - 'docs/kelplantis/**'
  pull_request:

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Canonical public naming
        shell: bash
        run: |
          set -euo pipefail
          for f in public/phin-haven.html public/phin-haven-v5.html; do
            test -f "$f"
            grep -qi "Phin Haven" "$f"
          done

      - name: Current social-lobby interaction surface
        shell: bash
        run: |
          set -euo pipefail
          f=public/phin-haven-v5.html
          grep -q 'id="feed"' "$f"
          grep -q 'id="input"' "$f"
          grep -q 'id="send"' "$f"
          grep -q 'id="presence"' "$f"
          grep -q 'renderPresence' "$f"
          grep -q 'function send' "$f"

      - name: Economic surface
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('public/catalog.json', 'utf8'));
          const product = catalog.products.find(x => x.id === 'DREAMLEDGER-BILLBOARD-FOUNDING-001');
          const page = fs.readFileSync('public/billboard.html', 'utf8');
          if (!product || product.checkout_available !== false || product.checkout_url !== null || product.availability !== 'review_required') {
            throw new Error('Billboard catalog must hold checkout until intake and inventory are verified');
          }
          if (page.includes('buy.stripe.com') || page.includes('/api/molt-beach-checkout')) {
            throw new Error('Billboard page must not expose the inactive direct checkout or missing intake endpoint');
          }
          if (!page.includes('Paid placement checkout is temporarily held')) {
            throw new Error('Billboard page must clearly state checkout is held');
          }
          console.log('PASS: unverified billboard checkout held safely');
          NODE

      - name: No fake economic proof
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'guaranteed (traffic|impressions|roi|revenue)|fake sale|simulated revenue|test sale' public/phin-haven*.html public/billboard.html

      - name: Avatar surface exists
        shell: bash
        run: |
          set -euo pipefail
          test -f public/avatar.html
          grep -q 'id="avatar"' public/avatar.html
          grep -q 'id="displayName"' public/avatar.html
          grep -q 'DreamLedgerAvatar.save(state)' public/avatar.html
          grep -q 'Name saves with your portable identity' public/avatar.html

      - name: SQL canonical table check
        shell: bash
        run: |
          set -euo pipefail
          test -d supabase/migrations
          # The canonicalization is implemented as a data-preserving DO/ALTER TABLE
          # migration, not as a stored procedure with the former function name.
          grep -Rli 'alter table if exists public.kelplantis_' supabase/migrations >/dev/null
          grep -Rli 'phinhaven_' supabase/migrations/20260921000000_phinhaven_canonical_table_names.sql >/dev/null
