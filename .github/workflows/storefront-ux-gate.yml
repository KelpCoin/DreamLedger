name: DreamLedger Storefront UX Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storefront-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify committed customer storefront
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          grep -Fqi 'THE INTERNET' public/index.html
          grep -Fqi 'IS A GARDEN' public/index.html
          grep -Fqi 'Plant a plot' public/index.html
          grep -Fq 'href="/billboard"' public/index.html
          grep -Fq 'href="/dreammeez"' public/index.html
          grep -Fq 'NZ$50' public/index.html
          grep -Fqi 'shopping agents' public/index.html
          ! grep -Eiq 'Gauntlet|Economic Court|ELOHIM|BEC-PRIME|BrownEye Cortex|AMPLISSA|COLLECTORSCOAST|SUPABASE_SERVICE_ROLE|STRIPE_SECRET|STRIPE_WEBHOOK|RA_000001|Dream Ledger Deck|agentic commerce readiness audit' public/index.html
      - name: Verify principal customer paths exist
        shell: bash
        run: |
          set -euo pipefail
          test -s public/avatar.html
          test -s public/billboard.html
          grep -Eqi 'DreamMeez|Garden identity|gardener' public/avatar.html
          grep -Eqi 'DreamLedger|Internet Garden|NZ\$50' public/billboard.html
      - name: Emit proof artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          printf '{"status":"PASS","commit":"%s","surface":"public/index.html","timestamp_utc":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > proof/storefront-ux-proof.json
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-storefront-ux-${{ github.sha }}
          path: proof/storefront-ux-proof.json
          if-no-files-found: error
          retention-days: 30
