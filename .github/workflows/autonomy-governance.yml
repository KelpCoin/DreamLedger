name: autonomy-governance

on:
  push:
    paths:
      - 'BEC-PRIME/governance/**'
      - 'BEC-PRIME/scripts/verify-autonomy-governance.js'
      - 'BEC-PRIME/package.json'
  pull_request:
    paths:
      - 'BEC-PRIME/governance/**'
      - 'BEC-PRIME/scripts/verify-autonomy-governance.js'
      - 'BEC-PRIME/package.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BEC-PRIME
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify governed autonomy primitives
        run: node --test scripts/verify-autonomy-governance.js
      - name: Verify governed transition and idempotency
        run: node --test scripts/test-governed-transition.js
      - name: Verify evidence-gated distribution feedback
        run: node --test scripts/test-distribution-feedback.js
      - name: Verify authorization firewall
        run: node --test runtime/AuthorizationFirewall.test.js
