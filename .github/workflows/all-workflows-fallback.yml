name: DreamLedger Portfolio Controller

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to dispatch against
        required: false
        default: main
        type: string
  schedule:
    - cron: '*/30 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: dreamledger-portfolio-controller
  cancel-in-progress: true

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dispatch bounded verification spine
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ inputs.ref || 'main' }}
        shell: bash
        run: |
          set -euo pipefail

          # This controller is orchestration only. It intentionally dispatches
          # verification entrypoints, not every historical or economic worker.
          SAFE_PATHS=(
            '.github/workflows/ci.yml'
            '.github/workflows/agentbridge-contract-gate.yml'
            '.github/workflows/truth-oracle.yml'
            '.github/workflows/offer-catalog-contract.yml'
            '.github/workflows/q1-gauntlet.yml'
            '.github/workflows/gauntlet-release-gate.yml'
            '.github/workflows/security-baseline.yml'
            '.github/workflows/ecosystem-integrity.yml'
          )

          for path in "${SAFE_PATHS[@]}"; do
            echo "DISPATCH $path"
            if gh api --method POST               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               "/repos/${REPO}/actions/workflows/${path##*/}/dispatches"               -f ref="${REF}" >/dev/null 2>&1; then
              echo "OK $path"
            else
              echo "FAIL $path"
              exit 1
            fi
          done

      - name: Emit controller proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          cat > proof/dreamledger_portfolio_controller.json <<EOF
          {
            "schema": "dreamledger/portfolio-controller/v2",
            "controller": "DreamLedger Portfolio Controller",
            "mode": "bounded_verification",
            "ref": "${{ inputs.ref || 'main' }}",
            "entrypoint_count": 8,
            "forbidden": [
              "autonomous_spend",
              "wallet_funding",
              "buyer_contact",
              "public_listing",
              "payment_mutation",
              "production_deploy",
              "blind_dispatch_of_historical_workflows"
            ],
            "truth_rule": "external_buyer + settled_payment + attribution + fulfillment + proof",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat proof/dreamledger_portfolio_controller.json

      - name: Upload controller proof
        uses: actions/upload-artifact@v4
        with:
          name: dreamledger-portfolio-controller-${{ github.run_id }}
          path: proof/dreamledger_portfolio_controller.json
