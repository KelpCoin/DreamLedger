name: BEC Prime First Sale Gate

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Deploy DreamLedger to Render
    types:
      - completed
  workflow_dispatch:
    inputs:
      OFFER_ID:
        description: "Approved live DreamLedger offer ID to verify"
        required: false
        default: "OFFER-DREAMLEDGER-BILLBOARD-FOUNDING-001"
      CREATE_CHECKOUT:
        description: "Create one Stripe Checkout doorway after verification"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

env:
  FIRST_SALE_OFFER_ID: ${{ inputs.OFFER_ID || 'OFFER-DREAMLEDGER-BILLBOARD-FOUNDING-001' }}
  CREATE_CHECKOUT: ${{ inputs.CREATE_CHECKOUT || 'false' }}
  BASE_URL: "https://dreamledger.org"
  TARGET_SILO: "dreamledger"
  EXPECTED_PRICE_NZD: "50"

jobs:
  first-sale-gate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify canonical Founding Tile offer
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('BEC-PRIME/catalog/offers/approved.json', 'utf8'));
          const offer = (x.approved || []).find(o => o.offer_id === process.env.FIRST_SALE_OFFER_ID);
          if (!offer) throw new Error('CANONICAL_FOUNDING_TILE_OFFER_MISSING');
          if (offer.silo !== process.env.TARGET_SILO) throw new Error('WRONG_FOUNDING_TILE_SILO');
          if (Number(offer.price) !== Number(process.env.EXPECTED_PRICE_NZD)) throw new Error('WRONG_FOUNDING_TILE_PRICE');
          if (String(offer.currency || '').toUpperCase() !== 'NZD') throw new Error('WRONG_FOUNDING_TILE_CURRENCY');
          if (offer.payment_link_status !== 'ACTIVE_LIVEMODE') throw new Error('FOUNDING_TILE_PAYMENT_LINK_NOT_ACTIVE');
          if (!offer.payment_link_url) throw new Error('FOUNDING_TILE_PAYMENT_LINK_MISSING');
          fs.writeFileSync('approved-offer.json', JSON.stringify(offer, null, 2) + '\n');
          console.log('CANONICAL_FOUNDING_TILE=PASS');
          NODE

      - name: Verify live health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 90 "$BASE_URL/healthz" | tee health.json

      - name: Verify live Founding Tile offer
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 90 "$BASE_URL/api/offers" | tee offers.json
          node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('offers.json', 'utf8'));
          const offers = Array.isArray(x) ? x : (Array.isArray(x.offers) ? x.offers : (Array.isArray(x.data) ? x.data : []));
          const offer = offers.find(o => (o.offer_id === process.env.FIRST_SALE_OFFER_ID || o.id === process.env.FIRST_SALE_OFFER_ID) && String(o.silo || '').toLowerCase() === process.env.TARGET_SILO);
          if (!offer) throw new Error('LIVE_FOUNDING_TILE_OFFER_MISSING');
          if (offer.checkout_available !== true) throw new Error('LIVE_FOUNDING_TILE_NOT_CHECKOUT_READY');
          if (Number(offer.price) !== Number(process.env.EXPECTED_PRICE_NZD)) throw new Error('LIVE_FOUNDING_TILE_WRONG_PRICE');
          if (String(offer.currency || '').toUpperCase() !== 'NZD') throw new Error('LIVE_FOUNDING_TILE_WRONG_CURRENCY');
          fs.writeFileSync('selected-offer.json', JSON.stringify(offer, null, 2) + '\n');
          console.log('LIVE_FOUNDING_TILE=PASS');
          NODE

      - name: Create one checkout doorway
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.CREATE_CHECKOUT == true }}
        shell: bash
        run: |
          set -euo pipefail
          OFFER_ID="$FIRST_SALE_OFFER_ID"
          curl --fail --silent --show-error --max-time 60 \
            -X POST "$BASE_URL/api/offer-checkout/create" \
            -H 'Content-Type: application/json' \
            --data "{\"offer_id\":\"$OFFER_ID\",\"silo\":\"$TARGET_SILO\"}" \
            | tee checkout.json
          node <<'NODE'
          const x = require('./checkout.json');
          const u = x.url || x.checkout_url;
          if (!u || !/^https:\/\/(checkout\.stripe\.com|buy\.stripe\.com)\//.test(u)) throw new Error('real Stripe checkout doorway not returned');
          console.log('CHECKOUT_READY', u.replace(/[^/]+$/, '[session]'));
          NODE

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-sale-gate-proof-${{ github.run_id }}
          path: |
            approved-offer.json
            health.json
            offers.json
            selected-offer.json
            checkout.json
          if-no-files-found: ignore
