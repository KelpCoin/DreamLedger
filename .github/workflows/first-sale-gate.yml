name: BEC Prime First Sale Gate

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Deploy DreamLedger to Render
    types:
      - completed
  workflow_dispatch:
    inputs:
      PRODUCT_ID:
        description: "Optional live product/SKU to verify; blank enumerates published products"
        required: false
        default: ""
      OFFER_ID:
        description: "Optional live offer ID to checkout; blank selects a matching published live offer"
        required: false
        default: ""
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

env:
  FIRST_SALE_PRODUCT_ID: ${{ inputs.PRODUCT_ID || '' }}
  FIRST_SALE_OFFER_ID: ${{ inputs.OFFER_ID || '' }}
  BASE_URL: "https://dreamledger.org"

jobs:
  first-sale-gate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify published catalog
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = 'BEC-PRIME/catalog/products';
          const selected = process.env.FIRST_SALE_PRODUCT_ID;
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.json')).sort();
          const products = files.map(f => ({ file: f, data: JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8')) }));
          const published = products.filter(({data}) => String(data.status || '').toLowerCase() === 'published' && Number(data.inventory || 0) > 0);
          if (!published.length) throw new Error('NO_PUBLISHED_PRODUCTS');
          if (selected && !published.some(({data}) => data.id === selected)) throw new Error(`SELECTED_PRODUCT_NOT_PUBLISHED: ${selected}`);
          for (const {file, data: p} of published) {
            const price = Number(p.price);
            const currency = String(p.currency || '').toUpperCase();
            if (!p.id || !p.name || !Number.isInteger(price) || price <= 0 || currency !== 'NZD') {
              throw new Error(`INVALID_PUBLISHED_PRODUCT: ${file}`);
            }
            if (!p.commercial_truth || p.commercial_truth.approval_required !== false) {
              throw new Error(`UNAPPROVED_PUBLISHED_PRODUCT: ${file}`);
            }
            if (!p.evidence || !p.evidence.status) throw new Error(`MISSING_EVIDENCE_STATE: ${file}`);
            console.log(`PUBLISHED_READY ${p.id} ${price} ${currency}`);
          }
          console.log(`PUBLISHED_COUNT ${published.length}`);
          NODE

      - name: Verify live health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 90 "$BASE_URL/healthz" | tee health.json

      - name: Enumerate live checkout-ready offers
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 90 "$BASE_URL/api/offers" | tee offers.json
          node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('offers.json', 'utf8'));
          const offers = Array.isArray(x) ? x : (x.offers || x.data || []);
          const productId = process.env.FIRST_SALE_PRODUCT_ID;
          const offerId = process.env.FIRST_SALE_OFFER_ID;
          const ready = offers.filter(o => o.checkout_available === true && Number(o.price) > 0 && String(o.currency || '').toUpperCase() === 'NZD');
          const matches = ready.filter(o => (!productId || o.product_id === productId || o.sku === productId || o.id === productId) && (!offerId || o.offer_id === offerId || o.id === offerId));
          if (!matches.length) throw new Error('NO_MATCHING_CHECKOUT_READY_OFFER');
          console.log(`LIVE_CHECKOUT_READY_COUNT ${ready.length}`);
          console.log('SELECTED_LIVE_OFFER', JSON.stringify(matches[0]));
          fs.writeFileSync('selected-offer.json', JSON.stringify(matches[0], null, 2) + '\n');
          NODE

      - name: Create one checkout doorway
        shell: bash
        run: |
          set -euo pipefail
          OFFER_ID="$(node -p "require('./selected-offer.json').offer_id || require('./selected-offer.json').id || ''")"
          test -n "$OFFER_ID"
          curl --fail --silent --show-error --max-time 60 \
            -X POST "$BASE_URL/api/offer-checkout/create" \
            -H 'Content-Type: application/json' \
            --data "{\"offer_id\":\"$OFFER_ID\"}" \
            | tee checkout.json
          node - <<'NODE'
          const x = require('./checkout.json');
          const u = x.url || x.checkout_url;
          if (!u || !/^https:\/\/checkout\.stripe\.com\//.test(u)) throw new Error('real Stripe Checkout URL not returned');
          console.log('CHECKOUT_READY', u.replace(/[^/]+$/, '[session]'));
          NODE

      - name: Upload gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: first-sale-gate-proof
          path: |
            health.json
            offers.json
            selected-offer.json
            checkout.json
          if-no-files-found: error
