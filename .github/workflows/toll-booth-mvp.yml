name: toll-booth-mvp
on:
  push:
    branches: [main]
    paths:
      - 'public/catalog.json'
      - 'public/server.js'
      - 'public/toll-booths.html'
      - 'scripts/validate_toll_booths.py'
      - '.github/workflows/toll-booth-mvp.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_toll_booths.py
