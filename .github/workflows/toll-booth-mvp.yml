name: toll-booth-mvp
on:
  push:
    branches: [main]
    paths:
      - 'public/catalog.json'
      - 'public/server.js'
      - 'public/toll-booths.html'
      - 'BEC-PRIME/routes/marketplaceForward.js'
      - 'BEC-PRIME/routes/marketplaceForwardWebhook.js'
      - 'scripts/validate_toll_booths.py'
      - '.github/workflows/toll-booth-mvp.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_toll_booths.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check BEC-PRIME/routes/marketplaceForward.js
      - run: node --check BEC-PRIME/routes/marketplaceForwardWebhook.js
      - run: node --check public/server.js
      - run: node --test BEC-PRIME/runtime/TollRoad.test.js
      - run: node -e "const p=require('./BEC-PRIME/lib/marketplacePolicy'); if(p.calculateMarketplaceFee('external-seller','MARKETPLACE',100).fee_amount!==0) process.exit(1)"
