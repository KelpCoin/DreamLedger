name: DreamLedger Universal Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "BEC-PRIME/factory/**"
      - "BEC-PRIME/compiler/**"
      - "BEC-PRIME/catalog/**"
      - "BEC-PRIME/compiled/opportunities/**"
      - "runtime/economic/**"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - "BEC-PRIME/factory/**"
      - "BEC-PRIME/compiler/**"
      - "BEC-PRIME/catalog/**"
      - "BEC-PRIME/compiled/opportunities/**"
      - "runtime/economic/**"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: dreamledger-universal-factory
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test economic silo factory
        run: python -m unittest runtime/economic/test_economic_silo_factory.py
      - name: Generate economic silo catalog
        run: |
          python runtime/economic/economic_silo_factory.py             --source runtime/economic/ECONOMIC-SILO-TRAVERSE-2026-10-04.json             --out-dir runtime/economic             --limit 10000
      - run: npm run compile:opportunities
      - run: npm run compile:factory-factory
      - run: npm run compile:factory-approval
      - run: npm run factory:universal
      - run: node BEC-PRIME/factory/FactoryFactoryEngine.js
      - run: node BEC-PRIME/factory/X402FactoryFactory.js
      - name: Reconcile live Stripe offers
        env:
          STRIPE_LIVE_ENABLED: ${{ secrets.STRIPE_LIVE_ENABLED }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ "${STRIPE_LIVE_ENABLED:-}" = "true" ] && [ -n "${STRIPE_SECRET_KEY:-}" ]; then
            npm run reconcile:approved-offers
          else
            echo "STRIPE_RECONCILIATION=SKIPPED_NO_LIVE_CREDENTIAL"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: universal-factory-state
          path: |
            BEC-PRIME/data/factory-factory/
            BEC-PRIME/data/x402-factory/
            proof/commerce/
            runtime/economic/ECONOMIC-SILO-CATALOG-2026-10-04.json
            runtime/economic/ECONOMIC-SILO-BLOCKERS-2026-10-04.json
            runtime/economic/ECONOMIC-SILO-PROMOTION-2026-10-04.json
            runtime/economic/ECONOMIC-SILO-FACTORY-PROOF-2026-10-04.json
