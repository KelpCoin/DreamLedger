name: MTG Diagnostic Fulfillment Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify diagnostic retirement
        shell: pwsh
        run: |
          $catalog = Get-Content public/catalog.json -Raw
          $mtg = Get-Content public/mtg.html -Raw
          if ($catalog -match 'COMMANDER-DECK-DIAGNOSTIC|Commander Deck Diagnostic') { throw 'Retired Commander Deck Diagnostic remains in public catalog' }
          if ($mtg -match 'COMMANDER-DECK-DIAGNOSTIC|Commander Deck Diagnostic') { throw 'Retired Commander Deck Diagnostic remains on public MTG surface' }
          Write-Host '[PASS] Commander Deck Diagnostic is retired from the public commercial surface.'
