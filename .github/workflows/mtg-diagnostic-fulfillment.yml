name: MTG Diagnostic Fulfillment Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check BEC-PRIME/lib/mtgDiagnosticFulfillment.js
          node --check BEC-PRIME/routes/mtgDiagnostic.js
          node --check BEC-PRIME/start.js
      - name: Contract test
        run: node BEC-PRIME/scripts/test-mtg-diagnostic.js
      - name: Product and fulfillment contract
        shell: pwsh
        run: |
          $p = Get-Content BEC-PRIME/catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json -Raw | ConvertFrom-Json
          $f = Get-Content BEC-PRIME/fulfillment/PRODUCT-FULFILLMENT-REGISTRY.json -Raw | ConvertFrom-Json
          if ($p.price -ne 29) { throw 'Commander diagnostic price contract failed' }
          if ($p.fulfilment.mode -ne 'automated') { throw 'Automated fulfillment contract failed' }
          if ($p.fulfilment.operator_required -ne $false) { throw 'Operator-free fulfillment contract failed' }
          if ($f.entries.'COMMANDER-DECK-DIAGNOSTIC-001'.operator_required -ne $false) { throw 'Registry still requires operator' }
          if ($f.entries.'COMMANDER-DECK-DIAGNOSTIC-001'.ready -ne $true) { throw 'Registry is not ready' }
          Write-Host '[PASS] MTG diagnostic commercial and fulfillment contract'
      - name: Compile MTG surface
        run: node BEC-PRIME/compiler/MTGCatalogCompiler.js
      - name: Verify CUBE MTG reskin
        shell: pwsh
        run: .\BEC-PRIME\scripts\Verify-CUBE-MTG-Reskin.ps1
      - name: Verify current public surfaces
        shell: pwsh
        run: |
          $required = @('public/index.html','public/mtg.html','public/billboard.html','public/avatar.html','public/server.js')
          foreach ($f in $required) { if (!(Test-Path $f)) { throw "Missing public surface: $f" } }
          $homePage = Get-Content public/index.html -Raw
          foreach ($token in @('FIND SOMETHING','href="/mtg"','href="/billboard"','DreamMee')) {
            if ($homePage -notmatch [regex]::Escape($token)) { throw "Public catalogue token missing: $token" }
          }
          if ($homePage -match 'Agentic Commerce Readiness Audit') { throw 'Historical audit homepage residue detected' }
          Write-Host '[PASS] DreamLedger public catalogue + MTG + billboard + avatar surfaces present'
