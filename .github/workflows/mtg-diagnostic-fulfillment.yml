name: MTG Diagnostic Fulfillment Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check BEC-PRIME/lib/mtgDiagnosticFulfillment.js
          node --check BEC-PRIME/routes/mtgDiagnostic.js
          node --check BEC-PRIME/start.js
      - name: Contract test
        run: node BEC-PRIME/scripts/test-mtg-diagnostic.js
      - name: Product and fulfillment contract
        shell: pwsh
        run: |
          $p = Get-Content BEC-PRIME/catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json -Raw | ConvertFrom-Json
          $f = Get-Content BEC-PRIME/fulfillment/PRODUCT-FULFILLMENT-REGISTRY.json -Raw | ConvertFrom-Json
          if ($p.price -ne 29) { throw 'Commander diagnostic price contract failed' }
          if ($p.fulfillment.mode -ne 'automated') { throw 'Automated fulfillment contract failed' }
          if ($p.fulfillment.operator_required -ne $false) { throw 'Operator-free fulfillment contract failed' }
          if ($f.entries.'COMMANDER-DECK-DIAGNOSTIC-001'.operator_required -ne $false) { throw 'Registry still requires operator' }
          if ($f.entries.'COMMANDER-DECK-DIAGNOSTIC-001'.ready -ne $true) { throw 'Registry is not ready' }
          Write-Host '[PASS] MTG diagnostic commercial and fulfillment contract'
      - name: Compile MTG surface
        run: node BEC-PRIME/compiler/MTGCatalogCompiler.js
      - name: Verify CUBE MTG reskin
        shell: pwsh
        run: .\BEC-PRIME\scripts\Verify-CUBE-MTG-Reskin.ps1
      - name: Verify public surfaces exist
        shell: pwsh
        run: |
          $required = @(
            'BEC-PRIME/compiled/website/index.html',
            'BEC-PRIME/compiled/website/mtg/index.html',
            'BEC-PRIME/compiled/website/mtg/diagnostic.html',
            'BEC-PRIME/compiled/website/mtg/diagnostic-success.html',
            'BEC-PRIME/compiled/website/mtg.html',
            'BEC-PRIME/compiled/website/billboard.html'
          )
          foreach ($f in $required) { if (!(Test-Path $f)) { throw "Missing public surface: $f" } }
          # DreamLedger1 serves public/home.html at /. Check the actual canonical storefront,
          # not a stale compiled snapshot maintained by a different build path.
          $homeHtml = Get-Content public/home.html -Raw
          foreach ($token in @('DreamLedger','Supplier Quote Comparison Worksheet','Truth Oracle')) {
            if ($homeHtml -notmatch [regex]::Escape($token)) { throw "Canonical storefront token missing: $token" }
          }
          if ($homeHtml -match 'Agentic Commerce Readiness Audit|BrownEye Cortex|Economic Court|ELOHIM|AMPLISSA|COLLECTORSCOAST') { throw 'Internal or historical homepage residue detected' }
          $catalog = Get-Content public/catalog.json -Raw | ConvertFrom-Json
          $diagnostic = $catalog.products | Where-Object { $_.id -eq 'COMMANDER-DECK-DIAGNOSTIC-001' -and $_.sku -eq 'CMD-DIAG-29' } | Select-Object -First 1
          $canonicalLink = 'https://buy.stripe.com/eVqeVdc1T01n1DV3gwdwc30'
          $legacyLink = 'https://buy.stripe.com/8x228r1nfg0l3M32csdwc2I'
          if (!$diagnostic -or $diagnostic.price -ne 29 -or $diagnostic.currency -notmatch '^(?i)nzd
 -or $diagnostic.checkout_url -ne $canonicalLink -or $diagnostic.checkout_available -ne $true) { throw 'Canonical $29 diagnostic catalogue contract mismatch' }
          $mtgHtml = Get-Content public/mtg/index.html -Raw
          if ($mtgHtml -notmatch 'Commander diagnostic' -or $mtgHtml -notmatch [regex]::Escape($canonicalLink) -or $mtgHtml.Contains($legacyLink)) { throw 'Public MTG diagnostic CTA does not match canonical checkout contract' }
          Write-Host '[PASS] DreamLedger storefront, current MTG diagnostic link, and fulfillment surfaces present'
