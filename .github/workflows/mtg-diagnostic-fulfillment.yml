name: MTG Diagnostic Fulfillment Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check BEC-PRIME/lib/mtgDiagnosticFulfillment.js
          node --check BEC-PRIME/routes/mtgDiagnostic.js
          node --check BEC-PRIME/start.js
      - name: Contract test
        run: node BEC-PRIME/scripts/test-mtg-diagnostic.js
      - name: Product and fulfillment contract
        shell: pwsh
        run: |
          $p = Get-Content BEC-PRIME/catalog/products/COMMANDER-DECK-DIAGNOSTIC-001.json -Raw | ConvertFrom-Json
          $f = Get-Content BEC-PRIME/fulfillment/PRODUCT-FULFILLMENT-REGISTRY.json -Raw | ConvertFrom-Json
          $entry = $f.entries.'COMMANDER-DECK-DIAGNOSTIC-001'
          if ($p.price -ne 29) { throw 'Commander diagnostic price contract failed' }
          if ($p.status -ne 'held') { throw 'Commander diagnostic must remain held until release evidence passes' }
          if ($p.checkout.mode -ne 'disabled') { throw 'Held Commander checkout must be disabled' }
          if ($p.commercial_truth.sellable -ne $false -or $p.commercial_truth.approval_required -ne $true) { throw 'Held Commander sellability boundary failed' }
          if ($p.fulfillment.mode -ne 'disabled' -or $p.fulfillment.operator_required -ne $true) { throw 'Held Commander fulfillment must remain disabled' }
          if ($entry.operator_required -ne $true -or $entry.ready -ne $false) { throw 'Fulfillment registry must keep held Commander unavailable' }
          Write-Host '[PASS] MTG diagnostic is held fail-closed; checkout and fulfillment remain disabled'
      - name: Compile MTG surface
        run: node BEC-PRIME/compiler/MTGCatalogCompiler.js
      - name: Verify CUBE MTG reskin
        shell: pwsh
        run: .\BEC-PRIME\scripts\Verify-CUBE-MTG-Reskin.ps1
      - name: Verify public surfaces exist
        shell: pwsh
        run: |
          $required = @(
            'BEC-PRIME/compiled/website/index.html',
            'BEC-PRIME/compiled/website/mtg/index.html',
            'BEC-PRIME/compiled/website/mtg/diagnostic.html',
            'BEC-PRIME/compiled/website/mtg/diagnostic-success.html',
            'BEC-PRIME/compiled/website/mtg.html',
            'BEC-PRIME/compiled/website/billboard.html'
          )
          foreach ($f in $required) { if (!(Test-Path $f)) { throw "Missing public surface: $f" } }
          # DreamLedger1 serves public/home.html at /. Check the actual canonical storefront,
          # not a stale compiled snapshot maintained by a different build path.
          $homeHtml = Get-Content public/home.html -Raw
          foreach ($token in @('DreamLedger','Free quote worksheet','Commander diagnostic','Truth Oracle')) {
            if ($homeHtml -notmatch [regex]::Escape($token)) { throw "Canonical storefront token missing: $token" }
          }
          if ($homeHtml -match 'Agentic Commerce Readiness Audit|BrownEye Cortex|Economic Court|ELOHIM|AMPLISSA|COLLECTORSCOAST') { throw 'Internal or historical homepage residue detected' }
          if ($homeHtml -match '/buy/COMMANDER-DECK-DIAGNOSTIC-001|eVqeVdc1T01n1DV3gwdwc30') { throw 'Held Commander checkout must not appear on homepage' }
          Write-Host '[PASS] DreamLedger catalogue doorway + MTG + Billboard surfaces present'
