name: BECK Cloud Truth Heartbeat

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/beck-cloud-truth-heartbeat.yml
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beck-cloud-truth-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EDGE_HEALTH_URL: https://wbwgroygjeyukkspnqiy.supabase.co/functions/v1/economic-radar-heartbeat/healthz
      STATIC_ORIGIN_URL: https://dreamledger-org.onrender.com
      PUBLIC_URL: https://dreamledger.org
      LEGACY_RENDER_API_URL: https://dreamledger1.onrender.com
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://wbwgroygjeyukkspnqiy.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Probe cloud-first runtime and write immutable evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/beck
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sha="$(git rev-parse HEAD)"
          edge_code="$(curl -sS --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 40 -o /tmp/edge-health.json -w '%{http_code}' "$EDGE_HEALTH_URL" || true)"
          origin_code="$(curl -sS --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 40 -o /tmp/origin.html -w '%{http_code}' "$STATIC_ORIGIN_URL/" || true)"
          oracle_code="$(curl -sS --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 40 -o /tmp/origin-truth-oracle.html -w '%{http_code}' "$STATIC_ORIGIN_URL/truth-oracle.html" || true)"
          public_site_code="$(curl -sS --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 40 -o /tmp/public-site.html -w '%{http_code}' "$PUBLIC_URL/" || true)"
          legacy_api_code="$(curl -sS --connect-timeout 5 --max-time 10 -o /tmp/legacy-api-health.json -w '%{http_code}' "$LEGACY_RENDER_API_URL/healthz" || true)"
          edge_contract_ok=false
          edge_version=""
          edge_function=""
          if [ "$edge_code" = "200" ]; then
            edge_contract_ok="$(node -e 'try { const x=JSON.parse(require("fs").readFileSync("/tmp/edge-health.json","utf8")); process.stdout.write(x.status==="healthy" && x.function==="economic-radar-heartbeat" && Number(x.version)>=27 ? "true" : "false") } catch { process.stdout.write("false") }')"
            edge_version="$(node -e 'try { const x=JSON.parse(require("fs").readFileSync("/tmp/edge-health.json","utf8")); process.stdout.write(String(x.version||"")) } catch {}')"
            edge_function="$(node -e 'try { const x=JSON.parse(require("fs").readFileSync("/tmp/edge-health.json","utf8")); process.stdout.write(String(x.function||"")) } catch {}')"
          fi
          edge_ok=false
          origin_ok=false
          oracle_ok=false
          public_site_ok=false
          [ "$edge_contract_ok" = "true" ] && edge_ok=true
          [ "$origin_code" = "200" ] && origin_ok=true
          [ "$oracle_code" = "200" ] && oracle_ok=true
          [ "$public_site_code" = "200" ] && public_site_ok=true
          core_ok=false
          [ "$edge_ok" = "true" ] && [ "$origin_ok" = "true" ] && [ "$oracle_ok" = "true" ] && core_ok=true
          overall=false
          [ "$core_ok" = "true" ] && [ "$public_site_ok" = "true" ] && overall=true
          export NOW="$now" EXPECTED_SHA="$sha" EDGE_CODE="$edge_code" EDGE_FUNCTION="$edge_function" EDGE_VERSION="$edge_version" EDGE_OK="$edge_ok" ORIGIN_CODE="$origin_code" ORIGIN_OK="$origin_ok" ORACLE_CODE="$oracle_code" ORACLE_OK="$oracle_ok" PUBLIC_SITE_CODE="$public_site_code" PUBLIC_SITE_OK="$public_site_ok" LEGACY_API_CODE="$legacy_api_code" CORE_OK="$core_ok" OVERALL="$overall"
          node <<'NODE'
          const fs=require('fs');
          const p={
            schema:'BECK-CLOUD-HEARTBEAT/v2',
            proof_type:'CLOUD_RUNTIME_HEARTBEAT',
            agent_id:'cloud-beck',
            observed_at_utc:process.env.NOW,
            github_sha:process.env.EXPECTED_SHA,
            production:{
              cloud_control_url:process.env.EDGE_HEALTH_URL,
              cloud_control_http:Number(process.env.EDGE_CODE),
              cloud_control_function:process.env.EDGE_FUNCTION||null,
              cloud_control_version:process.env.EDGE_VERSION||null,
              cloud_control_ok:process.env.EDGE_OK==='true',
              static_origin_url:process.env.STATIC_ORIGIN_URL,
              static_origin_http:Number(process.env.ORIGIN_CODE),
              static_origin_ok:process.env.ORIGIN_OK==='true',
              truth_oracle_http:Number(process.env.ORACLE_CODE),
              truth_oracle_ok:process.env.ORACLE_OK==='true',
              public_site_url:process.env.PUBLIC_URL,
              public_site_http:Number(process.env.PUBLIC_SITE_CODE),
              public_site_ok:process.env.PUBLIC_SITE_OK==='true',
              legacy_render_api_url:process.env.LEGACY_RENDER_API_URL,
              legacy_render_api_http:Number(process.env.LEGACY_API_CODE),
              legacy_render_api_is_required:false
            },
            status:process.env.OVERALL==='true'?'CLOUD_HEALTHY':process.env.CORE_OK==='true'?'CLOUD_CONTROL_UP_SURFACE_DEGRADED':'CLOUD_DEGRADED',
            local_accelerator:{status:'NOT_CONNECTED',note:'Local heartbeat requires authenticated ingestion; absence is not treated as local health.'},
            revenue:{claimed_nzd:0,status:'NOT_ASSERTED_BY_HEARTBEAT'},
            side_effects:{public_posts:false,checkout_attempts:false,deploy_triggered:false}
          };
          fs.writeFileSync('proof/beck/latest-cloud-heartbeat.json',JSON.stringify(p,null,2)+'\n');
          console.log(JSON.stringify(p,null,2));
          NODE

      - name: Persist hash-linked heartbeat in Supabase
        id: persist_heartbeat
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          # Modern sb_secret_ keys must be sent as apikey only, never as Authorization: Bearer.
          # Prefer the modern secret key; fall back to legacy service_role JWT only if absent.
          SUPABASE_KEY="${SUPABASE_SECRET_KEY:-}"
          if [ -z "$SUPABASE_KEY" ]; then
            SUPABASE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-}"
          fi
          test -n "$SUPABASE_KEY"
          auth_headers=(-H "apikey: $SUPABASE_KEY")
          if [[ "$SUPABASE_KEY" != sb_secret_* ]]; then
            auth_headers+=(-H "Authorization: Bearer $SUPABASE_KEY")
          fi
          base="${SUPABASE_URL%/}"
          agent='cloud-beck'
          previous='GENESIS'
          seq=1
          code="$(curl -sS --max-time 20 -o /tmp/previous.json -w '%{http_code}' \
            "${auth_headers[@]}" \
            "$base/rest/v1/cortex_heartbeat?select=seq,current_hash&agent_id=eq.cloud-beck&order=seq.desc&limit=1" || true)"
          if [ "$code" = "200" ]; then
            read -r seq previous < <(node -e 'const x=require("/tmp/previous.json");if(x.length){console.log(Number(x[0].seq)+1,x[0].current_hash||"GENESIS")}else console.log(1,"GENESIS")')
          else
            echo "Supabase heartbeat read failed: HTTP $code"
            cat /tmp/previous.json || true
            exit 1
          fi
          export HB_SEQ="$seq" HB_PREVIOUS="$previous" HB_AGENT="$agent"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const p=JSON.parse(fs.readFileSync('proof/beck/latest-cloud-heartbeat.json','utf8'));
          const canonical={
            agent_id:process.env.HB_AGENT,
            heartbeat_id:'cloud-beck-'+p.observed_at_utc.replace(/[^0-9A-Za-z]/g,'')+'-'+process.env.GITHUB_RUN_ID,
            ts:p.observed_at_utc,
            seq:Number(process.env.HB_SEQ),
            probes:p,
            policy:{source:'github-actions',workflow:'beck-cloud-truth-heartbeat',main_sha:process.env.GITHUB_SHA,public_actions_allowed:false,financial_actions_allowed:false},
            escalation:{status:p.status,local_accelerator:p.local_accelerator.status},
            autonomy_level:'A1_SCHEDULED',
            previous_hash:process.env.HB_PREVIOUS
          };
          const hash=crypto.createHash('sha256').update(JSON.stringify(canonical)).digest('hex');
          canonical.current_hash=hash;
          fs.writeFileSync('proof/beck/latest-cloud-heartbeat-row.json',JSON.stringify(canonical,null,2)+'\n');
          NODE
          insert_code="$(curl -sS --max-time 30 -o /tmp/insert.json -w '%{http_code}' \
            -X POST "$base/rest/v1/cortex_heartbeat" \
            "${auth_headers[@]}" \
            -H 'Content-Type: application/json' -H 'Prefer: return=representation' \
            --data-binary @proof/beck/latest-cloud-heartbeat-row.json || true)"
          if [ "$insert_code" != "201" ] && [ "$insert_code" != "200" ]; then
            echo "Supabase heartbeat insert failed: HTTP $insert_code"
            cat /tmp/insert.json || true
            exit 1
          fi
          heartbeat_id="$(node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("proof/beck/latest-cloud-heartbeat-row.json","utf8"));process.stdout.write(p.heartbeat_id)')"
          readback_code="$(curl -sS --max-time 30 -o /tmp/readback.json -w '%{http_code}' \
            "${auth_headers[@]}" \
            "$base/rest/v1/cortex_heartbeat?select=heartbeat_id,seq,current_hash,previous_hash&heartbeat_id=eq.$heartbeat_id&limit=1" || true)"
          if [ "$readback_code" != "200" ]; then
            echo "Supabase heartbeat read-back failed: HTTP $readback_code"
            cat /tmp/readback.json || true
            exit 1
          fi
          node <<'NODE'
          const fs=require('fs');
          const wanted=JSON.parse(fs.readFileSync('proof/beck/latest-cloud-heartbeat-row.json','utf8'));
          const rows=JSON.parse(fs.readFileSync('/tmp/readback.json','utf8'));
          if(!Array.isArray(rows)||rows.length!==1) {
            console.error('Heartbeat read-back did not return exactly one row');
            process.exit(1);
          }
          const got=rows[0];
          for(const k of ['heartbeat_id','seq','current_hash','previous_hash']) {
            if(String(got[k])!==String(wanted[k])) {
              console.error('Heartbeat read-back mismatch for '+k);
              process.exit(1);
            }
          }
          const out={schema:'BECK-CLOUD-PERSISTENCE/v1',persisted:true,readback_verified:true,agent_id:wanted.agent_id,seq:wanted.seq,heartbeat_id:wanted.heartbeat_id,current_hash:wanted.current_hash,previous_hash:wanted.previous_hash,readback_row:got};
          fs.writeFileSync('proof/beck/latest-cloud-persistence.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({persisted:out.persisted,readback_verified:out.readback_verified,agent_id:out.agent_id,seq:out.seq,heartbeat_id:out.heartbeat_id,current_hash:out.current_hash},null,2));
          NODE

      - name: Record heartbeat persistence outcome
        if: always()
        env:
          PERSISTENCE_OUTCOME: ${{ steps.persist_heartbeat.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/beck
          export PERSISTENCE_OUTCOME
          node <<'NODE'
          const fs=require('fs');
          const path='proof/beck/latest-cloud-heartbeat.json';
          let p={schema:'BECK-CLOUD-HEARTBEAT/v1',proof_type:'CLOUD_RUNTIME_HEARTBEAT',agent_id:'cloud-beck',status:'CLOUD_DEGRADED'};
          try { p=JSON.parse(fs.readFileSync(path,'utf8')); } catch {}
          const outcome=process.env.PERSISTENCE_OUTCOME||'unknown';
          const persistencePath='proof/beck/latest-cloud-persistence.json';
          let prior={};
          try { prior=JSON.parse(fs.readFileSync(persistencePath,'utf8')); } catch {}
          const readbackVerified=prior.readback_verified===true;
          const persisted=outcome==='success' && readbackVerified;
          p.database_persistence={status:persisted?'PERSISTED_AND_READ_BACK':'FAILED_OR_UNVERIFIED',workflow_step_outcome:outcome,readback_verified:readbackVerified};
          if(!persisted) p.status='CLOUD_DEGRADED';
          p.observed_at_utc=p.observed_at_utc||new Date().toISOString();
          fs.writeFileSync(path,JSON.stringify(p,null,2)+'\n');
          const record={...prior,schema:'BECK-CLOUD-PERSISTENCE/v1',persisted,readback_verified:readbackVerified,workflow_step_outcome:outcome,agent_id:p.agent_id,observed_at_utc:p.observed_at_utc};
          fs.writeFileSync(persistencePath,JSON.stringify(record,null,2)+'\n');
          console.log(JSON.stringify({schema:record.schema,persisted:record.persisted,readback_verified:record.readback_verified,workflow_step_outcome:record.workflow_step_outcome,agent_id:record.agent_id,observed_at_utc:record.observed_at_utc},null,2));
          NODE

      - name: Require live control plane, public surface, and database read-back
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s proof/beck/latest-cloud-heartbeat.json
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('proof/beck/latest-cloud-heartbeat.json','utf8'));
          const persisted=p.database_persistence?.persisted===true;
          const readback=p.database_persistence?.readback_verified===true;
          const control=p.production?.cloud_control_ok===true;
          const staticOrigin=p.production?.static_origin_ok===true;
          const truthOracle=p.production?.truth_oracle_ok===true;
          const publicSite=p.production?.public_site_ok===true;
          const gates={control,staticOrigin,truthOracle,publicSite,persisted,readback};
          console.log(JSON.stringify({schema:'BECK-CLOUD-ACCEPTANCE/v1',status:Object.values(gates).every(Boolean)?'PASS':'BLOCKED',gates},null,2));
          if(!Object.values(gates).every(Boolean)) process.exit(1);
          NODE

      - name: Upload cloud proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beck-cloud-heartbeat-${{ github.run_id }}
          path: proof/beck
          if-no-files-found: error
          retention-days: 90
