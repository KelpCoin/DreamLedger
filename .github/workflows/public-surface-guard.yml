name: Public Surface Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Render public/private topology
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'type: web' render.yaml
          grep -q 'rootDir: public' render.yaml
          grep -q 'type: pserv' render.yaml
          grep -q 'rootDir: BEC-PRIME' render.yaml
          echo 'PASS: public web service and private factory service are both declared.'

      - name: Scan customer-facing public assets
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/billboard.html
          test -f public/server.js
          internal_pattern='Gauntlet|Economic Court|Trust Engine|ELOHIM|BrownEye Cortex|BEC-PRIME|Dream Ledger Deck|conversations is not defined|AMPLISSA|COLLECTORSCOAST'
          confidential_pattern='sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+|BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY'
          internal_found=0
          confidential_found=0
          while IFS= read -r -d '' file; do
            if grep -Eiq -- "$confidential_pattern" "$file"; then
              echo "CONFIDENTIAL: $file"
              confidential_found=1
            elif grep -Eiq -- "$internal_pattern" "$file"; then
              echo "INTERNAL: $file (skipped by taxonomy)"
              internal_found=1
            else
              echo "PUBLIC: $file"
            fi
          done < <(find public -type f \( -name '*.html' -o -name '*.css' -o -name '*.txt' \) -print0)
          if [ "$confidential_found" -ne 0 ]; then
            echo 'FAIL: confidential material found in customer-facing public assets.'
            exit 1
          fi
          echo "PASS: public-surface taxonomy classified assets. INTERNAL findings are non-fatal; CONFIDENTIAL findings are fatal."

      - name: Verify public server exposes only approved API routes
        shell: bash
        run: |
          set -euo pipefail
          grep -q "'GET /api/molt-beach-inventory':true" public/server.js
          grep -q "'GET /api/products':true" public/server.js
          grep -q "'POST /api/billboard/submit':true" public/server.js
          grep -q "if(!ALLOWED_API\[key\])" public/server.js
          echo 'PASS: public API allowlist is explicit.'

      - name: Check for obvious credential literals
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -Eiq --include='*.html' --include='*.js' --include='*.css' --include='*.json' 'sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+|BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY' public; then
            echo 'FAIL: credential-like literal found in public assets.'
            exit 1
          fi
          echo 'PASS: no obvious secret material found in public assets.'

# Public machine manifests are intentionally public API metadata. Customer-facing language remains scanned separately.
# Credential scans intentionally match secret-value formats, not STRIPE_* environment-variable names.
