name: Public Surface Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Render public/private topology
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'type: web' render.yaml
          grep -q 'rootDir: public' render.yaml
          grep -q 'type: pserv' render.yaml
          grep -q 'rootDir: BEC-PRIME' render.yaml
          echo 'PASS: public web service and private factory service are both declared.'

      - name: Scan every public text asset
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/billboard.html
          test -f public/server.js
          if grep -R -Eiq --include='*.html' --include='*.js' --include='*.css' --include='*.json' --include='*.txt' 'Gauntlet|Economic Court|Trust Engine|ELOHIM|BrownEye Cortex|BEC-PRIME|Dream Ledger Deck|conversations is not defined|AMPLISSA|COLLECTORSCOAST|SUPABASE_SERVICE_ROLE_KEY|sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+' public; then
            echo 'FAIL: prohibited internal, confidential, or inactive product language or credential material found in public assets.'
            exit 1
          fi
          echo 'PASS: public assets contain no prohibited internal/confidential language or credential material.'

      - name: Verify public server exposes only approved API routes
        shell: bash
        run: |
          set -euo pipefail
          grep -q "'GET /api/molt-beach-inventory':true" public/server.js
          grep -q "'GET /api/products':true" public/server.js
          grep -q "'POST /api/billboard/submit':true" public/server.js
          grep -q "if(!ALLOWED_API\[key\])" public/server.js
          echo 'PASS: public API allowlist is explicit.'

      - name: Check for obvious credential literals
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -Eiq --include='*.html' --include='*.js' --include='*.css' --include='*.json' 'sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+|BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY' public; then
            echo 'FAIL: credential-like literal found in public assets.'
            exit 1
          fi
          echo 'PASS: no obvious secret material found in public assets.'
