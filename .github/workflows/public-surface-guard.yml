name: Public Surface Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Vercel public/static and private API topology
        shell: bash
        run: |
          set -euo pipefail
          test -f vercel.json
          test -f 'api/[...route].ts'
          node - <<'NODE'
          const v=require('./vercel.json');
          if(v.outputDirectory!=='public') process.exit(1);
          if(v.git?.deploymentEnabled!==false) process.exit(1);
          if(v.regions?.[0]!=='syd1') process.exit(1);
          if(v.rewrites?.some(x=>/^https?:/.test(x.destination||''))) process.exit(1);
          NODE
          echo 'PASS: Vercel serves public output and exact routed serverless API.'

      - name: Scan customer-facing public assets
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/billboard.html
          test -f public/server.js
          tmp=$(mktemp)
          find public -type f \( -name '*.html' -o -name '*.css' -o -name '*.txt' \) -print0 | while IFS= read -r -d '' f; do
            case "$f" in
              *.html) sed -E 's#<script[^>]*>.*</script>##g; s#<style[^>]*>.*</style>##g' "$f" >> "$tmp" ;;
              *) cat "$f" >> "$tmp" ;;
            esac
          done
          if grep -Eiq 'Economic Court|Trust Engine|ELOHIM|BrownEye Cortex|BEC-PRIME|Dream Ledger Deck|conversations is not defined|AMPLISSA|COLLECTORSCOAST|SUPABASE_SERVICE_ROLE_KEY|sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+' "$tmp"; then
            echo 'FAIL: prohibited internal, confidential, or inactive product language or credential material found in customer-facing public assets.'
            echo 'MATCHING_PUBLIC_ASSETS:'
            while IFS= read -r f; do
              if grep -Eiq 'Economic Court|Trust Engine|ELOHIM|BrownEye Cortex|BEC-PRIME|Dream Ledger Deck|conversations is not defined|AMPLISSA|COLLECTORSCOAST|SUPABASE_SERVICE_ROLE_KEY|sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+' "$f"; then echo "$f"; fi
            done < <(find public -type f \( -name '*.html' -o -name '*.css' -o -name '*.txt' \))
            rm -f "$tmp"
            exit 1
          fi
          rm -f "$tmp"
          echo 'PASS: customer-facing HTML/CSS/text assets contain no prohibited internal/confidential language or credential material.'

      - name: Verify Vercel API dispatcher blocks unapproved paths
        shell: bash
        run: |
          set -euo pipefail
          route='api/[...route].ts'
          grep -q 'API_ROUTE_NOT_FOUND' "$route"
          grep -q 'const routes: Record<string, Route>' "$route"
          grep -q 'bodyParser: false' "$route"
          grep -q '/api/cube/marketplace' "$route"
          grep -q 'rawBody(req' "$route"
          grep -q 'new Request(url.toString(), input)' "$route"
          grep -q 'return fail(res, 404' "$route"
          node --check handlers/cube/marketplace.js
          echo 'PASS: Vercel API is explicit allowlist; unknown routes fail closed.'

      - name: Check for obvious credential literals
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -Eiq --include='*.html' --include='*.js' --include='*.css' --include='*.json' 'sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+|BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY' public; then
            echo 'FAIL: credential-like literal found in public assets.'
            exit 1
          fi
          echo 'PASS: no obvious secret material found in public assets.'

# Public machine manifests are intentionally public API metadata. Customer-facing language remains scanned separately. Gauntlet is an approved public service name; internal implementation names remain blocked.
# Credential scans intentionally match secret-value formats, not STRIPE_* environment-variable names.
