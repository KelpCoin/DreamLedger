name: Economic Production Observation Contract

concurrency:
  group: dreamledger-economic-production-observation-contract.yml-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'runtime/economic/**'
      - '.github/workflows/economic-production-observation-contract.yml'
  pull_request:
    paths:
      - 'runtime/economic/**'
      - '.github/workflows/economic-production-observation-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify observation contracts
        working-directory: runtime/economic
        run: |
          python3 -m py_compile *.py
          python3 test_production_observation_probe.py
          python3 test_event_projection.py
          python3 test_state_transition_engine.py
          python3 test_stripe_observation_adapter.py
