name: Kelphaven Marketplace Contract
on:
  pull_request:
    paths:
      - 'BEC-PRIME/commerce/kelphaven-marketplace-contract.*'
      - 'docs/KELPHAVEN-B2B-A2A-MARKETPLACE-CONTRACT.md'
      - '.github/workflows/kelphaven-marketplace-contract.yml'
  push:
    branches:
      - main
      - 'beck/kelphaven-b2b-a2a-marketplace-20261020'
    paths:
      - 'BEC-PRIME/commerce/kelphaven-marketplace-contract.*'
      - 'docs/KELPHAVEN-B2B-A2A-MARKETPLACE-CONTRACT.md'
      - '.github/workflows/kelphaven-marketplace-contract.yml'
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Kelphaven marketplace contract tests
        run: node --test BEC-PRIME/commerce/kelphaven-marketplace-contract.test.mjs