name: BrownEye Economic Fulfillment Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "workers/economic/**"
      - ".github/workflows/economic-fulfillment-worker.yml"

permissions:
  contents: read

concurrency:
  group: brown-eye-economic-fulfillment-worker
  cancel-in-progress: false

jobs:
  fulfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Public project URL is configuration, not a secret.
      SUPABASE_URL: https://wbwgroygjeyukkspnqiy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BEC_WORKER_ID: github-economic-fulfillment
      BEC_JOB_LEASE_SECONDS: "1200"
      BEC_ONCE: "1"
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
      ACNC_APOLLO_REVEAL_PHONE: ${{ secrets.ACNC_APOLLO_REVEAL_PHONE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF extraction dependency
        run: python -m pip install --disable-pip-version-check --no-input pypdf==6.19.0
      - name: Verify worker syntax
        run: python -m py_compile workers/economic/economic_fulfillment_worker.py
      - name: Run ACNC fulfillment unit tests
        run: python -m unittest discover -s workers/economic -p "test_*.py"
      - name: Run one economic fulfillment lease
        run: python workers/economic/economic_fulfillment_worker.py
      - name: Test optional Neon worker safety contract (no credentials)
        run: python -m unittest discover -s workers/economic -p "test_neon_outbox_worker.py" -v
      - name: Install optional Neon driver only after operator enablement
        if: vars.BECK_NEON_COMMERCE_ENABLED == '1'
        run: python -m pip install --disable-pip-version-check --no-input 'psycopg[binary]==3.2.10'
      - name: Run optional silo-fenced Neon worker
        if: vars.BECK_NEON_COMMERCE_ENABLED == '1'
        env:
          BECK_NEON_COMMERCE_ENABLED: '1'
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BECK_DELIVERY_ALLOWED_HOST: ${{ vars.BECK_DELIVERY_ALLOWED_HOST }}
          BECK_DELIVERY_ALLOWED_SILO: ${{ vars.BECK_DELIVERY_ALLOWED_SILO }}
          BECK_DELIVERY_ADAPTER_URL: ${{ vars.BECK_DELIVERY_ADAPTER_URL }}
          BECK_DELIVERY_ADAPTER_TOKEN: ${{ secrets.BECK_DELIVERY_ADAPTER_TOKEN }}
          BECK_DELIVERY_IDEMPOTENCY_CONTRACT: ${{ vars.BECK_DELIVERY_IDEMPOTENCY_CONTRACT }}
        run: python workers/economic/neon_outbox_worker.py
      - name: Record worker heartbeat
        run: echo "Economic fulfillment cycle complete. Discovery is not fulfillment and fulfillment is not revenue."
