name: Shared Silo Auction Contract

on:
  pull_request:
    paths:
      - 'api/auctions.js'
      - 'supabase/migrations/20261021120000_shared_silo_auction_kernel.sql'
      - 'docs/SHARED-SILO-AUCTION-KERNEL.md'
      - 'scripts/validate_shared_silo_auction.py'
      - '.github/workflows/shared-silo-auction-contract.yml'
  push:
    branches: [main]
    paths:
      - 'api/auctions.js'
      - 'supabase/migrations/20261021120000_shared_silo_auction_kernel.sql'
      - 'docs/SHARED-SILO-AUCTION-KERNEL.md'
      - 'scripts/validate_shared_silo_auction.py'
      - '.github/workflows/shared-silo-auction-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate shared auction contract
        run: python scripts/validate_shared_silo_auction.py
      - name: Syntax-check API adapter
        run: node --check api/auctions.js
