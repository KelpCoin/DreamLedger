name: CUBE overnight radar

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cube-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CUBE_REDDIT_SUBREDDITS: ${{ vars.CUBE_REDDIT_SUBREDDITS }}
      CUBE_SUBSTACK_FEEDS: ${{ vars.CUBE_SUBSTACK_FEEDS }}
      CUBE_MAX_ITEMS_PER_FEED: "25"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Validate radar secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Run public-feed ingestion
        run: python3 ops/demand/ingest-public-feeds.py
      - name: Resolve silo-mechanism matches
        run: python3 ops/cube/resolve-mechanisms.py
