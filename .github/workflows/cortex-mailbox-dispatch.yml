name: Cortex Mailbox Dispatch

on:
  workflow_dispatch:
    inputs:
      objective:
        description: Allowlisted local Cortex objective
        required: true
        type: choice
        options:
          - ecosystem.verify
          - redteam.meta
          - cortex.manifest_probe
      input_json:
        description: Optional JSON input object
        required: false
        default: '{}'
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cortex-mailbox-dispatch-local
      cancel-in-progress: false
    steps:
      - name: Validate input and enqueue work-ledger task
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OBJECTIVE: ${{ inputs.objective }}
          INPUT_JSON: ${{ inputs.input_json }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"
          python - <<'PY'
          import json, os, uuid
          from datetime import datetime, timezone
          allowed = {'ecosystem.verify','redteam.meta','cortex.manifest_probe'}
          objective = os.environ['OBJECTIVE']
          if objective not in allowed:
              raise SystemExit('objective is not allowlisted')
          payload = json.loads(os.environ.get('INPUT_JSON') or '{}')
          if not isinstance(payload, dict):
              raise SystemExit('input_json must be an object')
          row = {
              'run_id': str(uuid.uuid4()),
              'role': 'executor',
              'tier': 'local',
              'objective': objective,
              'input': payload,
              'required_output_schema': 'dreamledger/local-worker-result/v2',
              'timeout_seconds': 300,
              'max_turns': 10,
              'max_tool_calls': 20,
              'status': 'queued',
              'created_at': datetime.now(timezone.utc).isoformat(),
              'retry_policy_json': {'max_attempts': 3, 'backoff_seconds': [1,4,16]}
          }
          with open('task.json','w',encoding='utf-8') as f:
              json.dump(row,f,sort_keys=True,separators=(',',':'))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/rest/v1/orchestrator_tasks" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            -H 'Content-Type: application/json' \
            -H 'Prefer: return=minimal' \
            --data-binary @task.json
          rm -f task.json
