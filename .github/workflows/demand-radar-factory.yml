name: Demand Radar + Silo Factory

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: demand-radar-factory
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run demand radar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAX_ACTIVE_SILOS: '12'
        run: python3 ops/demand/demand_radar.py

      - name: Publish radar and generated probes
        run: |
          git config user.name 'dreamledger-demand-radar[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/demand/latest.json public/silos
          if git diff --cached --quiet; then
            echo 'No demand or silo changes.'
            exit 0
          fi
          git commit -m 'chore: refresh demand radar and silo probes'
          git push
