name: Surface Deploy Gate

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'render.yaml'
      - '.github/workflows/surface-deploy-gate.yml'
      - '.e0-render-trigger*'
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: surface-deploy-gate
  cancel-in-progress: true

env:
  BASE_URL: https://dreamledger.org
  RENDER_SERVICE_ID: srv-d8ud55lckfvc73f1t4eg
  FOUNDING_PAYMENT_LINK: https://buy.stripe.com/dRmbJ2cZi9eW4mk9La9oc02

jobs:
  gate:
    name: Converge and verify commercial surface
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Record expected SHA
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "expected_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p proof/surface-gate

      - name: Probe live baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local path="$1" out="$2"
            local code
            code="$(curl -sS -o "$out" -w '%{http_code}' --max-time 30 "$BASE_URL$path" || true)"
            echo "$code"
          }
          health="$(probe /healthz proof/surface-gate/health.txt)"
          version_code="$(probe /version proof/surface-gate/version.json)"
          billboard="$(probe /billboard proof/surface-gate/billboard.html)"
          mtg="$(probe /mtg proof/surface-gate/mtg.html)"
          home="$(probe / proof/surface-gate/home.html)"
          checkout="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$FOUNDING_PAYMENT_LINK" || true)"

          live_sha=''
          if [ "$version_code" = '200' ]; then
            live_sha="$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("proof/surface-gate/version.json","utf8")); process.stdout.write(String(j.commit||""))' 2>/dev/null || true)"
          fi

          echo "health=$health" | tee proof/surface-gate/baseline.txt
          echo "version_http=$version_code" | tee -a proof/surface-gate/baseline.txt
          echo "live_sha=$live_sha" | tee -a proof/surface-gate/baseline.txt
          echo "billboard=$billboard" | tee -a proof/surface-gate/baseline.txt
          echo "mtg=$mtg" | tee -a proof/surface-gate/baseline.txt
          echo "home=$home" | tee -a proof/surface-gate/baseline.txt
          echo "checkout=$checkout" | tee -a proof/surface-gate/baseline.txt

          echo "live_sha=$live_sha" >> "$GITHUB_OUTPUT"
          echo "billboard=$billboard" >> "$GITHUB_OUTPUT"
          echo "mtg=$mtg" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy when drifted or doorways broken
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          EXPECTED_SHA: ${{ steps.meta.outputs.expected_sha }}
          LIVE_SHA: ${{ steps.baseline.outputs.live_sha }}
          BILLBOARD: ${{ steps.baseline.outputs.billboard }}
          MTG: ${{ steps.baseline.outputs.mtg }}
        shell: bash
        run: |
          set -euo pipefail
          need_deploy=false
          if [ "$LIVE_SHA" != "$EXPECTED_SHA" ]; then need_deploy=true; fi
          if [ "$BILLBOARD" != '200' ] || [ "$MTG" != '200' ]; then need_deploy=true; fi

          if [ "$need_deploy" != 'true' ]; then
            echo 'No deploy required.'
            echo 'triggered=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo 'RENDER_API_KEY missing — cannot self-heal. Manual Render redeploy required.'
            echo 'triggered=false' | tee proof/surface-gate/deploy-status.txt
            exit 0
          fi

          echo "Triggering Render deploy for $EXPECTED_SHA"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"commitId\":\"$EXPECTED_SHA\",\"clearCache\":\"clear\"}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            | tee proof/surface-gate/render-deploy-response.json
          echo 'triggered=true' | tee proof/surface-gate/deploy-status.txt

      - name: Wait for SHA convergence and doorway recovery
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.meta.outputs.expected_sha }}
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 36); do
            echo "Attempt $attempt/36"
            version_payload="$(curl -sS --max-time 30 -w '\n%{http_code}' "$BASE_URL/version" || true)"
            version_http="$(printf '%s\n' "$version_payload" | tail -n1)"
            version_json="$(printf '%s\n' "$version_payload" | sed '$d')"
            live_sha=''
            if [ "$version_http" = '200' ]; then
              live_sha="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.commit||""))' "$version_json" 2>/dev/null || true)"
            fi
            billboard="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$BASE_URL/billboard" || true)"
            mtg="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$BASE_URL/mtg" || true)"
            home="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$BASE_URL/" || true)"
            health="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$BASE_URL/healthz" || true)"

            echo "live_sha=$live_sha billboard=$billboard mtg=$mtg home=$home health=$health"

            if [ "$live_sha" = "$EXPECTED_SHA" ] && [ "$billboard" = '200' ] && [ "$mtg" = '200' ] && [ "$home" = '200' ] && [ "$health" = '200' ]; then
              ok=true
              break
            fi
            sleep 10
          done

          node -e '
            const fs=require("fs");
            const p={
              proof_type:"SURFACE_DEPLOY_GATE",
              checked_at:new Date().toISOString(),
              expected_main_sha:process.env.EXPECTED_SHA,
              converged: process.argv[1]==="true",
              revenue_claimed_nzd:0,
              rules:{
                version_sha_must_match_main:true,
                billboard_must_be_200:true,
                mtg_must_be_200:true,
                health_must_be_200:true,
                no_revenue_from_availability:true
              }
            };
            fs.writeFileSync("proof/surface-gate/result.json", JSON.stringify(p,null,2)+"\n");
            console.log(JSON.stringify(p,null,2));
            if(!p.converged) process.exit(1);
          ' "$ok"

      - name: Open one incident if still red
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="Surface deploy gate red: commercial doorways or SHA drift"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --limit 1 --json number)"
          count="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.length))' "$existing")"
          if [ "$count" != '0' ]; then
            echo 'Incident already open'
            exit 0
          fi
          body="Surface Deploy Gate failed.

Expected main SHA: ${{ steps.meta.outputs.expected_sha }}
Live must serve /billboard and /mtg with HTTP 200.
Live /version commit must equal main.

No revenue is inferred from health or availability.
Manual Render redeploy may be required if RENDER_API_KEY is unset."
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-deploy-gate-${{ github.run_id }}
          path: proof/surface-gate
          if-no-files-found: warn
          retention-days: 30
