name: Commercial CD Gate

on:
  push:
    branches: [main]
    paths:
      - 'CD/**'
      - 'IP/**'
      - 'MARKETS/**'
      - 'SOCIAL/**'
      - 'BEC-PRIME/compiled/website/mtg/**'
      - 'BEC-PRIME/compiled/website/**'
      - 'BEC-PRIME/**'
      - 'commander-diagnostic.html'
      - 'revenue.html'
      - '.github/workflows/commercial-cd.yml'
      - '.github/workflows/release-operator.yml'
      - '.github/workflows/render-deploy.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Request one approval-gated Render production deployment attempt
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  actions: write
  contents: read

concurrency:
  group: dreamledger-commercial-cd
  cancel-in-progress: false

env:
  DEPLOY_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == 'true' }}

jobs:
  release-gate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 50
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify release package
        shell: bash
        run: |
          set -euo pipefail
          test -f CD/RELEASE-PACKAGE.md
          test -f IP/QR/QR-DESTINATION.txt
          test -f MARKETS/MARKET-MATRIX.md
          test -f SOCIAL/SOCIAL-VIRALITY-PLAYBOOK.md

      - name: Dispatch canonical Render release operator
        if: env.DEPLOY_REQUESTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-operator.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f deploy=confirm \
            -f wait_for_result=yes
          echo 'RELEASE_OPERATOR=DISPATCHED'
          echo "RELEASE_SHA=$RELEASE_SHA"

      - name: Locate release operator run
        if: env.DEPLOY_REQUESTED == 'true'
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            run_json=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow release-operator.yml --event workflow_dispatch --limit 20 --json databaseId,headSha,status,createdAt --jq 'sort_by(.createdAt) | reverse | .[0]' || true)
            run_id=$(printf '%s' "$run_json" | jq -r '.databaseId // empty')
            head_sha=$(printf '%s' "$run_json" | jq -r '.headSha // empty')
            if [ -n "$run_id" ] && [ "$head_sha" = "$EXPECTED_SHA" ]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "FOUND_RELEASE_OPERATOR=$run_id"
              exit 0
            fi
            sleep 3
          done
          echo "Could not locate release operator for ${EXPECTED_SHA}."
          exit 1

      - name: Wait for canonical Render release result
        if: env.DEPLOY_REQUESTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "${{ steps.locate.outputs.run_id }}" --repo "${GITHUB_REPOSITORY}" --exit-status
          echo 'RENDER_CD=PASS'

      - name: Emit truthful CD proof
        if: always()
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ "$DEPLOY_REQUESTED" = 'true' ]; then
            status='PASS'
            deployment='RENDER_VERIFIED'
          else
            status='NOT_REQUESTED'
            deployment='NOT_REQUESTED'
          fi
          printf '{"schema":"dreamledger-commercial-cd-v2","status":"%s","commit":"%s","deploy_request":%s,"deployment":"%s","revenue_claim":"NOT_VERIFIED_BY_CD"}\n' "$status" "$RELEASE_SHA" "$([ "$DEPLOY_REQUESTED" = 'true' ] && echo true || echo false)" "$deployment" | tee artifacts/commercial-cd-proof.json

      - name: Upload CD proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: commercial-cd-proof-${{ github.run_id }}
          path: artifacts/commercial-cd-proof.json
          if-no-files-found: error
          retention-days: 30
