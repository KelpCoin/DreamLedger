name: Commercial CD Gate

on:
  push:
    branches: [main]
    paths:
      - 'CD/**'
      - 'IP/**'
      - 'MARKETS/**'
      - 'SOCIAL/**'
      - 'BEC-PRIME/compiled/website/mtg/**'
      - 'BEC-PRIME/compiled/website/**'
      - 'commander-diagnostic.html'
      - 'revenue.html'
      - '.github/workflows/commercial-cd.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Request one approval-gated production deployment attempt
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  actions: write
  contents: read

env:
  VERCEL_TOKEN_PRESENT: ${{ secrets.VERCEL_TOKEN != '' }}

jobs:
  release-gate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify release package
        shell: bash
        run: |
          set -euo pipefail
          test -f CD/RELEASE-PACKAGE.md
          test -f IP/QR/QR-DESTINATION.txt
          test -f MARKETS/MARKET-MATRIX.md
          test -f SOCIAL/SOCIAL-VIRALITY-PLAYBOOK.md

      - name: Fail closed without deployment credential
        if: ${{ inputs.deploy == 'true' && env.VERCEL_TOKEN_PRESENT != 'true' }}
        shell: bash
        run: |
          echo 'DEPLOYMENT_BLOCKED=VERCEL_TOKEN_MISSING'
          exit 1

      - name: Dispatch canonical release operator
        if: ${{ inputs.deploy == 'true' && env.VERCEL_TOKEN_PRESENT == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-operator.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f deploy=confirm \
            -f wait_for_result=yes
          echo 'RELEASE_OPERATOR=DISPATCHED'

      - name: Emit CD proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo 'CD_GATE=PASS'
            echo "COMMIT=${GITHUB_SHA}"
            echo "DEPLOY_REQUEST=${{ inputs.deploy || 'false' }}"
            echo "VERCEL_TOKEN_PRESENT=${VERCEL_TOKEN_PRESENT}"
            if [ "${{ inputs.deploy || 'false' }}" = 'true' ]; then
              echo 'RELEASE_OPERATOR=DISPATCHED'
            else
              echo 'RELEASE_OPERATOR=NOT_REQUESTED'
            fi
            echo 'REVENUE_CLAIM=NOT_VERIFIED_BY_CD'
          } | tee artifacts/commercial-cd-proof.txt

      - name: Upload CD proof
        uses: actions/upload-artifact@v4
        with:
          name: commercial-cd-proof-${{ github.run_id }}
          path: artifacts/commercial-cd-proof.txt
          if-no-files-found: error
          retention-days: 30
