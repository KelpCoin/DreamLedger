name: Factory Economic Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: read

concurrency:
  group: dreamledger-factory-economic-cycle
  cancel-in-progress: false

jobs:
  compile-and-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.0.4
        with:
          node-version: '24.14.1'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Compile factory
        run: |
          npm run factory:run
      - name: Verify commercial surfaces
        run: |
          npm run verify:commercial-cell
          npm run verify:agentic-commerce
          npm run verify:evidence-manifest
      - name: Reconcile live approved offers
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_LIVE_ENABLED: 'true'
        run: npm run reconcile:approved-offers
      - name: Upload economic proof
        uses: actions/upload-artifact@v4
        with:
          name: factory-economic-proof
          path: proof/commerce/latest-approved-offer-reconciliation.json
          if-no-files-found: error
          retention-days: 14
