name: E0 Production Proof

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  e0:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run production E0 probe
        shell: bash
        env:
          BASE: https://dreamledger.org
          EXPECTED_SHA: ${{ github.event.repository.default_branch == 'main' && github.sha || '' }}
        run: |
          set -u
          mkdir -p proof
          python3 - <<'PY'
          import json, os, sys, hashlib
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from datetime import datetime, timezone

          base = os.environ['BASE'].rstrip('/')
          expected = os.environ.get('EXPECTED_SHA','')
          result = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'base': base,
              'expected_sha': expected,
              'deployed_sha': None,
              'health_status': None,
              'board_status': None,
              'inventory_status': None,
              'inventory_json': False,
              'e0': False,
              'errors': []
          }

          def get(path):
              req = Request(base + path, headers={'User-Agent':'DreamLedger-E0-Probe/1.0','Accept':'application/json,text/html,*/*'})
              with urlopen(req, timeout=20) as r:
                  return r.status, r.read()

          try:
              status, body = get('/version')
              payload = json.loads(body.decode('utf-8'))
              result['deployed_sha'] = str(payload.get('commit',''))
          except Exception as e:
              result['errors'].append('/version: ' + str(e))

          try:
              result['health_status'], _ = get('/healthz')
          except Exception as e:
              result['errors'].append('/healthz: ' + str(e))

          try:
              result['board_status'], _ = get('/board')
          except Exception as e:
              result['errors'].append('/board: ' + str(e))

          try:
              result['inventory_status'], body = get('/api/molt-beach-inventory')
              json.loads(body.decode('utf-8'))
              result['inventory_json'] = True
          except Exception as e:
              result['errors'].append('/api/molt-beach-inventory: ' + str(e))

          result['e0'] = (
              bool(expected) and
              result['deployed_sha'] == expected and
              result['health_status'] == 200 and
              result['board_status'] == 200 and
              result['inventory_status'] == 200 and
              result['inventory_json']
          )

          raw = json.dumps(result, sort_keys=True, separators=(',',':')).encode()
          result['proof_hash'] = hashlib.sha256(raw).hexdigest()
          with open('proof/E0-PROBE.json','w',encoding='utf-8') as f:
              json.dump(result,f,indent=2)
              f.write('\n')
          print(json.dumps(result, indent=2))
          if not result['e0']:
              sys.exit(1)
          PY

      - name: Upload E0 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E0-PROBE-${{ github.run_id }}
          path: proof/E0-PROBE.json
          if-no-files-found: error
          retention-days: 90
