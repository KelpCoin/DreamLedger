name: E0 Production Proof

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  e0:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run production E0 probe
        shell: bash
        env:
          BASE: https://dreamledger.org
          EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          set -u
          mkdir -p proof
          python3 - <<'PY'
          import json, os, sys, hashlib
          from urllib.request import Request, urlopen
          from datetime import datetime, timezone

          base = os.environ['BASE'].rstrip('/')
          expected = os.environ.get('EXPECTED_SHA','')
          result = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'base': base,
              'expected_sha': expected,
              'deployed_sha': None,
              'surface': None,
              'health_status': None,
              'catalogue_status': None,
              'catalogue_json': False,
              'homepage_status': None,
              'homepage_catalogue': False,
              'e0': False,
              'errors': []
          }

          def get(path):
              req = Request(base + path, headers={'User-Agent':'DreamLedger-E0-Probe/2.0','Accept':'application/json,text/html,*/*'})
              with urlopen(req, timeout=20) as r:
                  return r.status, r.read()

          try:
              status, body = get('/version')
              payload = json.loads(body.decode('utf-8'))
              result['deployed_sha'] = str(payload.get('commit',''))
              result['surface'] = str(payload.get('surface',''))
          except Exception as e:
              result['errors'].append('/version: ' + str(e))

          try:
              result['health_status'], _ = get('/healthz')
          except Exception as e:
              result['errors'].append('/healthz: ' + str(e))

          try:
              result['catalogue_status'], body = get('/api/products')
              payload = json.loads(body.decode('utf-8'))
              result['catalogue_json'] = isinstance(payload, dict) and isinstance(payload.get('products'), list)
          except Exception as e:
              result['errors'].append('/api/products: ' + str(e))

          try:
              result['homepage_status'], body = get('/')
              text = body.decode('utf-8', 'replace')
              result['homepage_catalogue'] = (
                  'FIND SOMETHING' in text and
                  'GOOD.' in text and
                  'DreamMee' in text and
                  'Swipe sideways' in text and
                  'Pioneer product' in text
              )
          except Exception as e:
              result['errors'].append('/: ' + str(e))

          result['e0'] = (
              (
                  not expected or
                  result['deployed_sha'] == expected
              ) and
              result['deployed_sha'] not in ('', 'unknown', 'None') and
              result['health_status'] == 200 and
              result['surface'] == 'public-v5' and
              result['catalogue_status'] == 200 and
              result['catalogue_json'] and
              result['homepage_status'] == 200 and
              result['homepage_catalogue']
          )

          raw = json.dumps(result, sort_keys=True, separators=(',',':')).encode()
          result['proof_hash'] = hashlib.sha256(raw).hexdigest()
          with open('proof/E0-PROBE.json','w',encoding='utf-8') as f:
              json.dump(result,f,indent=2)
              f.write('\n')
          print(json.dumps(result, indent=2))
          if not result['e0']:
              sys.exit(1)
          PY

      - name: Upload E0 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E0-PROBE-${{ github.run_id }}
          path: proof/E0-PROBE.json
          if-no-files-found: error
          retention-days: 90
