name: E0 Production Proof

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  e0:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run production E0 probe
        shell: bash
        env:
          BASE: https://dreamledger.org
          EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          set -u
          mkdir -p proof
          python3 - <<'PY'
          import hashlib,json,os,sys
          from datetime import datetime,timezone
          from urllib.request import Request,urlopen
          base=os.environ['BASE'].rstrip('/')
          expected=os.environ.get('EXPECTED_SHA','')
          r={'checked_at':datetime.now(timezone.utc).isoformat(),'base':base,'expected_sha':expected,'deployed_sha':None,'surface':None,'health_status':None,'catalogue_status':None,'catalogue_json':False,'homepage_status':None,'homepage_contract':False,'sitemap_status':None,'sitemap_xml':False,'robots_status':None,'robots_contract':False,'e0':False,'errors':[]}
          def get(p):
            q=Request(base+p,headers={'User-Agent':'DreamLedger-E0-Probe/4.0','Accept':'application/json,text/html,application/xml,*/*'})
            with urlopen(q,timeout=20) as x:return x.status,x.read()
          try:
            s,b=get('/version');p=json.loads(b.decode());r['deployed_sha']=str(p.get('commit',''));r['surface']=str(p.get('surface',''))
          except Exception as e:r['errors'].append('/version: '+str(e))
          try:r['health_status'],_=get('/healthz')
          except Exception as e:r['errors'].append('/healthz: '+str(e))
          try:
            r['catalogue_status'],b=get('/api/products');p=json.loads(b.decode());r['catalogue_json']=isinstance(p,dict) and isinstance(p.get('products'),list)
          except Exception as e:r['errors'].append('/api/products: '+str(e))
          try:
            r['homepage_status'],b=get('/');t=b.decode('utf-8','replace');need=['DISCOVER','THINGS','WORTH BUYING','Digital products','Magic & collectibles','Games & experiments','Digital media','Evidence before hype'];r['homepage_contract']=all(x in t for x in need)
          except Exception as e:r['errors'].append('/: '+str(e))
          try:
            r['sitemap_status'],b=get('/sitemap.xml');t=b.decode('utf-8','replace');r['sitemap_xml']=t.lstrip().startswith('<?xml') and '<urlset' in t and 'https://dreamledger.org/' in t
          except Exception as e:r['errors'].append('/sitemap.xml: '+str(e))
          try:
            r['robots_status'],b=get('/robots.txt');r['robots_contract']='Sitemap: https://dreamledger.org/sitemap.xml' in b.decode('utf-8','replace')
          except Exception as e:r['errors'].append('/robots.txt: '+str(e))
          r['e0']=((not expected or r['deployed_sha']==expected) and r['deployed_sha'] not in ('','unknown','None') and r['surface']=='public-v6' and r['health_status']==200 and r['catalogue_status']==200 and r['catalogue_json'] and r['homepage_status']==200 and r['homepage_contract'] and r['sitemap_status']==200 and r['sitemap_xml'] and r['robots_status']==200 and r['robots_contract'])
          raw=json.dumps(r,sort_keys=True,separators=(',',':')).encode();r['proof_hash']=hashlib.sha256(raw).hexdigest()
          with open('proof/E0-PROBE.json','w',encoding='utf-8') as f:json.dump(r,f,indent=2);f.write('\n')
          print(json.dumps(r,indent=2));sys.exit(0 if r['e0'] else 1)
          PY
      - name: Upload E0 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E0-PROBE-${{ github.run_id }}
          path: proof/E0-PROBE.json
          if-no-files-found: error
          retention-days: 90
