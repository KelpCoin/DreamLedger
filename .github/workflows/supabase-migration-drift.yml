name: Supabase Migration Drift Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migration-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-drift:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: wbwgroygjeyukkspnqiy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        shell: bash
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Check migration drift
        shell: bash
        run: |
          set -euo pipefail
          diff="$(supabase db diff --linked)"
          if [ -n "$diff" ]; then
            printf '%s\n' "$diff"
            echo 'SUPABASE_SCHEMA_DRIFT=DETECTED'
            exit 1
          fi
          echo 'SUPABASE_SCHEMA_DRIFT=CLEAN'
