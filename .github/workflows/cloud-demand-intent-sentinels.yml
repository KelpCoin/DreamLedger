name: Cloud Demand + Intent Sentinels

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours — cloud, PC-independent
    - cron: '0 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'BEC-PRIME/sentinels/**'
      - '.github/workflows/cloud-demand-intent-sentinels.yml'

permissions:
  contents: read

concurrency:
  group: cloud-demand-intent-sentinels
  cancel-in-progress: true

jobs:
  probe-and-write:
    name: Probe live rails + write GitHub reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run cloud demand and intent sentinels
        env:
          LIVE_URL: https://dreamledger.org
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node BEC-PRIME/sentinels/cloud_sentinel_run.mjs

      - name: Scan global public trend feeds
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node BEC-PRIME/sentinels/trend_sentinel_run.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-sentinel-${{ github.run_id }}
          path: |
            AGENT_BUS/sentinel-reports/
            ops/demand/latest-cloud.json
            ops/demand/latest-trends.json
          if-no-files-found: error
          retention-days: 60

