name: BECK Dual-Owner Creator Neon Intake (private proof)

on:
  pull_request:
    branches: [main]
    paths:
      - 'handlers/agentbridge/cosmetic-*'
      - 'ops/dreammeez/neon_creator_*'
      - 'api/[...route].ts'
      - 'public/creator-studio.html'
      - 'package.json'
      - '.github/workflows/peggy-creator-neon-contract.yml'

permissions:
  contents: read

concurrency:
  group: beck-creator-intake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  creator-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: becko_ci
          POSTGRES_PASSWORD: becko_ci_only
          POSTGRES_DB: becko_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U becko_ci -d becko_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: becko_ci
      PGPASSWORD: becko_ci_only
      PGDATABASE: becko_ci
      PGCONNECT_TIMEOUT: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test creator authentication, safety and API
        run: |
          node --check handlers/agentbridge/cosmetic-policy.js
          node --check handlers/agentbridge/cosmetic-intake.js
          node --test handlers/agentbridge/cosmetic-policy.test.js handlers/agentbridge/cosmetic-intake.test.js
      - name: Verify production dependency resolves
        run: |
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund --silent
          node -e "require.resolve('@neondatabase/serverless'); console.log('NEON_DRIVER_OK')"
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
      - name: Exercise private creator RPC on disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/creator-neon
          {
            psql -X -v ON_ERROR_STOP=1 -f ops/dreammeez/neon_creator_intake.sql
            psql -X -v ON_ERROR_STOP=1 -f ops/dreammeez/neon_creator_ci_verify.sql
          } 2>&1 | tee proof/creator-neon/sql-integration.txt
          grep -q 'BECK_DUAL_OWNER_CREATOR_NEON=PASS_PRIVATE_DRAFT_ONLY' proof/creator-neon/sql-integration.txt
          sha256sum proof/creator-neon/sql-integration.txt > proof/creator-neon/sql-integration.sha256
          printf 'REAL_CREATOR_ARTWORK=0\nPRODUCTION_NEON_DDL=0\nPUBLIC_ASSETS=0\nPAYMENT_CHANGES=0\n' > proof/creator-neon/boundary.txt
      - name: Retain private test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beck-dual-owner-creator-neon-private-proof-${{ github.run_id }}
          path: proof/creator-neon/
          if-no-files-found: warn
          retention-days: 30
