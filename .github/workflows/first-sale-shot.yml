name: First Sale Shot

on:
  workflow_dispatch:
    inputs:
      OFFER_ID:
        description: "Live offer ID to sell"
        required: false
        default: "EDH_0001"
      EXPECTED_PRICE_NZD:
        description: "Expected price in NZD"
        required: false
        default: "400"

env:
  LIVE_URL: https://dreamledger.org
  OFFER_ID: ${{ inputs.OFFER_ID || 'EDH_0001' }}
  EXPECTED_PRICE_NZD: ${{ inputs.EXPECTED_PRICE_NZD || '400' }}
  CHECKOUT_ENDPOINT: https://dreamledger.org/api/offer-checkout/create

jobs:
  create-one-doorway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live commerce surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          curl --fail --silent --show-error --max-time 90 "$LIVE_URL/healthz" > proof/health.json
          curl --fail --silent --show-error --max-time 90 "$LIVE_URL/api/offers" > proof/offers.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('proof/offers.json', 'utf8'));
          const list = Array.isArray(data) ? data : (Array.isArray(data.offers) ? data.offers : (Array.isArray(data.data) ? data.data : []));
          const id = process.env.OFFER_ID;
          const offer = list.find(o => o.offer_id === id || o.id === id || o.product_id === id || o.sku === id);
          if (!offer) throw new Error(`live offer missing: ${id}`);
          if (offer.checkout_available !== true) throw new Error('checkout_available is false');
          if (Number(offer.price) !== Number(process.env.EXPECTED_PRICE_NZD)) throw new Error(`price is not NZD ${process.env.EXPECTED_PRICE_NZD}`);
          if (String(offer.currency || '').toUpperCase() !== 'NZD') throw new Error('currency is not NZD');
          fs.writeFileSync('proof/selected-offer.json', JSON.stringify(offer, null, 2) + '\n');
          console.log('COMMERCE_GATE=GREEN');
          NODE

      - name: Create exactly one checkout doorway
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 60 -X POST "$CHECKOUT_ENDPOINT" -H 'Content-Type: application/json' --data "{\"offer_id\":\"$OFFER_ID\"}")"
          printf '%s\n' "$response" > proof/checkout.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('proof/checkout.json', 'utf8'));
          const url = data.url || data.checkout_url;
          if (!url || !/^https:\/\/checkout\.stripe\.com\//.test(url)) throw new Error('Stripe Checkout URL not returned');
          fs.writeFileSync('proof/checkout-url.txt', url + '\n');
          console.log(`CHECKOUT_URL=${url.replace(/[^/]+$/, '[session]')}`);
          NODE

      - name: Publish checkout proof to run summary
        shell: bash
        run: |
          echo '## FIRST SALE SHOT' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "${OFFER_ID} live offer verified at NZD ${EXPECTED_PRICE_NZD}." >> "$GITHUB_STEP_SUMMARY"
          echo 'Exactly one Stripe Checkout doorway was requested.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Payment remains UNPROVEN until Stripe reports a paid checkout session.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload payment-gate proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-sale-shot-${{ github.run_id }}
          path: proof/
          if-no-files-found: error
