name: Factory Factory Economic Loop

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      acquisition:
        description: "Execute the already-authorized CMD-DIAG acquisition dispatch"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: dreamledger-factory-factory
  cancel-in-progress: false

jobs:
  compile-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Install dependencies
        run: npm ci

      - name: Compile opportunities and Factory-Factory
        run: |
          npm run compile:opportunities
          npm run compile:factory-factory
          node BEC-PRIME/factory/FactoryFactory.js
          node BEC-PRIME/factory/UniversalFactoryCompiler.js
          npm run compile:factory-approval

      - name: Reconcile approved live offers
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_LIVE_ENABLED: 'true'
        run: npm run reconcile:approved-offers

      - name: Compile machine-native x402 specs
        run: npm run factory:x402

      - name: Upload factory evidence
        uses: actions/upload-artifact@v4
        with:
          name: factory-factory-evidence-${{ github.run_id }}
          path: |
            BEC-PRIME/data/factory-factory/**
            BEC-PRIME/data/x402-factory/**
            proof/commerce/latest-approved-offer-reconciliation.json
          if-no-files-found: warn
          retention-days: 14

      - name: Emit boundary
        run: |
          echo "DISCOVERY=AUTOMATIC"
          echo "COMPILATION=AUTOMATIC"
          echo "CELL_BUILDING=AUTOMATIC"
          echo "EXTERNAL_PUBLICATION=APPROVAL_REQUIRED"
          echo "REVENUE=TRUTH_ORACLE_ONLY"

  authorized-acquisition:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.acquisition == true) || github.event_name == 'schedule' }}
    needs: compile-and-stage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Dispatch authorized CMD-DIAG acquisition
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DISPATCH_TOKEN"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/KelpCoin/DreamLedger/dispatches \
            -d '{"event_type":"approved-acquisition","client_payload":{"offer":"CMD-DIAG-29","target":"configured-discord-acquisition","approval":"APPROVED","source":"Factory-Factory authorized acquisition"}}'
          echo "DISPATCH=ACCEPTED_BY_GITHUB"
          echo "OFFER=CMD-DIAG-29"
          echo "REVENUE=UNVERIFIED"
