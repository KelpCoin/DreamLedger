name: Factory Factory Economic Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: dreamledger-factory-factory
  cancel-in-progress: false

jobs:
  compile-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Compile Factory-Factory
        run: node BEC-PRIME/runtime/FactoryFactoryLoop.js

      - name: Emit boundary
        run: |
          echo "DISCOVERY=AUTOMATIC"
          echo "COMPILATION=AUTOMATIC"
          echo "EXTERNAL_PUBLICATION=APPROVAL_REQUIRED"
          echo "REVENUE=TRUTH_ORACLE_ONLY"
