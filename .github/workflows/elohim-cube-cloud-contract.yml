name: Elohim Cube Cloud Contract

on:
  pull_request:
    paths:
      - 'BEC-PRIME/cube/CUBE-SILO-FACTORY-CONTRACT.json'
      - 'BEC-PRIME/cube/CUBE-SILO-REGISTRY.json'
      - 'BEC-PRIME/schemas/elohim-beachhead-package.schema.json'
      - 'BEC-PRIME/schemas/elohim-candidate.schema.json'
      - 'BEC-PRIME/scripts/verify-elohim-cube-cloud-contract.js'
      - '.github/workflows/economic-gpu-opportunistic.yml'
      - '.github/workflows/elohim-cube-cloud-contract.yml'
  push:
    branches: [main]
    paths:
      - 'BEC-PRIME/cube/CUBE-SILO-FACTORY-CONTRACT.json'
      - 'BEC-PRIME/cube/CUBE-SILO-REGISTRY.json'
      - 'BEC-PRIME/schemas/elohim-beachhead-package.schema.json'
      - 'BEC-PRIME/schemas/elohim-candidate.schema.json'
      - 'BEC-PRIME/scripts/verify-elohim-cube-cloud-contract.js'
      - '.github/workflows/economic-gpu-opportunistic.yml'
      - '.github/workflows/elohim-cube-cloud-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elohim-cube-cloud-contract
  cancel-in-progress: true

jobs:
  cloud-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Elohim-first cloud and optional GPU contracts
        run: node BEC-PRIME/scripts/verify-elohim-cube-cloud-contract.js
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elohim-cube-cloud-contract-${{ github.run_id }}
          path: BEC-PRIME/PROOF-ELOHIM-CUBE-CLOUD-CONTRACT.json
          if-no-files-found: error
          retention-days: 30
