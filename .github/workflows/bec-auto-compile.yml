name: BEC-PRIME Manual Compiler

# Canonical Release Spine owns production compilation and deployment.
# This workflow is retained as a manual recovery tool only so it cannot
# create duplicate Render builds or six-hour compiler/deploy churn.

on:
  workflow_dispatch:

concurrency:
  group: bec-prime-manual-compile
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Install compiler dependencies
        shell: bash
        run: |
          cd BEC-PRIME
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Compile all BEC-PRIME surfaces
        shell: pwsh
        run: ./BEC-PRIME/scripts/Compile-All.ps1

      - name: Verify generated state and public boundary
        shell: pwsh
        run: |
          $required = @(
            './BEC-PRIME/catalog/compiled/economic-tree.json',
            './BEC-PRIME/compiled/website/economics/index.html',
            './BEC-PRIME/compiled/website/economics/ip-manifest.json',
            './BEC-PRIME/compiled/website/truth-oracle.html',
            './BEC-PRIME/compiled/website/truth-oracle.json',
            './BEC-PRIME/compiled/website/transparency-policy.json',
            './BEC-PRIME/PROOF-ECONOMIC-TREE-COMPILATION.json',
            './BEC-PRIME/PROOF-MTG-CATALOG-COMPILATION.json',
            './BEC-PRIME/proof/TRUTH-ORACLE-PROOF.json',
            './BEC-PRIME/proof/TRUTH-ORACLE-SURFACE-PUBLISH-PROOF.json',
            './BEC-PRIME/RUN-PROOFS/COMPILER-TRUTH-PROOF.json'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Required compiler output missing: $path" }
          }

      - name: Commit generated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BEC-PRIME Compiler"
          git config user.email "bec-prime@users.noreply.github.com"
          git add BEC-PRIME/catalog/compiled BEC-PRIME/compiled/website/economics BEC-PRIME/compiled/website/truth-oracle.html BEC-PRIME/compiled/website/truth-oracle.json BEC-PRIME/compiled/website/transparency-policy.json BEC-PRIME/PROOF-ECONOMIC-TREE-COMPILATION.json BEC-PRIME/PROOF-MTG-CATALOG-COMPILATION.json BEC-PRIME/proof BEC-PRIME/RUN-PROOFS
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: persist BEC-PRIME generated public surfaces"
          git push origin HEAD:main
          echo "Generated state pushed."
