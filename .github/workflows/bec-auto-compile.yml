name: BEC-PRIME Auto Compile DreamLedger

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: bec-prime-compile
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile all BEC-PRIME surfaces
        shell: pwsh
        run: ./BEC-PRIME/scripts/Compile-All.ps1

      - name: Verify generated state
        shell: pwsh
        run: |
          if (-not (Test-Path './BEC-PRIME/catalog/compiled/economic-tree.json')) { throw 'Economic tree was not compiled.' }
          if (-not (Test-Path './BEC-PRIME/compiled/website/economics/index.html')) { throw 'Economic tree public surface was not compiled.' }
          if (-not (Test-Path './BEC-PRIME/PROOF-ECONOMIC-TREE-COMPILATION.json')) { throw 'Economic tree proof missing.' }
          if (-not (Test-Path './BEC-PRIME/RUN-PROOFS')) { throw 'Compilation proof directory missing.' }

      - name: Commit economic-tree state with race-safe push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BEC-PRIME Compiler"
          git config user.email "bec-prime@users.noreply.github.com"
          git add BEC-PRIME/catalog/compiled/economic-tree.json BEC-PRIME/compiled/website/economics/index.html BEC-PRIME/PROOF-ECONOMIC-TREE-COMPILATION.json BEC-PRIME/RUN-PROOFS
          if git diff --cached --quiet; then
            echo "No economic-tree changes."
            exit 0
          fi
          git commit -m "chore: BEC-PRIME auto-compile economic tree [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Generated economic-tree state pushed."
                exit 0
              fi
            else
              git rebase --abort || true
              git reset --hard origin/main
              exit 1
            fi
            sleep 2
          done
          echo "Could not push after 3 race-safe attempts."
          exit 1
