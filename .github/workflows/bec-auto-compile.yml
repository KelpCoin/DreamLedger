name: BEC-PRIME Auto Compile DreamLedger

# Production trigger: generated public surfaces are part of the deploy contract.
# 2026-08-23: explicit retrigger marker after production-truth audit.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'BEC-PRIME/catalog/compiled/**'
      - 'BEC-PRIME/compiled/website/economics/**'
      - 'BEC-PRIME/PROOF-ECONOMIC-TREE-COMPILATION.json'
      - 'BEC-PRIME/RUN-PROOFS/**'
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: bec-prime-compile-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Install compiler dependencies
        shell: bash
        run: |
          cd BEC-PRIME
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Compile all BEC-PRIME surfaces
        shell: pwsh
        run: ./BEC-PRIME/scripts/Compile-All.ps1

      - name: Verify generated state and public boundary
        shell: pwsh
        run: |
          $required = @(
            './BEC-PRIME/catalog/compiled/economic-tree.json',
            './BEC-PRIME/compiled/website/economics/index.html',
            './BEC-PRIME/compiled/website/economics/ip-manifest.json',
            './BEC-PRIME/compiled/website/cinema.html',
            './BEC-PRIME/compiled/website/truth-oracle.html',
            './BEC-PRIME/compiled/website/truth-oracle.json',
            './BEC-PRIME/compiled/website/transparency-policy.json',
            './BEC-PRIME/PROOF-ECONOMIC-TREE-COMPILATION.json',
            './BEC-PRIME/PROOF-MTG-CATALOG-COMPILATION.json',
            './BEC-PRIME/proof/TRUTH-ORACLE-PROOF.json',
            './BEC-PRIME/proof/TRUTH-ORACLE-SURFACE-PUBLISH-PROOF.json',
            './BEC-PRIME/RUN-PROOFS/COMPILER-TRUTH-PROOF.json'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Required compiler output missing: $path" }
          }
          $cinema = Get-Content './BEC-PRIME/compiled/website/cinema.html' -Raw
          if ($cinema -notmatch 'cinema-event-v1') { throw 'Compiled Cinema artifact is missing cinema-event-v1.' }
          $manifest = Get-Content './BEC-PRIME/compiled/website/economics/ip-manifest.json' -Raw | ConvertFrom-Json
          if ($manifest.public_boundary -notmatch 'private implementation paths') { throw 'Public boundary contract is missing private-path protection.' }
          $truth = Get-Content './BEC-PRIME/RUN-PROOFS/COMPILER-TRUTH-PROOF.json' -Raw | ConvertFrom-Json
          if ($truth.verdict -ne 'PASS') { throw 'Compiler truth proof is not PASS.' }

      - name: Scan public tree for obvious secret material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E 'sk_live_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_./+-]+|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY' -- . \
            ':!package-lock.json' \
            ':!BEC-PRIME/scripts/Verify-CompilerTruth.ps1' \
            ':!BEC-PRIME/scripts/test-stripe-webhook-proof.js' \
            ':!BEC-PRIME/scripts/verify-public-boundary.js' \
            ':!BEC-PRIME/scripts/OfferCompiler.js' \
            ':!BEC-PRIME/scripts/Verify-Registry.ps1' \
            ':!scripts/OfferCompiler.js' \
            ':!scripts/Verify-Registry.ps1'; then
            echo 'Potential secret material detected in repository.'
            exit 1
          fi

      - name: Commit generated state without self-trigger loop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BEC-PRIME Compiler"
          git config user.email "bec-prime@users.noreply.github.com"
          git add BEC-PRIME/catalog/compiled/economic-tree.json BEC-PRIME/compiled/website/economics/index.html BEC-PRIME/compiled/website/economics/ip-manifest.json BEC-PRIME/compiled/website/cinema.html BEC-PRIME/compiled/website/truth-oracle.html BEC-PRIME/compiled/website/truth-oracle.json BEC-PRIME/compiled/website/transparency-policy.json BEC-PRIME/PROOF-ECONOMIC-TREE-COMPILATION.json BEC-PRIME/PROOF-MTG-CATALOG-COMPILATION.json BEC-PRIME/proof/TRUTH-ORACLE-PROOF.json BEC-PRIME/proof/TRUTH-ORACLE-SURFACE-PUBLISH-PROOF.json BEC-PRIME/RUN-PROOFS
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: persist BEC-PRIME generated public surfaces"
          git push origin HEAD:main
          echo "Generated state pushed."
