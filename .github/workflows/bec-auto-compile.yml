name: BEC-PRIME Auto Compile DreamLedger

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: bec-prime-compile
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile all BEC-PRIME surfaces
        shell: pwsh
        run: ./BEC-PRIME/scripts/Compile-All.ps1

      - name: Verify generated state
        shell: pwsh
        run: |
          if (-not (Test-Path './BEC-PRIME/catalog/compiled/economic-tree.json')) { throw 'Economic tree was not compiled.' }
          if (-not (Test-Path './BEC-PRIME/compiled/website/economics/index.html')) { throw 'Economic tree public surface was not compiled.' }
          if (-not (Test-Path './BEC-PRIME/PROOF-ECONOMIC-TREE-COMPILATION.json')) { throw 'Economic tree proof missing.' }
          if (-not (Test-Path './BEC-PRIME/PROOF-SILO-PORTFOLIO-COMPILATION.json')) { throw 'Silo portfolio proof missing.' }

      - name: Commit generated state
        shell: bash
        run: |
          git config user.name "BEC-PRIME Compiler"
          git config user.email "bec-prime@users.noreply.github.com"
          git add BEC-PRIME/catalog/compiled BEC-PRIME/compiled/website BEC-PRIME/PROOF-ECONOMIC-TREE-COMPILATION.json BEC-PRIME/PROOF-SILO-PORTFOLIO-COMPILATION.json BEC-PRIME/RUN-PROOFS
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: BEC-PRIME auto-compile DreamLedger [skip ci]"
          git push origin HEAD:main
