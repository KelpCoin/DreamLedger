name: Economic Passport

on:
  push:
    paths:
      - 'BEC-PRIME/economic-passport/**'
      - 'BEC-PRIME/scripts/verify-economic-passport.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/economic-passport.yml'
  pull_request:
    paths:
      - 'BEC-PRIME/economic-passport/**'
      - 'BEC-PRIME/scripts/verify-economic-passport.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/economic-passport.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify Economic Passport
        run: npm run verify:economic-passport
      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: economic-passport-proof
          path: BEC-PRIME/economic-passport/proof/*.json
