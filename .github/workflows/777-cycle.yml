name: 777 Economic Pulse

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/777-cycle.yml"
      - "scripts/777_cycle.py"
      - "scripts/external_demand_transition.py"
      - "data/external-demand-seeds/**"
      - "scripts/procurement_amendment_delta.py"
      - "webapp/pulse/777-manual-probe-2026-10-07.md"

permissions:
  contents: write

concurrency:
  group: 777-cycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate procurement amendment delta
        run: python scripts/procurement_amendment_delta.py
      - name: Generate external demand transition
        run: python scripts/external_demand_transition.py
      - name: Generate economic pulse
        env:
          CTA_URL: ${{ vars.DREAMLEDGER_CTA_URL }}
        run: python scripts/777_cycle.py
      - name: Run cloud Elohim / Gauntlet execution adapter
        env:
          CLOUD_ELOHIM_URL: ${{ vars.CLOUD_ELOHIM_URL }}
          CLOUD_GAUNTLET_URL: ${{ vars.CLOUD_GAUNTLET_URL }}
          VERCEL_AI_GATEWAY_URL: ${{ vars.VERCEL_AI_GATEWAY_URL }}
          VERCEL_AI_MODEL: ${{ vars.VERCEL_AI_MODEL }}
          ELOHIM_FALLBACK_URL: ${{ vars.ELOHIM_FALLBACK_URL }}
          GAUNTLET_FALLBACK_URL: ${{ vars.GAUNTLET_FALLBACK_URL }}
          LM_STUDIO_URL: ${{ vars.LM_STUDIO_URL }}
          LM_STUDIO_MODEL: ${{ vars.LM_STUDIO_MODEL }}
          QUOTE_COMPARE_CHECKOUT: ${{ vars.QUOTE_COMPARE_CHECKOUT }}
        run: node scripts/777_cloud_execution_adapter.js
      - name: Enforce compounding output
        run: python scripts/777_compounding_gate.py
      - name: Commit new pulse if changed
        run: |
          git config user.name "DreamLedger 777"
          git config user.email "777@dreamledger.org"
          git add webapp/pulse webapp/index.html
          if git diff --cached --quiet; then
            echo "No new economic signal."
            exit 0
          fi
          git commit -m "777: publish new economic pulse"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              echo "Rebase failed on attempt $attempt"
              sleep 2
              continue
            }
            if git push origin HEAD:main; then
              echo "PUSH_OK attempt=$attempt"
              exit 0
            fi
            echo "PUSH_RETRY attempt=$attempt"
            sleep 2
          done
          echo "PUSH_FAILED_AFTER_RETRIES"
          exit 1

# 777 execution directive: upscale fresh cycle.
# Objective: MONEY first. If no settlement, return exactly one new durable non-duplicate component.
# Reject repeats: Alfanar, C3-InfraRed, Nova-BMP, Brookfield-ESR, Te Kura HRIS RFI, Google Developer Knowledge API ecosystem, Nylas IAM scoped API keys.
# Agent Bridge lane: test existing monetization rail against existing paid offers; no new SKU.
# HUGE decomposition: select at most 5 bounded jobs from issue #497, rank by economic leverage, execute highest-value job, emit evidence.
# Execution nonce: fresh-cycle-2026-10-09T02:00:00+13:00-NZ-CLOUD-ELOHIM-GAUNTLET-5-FALLBACKS
# R6 hunt: prioritize one externally reachable ordinary buyer/developer/procurement pain signal that can produce the canonical earning unit; money outranks artifact publication.
# META 5X50: after every 5 independently verified purchased decisions, generate exactly 50 new bounded meta-decisions; dedupe against prior decisions; rank by economic leverage; apply only reversible/authorized changes.
# META MODEL ROUTING: prefer cloud HELIum + cloud Gauler MLS when those endpoints are actually configured and reachable. If unavailable, fail closed and do not simulate model execution, purchases, or verification.
# META BOUNDARY: purchased means independently observable settled external purchase tied to a decision outcome. Internal artifacts, self-pay, test payments, traffic, and model outputs do not count.
