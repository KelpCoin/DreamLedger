name: 777 Economic Pulse

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/777-cycle.yml"
      - "scripts/777_cycle.py"
      - "scripts/sync_agent_bridge_catalog.py"
      - "scripts/777_compounding_gate.py"
      - "scripts/external_demand_transition.py"
      - "scripts/777_cloud_execution_adapter.js"
      - "data/external-demand-seeds/**"
      - "scripts/procurement_amendment_delta.py"
      - "webapp/pulse/777-manual-probe-2026-10-07.md"
      - "webapp/index.html"
      - "webapp/phinhaven/index.html"
      - "webapp/agentic-commerce/**"
      - "public/index.html"
      - "marketplace.html"
      - "index.html"

permissions:
  contents: write

concurrency:
  # GitHub retains only one pending run per concurrency group; later pushes otherwise replace queued cycles.
  # Give each expedition its own group. The publish step already retries/rebases and deduplicates concurrent artifacts.
  group: 777-cycle-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh main before generation
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Sync Agent Bridge catalogue snapshot
        run: python scripts/sync_agent_bridge_catalog.py
      - name: Generate procurement amendment delta
        run: python scripts/procurement_amendment_delta.py
      - name: Generate external demand transition
        run: python scripts/external_demand_transition.py
      - name: Generate economic pulse
        env:
          CTA_URL: ${{ vars.DREAMLEDGER_CTA_URL }}
        run: python scripts/777_cycle.py
      - name: Run cloud Elohim / Gauntlet execution adapter
        env:
          CLOUD_ELOHIM_URL: ${{ vars.CLOUD_ELOHIM_URL }}
          CLOUD_GAUNTLET_URL: ${{ vars.CLOUD_GAUNTLET_URL }}
          VERCEL_AI_GATEWAY_URL: ${{ vars.VERCEL_AI_GATEWAY_URL }}
          VERCEL_AI_MODEL: ${{ vars.VERCEL_AI_MODEL }}
          ELOHIM_FALLBACK_URL: ${{ vars.ELOHIM_FALLBACK_URL }}
          GAUNTLET_FALLBACK_URL: ${{ vars.GAUNTLET_FALLBACK_URL }}
          LM_STUDIO_URL: ${{ vars.LM_STUDIO_URL }}
          LM_STUDIO_MODEL: ${{ vars.LM_STUDIO_MODEL }}
          QUOTE_COMPARE_CHECKOUT: ${{ vars.QUOTE_COMPARE_CHECKOUT }}
        run: node scripts/777_cloud_execution_adapter.js
      - name: Stage public artifact candidates for compounding gate
        run: |
          # Some generated public pulse paths may match repository ignore rules.
          # Stage HTML candidates before the gate so it evaluates the exact files the commit step can publish.
          git add -f agent-bridge-catalog.json webapp/pulse/*.html webapp/index.html webapp/phinhaven/index.html public/pulse/*.html
      - name: Enforce compounding output
        run: python scripts/777_compounding_gate.py
      - name: Commit new pulse if changed
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "PUBLISH_SKIPPED_NON_MAIN_REF=$GITHUB_REF"
            exit 0
          fi
          git config user.name "DreamLedger 777"
          git config user.email "777@dreamledger.org"
          git add -f agent-bridge-catalog.json webapp/pulse/* webapp/index.html webapp/phinhaven/index.html public/pulse/*
          if git diff --cached --quiet; then
            echo "No new economic signal."
            exit 0
          fi
          git commit -m "777: publish new economic pulse"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              candidate_files="$(git diff-tree --no-commit-id --name-only -r HEAD -- 'webapp/pulse/*.html')"
              all_candidates_present=true
              if [[ -z "$candidate_files" ]]; then all_candidates_present=false; fi
              while IFS= read -r candidate; do
                [[ -z "$candidate" ]] && continue
                if ! git cat-file -e "origin/main:$candidate" 2>/dev/null; then
                  all_candidates_present=false
                fi
              done <<< "$candidate_files"
              if [[ "$all_candidates_present" == "true" ]]; then
                echo "DUPLICATE_ARTIFACT_ALREADY_PUBLISHED"
                exit 0
              fi
              echo "Rebase failed on attempt $attempt"
              sleep 2
              continue
            fi
            if git push origin HEAD:main; then
              echo "PUSH_OK attempt=$attempt"
              exit 0
            fi
            echo "PUSH_RETRY attempt=$attempt"
            sleep 2
          done
          echo "PUSH_FAILED_AFTER_RETRIES"
          exit 1

# 777 execution directive: money first; if no settlement, produce one new durable, non-duplicate public artifact.
# Agent Bridge lane: test existing monetization rail against existing paid offers; no new SKU.
# META MODEL ROUTING: use cloud Elohim/Gauntlet endpoints only when configured and reachable. Fail closed otherwise.
# META BOUNDARY: internal artifacts, test payments, traffic, and model outputs do not count as revenue.
