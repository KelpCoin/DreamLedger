name: 777 Economic Pulse

on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/777-cycle.yml"
      - "scripts/777_cycle.py"
      - "scripts/sync_agent_bridge_catalog.py"
      - "scripts/777_compounding_gate.py"
      - "scripts/validate_777_long_horizon_task_graph.py"
      - "scripts/publish_777_pulse_to_site.py"
      - "pulse/**"
      - "tests/test_777_compounding_gate_import.py"
      - "scripts/external_demand_transition.py"
      - "scripts/777_cloud_execution_adapter.js"
      - "data/external-demand-seeds/**"
      - "scripts/procurement_amendment_delta.py"
      - "webapp/pulse/777-manual-probe-2026-10-07.md"
      - "webapp/index.html"
      - "webapp/phinhaven/index.html"
      - "webapp/agentic-commerce/**"
      - "pulse/**"
      - "public/index.html"
      - "public/home.html"
      - "public/marketplace.html"
      - "BEC-PRIME/marketplace/marketplace.html"
      - "public/server.js"
      - "public/toll-road.html"
      - "public/agent-bridge.html"
      - "BEC-PRIME/routes/tollRoad.js"
      - "marketplace.html"
      - "index.html"

permissions:
  contents: read

concurrency:
  # GitHub retains only one pending run per concurrency group; later pushes otherwise replace queued cycles.
  # Give each expedition its own group. The publish step already retries/rebases and deduplicates concurrent artifacts.
  group: 777-cycle-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh main before generation
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Test Agent Bridge manifest normalization
        run: python -m unittest tests.test_sync_agent_bridge_catalog
      - name: Validate bounded Agent Bridge long-task contract
        run: |
          python scripts/validate_agent_bridge_long_task_contract.py
          python scripts/validate_777_long_horizon_task_graph.py
      - name: Sync Agent Bridge catalogue snapshot
        run: python scripts/sync_agent_bridge_catalog.py
      - name: Generate procurement amendment delta
        run: python scripts/procurement_amendment_delta.py
      - name: Generate external demand transition
        run: python scripts/external_demand_transition.py
      - name: Generate economic pulse
        env:
          CTA_URL: ${{ vars.DREAMLEDGER_CTA_URL }}
        run: python scripts/777_cycle.py
      - name: Publish source-bound pulse notes to canonical site route
        run: python scripts/publish_777_pulse_to_site.py
      - name: Run cloud Elohim / Gauntlet execution adapter
        env:
          CLOUD_ELOHIM_URL: ${{ vars.CLOUD_ELOHIM_URL }}
          CLOUD_GAUNTLET_URL: ${{ vars.CLOUD_GAUNTLET_URL }}
          VERCEL_AI_GATEWAY_URL: ${{ vars.VERCEL_AI_GATEWAY_URL }}
          VERCEL_AI_MODEL: ${{ vars.VERCEL_AI_MODEL }}
          ELOHIM_FALLBACK_URL: ${{ vars.ELOHIM_FALLBACK_URL }}
          GAUNTLET_FALLBACK_URL: ${{ vars.GAUNTLET_FALLBACK_URL }}
          LM_STUDIO_URL: ${{ vars.LM_STUDIO_URL }}
          LM_STUDIO_MODEL: ${{ vars.LM_STUDIO_MODEL }}
          QUOTE_COMPARE_CHECKOUT: ${{ vars.QUOTE_COMPARE_CHECKOUT }}
        run: node scripts/777_cloud_execution_adapter.js
      - name: Stage public artifact candidates for compounding gate
        run: |
          # Some generated public pulse paths may match repository ignore rules.
          # Stage HTML candidates before the gate so it evaluates the exact files the commit step can publish.
          git add -f agent-bridge-catalog.json webapp/pulse/*.html webapp/index.html webapp/phinhaven/index.html public/pulse/*.html pulse/*.html
      - name: Regression test compounding gate environment binding
        run: python -m unittest discover -s tests -p 'test_777_compounding_gate_import.py'
      - name: Enforce compounding output
        run: python scripts/777_compounding_gate.py
      - name: Preserve generated pulse as a reviewable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 777-economic-pulse-${{ github.run_id }}
          path: |
            agent-bridge-catalog.json
            webapp/pulse/
            webapp/index.html
            webapp/phinhaven/index.html
            public/pulse/
            pulse/
          if-no-files-found: warn
          retention-days: 14

