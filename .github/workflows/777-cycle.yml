name: 777 Compounding Economic Pulse

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dreamledger-777
  cancel-in-progress: true

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run canonical 777 search
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: 777-economic-search.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Note
        run: |
          echo "Canonical 777 search dispatched."
          echo "The existing 777-economic-search.yml remains the authority for discovery, truth guards, commerce handoff, and evidence artifacts."
