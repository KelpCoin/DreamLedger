<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The Shallows — Offline Session Simulator</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; background: #0b1a1f; color: #d8f3ef; }
    h1 { font-size: 1.4rem; color: #4ecdc4; }
    .meta { color: #8ab; font-size: 0.9rem; margin-bottom: 1rem; }
    button { background: #1a4; color: #fff; border: 0; padding: 0.5rem 1rem; margin: 0.25rem 0.25rem 0.25rem 0; border-radius: 4px; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.danger { background: #a33; }
    #log { background: #061014; border: 1px solid #234; padding: 1rem; height: 320px; overflow-y: auto; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.85rem; }
    .bar { margin: 0.75rem 0; }
    .stat { display: inline-block; margin-right: 1rem; }
  </style>
</head>
<body>
  <h1>The Shallows — Offline Session Simulator</h1>
  <p class="meta">
    Air-gapped demo of Floor 1 loop only. Not the production client. Not revenue.
    Rules from design JSON; no server, no Stripe, no auto-trade.
  </p>

  <div class="bar">
    <span class="stat">State: <strong id="state">SANCTUARY</strong></span>
    <span class="stat">HP: <strong id="hp">10</strong></span>
    <span class="stat">Fronds: <strong id="fronds">0</strong></span>
    <span class="stat">Skitters down: <strong id="kills">0</strong></span>
  </div>

  <div class="bar">
    <button id="btnEnter">Enter The Shallows</button>
    <button id="btnExplore" disabled>Explore</button>
    <button id="btnGather" disabled>Gather Frond</button>
    <button id="btnFight" disabled>Fight Skitter</button>
    <button id="btnExit" disabled>Exit Floor</button>
    <button id="btnReset" class="danger">Reset Session</button>
  </div>

  <div id="log"></div>

  <script>
    // Minimal offline loop matching PROOF/airgap design data.
    const CLEAR_FRONDS = 6;
    const CLEAR_KILLS = 5;
    const MAX_HP = 10;
    const SKITTER_DMG = 2;
    const PLAYER_DMG = 3;
    const SKITTER_HP = 8;

    let state = 'SANCTUARY';
    let hp = MAX_HP;
    let fronds = 0;
    let kills = 0;
    let cleared = false;
    let dead = false;

    const el = (id) => document.getElementById(id);
    const log = (msg) => {
      const box = el('log');
      box.textContent += msg + '\n';
      box.scrollTop = box.scrollHeight;
    };
    const refresh = () => {
      el('state').textContent = state;
      el('hp').textContent = hp;
      el('fronds').textContent = fronds;
      el('kills').textContent = kills;
      el('btnEnter').disabled = state !== 'SANCTUARY' || cleared;
      el('btnExplore').disabled = state !== 'EXPLORE';
      el('btnGather').disabled = state !== 'EXPLORE';
      el('btnFight').disabled = state !== 'EXPLORE';
      el('btnExit').disabled = !(state === 'EXPLORE' || state === 'CLEARED');
    };

    function checkClear() {
      if (fronds >= CLEAR_FRONDS || kills >= CLEAR_KILLS) {
        state = 'CLEARED';
        cleared = true;
        log('>>> CLEAR. World response: tide line shifts; path marker near sanctuary.');
        log('(In production this would call authoritative clear + world_state flag.)');
        refresh();
        return true;
      }
      return false;
    }

    el('btnEnter').onclick = () => {
      state = 'EXPLORE';
      log('Entered The Shallows. Kelp fringe. Shallow water. One family of Tide Skitters.');
      refresh();
    };

    el('btnExplore').onclick = () => {
      log('You move through the tidal pools. (Explore tick.)');
      refresh();
    };

    el('btnGather').onclick = () => {
      const got = 1 + Math.floor(Math.random() * 2);
      fronds += got;
      log('Gathered ' + got + ' Kelp Frond(s). Total: ' + fronds + '/' + CLEAR_FRONDS);
      if (!checkClear()) refresh();
    };

    el('btnFight').onclick = () => {
      let ehp = SKITTER_HP;
      log('Engaged Tide Skitter (HP ' + ehp + ').');
      while (ehp > 0 && hp > 0) {
        ehp -= PLAYER_DMG;
        log('  You hit for ' + PLAYER_DMG + '. Skitter HP ' + Math.max(0, ehp));
        if (ehp <= 0) break;
        hp -= SKITTER_DMG;
        log('  Skitter nips for ' + SKITTER_DMG + '. Your HP ' + Math.max(0, hp));
      }
      if (hp <= 0) {
        dead = true;
        state = 'DEATH';
        fronds = 0; // unbanked session loot lost
        log('>>> DEATH. Unbanked fronds lost. Respawn at sanctuary. Cosmetics kept.');
        state = 'SANCTUARY';
        hp = MAX_HP;
        refresh();
        return;
      }
      kills += 1;
      log('Skitter down. Kills: ' + kills + '/' + CLEAR_KILLS);
      if (!checkClear()) refresh();
    };

    el('btnExit').onclick = () => {
      state = 'SANCTUARY';
      log('Exited floor. Session safe state kept locally (demo only).');
      refresh();
    };

    el('btnReset').onclick = () => {
      state = 'SANCTUARY';
      hp = MAX_HP;
      fronds = 0;
      kills = 0;
      cleared = false;
      dead = false;
      el('log').textContent = '';
      log('Session reset. Offline demo ready.');
      refresh();
    };

    log('Offline The Shallows simulator ready. Enter when ready.');
    refresh();
  </script>
</body>
</html>
