<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamLedger account</title><style>:root{--bg:#090a0d;--panel:#111317;--line:#292d35;--ink:#f5f7f8;--muted:#929aa6;--accent:#f2c14e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px 16px 70px}a{color:inherit}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.avatar{width:210px;height:270px;margin:auto;position:relative}.head{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:var(--head);height:var(--head);border-radius:50%;background:var(--skin);border:3px solid #222}.body{position:absolute;top:125px;left:50%;transform:translateX(-50%);width:var(--body);height:125px;border-radius:45px 45px 18px 18px;background:#394b63}.label{font-weight:900}.range{width:100%}input[type=range]{width:100%}select,input[type=text]{width:100%;padding:11px;background:#0b0d10;border:1px solid var(--line);border-radius:9px;color:#fff}.row{margin:15px 0}.button{display:inline-block;padding:12px 15px;border-radius:10px;background:var(--accent);color:#111;font-weight:900;border:0}.muted{color:var(--muted)}.locked{opacity:.65}.cosmetics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.cosmetic{padding:12px;border:1px solid var(--line);border-radius:12px}.price{font-weight:900;color:var(--accent)}</style></head><body><main><p><a href="/">DREAMLEDGER</a></p><div id="loading">Loading account...</div><div id="app" hidden><h1>Account</h1><div class="grid"><section class="box"><h2>Profile</h2><p><strong id="name"></strong></p><p class="muted" id="email"></p><p><a class="button" href="/sell.html">Sell something</a></p><h2>Optional avatar</h2><div class="avatar" id="avatar"><div class="head"></div><div class="body"></div></div><div class="row"><div class="label">Height</div><input id="height" class="range" type="range" min="0" max="4" value="2"></div><div class="row"><div class="label">Body size</div><input id="build" class="range" type="range" min="0" max="4" value="2"></div><div class="row"><div class="label">Skin tone</div><input id="skin" class="range" type="range" min="0" max="9" value="5"></div><button class="button" id="saveAvatar">Save avatar</button><p class="muted">The base face/body/height/skin controls are free. Cosmetic extras are paid.</p></section><section class="box"><h2>Cosmetics</h2><p class="muted">Optional paid customization. The basic avatar remains free.</p><div id="cosmetics" class="cosmetics"></div><h2>My listings</h2><div id="listings" class="muted">Loading...</div></section></div></div></main><script>const skinColors=['#f5d0b5','#e9b18f','#d99672','#c77d5d','#a95f45','#8b4d38','#6f3d2d','#542f25','#3b241d','#251812'];const sizes=[70,82,96,112,130];const heights=[58,70,82,94,108];function renderAvatar(){const a=document.getElementById('avatar');a.style.setProperty('--skin',skinColors[+skin.value]);a.style.setProperty('--head',heights[+height.value]+'px');a.style.setProperty('--body',sizes[+build.value]+'px')}[height,build,skin].forEach(x=>x.addEventListener('input',renderAvatar));async function load(){const r=await fetch('/api/dreamiez/me',{cache:'no-store'});if(!r.ok){location.href='/login.html?next=/account.html';return}const d=await r.json(),a=d.account;document.getElementById('loading').hidden=true;document.getElementById('app').hidden=false;document.getElementById('name').textContent=a.name||'Dreamer';document.getElementById('email').textContent=(a.email||'')+(a.email_verified?' - verified':' - email not verified');height.value=a.avatar?.height??2;build.value=a.avatar?.build??2;skin.value=a.avatar?.skin??5;renderAvatar();const cr=await fetch('/api/dreamiez/cosmetics'),items=await cr.json();document.getElementById('cosmetics').innerHTML=(Array.isArray(items)?items:[]).map(c=>'<div class="cosmetic '+(c.price_nzd?'locked':'')+'"><strong>'+escapeHtml(c.name)+'</strong><div class="price">'+(c.price_nzd?'NZ$'+c.price_nzd:'FREE')+'</div><div class="muted">'+(c.price_nzd?'Paid cosmetic':'Earned/free')+'</div></div>').join('');const lr=await fetch('/api/marketplace/my-listings'),ld=await lr.json();document.getElementById('listings').innerHTML=Array.isArray(ld.items)&&ld.items.length?ld.items.map(x=>'<p><strong>'+escapeHtml(x.title)+'</strong> - '+escapeHtml(x.status)+' - NZ$'+escapeHtml(x.price)+'</p>').join(''):'No listings yet.'}document.getElementById('saveAvatar').onclick=async()=>{const r=await fetch('/api/dreamiez/avatar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({height:+height.value,build:+build.value,skin:+skin.value})});const d=await r.json().catch(()=>({}));alert(r.ok?'Avatar saved.':(d.error||'Unable to save avatar.'))};function escapeHtml(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]||c))}load();</script></body></html>
