<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create DreamLedger account</title><style>body{margin:0;background:#090a0d;color:#f5f7f8;font:16px/1.5 system-ui,sans-serif}main{max-width:620px;margin:auto;padding:32px 18px 70px}a{color:inherit}label{display:block;margin-top:16px;font-weight:800}input{width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border-radius:10px;border:1px solid #343943;background:#111317;color:#fff}button{margin-top:20px;padding:13px 17px;border:0;border-radius:10px;background:#f2c14e;font-weight:900;cursor:pointer}.box{background:#111317;border:1px solid #292d35;border-radius:18px;padding:22px}.msg{margin-top:16px;color:#f2c14e}.err{color:#ffb4b4}.links{margin-top:18px;color:#aab1bc}</style></head><body><main><p><a href="/">DREAMLEDGER</a></p><h1>Create your account</h1><div class="box"><p>Create a normal DreamLedger account. Dreamiez is optional and is not required to register or log in.</p><form id="f"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Display name<input id="name" required maxlength="60" autocomplete="name"></label><label>Password<input id="password" type="password" required minlength="8" autocomplete="new-password"></label><button id="b">Create account</button></form><div id="msg" class="msg" role="alert"></div></div><div class="links">Already registered? <a href="/login.html">Log in</a></div></main><script>const next=new URLSearchParams(location.search).get('next')||'/account.html',f=document.getElementById('f'),b=document.getElementById('b'),msg=document.getElementById('msg');f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;msg.className='msg';msg.textContent='Creating account...';try{const r=await fetch('/api/account/register',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},credentials:'same-origin',body:JSON.stringify({email:document.getElementById('email').value.trim(),name:document.getElementById('name').value.trim(),password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Unable to create account.');const check=await fetch('/api/account/me',{credentials:'same-origin',cache:'no-store'}),session=await check.json().catch(()=>({}));if(!session.authenticated)throw new Error('Account created but the session cookie was not retained.');msg.textContent='Account created. Redirecting...';setTimeout(()=>location.replace(next),250)}catch(x){msg.className='msg err';msg.textContent=x.message}finally{b.disabled=false}});</script></body></html>
